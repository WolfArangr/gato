<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gambito — Ajedrez Tower Defense</title>
<style>
:root{
  --bg:#16130f; --panel:#211c16; --panel2:#2b241c; --line:#3d3429; --ink:#f4ede0; --muted:#b9ad97;
  --gold:#e8b64c; --gold2:#ffd77a; --red:#e45b45; --blue:#86b9ec; --green:#86c98a; --violet:#c9a2ff;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:radial-gradient(120% 70% at 50% 40%,#231d16 0%,var(--bg) 70%)}

#hud{display:flex;align-items:center;gap:6px;padding:calc(8px + var(--safe-t)) 10px 8px;min-height:56px}
.stat{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 9px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;line-height:1;transition:transform .15s}
.stat svg{width:16px;height:16px;flex:none}
.stat small{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat.bump{transform:scale(1.12)}
.stat.hurt{animation:hurt .45s}
@keyframes hurt{0%,100%{background:var(--panel)}30%{background:#6b2018}}
#hud .sp{flex:1}
.ib{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.ib svg{width:20px;height:20px}
.ib:active{transform:scale(.94)}
#modeTag{font-size:10px;font-weight:900;letter-spacing:.08em;color:#1b130a;background:var(--gold);border-radius:6px;padding:3px 5px;display:none}
#modeTag.on{display:block}
#modeTag.hard{background:var(--red);color:#fff}
#modeTag.daily{background:var(--blue);color:#0f1b28}

#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:rgba(20,16,12,.92);border:1px solid var(--line);color:var(--ink);font-size:13px;line-height:1.35;padding:8px 12px;border-radius:12px;text-align:center;pointer-events:none;transition:opacity .3s;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#hint b{color:var(--gold2)}
#hint:empty{opacity:0}
#toast{position:absolute;left:50%;bottom:10px;transform:translate(-50%,10px);background:#3a1712;border:1px solid #7a3326;color:#ffd9d1;font-size:13px;font-weight:600;padding:8px 14px;opacity:0;pointer-events:none;transition:.2s;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.35;border-radius:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.good{background:#2f2810;border-color:#7a6326;color:#ffe7a8}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#banner .in{text-align:center;opacity:0;transform:scale(.92);transition:opacity .35s,transform .35s;background:rgba(16,13,10,.88);border:1px solid var(--line);padding:16px 22px;border-radius:18px;max-width:86%}
#banner.on .in{opacity:1;transform:none}
#banner h2{margin:0;font-family:var(--serif);font-size:32px;letter-spacing:.05em;font-weight:700}
#banner p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
#banner .tag{display:inline-block;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.14em;color:#1b130a;background:var(--gold);padding:3px 8px;border-radius:6px}
#banner .tag.bad{background:var(--red);color:#fff}
#boss{position:absolute;left:14px;right:14px;top:8px;display:none;pointer-events:none}
#boss.on{display:block}
#boss .nm{font-family:var(--serif);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#ffcbc1;text-align:center;margin-bottom:4px;text-shadow:0 1px 2px #000}
#boss .bar{height:8px;border-radius:6px;background:#2a1410;border:1px solid #6a2a20;overflow:hidden}
#boss .fill{height:100%;background:linear-gradient(90deg,#b73a28,#ff7a5c);width:100%;transition:width .15s}

#dock{padding:0 10px calc(10px + var(--safe-b));display:flex;flex-direction:column;gap:8px}
#strip{display:flex;align-items:center;gap:6px;height:54px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
#skills{display:flex;gap:5px;flex:none}
.skb{position:relative;width:44px;height:44px;border-radius:50%;padding:3px;background:conic-gradient(var(--blue) 360deg,#3a3228 0);flex:none}
.skb span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--panel2);color:var(--muted)}
.skb svg{width:19px;height:19px}
.skb.ready span{background:var(--blue);color:#0f1b28}
.skb.arm span{background:var(--gold);color:#24170a}
.skb.arm{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(232,182,76,.3)}}
#preview{flex:1;display:flex;gap:4px;overflow:hidden;align-items:center;min-width:0;padding-left:4px}
#preview .wl{font-size:9px;font-weight:900;color:var(--muted);letter-spacing:.06em;flex:none;line-height:1.1;text-align:center}
#preview .wl b{display:block;color:var(--ink);font-size:14px}
.pv{display:flex;align-items:center;font-size:11px;font-weight:700;color:var(--ink);flex:none}
.pv canvas{width:22px;height:22px}
.pv .new{margin-left:2px;font-size:7px;font-weight:900;background:var(--gold);color:#1b130a;padding:1px 2px;border-radius:3px}
#go{height:44px;min-width:84px;padding:0 12px;border-radius:11px;background:linear-gradient(#f0c35c,#d69a2c);color:#24170a;font-weight:900;font-size:14px;box-shadow:0 2px 0 #8a5e17,inset 0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;gap:5px;flex:none}
#go:active{transform:translateY(1px);box-shadow:0 1px 0 #8a5e17}
#go.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 2px 0 #8a5e17,0 0 0 6px rgba(232,182,76,.25)}}
#go[disabled]{background:#3a3228;color:var(--muted);box-shadow:none;animation:none}
#go small{font-weight:700;opacity:.8;font-size:11px}
#tray{height:104px;position:relative}
#shop{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;height:100%}
.sb{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;transition:transform .1s,border-color .15s,background .15s;padding:4px 0}
.sb canvas{width:44px;height:44px;pointer-events:none}
.sb .n{font-size:11px;font-weight:700;color:var(--muted);pointer-events:none}
.sb .c{font-size:13px;font-weight:800;display:flex;align-items:center;gap:3px;pointer-events:none;font-variant-numeric:tabular-nums}
.sb .c i,.coin{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a8,#d9a032 60%,#9b6a14);display:inline-block}
.gl{width:10px;height:10px;display:inline-block;background:var(--violet);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.sb.sel{border-color:var(--gold);background:#3a2f1d;transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.sb.poor{opacity:.42}
.sb:active{transform:scale(.96)}
#sheet{position:absolute;inset:0;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
#sheet.foe{border-color:#7a3326}
#sheet.hy{border-color:var(--violet)}
#sheet[hidden],#shop[hidden]{display:none}
.sh-top{display:flex;align-items:center;gap:8px;min-height:0}
.sh-top canvas{width:40px;height:40px;flex:none}
.sh-info{flex:1;min-width:0}
.sh-name{font-family:var(--serif);font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.sh-name em{font-family:var(--sans);font-style:normal;font-size:11px;color:var(--violet);font-weight:700}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.sh-stats{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-stats b{color:var(--ink)}
.sh-x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex:none}
.sh-x svg{width:16px;height:16px}
.sh-act{display:flex;gap:6px;flex:1;min-height:0}
.ab{flex:1;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-height:44px;padding:0 4px;min-width:0}
.ab small{font-weight:700;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;white-space:nowrap}
.ab.up{background:linear-gradient(#3b5a3a,#2c4630);border-color:#4d7a4b}
.ab.sell{background:#3a221b;border-color:#5e3326;flex:.7}
.ab.pro{background:linear-gradient(#5a4a22,#3b3016);border-color:#8a6d2a;flex-direction:row;gap:3px}
.ab.pro canvas{width:24px;height:24px}
.ab.asc{background:linear-gradient(#4a3466,#2e2142);border-color:#7a5aa6;flex-direction:row;gap:5px;font-size:12px;text-align:left}
.ab.asc canvas{width:30px;height:30px;flex:none}
.ab.asc span{display:flex;flex-direction:column;min-width:0}
.ab.note{font-weight:600;color:var(--muted);font-size:12px;padding:0 10px;text-align:center}
.ab[disabled]{opacity:.4}
.ab:active{transform:scale(.97)}

.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,8,6,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px}
.ov.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100% - 10px);overflow:auto}
.card h1{font-family:var(--serif);font-size:28px;margin:0 0 6px;letter-spacing:.04em}
.card p{color:var(--muted);margin:0 0 14px;line-height:1.45;font-size:14px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:14px;font-weight:800;font-size:16px;background:var(--panel2);border:1px solid var(--line);margin-top:10px}
.btn.pri{background:linear-gradient(#f0c35c,#d69a2c);color:#24170a;border:0;box-shadow:0 3px 0 #8a5e17}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:10px}.row .btn{flex:1;font-size:15px}
#title{background:radial-gradient(100% 60% at 50% 30%,#2b2219,#0e0c09);backdrop-filter:none}
#title .card{background:transparent;border:0;box-shadow:none}
.logo{font-family:var(--serif);font-size:clamp(40px,13vw,60px);font-weight:700;letter-spacing:.12em;margin:6px 0 0;line-height:1;background:linear-gradient(#fff6df,#e8b64c);-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:.12em}
.sub{font-size:12px;font-weight:800;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin:10px 0 16px}
#titleArt{width:100%;max-width:340px;height:120px;display:block;margin:0 auto}
.best{font-size:13px;color:var(--muted);margin-top:14px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.best b{color:var(--ink)}
.glory{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--violet)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.stats div{background:var(--panel2);border-radius:12px;padding:10px 2px}
.stats b{display:block;font-size:20px;font-family:var(--serif)}
.stats span{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#help .card,#setup .card,#armory .card{text-align:left}
#help h1,#setup h1,#armory h1{text-align:center}
.hs{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin:16px 0 8px;text-align:left;display:flex;justify-content:space-between}
.hs span{color:var(--muted);letter-spacing:.04em}
.rule{display:flex;gap:10px;font-size:14px;line-height:1.45;color:var(--ink);margin-bottom:8px}
.rule i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel2);color:var(--gold);font-style:normal;font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:1px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pg div{background:var(--panel2);border-radius:12px;padding:8px 4px 6px;text-align:center;font-size:12px;font-weight:700}
.pg canvas{width:72px;height:72px;display:block;margin:0 auto 4px}
.pg small{display:block;color:var(--muted);font-weight:600;font-size:10.5px;line-height:1.3;margin-top:2px}
.el{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px;line-height:1.35}
.el canvas{width:34px;height:34px;flex:none}
.el b{display:block;font-size:14px}
.el span{color:var(--muted)}
.tgl{display:flex;justify-content:space-between;align-items:center;height:52px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-top:10px;padding:0 16px;font-weight:700;width:100%}
.tgl em{font-style:normal;color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.opt canvas{width:100%;max-width:96px;height:48px;border-radius:6px}
.opt.on{border-color:var(--gold);background:#3a2f1d}
#setPrev{width:100%;height:150px;border-radius:12px;display:block;margin-top:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segb{height:48px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.segb small{font-size:10px;color:var(--muted);font-weight:700}
.segb.on{border-color:var(--gold);background:#3a2f1d}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oc{position:relative;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:9px 10px;text-align:left;display:flex;gap:8px;align-items:flex-start;min-height:64px}
.oc canvas{width:34px;height:34px;flex:none}
.oc .tx{min-width:0;flex:1}
.oc b{display:block;font-size:13.5px;line-height:1.2}
.oc small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3;margin-top:2px;font-weight:500}
.oc.on{border-color:var(--gold);background:#3a2f1d}
.oc.lock{opacity:.6;padding-right:46px}
.oc .lk{position:absolute;top:6px;right:8px;font-size:11px;font-weight:800;color:var(--violet);display:flex;align-items:center;gap:3px}
.oc .ck{position:absolute;top:6px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#24170a;font-size:12px;font-weight:900;display:grid;place-items:center}
.oc .ic{width:34px;height:34px;border-radius:50%;background:#1a1612;display:grid;place-items:center;flex:none;color:var(--blue)}
.oc .ic svg{width:18px;height:18px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 4px}
.tab{height:40px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:12px;padding:0 2px}
.tab.on{border-color:var(--violet);color:var(--violet)}
.buy{margin-top:6px;height:32px;border-radius:9px;background:linear-gradient(#5d4580,#3d2c57);border:1px solid #7a5aa6;font-weight:800;font-size:12px;padding:0 10px;display:inline-flex;align-items:center;gap:5px}
.buy[disabled]{opacity:.45}
.own{margin-top:6px;font-size:11px;font-weight:800;color:var(--green);letter-spacing:.08em}
.gtop{display:flex;justify-content:center;margin-bottom:4px}
.gpill{display:inline-flex;align-items:center;gap:6px;background:#2a2036;border:1px solid #5d4580;border-radius:999px;padding:6px 12px;font-weight:800;color:var(--violet);font-variant-numeric:tabular-nums}
#boonList{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.bc{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:72px}
.bc:active{transform:scale(.98)}
.bc .bi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#1a1612;color:var(--gold);font-family:var(--serif);font-size:20px;font-weight:700;flex:none}
.bc b{display:block;font-size:15px}
.bc small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.bc .st{color:var(--gold);font-size:11px;font-weight:800;margin-left:6px}
.boonsOwned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 2px}
.boonsOwned span{font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted)}
#help,#settings,#armory{z-index:30}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat" id="hpS"><svg viewBox="0 0 24 24" fill="none" stroke="#e45b45" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 18 4.5 7l4.5 4 3-6 3 6 4.5-4L21 18z" fill="#e45b45" fill-opacity=".25"/><path d="M3 21h18"/></svg><span id="hp">25</span></div>
    <div class="stat" id="goldS"><i class="coin" style="width:14px;height:14px"></i><span id="gold">0</span></div>
    <div class="stat"><small id="waveLbl">Oleada</small><span id="wave">0/20</span></div>
    <div class="sp"></div>
    <span id="modeTag"></span>
    <button class="ib" id="spdBtn">1×</button>
    <button class="ib" id="pauseBtn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="boss"><div class="nm" id="bossName"></div><div class="bar"><div class="fill" id="bossFill"></div></div></div>
    <div id="hint"></div>
    <div id="banner"><div class="in"><h2 id="bT"></h2><p id="bS"></p></div></div>
    <div id="toast"></div>
  </div>
  <div id="dock">
    <div id="strip">
      <div id="skills"></div>
      <div id="preview"></div>
      <button id="go"></button>
    </div>
    <div id="tray">
      <div id="shop"></div>
      <div id="sheet" hidden></div>
    </div>
  </div>
</div>

<div class="ov on" id="title"><div class="card">
  <canvas id="titleArt"></canvas>
  <div class="logo" data-t="logo"></div>
  <div class="sub" data-t="tagSub"></div>
  <p data-t="tagline"></p>
  <button class="btn pri" id="playBtn" data-t="play"></button>
  <div class="row"><button class="btn" id="armBtn" data-t="armory" data-gl="1"></button><button class="btn" id="setBtn" data-t="piecesBoard"></button></div>
  <button class="btn" id="howBtn" data-t="howTo"></button>
  <button class="tgl" id="langBtn"><span data-t="language"></span><em data-t="langName"></em></button>
  <div class="best" id="bestT"></div>
</div></div>

<div class="ov" id="setup"><div class="card">
  <h1 data-t="council"></h1>
  <div class="gtop"><span class="gpill"><span class="gl"></span><span id="gl1">0</span> <span data-t="glory"></span></span></div>
  <div class="hs"><span style="color:var(--gold)" data-t="mode"></span><span id="modeBest"></span></div>
  <div class="seg" id="modeSeg"></div>
  <div class="hs" data-t="opening"></div>
  <div class="cards" id="openList"></div>
  <div class="hs"><span style="color:var(--gold)" data-t="skills"></span><span id="slotInfo"></span></div>

  else if(e.type==='K')D8.forEach(m=>{if(free(r+m[0],c+m[1]))opts.push({r:r+m[0],c:c+m[1]})});

/* ================= update ================= */
function update(dt){
  G.clock+=dt;
  for(const s of G.skills)if(G.skCd[s]>0)G.skCd[s]=Math.max(0,G.skCd[s]-dt);
  if(G.freeze>0)G.freeze-=dt;if(G.checkT>0)G.checkT-=dt;if(G.tempoT>0)G.tempoT-=dt;
  while(G.queue.length&&G.queue[0].at<=G.clock){const q=G.queue[0];if(spawn(q.type,q.w))G.queue.shift();else{q.at=G.clock+.25;break}}
  for(const e of G.enemies){
    if(e.dead)continue;if(e.flash>0)e.flash-=dt;e.born+=dt;e.acd-=dt;e.lunge=Math.max(0,e.lunge-dt*5);
    if(e.stun>0){e.stun-=dt;continue}
    if(e.type==='K'&&e.boss&&!e.moving){e.sum-=dt;if(e.sum<=0){e.sum=5;const p=spawn('P',e.w);if(p){G.rem[e.w]++;p.hp=p.maxHp=Math.round(p.maxHp*.6);G.fx.push({k:'ring',x:e.x+.5,y:e.y+.5,life:.4,max:.4,col:'rgba(228,91,69,.8)',r:.8})}}}
    if(e.moving){e.t+=dt/e.dur;if(e.t>=1)arrive(e)}
    else{e.wait-=dt;if(e.wait<=0){think(e);if(G.state!=='play')return}}

function enemyAt(cell){let best=null,bd=1;for(const e of G.enemies){const d=Math.max(Math.abs(e.x-cell.c),Math.abs(e.y-cell.r));if(d<.6&&d<bd){bd=d;best=e}}return best}

  if(!cell){G.ghost=null;return}
  G.ghost=cell;const k=canPlace(cell.r,cell.c),c=shopCost(G.shop);G.ghostOk=k.ok&&G.gold>=c;
  G.ghostWhy=k.ok?(G.gold<c?needGold(c-G.gold):''):k.why;

  if(!down||G.state!=='play'||G.paused)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y)>14;down=null;if(moved)return;
  const cell=cellAt(e.clientX,e.clientY);
  if(G.pending){const id=G.pending;if(!cell){G.pending=null;ui();return}if(doSkill(id,cell)){G.skCd[id]=SK[id].cd*M.skillCd;G.pending=null}ui();return}
  const tw=cell?wgrid[idx(cell.r,cell.c)]:null;
  if(!G.shop&&G.sel&&!G.sel.isKing&&cell&&!tw){const mv=movesFor(G.sel).find(m=>m.r===cell.r&&m.c===cell.c);if(mv){doMove(G.sel,mv);return}}
  const foe=cell&&!tw?enemyAt(cell):null;
  if(G.shop){
    if(tw||foe){G.shop=null;G.ghost=null;G.sel=tw;G.selE=foe;AU.play('tap');ui();return}
    if(!cell){G.shop=null;setGhost(null);ui();return}
    if(G.ghost&&G.ghost.r===cell.r&&G.ghost.c===cell.c){if(!place(G.shop,cell.r,cell.c))setGhost(cell)}
    else{setGhost(cell);if(!G.ghostOk&&G.ghostWhy){toast(G.ghostWhy);AU.play('err')}else AU.play('tap')}
    ui();return;
  }
  if(tw){G.sel=G.sel===tw?null:tw;G.selE=null;AU.play('tap')}
  else if(foe){G.selE=G.selE===foe?null:foe;G.sel=null;AU.play('tap')}
  else{G.sel=null;G.selE=null}

/* ---------- armory ---------- */
let armTab='skills';
function affordable(){let n=0;for(const k in SK)if(!PROF.skills[k]&&SK[k].cost<=PROF.glory)n++;for(const k in OPEN)if(!PROF.open[k]&&OPEN[k].cost<=PROF.glory)n++;for(const k in HYD)if(!PROF.asc[k]&&HYD[k][9]<=PROF.glory)n++;for(const k in PERKS){const l=PROF.perks[k]||0;if(l<PERKS[k].costs.length&&PERKS[k].costs[l]<=PROF.glory)n++}return n}
function openArmory(tab){armTab=tab||armTab;$('#armory').classList.add('on');buildArmory()}
function buildArmory(){
  $('#gl2').textContent=PROF.glory;
  const tabs={skills:['Skills','Habilidades'],open:['Openings','Aperturas'],asc:['Ascend','Ascensos'],perks:['Perks','Mejoras']};
  $('#armTabs').innerHTML=Object.entries(tabs).map(([k,n])=>`<button class="tab${armTab===k?' on':''}" data-t="${k}">${L(n)}</button>`).join('');
  $('#armTabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{armTab=b.dataset.t;AU.play('tap');buildArmory()});
  const items=[];
  if(armTab==='skills')for(const k in SK)items.push({k,name:L(SK[k].name),desc:`${L(SK[k].desc)} ${L([`${SK[k].cd}s cooldown.`,`Recarga: ${SK[k].cd} s.`])}`,cost:SK[k].cost,owned:PROF.skills[k],icon:`<span class="ic">${svgIc(SK[k].ic)}</span>`});
  if(armTab==='open')for(const k in OPEN)items.push({k,name:L(OPEN[k].name),desc:`${L(OPEN[k].desc)} ${goldTxt(OPEN[k].gold)}`,cost:OPEN[k].cost,owned:PROF.open[k]});
  if(armTab==='asc')for(const k in HYD){const h=HYD[k];items.push({k,name:L(h[0]),desc:L([`${h[1][0]} · ${h[8]} gold to ascend`,`${h[1][1]} · ascender cuesta ${h[8]} de oro`]),cost:h[9],owned:PROF.asc[k],cv:k})}
  if(armTab==='perks')for(const k in PERKS){const p=PERKS[k],l=PROF.perks[k]||0;items.push({k,name:`${L(p.name)}${p.costs.length>1?` ${ROMAN[l]||''}`:''}`,desc:`${L(p.desc)} ${L(['Level','Nivel'])} ${l}/${p.costs.length}.`,cost:p.costs[l],owned:l>=p.costs.length})}
  $('#armList').innerHTML=items.map(o=>`<div class="oc${o.owned?' on':''}">${o.cv?`<canvas data-cv="${o.cv}"></canvas>`:o.icon||''}<span class="tx"><b>${o.name}</b><small>${o.desc}</small>${o.owned?`<div class="own">${L(['OWNED','ADQUIRIDO'])}</div>`:`<button class="buy" data-k="${o.k}" ${o.cost>PROF.glory?'disabled':''}><span class="gl"></span>${o.cost}</button>`}</span></div>`).join('');
  $('#armList').querySelectorAll('canvas[data-cv]').forEach(c=>iconCanvas(c,c.dataset.cv,true,34));
  $('#armList').querySelectorAll('.buy').forEach(b=>b.onclick=()=>{const k=b.dataset.k;let cost;
    if(armTab==='skills'){cost=SK[k].cost;if(PROF.glory<cost)return;PROF.skills[k]=1;if(PROF.loadout.length<slots())PROF.loadout.push(k)}
    else if(armTab==='open'){cost=OPEN[k].cost;if(PROF.glory<cost)return;PROF.open[k]=1}
    else if(armTab==='asc'){cost=HYD[k][9];if(PROF.glory<cost)return;PROF.asc[k]=1}
    else{const l=PROF.perks[k]||0;cost=PERKS[k].costs[l];if(PROF.glory<cost)return;PROF.perks[k]=l+1}
    PROF.glory-=cost;saveProf();AU.init();AU.play('buy');buildArmory();if($('#setup').classList.contains('on'))buildSetup();if($('#over').classList.contains('on'))fillOver()});
}
$('#armClose').addEventListener('click',()=>{$('#armory').classList.remove('on');G.sheetKey='';if($('#setup').classList.contains('on'))buildSetup();else if($('#title').classList.contains('on'))toTitle()});

/* ---------- settings ---------- */
function prevCanvas(c,w,h,fn){const d=Math.min(3,window.devicePixelRatio||1);c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);fn(x)}
function buildSettings(){
  const sl=$('#setList'),bl=$('#boardList');sl.innerHTML='';bl.innerHTML='';
  SETS.forEach(([k,name])=>{const b=document.createElement('button');b.className='opt'+(SET.piece===k?' on':'');b.setAttribute('aria-pressed',SET.piece===k);const c=document.createElement('canvas');b.appendChild(c);b.insertAdjacentHTML('beforeend',L(name));sl.appendChild(b);
    prevCanvas(c,96,48,x=>{drawBoard(x,0,0,48,1,2,BOARDS[SET.board],false);drawPiece(x,'N',24,25,44,true,{set:k});drawPiece(x,'Q',72,25,44,false,{set:k,flip:true})});
    b.addEventListener('click',()=>{SET.piece=k;store.set('pieces',k);AU.init();AU.play('tap');buildSettings();refreshIcons()})});
  Object.entries(BOARDS).forEach(([k,B])=>{const b=document.createElement('button');b.className='opt'+(SET.board===k?' on':'');b.setAttribute('aria-pressed',SET.board===k);const c=document.createElement('canvas');b.appendChild(c);b.insertAdjacentHTML('beforeend',L(B.name));bl.appendChild(b);
    prevCanvas(c,96,48,x=>{x.fillStyle=B.fr;x.fillRect(0,0,96,48);drawBoard(x,8,4,20,2,4,B,false)});
    b.addEventListener('click',()=>{SET.board=k;store.set('board',k);AU.init();AU.play('tap');buildSettings();drawTitle()})});
  const pc=$('#setPrev');const w=pc.clientWidth||340;
  prevCanvas(pc,w,150,x=>{const B=BOARDS[SET.board];x.fillStyle=B.fr;x.fillRect(0,0,w,150);const s=Math.min((w-8)/6,(150-8)/3),x0=(w-s*6)/2,y0=(150-s*3)/2;drawBoard(x,x0,y0,s,3,6,B,false);
    ['R','N','B','Q','K','P'].forEach((t,i)=>drawPiece(x,t,x0+s*i+s/2,y0+s*.5,s*.9,false,{flip:true}));
    ['PN','BK','QN','K','NB','RN'].forEach((t,i)=>drawPiece(x,t,x0+s*i+s/2,y0+s*2.5,s*.9,true))});
}
const openSettings=()=>{$('#settings').classList.add('on');buildSettings()};
$('#setBtn').addEventListener('click',openSettings);$('#setBtn2').addEventListener('click',openSettings);
$('#setClose').addEventListener('click',()=>{$('#settings').classList.remove('on');G.sheetKey='';helpSet='';ui()});

function drawTitle(){
  const c=$('#titleArt');const w=340,h=120,d=Math.min(3,window.devicePixelRatio||1);c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);
  const s=w/8,B=BOARDS[SET.board];for(let i=0;i<8;i++){x.fillStyle=i%2?B.d:B.l;x.fillRect(i*s,h-s*.9,s,s*.9)}
  ['RN','N','B','Q','K','B','N','R'].forEach((t,i)=>drawPiece(x,t,i*s+s/2,h-s*.9-s*.05,s*.98,true));
  [1,4,7].forEach(i=>drawPiece(x,'P',i*s+s/2,h-s*1.9,s*.8,false,{flip:true,alpha:.9}));
}
let helpSet='';
function buildHelp(){
  const key=SET.piece+SET.board+LANG;if(helpSet===key)return;helpSet=key;
  $('#rules').innerHTML=RULES.map((r,i)=>`<div class="rule"><i>${i+1}</i><div>${L(r)}</div></div>`).join('');
  const pg=$('#patterns');pg.innerHTML='';const B=BOARDS[SET.board];
  ['P','N','B','R','Q','K','RN','NB','QN'].forEach(t=>{const d=document.createElement('div');const c=document.createElement('canvas');d.appendChild(c);
    d.insertAdjacentHTML('beforeend',`${L(TD[t].name)}${TD[t].cost?` · <span style="color:var(--gold)">${TD[t].cost}</span>`:''}<small>${TD[t].hy?L(TD[t].alias):L(TD[t].line)}</small>`);pg.appendChild(d);
    const S=72,n=7,s2=S/n;prevCanvas(c,S,S,x=>{const hits=new Set();const add=(a,b)=>{if(a>=0&&a<n&&b>=0&&b<n)hits.add(a*n+b)};
      const sl=(dirs,rg)=>dirs.forEach(o=>{for(let i=1;i<=rg;i++)add(3+o[0]*i,3+o[1]*i)});
      for(const k of TD[t].comps){if(k==='P')[[-1,-1],[-1,1]].forEach(o=>add(3+o[0],3+o[1]));if(k==='N')KN.forEach(o=>add(3+o[0],3+o[1]));if(k==='K')D8.forEach(o=>add(3+o[0],3+o[1]));if(k==='B')sl(DG,3);if(k==='R')sl(D4,3);if(k==='Q')sl(D8,3)}
      drawBoard(x,0,0,s2,n,n,B,false);
      hits.forEach(k=>{const a=(k/n)|0,b=k%n;x.fillStyle=TD[t].hy?'rgba(201,162,255,.6)':'rgba(232,182,76,.6)';x.fillRect(b*s2,a*s2,s2,s2);x.fillStyle=TD[t].hy?'#5d3a8a':'#8a5a10';x.beginPath();x.arc(b*s2+s2/2,a*s2+s2/2,s2*.16,0,7);x.fill()});
      drawPiece(x,t,3.5*s2,3.5*s2,s2*1.35,true)})});
  const el=$('#enemyList');el.innerHTML='';
  ['P','N','B','R','Q','K'].forEach(t=>{const d=document.createElement('div');d.className='el';const c=document.createElement('canvas');iconCanvas(c,t,false,34);d.appendChild(c);d.insertAdjacentHTML('beforeend',`<div><b>${ED[t].boss?L(ED[t].bossName):L(ED[t].name)}</b><span>${L(ED[t].blurb)}</span></div>`);el.appendChild(d)});
  el.insertAdjacentHTML('beforeend',`<div class="el"><span class="glory" style="width:34px;justify-content:center"><span class="gl" style="width:18px;height:18px;background:var(--gold)"></span></span><div><b>${L(['Elites','Élites'])}</b><span>${L(['From wave 6, some black pieces arrive gilded: tougher, harder-hitting, worth double gold.','Desde la oleada 6, algunas piezas negras llegan doradas: más duras, golpean más fuerte y valen el doble de oro.'])}</span></div></div>`);
}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=LANG;document.title=L(['Gambit — Chess Tower Defense','Gambito — Ajedrez Tower Defense']);
  document.querySelectorAll('[data-t]').forEach(el=>{const v=UI[el.dataset.t];if(!v)return;const txt=L(v);if(el.dataset.gl)el.innerHTML='<span class="gl"></span>'+txt;else el.textContent=txt});
  $('#waveLbl').textContent=L(UI.wave);
  $('#hpS').setAttribute('aria-label',L(['King health','Coronas del Rey']));$('#goldS').setAttribute('aria-label',L(UI.gold));
  $('#spdBtn').setAttribute('aria-label',L(['Game speed','Velocidad']));$('#pauseBtn').setAttribute('aria-label',L(UI.paused));
  shopBtns.forEach(b=>{b.querySelector('.n').textContent=pname(b.dataset.t);b.setAttribute('aria-label',pname(b.dataset.t))});
  helpSet='';G.sheetKey='';pxCache;refreshIcons();
  if(G.king){buildSkills();buildPreview();ui();modeTag();if($('#pause').classList.contains('on'))pauseInfo()}
  if($('#title').classList.contains('on'))toTitle();
  if($('#setup').classList.contains('on'))buildSetup();
  if($('#armory').classList.contains('on'))buildArmory();
  if($('#settings').classList.contains('on'))buildSettings();
  if($('#help').classList.contains('on'))buildHelp();
  if($('#over').classList.contains('on'))fillOver();
  if($('#boon').classList.contains('on')&&G.offers)renderBoons();
}
const toggleLang=()=>{LANG=LANG==='es'?'en':'es';store.set('lang',LANG);AU.init();AU.play('tap');applyLang()};
$('#langBtn').addEventListener('click',toggleLang);$('#langBtn2').addEventListener('click',toggleLang);

/* ================= boot ================= */
new ResizeObserver(()=>resize()).observe($('#stage'));resize();
M=freshM();
applyLang();
toTitle();
requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
</body>
</html>
