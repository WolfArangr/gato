<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editor de Texto</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* Fuentes Astúrica – todo el sitio las usa */
    @font-face {
      font-family: 'Asturica';
      src: 
        url('https://www.gato.red/fuentes/Asturica.woff2') format('woff2'),
        url('https://www.gato.red/fuentes/Asturica.woff') format('woff'),
        url('https://www.gato.red/fuentes/Asturica.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Asturica';
      src: 
        url('https://www.gato.red/fuentes/Asturica-Bold.woff2') format('woff2'),
        url('https://www.gato.red/fuentes/Asturica-Bold.woff') format('woff'),
        url('https://www.gato.red/fuentes/Asturica-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Asturica';
      src: 
        url('https://www.gato.red/fuentes/Asturica-Italic.woff2') format('woff2'),
        url('https://www.gato.red/fuentes/Asturica-Italic.woff') format('woff'),
        url('https://www.gato.red/fuentes/Asturica-Italic.ttf') format('truetype');
      font-weight: normal;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --bg-light: #f8f4eb;           /* blanco hueso */
      --text-blue: #19345a;          /* azul oscuro RGB(25,52,90) */
      --text-black: #111111;
      --accent-blue: #19345a;
      --accent-black: #111111;
      --accent-dark: #a0c0ff;        /* azul claro suave para modo oscuro */
      --paper: url('https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&q=80&w=2000') center/cover;
    }

    [data-theme="dark"] {
      --bg-light: #14100a;
      --accent-blue: #a0c0ff;
      --accent-black: #a0c0ff;
      --accent-dark: #a0c0ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Asturica', Georgia, serif;
      background: var(--bg-light);
      color: var(--text-blue);
      min-height: 100vh;
      padding: 20px;
      transition: all 0.4s ease;
    }

    body[data-textcolor="black"] { color: var(--text-black); }
    body[data-theme="dark"] { color: #ffffff; }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--accent-blue);
    }
    body[data-textcolor="black"] header { color: var(--accent-black); }
    body[data-theme="dark"] header { color: var(--accent-dark); }

    h1 { font-size: 2.9rem; letter-spacing: 1.5px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(25,52,90,0.06);
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      align-items: center;
      border: 1px solid rgba(25,52,90,0.12);
    }
    body[data-textcolor="black"] .toolbar { background: rgba(17,17,17,0.06); border-color: rgba(17,17,17,0.12); }
    body[data-theme="dark"] .toolbar { background: rgba(160,192,255,0.08); border-color: rgba(160,192,255,0.15); }

    button, select {
      background: rgba(25,52,90,0.08);
      color: var(--accent-blue);
      border: 1px solid rgba(25,52,90,0.25);
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Asturica', serif;
      font-size: 0.96rem;
      transition: all 0.2s;
    }
    body[data-textcolor="black"] button, body[data-textcolor="black"] select {
      background: rgba(17,17,17,0.08);
      color: var(--accent-black);
      border-color: rgba(17,17,17,0.25);
    }
    body[data-theme="dark"] button, body[data-theme="dark"] select {
      background: rgba(160,192,255,0.12);
      color: var(--accent-dark);
      border-color: rgba(160,192,255,0.3);
    }

    button:hover, select:hover {
      background: rgba(25,52,90,0.18);
    }
    body[data-textcolor="black"] button:hover, body[data-textcolor="black"] select:hover {
      background: rgba(17,17,17,0.18);
    }
    body[data-theme="dark"] button:hover, body[data-theme="dark"] select:hover {
      background: rgba(160,192,255,0.22);
    }

    .editor-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    body[data-theme="dark"] .editor-container {
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    .paper-bg {
      position: absolute;
      inset: 0;
      background: var(--paper);
      opacity: 0.11;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    [data-papiro="off"] .paper-bg { opacity: 0; }

    .editor {
      min-height: 68vh;
      padding: 4.5rem 5.5rem;
      font-size: 1.28rem;
      line-height: 1.72;
      background: transparent;
      outline: none;
      width: 100%;
      font-family: 'Asturica', Georgia, serif;
      caret-color: var(--accent-blue);
    }
    body[data-textcolor="black"] .editor { caret-color: var(--accent-black); }
    body[data-theme="dark"] .editor { caret-color: var(--accent-dark); }

    .editor h1, .editor h2 { color: var(--accent-blue); margin: 1.4em 0 0.6em; }
    body[data-textcolor="black"] .editor h1, body[data-textcolor="black"] .editor h2 { color: var(--accent-black); }
    body[data-theme="dark"] .editor h1, body[data-theme="dark"] .editor h2 { color: var(--accent-dark); }

    .status {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.92rem;
      opacity: 0.7;
      color: inherit;
    }
  </style>
</head>
<body data-theme="light" data-textcolor="blue" data-papiro="on">

  <div class="container">
    <header>
      <h1></h1>
      <p style="margin-top:10px;opacity:0.9;">Editor de Texto</p>
    </header>

    <div class="toolbar">
      <button onclick="execCmd('bold')">Negrita</button>
      <button onclick="execCmd('italic')">Cursiva</button>
      <button onclick="execCmd('blockquote')">Cita</button>
      
      <select id="fontSize" onchange="changeFontSize()">
        <option value="">Tamaño</option>
        <option value="2">Pequeño</option>
        <option value="3" selected>Normal</option>
        <option value="5">Grande</option>
        <option value="7">Enorme</option>
      </select>

      <button onclick="formatBlock('h1')">Título grande</button>
      <button onclick="formatBlock('h2')">Título medio</button>
      <button onclick="formatBlock('p')">Párrafo</button>

      <span style="flex:1"></span>

      <button onclick="copyFormatted()">Copiar con formato</button>
      <button onclick="downloadHTML()">Descargar HTML</button>
      <button onclick="downloadPNG()">Descargar PNG</button>

      <button id="toggleTheme">Modo oscuro</button>
      <button id="toggleTextColor">Texto negro</button>
      <button id="togglePapiro">Quitar papiro</button>
    </div>

    <div class="editor-container">
      <div class="paper-bg"></div>
      <div contenteditable="true" class="editor" id="editor">
        
      </div>
    </div>

    <div class="status">
      Usa botones o atajos (Ctrl+B, Ctrl+I). Los bloques se crean con Enter.
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');

    function execCmd(cmd) {
      document.execCommand(cmd, false, null);
      editor.focus();
    }

    function formatBlock(tag) {
      document.execCommand('formatBlock', false, tag);
      editor.focus();
    }

    function changeFontSize() {
      const size = document.getElementById('fontSize').value;
      if (size) {
        document.execCommand('fontSize', false, size);
        editor.focus();
      }
    }

    async function copyFormatted() {
      try {
        const html = editor.innerHTML;
        const blob = new Blob([html], { type: 'text/html' });
        const item = new ClipboardItem({ 'text/html': blob });
        await navigator.clipboard.write([item]);
        alert('Copiado con formato');
      } catch(e) {
        alert('Error al copiar');
      }
    }

    function downloadHTML() {
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Texto Asturianizado</title>
<style>body{font-family:'Asturica',serif;background:#f8f4eb;padding:40px;font-size:1.3rem;line-height:1.7;}</style></head>
<body>${editor.innerHTML}</body></html>`;
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'texto-asturiano.html'; a.click();
      URL.revokeObjectURL(url);
    }

    async function downloadPNG() {
      try {
        const container = document.querySelector('.editor-container');
        const canvas = await html2canvas(container, { scale: 2, backgroundColor: null });
        const link = document.createElement('a');
        link.download = 'texto-asturiano.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch(e) {
        alert('Error al generar PNG');
      }
    }

    document.getElementById('toggleTheme').onclick = () => {
      const body = document.body;
      const isDark = body.dataset.theme === 'dark';
      body.dataset.theme = isDark ? 'light' : 'dark';
      this.textContent = isDark ? 'Modo oscuro' : 'Modo claro';
    };

    document.getElementById('toggleTextColor').onclick = () => {
      const body = document.body;
      const current = body.dataset.textcolor;
      const next = current === 'blue' ? 'black' : 'blue';
      body.dataset.textcolor = next;
      this.textContent = next === 'blue' ? 'Texto negro' : 'Texto azul';
    };

    document.getElementById('togglePapiro').onclick = () => {
      const body = document.body;
      const isOn = body.dataset.papiro === 'on';
      body.dataset.papiro = isOn ? 'off' : 'on';
      this.textContent = isOn ? 'Poner papiro' : 'Quitar papiro';
    };

    document.querySelectorAll('.toolbar button, .toolbar select').forEach(el => {
      el.addEventListener('mousedown', e => e.preventDefault());
    });

    editor.focus();
  </script>
</body>
</html>
