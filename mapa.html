<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js"></script>
    <style>
        body {
            background-color: #f5e8c7;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            margin: 0;
            padding: 20px;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.96);
            padding: 70px 80px;
            border: 12px solid #6b4c2e;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }
        #title-page {
            text-align: center;
            margin-bottom: 40px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5.4em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.7em;
            color: #3d2b1f;
            margin: 0;
        }
        #map-container {
            height: 800px;
            border: 2px solid #6b4c2e;
            position: relative;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 12px 18px;
            border: 2px solid #b22222;
            z-index: 9999;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .loc-pin {
            width: 24px;
            height: 24px;
            background: #b22222;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
            cursor: pointer;
            pointer-events: auto;
        }
        .loc-pin:hover {
            transform: scale(1.4);
            transition: transform 0.2s;
        }
        @media (max-width: 768px) {
            #book { padding: 35px 25px; max-width: 95%; }
            h1.main-title { font-size: 3.8em; }
            h1.author { font-size: 2.1em; }
            #map-container { height: 500px; }
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Mapa Interactivo de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>

        <div id="status">Cargando mapa... (haz clic en los puntos rojos para abrir la localidad)</div>
        <div id="map-container"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const status = document.getElementById('status');

            // Coordenadas aproximadas de las localidades en píxeles (10000 × 4807)
            // Ajusta estos valores según donde estén realmente en tu mapa
            const locations = [
                { name: "Palla", lower: "palla", x: 800, y: 400 },
                { name: "Allares", lower: "allares", x: 2200, y: 1400 },
                { name: "Leras", lower: "leras", x: 9000, y: 2000 },
                { name: "Torredavil", lower: "torredavil", x: 2800, y: 2200 },
                { name: "Saura", lower: "saura", x: 4000, y: 2600 },
                { name: "Casto", lower: "casto", x: 5000, y: 2200 },
                { name: "Valviste", lower: "valviste", x: 5000, y: 800 },
                { name: "Yundo", lower: "yundo", x: 7800, y: 3400 },
                { name: "Vallo", lower: "vallo", x: 8600, y: 3200 },
                { name: "Sanconciare", lower: "sanconciare", x: 5000, y: 400 },
                { name: "Anconta", lower: "anconta", x: 4500, y: 900 },
                { name: "Ciralher", lower: "ciralher", x: 300, y: 400 },
                { name: "Esplera", lower: "esplera", x: 6500, y: 1400 },
                { name: "Negrera", lower: "negrera", x: 6200, y: 1600 },
                { name: "Madronasas", lower: "madronasas", x: 7600, y: 2800 },
                // Añade todas las que quieras, con sus coordenadas reales
            ];

            const viewer = OpenSeadragon({
                id: "map-container",
                prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
                tileSources: {
                    type: 'image',
                    url: "localidades/mapacompleto.jpg"
                },
                useCanvas: false,
                showNavigator: true,
                navigatorPosition: "BOTTOM_RIGHT",
                defaultZoomLevel: 0.7,
                minZoomLevel: 0.25,
                maxZoomLevel: 12,
                constrainDuringPan: true,
                visibilityRatio: 0.85
            });

            viewer.addHandler('open', () => {
                console.log("Mapa cargado correctamente");
                status.textContent = "Haz clic en los puntos rojos para abrir la localidad";

                // Añadir pines clicables
                locations.forEach(loc => {
                    const pin = document.createElement('div');
                    pin.className = 'loc-pin';
                    pin.title = loc.name; // tooltip al pasar el ratón

                    pin.addEventListener('click', () => {
                        // Abrir imagen de la localidad
                        window.open(`localidades/${loc.lower}.jpg`, '_blank');

                        // Opcional: zoom suave al punto
                        const x_norm = loc.x / 10000;
                        const y_norm = loc.y / 4807;
                        const zoomSize = 0.18;
                        viewer.viewport.fitBounds(
                            new OpenSeadragon.Rect(
                                x_norm - zoomSize / 2,
                                y_norm - zoomSize / 2,
                                zoomSize,
                                zoomSize
                            ),
                            true
                        );
                    });

                    // Posicionar el pin en coordenadas normalizadas
                    viewer.addOverlay({
                        element: pin,
                        location: new OpenSeadragon.Point(loc.x / 10000, loc.y / 4807),
                        placement: 'CENTER'
                    });
                });
            });

            viewer.addHandler('open-failed', (event) => {
                console.error("Error al abrir mapa:", event);
                status.innerHTML = 'Error al cargar mapa – ver consola F12';
            });
        });
    </script>
</body>
</html>
