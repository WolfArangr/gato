<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Mapa Interactivo de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js"></script>
    <style>
        body {
            background-color: #f5e8c7;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            margin: 0;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.96);
            padding: 70px 80px;
            border: 12px solid #6b4c2e;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }
        #title-page {
            text-align: center;
            margin-bottom: 40px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 3.2em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.6em;
            color: #3d2b1f;
            margin: 0;
        }
        #map-wrapper {
            width: 100%;
            aspect-ratio: 10000 / 4807; /* Fuerza la proporción exacta de la imagen */
            max-height: 800px; /* Límite superior para no crecer demasiado */
            margin-bottom: 20px;
            border: 2px solid #6b4c2e;
        }
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
            touch-action: manipulation;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 12px 18px;
            border: 2px solid #b22222;
            z-index: 9999;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .loc-pin {
            width: 28px;
            height: 28px;
            background: #b22222;
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.7);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s;
        }
        .loc-pin:hover {
            transform: scale(1.5);
        }
        @media (max-width: 768px) {
            #book { padding: 35px 25px; max-width: 95%; }
            h1.main-title { font-size: 2.8em; }
            h1.author { font-size: 1.4em; }
            #map-wrapper { max-height: 500px; }
        }
        @media (max-width: 480px) {
            #map-wrapper { max-height: 350px; }
            .loc-pin { width: 24px; height: 24px; border-width: 3px; }
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Mapa Interactivo de Kurghaimat</h1>
        </div>
        <div id="status">Cargando mapa... Haz clic o tap en los puntos rojos para abrir la localidad</div>
        <div id="map-wrapper">
            <div id="map-container"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const status = document.getElementById('status');

            // Los tres sitios que pediste
            const locations = [
                { name: "Chuelas", lower: "chuelas", x: 8044, y: 1436 },
                { name: "Bailes", lower: "bailes", x: 8475, y: 1194 },
                { name: "Cinies", lower: "cinies", x: 7858, y: 754 },
                { name: "Test", lower: "bailes", x: 10000, y: 0 },
            ];

            const viewer = OpenSeadragon({
                id: "map-container",
                prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
                tileSources: {
                    type: 'image',
                    url: "localidades/mapacompleto.jpg"
                },
                useCanvas: false,
                showNavigator: true,
                navigatorPosition: "BOTTOM_RIGHT",
                defaultZoomLevel: 1.6,
                minZoomLevel: 1,
                maxZoomLevel: 12,
                constrainDuringPan: true,
                visibilityRatio: 1.0,
                preserveViewport: true,
                minZoomImageRatio: 1.0,  // Evita zoom-out más allá del tamaño real de la imagen
                gestureSettingsTouch: {
                    pinchToZoom: true,
                    clickToZoom: false,
                    dblClickToZoom: true
                }
            });

            viewer.addHandler('open', () => {
                console.log("Mapa cargado correctamente");
                status.textContent = "Haz clic o tap en los puntos rojos para abrir la localidad";

                // Añadir los tres puntos
                locations.forEach(loc => {
                    const pin = document.createElement('div');
                    pin.className = 'loc-pin';
                    pin.title = loc.name;

                    const openLocation = (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        window.open(`localidades/${loc.lower}.jpg`, '_blank');
                    };

                    pin.addEventListener('click', openLocation);
                    pin.addEventListener('touchend', openLocation);

                    viewer.addOverlay({
                        element: pin,
                        location: new OpenSeadragon.Point(loc.x / 10000, loc.y / 4807),
                        placement: 'CENTER',
                        checkResize: false
                    });
                });

                // Centrar y ajustar al inicio
                viewer.viewport.goHome(true);
            });

            viewer.addHandler('open-failed', (event) => {
                console.error("Error al abrir mapa:", event);
                status.innerHTML = 'Error al cargar mapa, seguramente culpa de un gato – ver consola F12';
            });
        });
    </script>
</body>
</html>
