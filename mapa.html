<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js"></script>
    <style>
        body {
            background-color: #f5e8c7;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            margin: 0;
            padding: 20px;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.96);
            padding: 70px 80px;
            border: 12px solid #6b4c2e;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }
        #title-page {
            text-align: center;
            margin-bottom: 40px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5.4em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.7em;
            color: #3d2b1f;
            margin: 0;
        }
        #map-container {
            height: 800px;
            border: 2px solid #6b4c2e;
            position: relative;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 12px 18px;
            border: 2px solid #b22222;
            z-index: 9999;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .loc-pin {
            width: 28px;
            height: 28px;
            background: #b22222;
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.7);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s;
        }
        .loc-pin:hover {
            transform: scale(1.5);
        }
        @media (max-width: 768px) {
            #book { padding: 35px 25px; max-width: 95%; }
            h1.main-title { font-size: 3.8em; }
            h1.author { font-size: 2.1em; }
            #map-container { height: 500px; }
        }
        @media (max-width: 480px) {
            #map-container { height: 350px; }
            .loc-pin { width: 24px; height: 24px; border-width: 3px; }
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Mapa Interactivo de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>

        <div id="status">Cargando mapa... Haz clic (o tap) en el punto rojo para abrir la localidad</div>
        <div id="map-container"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const status = document.getElementById('status');

            // Solo UN punto por ahora (ajústalo tú con las coordenadas reales)
            const locations = [
                { name: "Leras", lower: "leras", x: 800, y: 400 }  // ← CAMBIA AQUÍ LAS COORDENADAS REALES
                // Si quieres añadir más después, solo copia la línea y cambia nombre/lower/x/y
            ];

            const viewer = OpenSeadragon({
                id: "map-container",
                prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
                tileSources: {
                    type: 'image',
                    url: "localidades/mapacompleto.jpg"
                },
                useCanvas: false,
                showNavigator: true,
                navigatorPosition: "BOTTOM_RIGHT",
                defaultZoomLevel: 0.7,
                minZoomLevel: 0.3,           // ← límite de zoom-out (ajusta si quieres más/menos alejado)
                maxZoomLevel: 12,
                constrainDuringPan: true,
                visibilityRatio: 1.0,        // evita que se salga mucho del borde
                preserveViewport: true
            });

            viewer.addHandler('open', () => {
                console.log("Mapa cargado correctamente");
                status.textContent = "Haz clic (o tap) en el punto rojo para abrir la localidad";

                // Limitar zoom-out para que el mapa completo quepa justo en pantalla
                const containerAspect = viewer.container.clientWidth / viewer.container.clientHeight;
                const imageAspect = 4807 / 10000;
                const fitZoom = Math.min(1 / containerAspect, 1 / imageAspect) * 0.98;
                viewer.viewport.minZoomLevel = fitZoom;

                // Añadir el único punto
                locations.forEach(loc => {
                    const pin = document.createElement('div');
                    pin.className = 'loc-pin';
                    pin.title = loc.name;

                    pin.addEventListener('click', () => {
                        // Abrir la imagen de la localidad en nueva pestaña
                        window.open(`localidades/${loc.lower}.jpg`, '_blank');

                        // Opcional: zoom suave al punto (coméntalo si no lo quieres)
                        const x_norm = loc.x / 10000;
                        const y_norm = loc.y / 4807;
                        const zoomSize = 0.18;
                        viewer.viewport.fitBounds(
                            new OpenSeadragon.Rect(
                                x_norm - zoomSize / 2,
                                y_norm - zoomSize / 2,
                                zoomSize,
                                zoomSize
                            ),
                            true
                        );
                    });

                    viewer.addOverlay({
                        element: pin,
                        location: new OpenSeadragon.Point(loc.x / 10000, loc.y / 4807),
                        placement: 'CENTER'
                    });
                });
            });

            viewer.addHandler('open-failed', (event) => {
                console.error("Error al abrir mapa:", event);
                status.innerHTML = 'Error al cargar mapa – ver consola F12';
            });
        });
    </script>
</body>
</html>
