<!DOCTYPE html>
<html lang="es">

    <title>Mapa Interactivo de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js"></script>
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.75;
            margin: 0;
            padding: 20px;
            background-color: #f5e8c7;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.96);
            padding: 70px 80px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }
        #title-page {
            text-align: center;
            margin-bottom: 100px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5.4em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.7em;
            color: #3d2b1f;
            margin: 0 0 100px;
            border-bottom: 4px double #8b4513;
            padding-bottom: 30px;
        }
        #map-container {
            height: 600px;
            margin-bottom: 40px;
        }
        #search {
            width: 100%;
            padding: 10px;
            font-size: 1.2em;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        #localidades {
            margin-top: 60px;
            text-align: center;
        }
        #localidades summary {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.0em;
            color: #4b2e1a;
            cursor: pointer;
        }
        #localidades ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        #localidades li {
            margin: 8px 0;
        }
        #localidades a {
            font-size: 1.4em;
            color: #8b4513;
            text-decoration: none;
        }
        #localidades a:hover {
            color: #8b0000;
        }
        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            #book { padding: 35px 25px; border-width: 8px; max-width: 95%; box-shadow: inset 0 0 25px rgba(0,0,0,0.15); }
            h1.main-title { font-size: 3.8em; margin: 15px 0 8px; }
            h1.author { font-size: 2.1em; margin-bottom: 60px; padding-bottom: 20px; }
            #map-container { height: 400px; }
        }
        @media (max-width: 480px) {
            #book { padding: 25px 18px; }
            h1.main-title { font-size: 3.2em; }
            h1.author { font-size: 1.9em; }
            #map-container { height: 300px; }
        }
    </style>
</head>

                });

                svg.appendChild(mask);

                const fogRect = document.createElementNS(svgNS, 'rect');
                fogRect.setAttribute('x', '0');
                fogRect.setAttribute('y', '0');
                fogRect.setAttribute('width', '1');
                fogRect.setAttribute('height', `${aspect}`);
                fogRect.setAttribute('fill', '#2c1b0f'); // Color de niebla
                fogRect.setAttribute('opacity', '0.8');
                fogRect.setAttribute('mask', 'url(#fog-mask)');
                svg.appendChild(fogRect);

                // Añadir el overlay
                viewer.addOverlay({
                    element: svg,
                    location: new OpenSeaDragon.Rect(0, 0, 1, aspect)
                });
            });

            // Generar la lista de localidades descubiertas (ordenada alfabéticamente)
            const sorted = uniquePositions.sort((a, b) => a.cap.localeCompare(b.cap, 'es'));

            const locList = document.getElementById('loc-list');
            sorted.forEach(pos => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `localidades/${pos.lower}.jpg`;
                a.target = '_blank';
                a.textContent = pos.cap;
                a.addEventListener('click', (e) => {
                    // Zoom al área
                    const x_norm = pos.x / mapWidth;
                    const y_norm = pos.y / mapWidth;
                    const bounds = new OpenSeaDragon.Rect(x_norm - revealRadiusNorm, y_norm - revealRadiusNorm, 2 * revealRadiusNorm, 2 * revealRadiusNorm);
                    viewer.viewport.fitBounds(bounds, true);
                });
                li.appendChild(a);
                locList.appendChild(li);
            });

            // Búsqueda
            const searchInput = document.getElementById('search');
            searchInput.addEventListener('input', function() {
                const filter = this.value.toLowerCase();
                const lis = locList.getElementsByTagName('li');
                for (let i = 0; i < lis.length; i++) {
                    const a = lis[i].getElementsByTagName('a')[0];
                    if (a.textContent.toLowerCase().includes(filter)) {
                        lis[i].style.display = '';
                    } else {
                        lis[i].style.display = 'none';
                    }
                }
            });
        });
    </script>
</body>
</html>
