<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Kurghaimat - Solución 1</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js"></script>
    <style>
        body { background: url('parchment.jpg') repeat fixed; font-family: 'EB Garamond', serif; color: #2c1b0f; line-height: 1.75; margin: 0; padding: 20px; background-color: #f5e8c7; }
        #book { max-width: 920px; margin: 0 auto; background: rgba(245, 232, 199, 0.96); padding: 70px 80px; border: 12px solid #6b4c2e; border-image: url('border-medieval.png') 30 round; box-shadow: inset 0 0 50px rgba(0,0,0,0.2); }
        #title-page { text-align: center; margin-bottom: 100px; }
        h1.main-title { font-family: 'MedievalSharp', cursive; font-size: 5.4em; color: #8b0000; margin: 20px 0 10px; text-shadow: 3px 3px 8px rgba(0,0,0,0.3); }
        h1.author { font-family: 'MedievalSharp', cursive; font-size: 2.7em; color: #3d2b1f; margin: 0 0 100px; border-bottom: 4px double #8b4513; padding-bottom: 30px; }
        #map-container { height: 600px; margin-bottom: 40px; position: relative; }
        #status { position: absolute; top: 10px; left: 10px; background: white; padding: 15px; border: 2px solid red; z-index: 9999; font-weight: bold; }
        @media (max-width: 768px) { #map-container { height: 400px; } }
        @media (max-width: 480px) { #map-container { height: 300px; } }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Mapa Interactivo de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>
        <div id="status">Cargando mapa... (si se queda aquí, abre F12 → Console y dime qué sale)</div>
        <div id="map-container"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const viewer = OpenSeadragon({
                id: "map-container",
                prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
                tileSources: "localidades/mapacompleto.png",
                useCanvas: false,               // ← Fuerza uso de <img> en lugar de canvas
                immediateRender: true,
                showNavigator: true,
                navigatorPosition: "BOTTOM_RIGHT",
                defaultZoomLevel: 0.4,
                minZoomLevel: 0.05,
                maxZoomLevel: 8
            });

            viewer.addHandler('open', () => {
                console.log("¡Mapa cargado correctamente!");
                document.getElementById('status').textContent = 'Mapa cargado (puede ser lento por tamaño)';
            });

            viewer.addHandler('open-failed', (event) => {
                console.error("Error al abrir:", event);
                document.getElementById('status').innerHTML = 'Error: ' + (event.message || 'unable to open – ver consola');
            });

            viewer.addHandler('tile-load-failed', (event) => {
                console.error("Tile falló:", event);
            });
        });
    </script>
</body>
</html>
