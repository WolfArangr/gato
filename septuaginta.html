<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Septuaginta - Traducción e Interpretación Secular</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #0f0f0f;
      color: #e8e8e8;
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1a1a1a;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #4a90e2;
    }
    .content-area {
      background: #1a1a1a;
      margin: 20px;
      border-radius: 10px;
      padding: 20px;
    }
    .chapter-title {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    .verses-container {
      margin-top: 20px;
    }
    .verse {
      margin-bottom: 20px;
      padding: 15px;
      background: #0f0f0f;
      border-radius: 8px;
      border-left: 4px solid #4a90e2;
    }
    .verse-number {
      font-weight: bold;
      color: #4a90e2;
      margin-bottom: 8px;
    }
    .verse-notes {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #aaa;
      font-style: italic;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
    .control-btn {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #4a90e2;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Septuaginta</div>
  </header>

  <main>
    <div class="content-area">
      <h1 class="chapter-title">Cargando...</h1>
      <div class="verses-container"></div>
    </div>
  </main>

  <div class="controls">
    <button class="control-btn" id="prev">‹</button>
    <button class="control-btn" id="next">›</button>
  </div>

  <script>
    // =============================
    // DATOS DE LA BIBLIA
    // =============================
    const bibleData = {
      genesis: {
        1: {
          1: {
            text: "En el principio creó Dios los cielos y la tierra.",
            notes: "Nota secular: El término 'bereshit' sugiere un comienzo temporal..."
          },
          2: {
            text: "La tierra estaba desordenada y vacía...",
            notes: "Refleja el caos primordial semejante al Tiamat babilónico."
          }
        }
      }
    };

    // Lista de libros disponibles
    const books = {
      genesis: { name: "Génesis", chapters: 50 }
      // puedes añadir más aquí
    };

    // Estado de navegación
    let currentBook = "genesis";
    let currentChapter = 1;

    // =============================
    // RENDERIZADO
    // =============================
    function loadChapter() {
      const chapterData = bibleData[currentBook][currentChapter];
      const versesContainer = document.querySelector(".verses-container");
      versesContainer.innerHTML = "";

      for (const [verseNum, verseData] of Object.entries(chapterData)) {
        const verseHTML = `
          <div class="verse" data-verse="${verseNum}">
            <div class="verse-number">${currentChapter}:${verseNum}</div>
            <div class="verse-text">${verseData.text}</div>
            <div class="verse-notes">${verseData.notes || ""}</div>
          </div>
        `;
        versesContainer.insertAdjacentHTML("beforeend", verseHTML);
      }

      document.querySelector(".chapter-title").textContent =
        `${books[currentBook].name} ${currentChapter}`;
    }

    // =============================
    // CONTROLES
    // =============================
    document.getElementById("prev").addEventListener("click", () => {
      if (currentChapter > 1) {
        currentChapter--;
        loadChapter();
      }
    });

    document.getElementById("next").addEventListener("click", () => {
      if (currentChapter < books[currentBook].chapters) {
        currentChapter++;
        if (!bibleData[currentBook][currentChapter]) {
          bibleData[currentBook][currentChapter] = {}; // prepara capítulo vacío
        }
        loadChapter();
      }
    });

    // Inicialización
    loadChapter();
  </script>
</body>
</html>
