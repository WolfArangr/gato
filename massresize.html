<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --accent: #e8ff47;
    --accent2: #ff4757;
    --text: #f0f0f0;
    --muted: #555566;
    --border: #2a2a3a;
    --radius: 4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 56px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    flex-wrap: wrap;
  }

  .logo { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: var(--accent); }
  .logo span { color: var(--text); }

  .tagline {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    flex: 1;
  }

  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    flex-shrink: 0;
  }

  .lang-btn {
    background: var(--surface2);
    border: none;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .lang-btn.active { background: rgba(232,255,71,0.12); color: var(--accent); }
  .lang-btn:not(:last-child) { border-right: 1px solid var(--border); }

  .step-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; }

  .dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 60px 40px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
  .dropzone:hover, .dropzone.drag-over { border-color: var(--accent); background: rgba(232,255,71,0.04); }
  .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

  .drop-icon { font-size: 40px; margin-bottom: 16px; display: block; }
  .drop-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .drop-sub { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }

  #thumbnails { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }

  .thumb { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--border); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .remove { position: absolute; top: 4px; right: 4px; background: var(--accent2); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; }
  .thumb:hover .remove { opacity: 1; }

  .presets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 28px; }

  .preset-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; transition: all 0.2s; position: relative; }
  .preset-card:hover { border-color: var(--accent); background: rgba(232,255,71,0.05); }
  .preset-card.active { border-color: var(--accent); background: rgba(232,255,71,0.08); }
  .preset-card.last-used { border-style: dashed; }

  .preset-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; color: var(--accent); }
  .preset-desc { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); line-height: 1.5; }

  .preset-badge { position: absolute; top: 10px; right: 10px; font-family: 'Space Mono', monospace; font-size: 9px; background: rgba(232,255,71,0.15); color: var(--accent); border-radius: 20px; padding: 2px 8px; text-transform: uppercase; letter-spacing: 1px; }
  .preset-badge.saved { background: rgba(255,71,87,0.15); color: var(--accent2); }

  .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .controls-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

  @media (max-width: 700px) { .controls-grid, .controls-grid-3 { grid-template-columns: 1fr; } .presets-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { .presets-grid { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 8px; }

  label { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }

  input[type="number"], select { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 12px 14px; font-family: 'Space Mono', monospace; font-size: 14px; width: 100%; outline: none; transition: border-color 0.2s; }
  input[type="number"]:focus, select:focus { border-color: var(--accent); }

  .range-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] { flex: 1; -webkit-appearance: none; height: 4px; background: var(--border); border-radius: 2px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; }

  .range-val { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--accent); min-width: 40px; text-align: right; }

  .checkbox-row { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  .logo-upload-area { border: 1px dashed var(--border); border-radius: var(--radius); padding: 20px; text-align: center; cursor: pointer; position: relative; transition: border-color 0.2s; margin-bottom: 16px; }
  .logo-upload-area:hover { border-color: var(--accent); }
  .logo-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

  #logo-preview { max-width: 120px; max-height: 60px; display: none; margin: 0 auto 12px; border-radius: var(--radius); }

  .position-grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 240px; }

  .pos-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted); padding: 10px 6px; font-family: 'Space Mono', monospace; font-size: 10px; cursor: pointer; transition: all 0.15s; text-align: center; }
  .pos-btn.active { background: rgba(232,255,71,0.12); border-color: var(--accent); color: var(--accent); }
  .pos-btn.center-btn.active { background: rgba(232,255,71,0.18); font-weight: 700; }

  .btn-process { width: 100%; padding: 18px; background: var(--accent); color: #0a0a0f; border: none; border-radius: var(--radius); font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
  .btn-process:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(232,255,71,0.3); }
  .btn-process:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }

  #progress-section { display: none; }
  .progress-bar-bg { background: var(--border); border-radius: 2px; height: 4px; margin: 12px 0; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }
  .progress-text { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }

  #results-section { display: none; }
  .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .result-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s; }
  .result-card:hover { border-color: var(--accent); }
  .result-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .result-info { padding: 8px; }
  .result-name { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .result-size { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent); }

  .btn-dl-ind { width: 100%; padding: 6px; background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'Space Mono', monospace; font-size: 10px; cursor: pointer; transition: all 0.15s; border-radius: 0 0 var(--radius) var(--radius); }
  .btn-dl-ind:hover { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.06); }

  .dl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-dl { padding: 16px; border-radius: var(--radius); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; border: none; }
  .btn-dl-zip { background: var(--surface2); border: 1px solid var(--accent); color: var(--accent); }
  .btn-dl-zip:hover { background: rgba(232,255,71,0.1); }
  .btn-dl-all { background: var(--accent2); color: white; }
  .btn-dl-all:hover { background: #ff3040; transform: translateY(-1px); }

  .hidden { display: none !important; }
  .info-note { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .ad-slot { display: none; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); text-align: center; padding: 20px; margin-bottom: 24px; min-height: 90px; }
  .sub-title { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .section-divider { height: 1px; background: var(--border); margin: 20px 0; }

  input[type="color"] { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); cursor: pointer; padding: 2px; }
  .color-row { display: flex; align-items: center; gap: 12px; }
  .color-hex { font-family: 'Space Mono', monospace; font-size: 13px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 10px 12px; width: 110px; outline: none; }
  .color-hex:focus { border-color: var(--accent); }

  .tag-pill { display: inline-block; font-family: 'Space Mono', monospace; font-size: 9px; padding: 2px 7px; border-radius: 20px; background: rgba(232,255,71,0.1); color: var(--accent); text-transform: uppercase; letter-spacing: 1px; vertical-align: middle; margin-left: 6px; }

  select option { background: var(--surface2); }
  .format-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .format-tab { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 1px; }
  .format-tab.active { border-color: var(--accent); background: rgba(232,255,71,0.1); color: var(--accent); }

  input[type="text"] { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 12px 14px; font-family: 'Space Mono', monospace; font-size: 13px; width: 100%; outline: none; transition: border-color 0.2s; }
  input[type="text"]:focus { border-color: var(--accent); }

  .stats-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-item { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); }
  .stat-item strong { display: block; font-size: 18px; color: var(--accent); margin-bottom: 2px; }

  /* ── Live Preview ── */
  .preview-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .preview-toggle-btn { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; padding: 8px 14px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
  .preview-toggle-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.08); }
  .preview-toggle-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.2s; }
  .preview-toggle-btn.active .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .preview-note { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }

  #preview-panel { display: none; margin-bottom: 24px; }
  #preview-panel.visible { display: block; }
  .preview-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 600px) { .preview-inner { grid-template-columns: 1fr; } }
  .preview-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .preview-box-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 1px; }
  .preview-box img { width: 100%; display: block; max-height: 360px; object-fit: contain; background: repeating-conic-gradient(#1a1a24 0% 25%, #111118 0% 50%) 0 0 / 16px 16px; }
  .preview-loading { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); padding: 40px; text-align: center; }

  /* ── PDF Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.hidden { display: none; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; max-width: 480px; width: 100%; position: relative; }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  .modal-sub { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .modal-btn { padding: 16px; border-radius: var(--radius); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text); transition: all 0.2s; text-align: center; }
  .modal-btn:hover { border-color: var(--accent); background: rgba(232,255,71,0.07); }
  .modal-btn .modal-btn-title { font-size: 15px; color: var(--accent); display: block; margin-bottom: 4px; }
  .modal-btn .modal-btn-desc { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); line-height: 1.5; }
  .modal-cancel { display: block; text-align: center; font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); cursor: pointer; margin-top: 8px; padding: 8px; }
  .modal-cancel:hover { color: var(--text); }
  .pdf-progress { margin-top: 20px; display: none; }
  .pdf-progress-text { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 8px; }

  /* ── Tour Overlay ── */
  .tour-overlay { position: fixed; inset: 0; z-index: 2000; pointer-events: none; }
  .tour-overlay.hidden { display: none; }
  .tour-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); pointer-events: all; }
  .tour-spotlight { position: fixed; border: 2px solid var(--accent); border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.72); z-index: 2001; pointer-events: none; transition: top 0.32s cubic-bezier(0.4,0,0.2,1), left 0.32s cubic-bezier(0.4,0,0.2,1), width 0.32s cubic-bezier(0.4,0,0.2,1), height 0.32s cubic-bezier(0.4,0,0.2,1); }
  .tour-bubble { position: fixed; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 20px 22px; max-width: 320px; z-index: 2002; pointer-events: all; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  .tour-bubble::before { content: ''; position: absolute; width: 10px; height: 10px; background: var(--surface); border: 1px solid var(--accent); transform: rotate(45deg); }
  .tour-bubble.arrow-top::before { top: -6px; left: 24px; border-right: none; border-bottom: none; }
  .tour-bubble.arrow-bottom::before { bottom: -6px; left: 24px; border-left: none; border-top: none; }
  .tour-bubble.arrow-left::before { left: -6px; top: 20px; border-right: none; border-top: none; }
  .tour-step-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .tour-bubble h3 { font-size: 15px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
  .tour-bubble p { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
  .tour-bubble-tip { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent); background: rgba(232,255,71,0.07); border-radius: 3px; padding: 6px 10px; margin-bottom: 14px; line-height: 1.5; }
  .tour-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tour-counter { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
  .tour-nav-btns { display: flex; gap: 8px; }
  .tour-btn { font-family: 'Space Mono', monospace; font-size: 11px; padding: 8px 14px; border-radius: var(--radius); cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); transition: all 0.15s; }
  .tour-btn.primary { border-color: var(--accent); background: var(--accent); color: #0a0a0f; font-weight: 700; }
  .tour-btn:hover:not(.primary) { border-color: var(--accent); color: var(--accent); }
  .tour-btn-start { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; padding: 8px 14px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
  .tour-btn-start:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">MASS<span>RESIZE</span></div>
    <div class="tagline" id="tagline"></div>
    <button class="tour-btn-start" id="tourStartBtn" onclick="startTour()">
      <span>?</span> <span id="tour-btn-label">Tour</span>
    </button>
    <div class="lang-toggle">
      <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <div class="ad-slot" id="ad-top"></div>

  <div class="step-label" id="step1-label"></div>
  <div class="section">
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*,.pdf,application/pdf" multiple>
      <span class="drop-icon">⬡</span>
      <div class="drop-title" id="drop-title"></div>
      <div class="drop-sub" id="drop-sub"></div>
    </div>
    <div id="thumbnails"></div>
  </div>

  <div class="step-label" id="step2-label"></div>
  <div class="section">
    <div class="sub-title" id="presets-subtitle"></div>
    <div class="presets-grid">
      <div class="preset-card" data-preset="web" onclick="applyPreset('web')">
        <div class="preset-name">🌐 Web Standard</div>
        <div class="preset-desc" id="desc-web"></div>
      </div>
      <div class="preset-card" data-preset="thumb" onclick="applyPreset('thumb')">
        <div class="preset-name" id="name-thumb"></div>
        <div class="preset-desc" id="desc-thumb"></div>
      </div>
      <div class="preset-card" data-preset="print" onclick="applyPreset('print')">
        <div class="preset-name" id="name-print"></div>
        <div class="preset-desc" id="desc-print"></div>
      </div>
      <div class="preset-card last-used" data-preset="last" onclick="applyPreset('last')">
        <div class="preset-name" id="name-last"></div>
        <div class="preset-desc" id="lastPresetDesc"></div>
      </div>
    </div>
  </div>

function setCookie(name, value, days = 365) {
  const d = new Date();
  d.setTime(d.getTime() + days * 86400000);
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
}
function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

function saveLastConfig() {
  const cfg = getCurrentConfig();
  try { localStorage.setItem('massresize_last', JSON.stringify(cfg)); } catch(e) {}
  updateLastPresetDesc(cfg);
}
function loadLastConfig() {
  const raw = localStorage.getItem('massresize_last');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function getCurrentConfig() {
  return {
    maxSide: document.getElementById('maxSideInput').value,
    scalePercent: document.getElementById('scalePercent').value,
    fixedWidth: document.getElementById('fixedWidth').value,
    fixedHeight: document.getElementById('fixedHeight').value,
    allowUpscale: document.getElementById('allowUpscale').checked,
    quality: document.getElementById('qualityRange').value,
    format: outputFormat,
    bgColor: document.getElementById('bgColor').value,
    transparentBg: document.getElementById('transparentBg').checked,
    sharpen: document.getElementById('sharpRange').value,
    brightness: document.getElementById('brightnessRange').value,
    contrast: document.getElementById('contrastRange').value,
    saturation: document.getElementById('saturationRange').value,
    hue: document.getElementById('hueRange').value,
    blur: document.getElementById('blurRange').value,
    grayscale: document.getElementById('grayscaleCheck').checked,
    rotation, flip: flipMode,
    prefix: document.getElementById('filePrefix').value,
    suffix: document.getElementById('fileSuffix').value,
    startNumber: document.getElementById('startNumber').value,
    numDigits: document.getElementById('numDigits').value,
    logoEnabled: document.getElementById('logoEnabled').checked,
    logoSize: document.getElementById('logoSizeRange').value,
    logoMargin: document.getElementById('logoMargin').value,
    logoOpacity: document.getElementById('logoOpacity').value,
    logoPosition, logoRepeat: document.getElementById('logoRepeat').value,
  };
}

function applyConfig(cfg) {
  if (!cfg) return;
  const set = (id, val) => { if (val !== undefined) document.getElementById(id).value = val; };
  set('maxSideInput', cfg.maxSide); set('scalePercent', cfg.scalePercent);
  set('fixedWidth', cfg.fixedWidth); set('fixedHeight', cfg.fixedHeight);
  document.getElementById('allowUpscale').checked = !!cfg.allowUpscale;
  if (cfg.quality) { set('qualityRange', cfg.quality); syncRange('qualityRange', 'qualityVal', 'qualityLabel', '%'); }
  if (cfg.format) { outputFormat = cfg.format; document.querySelectorAll('.format-tab[data-fmt]').forEach(t => t.classList.toggle('active', t.dataset.fmt === cfg.format)); }
  if (cfg.bgColor) { set('bgColor', cfg.bgColor); set('bgColorHex', cfg.bgColor); }
  document.getElementById('transparentBg').checked = !!cfg.transparentBg;
  if (cfg.sharpen !== undefined) { set('sharpRange', cfg.sharpen); document.getElementById('sharpVal').textContent = cfg.sharpen; }
  if (cfg.brightness) { set('brightnessRange', cfg.brightness); document.getElementById('brightnessVal').textContent = cfg.brightness + '%'; }
  if (cfg.contrast) { set('contrastRange', cfg.contrast); document.getElementById('contrastVal').textContent = cfg.contrast + '%'; }
  if (cfg.saturation) { set('saturationRange', cfg.saturation); document.getElementById('saturationVal').textContent = cfg.saturation + '%'; }
  if (cfg.hue !== undefined) { set('hueRange', cfg.hue); document.getElementById('hueVal').textContent = cfg.hue + '°'; }
  if (cfg.blur !== undefined) { set('blurRange', cfg.blur); document.getElementById('blurVal').textContent = cfg.blur + 'px'; }
  document.getElementById('grayscaleCheck').checked = !!cfg.grayscale;
  if (cfg.rotation !== undefined) { rotation = cfg.rotation; document.querySelectorAll('[data-rot]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.rot) === cfg.rotation)); }
  if (cfg.flip) { flipMode = cfg.flip; document.querySelectorAll('[data-flip]').forEach(b => b.classList.toggle('active', b.dataset.flip === cfg.flip)); }
  if (cfg.prefix !== undefined) set('filePrefix', cfg.prefix);
  if (cfg.suffix !== undefined) set('fileSuffix', cfg.suffix);
  if (cfg.startNumber !== undefined) set('startNumber', cfg.startNumber);
  if (cfg.numDigits) set('numDigits', cfg.numDigits);
  if (cfg.logoSize) { set('logoSizeRange', cfg.logoSize); document.getElementById('logoSizeVal').textContent = cfg.logoSize + '%'; }
  if (cfg.logoMargin !== undefined) set('logoMargin', cfg.logoMargin);
  if (cfg.logoOpacity) { set('logoOpacity', cfg.logoOpacity); document.getElementById('logoOpacityVal').textContent = cfg.logoOpacity + '%'; document.getElementById('logoOpacityLabel').textContent = cfg.logoOpacity; }
  if (cfg.logoPosition) { logoPosition = cfg.logoPosition; document.querySelectorAll('.pos-btn').forEach(b => b.classList.toggle('active', b.dataset.pos === cfg.logoPosition)); }
  if (cfg.logoRepeat) set('logoRepeat', cfg.logoRepeat);
}

function updateLastPresetDesc(cfg) {
  if (!cfg) return;
  const t = LANGS[currentLang];
  const el = document.getElementById('lastPresetDesc');
  const parts = [];
  if (cfg.maxSide) parts.push((currentLang === 'es' ? 'Lado máx: ' : 'Max side: ') + cfg.maxSide + 'px');
  if (cfg.scalePercent) parts.push((currentLang === 'es' ? 'Escala: ' : 'Scale: ') + cfg.scalePercent + '%');
  if (cfg.fixedWidth) parts.push('W: ' + cfg.fixedWidth + 'px');
  parts.push(`${(cfg.format || 'jpeg').toUpperCase()} ${cfg.quality || 90}%`);
  el.textContent = parts.join(' · ');
  el.dataset.custom = '1';
}

// ═══════════════════════════════════════
let previewEnabled = false;
let previewDebounceTimer = null;

function updatePreviewVisibility() {
  const sec = document.getElementById('preview-section');
  if (files.length > 0) {
    sec.style.display = 'block';
    if (previewEnabled) schedulePreview();
  } else {
    sec.style.display = 'none';
  }
}

function togglePreview() {
  previewEnabled = !previewEnabled;
  const btn = document.getElementById('previewToggleBtn');
  const t = LANGS[currentLang];
  btn.classList.toggle('active', previewEnabled);
  document.getElementById('preview-btn-label').textContent = previewEnabled ? t.previewToggle : t.previewOff;
  const panel = document.getElementById('preview-panel');
  if (previewEnabled) {
    panel.classList.add('visible');
    schedulePreview();
  } else {
    panel.classList.remove('visible');
  }
}

function schedulePreview() {
  if (!previewEnabled || files.length === 0) return;
  clearTimeout(previewDebounceTimer);
  previewDebounceTimer = setTimeout(renderPreview, 400);
}

async function renderPreview() {
  if (!previewEnabled || files.length === 0) return;
  const srcFile = originalFiles[0] || files[0];
  const t = LANGS[currentLang];

  // Show original
  const origImg = document.getElementById('previewOrigImg');
  const origUrl = URL.createObjectURL(srcFile);
  origImg.src = origUrl;
  origImg.onload = () => URL.revokeObjectURL(origUrl);

  // Show loading
  const resultEl = document.getElementById('previewResult');
  resultEl.innerHTML = `<div class="preview-loading" id="previewLoadingText">${t.previewLoading}</div>`;

  // Read current settings
  const maxSide  = parseInt(document.getElementById('maxSideInput').value) || null;
  const scalePct = parseFloat(document.getElementById('scalePercent').value) || null;
  const fixedW   = parseInt(document.getElementById('fixedWidth').value) || null;
  const fixedH   = parseInt(document.getElementById('fixedHeight').value) || null;
  const allowUp  = document.getElementById('allowUpscale').checked;
  const quality  = parseInt(document.getElementById('qualityRange').value) / 100;
  const useLogo  = document.getElementById('logoEnabled').checked && logoImg;
  const logoSize = parseInt(document.getElementById('logoSizeRange').value) / 100;
  const margin   = parseInt(document.getElementById('logoMargin').value) || 20;
  const opacity  = parseInt(document.getElementById('logoOpacity').value) / 100;
  const logoRpt  = document.getElementById('logoRepeat').value;
  const bgColor  = document.getElementById('transparentBg').checked ? null : document.getElementById('bgColor').value;
  const sharpen  = parseFloat(document.getElementById('sharpRange').value);
  const bright   = parseInt(document.getElementById('brightnessRange').value) / 100;
  const contr    = parseInt(document.getElementById('contrastRange').value) / 100;
  const sat      = parseInt(document.getElementById('saturationRange').value) / 100;
  const hue      = parseInt(document.getElementById('hueRange').value);
  const blur     = parseFloat(document.getElementById('blurRange').value);
  const grey     = document.getElementById('grayscaleCheck').checked;

  try {
    const blob = await processFile(srcFile, { maxSide, scalePct, fixedW, fixedH, allowUp, quality, useLogo, logoSize, margin, opacity, logoRpt, bgColor, sharpen, bright, contr, sat, hue, blur, grey });
    const url = URL.createObjectURL(blob);
    const img = document.createElement('img');

function processFile(file, o) {
  return new Promise(resolve => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let cw, ch;
      const ow = img.width, oh = img.height;
      if (o.scalePct) { cw = Math.round(ow * o.scalePct / 100); ch = Math.round(oh * o.scalePct / 100); }
      else if (o.fixedW && !o.fixedH) { const s = o.fixedW / ow; const fs = (!o.allowUp && s > 1) ? 1 : s; cw = Math.round(ow * fs); ch = Math.round(oh * fs); }
      else if (o.fixedH && !o.fixedW) { const s = o.fixedH / oh; const fs = (!o.allowUp && s > 1) ? 1 : s; cw = Math.round(ow * fs); ch = Math.round(oh * fs); }
      else if (o.fixedW && o.fixedH) { cw = o.fixedW; ch = o.fixedH; }
      else if (o.maxSide) { const lng = Math.max(ow, oh); const s = o.maxSide / lng; const fs = (!o.allowUp && s > 1) ? 1 : s; cw = Math.round(ow * fs); ch = Math.round(oh * fs); }
      else { cw = ow; ch = oh; }

      const swap = rotation === 90 || rotation === 270;
      const canW = swap ? ch : cw, canH = swap ? cw : ch;
      const canvas = document.createElement('canvas');
      canvas.width = canW; canvas.height = canH;
      const ctx = canvas.getContext('2d');

      if (o.bgColor) { ctx.fillStyle = o.bgColor; ctx.fillRect(0, 0, canW, canH); }
      ctx.save();
      ctx.translate(canW / 2, canH / 2);
      if (rotation) ctx.rotate(rotation * Math.PI / 180);
      if (flipMode === 'h') ctx.scale(-1, 1);
      if (flipMode === 'v') ctx.scale(1, -1);

      const fp = [];
      if (o.bright !== 1) fp.push(`brightness(${o.bright})`);
      if (o.contr !== 1) fp.push(`contrast(${o.contr})`);
      if (o.sat !== 1) fp.push(`saturate(${o.sat})`);
      if (o.hue !== 0) fp.push(`hue-rotate(${o.hue}deg)`);
      if (o.blur > 0) fp.push(`blur(${o.blur}px)`);
      if (o.grey) fp.push('grayscale(1)');
      if (fp.length) ctx.filter = fp.join(' ');

      ctx.drawImage(img, -cw / 2, -ch / 2, cw, ch);
      ctx.restore();
      if (o.sharpen > 0) applyConvolution(ctx, canW, canH, o.sharpen);

      if (o.useLogo && logoImg) {
        const lw = Math.round(canW * o.logoSize), lh = Math.round(logoImg.height * (lw / logoImg.width));
        ctx.globalAlpha = o.opacity;
        if (o.logoRpt === 'tile') {
          for (let y = 0; y < canH + lh; y += lh + o.margin) for (let x = 0; x < canW + lw; x += lw + o.margin) ctx.drawImage(logoImg, x, y, lw, lh);
        } else if (o.logoRpt === 'diagonal') {
          const step = lw + o.margin;
          for (let y = -lh; y < canH + lh; y += step) for (let x = -lw; x < canW + lw; x += step) { ctx.save(); ctx.translate(x+lw/2,y+lh/2); ctx.rotate(-Math.PI/6); ctx.drawImage(logoImg,-lw/2,-lh/2,lw,lh); ctx.restore(); }
        } else {
          const { lx, ly } = calcLogoPos(logoPosition, canW, canH, lw, lh, o.margin);
          ctx.drawImage(logoImg, lx, ly, lw, lh);
        }
        ctx.globalAlpha = 1;
      }

      let mime = 'image/jpeg';
      if (outputFormat === 'png') mime = 'image/png';
      else if (outputFormat === 'webp') mime = 'image/webp';
      else if (outputFormat === 'original') mime = file.type || 'image/jpeg';
      canvas.toBlob(blob => resolve(blob), mime, o.quality);
    };
    img.src = url;
  });
}

function calcLogoPos(pos, cw, ch, lw, lh, mg) {
  if (pos === 'center') return { lx: (cw-lw)/2, ly: (ch-lh)/2 };
  return {
    lx: pos.includes('left') ? mg : pos.includes('right') ? cw-lw-mg : (cw-lw)/2,
    ly: pos.includes('top')  ? mg : pos.includes('bottom') ? ch-lh-mg : (ch-lh)/2,
  };
}

function applyConvolution(ctx, w, h, amount) {
  const id = ctx.getImageData(0, 0, w, h), d = id.data, cp = new Uint8ClampedArray(d), a = Math.min(amount, 3);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) {
    const idx = (y*w+x)*4;
    for (let c = 0; c < 3; c++) {
      const ctr = cp[idx+c];
      const nb = cp[((y-1)*w+(x-1))*4+c]+cp[((y-1)*w+x)*4+c]+cp[((y-1)*w+(x+1))*4+c]+cp[(y*w+(x-1))*4+c]+cp[(y*w+(x+1))*4+c]+cp[((y+1)*w+(x-1))*4+c]+cp[((y+1)*w+x)*4+c]+cp[((y+1)*w+(x+1))*4+c];
      d[idx+c] = Math.min(255, Math.max(0, ctr + a*(ctr*8-nb)/8));
    }
  }
  ctx.putImageData(id, 0, 0);
}

async function processPdf(level) {
  if (!currentPdfFile) return;
  const t = LANGS[currentLang];
  const quality = level === 'low' ? 0.90 : 0.72;
  const maxSide = level === 'low' ? 2048 : 1024;

  const progressEl = document.getElementById('pdfProgress');
  const fillEl = document.getElementById('pdfProgressFill');
  const textEl = document.getElementById('pdfProgressText');
  progressEl.style.display = 'block';
  document.querySelectorAll('#pdfModal .modal-btn, #pdf-modal-cancel').forEach(b => b.style.pointerEvents = 'none');

  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const arrayBuffer = await currentPdfFile.arrayBuffer();
    const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const numPages = pdfDoc.numPages;
    const pageBlobs = [];

    for (let i = 1; i <= numPages; i++) {
      fillEl.style.width = ((i - 1) / numPages * 100) + '%';
      textEl.textContent = t.pdfProcessing(i + '/' + numPages);
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({ scale: 2 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;

      // Resize if needed
      const ow = canvas.width, oh = canvas.height;
      const lng = Math.max(ow, oh);
      if (lng > maxSide) {
        const scale = maxSide / lng;
        const c2 = document.createElement('canvas');
        c2.width = Math.round(ow * scale);
        c2.height = Math.round(oh * scale);
        const ctx2 = c2.getContext('2d');
        ctx2.drawImage(canvas, 0, 0, c2.width, c2.height);
        const blob = await new Promise(res => c2.toBlob(res, 'image/jpeg', quality));
        pageBlobs.push(blob);
      } else {
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
        pageBlobs.push(blob);
      }
      await new Promise(r => setTimeout(r, 0));
    }

    fillEl.style.width = '100%';
    textEl.textContent = t.pdfDone;

    // Build PDF from images using jsPDF-like approach via canvas data URLs
    // We'll create a minimal PDF manually
    await buildPdfFromBlobs(pageBlobs, currentPdfFile.name.replace('.pdf','') + '_compressed.pdf');
    setTimeout(closePdfModal, 800);
  } catch(err) {
    textEl.textContent = 'Error: ' + err.message;
    console.error(err);
  }
  document.querySelectorAll('#pdfModal .modal-btn, #pdf-modal-cancel').forEach(b => b.style.pointerEvents = '');
}

async function buildPdfFromBlobs(blobs, filename) {
  // Build a valid PDF with each image as a full page
  const pages = await Promise.all(blobs.map(blob => new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => res({ dataUrl: e.target.result, w: img.width, h: img.height });
      img.src = e.target.result;
    };
    reader.readAsDataURL(blob);
  })));

  // Minimal PDF builder
  const objects = [];
  let oid = 1;
  const obj = (content) => { const id = oid++; objects.push({ id, content }); return id; };

  const pageIds = [];
  const contentIds = [];
  const imgIds = [];

  for (let i = 0; i < pages.length; i++) {
    const { dataUrl, w, h } = pages[i];
    const b64 = dataUrl.split(',')[1];
    const imgId = obj(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${atob(b64).length} >>\nstream\n`);
    imgIds.push({ id: imgId, b64, w, h });

    const contentStr = `q ${w} 0 0 ${h} 0 0 cm /Im${i+1} Do Q`;
    const contentId = obj(`<< /Length ${contentStr.length} >>\nstream\n${contentStr}\nendstream`);
    contentIds.push(contentId);

    const pageId = obj(`<< /Type /Page /Parent 0 /MediaBox [0 0 ${w} ${h}] /Contents ${contentId} 0 R /Resources << /XObject << /Im${i+1} ${imgId} 0 R >> >> >>`);
    pageIds.push(pageId);
  }

  // Simple approach: use a Blob with proper PDF structure via canvas
  // Actually let's use a simpler working approach: stitch images into a proper PDF
  // Using the approach of encoding each JPEG page into a real PDF
  const pdfParts = [];
  const enc = new TextEncoder();

  // PDF header
  pdfParts.push(enc.encode('%PDF-1.4\n'));

  const offsets = [];
  let pos = pdfParts[0].byteLength;

  // Write each page as PDF image object
  const pageObjectIds = { catalog: 1, pages: 2 };
  let nextId = 3;
  const pageInfos = [];

  for (let i = 0; i < pages.length; i++) {
    const { dataUrl, w, h } = pages[i];
    const jpegBytes = Uint8Array.from(atob(dataUrl.split(',')[1]), c => c.charCodeAt(0));

    // Image object
    const imgObjId = nextId++;
    const imgHeader = enc.encode(`${imgObjId} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    const imgFooter = enc.encode('\nendstream\nendobj\n');
    offsets[imgObjId] = pos;
    pdfParts.push(imgHeader, jpegBytes, imgFooter);
    pos += imgHeader.byteLength + jpegBytes.byteLength + imgFooter.byteLength;

    // Content stream
    const contentObjId = nextId++;
    const contentStr = `q ${w} 0 0 ${h} 0 0 cm /Im${i} Do Q`;
    const contentData = enc.encode(`${contentObjId} 0 obj\n<< /Length ${contentStr.length} >>\nstream\n${contentStr}\nendstream\nendobj\n`);
    offsets[contentObjId] = pos;
    pdfParts.push(contentData);
    pos += contentData.byteLength;

    // Page object
    const pageObjId = nextId++;
    const pageData = enc.encode(`${pageObjId} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Contents ${contentObjId} 0 R /Resources << /XObject << /Im${i} ${imgObjId} 0 R >> >> >>\nendobj\n`);
    offsets[pageObjId] = pos;
    pdfParts.push(pageData);
    pos += pageData.byteLength;

    pageInfos.push(pageObjId);
  }

  // Pages object (id=2)
  offsets[2] = pos;
  const pagesData = enc.encode(`2 0 obj\n<< /Type /Pages /Kids [${pageInfos.map(id => id + ' 0 R').join(' ')}] /Count ${pageInfos.length} >>\nendobj\n`);
  pdfParts.push(pagesData);
  pos += pagesData.byteLength;

  // Catalog (id=1)
  offsets[1] = pos;
  const catalogData = enc.encode(`1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`);
  pdfParts.push(catalogData);
  pos += catalogData.byteLength;

  // XRef
  const xrefPos = pos;
  const totalObjs = nextId;
  let xref = `xref\n0 ${totalObjs}\n0000000000 65535 f \n`;
  for (let i = 1; i < totalObjs; i++) {
    xref += (offsets[i] || 0).toString().padStart(10, '0') + ' 00000 n \n';
  }
  xref += `trailer\n<< /Size ${totalObjs} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`;
  pdfParts.push(enc.encode(xref));

  // Assemble
  const totalLen = pdfParts.reduce((a, p) => a + p.byteLength, 0);
  const out = new Uint8Array(totalLen);
  let offset = 0;
  for (const part of pdfParts) { out.set(part, offset); offset += part.byteLength; }

  const blob = new Blob([out], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ── Tour lock handlers (stored so we can remove them) ──
function _tourPreventScroll(e) {
  // Allow scrolling inside the tour bubble itself
  if (e.target && document.getElementById('tourBubble').contains(e.target)) return;
  e.preventDefault();
  e.stopPropagation();
}
function _tourPreventKey(e) {
  const blocked = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End',' '];
  if (blocked.includes(e.key)) { e.preventDefault(); e.stopPropagation(); }
  // Block Ctrl+plus/minus/0 (zoom)
  if (e.ctrlKey && ['+','-','=','0'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); }
}
function _tourPreventZoomWheel(e) {
  if (e.ctrlKey) { e.preventDefault(); e.stopPropagation(); }
}
function _tourPreventTouch(e) {
  if (e.touches && e.touches.length > 1) { e.preventDefault(); } // pinch-to-zoom
}

function tourLockPage() {
  // Freeze scroll position
  window.__tourScrollY = window.scrollY;
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';
  window.addEventListener('wheel',      _tourPreventZoomWheel, { passive: false });
  window.addEventListener('keydown',    _tourPreventKey,       { passive: false });
  window.addEventListener('touchmove',  _tourPreventTouch,     { passive: false });
}

function tourUnlockPage() {
  document.body.style.overflow = '';
  document.documentElement.style.overflow = '';
  window.removeEventListener('wheel',      _tourPreventZoomWheel);
  window.removeEventListener('keydown',    _tourPreventKey);
  window.removeEventListener('touchmove',  _tourPreventTouch);
}

function startTour() {
  tourSteps = getTourSteps(currentLang);
  tourStep = 0;
  isTourActive = true;
  document.getElementById('tourOverlay').classList.remove('hidden');
  tourLockPage();
  renderTourStep();
}

function endTour() {
  isTourActive = false;
  document.getElementById('tourOverlay').classList.add('hidden');
  tourUnlockPage();
  // Restore any elements that were temporarily shown
  document.querySelectorAll('[data-tour-hidden]').forEach(el => {
    el.style.display = 'none';
    delete el.dataset.tourHidden;
  });
}

function tourNav(dir) {
  tourStep = Math.max(0, Math.min(tourSteps.length - 1, tourStep + dir));
  renderTourStep();
}

// Returns a merged bounding rect covering all selectors in the given array
function getTourRect(selectors) {
  let top = Infinity, left = Infinity, bottom = -Infinity, right = -Infinity;
  let found = false;
  selectors.forEach(sel => {
    const el = document.querySelector(sel);
    if (!el) return;
    // Temporarily show if hidden
    const hidden = getComputedStyle(el).display === 'none';
    if (hidden) { el.style.display = 'block'; el.dataset.tourHidden = '1'; }
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    found = true;
    top    = Math.min(top,    r.top);
    left   = Math.min(left,   r.left);
    bottom = Math.max(bottom, r.bottom);
    right  = Math.max(right,  r.right);
  });
  if (!found) return null;
  return { top, left, bottom, right, width: right - left, height: bottom - top };
}

function renderTourStep() {
  tourSteps = getTourSteps(currentLang);
  const t = LANGS[currentLang];
  const s = tourSteps[tourStep];
  if (!s) return;

  document.getElementById('tourStepLabel').textContent = s.step;
  document.getElementById('tourTitle').textContent = s.title;
  document.getElementById('tourDesc').textContent = s.desc;
  const tipEl = document.getElementById('tourTip');
  if (s.tip) { tipEl.textContent = s.tip; tipEl.style.display = 'block'; }
  else { tipEl.style.display = 'none'; }
  document.getElementById('tourCounter').textContent = `${tourStep + 1} / ${tourSteps.length}`;
  document.getElementById('tourPrevBtn').textContent = t.tourPrev;
  document.getElementById('tourPrevBtn').style.display = tourStep === 0 ? 'none' : '';
  const isLast = tourStep === tourSteps.length - 1;
  document.getElementById('tourNextBtn').textContent = isLast ? t.tourFinish : t.tourNext;
  document.getElementById('tourCloseBtn').textContent = t.tourClose;
  document.getElementById('tourNextBtn').onclick = isLast ? endTour : () => tourNav(1);

  // Targets: array of CSS selectors whose union defines the spotlight area
  const targets = s.targets || [s.target];

  // First pass: find the primary target to scroll to, then recompute rect
  const primaryEl = document.querySelector(targets[0]);
  if (primaryEl) {
    // Temporarily unlock scroll just long enough to scroll, then re-lock
    tourUnlockPage();
    primaryEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => {
      if (isTourActive) tourLockPage();
      // After scroll settles, compute union rect and place spotlight + bubble
      setTimeout(() => {
        const rect = getTourRect(targets);
        if (rect) positionTour(rect, s.arrow);
      }, 60);
    }, 380);
  }
}

function positionTour(r, arrow) {
  const bubble  = document.getElementById('tourBubble');
  const spotlight = document.getElementById('tourSpotlight');
  const pad = 10;
  const bw  = 340;
  const gap = 18;

  // Place spotlight
  spotlight.style.top    = (r.top    - pad) + 'px';
  spotlight.style.left   = (r.left   - pad) + 'px';
  spotlight.style.width  = (r.width  + pad * 2) + 'px';
  spotlight.style.height = (r.height + pad * 2) + 'px';

  // Measure bubble height so we can clamp properly
  bubble.style.visibility = 'hidden';
  bubble.style.display = 'block';
  const bh = bubble.offsetHeight || 260;
  bubble.style.visibility = '';

  const vh = window.innerHeight;
  const vw = window.innerWidth;

  let bTop, bLeft;
  let actualArrow = arrow;

  if (arrow === 'top') {
    // Try to place bubble below the spotlight
    bTop = r.bottom + pad + gap;
    if (bTop + bh > vh - 10) {
      // Not enough room below — place above instead
      bTop = r.top - pad - gap - bh;
      actualArrow = 'bottom';
    }
    bLeft = Math.max(12, Math.min(r.left, vw - bw - 12));
  } else if (arrow === 'bottom') {
    bTop = r.top - pad - gap - bh;
    if (bTop < 10) { bTop = r.bottom + pad + gap; actualArrow = 'top'; }
    bLeft = Math.max(12, Math.min(r.left, vw - bw - 12));
  } else {
    bTop  = Math.max(10, r.top);
    bLeft = r.right + gap;
    if (bLeft + bw > vw - 12) bLeft = r.left - bw - gap;
  }

  // Final clamp
  if (bTop + bh > vh - 10) bTop = vh - bh - 10;
  if (bTop < 10) bTop = 10;
  if (bLeft + bw > vw - 8) bLeft = vw - bw - 8;
  if (bLeft < 8) bLeft = 8;

  bubble.style.top   = bTop + 'px';
  bubble.style.left  = bLeft + 'px';
  bubble.style.width = bw + 'px';
  bubble.className   = 'tour-bubble arrow-' + actualArrow;
}

  currentLang = detectLang();
  applyLang(currentLang);
  const last = loadLastConfig();
  if (last) updateLastPresetDesc(last);
  hookPreviewListeners();
});
