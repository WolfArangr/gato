<body>
<header>

  </div>
  <h1>Horario Zwilling - MFO</h1>
</header>

<div class="controls">
  <label>Mes:
    <select id="mesSelect"></select>
  </label>
  <label>Empleado:
    <select id="empleadoSelect">
      <option value="Todos">Todos</option>
    </select>
  </label>
  <label>Semana:
    <select id="semanaSelect"></select>
  </label>
  <button id="btnMes">📥 Descargar Mes (PNG)</button>
  <button id="btnSemana">📥 Descargar Semana (PNG)</button>
  <button id="btnPDFHorizontal" class="pdf-btn">📄 PDF Horario Horizontal</button>
</div>

<div id="loading" class="loading">Buscando meses disponibles en /MFO y cargando horario …</div>

<div class="table-container" id="mesContainer" style="display:none">
  <h2>Overview del Mes</h2>
  <div id="mesTable"></div>
</div>

<div class="table-container" id="semanaContainer" style="display:none">
  <h2>Overview de la Semana</h2>
  <div id="semanaTable"></div>
</div>

<script>
// ──────────────────────────────────────────────
// CONFIGURACIÓN MESES  (sin cambios)
// ──────────────────────────────────────────────
const monthOrder = {
  ENERO:1, FEBRERO:2, MARZO:3, ABRIL:4, MAYO:5, JUNIO:6,
  JULIO:7, AGOSTO:8, SEPTIEMBRE:9, OCTUBRE:10, NOVIEMBRE:11, DICIEMBRE:12
};
const possibleMonths = Object.keys(monthOrder);
const year = '26';
const possibleFiles = possibleMonths.map(m => `/MFO/MFO ${m}${year}.xlsx`);
const mesSelect    = document.getElementById('mesSelect');
const empleadoSelect = document.getElementById('empleadoSelect');
const semanaSelect = document.getElementById('semanaSelect');
const loading      = document.getElementById('loading');
const mesContainer = document.getElementById('mesContainer');
const semanaContainer = document.getElementById('semanaContainer');
const mesTableDiv  = document.getElementById('mesTable');
const semanaTableDiv = document.getElementById('semanaTable');

let currentPath = '';
let headers = [];
let data = [];
let daysInMonth = 0;
let currentMonthName = '';

// ──────────────────────────────────────────────
// Funciones originales (sin cambios en la mayoría)
// ──────────────────────────────────────────────
async function getAvailableFiles() { /* igual */ }
async function loadSchedule(path) { /* igual */ }
function renderTables() { /* igual */ }
function createHorizontalTable(head, rows, startDay, endDay) { /* igual */ }
function createDayByDayCalendar() { /* igual */ }
function downloadPNG(containerIdOrElement, filename) { /* igual */ }

// ──────────────────────────────────────────────
// NUEVA: Obtiene la hora de inicio más temprana de un empleado
// Acepta formatos como "06:00-14:00", "Tarde", "Mañana", "Libre", etc.
// ──────────────────────────────────────────────
function getEarliestStartTime(row) {
  let minHour = 24;
  for (let col = 1; col < row.length; col++) {
    let turno = String(row[col] || '').trim();
    if (!turno || turno === '-' || turno.toLowerCase().includes('libre')) continue;

    let match = turno.match(/^(\d{1,2}):\d{2}/);
    if (match) {
      let h = parseInt(match[1], 10);
      if (h < minHour) minHour = h;
      continue;
    }

    // Palabras clave aproximadas
    if (/mañan|6|7|8/i.test(turno)) minHour = Math.min(minHour, 7);
    if (/tard|14|15|16/i.test(turno)) minHour = Math.min(minHour, 14);
    if (/noch|22|23|0/i.test(turno)) minHour = Math.min(minHour, 22);
  }
  return minHour;
}

// ──────────────────────────────────────────────
// NUEVA: Genera PDF horizontal ordenado por horario
// ──────────────────────────────────────────────
function generateHorizontalPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

  // Título
  doc.setFontSize(16);
  doc.setTextColor(237, 28, 36); // #ed1c24
  doc.text(`Horario ${currentMonthName} - Zwilling MFO`, 15, 12);

  doc.setFontSize(10);
  doc.setTextColor(0);
  doc.text(`Generado el ${new Date().toLocaleDateString('es-ES')}`, 15, 18);

  // Preparar datos ─ solo empleados con al menos un turno
  let employees = data
    .filter(row => String(row[0]).trim())
    .map(row => ({
      name: String(row[0]).trim(),
      rowData: row,
      earliest: getEarliestStartTime(row)
    }))
    .filter(e => e.earliest < 24); // al menos un turno detectado

  // Ordenar por hora más temprana, luego por nombre
  employees.sort((a,b) => {
    if (a.earliest !== b.earliest) return a.earliest - b.earliest;
    return a.name.localeCompare(b.name);
  });

  // Construir body para autoTable
  const body = employees.map(e => {
    const cells = [e.name];
    for (let d = 1; d <= daysInMonth; d++) {
      let val = String(e.rowData[d] || '').trim();
      cells.push(val || '-');
    }
    return cells;
  });

  // Cabecera
  const head = [headers.map((h,i) => i===0 ? "Empleado" : h)];

  // Generar tabla
  doc.autoTable({
    head: head,
    body: body,
    startY: 28,
    theme: 'grid',
    styles: {
      fontSize: 8,
      cellPadding: 2.2,
      overflow: 'linebreak',
      halign: 'center',
      lineWidth: 0.1,
      lineColor: [220,220,220]
    },
    headStyles: {
      fillColor: [237, 28, 36],
      textColor: 255,
      fontSize: 8.5,
      fontStyle: 'bold'
    },
    columnStyles: {
      0: { 
        cellWidth: 38, 
        halign: 'left', 
        fillColor: [250,250,250] 
      }
    },
    margin: { top: 28, left: 12, right: 12 },
    didParseCell(data) {
      // Días fin de semana
      if (data.column.index >= 1) {
        const dayNum = data.column.index;
        if (dayNum % 7 === 1 || dayNum % 7 === 0) {
          data.cell.styles.fillColor = [255, 235, 238]; // #ffebee
        }
      }
    }
  });

  // Pie de página simple
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.text(`Página ${i} de ${pageCount} — Horario confidencial`, 15, doc.internal.pageSize.height - 10);
  }

  // Descargar
  const filename = `Horario_Horizontal_${currentMonthName.replace(/ /g,'_')}_2026.pdf`;
  doc.save(filename);
}

// ──────────────────────────────────────────────
// Eventos (se añade el nuevo botón)
// ──────────────────────────────────────────────
mesSelect.onchange = () => {
  currentPath = mesSelect.value;
  loading.style.display = 'block';
  mesContainer.style.display = 'none';
  semanaContainer.style.display = 'none';
  loadSchedule(currentPath);
};

empleadoSelect.onchange = renderTables;
semanaSelect.onchange = renderTables;

document.getElementById('btnSemana').onclick = () =>
  downloadPNG('semanaTable', `Horario_Semana_${currentMonthName.replace(/ /g,'_')}.png`);

document.getElementById('btnMes').onclick = () => {
  const emp = empleadoSelect.value;
  const filename = `Horario_Mes_${currentMonthName.replace(/ /g,'_')}.png`;
  if (emp === 'Todos') {
    const tempDiv = document.createElement('div');
    tempDiv.style.padding = '20px';
    tempDiv.style.background = '#f9f9f9';
    tempDiv.style.maxWidth = '800px';
    tempDiv.style.margin = '0 auto';
    const title = document.createElement('h2');
    title.textContent = `Horario Completo - ${currentMonthName}`;
    title.style.color = '#ed1c24';
    title.style.textAlign = 'center';
    tempDiv.appendChild(title);
    tempDiv.appendChild(createDayByDayCalendar());
    document.body.appendChild(tempDiv);
    downloadPNG(tempDiv, filename);
    document.body.removeChild(tempDiv);
  } else {
    downloadPNG('mesTable', filename);
  }
};

// ¡Nuevo evento!
document.getElementById('btnPDFHorizontal').onclick = generateHorizontalPDF;

// ──────────────────────────────────────────────
// Inicio
// ──────────────────────────────────────────────
(async () => {
  const available = await getAvailableFiles();
  if (available.length === 0) {
    loading.innerHTML = 'No se encontraron archivos en /MFO/';
    return;
  }
  available.forEach(path => {
    const m = path.match(/ ([A-Z]+)26/)[1];
    const display = `${m} 2026`;
    const opt = new Option(display, path);
    if (m === 'FEBRERO') opt.selected = true;
    mesSelect.appendChild(opt);
  });
  currentPath = mesSelect.value;
  await loadSchedule(currentPath);
})();
</script>
</body>
</html>
