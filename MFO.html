<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Horario Zwilling - MFO</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    .logo img {
      max-width: 220px;
      height: auto;
    }
    h1 {
      margin: 10px 0;
      color: #1a3c6e;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin: 20px 0;
    }
    .controls select, .controls button {
      padding: 8px 12px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .controls button {
      background: #1a3c6e;
      color: white;
      border: none;
      cursor: pointer;
    }
    .controls button:hover {
      background: #254e8f;
    }
    .table-container {
      margin: 30px 0;
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 16px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 9px 10px;
      text-align: center;
      font-size: 0.92rem;
    }
    th {
      background: #e8eef7;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    td.name {
      font-weight: 500;
      text-align: left;
      background: #fafafa;
      min-width: 180px;
    }
    .weekend {
      background: #e3f2fd !important;
    }
    .empty { color: #aaa; }
    .loading {
      text-align: center;
      font-size: 1.2rem;
      color: #555;
      padding: 60px 0;
    }
    @media (max-width: 800px) {
      .controls { flex-direction: column; align-items: stretch; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<header>
  <div class="logo">
    <!-- Cambia por tu logo real -->
    <img src="https://via.placeholder.com/220x80/1a3c6e/ffffff?text=Zwilling+MFO" alt="Zwilling MFO">
  </div>
  <h1>Horario Zwilling - MFO</h1>
</header>

<div class="controls">
  <label>Mes: <b>Febrero 2026</b></label>
  <label>Empleado:
    <select id="empleadoSelect">
      <option value="Todos">Todos</option>
    </select>
  </label>
  <label>Semana:
    <select id="semanaSelect">
      <option value="Todas">Todo el mes</option>
      <option value="1">Semana 1 (1–7)</option>
      <option value="2">Semana 2 (8–14)</option>
      <option value="3">Semana 3 (15–21)</option>
      <option value="4">Semana 4 (22–28)</option>
    </select>
  </label>
  <button id="btnMes">📥 Descargar Mes (PNG)</button>
  <button id="btnSemana">📥 Descargar Semana (PNG)</button>
</div>

<div id="loading" class="loading">Cargando horario desde /MFO/MFO FEBRERO26.xlsx …</div>

<div class="table-container" id="mesContainer" style="display:none">
  <h2>Overview del Mes</h2>
  <div id="mesTable"></div>
</div>

<div class="table-container" id="semanaContainer" style="display:none">
  <h2>Overview de la Semana</h2>
  <div id="semanaTable"></div>
</div>

<script>
const PATH = '/MFO/MFO FEBRERO26.xlsx';

const empleadoSelect = document.getElementById('empleadoSelect');
const semanaSelect   = document.getElementById('semanaSelect');
const loading        = document.getElementById('loading');
const mesContainer   = document.getElementById('mesContainer');
const semanaContainer= document.getElementById('semanaContainer');
const mesTableDiv    = document.getElementById('mesTable');
const semanaTableDiv = document.getElementById('semanaTable');

let headers = [];
let data = [];

async function loadSchedule() {
  try {
    const resp = await fetch(PATH);
    if (!resp.ok) throw new Error(`No se pudo cargar ${PATH} – ${resp.status}`);
    const arrayBuffer = await resp.arrayBuffer();
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

    // Suponemos que la fila 2 (índice 2) son los encabezados con días
    headers = json[2] || [];
    data = json.slice(3).filter(row => row[0] && String(row[0]).trim());

    // Llenar select de empleados
    data.forEach(row => {
      const nombre = String(row[0]).trim();
      if (nombre) {
        const opt = document.createElement('option');
        opt.value = nombre;
        opt.textContent = nombre;
        empleadoSelect.appendChild(opt);
      }
    });

    loading.style.display = 'none';
    mesContainer.style.display = 'block';
    semanaContainer.style.display = 'block';

    renderTables();

  } catch (err) {
    loading.innerHTML = `Error al cargar el horario:<br><pre>${err.message}</pre>`;
    console.error(err);
  }
}

function renderTables() {
  const emp = empleadoSelect.value;
  const sem = semanaSelect.value;

  const filtered = emp === 'Todos'
    ? data
    : data.filter(r => String(r[0]).trim() === emp);

  // Mes completo
  mesTableDiv.innerHTML = '';
  mesTableDiv.appendChild(createTable(headers, filtered, 1, 28));

  // Semana
  let start = 1, end = 28;
  if (sem !== 'Todas') {
    const w = Number(sem);
    start = (w-1)*7 + 1;
    end   = Math.min(start + 6, 28);
  }
  const weekHeaders = [headers[0], ...headers.slice(start, end+1)];
  const weekData = filtered.map(r => [r[0], ...r.slice(start, end+1)]);

  semanaTableDiv.innerHTML = '';
  semanaTableDiv.appendChild(createTable(weekHeaders, weekData, start, end));
}

function createTable(head, rows, startDay, endDay) {
  const table = document.createElement('table');

  // encabezado
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  head.forEach((txt, i) => {
    const th = document.createElement('th');
    th.textContent = txt || '';
    if (i >= 1) {
      const d = startDay + i - 1;
      if (d % 7 === 1 || d % 7 === 0) th.className = 'weekend';
    }
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  // cuerpo
  const tbody = document.createElement('tbody');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach((cell, i) => {
      const td = document.createElement('td');
      td.textContent = cell || '';
      if (i === 0) td.className = 'name';
      else {
        const d = startDay + i - 1;
        if (d % 7 === 1 || d % 7 === 0) td.className = 'weekend';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  return table;
}

function downloadPNG(containerId, filename) {
  const el = document.getElementById(containerId);
  html2canvas(el, { scale: 2, useCORS: true }).then(canvas => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = filename;
    a.click();
  }).catch(err => alert('Error al generar imagen:\n' + err.message));
}

// Eventos
empleadoSelect.onchange = renderTables;
semanaSelect.onchange   = renderTables;
document.getElementById('btnMes').onclick    = () => downloadPNG('mesTable',    'Horario_Mes_Febrero2026.png');
document.getElementById('btnSemana').onclick = () => downloadPNG('semanaTable', 'Horario_Semana_Febrero2026.png');

// Inicio
loadSchedule();
</script>
</body>
</html>
