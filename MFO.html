<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Horario Zwilling - MFO</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {font-family: 'Roboto', sans-serif; background:#f9f9f9; margin:0; padding:15px; color:#333;}
    header {text-align:center; margin-bottom:25px;}
    .logo img {max-width:190px; height:auto;}
    h1 {margin:10px 0; color:#ed1c24; font-size:1.75rem; font-weight:700;}
    
    .controls {
      display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:20px 0; padding:0 10px;
    }
    .controls select {
      padding:9px 14px; font-size:1.05rem; border-radius:8px; border:1px solid #ddd;
    }
    .controls button {
      padding:9px 18px; background:#ed1c24; color:white; border:none; border-radius:8px; font-weight:500; cursor:pointer;
    }
    .controls button:hover {background:#c8101d;}

    .table-container {
      margin:30px 0; background:white; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.1); overflow:hidden;
    }
    h2 {text-align:center; color:#ed1c24; padding:16px; margin:0; background:#fff5f5; font-size:1.35rem;}

    /* Mobile-first vertical cards */
    @media (max-width: 768px) {
      table {border:0;}
      thead {display:none;}
      tbody tr {display:block; margin:12px 8px; border:1px solid #ddd; border-radius:10px; overflow:hidden; box-shadow:0 3px 10px rgba(0,0,0,0.08);}
      td {
        display:block; text-align:right; padding:12px 16px; border:none; border-bottom:1px solid #eee;
        position:relative; padding-left:55%;
      }
      td:before {
        content: attr(data-label);
        position:absolute; left:16px; width:48%; font-weight:600; text-align:left; color:#ed1c24;
      }
      td.name {
        text-align:center; font-size:1.25rem; font-weight:700; background:#ed1c24 !important;
        color:white; padding:14px !important; border-bottom:none; border-radius:10px 10px 0 0;
      }
      td.name:before {display:none;}
      .weekend td {background:#ffebee !important;}
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://kitchenbits.com/cdn/shop/collections/zwilling_logo.png?v=1628181183&width=1193" alt="Zwilling">
  </div>
  <h1 id="title">Horario Zwilling - MFO</h1>
</header>

<div class="controls">
  <label><b>Mes:</b>
    <select id="mesSelect"><option>Cargando meses...</option></select>
  </label>
  <label><b>Empleado:</b>
    <select id="empleadoSelect"><option value="Todos">Todos</option></select>
  </label>
  <label><b>Semana:</b>
    <select id="semanaSelect">
      <option value="Todas">Todo el mes</option>
      <option value="1">Semana 1 (1–7)</option>
      <option value="2">Semana 2 (8–14)</option>
      <option value="3">Semana 3 (15–21)</option>
      <option value="4">Semana 4 (22–28)</option>
    </select>
  </label>
  <button id="btnMes">📥 Descargar Mes (PNG)</button>
  <button id="btnSemana">📥 Descargar Semana (PNG)</button>
</div>

<div id="loading" style="text-align:center; padding:80px; font-size:1.3rem; color:#555;">
  Buscando archivos de horarios disponibles...
</div>

<div class="table-container" id="mesContainer" style="display:none">
  <h2>Overview del Mes</h2>
  <div id="mesTable"></div>
</div>

<div class="table-container" id="semanaContainer" style="display:none">
  <h2>Overview de la Semana</h2>
  <div id="semanaTable"></div>
</div>

<script>
const monthNames = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

const possibleMonths = [];
for (let y = 2025; y <= 2028; y++) {
  monthNames.forEach(mes => {
    possibleMonths.push({
      label: mes.charAt(0) + mes.slice(1).toLowerCase() + ` ${y}`,
      file: `MFO ${mes} ${y.toString().slice(-2)}.xlsx`
    });
  });
}

let currentData = [];
let headers = [];

const mesSelect = document.getElementById('mesSelect');
const empleadoSelect = document.getElementById('empleadoSelect');
const semanaSelect = document.getElementById('semanaSelect');
const loading = document.getElementById('loading');
const title = document.getElementById('title');

async function detectAvailableMonths() {
  const promises = possibleMonths.map(async m => {
    try {
      const r = await fetch(`/MFO/${m.file}`, { method: 'HEAD' });
      return r.ok ? m : null;
    } catch(e) { return null; }
  });

  const results = await Promise.all(promises);
  const available = results.filter(Boolean);

  // Ordenar cronológicamente
  available.sort((a,b) => a.label.localeCompare(b.label));

  mesSelect.innerHTML = '';
  available.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.file;
    opt.textContent = m.label;
    mesSelect.appendChild(opt);
  });

  // Seleccionar Febrero 2026 por defecto si existe
  const feb = available.find(m => m.label.includes("Febrero 2026"));
  if (feb) mesSelect.value = feb.file;

  return available.length > 0;
}

async function loadSchedule() {
  const filename = mesSelect.value;
  if (!filename) return;

  const currentMonth = mesSelect.options[mesSelect.selectedIndex].text;
  title.textContent = `Horario Zwilling - MFO ${currentMonth}`;

  loading.style.display = 'block';
  document.getElementById('mesContainer').style.display = 'none';
  document.getElementById('semanaContainer').style.display = 'none';

  try {
    const resp = await fetch(`/MFO/${filename}`);
    if (!resp.ok) throw new Error('Archivo no encontrado');
    const ab = await resp.arrayBuffer();
    const wb = XLSX.read(ab, {type:'array'});
    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});

    headers = json[2] || [];
    currentData = json.slice(3).filter(r => r[0] && String(r[0]).trim());

    populateEmployees();
    loading.style.display = 'none';
    document.getElementById('mesContainer').style.display = 'block';
    document.getElementById('semanaContainer').style.display = 'block';
    renderTables();

  } catch(e) {
    loading.innerHTML = `Error cargando ${filename}<br><small>${e.message}</small>`;
  }
}

function populateEmployees() {
  empleadoSelect.innerHTML = '<option value="Todos">Todos</option>';
  currentData.forEach(row => {
    const name = String(row[0]).trim();
    if (name) {
      const opt = new Option(name, name);
      empleadoSelect.add(opt);
    }
  });
}

function renderTables() {
  const emp = empleadoSelect.value;
  const filtered = emp === 'Todos' ? currentData : currentData.filter(r => String(r[0]).trim() === emp);

  // Mes completo
  document.getElementById('mesTable').innerHTML = '';
  document.getElementById('mesTable').appendChild(createTable(headers, filtered, 1, 31));

  // Semana seleccionada
  let start = 1, end = 31;
  const sem = semanaSelect.value;
  if (sem !== 'Todas') {
    const w = +sem;
    start = (w-1)*7 + 1;
    end = Math.min(start + 6, 31);
  }
  const weekHeaders = [headers[0], ...headers.slice(start, end+1)];
  const weekData = filtered.map(r => [r[0], ...r.slice(start, end+1)]);

  document.getElementById('semanaTable').innerHTML = '';
  document.getElementById('semanaTable').appendChild(createTable(weekHeaders, weekData, start, end));
}

function createTable(head, rows, startDay) {
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  head.forEach((txt,i) => {
    const th = document.createElement('th');
    th.textContent = txt || '';
    if (i >= 1) {
      const d = startDay + i - 1;
      if (d % 7 === 1 || d % 7 === 0) th.classList.add('weekend');
    }
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach((cell, i) => {
      const td = document.createElement('td');
      td.textContent = cell || '-';
      td.dataset.label = head[i] || '';
      if (i === 0) td.classList.add('name');
      else if ((startDay + i - 1) % 7 === 1 || (startDay + i - 1) % 7 === 0) td.classList.add('weekend');
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function downloadPNG(id, name) {
  html2canvas(document.getElementById(id), {scale: 2}).then(canvas => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL();
    a.download = name;
    a.click();
  });
}

// Eventos
mesSelect.onchange = loadSchedule;
empleadoSelect.onchange = renderTables;
semanaSelect.onchange = renderTables;
document.getElementById('btnMes').onclick = () => downloadPNG('mesTable', `Horario_${mesSelect.options[mesSelect.selectedIndex].text}.png`);
document.getElementById('btnSemana').onclick = () => downloadPNG('semanaTable', `Horario_Semana_${mesSelect.options[mesSelect.selectedIndex].text}.png`);

// Inicio
detectAvailableMonths().then(hasFiles => {
  if (hasFiles) loadSchedule();
  else loading.textContent = "No se encontraron archivos .xlsx en /MFO/";
});
</script>
</body>
</html>
