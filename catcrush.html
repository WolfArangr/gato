<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat Crush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        #header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(15, 15, 30, 0.8);
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .score-box {
            text-align: center;
        }

        .score-label {
            color: #00ffff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px #00ffff;
        }

        .score-value {
            color: #ff00ff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 15px #ff00ff;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: rgba(10, 10, 25, 0.9);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            max-width: 400px;
            width: 100%;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1a1a3e 0%, #2a1a4e 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid rgba(0, 255, 255, 0.2);
            position: relative;
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.selected {
            background: linear-gradient(135deg, #ff00ff 0%, #00ffff 100%);
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .cell.matched {
            animation: match 0.4s ease forwards;
        }

        @keyframes match {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: scale(0) rotate(20deg); opacity: 0; }
        }

        .cell.falling {
            animation: fall 0.4s ease;
        }

        @keyframes fall {
            from { transform: translateY(-100%); opacity: 0.5; }
            to { transform: translateY(0); opacity: 1; }
        }

        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: #00ffff;
            padding: 30px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 1000;
            border: 3px solid #ff00ff;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.6);
            text-shadow: 0 0 10px #00ffff;
        }

        #reset-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #ff00ff 0%, #00ffff 100%);
            border: none;
            color: #000;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        #reset-btn:active {
            transform: scale(0.95);
        }

        .pointer-events-none {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">
            <div class="score-box">
                <div class="score-label">Puntos</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Movimientos</div>
                <div class="score-value" id="moves">30</div>
            </div>
        </div>
        <div id="board"></div>
    </div>

    <div id="message">
        <div id="message-text"></div>
        <button id="reset-btn">Jugar de Nuevo</button>
    </div>

    <script>
        const cats = ['😸', '😺', '😻', '😼', '😽', '🙀'];
        const BOARD_SIZE = 8;
        let board = [];
        let score = 0;
        let moves = 30;
        let selectedCell = null;
        let isProcessing = false;

        function initBoard() {
            board = [];
            
            // Crear tablero inicial
            for (let i = 0; i < BOARD_SIZE; i++) {
                board[i] = [];
                for (let j = 0; j < BOARD_SIZE; j++) {
                    board[i][j] = cats[Math.floor(Math.random() * cats.length)];
                }
            }
            
            // Asegurar que no hay matches iniciales
            while (findMatches().length > 0) {
                board = [];
                for (let i = 0; i < BOARD_SIZE; i++) {
                    board[i] = [];
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        board[i][j] = cats[Math.floor(Math.random() * cats.length)];
                    }
                }
            }
            
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = board[i][j];
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.addEventListener('click', () => handleCellClick(i, j));
                    boardEl.appendChild(cell);
                }
            }
        }

        async function handleCellClick(row, col) {
            if (isProcessing) return;
            
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            
            if (selectedCell === null) {
                // Primera selección
                selectedCell = { row, col };
                cell.classList.add('selected');
            } else {
                // Segunda selección
                const prevCell = document.querySelector(`[data-row="${selectedCell.row}"][data-col="${selectedCell.col}"]`);
                prevCell.classList.remove('selected');
                
                // Verificar si es adyacente
                if (isAdjacent(selectedCell.row, selectedCell.col, row, col)) {
                    isProcessing = true;
                    
                    // Intercambiar
                    swap(selectedCell.row, selectedCell.col, row, col);
                    renderBoard();
                    
                    await new Promise(resolve => setTimeout(resolve, 200));
                    
                    // Verificar si hay matches
                    const matches = findMatches();
                    
                    if (matches.length > 0) {
                        // Movimiento válido
                        moves--;
                        updateScore();
                        await processAllMatches();
                        checkGameOver();
                    } else {
                        // Movimiento inválido - revertir
                        swap(selectedCell.row, selectedCell.col, row, col);
                        renderBoard();
                    }
                    
                    isProcessing = false;
                } else {
                    // Seleccionar nueva celda
                    selectedCell = { row, col };
                    cell.classList.add('selected');
                }
                
                selectedCell = null;
            }
        }

        function isAdjacent(row1, col1, row2, col2) {
            return (Math.abs(row1 - row2) === 1 && col1 === col2) ||
                   (Math.abs(col1 - col2) === 1 && row1 === row2);
        }

        function swap(row1, col1, row2, col2) {
            const temp = board[row1][col1];
            board[row1][col1] = board[row2][col2];
            board[row2][col2] = temp;
        }

        function findMatches() {
            const matches = [];
            
            // Buscar matches horizontales
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE - 2; j++) {
                    if (board[i][j] === board[i][j + 1] && board[i][j] === board[i][j + 2]) {
                        let k = j;
                        while (k < BOARD_SIZE && board[i][k] === board[i][j]) {
                            if (!matches.some(m => m.row === i && m.col === k)) {
                                matches.push({ row: i, col: k });
                            }
                            k++;
                        }
                    }
                }
            }
            
            // Buscar matches verticales
            for (let i = 0; i < BOARD_SIZE - 2; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === board[i + 1][j] && board[i][j] === board[i + 2][j]) {
                        let k = i;
                        while (k < BOARD_SIZE && board[k][j] === board[i][j]) {
                            if (!matches.some(m => m.row === k && m.col === j)) {
                                matches.push({ row: k, col: j });
                            }
                            k++;
                        }
                    }
                }
            }
            
            return matches;
        }

        async function processAllMatches() {
            let matches = findMatches();
            
            while (matches.length > 0) {
                // Animar matches (solo las celdas que se eliminan)
                matches.forEach(match => {
                    const cell = document.querySelector(`[data-row="${match.row}"][data-col="${match.col}"]`);
                    if (cell) cell.classList.add('matched');
                });
                
                // Actualizar puntuación
                score += matches.length * 10;
                updateScore();
                
                await new Promise(resolve => setTimeout(resolve, 400));
                
                // Eliminar matches del tablero
                matches.forEach(match => {
                    board[match.row][match.col] = null;
                });
                
                // Hacer caer piezas
                applyGravity();
                
                // Rellenar huecos
                fillEmptyCells();
                
                // Actualizar solo las celdas que cambiaron (sin re-renderizar todo)
                updateBoardCells();
                
                await new Promise(resolve => setTimeout(resolve, 400));
                
                // Buscar nuevos matches (combos)
                matches = findMatches();
            }
        }
        
        function updateBoardCells() {
            // Actualizar solo el contenido de las celdas existentes sin recrear todo
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                    if (cell && cell.textContent !== board[i][j]) {
                        cell.textContent = board[i][j];
                        cell.className = 'cell falling';
                        // Remover clase después de la animación
                        setTimeout(() => {
                            cell.className = 'cell';
                        }, 400);
                    }
                }
            }
        }

        function applyGravity() {
            for (let j = 0; j < BOARD_SIZE; j++) {
                let emptyRow = BOARD_SIZE - 1;
                
                for (let i = BOARD_SIZE - 1; i >= 0; i--) {
                    if (board[i][j] !== null) {
                        if (i !== emptyRow) {
                            board[emptyRow][j] = board[i][j];
                            board[i][j] = null;
                        }
                        emptyRow--;
                    }
                }
            }
        }

        function fillEmptyCells() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === null) {
                        board[i][j] = cats[Math.floor(Math.random() * cats.length)];
                    }
                }
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
        }

        function checkGameOver() {
            if (moves <= 0) {
                showMessage(`¡Juego Terminado!<br>Puntuación: ${score}`);
            }
        }

        function showMessage(text) {
            document.getElementById('message-text').innerHTML = text;
            document.getElementById('message').style.display = 'block';
        }

        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('message').style.display = 'none';
            score = 0;
            moves = 30;
            selectedCell = null;
            isProcessing = false;
            updateScore();
            initBoard();
        });

        initBoard();
    </script>
</body>
</html>
