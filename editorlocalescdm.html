<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Locales — Club de Mar</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #19345a;
  --navy-dark: #0f2040;
  --navy-mid: #2a4570;
  --gold: #c9a84c;
  --gold-light: #f0e4c0;
  --teal: #60CDC9;
  --bg: #f0f2f6;
  --surface: #ffffff;
  --surface2: #f7f8fb;
  --border: #dde2ec;
  --text: #19345a;
  --muted: #7a8aaa;
  --red: #c0392b;
  --red-bg: #fdf2f2;
  --green: #1a7a4a;
  --green-bg: #f0faf5;
  --radius: 10px;
  --shadow: 0 2px 16px rgba(25,52,90,0.09);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Geist', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: var(--navy-dark);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(0,0,0,0.2);
}

header h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 1.25rem;
  color: #fff;
  font-weight: 400;
  letter-spacing: 0.01em;
}

header h1 span { color: var(--gold); font-style: italic; }

.header-actions { display: flex; gap: 10px; align-items: center; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 6px;
  font-family: 'Geist', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-primary { background: var(--gold); color: var(--navy-dark); }
.btn-primary:hover { background: #b8952e; }
.btn-ghost { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
.btn-ghost:hover { background: rgba(255,255,255,0.18); }
.btn-outline { background: transparent; color: var(--navy); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--navy); background: var(--surface2); }
.btn-danger { background: var(--red-bg); color: var(--red); border: 1.5px solid #f0b8b8; }
.btn-danger:hover { background: #fce8e8; }
.btn-success { background: var(--green-bg); color: var(--green); border: 1.5px solid #a8d8be; }
.btn-success:hover { background: #e0f5eb; }
.btn-sm { padding: 5px 10px; font-size: 0.75rem; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

#dropzone {
  max-width: 680px;
  margin: 60px auto;
  background: var(--surface);
  border: 2.5px dashed var(--border);
  border-radius: 16px;
  padding: 70px 40px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

#dropzone:hover, #dropzone.drag-over {
  border-color: var(--gold);
  background: var(--gold-light);
}

#dropzone .drop-icon {
  font-size: 3rem;
  margin-bottom: 16px;
  display: block;
}

#dropzone h2 {
  font-family: 'Instrument Serif', serif;
  font-size: 1.5rem;
  font-weight: 400;
  color: var(--navy);
  margin-bottom: 8px;
}

#dropzone p { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }

#fileInput { display: none; }

#app { display: none; }

.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: calc(100vh - 60px);
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-header h3 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 600;
}

.search-filter {
  position: relative;
}

.search-filter input {
  width: 100%;
  padding: 8px 12px 8px 32px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-family: 'Geist', sans-serif;
  font-size: 0.82rem;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: border-color 0.15s;
}

.search-filter input:focus { border-color: var(--navy); background: #fff; }

.search-filter svg {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.sidebar-toolbar {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.local-list {
  overflow-y: auto;
  flex: 1;
}

.local-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  border-bottom: 1px solid #f0f2f6;
  transition: background 0.12s;
  position: relative;
}

.local-item:hover { background: var(--surface2); }
.local-item.active { background: var(--gold-light); border-left: 3px solid var(--gold); }
.local-item.hidden-local { opacity: 0.45; }

.local-id {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--muted);
  background: var(--bg);
  border-radius: 4px;
  padding: 2px 6px;
  min-width: 32px;
  text-align: center;
  flex-shrink: 0;
}

.local-item.active .local-id { background: rgba(201,168,76,0.2); }

.local-name {
  font-size: 0.84rem;
  font-weight: 500;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.local-cat {
  font-size: 0.68rem;
  color: var(--muted);
  flex-shrink: 0;
}

.visibility-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.visible-dot { background: #2ecc71; }
.hidden-dot { background: #e74c3c; }

.main-panel {
  overflow-y: auto;
  padding: 28px 32px;
  background: var(--bg);
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--muted);
  text-align: center;
  gap: 12px;
}

.empty-state svg { opacity: 0.25; }
.empty-state p { font-size: 0.9rem; }

.editor-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  max-width: 820px;
}

.editor-card-header {
  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.editor-card-title {
  font-family: 'Instrument Serif', serif;
  font-size: 1.3rem;
  color: #fff;
  font-weight: 400;
}

.editor-card-id {
  font-size: 0.72rem;
  color: var(--gold-light);
  letter-spacing: 0.08em;
  opacity: 0.8;
}

.visibility-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  color: #fff;
  font-family: 'Geist', sans-serif;
  font-size: 0.78rem;
  font-weight: 500;
  transition: all 0.15s;
}

.visibility-toggle:hover { background: rgba(255,255,255,0.18); }
.visibility-toggle.is-hidden { background: rgba(231,76,60,0.25); border-color: rgba(231,76,60,0.4); }
.visibility-toggle.is-visible { background: rgba(46,204,113,0.2); border-color: rgba(46,204,113,0.35); }

.editor-body { padding: 24px; }

.field-group {
  margin-bottom: 22px;
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 22px;
}

.field-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 22px;
}

label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  margin-bottom: 6px;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-family: 'Geist', sans-serif;
  font-size: 0.875rem;
  color: var(--text);
  background: var(--surface2);
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}

input[type="text"]:focus,
textarea:focus {
  border-color: var(--navy);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(25,52,90,0.07);
}

textarea {
  resize: vertical;
  min-height: 100px;
  line-height: 1.55;
}

.section-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  font-weight: 700;
  padding: 8px 0 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title svg { opacity: 0.5; }

.save-bar {
  position: sticky;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.save-bar-info {
  font-size: 0.78rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.unsaved-badge {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
  flex-shrink: 0;
}

.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: var(--navy-dark);
  color: #fff;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 0.83rem;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  z-index: 9999;
  transform: translateY(16px);
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
}

.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-left: 3px solid #2ecc71; }
.toast.error { border-left: 3px solid #e74c3c; }

.show-all-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--gold-light);
  border-bottom: 1px solid #e8d5a3;
  font-size: 0.76rem;
  color: var(--navy);
  font-weight: 500;
  flex-shrink: 0;
}

.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
}

.stat-pill.green { background: var(--green-bg); color: var(--green); }
.stat-pill.red { background: var(--red-bg); color: var(--red); }

.lang-tabs {
  display: flex;
  gap: 0;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 10px;
  width: fit-content;
}

.lang-tab {
  padding: 5px 14px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: 'Geist', sans-serif;
  color: var(--muted);
  letter-spacing: 0.05em;
  transition: all 0.12s;
}

.lang-tab.active { background: var(--navy); color: #fff; }
</style>
</head>
<body>

<header>
  <h1>Editor de <span>Locales</span> — Club de Mar</h1>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btnNewFile" style="display:none" onclick="resetEditor()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Cargar otro archivo
    </button>
    <button class="btn btn-primary" id="btnExport" style="display:none" onclick="exportHTML()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Guardar HTML
    </button>
  </div>
</header>

<div id="dropzone" onclick="document.getElementById('fileInput').click()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
  <span class="drop-icon">📄</span>
  <h2>Sube tu archivo HTML</h2>
  <p>Arrastra aquí el archivo o haz clic para seleccionarlo</p>
  <button class="btn btn-primary" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">Seleccionar archivo</button>
  <input type="file" id="fileInput" accept=".html" onchange="handleFile(event)">
</div>

<div id="app">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Fichas de locales</h3>
        <div class="search-filter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="sidebarSearch" placeholder="Filtrar locales…" oninput="filterSidebar(this.value)">
        </div>
      </div>
      <div class="show-all-bar" id="statsBar"></div>
      <div class="sidebar-toolbar">
        <button class="btn btn-sm btn-outline" onclick="showAll()" title="Mostrar todos">👁 Todos visible</button>
        <button class="btn btn-sm btn-outline" onclick="hideAll()" title="Ocultar todos">🚫 Todos oculto</button>
      </div>
      <div class="local-list" id="localList"></div>
    </div>
    <div class="main-panel" id="mainPanel">
      <div class="empty-state">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#19345a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>
        <p>Selecciona un local en el panel izquierdo para editarlo</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let rawHTML = '';
let companies = [];
let showSet = new Set();
let currentIdx = null;
let unsaved = false;

function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.add('drag-over');
}

function handleDragLeave(e) {
  document.getElementById('dropzone').classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.html')) readFile(file);
}

function handleFile(e) {
  const file = e.target.files[0];
  if (file) readFile(file);
}

function readFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    rawHTML = e.target.result;
    parseAndInit();
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const result = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i+1] === '"') { field += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ';' && !inQuotes) {
      row.push(field.trim()); field = '';
    } else if (ch === '\n' && !inQuotes) {
      row.push(field.trim()); field = '';
      result.push(row); row = [];
    } else {
      field += ch;
    }
  }
  if (field.trim() || row.length) { row.push(field.trim()); result.push(row); }
  return result;
}

function parseAndInit() {
  const csvMatch = rawHTML.match(/const CSV_RAW = `([\s\S]*?)`;/);
  const showMatch = rawHTML.match(/const SHOW_THESE = "([^"]*)"/);

  if (!csvMatch) { showToast('No se encontró el CSV en el HTML.', 'error'); return; }

  const csvRaw = csvMatch[1];
  const showRaw = showMatch ? showMatch[1] : '';
  showSet = showRaw ? new Set(showRaw.split(',').map(s => s.trim().toLowerCase())) : new Set(['__all__']);

  const rows = parseCSV(csvRaw);
  companies = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (r.length < 4) continue;
    const local = (r[0] || '').trim();
    if (!local) continue;
    companies.push({
      local,
      nombre:    ((r[3] && r[3].trim()) || (r[1] && r[1].trim()) || '').trim(),
      categoria: (r[2] || '').trim(),
      web:       (r[4] || '').trim(),
      tel:       (r[5] || '').trim(),
      contacto:  (r[6] || '').trim(),
      social:    (r[7] || '').trim(),
      tienelogo: (r[8] || '').trim(),
      tienefotos:(r[9] || '').trim(),
      copyES:    (r[10] || '').trim(),
      copyEN:    (r[11] || '').trim(),
      _rawRow: r,
    });
  }

  document.getElementById('dropzone').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('btnNewFile').style.display = 'flex';
  document.getElementById('btnExport').style.display = 'flex';

  renderSidebar(companies);
  updateStats();
}

function isVisible(local) {
  if (showSet.has('__all__')) return true;
  return showSet.has(local.toLowerCase().trim());
}

function toggleVisibility(local) {
  const key = local.toLowerCase().trim();
  if (showSet.has('__all__')) {
    showSet = new Set(companies.map(c => c.local.toLowerCase().trim()));
    showSet.delete(key);
  } else {
    if (showSet.has(key)) showSet.delete(key);
    else showSet.add(key);
  }
  markUnsaved();
  renderSidebar(companies);
  updateStats();
  if (currentIdx !== null) renderEditor(currentIdx);
}

function showAll() {
  showSet = new Set(['__all__']);
  markUnsaved();
  renderSidebar(companies);
  updateStats();
  if (currentIdx !== null) renderEditor(currentIdx);
}

function hideAll() {
  showSet = new Set();
  markUnsaved();
  renderSidebar(companies);
  updateStats();
  if (currentIdx !== null) renderEditor(currentIdx);
}

function filterSidebar(q) {
  const filtered = q ? companies.filter(c =>
    c.local.toLowerCase().includes(q.toLowerCase()) ||
    c.nombre.toLowerCase().includes(q.toLowerCase()) ||
    c.categoria.toLowerCase().includes(q.toLowerCase())
  ) : companies;
  renderSidebar(filtered);
}

function renderSidebar(list) {
  const container = document.getElementById('localList');
  container.innerHTML = list.map((c, idx) => {
    const vis = isVisible(c.local);
    const realIdx = companies.indexOf(c);
    return `<div class="local-item ${realIdx === currentIdx ? 'active' : ''} ${!vis ? 'hidden-local' : ''}"
                 onclick="selectLocal(${realIdx})">
      <div class="visibility-dot ${vis ? 'visible-dot' : 'hidden-dot'}"></div>
      <span class="local-id">${c.local}</span>
      <span class="local-name">${c.nombre || '(sin nombre)'}</span>
      <span class="local-cat">${c.categoria || ''}</span>
    </div>`;
  }).join('');
}

function updateStats() {
  const total = companies.length;
  const visible = showSet.has('__all__') ? total : [...showSet].filter(k => companies.some(c => c.local.toLowerCase().trim() === k)).length;
  const hidden = total - visible;
  document.getElementById('statsBar').innerHTML =
    `<span class="stat-pill green">● ${visible} visibles</span>
     <span class="stat-pill red" style="margin-left:6px">● ${hidden} ocultos</span>`;
}

function selectLocal(idx) {
  if (currentIdx !== null && unsaved) {
    saveCurrentEditor();
  }
  currentIdx = idx;
  renderSidebar(companies);
  renderEditor(idx);
}

function renderEditor(idx) {
  const c = companies[idx];
  const vis = isVisible(c.local);
  document.getElementById('mainPanel').innerHTML = `
    <div class="editor-card">
      <div class="editor-card-header">
        <div>
          <div class="editor-card-id">LOCAL Nº ${c.local}</div>
          <div class="editor-card-title">${c.nombre || '(sin nombre)'}</div>
        </div>
        <button class="visibility-toggle ${vis ? 'is-visible' : 'is-hidden'}" onclick="toggleVisibility('${c.local}')">
          ${vis
            ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Visible`
            : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Oculto`
          }
        </button>
      </div>
      <div class="editor-body">

        <div class="section-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>
          Datos generales
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Nombre (web)</label>
            <input type="text" id="f-nombre" value="${esc(c.nombre)}">
          </div>
          <div class="field-group">
            <label>Categoría</label>
            <input type="text" id="f-categoria" value="${esc(c.categoria)}">
          </div>
        </div>

        <div class="section-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.17 6.17l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
          Contacto
        </div>

        <div class="field-row-3">
          <div class="field-group">
            <label>Teléfono</label>
            <input type="text" id="f-tel" value="${esc(c.tel)}">
          </div>
          <div class="field-group">
            <label>Email / Contacto</label>
            <input type="text" id="f-contacto" value="${esc(c.contacto)}">
          </div>
          <div class="field-group">
            <label>Web</label>
            <input type="text" id="f-web" value="${esc(c.web)}">
          </div>
        </div>

        <div class="field-group">
          <label>Redes sociales</label>
          <input type="text" id="f-social" value="${esc(c.social)}">
        </div>

        <div class="section-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Descripción
        </div>

        <div style="margin-bottom: 10px;">
          <div class="lang-tabs">
            <button class="lang-tab active" id="tab-es" onclick="switchLang('es')">🇪🇸 Español</button>
            <button class="lang-tab" id="tab-en" onclick="switchLang('en')">🇬🇧 English</button>
          </div>
        </div>

        <div id="copy-es" class="field-group">
          <label>Descripción en español</label>
          <textarea id="f-copyES" rows="6">${esc(c.copyES)}</textarea>
        </div>
        <div id="copy-en" class="field-group" style="display:none">
          <label>Description in English</label>
          <textarea id="f-copyEN" rows="6">${esc(c.copyEN)}</textarea>
        </div>

        <div class="section-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M3 17h18"/><line x1="8" y1="21" x2="16" y2="21"/></svg>
          Medios
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>¿Tiene logo?</label>
            <input type="text" id="f-tienelogo" value="${esc(c.tienelogo)}" placeholder="si / no">
          </div>
          <div class="field-group">
            <label>¿Tiene fotos?</label>
            <input type="text" id="f-tienefotos" value="${esc(c.tienefotos)}" placeholder="si / no">
          </div>
        </div>

      </div>
      <div class="save-bar">
        <div class="save-bar-info" id="saveInfo">
          <span class="unsaved-badge" style="display:none" id="unsavedDot"></span>
          Haz cambios y guarda la ficha
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline" onclick="selectLocal(${idx > 0 ? idx-1 : companies.length-1})">← Anterior</button>
          <button class="btn btn-success" onclick="saveCurrentEditor()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
            Guardar ficha
          </button>
          <button class="btn btn-outline" onclick="selectLocal(${idx < companies.length-1 ? idx+1 : 0})">Siguiente →</button>
        </div>
      </div>
    </div>`;

  ['f-nombre','f-categoria','f-tel','f-contacto','f-web','f-social','f-copyES','f-copyEN','f-tienelogo','f-tienefotos'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', markUnsaved);
  });

  unsaved = false;
}

function switchLang(lang) {
  document.getElementById('copy-es').style.display = lang === 'es' ? 'block' : 'none';
  document.getElementById('copy-en').style.display = lang === 'en' ? 'block' : 'none';
  document.getElementById('tab-es').classList.toggle('active', lang === 'es');
  document.getElementById('tab-en').classList.toggle('active', lang === 'en');
}

function markUnsaved() {
  unsaved = true;
  const dot = document.getElementById('unsavedDot');
  const info = document.getElementById('saveInfo');
  if (dot) dot.style.display = 'inline-block';
  if (info) info.innerHTML = `<span class="unsaved-badge" id="unsavedDot" style="display:inline-block"></span> Cambios sin guardar`;
}

function saveCurrentEditor() {
  if (currentIdx === null) return;
  const c = companies[currentIdx];
  const get = id => (document.getElementById(id) || {}).value || '';

  c.nombre    = get('f-nombre');
  c.categoria = get('f-categoria');
  c.tel       = get('f-tel');
  c.contacto  = get('f-contacto');
  c.web       = get('f-web');
  c.social    = get('f-social');
  c.copyES    = get('f-copyES');
  c.copyEN    = get('f-copyEN');
  c.tienelogo = get('f-tienelogo');
  c.tienefotos= get('f-tienefotos');

  unsaved = false;
  const info = document.getElementById('saveInfo');
  const dot = document.getElementById('unsavedDot');
  if (dot) dot.style.display = 'none';
  if (info) info.textContent = '✓ Ficha guardada en memoria';

  renderSidebar(companies);
  showToast(`Ficha "${c.nombre}" guardada`, 'success');
}

function escapeCSVField(val) {
  if (val === undefined || val === null) return '';
  val = String(val);
  if (val.includes('"') || val.includes(';') || val.includes('\n') || val.includes('\r')) {
    return '"' + val.replace(/"/g, '""') + '"';
  }
  return val;
}

function buildCSV() {
  const header = 'Nº local;Nombre Negocio;Categoría;Nombre Negocio;Enlace web;Telefono;email u otros contactos;redes sociales;logo provisto por ellos? (sí o no);Fotos provistas por ellos? (sí o no);Copy Español;Copy Inglés';
  const rows = companies.map(c => [
    c.local, c.nombre, c.categoria, c.nombre,
    c.web, c.tel, c.contacto, c.social,
    c.tienelogo, c.tienefotos, c.copyES, c.copyEN
  ].map(escapeCSVField).join(';'));
  return header + '\n' + rows.join('\n');
}

function buildShowThese() {
  if (showSet.has('__all__')) return '';
  return [...showSet].join(',');
}

function exportHTML() {
  saveCurrentEditor();

  let output = rawHTML;

  const newCSV = buildCSV();
  output = output.replace(/const CSV_RAW = `[\s\S]*?`;/, 'const CSV_RAW = `' + newCSV + '`;');

  const newShow = buildShowThese();
  output = output.replace(/const SHOW_THESE = "[^"]*"/, `const SHOW_THESE = "${newShow}"`);

  const blob = new Blob([output], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  a.download = `Locales_${stamp}.html`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('HTML exportado correctamente', 'success');
}

function resetEditor() {
  rawHTML = '';
  companies = [];
  showSet = new Set();
  currentIdx = null;
  unsaved = false;
  document.getElementById('dropzone').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  document.getElementById('btnNewFile').style.display = 'none';
  document.getElementById('btnExport').style.display = 'none';
  document.getElementById('fileInput').value = '';
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2800);
}
</script>
</body>
</html>
