ntinuity is built by repeating the exact description and anchoring on an image.'], term: ['Continuidad', 'Continuity'], ans: ['Ficha literal repetida + arrancar del último fotograma del plano anterior.', 'Repeated literal sheet + start from the previous shot\\u2019s last frame.'] },\n          { k: 'order', q: ['Ordena el guial de un plano dentro de una secuencia.', 'Order the guial of a shot inside a sequence.'], items: [['Ficha literal del personaje y el entorno', 'Literal sheet of character and setting'], ['Acción única de este plano', 'Single action of this shot'], ['Movimiento de cámara, uno y lento', 'Camera move, one and slow'], ['Qué permanece inmóvil', 'What stays still'], ['Duración en segundos', 'Duration in seconds']], why: ['La ficha primero (es lo que no cambia), luego lo propio del plano. Así puedes copiar y pegar la cabecera.', 'The sheet first (it is what does not change), then what is specific to the shot. That way you copy and paste the header.'], term: ['Estructura de plano', 'Shot structure'], ans: ['Ficha fija + acción + cámara + qué no se mueve + duración.', 'Fixed sheet + action + camera + what stays still + duration.'] },\n          { k: 'tf', q: ['Verdadero o falso, rápido.', 'True or false, fast.'], stim: ['«Reformular la descripción del personaje con sinónimos mantiene la continuidad igual de bien.»', '\"Rewording the character description with synonyms keeps continuity just as well.\"'], a: false, sec: 10, why: ['Falso. Otras palabras, otra persona. La ficha se copia literal, sin reescribirla.', 'False. Other words, other person. The sheet is copied verbatim, never rewritten.'], term: ['Ficha literal', 'Literal sheet'], ans: ['Debe repetirse palabra por palabra: reformular cambia el personaje.', 'It must be repeated verbatim: rewording changes the character.'] }\n        ]\n      },\n      {\n        id: 'l25', title: ['De imagen a vídeo', 'From image to video'], kicker: ['Empezar por una imagen que ya te gusta.', 'Start from an image you already like.'],\n        cards: [\n          { kicker: ['DOS RUTAS', 'TWO ROUTES'], h: ['Texto a vídeo o imagen a vídeo', 'Text to video or image to video'], p: ['De texto, el modelo decide todo: composición, luz, cara. De imagen, tú fijas el primer fotograma y él solo resuelve el movimiento. Para trabajo con criterio visual, la segunda ruta gana casi siempre.', 'From text, the model decides everything: composition, light, face. From an image, you fix the first frame and it only solves motion. For work with visual intent, the second route almost always wins.'] },\n          { kicker: ['REPARTO', 'DIVISION'], h: ['Primero la imagen, luego el movimiento', 'Image first, motion second'], p: ['Genera y repara la imagen fija hasta que esté bien: composición, luz, manos. Después escribe un guial de movimiento corto que solo describa qué se anima. Separar las dos decisiones multiplica el control.', 'Generate and repair the still image until it is right: composition, light, hands. Then write a short motion guial describing only what animates. Separating the two decisions multiplies control.'], code: 'Imagen base: ya aprobada.\\nMovimiento: solo el vapor de la taza sube\\nlentamente. Persona y cámara inmóviles.\\n4 segundos.' },\n          { kicker: ['GUIAL DE MOVIMIENTO', 'MOTION GUIAL'], h: ['El guial de movimiento es corto por diseño', 'The motion guial is short by design'], p: ['Si ya tienes la imagen, no repitas la descripción visual entera: compite con lo que ya está fijado. Describe el movimiento, la cámara y lo que permanece quieto. Poco más.', 'If you already have the image, do not repeat the whole visual description: it competes with what is already fixed. Describe motion, camera and what stays still. Little else.'], note: ['Si el modelo insiste en cambiar la cara, suele ser porque tu guial de movimiento vuelve a describir a la persona. Quítalo y déjala en manos de la imagen.', 'If the model insists on changing the face, it is usually because your motion guial describes the person again. Remove it and leave that to the image.'] }\n        ],\n        ex: [\n          { k: 'choice', q: ['Ya tienes una imagen aprobada y quieres animarla. ¿Qué escribes?', 'You have an approved image and want to animate it. What do you write?'], opts: [['La descripción visual completa otra vez, más el movimiento.', 'The full visual description again, plus the motion.'], ['Solo el movimiento, la cámara y qué permanece inmóvil.', 'Only the motion, the camera and what stays still.'], ['Un guial más largo para asegurar la calidad.', 'A longer guial to ensure quality.'], ['Solo «anímalo de forma natural».', 'Just \"animate it naturally\".']], c: 1, why: ['Repetir la descripción compite con la imagen ya fijada y suele cambiar la cara. El guial de movimiento es corto por diseño.', 'Repeating the description competes with the fixed image and usually changes the face. The motion guial is short by design.'], term: ['Guial de movimiento', 'Motion guial'], ans: ['Solo movimiento, cámara y qué permanece inmóvil: la imagen ya fija el resto.', 'Only motion, camera and what stays still: the image fixes the rest.'] },\n          { k: 'predict', q: ['¿Qué es más probable con este guial de movimiento?', 'What is most likely with this motion guial?'], stim: ['Imagen base aprobada + guial:\\n\"mujer de pelo corto castaño con gabardina\\nverde, gira la cabeza, luz de ventana\"', 'Approved base image + guial:\\n\"woman with short brown hair in a green coat,\\nturns her head, window light\"'], opts: [['Respetará la imagen: la descripción coincide.', 'It will respect the image: the description matches.'], ['Puede rehacer la cara y la ropa al redescribirlas.', 'It may redo the face and clothes by redescribing them.'], ['Ignorará el movimiento.', 'It will ignore the motion.'], ['Dará error por conflicto.', 'It will error out on conflict.']], c: 1, why: ['Todo lo que redescribes vuelve a generarse. Deja la apariencia a la imagen y escribe solo el movimiento.', 'Everything you redescribe gets regenerated. Leave appearance to the image and write only motion.'], term: ['Redescribir la apariencia', 'Redescribing appearance'], ans: ['Provoca que se regenere: con imagen base, describe solo el movimiento.', 'It triggers regeneration: with a base image, describe motion only.'] },\n          { k: 'cloze', q: ['Completa el reparto de decisiones.', 'Complete the division of decisions.'], text: ['La imagen fija la {0}; el guial de vídeo solo resuelve el {1}.', 'The image fixes the {0}; the video guial only solves the {1}.'], blanks: [{ a: ['apariencia', 'composicion', 'composición', 'imagen', 'appearance', 'composition'], w: '170px' }, { a: ['movimiento', 'motion', 'movement'], w: '160px' }], why: ['Dos decisiones separadas, dos guiales distintos. Mezclarlas es perder el control de las dos.', 'Two separate decisions, two different guiales. Mixing them loses control of both.'], term: ['Imagen a vídeo', 'Image to video'], ans: ['La imagen fija apariencia y composición; el guial de vídeo, solo el movimiento.', 'The image fixes appearance and composition; the video guial, motion only.'] }\n        ]\n      },\n      {\n        id: 'l26', title: ['Escribir una secuencia', 'Writing a sequence'], kicker: ['Un guion técnico, plano a plano.', 'A shot list, shot by shot.'],\n        cards: [\n          { kicker: ['GUION TECNICO', 'SHOT LIST'], h: ['Una tabla de planos antes de generar nada', 'A shot table before generating anything'], p: ['Escribe la secuencia como una lista: número de plano, acción, encuadre, cámara, duración. Cuando la lista está bien, cada guial se escribe casi solo, y sabes cuánto vas a gastar.', 'Write the sequence as a list: shot number, action, framing, camera, duration. When the list is right, each guial almost writes itself, and you know what it will cost.'], code: '1 · manos abriendo una carta · detalle · fija · 3s\\n2 · su cara al leer · primer plano · dolly lento · 4s\\n3 · deja la carta y mira fuera · medio · fija · 4s' },\n          { kicker: ['RITMO', 'RHYTHM'], h: ['Alterna escalas o parecerá un catálogo', 'Alternate scales or it looks like a catalog'], p: ['Tres primeros planos seguidos aburren; alternar detalle, medio y general da ritmo. Y si un plano no aporta información nueva, sobra: en vídeo generado cada plano cuesta dinero y tiempo.', 'Three close-ups in a row are dull; alternating detail, medium and wide gives rhythm. And if a shot adds no new information, cut it: in generated video every shot costs money and time.'] },\n          { kicker: ['MONTAJE', 'EDITING'], h: ['El montaje arregla lo que el modelo no da', 'Editing fixes what the model cannot'], p: ['Planos cortos ocultan defectos: si un movimiento se rompe en el segundo tres, corta en el dos. Generar cinco planos de tres segundos sale mejor que uno de quince, y además te deja elegir.', 'Short shots hide flaws: if a motion breaks at second three, cut at two. Generating five three-second shots beats one fifteen-second shot, and it lets you choose.'], note: ['Genera siempre dos o tres versiones de los planos clave. El coste marginal es bajo y el margen de elección lo cambia todo.', 'Always generate two or three versions of key shots. Marginal cost is low and having a choice changes everything.'] }\n        ],\n        ex: [\n          { k: 'order', q: ['Ordena los campos de una línea de guion técnico.', 'Order the fields of a shot-list line.'], items: [['Número de plano', 'Shot number'], ['Acción', 'Action'], ['Encuadre', 'Framing'], ['Cámara', 'Camera'], ['Duración', 'Duration']], why: ['Número, acción, encuadre, cámara, duración. Una línea por plano y la secuencia se lee de un golpe.', 'Number, action, framing, camera, duration. One line per shot and the sequence reads at a glance.'], term: ['Línea de guion técnico', 'Shot-list line'], ans: ['Número · acción · encuadre · cámara · duración.', 'Number · action · framing · camera · duration.'] },\n          { k: 'free', q: ['Escribe el plano 2 de una secuencia, con continuidad y una sola acción.', 'Write shot 2 of a sequence, with continuity and a single action.'], hint: ['Ficha: mujer 40, pelo corto castaño, gabardina verde, cocina de azulejo blanco, luz de ventana fría. Plano 2: se gira hacia la puerta.', 'Sheet: woman 40, short brown hair, green coat, white-tiled kitchen, cool window light. Shot 2: she turns toward the door.'], ph: ['FICHA… PLANO 2…', 'SHEET… SHOT 2…'], rubric: [{ kw: ['gabardina', 'pelo corto', 'azulejo', 'ficha', 'green coat', 'short brown', 'tiled'], label: ['Ficha literal repetida', 'Literal sheet repeated'] }, { kw: ['gira', 'se gira', 'turns', 'vuelve la cabeza'], label: ['Una sola acción', 'A single action'] }, { kw: ['camara', 'cámara', 'estatica', 'estática', 'dolly', 'paneo', 'camera', 'static'], label: ['Cámara especificada', 'Camera specified'] }, { kw: ['inmovil', 'inmóvil', 'no se mueve', 'quieto', 'quieta', 'still', 'unchanged'], label: ['Qué permanece inmóvil', 'What stays still'] }, { kw: ['segundo', 's,', '3s', '4s', 'seconds', 'duracion', 'duración'], label: ['Duración indicada', 'Duration stated'] }], need: 4, why: ['Ficha literal, una acción, cámara, lo que no se mueve y duración. Eso es un plano que puedes generar y repetir.', 'Literal sheet, one action, camera, what stays still and duration. That is a shot you can generate and repeat.'], term: ['Plano completo', 'Complete shot'], ans: ['Ficha literal + una acción + cámara + qué no se mueve + duración.', 'Literal sheet + one action + camera + what stays still + duration.'] },\n          { k: 'choice', q: ['Necesitas quince segundos de vídeo. ¿Qué estrategia da mejor resultado?', 'You need fifteen seconds of video. Which strategy works better?'], opts: [['Un solo plano de quince segundos.', 'A single fifteen-second shot.'], ['Cuatro o cinco planos cortos, montados.', 'Four or five short shots, edited.'], ['Tres planos de cinco segundos con el mismo encuadre.', 'Three five-second shots with the same framing.'], ['Un plano largo con muchos movimientos de cámara.', 'One long shot with many camera moves.']], c: 1, why: ['Los planos cortos ocultan defectos, dan ritmo y te dejan elegir entre varias versiones.', 'Short shots hide flaws, give rhythm and let you choose among versions.'], term: ['Estrategia de duración', 'Duration strategy'], ans: ['Varios planos cortos montados, no uno largo.', 'Several short shots edited, not one long one.'] }\n        ]\n      }\n    );\n\n    const exam3 = [\n      { k: 'choice', q: ['Examen · ¿Cuándo ayuda pedir pasos intermedios?', 'Exam · When do intermediate steps help?'], opts: [['Siempre, en cualquier guial.', 'Always, in any guial.'], ['Cuando la tarea tiene pasos reales: cálculo, lógica, comparación.', 'When the task has real steps: math, logic, comparison.'], ['Solo en tareas creativas.', 'Only on creative tasks.'], ['Nunca, alarga la respuesta.', 'Never, it pads the answer.']], c: 1, why: ['Donde hay pasos reales ayuda; en lo creativo solo alarga.', 'Where there are real steps it helps; on creative work it only pads.'], term: ['Pasos intermedios', 'Intermediate steps'], ans: ['Útiles cuando la tarea tiene pasos reales; mejor nombrarlos tú.', 'Useful when the task has real steps; better to name them yourself.'] },\n      { k: 'cloze', q: ['Examen · Completa el control contra invenciones.', 'Exam · Complete the anti-invention control.'], text: ['Cada afirmación debe venir con la {0} literal del material; si no aparece, responde «no consta».', 'Each claim must come with the literal {0} from the material; if absent, answer \"not stated\".'], blanks: [{ a: ['cita', 'frase', 'quote', 'sentence'], w: '150px' }], why: ['Si no puede citar, no estaba. Es el control más barato que existe.', 'If it cannot quote, it was not there. The cheapest control available.'], term: ['Cita literal', 'Literal quote'], ans: ['Exigir la frase exacta que respalda cada dato.', 'Require the exact sentence backing each claim.'] },\n      { k: 'order', q: ['Examen · Ordena la cadena de guiales.', 'Exam · Order the guial chain.'], items: [['Extraer a formato fijo', 'Extract to a fixed format'], ['Clasificar con etiqueta cerrada', 'Classify with a closed label'], ['Redactar el texto final', 'Draft the final text'], ['Revisar contra las condiciones', 'Check against the conditions']], why: ['Extraer, clasificar, redactar, revisar. Lo que se pierde al extraer no vuelve.', 'Extract, classify, draft, review. What is lost in extraction never comes back.'], term: ['Cadena', 'Chain'], ans: ['Extraer → clasificar → redactar → revisar.', 'Extract → classify → draft → review.'] },\n      { k: 'spot', q: ['Examen · Toca lo que convierte esto en pregunta cargada.', 'Exam · Tap what makes this a loaded question.'], frags: [['Revisa esta estrategia de precios', 'Review this pricing strategy'], ['que es claramente la mejor opción,', 'which is clearly the best option,'], ['y señala qué cambiarías', 'and point out what you would change']], bad: 1, why: ['Declarar tu conclusión hace que el modelo la confirme y solo proponga retoques.', 'Stating your conclusion makes the model confirm it and only suggest tweaks.'], term: ['Pregunta cargada', 'Loaded question'], ans: ['Insinuar la respuesta garantiza que te la confirme.', 'Hinting at the answer guarantees confirmation.'] },\n      { k: 'tf', q: ['Examen · rápido.', 'Exam · fast.'], stim: ['«Lo que un agente lee en una web puede contener instrucciones dirigidas al modelo.»', '\"What an agent reads on a web page can contain instructions aimed at the model.\"'], a: true, sec: 10, why: ['Verdadero. Declara siempre que el material recuperado son datos y que solo tú das órdenes.', 'True. Always declare retrieved material as data and yourself as the only order source.'], term: ['Material recuperado', 'Retrieved material'], ans: ['Puede contener instrucciones: hay que declararlo como datos.', 'It can contain instructions: declare it as data.'] },\n      { k: 'match', q: ['Examen · Empareja.', 'Exam · Match.'], pairs: [{ a: ['Complacencia', 'Sycophancy'], b: ['Te da la razón si la insinúas', 'It agrees when you hint'] }, { a: ['Anclaje', 'Grounding'], b: ['Responder solo desde el material dado', 'Answer only from the given material'] }, { a: ['Cadena', 'Chain'], b: ['La salida de un guial alimenta al siguiente', 'One guial output feeds the next'] }, { a: ['Condición de parada', 'Stopping condition'], b: ['Qué significa terminado, y máximo de intentos', 'What done means, and max attempts'] }], why: ['Los cuatro conceptos de la unidad, en una línea cada uno.', 'The unit\\u2019s four concepts, one line each.'], term: ['Conceptos de razonamiento', 'Reasoning concepts'], ans: ['Complacencia, anclaje, cadena y condición de parada.', 'Sycophancy, grounding, chain and stopping condition.'] },\n      { k: 'predict', q: ['Examen · ¿Qué es más probable?', 'Exam · What is most likely?'], stim: ['Agente con acceso a archivos y este guial:\\n\"organiza mis carpetas como mejor te parezca\"', 'Agent with file access and this guial:\\n\"organize my folders however you see fit\"'], opts: [['Preguntará antes de mover nada.', 'It will ask before moving anything.'], ['Actuará ampliamente sin criterio de parada ni permisos claros.', 'It will act broadly with no stopping criterion or clear permissions.'], ['No hará nada por falta de instrucciones.', 'It will do nothing for lack of instructions.'], ['Pedirá confirmación por cada archivo.', 'It will confirm each file.']], c: 1, why: ['Sin permisos, prohibiciones ni condición de parada, un agente actúa hasta agotar el presupuesto.', 'With no permissions, prohibitions or stopping condition, an agent acts until the budget runs out.'], term: ['Permisos de agente', 'Agent permissions'], ans: ['Hay que declarar permisos, prohibiciones y condición de parada.', 'You must declare permissions, prohibitions and a stopping condition.'] }\n    ];\n\n    const exam4 = [\n      { k: 'order', q: ['Examen · Ordena las etiquetas de un guial de imagen.', 'Exam · Order the tags of an image guial.'], items: [['sujeto y su acción', 'subject and its action'], ['encuadre y altura de cámara', 'framing and camera height'], ['lente', 'lens'], ['luz', 'light'], ['estilo y detalles', 'style and details']], why: ['Lo que va primero pesa más: sujeto arriba, estilo al final.', 'What comes first weighs more: subject up top, style last.'], term: ['Orden de etiquetas', 'Tag order'], ans: ['Sujeto → encuadre → lente → luz → estilo.', 'Subject → framing → lens → light → style.'] },\n      { k: 'weights', q: ['Examen · Refuerza la niebla sin deformar la escena.', 'Exam · Reinforce the fog without deforming the scene.'], subject: ['niebla', 'fog'], pre: ['bosque, ', 'forest, '], post: [', 35mm', ', 35mm'], target: 1.35, tol: 0.16, why: ['1.25-1.5: domina sin romper. Por debajo no cambia, por encima aparecen artefactos.', '1.25-1.5: dominates without breaking. Below it barely changes, above artifacts appear.'], term: ['Rango de peso', 'Weight range'], ans: ['1.25-1.5 refuerza sin deformar.', '1.25-1.5 reinforces without deforming.'] },\n      { k: 'match', q: ['Examen · Empareja luz y efecto.', 'Exam · Match light and effect.'], pairs: [{ a: ['Frontal', 'Frontal'], b: ['Aplana el volumen', 'Flattens volume'] }, { a: ['Lateral dura', 'Hard side'], b: ['Esculpe con sombras nítidas', 'Sculpts with crisp shadows'] }, { a: ['Contraluz', 'Backlight'], b: ['Recorta la silueta', 'Cuts the silhouette'] }, { a: ['Difusa', 'Soft'], b: ['Contraste bajo, sombras suaves', 'Low contrast, soft shadows'] }], why: ['Dirección y calidad de la luz son los dos mandos que más cambian una imagen.', 'Light direction and quality are the two knobs that change an image most.'], term: ['Luz', 'Light'], ans: ['Frontal aplana, lateral esculpe, contraluz recorta, difusa suaviza.', 'Frontal flattens, side sculpts, backlight cuts, soft softens.'] },\n      { k: 'choice', q: ['Examen · La imagen está bien salvo un detalle local. ¿Qué haces?', 'Exam · The image is fine except one local detail. What do you do?  '#332f3d' } }));\n        }\n      });\n      return React.createElement('div', { key: key, style: { position: 'relative', width: 14, height: 12, flex: 'none' } }, els);\n    };\n    const out = [];\n    for (let i = 0; i < 5; i++) out.push(one(i < n, i));\n    return React.createElement('div', { style: { display: 'flex', gap: 3 } }, out);\n  }\n\n  // ---------- flow ----------\n  lessonOrder(uid) {\n    const f = this.state.focus, lv = this.state.level;\n    const u = this.unitById(uid || 'u1');\n    const base = u ? u.ids.slice() : [];\n    const alt = {\n      u1: { local: ['l1', 'l2', 'l4', 'l5', 'l3', 'l6'], web: ['l1', 'l2', 'l3', 'l6', 'l4', 'l5'], tech: ['l2', 'l3', 'l5', 'l4', 'l6', 'l1'] },\n      u2: { local: ['l8', 'l9', 'l10', 'l11', 'l7'], web: ['l7', 'l9', 'l8', 'l11', 'l10'], tech: ['l9', 'l10', 'l11', 'l8', 'l7'] },\n      u3: { local: ['l12', 'l14', 'l16', 'l13', 'l15'], web: ['l12', 'l13', 'l15', 'l14', 'l16'], tech: ['l14', 'l16', 'l12', 'l13', 'l15'] },\n      u4: { local: ['l20', 'l21', 'l17', 'l18', 'l19'], web: ['l17', 'l18', 'l19', 'l21', 'l20'], tech: ['l20', 'l21', 'l19', 'l17', 'l18'] },\n      u5: { local: ['l22', 'l23', 'l25', 'l24', 'l26'], web: ['l22', 'l23', 'l24', 'l26', 'l25'], tech: ['l23', 'l25', 'l22', 'l24', 'l26'] }\n    };\n    const m = alt[(u && u.id) || 'u1'] || {};\n    if (f && m[f]) return m[f];\n    if (lv === 'tech' && m.tech) return m.tech;\n    return base;\n  }\n  lessonById(id) { return this.course().lessons.filter(l => l.id === id)[0]; }\n  steps() {\n    const s = this.state;\n    if (s.exam === 'final') return this.finalExam().map(e => Object.assign({ isEx: true }, e));\n    if (s.exam) { const u = this.unitById(s.exam); return (u ? u.exam : []).map(e => Object.assign({ isEx: true }, e)); }\n    const l = this.lessonById(s.lesson);\n    if (!l) return [];\n    const out = [];\n    const deep = this.state.level !== 'tech';\n    const cards = deep ? l.cards : l.cards.slice(0, Math.max(2, l.cards.length - 1));\n    let ei = 0;\n    cards.forEach((c, i) => {\n      out.push(Object.assign({ k: 'card' }, c));\n      if (i % 2 === 1 && ei < l.ex.length) { out.push(Object.assign({ isEx: true }, l.ex[ei])); ei++; }\n    });\n    while (ei < l.ex.length) { out.push(Object.assign({ isEx: true }, l.ex[ei])); ei++; }\n    return out;\n  }\n  step() { const st = this.steps(); return st[this.state.idx] || null; }\n\n  startLesson(id) {\n    this.setState({ screen: 'play', lesson: id, exam: false, idx: 0, right: 0, wrong: 0, hearts: 5 }, () => this.resetEx());\n  }\n  startExam(uid) { this.setState({ screen: 'play', exam: uid || 'u1', lesson: null, idx: 0, right: 0, wrong: 0, hearts: 5 }, () => this.resetEx()); }\n  resetEx() {\n    const st = this.step();\n    const pool = [];\n    if (st && st.k === 'order') { for (let i = 0; i < st.items.length; i++) pool.push(i); pool.sort(() => Math.random() - 0.5); }\n    let mr = [];\n    if (st && st.k === 'match') { mr = st.pairs.map((_, i) => i).sort(() => Math.random() - 0.5); }\n    this._pool = pool; this._mr = mr;\n    const sl = st && st.k === 'weights' ? (st.max != null && st.max <= 1 ? st.max : 1) : 1;\n    const isTf = !!(st && st.k === 'tf');\n    const secs = isTf ? (st.sec || 10) : 0;\n    this._tfEnd = isTf ? Date.now() + (secs + 5) * 1000 : null;\n    this.setState({ sel: null, order: [], cloze: {}, mSel: null, mDone: [], mErr: 0, slider: sl, free: '', res: null, checked: false, tf: secs, tfg: isTf ? 5 : 0, tfSec: secs, tfEnd: this._tfEnd }, () => this.armTimer());\n  }\n  markDay() {\n    const t = this.today();\n    if (this.state.last === t) return {};\n    return { streak: (this.state.streak || 0) + 1, last: t };\n  }\n  judge(ok, timeout) {\n    const st = this.step();\n    this.stopTimer();\n    const patch = { checked: true, res: ok ? 'ok' : 'no' };\n    if (ok) { patch.right = this.state.right + 1; patch.xp = this.state.xp + 10; }\n    else {\n      patch.wrong = this.state.wrong + 1;\n      patch.hearts = Math.max(0, this.state.hearts - 1);\n      if (st && st.term) {\n        const q = this.tr(st.term), a = this.tr(st.ans);\n        if (!this.state.rq.some(r => r.q === q)) patch.rq = this.state.rq.concat([{ q, a }]);\n      }\n    }\n    Object.assign(patch, this.markDay());\n    this.setState(patch);\n  }\n  check() {\n    const st = this.step(), s = this.state;\n    if (!st) return;\n    if (st.k === 'tf') return this.judge(s.sel === (st.a ? 0 : 1));\n    if (st.k === 'choice' || st.k === 'predict') return this.judge(s.sel === st.c);\n    if (st.k === 'order') return this.judge(s.order.length === st.items.length && s.order.every((v, i) => v === i));\n    if (st.k === 'cloze') {\n      const ok = st.blanks.every((b, i) => b.a.some(a => this.norm(a) === this.norm(s.cloze[i] || '')));\n      return this.judge(ok);\n    }\n    if (st.k === 'match') return this.judge(s.mDone.length === st.pairs.length && s.mErr === 0);\n    if (st.k === 'spot') return this.judge(s.sel === st.bad);\n    if (st.k === 'weights') return this.judge(Math.abs(s.slider - st.target) <= st.tol);\n    if (st.k === 'free') {\n      const txt = this.norm(s.free);\n      const hits = st.rubric.filter(r => r.kw.some(k => txt.indexOf(this.norm(k)) >= 0)).length;\n      return this.judge(hits >= (st.need || 3));\n    }\n  }\n  next() {\n    const st = this.steps();\n    if (this.state.hearts <= 0) return this.setState({ screen: 'fail' });\n    if (this.state.idx + 1 >= st.length) return this.finish();\n    this.setState({ idx: this.state.idx + 1 }, () => this.resetEx());\n  }\n  finish() {\n    const s = this.state;\n    if (s.exam === 'final') return this.finishFinal();\n    const patch = { screen: 'done', xp: s.xp + 20 };\n    if (s.exam) { if ((s.examsDone || []).indexOf(s.exam) < 0) patch.examsDone = (s.examsDone || []).concat([s.exam]); }\n    else if (s.lesson && s.done.indexOf(s.lesson) < 0) patch.done = s.done.concat([s.lesson]);\n    Object.assign(patch, this.markDay());\n    this.setState(patch);\n  }\n  fi  EL ERROR', 'SPOT THE ERROR'), weights: p('AJUSTA EL PESO', 'SET THE WEIGHT'), free: p('ESCRITURA LIBRE', 'FREE WRITING'), tf: p('CONTRARRELOJ', 'AGAINST THE CLOCK') };\n    v.exKind = kinds[st.k] || '';\n    v.kTf = st.k === 'tf';\n    v.kOpts = st.k === 'choice' || st.k === 'predict' || st.k === 'tf';\n    v.kOrder = st.k === 'order'; v.kCloze = st.k === 'cloze'; v.kMatch = st.k === 'match';\n    v.kSpot = st.k === 'spot'; v.kWeights = st.k === 'weights'; v.kFree = st.k === 'free';\n    v.tfClock = (s.tfg || 0) > 0 ? p('LEE… ' + s.tfg, 'READ… ' + s.tfg) : String(s.tf).padStart(2, '0') + 's';\n    v.tfClockCss = (s.tfg || 0) > 0 ? 'color:#7d7690;' : 'color:#FF6B4A;';\n\n    let canCheck = false;\n\n    if (v.kOpts) {\n      const labels = st.k === 'tf' ? [p('Verdadero', 'True'), p('Falso', 'False')] : st.opts.map(o => this.tr(o));\n      const correct = st.k === 'tf' ? (st.a ? 0 : 1) : st.c;\n      v.opts = labels.map((lab, i) => {\n        let css = 'background:#1d1b24;border:1px solid rgba(255,255,255,.08);', tagCss = 'background:#2a2633;color:#8f88a2;', txtCss = '';\n        if (s.checked) {\n          if (i === correct) { css = 'background:#16241f;border:1px solid #7CE0C0;'; tagCss = 'background:#7CE0C0;color:#16141b;'; }\n          else if (i === s.sel) { css = 'background:#241a1c;border:1px solid #FF6B4A;'; tagCss = 'background:#FF6B4A;color:#16141b;'; }\n          else txtCss = 'color:#8f88a2;';\n        } else if (i === s.sel) { css = 'background:#2a2136;border:1px solid #8B7CF7;'; tagCss = 'background:#8B7CF7;color:#16141b;'; }\n        return { label: lab, tag: 'ABCD'[i] || '?', css, tagCss, txtCss, pick: () => !s.checked && this.setState({ sel: i }) };\n      });\n      if (st.k === 'tf') v.opts.forEach(o => { o.tag = o.label.slice(0, 1).toUpperCase(); });\n      canCheck = s.sel !== null;\n    }\n\n    if (v.kOrder) {\n      const used = s.order;\n      v.tray = used.map((ix, i) => ({ n: String(i + 1).padStart(2, '0'), label: this.tr(st.items[ix]), pick: () => !s.checked && this.setState({ order: used.filter((_, j) => j !== i) }) }));\n      v.trayEmpty = used.length === 0;\n      v.pool = (this._pool || []).filter(ix => used.indexOf(ix) < 0).map(ix => ({ label: this.tr(st.items[ix]), pick: () => !s.checked && this.setState({ order: used.concat([ix]) }) }));\n      canCheck = used.length === st.items.length;\n    }\n\n    if (v.kCloze) {\n      const txt = this.tr(st.text);\n      const chunks = txt.split(/\\{(\\d+)\\}/);\n      const parts = [];\n      chunks.forEach((c, i) => {\n        if (i % 2 === 0) { if (c) parts.push({ isTxt: true, isIn: false, txt: c, val: '', w: '0', css: '', isOk: false, isBad: false, sol: '', on: null }); }\n        else {\n          const bi = parseInt(c, 10);\n          const bOk = st.blanks[bi] && st.blanks[bi].a.some(a => this.norm(a) === this.norm(s.cloze[bi] || ''));\n          const bCss = !s.checked ? '' : bOk ? 'border-color:#7CE0C0;background:#16241f;color:#9FE8CE;' : 'border-color:#FF6B4A;background:#241a1c;color:#FF8E72;';\n          parts.push({ isTxt: false, isIn: true, css: bCss, isOk: !!(s.checked && bOk), isBad: !!(s.checked && !bOk), sol: this.tr(st.blanks[bi].a[0]), val: s.cloze[bi] || '', w: (st.blanks[bi] && st.blanks[bi].w) || '120px', on: (e) => { const nv = Object.assign({}, this.state.cloze); nv[bi] = e.target.value; this.setState({ cloze: nv }); } });\n        }\n      });\n      v.parts = parts;\n      canCheck = st.blanks.every((b, i) => (s.cloze[i] || '').trim().length > 0);\n    }\n\n    if (v.kMatch) {\n      const doneIdx = s.mDone;\n      v.mLeft = st.pairs.map((pr, i) => {\n        const isDone = doneIdx.indexOf(i) >= 0;\n        const css = isDone ? 'background:#16241f;border:1px solid rgba(124,224,192,.4);color:#7CE0C0;'\n          : s.mSel === i ? 'background:#2a2136;border:1px solid #8B7CF7;color:#F5F2EA;'\n            : 'background:#1d1b24;border:1px solid rgba(255,255,255,.08);color:#F5F2EA;';\n        return { label: this.tr(pr.a), css, pick: () => { if (s.checked || isDone) return; this.setState({ mSel: i }); } };\n      });\n      v.mRight = (this._mr || []).map(ix => {\n        const isDone = doneIdx.indexOf(ix) >= 0;\n        const css = isDone ? 'background:#16241f;border:1px solid rgba(124,224,192,.4);color:#9FE8CE;' : 'background:#1d1b24;border:1px solid rgba(255,255,255,.08);color:#C8C1D6;';\n        return {\n          label: this.tr(st.pairs[ix].b), css,\n          pick: () => {\n            if (s.checked || isDone || s.mSel === null) return;\n            if (s.mSel === ix) this.setState({ mDone: doneIdx.concat([ix]), mSel: null });\n            else this.setState({ mSel: null, mErr: s.mErr + 1 });\n          }\n        };\n      });\n      canCheck = doneIdx.length === st.pairs.length;\n    }\n\n    if (v.kSpot) {\n      v.frags = st.frags.map((f, i) => {\n        let css = 'background:#221f2a;border:1px solid rgba(255,255,255,.09);color:#D3CCE0;';\n        if (s.checked) {\n          if (i === st.bad) css = 'background:#16241f;border:1px solid #7CE0C0;color:#9FE8CE;';\n          else if (i === s.sel) css = 'background:#241a1c;border:1px solid #FF6B4A;color:#FF8E72;';\n        } else if (i === s.sel) css = 'background:#2a2136;border:1px solid #8B7CF7;color:#F5F2EA;';\n        return { label: this.tr(f), css, pick: () => !s.checked && this.setState({ sel: i }) };\n      });\n      canCheck = s.sel !== null;\n    }\n\n    if (v.kWeights) {\n      const val = s.slider.toFixed(2).replace(/0$/, '');\n      const lo = st.min == null ? 0.5 : st.min, hi = st.max == null ? 2 : st.max;\n      v.wMin = lo; v.wMax = hi;\n      v.wMinLabel = lo.toFixed(2).replace(/0$/, ''); v.wMaxLabel = hi.toFixed(2).replace(/0$/, '');\n      v.wVal = String(s.slider);\n      v.wPrompt = this.tr(st.pre) + '(' + this.tr(st.subject) + ':' + val + ')' + this.tr(st.post);\n      v.wOn = (e) => !s.checked && this.setState({ slider: parseFloat(e.target.value) });\n      v.wHint = p('Mueve el control y observa cómo cambia el guial antes de comprobar.', 'Move the slider and watch the guial change before you check.');\n      canCheck = true;\n    }\n\n    if (v.kFree) {\n      const txt = this.norm(s.free);\n      v.fText = s.free;\n      v.fOn = (e) => !s.checked && this.setState({ free: e.target.value });\n      v.fPlaceholder = this.tr(st.ph);\n      v.stim = this.tr(st.hint); v.hasStim = true;\n      v.fRubric = st.rubric.map(r => {\n        const hit = r.kw.some(k => txt.indexOf(this.norm(k)) >= 0);\n        return { label: this.tr(r.label), mark: hit ? '✓' : '·', markCss: hit ? 'background:#7CE0C0;color:#16141b;' : 'background:#2a2633;color:#6b6480;', txtCss: hit ? 'color:#9FE8CE;' : 'color:#8f88a2;' };\n      });\n      canCheck = s.free.trim().length > 12;\n    }\n\n    if (s.checked) {\n      const last = s.idx + 1 >= all.length;\n      v.primaryLabel = s.hearts <= 0 ? p('Ver resultado', 'See result') : last ? p('Terminar', 'Finish') : p('Seguir', 'Continue');\n      v.primaryCss = 'background:#7CE0C0;color:#16141b;box-shadow:0 5px 0 #4aa789;';\n      v.primary = () => this.next();\n    } else {\n      v.primaryLabel = p('Comprobar', 'Check');\n      v.primaryCss = canCheck ? 'background:#FF6B4A;color:#16141b;box-shadow:0 5px 0 #c34428;' : 'background:#242030;color:#6b6480;';\n      v.primary = () => canCheck && this.check();\n    }\n    v.showSkipCard = false;\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
