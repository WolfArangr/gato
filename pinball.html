<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SOLENOID — Pinball</title>
<style>
/* ============================================================
   SOLENOID — cabinet UI
   Palette:  cab #08090b · steel #7d858e · plate #14171b
             amber #ffab1f (DMD) · cyan #4fd6d2 · red #e0442f
   Type:     system condensed sans (apron plates) + mono (data)
   ============================================================ */
:root{
  --cab:#08090b; --plate:#14171b; --plate2:#1c2026;
  --steel:#7d858e; --steel-hi:#c8ced4;
  --amber:#ffab1f; --amber-dim:#7a5210;
  --cyan:#4fd6d2; --red:#e0442f; --green:#7ac74f;
  --ink:#e8ecf0; --ink-dim:#8b939c;
  --edge:rgba(255,255,255,.09);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --ui: ui-sans-serif, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  position:fixed; inset:0; width:100%; height:100%; overflow:hidden;
  background:var(--cab); color:var(--ink);
  font-family:var(--ui);
  touch-action:none; overscroll-behavior:none;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;
}
canvas{display:block;width:100%;height:100%;outline:none}
#glcanvas{position:absolute;inset:0}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-appearance:none}
button:focus-visible,.row:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- apron plate: the shared chrome of every panel ---------- */
.plate{
  background:linear-gradient(180deg,#20252b 0%,#14171b 55%,#0d1013 100%);
  border:1px solid var(--edge);
  border-radius:3px;
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset, 0 10px 30px rgba(0,0,0,.6);
}
.eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.28em;
  text-transform:uppercase; color:var(--steel);
}
.screwed{position:relative}
.screwed::before,.screwed::after{
  content:""; position:absolute; width:7px; height:7px; border-radius:50%; top:8px;
  background:radial-gradient(circle at 35% 30%, #b9c0c7, #4a5057 60%, #23272c);
  box-shadow:0 1px 1px rgba(0,0,0,.8);
}
.screwed::before{left:8px} .screwed::after{right:8px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);
  display:flex;flex-direction:column;justify-content:space-between}
#hudTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#hudLeft,#hudRight{display:flex;flex-direction:column;gap:4px}
#hudRight{align-items:flex-end}
#hudTable{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel)}
#hudMode{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber-dim)}
#hudScore{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--amber);
  text-shadow:0 0 12px rgba(255,171,31,.35);font-variant-numeric:tabular-nums;line-height:1}
#hudBalls{display:flex;gap:5px;align-items:center;justify-content:flex-end}
#hudBalls i{width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff,#9aa2ab 55%,#3a4046);
  box-shadow:0 0 3px rgba(0,0,0,.9)}
#hudBalls i.spent{background:#222629;box-shadow:none;opacity:.5}
#btnPause{pointer-events:auto;width:38px;height:32px;border:1px solid var(--edge);border-radius:3px;
  background:linear-gradient(180deg,#22272d,#12151a);color:var(--steel-hi);font-size:13px;letter-spacing:.1em}
#hudMultWrap{margin-top:6px;min-height:22px}
#hudMult{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:.06em}
#hudMultBar{width:104px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:4px;overflow:hidden}
#hudMultFill{display:block;height:100%;width:100%;background:var(--cyan);transform-origin:left center}
#hudBottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
#hudMsg{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);opacity:0;transition:opacity .25s}
#hudMsg.on{opacity:1}
#hudHint{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--steel);opacity:.75;text-align:right}
#tiltWarn{position:absolute;top:38%;left:0;right:0;text-align:center;font-family:var(--mono);
  font-size:clamp(18px,6vw,34px);letter-spacing:.3em;color:var(--red);text-shadow:0 0 18px rgba(224,68,47,.5)}

/* ---------- flipper touch zones (invisible, mobile) ---------- */
#zones{position:absolute;inset:0;display:none}
#zones.on{display:block}
.zone{position:absolute;top:0;bottom:0;width:50%;pointer-events:auto}
#zoneL{left:0} #zoneR{right:0}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 14px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px);
  background:radial-gradient(120% 90% at 50% 0%,rgba(10,12,15,.82),rgba(4,5,6,.96));
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
.panel{width:min(520px,100%);max-height:100%;overflow:auto;padding:20px 18px 18px;-webkit-overflow-scrolling:touch}
.panel::-webkit-scrollbar{width:0}

#brand{text-align:center;margin-bottom:16px}
#brandName{font-size:clamp(34px,11vw,58px);font-weight:800;letter-spacing:.22em;text-indent:.22em;
  background:linear-gradient(180deg,#f2f5f8 0%,#aeb6bf 42%,#5c646d 52%,#e6ebf0 74%,#8d959e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:.98}
.obal{display:inline-block;width:.66em;height:.66em;border-radius:50%;vertical-align:-.02em;
  margin:0 .04em;background:
    radial-gradient(circle at 34% 28%, #ffffff 0%, #e8edf2 12%, #9aa4ad 42%, #4c545c 68%, #23282d 88%, #10141a 100%);
  box-shadow:inset -.06em -.07em .12em rgba(0,0,0,.75), inset .05em .05em .1em rgba(255,255,255,.5),
    0 .04em .12em rgba(0,0,0,.6), 0 0 .5em rgba(180,200,220,.18);
  position:relative}
.obal::after{content:"";position:absolute;left:22%;top:12%;width:26%;height:18%;border-radius:50%;
  background:rgba(255,255,255,.9);filter:blur(.5px)}
#brandSub{margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.42em;color:var(--amber);text-indent:.42em}
#brandRule{height:2px;margin:14px 0 4px;background:
  repeating-linear-gradient(90deg,var(--amber) 0 8px,transparent 8px 16px);opacity:.5}

.menuBtn{display:flex;width:100%;align-items:center;gap:12px;padding:13px 14px;margin-top:8px;
  border:1px solid var(--edge);border-radius:3px;text-align:left;
  background:linear-gradient(180deg,#1e2329,#121519);transition:border-color .15s,transform .08s}
.menuBtn:active{transform:translateY(1px)}
.menuBtn:hover{border-color:rgba(255,171,31,.45)}
.menuBtn .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber);min-width:26px}
.menuBtn .t{font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.menuBtn .d{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--steel);letter-spacing:.1em}
.menuBtn.primary{background:linear-gradient(180deg,#3a2c10,#1d1608);border-color:rgba(255,171,31,.4)}
.menuBtn.primary .t{color:var(--amber)}

h2.head{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--steel);
  margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--edge)}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:6px;
  border:1px solid var(--edge);border-radius:3px;background:rgba(255,255,255,.02);width:100%;text-align:left}
.row .lbl{font-size:13px;letter-spacing:.08em}
.row .val{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  color:var(--amber);padding:4px 10px;border:1px solid rgba(255,171,31,.3);border-radius:2px;min-width:62px;text-align:center}
.row .val.off{color:var(--steel);border-color:var(--edge)}
.note{font-family:var(--mono);font-size:10px;line-height:1.7;color:var(--steel);letter-spacing:.06em;margin-top:12px}

.seg{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{flex:1;padding:10px 6px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--steel);background:#0f1215}
.seg button.on{color:#111;background:linear-gradient(180deg,#ffca5e,#ffab1f)}

.tableCard{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:8px;
  border:1px solid var(--edge);border-radius:3px;background:linear-gradient(180deg,#1c2026,#101317);text-align:left}
.tableCard:hover{border-color:rgba(79,214,210,.45)}
.tableCard .num{font-family:var(--mono);font-size:11px;color:var(--steel);letter-spacing:.1em}
.tableCard .nm{font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.tableCard .sub{font-family:var(--mono);font-size:10px;color:var(--steel);letter-spacing:.08em;margin-top:3px}
.tableCard .stars{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--amber);letter-spacing:.14em}
.tableCard .stars .off{color:#333a41}
.swatch{width:6px;align-self:stretch;border-radius:2px}

#introCard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;text-align:center}
#introNum{font-family:var(--mono);font-size:11px;letter-spacing:.5em;color:var(--amber);text-indent:.5em}
#introName{margin-top:10px;font-size:clamp(26px,8vw,46px);font-weight:800;letter-spacing:.16em;text-indent:.16em;
  color:#eef2f6;text-shadow:0 6px 30px rgba(0,0,0,.9)}
#introRule{margin-top:12px;width:min(280px,60vw);height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}

#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cdText{font-family:var(--mono);font-size:clamp(60px,22vw,140px);font-weight:700;color:var(--amber);
  text-shadow:0 0 40px rgba(255,171,31,.35);font-variant-numeric:tabular-nums}

#buildWrap{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
#buildCanvas{flex:0 0 auto;border:1px solid var(--edge);border-radius:3px;background:#0c0f13;touch-action:none}
#buildPalette{display:flex;flex-direction:column;gap:5px;flex:1 1 auto;min-width:0}
.palBtn{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid var(--edge);border-radius:3px;
  background:#12161a;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:left}
.palBtn.on{border-color:var(--amber);color:var(--amber);background:#241a08}
.palBtn u{width:12px;height:12px;border-radius:50%;display:inline-block;text-decoration:none;flex:0 0 auto}
#buildStatus{min-height:2.4em}
#buildStatus.bad{color:var(--red)}
#buildStatus.good{color:var(--green)}
#buildList .row{cursor:pointer}
#goScore{font-family:var(--mono);font-size:clamp(30px,10vw,52px);font-weight:700;color:var(--amber);
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
#goBest{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--steel);margin-top:8px}
#goStars{font-family:var(--mono);font-size:26px;letter-spacing:.22em;color:var(--amber);margin:14px 0 4px}
#goStars .off{color:#333a41}
#goBreak{font-family:var(--mono);font-size:11px;line-height:2;color:var(--ink-dim);letter-spacing:.08em;margin-top:10px;
  border-top:1px solid var(--edge);padding-top:10px}
#goBreak b{color:var(--ink);float:right;font-weight:400}

#loadErr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:#08090b;font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--red);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>

<div id="zones"><div class="zone" id="zoneL"></div><div class="zone" id="zoneR"></div></div>

<div id="hud" class="hidden">
  <div id="hudTop">
    <div id="hudLeft">
      <div id="hudTable">—</div>
      <div id="hudMode">—</div>
      <div id="hudMultWrap">
        <span id="hudMult"></span>
        <div id="hudMultBar" class="hidden"><i id="hudMultFill"></i></div>
      </div>
    </div>
    <div id="hudRight">
      <div id="hudScore">0</div>
      <div id="hudBalls"></div>
      <button id="btnPause" aria-label="Pause">❚❚</button>
    </div>
  </div>
  <div id="hudBottom">
    <div id="hudMsg"></div>
    <div id="hudHint"></div>
  </div>
</div>

<div id="tiltWarn" class="hidden">TILT</div>

<div id="introCard" class="hidden">
  <div id="introNum"></div>
  <div id="introName"></div>
  <div id="introRule"></div>
</div>

<div id="countdown" class="hidden"><span id="cdText">3</span></div>

<div id="menu" class="overlay">
  <div class="panel plate screwed" id="menuPanel">

    <div id="screenTitle">
      <div id="brand">
        <div id="brandName">S<i class="obal"></i>LEN<i class="obal"></i>ID</div>
        <div id="brandSub" data-i18n="tagline">TRES MESAS · ACERO Y CRISTAL</div>
        <div id="brandRule"></div>
      </div>
      <button class="menuBtn primary" id="btnPlay"><span class="k">01</span><span class="t" data-i18n="play">Jugar partida</span><span class="d" id="lastPlayed"></span></button>
      <button class="menuBtn" id="btnEndless"><span class="k">02</span><span class="t" data-i18n="endless">Maratón</span><span class="d" id="endlessBest"></span></button>
      <button class="menuBtn" id="btnBuilder"><span class="k">03</span><span class="t" data-i18n="builder">Constructor de mesas</span><span class="d" id="customCount"></span></button>
      <button class="menuBtn" id="btnHowto"><span class="k">04</span><span class="t" data-i18n="howto">Cómo se juega</span></button>
      <button class="menuBtn" id="btnOptions"><span class="k">05</span><span class="t" data-i18n="options">Ajustes</span></button>
      <div class="note" id="titleNote"></div>
    </div>

    <div id="screenTables" class="hidden">
      <h2 class="head" data-i18n="chooseTable">Elige mesa</h2>
      <div class="seg" id="diffSeg">
        <button id="diffN" data-i18n="normal">Normal</button>
        <button id="diffH" data-i18n="hard">Difícil</button>
      </div>
      <div id="tableList"></div>
      <button class="menuBtn" id="btnTablesBack"><span class="k">←</span><span class="t" data-i18n="back">Volver</span></button>
    </div>

    <div id="screenOptions" class="hidden">
      <h2 class="head" data-i18n="options">Ajustes</h2>
      <div id="optList"></div>
      <button class="menuBtn" id="btnOptionsBack"><span class="k">←</span><span class="t" data-i18n="back">Volver</span></button>
    </div>

    <div id="screenBuilder" class="hidden">
      <h2 class="head" data-i18n="builder">Constructor de mesas</h2>
      <div id="buildWrap">
        <canvas id="buildCanvas"></canvas>
        <div id="buildPalette"></div>
      </div>
      <div class="note" id="buildStatus"></div>
      <div class="seg" id="buildActions">
        <button id="btnBuildPlay" data-i18n="testPlay">Probar</button>
        <button id="btnBuildSave" data-i18n="save">Guardar</button>
        <button id="btnBuildClear" data-i18n="clear">Vaciar</button>
      </div>
      <div id="buildList"></div>
      <button class="menuBtn" id="btnBuilderBack"><span class="k">←</span><span class="t" data-i18n="back">Volver</span></button>
    </div>

    <div id="screenHowto" class="hidden">
      <h2 class="head" data-i18n="howto">Cómo se juega</h2>
      <div class="note" id="howtoBody"></div>
      <button class="menuBtn" id="btnHowtoBack"><span class="k">←</span><span class="t" data-i18n="back">Volver</span></button>
    </div>

  </div>
</div>

<div id="pauseOverlay" class="overlay hidden">
  <div class="panel plate screwed">
    <h2 class="head" data-i18n="paused">Pausa</h2>
    <button class="menuBtn primary" id="btnResume"><span class="k">▶</span><span class="t" data-i18n="resume">Continuar</span></button>
    <button class="menuBtn" id="btnRestart"><span class="k">↻</span><span class="t" data-i18n="restart">Reiniciar</span></button>
    <button class="menuBtn" id="btnPauseOptions"><span class="k">⚙</span><span class="t" data-i18n="options">Ajustes</span></button>
    <button class="menuBtn" id="btnQuit"><span class="k">✕</span><span class="t" data-i18n="quit">Salir al menú</span></button>
  </div>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="panel plate screwed" style="text-align:center">
    <div class="eyebrow" id="goTitle">FIN DE PARTIDA</div>
    <div id="goScore">0</div>
    <div id="goBest"></div>
    <div id="goStars"></div>
    <div id="goBreak"></div>
    <button class="menuBtn primary" id="btnAgain" style="margin-top:16px"><span class="k">↻</span><span class="t" data-i18n="again">Otra partida</span></button>
    <button class="menuBtn" id="btnMenu"><span class="k">←</span><span class="t" data-i18n="quit">Salir al menú</span></button>
  </div>
</div>

<div id="loadErr" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
/* =============================================================================
   SOLENOID — a single-file 3D pinball simulator.
   Units are SI: metres, seconds, m/s. A real ball is 27 mm across; a real
   playfield is about 0.52 x 1.06 m at a 6.5 degree incline. Everything below
   is in those units, so the numbers can be checked against a real machine.
   ============================================================================= */

/* -----------------------------------------------------------------------------
   1. TUNING — every number a designer would want to move lives here.
   -------------------------------------------------------------------------- */
var T = {
  /* --- ball & table -------------------------------------------------------- */
  ballR:        0.0135,   // 27 mm ball, radius in metres
  ballMass:     0.080,    // 80 g steel ball
  incline:      6.5,      // playfield tilt in degrees (real machines: 6.0 - 7.0)
  inclineHard:  7.3,      // Hard mode plays steeper => faster, less time to react
  gravity:      9.81,
  rollFriction: 0.16,     // per second velocity bleed while rolling on the wood
  railFriction: 0.55,     // higher: wireform ramps scrub more speed
  maxSpeed:     7.0,      // hard cap; real balls rarely exceed ~6 m/s
  restSpeed:    0.020,    // below this on a flat spot the ball is considered parked
  searchSpeed:  0.055,    // ball search: speed under which a ball counts as idle
  searchWait:   2.2,      // seconds of idling before the machine shakes it
  searchTries:  4,        // after this many shakes, send the ball home instead

  /* --- integration --------------------------------------------------------- */
  maxStep:      1/240,    // never integrate a bigger slice than this
  minStep:      1/2400,   // floor, so a fast ball cannot stall the loop
  stepTravel:   0.7,      // substep so travel <= stepTravel * ballR  (spec 4)
  maxSubSteps:  40,       // budget per frame; beyond this we accept slowdown
  posIters:     3,        // collision resolution passes per substep

  /* --- flippers ------------------------------------------------------------ */
  flipLen:      0.082,    // pivot to tip
  flipR0:       0.0115,   // radius at the pivot
  flipR1:       0.0068,   // radius at the tip (tapered, like a real bat)
  flipRest:    -32,       // degrees from +x, left flipper at rest
  flipSwing:    50,       // degrees of travel
  flipUpSpeed:  27.0,     // rad/s going up (solenoid)
  flipDnSpeed:  17.0,     // rad/s falling back (spring)
  flipRestit:   0.42,     // how bouncy the rubber is
  flipGrab:     0.55,     // fraction of surface velocity transferred (live catch)

  /* --- scoring elements ---------------------------------------------------- */
  bumperKick:   2.55,     // m/s imparted by a pop bumper
  bumperMin:    0.30,     // impact speed needed to trigger it
  slingKick:    2.35,
  slingMin:     0.28,
  spinnerVal:   130,      // per revolution
  wallRestit:   0.42,
  postRestit:   0.66,
  rubberRestit: 0.74,
  targetRestit: 0.35,

  /* --- plunger ------------------------------------------------------------- */
  plungeMin:    1.55,     // m/s at zero charge (dribbles to the first lane)
  plungeMax:    4.30,     // full charge clears the top arc
  plungeTime:   0.95,     // seconds to full charge
  skillWindow:  1.10,     // seconds after launch in which a lane scores skill shot

  /* --- game ---------------------------------------------------------------- */
  balls:        3,
  ballSave:     7.0,      // seconds of free save at the start of every ball
  ballSaveHard: 4.0,
  tiltWarnings: 2,        // third nudge tilts the ball away
  nudgeImpulse: 0.42,     // m/s sideways per nudge
  nudgeCooldown:0.55,

function tableName(tb) { return tb.name[LANG] || tb.name.es; }
function tableSub(tb) { return tb.sub[LANG] || tb.sub.es; }
/* -----------------------------------------------------------------------------
   7. PHYSICS
   A ball is a disc on the inclined plane (x, y) plus a scalar elevation z.
   While it is on a ramp it leaves the plane entirely and becomes a scalar
   distance along a Rail. There are no rigid bodies and no solver: contacts are
   resolved analytically against segments, discs and swept flipper capsules,
   substepped so a ball never moves more than 0.7 of its radius per step.
   -------------------------------------------------------------------------- */

var REST_VN = 0.06;
var SWITCH_VN = 0.22;  // approach speed a scoring switch needs to close
var SWITCH_CD = 0.22;  // switch debounce, seconds   // below this approach speed a contact is resting, not an impact

function Ball(x, y) {
  this.p = { x: x, y: y };
  this.v = { x: 0, y: 0 };
  this.z = 0;
  this.r = T.ballR;
  this.rail = null; this.s = 0; this.sv = 0; this.railCd = 0;
  this.held = null; this.holdT = 0;
  this.inLane = true;        // parked against the plunger
  this.dead = false;
  this.idle = 0;             // seconds spent barely moving (ball search)
  this.rot = { x: 0, y: 0, z: 0, w: 1 };  // visual roll quaternion
  this.trail = 0;
}

function World(def, opts) {
  opts = opts || {};
  this.def = def;
  this.incline = (opts.incline != null ? opts.incline : T.incline);
  this.g = T.gravity * Math.sin(this.incline * DEG);        // down-table pull
  this.gN = T.gravity * Math.cos(this.incline * DEG);       // into the wood
  this.balls = [];
  this.events = [];
  this.time = 0;
  this.segs = []; this.circles = []; this.zones = [];
  this.rails = []; this.flippers = [];
  this.dropGroups = {};
  this.build();
}

World.prototype.emit = function (type, o) {
  o = o || {}; o.type = type; this.events.push(o);
};

World.prototype._poly = 0;
World.prototype.addPoly = function (w) {
  var pts = w.pts, i, pid = (this._polyId = (this._polyId || 0) + 1);
  for (i = 0; i < pts.length - 1; i++) {
    this.segs.push({
      ax: pts[i][0], ay: pts[i][1], bx: pts[i + 1][0], by: pts[i + 1][1],
      rad: w.rad != null ? w.rad : 0.005,
      e: w.e != null ? w.e : T.wallRestit,
      f: w.f != null ? w.f : 0.06,
      kick: w.kick || 0, tag: w.tag || 'wall',
      gate: w.gate || 0, gateX: w.gateX || 0, on: true, hitT: 0, group: w.group, idx: w.idx, poly: pid
    });
  }
};

/* A target is a short segment facing `deg`, plus a visible plate. */
World.prototype.addTarget = function (x, y, deg, tag, group, idx) {
  var a = deg * DEG, nx = Math.cos(a), ny = Math.sin(a), w = 0.016;
  this.addPoly({
    pts: [[x - (-ny) * w, y - nx * w], [x + (-ny) * w, y + nx * w]],
    rad: 0.006, e: T.targetRestit, f: 0.2, tag: tag, group: group, idx: idx
  });
  var s = this.segs[this.segs.length - 1];
  s.nx = nx; s.ny = ny; s.tx = x; s.ty = y; s.deg = deg;
  return s;
};

World.prototype.build = function () {
  var d = this.def, i, cab = cabinet();
  for (i = 0; i < cab.walls.length; i++) this.addPoly(cab.walls[i]);
  this.slingTris = cab.slingTris;
  // shooter lane floor, so the ball parks against the plunger
  this.addPoly({ pts: [[LANE_IN - 0.002, 0.038], [LANE_OUT, 0.038]], tag: 'plunger', e: 0.05 });
  if (d.walls) for (i = 0; i < d.walls.length; i++) this.addPoly(d.walls[i]);

  if (d.posts) for (i = 0; i < d.posts.length; i++) {
    var p = d.posts[i];
    this.circles.push({ x: p[0], y: p[1], r: p[2], e: T.postRestit, f: 0.05, kick: 0, tag: 'post', on: true, hitT: 0 });
  }
  if (d.bumpers) for (i = 0; i < d.bumpers.length; i++) {
    var b = d.bumpers[i];
    this.circles.push({ x: b[0], y: b[1], r: b[2], e: 0.30, f: 0.02, kick: T.bumperKick, tag: 'bumper', on: true, hitT: 0, idx: i });
  }
  if (d.drops) {
    this.dropGroups.main = [];
    for (i = 0; i < d.drops.length; i++) {
      var t0 = d.drops[i];
      var sgm = this.addTarget(t0[0], t0[1], t0[2], 'drop', 'main', i);
      sgm.down = false;
      this.dropGroups.main.push(sgm);
    }
  }
  if (d.standups) for (i = 0; i < d.standups.length; i++) {
    var t1 = d.standups[i];
    this.addTarget(t1[0], t1[1], t1[2], 'standup', null, i).e = 0.55;
  }
  if (d.lanes) for (i = 0; i < d.lanes.length; i++) {
    var l = d.lanes[i];
    this.zones.push({ kind: 'lane', x: l[0], y: l[1], r: l[2], id: l[3], armed: true, lit: false, cd: 0 });
  }
  if (d.orbits) for (i = 0; i < d.orbits.length; i++) {
    var o = d.orbits[i];
    this.zones.push({ kind: 'orbit', x: o[0], y: o[1], r: o[2], id: o[3], armed: true, cd: 0 });
  }
  if (d.spinners) for (i = 0; i < d.spinners.length; i++) {
    var sp = d.spinners[i];
    this.zones.push({ kind: 'spinner', x: sp[0], y: sp[1], r: 0.024, id: i, armed: true, spin: 0, deg: sp[2], cd: 0 });
  }
  if (d.saucers) for (i = 0; i < d.saucers.length; i++) {
    var sc = d.saucers[i];
    this.zones.push({ kind: 'saucer', x: sc[0], y: sc[1], r: sc[2], id: i, eject: sc[3], armed: true, cd: 0 });
  }
  // kickback lives in the left outlane; it only fires when the game lights it
  this.zones.push({ kind: 'kickback', x: -0.240, y: 0.115, r: 0.022, id: 0, armed: true, lit: false });

  if (d.rails) for (i = 0; i < d.rails.length; i++) this.rails.push(new Rail(d.rails[i]));

  var fd = flipperDefs();
  for (i = 0; i < fd.length; i++) {
    var f = fd[i];
    this.flippers.push({
      side: f.side, px: f.px, py: f.py, len: T.flipLen,
      r0: T.flipR0, r1: T.flipR1,
      rest: f.rest * DEG, end: (f.rest + f.swing) * DEG,
      ang: f.rest * DEG, w: 0, pressed: false, hitT: 0
    });
  }
};

/* --- flippers -------------------------------------------------------------- */
World.prototype.stepFlippers = function (h) {
  for (var i = 0; i < this.flippers.length; i++) {
    var f = this.flippers[i], target = f.pressed ? f.end : f.rest;
    var speed = (f.pressed ? T.flipUpSpeed : T.flipDnSpeed);
    var diff = target - f.ang, step = speed * h * (diff >= 0 ? 1 : -1);
    if (Math.abs(step) >= Math.abs(diff)) { f.w = diff / h; f.ang = target; }
    else { f.w = step / h; f.ang += step; }
    f.tipx = f.px + Math.cos(f.ang) * f.len;
    f.tipy = f.py + Math.sin(f.ang) * f.len;
  }
};

/* --- generic contact resolution -------------------------------------------- */
World.prototype.hitSeg = function (b, c) {
  if (!c.on) return;
  if (c.gate && (c.gate > 0 ? b.v.y <= 0 : b.v.y >= 0)) return;
  if (c.gateX && (c.gateX > 0 ? b.v.x <= 0 : b.v.x >= 0)) return;
  closestOnSeg(b.p.x, b.p.y, c.ax, c.ay, c.bx, c.by, _cp);
  var dx = b.p.x - _cp.x, dy = b.p.y - _cp.y, d = len2(dx, dy), rr = b.r + c.rad;
  if (d >= rr) return;
  var nx, ny;
  if (d < 1e-7) { nx = -(c.by - c.ay); ny = (c.bx - c.ax); var l = len2(nx, ny) || 1; nx /= l; ny /= l; d = 1e-7; }
  else { nx = dx / d; ny = dy / d; }
  b.p.x += nx * (rr - d); b.p.y += ny * (rr - d);
  var vn = b.v.x * nx + b.v.y * ny;
  if (vn < 0) {
    var spd = len2(b.v.x, b.v.y);
    var tx = b.v.x - vn * nx, ty = b.v.y - vn * ny;
    // Restitution and friction belong to an impact. A ball merely leaning on a
    // wall is resolved every substep, so charging it friction each time would
    // scrub away all sideways motion and glue it in place: for a resting
    // contact, cancel the normal component and leave the tangent alone.
    var rest = -vn < REST_VN;
    b.v.x = tx * (rest ? 1 : (1 - c.f)) - vn * (rest ? 0 : c.e) * nx;
    b.v.y = ty * (rest ? 1 : (1 - c.f)) - vn * (rest ? 0 : c.e) * ny;
    if (c.kick && -vn > T.slingMin) { b.v.x += nx * c.kick; b.v.y += ny * c.kick; }
    c.hitT = this.time;
    if (c.tag !== 'wall' && c.tag !== 'gate' && c.tag !== 'plunger') {
      // A scoring switch needs a real strike and a debounce, or a ball merely
      // leaning on a target closes it on every substep and scores forever.
      if (-vn > SWITCH_VN && this.time - (c.scoreT || -9) > SWITCH_CD) {
        c.scoreT = this.time;
        this.emit('hit', { tag: c.tag, spd: spd, x: _cp.x, y: _cp.y, group: c.group, idx: c.idx, seg: c, ball: b });
      }
    } else if (spd > 1.2) this.emit('thud', { tag: c.tag, spd: spd, x: _cp.x, y: _cp.y });
  }
};

World.prototype.hitCircle = function (b, c) {
  if (!c.on) return;
  var dx = b.p.x - c.x, dy = b.p.y - c.y, d = len2(dx, dy), rr = b.r + c.r;
  if (d >= rr) return;
  var nx, ny;
  if (d < 1e-7) { nx = 0; ny = 1; d = 1e-7; } else { nx = dx / d; ny = dy / d; }
  b.p.x = c.x + nx * rr; b.p.y = c.y + ny * rr;
  var vn = b.v.x * nx + b.v.y * ny;
  if (vn < 0) {
    var spd = len2(b.v.x, b.v.y);
    var tx = b.v.x - vn * nx, ty = b.v.y - vn * ny;
    if (c.kick && spd > T.bumperMin) {
      b.v.x = tx * 0.30 + nx * c.kick;
      b.v.y = ty * 0.30 + ny * c.kick;
    } else {
      var rest2 = -vn < REST_VN;
      b.v.x = tx * (rest2 ? 1 : (1 - c.f)) - vn * (rest2 ? 0 : c.e) * nx;
      b.v.y = ty * (rest2 ? 1 : (1 - c.f)) - vn * (rest2 ? 0 : c.e) * ny;
    }
    c.hitT = this.time;
    if (-vn > SWITCH_VN && this.time - (c.scoreT || -9) > SWITCH_CD) {
      c.scoreT = this.time;
      this.emit('hit', { tag: c.tag, spd: spd, x: c.x, y: c.y, idx: c.idx, ball: b });
    }
  }
};

World.prototype.hitFlipper = function (b, f) {
  var tt = closestOnSeg(b.p.x, b.p.y, f.px, f.py, f.tipx, f.tipy, _cp);
  var rad = f.r0 + (f.r1 - f.r0) * tt;
  var dx = b.p.x - _cp.x, dy = b.p.y - _cp.y, d = len2(dx, dy), rr = b.r + rad;
  if (d >= rr) return;
  var nx, ny;
  if (d < 1e-7) { nx = 0; ny = 1; d = 1e-7; } else { nx = dx / d; ny = dy / d; }
  b.p.x += nx * (rr - d); b.p.y += ny * (rr - d);
  // surface velocity of the bat at the contact point
  var rx = _cp.x - f.px, ry = _cp.y - f.py;
  var sx = -f.w * ry, sy = f.w * rx;
  var vx = b.v.x - sx, vy = b.v.y - sy;
  var vn = vx * nx + vy * ny;
  if (vn < 0) {
    var spd = len2(b.v.x, b.v.y);
    var tx = vx - vn * nx, ty = vy - vn * ny;
    var deaden = Math.abs(f.w) < 0.5 ? (-vn < REST_VN ? 1 : (1 - T.flipGrab)) : 0.94;
    vx = tx * deaden - vn * T.flipRestit * nx;
    vy = ty * deaden - vn * T.flipRestit * ny;
    b.v.x = vx + sx; b.v.y = vy + sy;
    f.hitT = this.time;
    this.emit('hit', { tag: 'flipper', spd: spd, x: _cp.x, y: _cp.y, live: Math.abs(f.w) > 4, ball: b });
  }
};

/* --- one ball, one substep, on the playfield -------------------------------- */
World.prototype.fieldStep = function (b, h) {
  b.v.y -= this.g * h;
  var damp = 1 - T.rollFriction * h; if (damp < 0) damp = 0;
  b.v.x *= damp; b.v.y *= damp;
  b.p.x += b.v.x * h; b.p.y += b.v.y * h;

  var i, k;
  for (k = 0; k < T.posIters; k++) {
    for (i = 0; i < this.segs.length; i++) this.hitSeg(b, this.segs[i]);
    for (i = 0; i < this.circles.length; i++) this.hitCircle(b, this.circles[i]);
    for (i = 0; i < this.flippers.length; i++) this.hitFlipper(b, this.flippers[i]);
  }
  var sp = len2(b.v.x, b.v.y);
  if (sp > T.maxSpeed) { b.v.x *= T.maxSpeed / sp; b.v.y *= T.maxSpeed / sp; }
  if (b.p.y > 0.06) b.inLane = false;

  // ramp capture: close to the mouth, moving along it, fast enough to commit
  if (b.railCd <= 0) {
    for (i = 0; i < this.rails.length; i++) {
      var R = this.rails[i];
      var ddx = b.p.x - R.entry[0], ddy = b.p.y - R.entry[1];
      if (ddx * ddx + ddy * ddy > 0.00098) continue;      // ~31 mm mouth
      var vs = len2(b.v.x, b.v.y); if (vs < R.minEntry) continue;
      var tl = len2(R.entryT[0], R.entryT[1]) || 1;
      var dot = (b.v.x * R.entryT[0] + b.v.y * R.entryT[1]) / (vs * tl);
      if (dot < 0.55) continue;
      b.rail = R; b.s = 0; b.sv = vs * dot; b.z = R.entry[2];
      this.emit('railIn', { rail: R, ball: b, spd: vs });
      break;
    }

};

/* --- one ball, one substep, constrained to a rail --------------------------- */
World.prototype.railStep = function (b, h) {
  var R = b.rail, tan = R.tangentAt(b.s);
  var a = -(this.g * tan[1] + this.gN * tan[2]) - T.railFriction * b.sv;
  b.sv += a * h;
  b.s += b.sv * h;
  if (b.s >= R.length) {
    var te = R.exitT, sp = Math.max(b.sv, 0.35);
    b.p.x = R.exit[0]; b.p.y = R.exit[1]; b.z = 0;
    b.v.x = te[0] * sp; b.v.y = te[1] * sp;
    b.rail = null; b.railCd = 0.35;
    this.emit('railOut', { rail: R, ball: b, made: true });
    return;
  }
  if (b.s <= 0) {
    var ti = R.entryT, sp2 = Math.max(-b.sv, 0.25);
    b.p.x = R.entry[0]; b.p.y = R.entry[1]; b.z = 0;
    b.v.x = -ti[0] * sp2; b.v.y = -ti[1] * sp2;
    b.rail = null; b.railCd = 0.45;
    this.emit('railOut', { rail: R, ball: b, made: false });
    return;
  }
  var o = [0, 0, 0]; R.posAt(b.s, o);
  b.p.x = o[0]; b.p.y = o[1]; b.z = o[2];
};

/* --- triggers --------------------------------------------------------------- */
World.prototype.zoneStep = function (b, h) {
  for (var i = 0; i < this.zones.length; i++) {
    var z = this.zones[i];
    var dx = b.p.x - z.x, dy = b.p.y - z.y, d2 = dx * dx + dy * dy;
    var inside = d2 < z.r * z.r;
    if (z.kind === 'saucer') {
      if (z.cd > 0) { z.cd -= h; continue; }
      if (inside && !b.held && !b.rail) {
        b.held = z; b.holdT = 1.15; b.v.x = 0; b.v.y = 0;
        b.p.x = z.x; b.p.y = z.y;
        this.emit('saucer', { id: z.id, ball: b, zone: z });
      }
      continue;
    }
    if (z.kind === 'kickback') {
      if (inside && z.lit && b.v.y < 0) {
        z.lit = false;
        b.v.x = 0.55; b.v.y = 3.7;
        this.emit('kickback', { ball: b });
      }
      continue;
    }
    // A trigger needs distance AND time to re-arm: a ball rattling in the mouth
    // of a spinner must not be able to score it sixty times a second.
    if (z.cd > 0) z.cd -= h;
    if (!inside) { if (d2 > z.r * z.r * 2.4) z.armed = true; continue; }
    if (!z.armed || z.cd > 0) continue;
    z.armed = false; z.cd = 0.85;
    if (z.kind === 'spinner') {
      var sp = len2(b.v.x, b.v.y);
      z.spin = Math.min(28, Math.round(sp * 6));
      b.v.x *= 0.94; b.v.y *= 0.94;
      this.emit('spinner', { id: z.id, spins: z.spin, ball: b, zone: z });
    } else if (z.kind === 'lane') {
      this.emit('lane', { id: z.id, ball: b, zone: z });
    } else if (z.kind === 'orbit') {
      this.emit('orbit', { id: z.id, ball: b, zone: z });
    }
  }
};

/* --- ball to ball ----------------------------------------------------------- */
World.prototype.ballPairs = function () {
  var B = this.balls, i, j;
  for (i = 0; i < B.length; i++) for (j = i + 1; j < B.length; j++) {
    var a = B[i], b = B[j];
    if (a.dead || b.dead || a.rail || b.rail || a.held || b.held) continue;
    var dx = b.p.x - a.p.x, dy = b.p.y - a.p.y, d = len2(dx, dy), rr = a.r + b.r;
    if (d >= rr || d < 1e-7) continue;
    var nx = dx / d, ny = dy / d, pen = (rr - d) * 0.5;
    a.p.x -= nx * pen; a.p.y -= ny * pen; b.p.x += nx * pen; b.p.y += ny * pen;
    var rvn = (b.v.x - a.v.x) * nx + (b.v.y - a.v.y) * ny;
    if (rvn >= 0) continue;
    var imp = -(1 + 0.92) * rvn * 0.5;
    a.v.x -= imp * nx; a.v.y -= imp * ny; b.v.x += imp * nx; b.v.y += imp * ny;
    this.emit('clack', { spd: -rvn, x: a.p.x, y: a.p.y });
  }
};

/* --- main integration ------------------------------------------------------- */
World.prototype.step = function (dt) {
  dt = clamp(dt, 0, 0.05);
  var maxV = 0.001, i, b;
  for (i = 0; i < this.balls.length; i++) {
    b = this.balls[i];
    if (b.dead) continue;
    var sv = b.rail ? Math.abs(b.sv) : len2(b.v.x, b.v.y);
    if (sv > maxV) maxV = sv;
  }
  var h = clamp(T.stepTravel * T.ballR / maxV, T.minStep, T.maxStep);
  var n = Math.min(T.maxSubSteps, Math.max(1, Math.ceil(dt / h)));
  h = dt / n;
  for (var k = 0; k < n; k++) {
    this.time += h;
    this.stepFlippers(h);
    for (i = 0; i < this.balls.length; i++) {
      b = this.balls[i];
      if (b.dead) continue;
      if (b.held) {
        b.holdT -= h;
        if (b.holdT <= 0) {
          var z = b.held, a = (z.eject != null ? z.eject : 90) * DEG;
          b.v.x = Math.cos(a) * 3.0; b.v.y = Math.sin(a) * 3.0;
          z.cd = 0.45; z.armed = true; b.held = null;
          this.emit('eject', { ball: b, zone: z });
        }
        continue;
      }
      if (b.rail) this.railStep(b, h); else this.fieldStep(b, h);
      this.zoneStep(b, h);
      // roll for the visual: omega = (up x travel) / r, integrated as a quaternion
      this.spin(b, h);
      // drain
      if (b.p.y < -0.005 && !b.dead) { b.dead = true; this.emit('drain', { ball: b }); }
      // Ball search. A ball can find a genuine equilibrium in the V between two
      // parts, exactly as it can on a real machine, so the machine shakes it
      // loose rather than hanging. A ball held on a raised flipper is a cradle,
      // not a jam, and must never be disturbed.
      var spd2 = b.rail ? Math.abs(b.sv) : len2(b.v.x, b.v.y);
      var cradled = false;
      for (var fi = 0; fi < this.flippers.length; fi++) {
        var ff = this.flippers[fi];
        if (!ff.pressed) continue;
        var dxf = b.p.x - ff.px, dyf = b.p.y - ff.py;
        if (dxf * dxf + dyf * dyf < 0.0125) { cradled = true; break; }
      }
      if (spd2 < T.searchSpeed && !b.inLane && !b.rail && !cradled) {
        b.idle += h;
        if (b.idle > T.searchWait) {
          b.searches = (b.searches || 0) + 1;
          if (b.searches > T.searchTries) {
            b.v.x = rnd(-0.3, 0.3); b.v.y = -2.2;      // give up and send it home
          } else {
            var sa = rnd(0, 6.2832), mg = 0.55 + 0.4 * b.searches;
            b.v.x += Math.cos(sa) * mg;
            b.v.y += Math.sin(sa) * mg * 0.6 - 0.15;
          }
          b.idle = 0;
          this.emit('search', { n: b.searches });
        }
      } else {
        b.idle = 0;
        if (spd2 > 0.5) b.searches = 0;
      }
    }
    this.ballPairs();
  }
};

World.prototype.spin = function (b, h) {
  var vx = b.v.x, vy = b.v.y;
  if (b.rail) { var tn = b.rail.tangentAt(b.s); vx = tn[0] * b.sv; vy = tn[1] * b.sv; }
  var sp = len2(vx, vy);
  if (sp < 1e-4) return;
  // axis = up x direction, in table space up is +z
  var ax = -vy / sp, ay = vx / sp, ang = (sp * h) / b.r;
  var s = Math.sin(ang * 0.5), q = { x: ax * s, y: ay * s, z: 0, w: Math.cos(ang * 0.5) };
  var r = b.rot;
  var nx = q.w * r.x + q.x * r.w + q.y * r.z - q.z * r.y;
  var ny = q.w * r.y - q.x * r.z + q.y * r.w + q.z * r.x;
  var nz = q.w * r.z + q.x * r.y - q.y * r.x + q.z * r.w;
  var nw = q.w * r.w - q.x * r.x - q.y * r.y - q.z * r.z;
  var l = Math.sqrt(nx * nx + ny * ny + nz * nz + nw * nw) || 1;
  r.x = nx / l; r.y = ny / l; r.z = nz / l; r.w = nw / l;
};

World.prototype.nudge = function (dir) {
  for (var i = 0; i < this.balls.length; i++) {
    var b = this.balls[i];
    if (b.dead || b.rail) continue;
    b.v.x += dir * T.nudgeImpulse;
    b.v.y += T.nudgeImpulse * 0.42;
    if (b.held && b.holdT > 0.2) b.holdT = 0.2;
  }
};

World.prototype.newBall = function () {
  var b = new Ball(0.283, 0.055);
  this.balls.push(b);
  return b;
};

World.prototype.launch = function (b, power) {
  b.v.y = lerp(T.plungeMin, T.plungeMax, clamp(power, 0, 1));
  b.v.x = 0;
  this.emit('launch', { power: power });
};

World.prototype.resetDrops = function () {
  var g = this.dropGroups.main; if (!g) return;
  for (var i = 0; i < g.length; i++) { g[i].on = true; g[i].down = false; }
};

/* -----------------------------------------------------------------------------
   Layout validation. This is the same measurement the test harness runs on the
   built-in tables, living in the game so the custom builder can refuse to save
   a layout that would trap the ball. A straight slot is never a trap: if the
   ball fits in it fits through. The hazard is a gap wide enough to admit the
   ball but too tight to let it roll on, and a part buried in another part's
   face, which makes a V the ball settles into.
   -------------------------------------------------------------------------- */
function segSegDist(a, b) {
  var f = function (px, py, s) {
    closestOnSeg(px, py, s.ax, s.ay, s.bx, s.by, _cp);
    return len2(px - _cp.x, py - _cp.y);
  };
  return Math.min(f(a.ax, a.ay, b), f(a.bx, a.by, b), f(b.ax, b.ay, a), f(b.bx, b.by, a));
}
function ptSegDist(x, y, s) {
  closestOnSeg(x, y, s.ax, s.ay, s.bx, s.by, _cp);
  return len2(x - _cp.x, y - _cp.y);
}
World.prototype.validate = function () {
  var out = [], D = T.ballR * 2, i, j;
  var S = [], k;
  for (i = 0; i < this.segs.length; i++) if (this.segs[i].tag !== 'gate') S.push(this.segs[i]);
  var JAM_LO = D * 0.86, JAM_HI = D * 1.10, NOTCH = 0.0006;
  function band(g) { return g > JAM_LO && g < JAM_HI; }
  // Parts deliberately buried in one another are how a continuous piece is
  // built, so a negative gap is fine. What is not fine is a small POSITIVE
  // gap: too tight for the ball to pass, wide enough to wedge it in the V.
  for (i = 0; i < S.length; i++) for (j = i + 1; j < S.length; j++) {
    if (S[i].poly === S[j].poly) continue;
    var d = segSegDist(S[i], S[j]);
    if (d < 0.0015) continue;                       // joined parts form a corner
    if (band(d - S[i].rad - S[j].rad)) out.push({ kind: 'slot', x: S[i].ax, y: S[i].ay, msg: S[i].tag + '/' + S[j].tag });
  }
  for (i = 0; i < this.circles.length; i++) {
    var c = this.circles[i];
    for (j = 0; j < S.length; j++) {
      var g2 = ptSegDist(c.x, c.y, S[j]) - c.r - S[j].rad;
      if (g2 > NOTCH && g2 < JAM_HI) out.push({ kind: 'wedge', x: c.x, y: c.y, msg: c.tag + '/' + S[j].tag });
    }
    for (j = i + 1; j < this.circles.length; j++) {
      var c2 = this.circles[j], g3 = len2(c.x - c2.x, c.y - c2.y) - c.r - c2.r;
      if (g3 > NOTCH && g3 < JAM_HI) out.push({ kind: 'wedge', x: c.x, y: c.y, msg: c.tag + '/' + c2.tag });
    }
  }
  // nothing may foul the flippers' sweep, and every ramp mouth must be open
  for (i = 0; i < this.flippers.length; i++) {
    var f = this.flippers[i];
    for (k = 0; k <= 16; k++) {
      var ang = f.rest + (f.end - f.rest) * k / 16;
      var fs = { ax: f.px, ay: f.py, bx: f.px + Math.cos(ang) * f.len, by: f.py + Math.sin(ang) * f.len };
      for (j = 0; j < S.length; j++) {
        if (S[j].tag === 'wall' || S[j].tag === 'rubber' || S[j].tag === 'slingL' || S[j].tag === 'slingR') continue;
        if (segSegDist(fs, S[j]) - S[j].rad - f.r0 < 0) out.push({ kind: 'flipper', x: S[j].ax, y: S[j].ay, msg: S[j].tag });
      }
      for (j = 0; j < this.circles.length; j++) {
        var cc = this.circles[j];
        if (ptSegDist(cc.x, cc.y, fs) - cc.r - f.r0 < 0) out.push({ kind: 'flipper', x: cc.x, y: cc.y, msg: cc.tag });
      }
    }
  }
  for (i = 0; i < this.rails.length; i++) {
    var R = this.rails[i], near = 9;
    for (j = 0; j < S.length; j++) near = Math.min(near, ptSegDist(R.entry[0], R.entry[1], S[j]) - S[j].rad);
    for (j = 0; j < this.circles.length; j++) {
      var c3 = this.circles[j];
      near = Math.min(near, len2(R.entry[0] - c3.x, R.entry[1] - c3.y) - c3.r);
    }
    if (near < T.ballR * 0.9) out.push({ kind: 'mouth', x: R.entry[0], y: R.entry[1], msg: R.id });
    // and the run-up to the mouth must be clear too
    var ax = R.entry[0] - R.entryT[0] * 0.06, ay = R.entry[1] - R.entryT[1] * 0.06;
    for (j = 0; j < this.circles.length; j++) {
      var c4 = this.circles[j];
      if (len2(ax - c4.x, ay - c4.y) - c4.r - T.ballR < 0) out.push({ kind: 'mouth', x: ax, y: ay, msg: R.id });
    }
  }
  return out;
};
/* -----------------------------------------------------------------------------
   8. GAME
   States: menu -> intro -> ready (ball in the lane) -> play -> ballend -> over
   Two independent, capped multipliers feed every award: the combo chain and the
   no-drain flow streak. Draining breaks the streak and nothing else: the game
   never speeds up to punish a player who is already losing.
   -------------------------------------------------------------------------- */

var OPT = {
  music: true, sfx: true, haptics: true, marks: false, motion: false,
  quality: 'auto', lang: null
};

function loadOpts() {
  var o = Store.get('sol.opts', null), k;
  if (o) for (k in OPT) if (o[k] !== undefined) OPT[k] = o[k];
  if (!OPT.lang) {
    var n = ((typeof navigator !== 'undefined' && (navigator.language || 'es')) + '').toLowerCase();
    OPT.lang = n.indexOf('es') === 0 ? 'es' : 'en';
  }
  if (!I18N[OPT.lang]) OPT.lang = 'es';       // a stored language that no longer exists
  LANG = OPT.lang;
  if (typeof matchMedia === 'function') {
    try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) OPT.motion = true; } catch (e) {}
  }
}
function saveOpts() { Store.set('sol.opts', OPT); }

function saveKey(diff) { return 'sol.save.' + (diff === 'hard' ? 'h' : 'n'); }
function loadSave(diff) { return Store.get(saveKey(diff), { tables: {}, endless: {} }); }
function putSave(diff, s) { Store.set(saveKey(diff), s); }

function starsFor(tb, score) {
  var n = 0, i;
  for (i = 0; i < T.starMul.length; i++) if (score >= tb.par * T.starMul[i]) n = i + 1;
  return n;
}

var G = {
  state: 'menu', world: null, table: null, tableIdx: 0,
  diff: 'normal', endless: false,
  score: 0, scorePlay: 0, bonusTotal: 0,
  ballNo: 1, ballsLeft: T.balls, ballsMax: T.balls,
  combo: 1, comboT: 0, flowHits: 0, flow: 1,
  bonusUnits: 0, bonusMult: 1,
  saveT: 0, tiltWarn: 0, tilted: false, nudgeCd: 0,
  plunge: 0, plunging: false,
  introT: 0, cdT: 0, ballT: 0, endT: 0, runT: 0,
  saucerHits: 0, multiball: 0, jackpotLit: false,
  award: null, awardT: 0, awardCd: T.awardCooldown,
  msgT: 0, lastMsg: '', flash: 0, shake: 0,
  dropResetT: 0, laneMask: 0, extraBallLit: false,
  quality: 'high'
};

function modeLabel() {
  return (G.endless ? t('endless') : (G.diff === 'hard' ? t('hard') : t('normal')));
}

function showMsg(s, dur) {
  G.lastMsg = s; G.msgT = dur || 2.0;
  var el = $('hudMsg'); el.textContent = s; el.classList.add('on');
}

function addScore(base, why, tag) {
  var m = G.combo * G.flow * (G.diff === 'hard' ? T.hardScore : 1);
  var pts = Math.round(base * m);
  G.score += pts; G.scorePlay += pts;
  G.bonusUnits += Math.max(1, Math.round(base / 120));
  if (why === 'noCombo') return pts;
  G.flowHits++;
  G.flow = clamp(1 + Math.floor(G.flowHits / T.flowPerStep), 1, T.flowMax);
  if (tag && tag === G.lastTag) { G.comboT = T.comboWindow; return pts; }
  G.lastTag = tag || null;
  G.combo = clamp(G.combo + 1, 1, T.comboMax);
  G.comboT = T.comboWindow;
  return pts;
}

/* --- awards: lit at a real shot on this table, never handed over ----------- */
function awardShots() {
  var w = G.world, list = [], i;
  for (i = 0; i < w.rails.length; i++) list.push({ kind: 'rail', id: w.rails[i].id, label: w.rails[i].tag });
  for (i = 0; i < w.zones.length; i++) {
    var z = w.zones[i];
    if (z.kind === 'saucer') list.push({ kind: 'saucer', id: z.id, label: 'saucer' });
    if (z.kind === 'spinner') list.push({ kind: 'spinner', id: z.id, label: 'spinner' });
    if (z.kind === 'orbit') list.push({ kind: 'orbit', id: z.id, label: 'orbit' });
  }
  return list;
}
var AWARD_KINDS = ['kickback', 'save', 'bonusx', 'extra'];
function maybeOfferAward() {
  if (G.award || G.awardCd > 0 || G.ballT < T.awardMinPlay) return;
  if (Math.random() > T.awardChance) { G.awardCd = 6; return; }
  var shots = awardShots(); if (!shots.length) return;
  var shot = shots[(Math.random() * shots.length) | 0];
  var pool = AWARD_KINDS.slice();
  if (G.extraBallLit || G.endless) pool.splice(pool.indexOf('extra'), 1);   // no dead offers
  var kind = pool[(Math.random() * pool.length) | 0];
  G.award = { kind: kind, shot: shot }; G.awardT = T.awardTimeout;
  G.awardCd = T.awardCooldown;
  showMsg(t('awardLit') + ' · ' + shotName(shot), 2.6);
  Snd.danger(0.4); Haptic.tap(18);
}
function shotName(s) {
  var n = { ramp: { es: 'RAMPA', en: 'RAMP' }, orbit: { es: 'ÓRBITA', en: 'ORBIT' },
    saucer: { es: 'AGUJERO', en: 'SAUCER' }, spinner: { es: 'MOLINETE', en: 'SPINNER' } };
  var k = n[s.label] || n.ramp; return k[LANG] || k.es;
}
function collectAward(kindMatch, id) {
  if (!G.award) return false;
  var s = G.award.shot;
  if (s.kind !== kindMatch) return false;
  if (s.id !== id && s.kind !== 'rail') return false;
  if (s.kind === 'rail' && s.id !== id) return false;
  var k = G.award.kind; G.award = null;
  addScore(PTS.awardPick);
  if (k === 'kickback') { lightKickback(); showMsg(t('kickback'), 2.2); }
  else if (k === 'save') { G.saveT = Math.max(G.saveT, 8); showMsg(t('ballSave'), 2.2); }
  else if (k === 'bonusx') { G.bonusMult = Math.min(9, G.bonusMult + 1); showMsg('BONUS x' + G.bonusMult, 2.2); }
  else if (k === 'extra') { G.extraBallLit = true; G.ballsLeft++; showMsg(t('extraBall'), 2.4); }
  Snd.victory(); Haptic.pattern([14, 40, 22]);
  return true;
}
function lightKickback() {
  var w = G.world;
  for (var i = 0; i < w.zones.length; i++) if (w.zones[i].kind === 'kickback') w.zones[i].lit = true;
}

/* --- game lifecycle -------------------------------------------------------- */
function startGame(idx, diff, endless) {
  var ALL = allTables();
  G.tableIdx = idx; G.table = ALL[idx] || ALL[0];
  G.diff = diff; G.endless = !!endless;
  G.score = 0; G.scorePlay = 0; G.bonusTotal = 0;
  G.ballsMax = T.balls; G.ballsLeft = T.balls; G.ballNo = 1;
  G.combo = 1; G.comboT = 0; G.flow = 1; G.flowHits = 0; G.lastTag = null;
  G.bonusUnits = 0; G.bonusMult = 1;
  G.tiltWarn = 0; G.tilted = false; G.nudgeCd = 0; G.bothCount = 0; G.lastBothT = null;
  G.saucerHits = 0; G.multiball = 0; G.jackpotLit = false;
  G.award = null; G.awardCd = T.awardCooldown; G.extraBallLit = false;
  G.runT = 0; G.laneMask = 0; G.dropResetT = 0;
  var inc = (diff === 'hard' ? T.inclineHard : T.incline);
  G.world = new World(G.table, { incline: inc });
  buildTableVisuals(G.table, G.world);
  fitCamera(true);
  G.state = 'intro'; G.introT = T.introTime;
  showIntro(idx, G.table);
  hudSet();
  Snd.start();
  Music.start();
}

function newBallInPlay() {
  var w = G.world;
  w.balls.length = 0;
  w.resetDrops();
  var b = w.newBall();
  G.plunge = 0; G.plunging = false;
  G.combo = 1; G.comboT = 0;
  G.ballT = 0; G.tiltWarn = 0; G.tilted = false; G.bothCount = 0; G.lastBothT = null;
  G.saveT = 0;
  G.state = 'ready';
  hudSet();
  showMsg(t('ball') + ' ' + G.ballNo, 1.6);
  return b;
}

function launchBall() {
  var w = G.world, b = firstLive(w);
  if (!b || !b.inLane) return;
  w.launch(b, G.plunge);
  G.plunge = 0; G.plunging = false;
  G.state = 'play';
  G.saveT = (G.diff === 'hard' ? T.ballSaveHard : T.ballSave);
  if (G.endless) G.saveT = Math.max(2.0, G.saveT - G.runT * T.endlessTiltDrop / 6);
  G.skillT = T.skillWindow;
  Snd.launch(G.plunge); Haptic.tap(12);
}

/* The balls array keeps drained balls until the ball ends, so anything that
   wants "the ball in play" has to ask for a live one — index 0 may be dead. */
function firstLive(w) {
  for (var i = 0; i < w.balls.length; i++) if (!w.balls[i].dead) return w.balls[i];
  return null;
}
function liveBalls() {
  var n = 0, w = G.world;
  for (var i = 0; i < w.balls.length; i++) if (!w.balls[i].dead) n++;
  return n;
}

function onDrain(b) {
  var live = liveBalls();
  if (live > 0) {                      // multiball: losing one ball is not the end
    if (live === 1) { G.jackpotLit = false; G.multiball = 0; showMsg(t('combo') + ' x' + G.combo, 1.2); }
    Snd.drain(0.5);
    return;
  }
  if (G.saveT > 0 && !G.tilted) {
    G.saveT = 0;
    G.world.balls.length = 0;          // clear the drained ball before serving
    var nb = G.world.newBall();
    G.state = 'ready'; G.plunge = 0;
    showMsg(t('ballSaved'), 1.8);
    Snd.save(); Haptic.tap(20);
    return;
  }
  endBall();
}

function endBall() {
  G.flowHits = 0; G.flow = 1; G.combo = 1;
  var bonus = G.tilted ? 0 : Math.round(G.bonusUnits * 120 * G.bonusMult);
  G.bonusTotal += bonus; G.score += bonus;
  G.bonusUnits = 0;
  G.ballsLeft--;
  G.state = 'ballend'; G.endT = bonus > 0 ? 1.9 : 1.1;
  if (bonus > 0) showMsg('BONUS ' + fmt(bonus), 1.8);
  Snd.drain(1);
  Haptic.pattern([30, 60, 30]);
}

function gameOver() {
  G.state = 'over';
  Music.stop();
  var s = loadSave(G.diff), rec, isBest = false;
  if (G.endless) {
    rec = s.endless[G.table.id] || { best: 0 };
    if (G.score > rec.best) { rec.best = G.score; isBest = true; }
    s.endless[G.table.id] = rec;
  } else {
    rec = s.tables[G.table.id] || { best: 0, stars: 0 };
    var st = starsFor(G.table, G.scorePlay);
    if (G.score > rec.best) { rec.best = G.score; isBest = true; }
    if (st > rec.stars) rec.stars = st;      // never downgrade a stored rating
    s.tables[G.table.id] = rec;
  }
  putSave(G.diff, s);
  Store.set('sol.last', { idx: G.tableIdx, diff: G.diff, endless: G.endless });
  showGameOver(isBest, rec);
  Snd.defeat();
}

/* --- event handling -------------------------------------------------------- */
function processEvents() {
  var w = G.world, ev = w.events, i;
  for (i = 0; i < ev.length; i++) {
    var e = ev[i];
    switch (e.type) {
      case 'hit': onHit(e); break;
      case 'lane': onLane(e); break;
      case 'orbit':
        addScore(PTS.orbit, null, 'orbit' + e.id); Snd.match(G.combo); G.flash = 0.12;
        collectAward('orbit', e.id); break;
      case 'spinner':
        addScore(PTS.spinner * Math.max(1, e.spins) / 3, 'noCombo');
        G.combo = clamp(G.combo + 1, 1, T.comboMax); G.comboT = T.comboWindow;
        Snd.spinner(e.spins); Haptic.tap(6);
        collectAward('spinner', e.id); break;
      case 'saucer': onSaucer(e); break;
      case 'railIn': Snd.rampIn(); break;
      case 'railOut': onRailOut(e); break;
      case 'kickback': showMsg(t('ballSaved'), 1.4); Snd.save(); Haptic.tap(24); break;
      case 'eject': Snd.kicker(); break;
      case 'drain': onDrain(e.ball); break;
      case 'clack': Snd.clack(e.spd); break;
      case 'thud': Snd.thud(e.spd); break;
      case 'search': Snd.thud(1.2); break;
      case 'launch': break;
    }
  }
  ev.length = 0;
}

function onHit(e) {
  switch (e.tag) {
    case 'bumper':
      addScore(PTS.bumper, null, 'bump' + e.idx); Snd.bumper(e.spd); Haptic.tap(8);
      G.flash = 0.10; G.shake = OPT.motion ? 0 : 0.05;
      maybeOfferAward();
      break;
    case 'slingL': case 'slingR':
      addScore(PTS.sling, 'noCombo'); Snd.sling(); Haptic.tap(6); G.flash = 0.07;
      break;
    case 'drop':
      if (e.seg && !e.seg.down) {
        e.seg.down = true; e.seg.on = false;
        addScore(PTS.target); Snd.target(); Haptic.tap(10);
        var g = G.world.dropGroups.main, allDown = true, i;
        for (i = 0; i < g.length; i++) if (!g[i].down) allDown = false;
        if (allDown) {
          addScore(PTS.dropAll); showMsg(t('dropBank'), 2.0);
          G.dropResetT = 1.4; G.bonusMult = Math.min(9, G.bonusMult + 1);
          Snd.victory(); Haptic.pattern([12, 30, 18]);
          maybeOfferAward();
        }
      }
      break;
    case 'standup':
      addScore(PTS.standup, null, 'stand' + e.idx); Snd.target(); Haptic.tap(8); maybeOfferAward(); break;
    case 'post': case 'rubber':
      if (e.spd > 1.4) Snd.rubber(e.spd); break;
    case 'flipper':
      if (e.live && e.spd > 0.6) { Snd.flipHit(e.spd); Haptic.tap(4); }
      break;
  }
}

function onLane(e) {
  var z = e.zone;
  if (!z.lit) {
    z.lit = true;
    addScore(PTS.lane, null, 'lane' + z.id); Snd.lane();
    if (G.skillT > 0) { addScore(PTS.skill, 'noCombo'); showMsg(t('skill'), 2.2); Snd.victory(); }
    var zs = G.world.zones, all = true, i;
    for (i = 0; i < zs.length; i++) if (zs[i].kind === 'lane' && !zs[i].lit) all = false;
    if (all) {
      addScore(PTS.laneAll); G.bonusMult = Math.min(9, G.bonusMult + 1);
      showMsg(t('lanesDone') + ' · BONUS x' + G.bonusMult, 2.2);
      for (i = 0; i < zs.length; i++) if (zs[i].kind === 'lane') zs[i].lit = false;
      Snd.victory(); maybeOfferAward();
    }
  } else addScore(PTS.lane / 2, 'noCombo');
}

function onSaucer(e) {
  addScore(PTS.saucer, null, 'saucer' + e.id);
  Snd.saucer();
  Haptic.tap(16);
  collectAward('saucer', e.id);
  G.saucerHits++;
  if (G.multiball === 0 && G.saucerHits % 3 === 0) startMultiball();
  else if (G.multiball > 0) { addScore(PTS.jackpot); showMsg(t('jackpot'), 1.8); }
  else showMsg(t('lock') + ' ' + (G.saucerHits % 3) + '/3', 1.6);
  maybeOfferAward();
}

function startMultiball() {
  var w = G.world, i;
  for (i = 0; i < 2; i++) {
    var b = w.newBall();
    b.p.x = -0.02 + i * 0.05; b.p.y = 0.88; b.inLane = false;
    b.v.x = rnd(-0.4, 0.4); b.v.y = -0.6;
  }
  G.multiball = 3; G.jackpotLit = true;
  showMsg(t('multiball'), 2.6);
  Snd.victory(); Haptic.pattern([20, 50, 20, 50, 30]);
}

function onRailOut(e) {
  if (!e.made) { Snd.rampBack(); return; }
  var base = e.rail.score;
  if (G.jackpotLit) { addScore(PTS.jackpot); showMsg(t('jackpot'), 1.4); }
  else addScore(base + (G.combo > 1 ? PTS.rampCombo * (G.combo - 1) : 0), null, 'rail' + e.rail.id);
  Snd.rampOut(G.combo); Haptic.tap(12); G.flash = 0.14;
  collectAward('rail', e.rail.id);
  maybeOfferAward();
}

/* --- nudge / tilt ---------------------------------------------------------- */
function doNudge() {
  if (G.state !== 'play' || G.tilted || G.nudgeCd > 0) return;
  G.nudgeCd = T.nudgeCooldown;
  G.world.nudge(Math.random() < 0.5 ? -1 : 1);
  G.shake = OPT.motion ? 0 : 0.16;
  Snd.thud(2.2); Haptic.tap(18);
  G.tiltWarn++;
  if (G.tiltWarn > T.tiltWarnings) {
    G.tilted = true;
    for (var i = 0; i < G.world.balls.length; i++) G.world.flippers[i % 2].pressed = false;
    showMsg(t('tilt'), 2.4);
    Snd.defeat(); Haptic.pattern([60, 80, 60]);
    $('tiltWarn').textContent = t('tilt');
    $('tiltWarn').classList.remove('hidden');
    G.tiltT = 1.6;
  } else {
    $('tiltWarn').textContent = t('tiltWarn');
    $('tiltWarn').classList.remove('hidden');
    G.tiltT = 0.8;
  }
}

/* --- per-frame game update -------------------------------------------------- */
function updateGame(dt) {
  var i;
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) $('hudMsg').classList.remove('on'); }
  if (G.tiltT > 0) { G.tiltT -= dt; if (G.tiltT <= 0) $('tiltWarn').classList.add('hidden'); }
  if (G.flash > 0) G.flash -= dt;
  if (G.shake > 0) G.shake -= dt;

  if (G.state === 'intro') {
    G.introT -= dt;
    if (G.introT <= 0) { hideIntro(); newBallInPlay(); }
    return;
  }
  if (G.state === 'countdown') {
    G.cdT -= dt;
    var n = Math.ceil(G.cdT);
    $('cdText').textContent = n > 0 ? n : '';
    if (G.cdT <= 0) { $('countdown').classList.add('hidden'); G.state = G.resumeTo || 'play'; }
    return;
  }
  if (G.state === 'ballend') {
    G.endT -= dt;
    if (G.endT <= 0) {
      if (G.ballsLeft <= 0) gameOver();
      else { G.ballNo++; newBallInPlay(); }
    }
    return;
  }
  if (G.state !== 'play' && G.state !== 'ready') return;

  G.runT += dt; G.ballT += dt;
  if (G.nudgeCd > 0) G.nudgeCd -= dt;
  if (G.skillT > 0) G.skillT -= dt;
  if (G.saveT > 0) G.saveT -= dt;
  if (G.awardCd > 0) G.awardCd -= dt;
  if (G.award) { G.awardT -= dt; if (G.awardT <= 0) { G.award = null; showMsg('—', 0.8); } }
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) { G.combo = 1; G.lastTag = null; } }
  if (G.dropResetT > 0) { G.dropResetT -= dt; if (G.dropResetT <= 0) G.world.resetDrops(); }

  // Endless: pressure climbs with time on the clock, never with failure.
  if (G.endless) {
    var k = clamp(G.runT / T.endlessRamp, 0, 1);
    G.world.incline = lerp(T.incline, T.inclineHard + 0.6, k);
    G.world.g = T.gravity * Math.sin(G.world.incline * DEG);

/* ---- build every mesh for a table ----------------------------------------- */
function disposeTable() {
  if (!GFX.tableGroup) return;
  GFX.group.remove(GFX.tableGroup);
  // Only geometries and materials created for this table are disposed; anything
  // in GFX.shared is reused across tables and must survive.
  GFX.tableGroup.traverse(function (o) {
    if (o.isMesh) {
      if (o.geometry && !o.geometry.__shared) o.geometry.dispose();
      if (o.material && !o.material.__shared && o.material.dispose) o.material.dispose();
    }

}

function buildTableVisuals(tb, world) {
  if (!GFX.ok) return;
  disposeTable();
  var G3 = new THREE.Group(); GFX.tableGroup = G3; GFX.group.add(G3);
  GFX.lamps = []; GFX.dropMesh = []; GFX.bumpMesh = []; GFX.spinMesh = []; GFX.flipMesh = []; GFX.saucerMesh = [];
  var A = tb.art, i, j;

  // playfield
  var pf = new THREE.Mesh(new THREE.PlaneGeometry(LANE_OUT * 2, TOP_Y),
    M({ map: drawPlayfield(tb, world), roughness: 0.42, metalness: 0.06, envMapIntensity: 0.5 }));
  pf.rotation.x = -Math.PI / 2;
  pf.position.set(0, 0, -TOP_Y / 2);
  pf.receiveShadow = true;
  G3.add(pf);

  // walls as metal guide rails, following the exact collision polylines
  var polys = [], cab = cabinet();
  for (i = 0; i < cab.walls.length; i++) polys.push(cab.walls[i]);
  if (tb.walls) for (i = 0; i < tb.walls.length; i++) polys.push(tb.walls[i]);
  for (i = 0; i < polys.length; i++) {
    var w = polys[i];
    if (w.tag === 'gate') continue;
    var pts = [];
    for (j = 0; j < w.pts.length; j++) pts.push(V3(w.pts[j][0], w.pts[j][1], 0.017));
    if (pts.length < 2) continue;
    var isRub = (w.tag === 'rubber' || w.tag === 'slingL' || w.tag === 'slingR');
    var curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.02);
    var tube = new THREE.TubeGeometry(curve, Math.max(8, pts.length * 6), isRub ? 0.0062 : 0.005, 7, false);
    var m = new THREE.Mesh(tube, isRub ? matRubberW() : matSteel());
    m.castShadow = true; G3.add(m);
    // a low wooden kerb under the long outer walls reads as the table edge
  }
  // one-way gate: a small hinged flap, visible and honest
  var ga = 46 * DEG, gr = (PW + outerR(46)) / 2;
  var gate = new THREE.Mesh(new THREE.BoxGeometry(outerR(46) - PW, 0.0016, 0.020), matSteel());
  gate.position.copy(V3(Math.cos(ga) * gr, ARC_C + Math.sin(ga) * gr, 0.012));
  gate.rotation.y = -ga; gate.rotation.x = 0.5; G3.add(gate);

  // posts: clear plastic sleeves on a steel core
  for (i = 0; tb.posts && i < tb.posts.length; i++) {
    var p = tb.posts[i];
    var pg = new THREE.CylinderGeometry(p[2], p[2] * 0.95, 0.030, 14);
    var pm = new THREE.Mesh(pg, new THREE.MeshPhysicalMaterial({
      color: 0xffffff, metalness: 0, roughness: 0.12, transmission: 0.85, thickness: 0.01, transparent: true, opacity: 0.85
    }));
    pm.position.copy(V3(p[0], p[1], 0.015)); pm.castShadow = true; G3.add(pm);
    var cap = new THREE.Mesh(new THREE.CylinderGeometry(p[2] * 1.1, p[2] * 1.1, 0.004, 14), matSteel());
    cap.position.copy(V3(p[0], p[1], 0.032)); G3.add(cap);
  }

  // pop bumpers: base skirt, body, cap
  for (i = 0; tb.bumpers && i < tb.bumpers.length; i++) {
    var b = tb.bumpers[i], grp = new THREE.Group();
    var base = new THREE.Mesh(new THREE.CylinderGeometry(b[2] * 1.05, b[2] * 1.15, 0.008, 22), matDark());
    base.position.y = 0.004; grp.add(base);
    var skirt = new THREE.Mesh(new THREE.CylinderGeometry(b[2] * 0.92, b[2] * 0.7, 0.014, 22),
      M({ color: 0xf5f2e6, roughness: 0.5, metalness: 0.0 }));
    skirt.position.y = 0.013; grp.add(skirt);
    var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.034, 8), matChrome());
    rod.position.y = 0.030; grp.add(rod);
    var cap2 = new THREE.Mesh(new THREE.CylinderGeometry(b[2] * 0.78, b[2] * 0.62, 0.012, 22),
      new THREE.MeshPhysicalMaterial({ color: new THREE.Color(A.lampA), emissive: new THREE.Color(A.lampA), emissiveIntensity: 0.25, roughness: 0.25, metalness: 0.0, transmission: 0.4, transparent: true, opacity: 0.92 }));
    cap2.position.y = 0.046; grp.add(cap2);
    grp.position.copy(V3(b[0], b[1], 0));
    grp.userData = { cap: cap2, skirt: skirt, base: 0 };
    G3.add(grp); GFX.bumpMesh.push(grp);
  }

  // targets
  for (i = 0; i < world.segs.length; i++) {
    var s = world.segs[i];
    if (s.tag !== 'drop' && s.tag !== 'standup') continue;
    var isDrop = s.tag === 'drop';
    var tgeo = new THREE.BoxGeometry(0.030, 0.026, 0.005);
    var tm = new THREE.Mesh(tgeo, new THREE.MeshStandardMaterial({
      color: isDrop ? new THREE.Color(A.accent2) : new THREE.Color(A.accent),
      emissive: isDrop ? new THREE.Color(A.accent2) : new THREE.Color(A.accent),
      emissiveIntensity: 0.18, roughness: 0.35, metalness: 0.1
    }));
    tm.position.copy(V3(s.tx, s.ty, 0.013));
    tm.rotation.y = -(s.deg * DEG) + Math.PI / 2;
    tm.castShadow = true;
    G3.add(tm);
    if (isDrop) GFX.dropMesh.push({ mesh: tm, seg: s, y0: tm.position.y });
  }

  // saucers: a real hole with a metal rim
  for (i = 0; i < world.zones.length; i++) {
    var z = world.zones[i];
    if (z.kind !== 'saucer') continue;
    var rim = new THREE.Mesh(new THREE.TorusGeometry(z.r * 1.25, 0.0035, 8, 24), matSteel());
    rim.position.copy(V3(z.x, z.y, 0.003)); rim.rotation.x = -Math.PI / 2; G3.add(rim);
    var hole = new THREE.Mesh(new THREE.CylinderGeometry(z.r * 1.2, z.r * 0.9, 0.03, 20, 1, true),
      M({ color: 0x030508, roughness: 0.9, side: THREE.DoubleSide }));
    hole.position.copy(V3(z.x, z.y, -0.015)); G3.add(hole);
    GFX.saucerMesh.push({ zone: z, rim: rim });
  }
  // spinners
  for (i = 0; i < world.zones.length; i++) {
    var z2 = world.zones[i];
    if (z2.kind !== 'spinner') continue;
    var sp = new THREE.Mesh(new THREE.BoxGeometry(0.030, 0.024, 0.0014), matChrome());
    sp.position.copy(V3(z2.x, z2.y, 0.014));
    sp.rotation.y = -(z2.deg * DEG);
    G3.add(sp); GFX.spinMesh.push({ zone: z2, mesh: sp, ang: 0 });

    var R = world.rails[i], pts3 = [];
    for (j = 0; j < R.samples.length; j += 2) {
      var sm = R.samples[j];
      pts3.push(V3(sm[0], sm[1], sm[2] + 0.012));
    }
    var cv = new THREE.CatmullRomCurve3(pts3, false, 'catmullrom', 0.05);
    var mkWire = function (off) {
      var pp = [], k, o = [0, 0, 0];
      for (k = 0; k < R.samples.length; k += 2) {
        var tn = R.tangentAt(R.cum[k] || 0);
        var nx = -tn[1], ny = tn[0], l = len2(nx, ny) || 1;

    var wr = new THREE.Mesh(new THREE.TubeGeometry(mkWire(0.019), 120, 0.0022, 6, false), matWire());
    var wc = new THREE.Mesh(new THREE.TubeGeometry(cv, 120, 0.0026, 6, false),
      M({ color: 0x8f9aa2, metalness: 0.9, roughness: 0.3 }));

  // so a table-plane angle `a` is exactly a world rotation of +a about Y: a
  // direction (cos a, sin a) becomes (cos a, 0, -sin a). Negating it mirrors
  // the bat, which swings it the wrong way and leaves the mesh sitting where
  // the collision capsule is not.
  for (i = 0; i < world.flippers.length; i++) {
    var f = world.flippers[i];
    var fg = new THREE.Group();
    var yb = 0.011;                      // bat sits just above the wood
    // tapered bat, local +x from the pivot to the tip
    var bat = new THREE.Mesh(new THREE.CylinderGeometry(f.r1, f.r0, f.len, 20), matDark());
    bat.rotation.z = -Math.PI / 2; bat.position.set(f.len / 2, yb, 0);
    bat.castShadow = true; fg.add(bat);
    // red rubber face, slightly proud of the bat
    var batR = new THREE.Mesh(new THREE.CylinderGeometry(f.r1 * 1.04, f.r0 * 1.04, f.len * 0.86, 20), matRubberR());
    batR.rotation.z = -Math.PI / 2; batR.position.set(f.len * 0.44, yb + 0.005, 0);
    fg.add(batR);

    hubB.position.set(0, yb, 0); fg.add(hubB);
    var tipB = new THREE.Mesh(new THREE.SphereGeometry(f.r1, 14, 10), matDark());
    tipB.position.set(f.len, yb, 0); fg.add(tipB);
    // chrome pivot pin
    var pin = new THREE.Mesh(new THREE.CylinderGeometry(f.r0 * 0.42, f.r0 * 0.42, 0.030, 14), matChrome());
    pin.position.set(0, yb + 0.010, 0); fg.add(pin);
    fg.position.copy(V3(f.px, f.py, 0));

function ensureBalls(n) {
  while (GFX.ballMeshes.length < n) {
    var g = geo('ball', function () { return new THREE.SphereGeometry(T.ballR, 28, 20); });
    g.__shared = true;
    var m = matChrome(); m.__shared = true;
    var mesh = new THREE.Mesh(g, m);
    mesh.castShadow = true; mesh.visible = false;
    GFX.group.add(mesh);

/* ---- backglass + DMD ------------------------------------------------------ */

function drawDMD(score, line1, line2) {

/* ---- analytic camera fit --------------------------------------------------- */
function fitCamera(force) {
  if (!GFX.ok) return;
  var el = $('glcanvas');
  var w = el.clientWidth || window.innerWidth, h = el.clientHeight || window.innerHeight;
  var aspect = w / Math.max(1, h);
  GFX.cam.aspect = aspect;
  // steeper in portrait so the long table still fills the frame
  var k = clamp((aspect - 0.5) / 1.4, 0, 1);
  GFX.pitch = lerp(T.camPitchPort, T.camPitchLand, k);
  var pitch = GFX.pitch * DEG;
  GFX.group.rotation.x = (G.world ? G.world.incline : T.incline) * DEG;
  GFX.group.updateMatrixWorld(true);

  var target = new THREE.Vector3(0, 0.06, -TOP_Y * 0.50);
  target.applyMatrix4(GFX.group.matrixWorld);
  var fwd = new THREE.Vector3(0, -Math.sin(pitch), -Math.cos(pitch)).normalize();
  var right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
  var up = new THREE.Vector3().crossVectors(right, fwd).normalize();

  // the real playfield only: never pad the fit with points that are not there
  var pts = [], i;
  var xs = [-LANE_OUT, LANE_OUT], ys = [0, TOP_Y], zs = [0, 0.10];
  for (i = 0; i < 8; i++) {
    var p = V3(xs[i & 1], ys[(i >> 1) & 1], zs[(i >> 2) & 1]);
    p.applyMatrix4(GFX.group.matrixWorld);
    pts.push(p);
  }
  if (GFX.backbox) {
    var bb = new THREE.Vector3(0, 0.34, -(TOP_Y + 0.06));
    bb.applyMatrix4(GFX.group.matrixWorld); pts.push(bb);
  }
  var tanV = Math.tan(GFX.cam.fov * DEG / 2), tanH = tanV * aspect;
  var dist = 0.2, tmp = new THREE.Vector3();
  for (i = 0; i < pts.length; i++) {
    tmp.copy(pts[i]).sub(target);
    var a = Math.abs(tmp.dot(right)), bq = Math.abs(tmp.dot(up)), cq = tmp.dot(fwd);
    dist = Math.max(dist, bq / tanV - cq, a / tanH - cq);
  }
  dist *= T.camMargin;
  GFX.camDist = dist;
  GFX.camTarget = target; GFX.camFwd = fwd;
  GFX.cam.position.copy(target).addScaledVector(fwd, -dist);
  GFX.cam.lookAt(target);
  GFX.cam.updateProjectionMatrix();
  if (force) GFX.renderer.setSize(w, h, false);
}

function applyQuality() {
  if (!GFX.ok) return;
  var q = OPT.quality;
  if (q === 'auto') {
    var small = Math.min(window.innerWidth, window.innerHeight) < 560;
    q = (small || (navigator.hardwareConcurrency || 4) <= 4) ? 'low' : 'high';
  }
  GFX.quality = q;
  // Low never means a soft image: the pixel ratio stays near the device's own
  // and antialiasing stays on. Shadows are what get dropped.
  var dpr = Math.min(window.devicePixelRatio || 1, q === 'low' ? 1.5 : 2);
  GFX.renderer.setPixelRatio(dpr);
  GFX.renderer.shadowMap.enabled = (q === 'high');
  if (q === 'high') {
    GFX.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    if (GFX.key) { GFX.key.castShadow = true; GFX.key.shadow.mapSize.width = 1024; GFX.key.shadow.mapSize.height = 1024; GFX.key.shadow.bias = -0.0012; }
  } else if (GFX.key) GFX.key.castShadow = false;
}

function resize() {
  if (!GFX.ok) return;
  var w = window.innerWidth, h = window.innerHeight;
  GFX.renderer.setSize(w, h, false);
  fitCamera(false);
}

/* ---- per-frame sync -------------------------------------------------------- */
var _q = null;
