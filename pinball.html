  if (!GFX.ok || !G.world) return;
  var w = G.world, i;
  if (!_q) _q = new THREE.Quaternion();
  ensureBalls(w.balls.length);
  for (i = 0; i < GFX.ballMeshes.length; i++) {
    var m = GFX.ballMeshes[i], b = w.balls[i];
    if (!b || b.dead) { m.visible = false; continue; }
    m.visible = true;
    m.position.copy(V3(b.p.x, b.p.y, b.z + b.r));
    _q.set(b.rot.x, b.rot.z, -b.rot.y, b.rot.w);
    m.quaternion.copy(_q);
  }
  for (i = 0; i < GFX.flipMesh.length; i++) {
    var fm = GFX.flipMesh[i];
    fm.grp.rotation.y = fm.f.ang;
  }
  for (i = 0; i < GFX.dropMesh.length; i++) {
    var d = GFX.dropMesh[i], want = d.seg.down ? d.y0 - 0.026 : d.y0;
    d.mesh.position.y += (want - d.mesh.position.y) * Math.min(1, dt * 14);
  }
  for (i = 0; i < GFX.bumpMesh.length; i++) {
    var bm = GFX.bumpMesh[i], c = w.circles, hit = 0, j;
    for (j = 0; j < c.length; j++) if (c[j].tag === 'bumper' && c[j].idx === i) hit = w.time - c[j].hitT;
    var k = clamp(1 - hit / 0.12, 0, 1);
    bm.userData.cap.position.y = 0.046 - k * 0.010;
    bm.userData.cap.material.emissiveIntensity = 0.25 + k * 1.6;
  }
  for (i = 0; i < GFX.spinMesh.length; i++) {
    var sm = GFX.spinMesh[i];
    if (sm.zone.spin > 0) { sm.ang += dt * sm.zone.spin * 2.4; sm.zone.spin *= Math.max(0, 1 - dt * 1.2); if (sm.zone.spin < 0.05) sm.zone.spin = 0; }
    sm.mesh.rotation.z = sm.ang;
  }
  // camera: a small settle and, when the machine is shoved, a real shake
  if (GFX.camTarget) {
    var sh = (G.shake > 0 && !OPT.motion) ? G.shake : 0;
    GFX.cam.position.copy(GFX.camTarget).addScaledVector(GFX.camFwd, -GFX.camDist);
    if (sh > 0) {
      GFX.cam.position.x += rnd(-sh, sh) * 0.08;
      GFX.cam.position.y += rnd(-sh, sh) * 0.06;
    }
    GFX.cam.lookAt(GFX.camTarget);
  }
  if (GFX.key) GFX.key.intensity = 26 + (G.flash > 0 ? 22 * G.flash : 0);
}

function renderFrame() {
  if (!GFX.ok) return;
  try { GFX.renderer.render(GFX.scene, GFX.cam); } catch (e) { GFX.ok = false; }
}
/* -----------------------------------------------------------------------------
   13. TABLE BUILDER
   The cabinet, flippers, slingshots and lanes are fixed — they are the body of
   the machine. What the player lays out is the interior. Ramps are offered as
   whole prefabricated wireforms rather than a curve editor, because a ramp has
   to start and end on the wood at a shootable angle and hand-drawn ones do not.
   Nothing can be saved until the same validator the built-in tables are held to
   reports a clean layout.
   -------------------------------------------------------------------------- */

var RAMP_KITS = {
  none: [],
  left: [{ id: 'rampL', tag: 'ramp', minEntry: 1.85, score: PTS.ramp, points: [
    [-0.060, 0.415, 0.000], [-0.056, 0.500, 0.030], [-0.060, 0.610, 0.060],
    [-0.092, 0.716, 0.078], [-0.152, 0.742, 0.078], [-0.196, 0.672, 0.066],
    [-0.209, 0.540, 0.042], [-0.205, 0.400, 0.018], [-0.198, 0.300, 0.004], [-0.196, 0.250, 0.000]] }],
  right: [{ id: 'rampR', tag: 'ramp', minEntry: 1.95, score: PTS.ramp + 300, points: [
    [0.082, 0.400, 0.000], [0.104, 0.492, 0.032], [0.128, 0.606, 0.064],
    [0.140, 0.726, 0.084], [0.176, 0.640, 0.062], [0.190, 0.500, 0.034],
    [0.186, 0.370, 0.012], [0.182, 0.270, 0.000]] }]
};
RAMP_KITS.both = RAMP_KITS.left.concat(RAMP_KITS.right);

var PALETTE = [
  { k: 'bumper', r: 0.030, col: '#ffab1f', es: 'Seta', en: 'Bumper' },
  { k: 'post', r: 0.010, col: '#dfe6ec', es: 'Poste', en: 'Post' },
  { k: 'drop', r: 0.016, col: '#4fd6d2', es: 'Diana abatible', en: 'Drop target' },
  { k: 'standup', r: 0.016, col: '#7ac74f', es: 'Diana fija', en: 'Standup' },
  { k: 'lane', r: 0.021, col: '#a98bff', es: 'Carril', en: 'Rollover' },
  { k: 'spinner', r: 0.024, col: '#e8d9a8', es: 'Molinete', en: 'Spinner' },
  { k: 'saucer', r: 0.022, col: '#ff5d73', es: 'Agujero', en: 'Saucer' },
  { k: 'erase', r: 0, col: '#e0442f', es: 'Borrar', en: 'Erase' }
];

var BUILD = {
  tool: 'bumper', mirror: true, ramps: 'both', items: [], editing: null,
  cv: null, ctx: null, sc: 1, ox: 0, oy: 0, problems: []
};

function customList() { return Store.get('sol.custom', []); }
function saveCustomList(a) { Store.set('sol.custom', a); }

/* Turn the editor's item list into a table definition the engine can build. */
function buildLayout(items, ramps, name, idx) {
  var d = {
    id: 'custom' + idx,
    name: { es: name, en: name },
    sub: { es: 'Mesa personalizada', en: 'Custom table' },
    custom: true,
    par: 600000,
    art: {
      wood: '#232a31', ink: '#0a0e12', accent: '#4fd6d2', accent2: '#ffab1f',
      lampA: '#4fd6d2', lampB: '#ffab1f', metal: '#9aa6ad',
      legend: { es: (name || 'MESA').toUpperCase(), en: (name || 'TABLE').toUpperCase() }
    },
    bumpers: [], posts: [], drops: [], standups: [], lanes: [], spinners: [], saucers: [],
    walls: [], orbits: [[-0.240, 0.780, 0.026, 'orbitL'], [0.240, 0.740, 0.026, 'orbitR']],
    rails: RAMP_KITS[ramps] || []
  };
  var i, nLane = 0;
  for (i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.k === 'bumper') d.bumpers.push([it.x, it.y, 0.030]);
    else if (it.k === 'post') d.posts.push([it.x, it.y, 0.010]);
    else if (it.k === 'drop') d.drops.push([it.x, it.y, -90]);
    else if (it.k === 'standup') d.standups.push([it.x, it.y, it.x < 0 ? 20 : 160]);
    else if (it.k === 'lane') d.lanes.push([it.x, it.y, 0.021, nLane++]);
    else if (it.k === 'spinner') d.spinners.push([it.x, it.y, 0]);
    else if (it.k === 'saucer') d.saucers.push([it.x, it.y, 0.022, it.x < 0 ? 70 : 110]);
  }
  // Par scales with how much there is to shoot at, so a sparse table is not
  // automatically a three-star table.
  d.par = 400000 + items.length * 90000 + d.rails.length * 250000;
  return d;
}

/* --- canvas ---------------------------------------------------------------- */
function buildFitCanvas() {
  var cv = BUILD.cv;
  var maxW = Math.min(210, Math.floor((window.innerWidth - 90) * 0.45));
  var w = Math.max(140, maxW), h = Math.round(w * (TOP_Y / (LANE_OUT * 2)));
  var maxH = Math.max(220, window.innerHeight - 430);
  if (h > maxH) { h = maxH; w = Math.round(h * (LANE_OUT * 2) / TOP_Y); }
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  BUILD.sc = cv.width / (LANE_OUT * 2);
  BUILD.ox = LANE_OUT; BUILD.dpr = dpr;
  BUILD.cssW = w; BUILD.cssH = h;
}
function bx(x) { return (x + BUILD.ox) * BUILD.sc; }
function by(y) { return (1 - y / TOP_Y) * BUILD.cv.height; }
function bs(v) { return v * BUILD.sc; }
function unbx(px) { return px / BUILD.sc - BUILD.ox; }
function unby(py) { return (1 - py / BUILD.cv.height) * TOP_Y; }

function drawBuilder() {
  var cv = BUILD.cv, g = BUILD.ctx, i, j;
  if (!cv || !g) return;
  g.fillStyle = '#0c0f13'; g.fillRect(0, 0, cv.width, cv.height);
  // fixed furniture, drawn from the very same data the physics uses
  var w = new World(buildLayout(BUILD.items, BUILD.ramps, 'x', 0), {});
  g.lineCap = 'round';
  for (i = 0; i < w.segs.length; i++) {
    var s = w.segs[i];
    var fixed = (s.tag === 'wall' || s.tag === 'gate' || s.tag === 'plunger' ||
      s.tag === 'rubber' || s.tag === 'slingL' || s.tag === 'slingR');
    if (!fixed) continue;
    g.strokeStyle = (s.tag === 'slingL' || s.tag === 'slingR' || s.tag === 'rubber') ? '#8c5a52' : '#39424b';
    g.lineWidth = Math.max(1, bs(s.rad * 2));
    g.beginPath(); g.moveTo(bx(s.ax), by(s.ay)); g.lineTo(bx(s.bx), by(s.by)); g.stroke();
  }
  // flippers at rest
  for (i = 0; i < w.flippers.length; i++) {
    var f = w.flippers[i];
    g.strokeStyle = '#c0342a'; g.lineWidth = Math.max(2, bs(f.r0 * 2));
    g.beginPath(); g.moveTo(bx(f.px), by(f.py));
    g.lineTo(bx(f.px + Math.cos(f.rest) * f.len), by(f.py + Math.sin(f.rest) * f.len));
    g.stroke();
  }
  // ramps
  for (i = 0; i < w.rails.length; i++) {
    g.strokeStyle = 'rgba(255,171,31,0.5)'; g.lineWidth = Math.max(2, bs(0.014));
    g.beginPath();
    for (j = 0; j < w.rails[i].samples.length; j += 3) {
      var sm = w.rails[i].samples[j];
      if (j === 0) g.moveTo(bx(sm[0]), by(sm[1])); else g.lineTo(bx(sm[0]), by(sm[1]));
    }
    g.stroke();
  }
  // placed items
  for (i = 0; i < BUILD.items.length; i++) {
    var it = BUILD.items[i], pal = palFor(it.k);
    g.beginPath(); g.arc(bx(it.x), by(it.y), Math.max(3, bs(pal.r)), 0, 6.2832);
    g.fillStyle = pal.col; g.globalAlpha = 0.55; g.fill();
    g.globalAlpha = 1; g.lineWidth = 1.2; g.strokeStyle = pal.col; g.stroke();
  }
  // problems, marked where they are
  for (i = 0; i < BUILD.problems.length; i++) {
    var p = BUILD.problems[i];
    g.beginPath(); g.arc(bx(p.x), by(p.y), Math.max(5, bs(0.020)), 0, 6.2832);
    g.strokeStyle = '#e0442f'; g.lineWidth = 2; g.stroke();
  }
}
function palFor(k) {
  for (var i = 0; i < PALETTE.length; i++) if (PALETTE[i].k === k) return PALETTE[i];
  return PALETTE[0];
}

/* --- placement -------------------------------------------------------------- */
function builderTap(e) {
  var cv = BUILD.cv, r = cv.getBoundingClientRect();
  var px = (e.clientX - r.left) * (cv.width / r.width);
  var py = (e.clientY - r.top) * (cv.height / r.height);
  var x = Math.round(unbx(px) * 500) / 500;      // snap to 2 mm
  var y = Math.round(unby(py) * 500) / 500;
  var i;
  if (BUILD.tool === 'erase') {
    var best = -1, bd = 1e9;
    for (i = 0; i < BUILD.items.length; i++) {
      var d = len2(BUILD.items[i].x - x, BUILD.items[i].y - y);
      if (d < bd) { bd = d; best = i; }
    }
    if (best >= 0 && bd < 0.045) {
      var gone = BUILD.items.splice(best, 1)[0];
      if (gone.m != null) for (i = BUILD.items.length - 1; i >= 0; i--)
        if (BUILD.items[i].m === gone.m && BUILD.items[i] !== gone) BUILD.items.splice(i, 1);
      Snd.click();
    }
  } else {
    if (BUILD.items.length >= 40) { buildStatus(t('buildFull'), 'bad'); return; }
    var mid = BUILD.mirror ? Date.now() + Math.random() : null;
    BUILD.items.push({ k: BUILD.tool, x: x, y: y, m: mid });
    if (BUILD.mirror && Math.abs(x) > 0.012) BUILD.items.push({ k: BUILD.tool, x: -x, y: y, m: mid });
    Snd.click();
  }
  checkBuild(false);
  drawBuilder();
}

function checkBuild(verbose) {
  var d = buildLayout(BUILD.items, BUILD.ramps, 'x', 0);
  var w;
  try { w = new World(d, {}); } catch (err) { BUILD.problems = []; buildStatus(String(err.message || err), 'bad'); return false; }
  var probs = w.validate();
  // anything outside the playable interior is also a problem
  var i;
  for (i = 0; i < BUILD.items.length; i++) {
    var it = BUILD.items[i], pal = palFor(it.k);
    if (it.y < 0.40 || it.y > TOP_Y - 0.03 || Math.abs(it.x) > PW - 0.02)
      probs.push({ kind: 'outside', x: it.x, y: it.y, msg: it.k });
  }
  BUILD.problems = probs;
  if (!probs.length) {
    buildStatus(BUILD.items.length ? t('buildOk') + ' · ' + BUILD.items.length + ' ' + t('parts') : t('buildEmpty'), BUILD.items.length ? 'good' : '');
    return BUILD.items.length > 0;
  }
  var kinds = {};
  for (i = 0; i < probs.length; i++) kinds[probs[i].kind] = (kinds[probs[i].kind] || 0) + 1;
  var parts = [];
  for (var k in kinds) parts.push(t('prob_' + k) + ' x' + kinds[k]);
  buildStatus(t('buildBad') + ': ' + parts.join(' · '), 'bad');
  return false;
}
function buildStatus(msg, cls) {
  var el = $('buildStatus');
  el.textContent = msg;
  el.className = 'note' + (cls ? ' ' + cls : '');
}

/* --- palette + saved list ---------------------------------------------------- */
function renderPalette() {
  var box = $('buildPalette'); box.innerHTML = '';
  PALETTE.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'palBtn' + (BUILD.tool === p.k ? ' on' : '');
    b.innerHTML = '<u style="background:' + p.col + '"></u>' + (p[LANG] || p.es);
    b.addEventListener('click', function () { BUILD.tool = p.k; Snd.click(); renderPalette(); });
    box.appendChild(b);
  });
  var m = document.createElement('button');
  m.className = 'palBtn' + (BUILD.mirror ? ' on' : '');
  m.innerHTML = '<u style="background:#6c7a86"></u>' + t('mirror');
  m.addEventListener('click', function () { BUILD.mirror = !BUILD.mirror; Snd.click(); renderPalette(); });
  box.appendChild(m);
  var order = ['both', 'left', 'right', 'none'];
  var r = document.createElement('button');
  r.className = 'palBtn on';
  r.innerHTML = '<u style="background:#ffab1f"></u>' + t('ramps') + ': ' + t('ramp_' + BUILD.ramps);
  r.addEventListener('click', function () {
    BUILD.ramps = order[(order.indexOf(BUILD.ramps) + 1) % order.length];
    Snd.click(); renderPalette(); checkBuild(false); drawBuilder();
  });
  box.appendChild(r);
}

function renderCustomList() {
  var box = $('buildList'), list = customList();
  box.innerHTML = '';
  $('customCount').textContent = list.length ? list.length + '/6' : '';
  list.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = '<span class="lbl">' + c.name + '</span><span class="val">' + t('edit') + '</span>';
    b.addEventListener('click', function () {
      BUILD.items = (c.items || []).map(function (o) { return { k: o.k, x: o.x, y: o.y, m: o.m }; });
      BUILD.ramps = c.ramps || 'both';
      BUILD.editing = i;
      Snd.click(); renderPalette(); checkBuild(false); drawBuilder(); renderCustomList();
    });
    box.appendChild(b);
  });
}

function openBuilder() {
  BUILD.cv = $('buildCanvas');
  BUILD.ctx = BUILD.cv.getContext('2d');
  if (!BUILD.bound) {
    BUILD.bound = true;
    BUILD.cv.addEventListener('pointerdown', function (e) { e.preventDefault(); builderTap(e); });
    $('btnBuildSave').addEventListener('click', saveBuild);
    $('btnBuildPlay').addEventListener('click', playBuild);
    $('btnBuildClear').addEventListener('click', function () {
      BUILD.items = []; BUILD.editing = null; Snd.click();
      checkBuild(false); drawBuilder(); renderCustomList();
    });
  }
  buildFitCanvas();
  renderPalette();
  renderCustomList();
  checkBuild(false);
  drawBuilder();
}

function saveBuild() {
  if (!checkBuild(true)) { Snd.defeat(); return; }
  var list = customList();
  var idx = BUILD.editing != null ? BUILD.editing : list.length;
  if (idx >= 6) { buildStatus(t('buildMax'), 'bad'); return; }
  var name = (LANG === 'es' ? 'Mesa ' : 'Table ') + (idx + 1);
  list[idx] = { name: name, items: BUILD.items, ramps: BUILD.ramps };
  saveCustomList(list);
  BUILD.editing = idx;
  loadCustomTables();
  buildStatus(t('buildSaved') + ' · ' + name, 'good');
  Snd.victory();
  renderCustomList();
  refreshTitle();
}

function playBuild() {
  if (!checkBuild(true)) { Snd.defeat(); return; }
  var name = (LANG === 'es' ? 'Prueba' : 'Test');
  CUSTOM_TEST = buildLayout(BUILD.items, BUILD.ramps, name, 'T');
  loadCustomTables();
  var all = allTables();
  show('menu', false);
  startGame(all.length - 1, G.diff, false);
}

var CUSTOM = [], CUSTOM_TEST = null;
function loadCustomTables() {
  var list = customList(), i;
  CUSTOM = [];
  for (i = 0; i < list.length; i++) CUSTOM.push(buildLayout(list[i].items, list[i].ramps, list[i].name, i));
  if (CUSTOM_TEST) CUSTOM.push(CUSTOM_TEST);
}
function allTables() { return TABLES.concat(CUSTOM); }
/* -----------------------------------------------------------------------------
   11. DOM, INPUT, UI, LOOP
   -------------------------------------------------------------------------- */
function $(id) {
  var el = document.getElementById(id);
  if (!el) throw new Error('missing element #' + id);
  return el;
}
function show(id, on) { $(id).classList[on ? 'remove' : 'add']('hidden'); }

/* ---- input hardening: this is an application, not a document -------------- */
function hardenInput() {
  var stop = function (e) { e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick', 'selectstart', 'dragstart']
    .forEach(function (n) { document.addEventListener(n, stop, { passive: false }); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
    else e.preventDefault();
  }, { passive: false });
  window.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  }, { passive: false });
}

/* ---- the two buttons ------------------------------------------------------ */
var IN = { L: false, R: false, bothFired: false, touchL: 0, touchR: 0 };

function setFlipper(side, down) {
  if (!G.world) return;
  var f = G.world.flippers[side === -1 ? 0 : 1];
  if (!f || f.pressed === down) return;
  if (G.tilted && down) return;                 // tilted: the bats go dead
  if (G.state !== 'play' && G.state !== 'ready') { f.pressed = false; return; }
  f.pressed = down;
  audioInit(); Snd.flip(down);
}

function pressBoth() {
  if (G.state === 'ready') { G.plunging = true; return; }
  if (G.state !== 'play') return;
  // A nudge takes three deliberate presses of both buttons in quick succession,
  // so brushing both at once while playing can never shove the machine by
  // accident. The count lapses if you pause between presses.
  var now = G.runT || 0;
  if (now - (G.lastBothT == null ? -9 : G.lastBothT) > T.nudgeChain) G.bothCount = 1;
  else G.bothCount = (G.bothCount || 0) + 1;
  G.lastBothT = now;
  if (G.bothCount >= T.nudgePresses) { G.bothCount = 0; doNudge(); }
  else showMsg(t('nudgeArm') + ' ' + G.bothCount + '/' + T.nudgePresses, 1.0);
}
function releaseBoth() {
  if (G.state === 'ready' && G.plunging) launchBall();
}
function inputChanged(prevBoth) {
  var both = IN.L && IN.R;
  if (both && !prevBoth) pressBoth();
  if (!both && prevBoth) releaseBoth();
}
function setSide(side, down) {
  var prevBoth = IN.L && IN.R;
  if (side === -1) IN.L = down; else IN.R = down;
  setFlipper(side, down);
  inputChanged(prevBoth);
}

function bindInput() {
  var KL = { ArrowLeft: 1, a: 1, A: 1, z: 1, Z: 1, q: 1, Q: 1 };
  var KR = { ArrowRight: 1, l: 1, L: 1, m: 1, M: 1, p: 0 };
  document.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    audioInit();
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { togglePause(); return; }
    if (KL[e.key]) setSide(-1, true);
    else if (e.key === 'ArrowRight' || e.key === 'l' || e.key === 'L' || e.key === 'm' || e.key === 'M') setSide(1, true);
    else if (e.key === ' ') { var pb = IN.L && IN.R; IN.L = IN.R = true; inputChanged(pb); }
  });
  document.addEventListener('keyup', function (e) {
    if (KL[e.key]) setSide(-1, false);
    else if (e.key === 'ArrowRight' || e.key === 'l' || e.key === 'L' || e.key === 'm' || e.key === 'M') setSide(1, false);
    else if (e.key === ' ') { var pb = IN.L && IN.R; IN.L = IN.R = false; inputChanged(pb); }
  });

  function zone(el, side) {
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault(); audioInit();
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
      setSide(side, true);
    });
    var up = function (e) { e.preventDefault(); setSide(side, false); };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') setSide(side, false); });
  }
  zone($('zoneL'), -1);
  zone($('zoneR'), 1);
  $('btnPause').addEventListener('click', function (e) { e.stopPropagation(); togglePause(); });
}

/* ---- pause / resume -------------------------------------------------------- */
function togglePause() {
  if (G.state === 'play' || G.state === 'ready' || G.state === 'intro') {
    G.pausedFrom = G.state; G.state = 'paused';
    IN.L = IN.R = false;
    if (G.world) { G.world.flippers[0].pressed = false; G.world.flippers[1].pressed = false; }
    show('pauseOverlay', true);
    Music.stop();
  } else if (G.state === 'paused') resumeGame();
}
function resumeGame() {
  show('pauseOverlay', false);
  show('menu', false);
  G.resumeTo = G.pausedFrom === 'intro' ? 'ready' : (G.pausedFrom || 'play');
  G.state = 'countdown'; G.cdT = T.countdown;
  $('cdText').textContent = T.countdown;
  show('countdown', true);
  if (OPT.music) Music.start();
}

/* ---- screens --------------------------------------------------------------- */
function showScreen(which) {
  ['screenTitle', 'screenTables', 'screenOptions', 'screenHowto', 'screenBuilder'].forEach(function (s) {
    show(s, s === which);
  });
  show('menu', true);
}
function toMenu() {
  G.state = 'menu';
  Music.stop();
  show('hud', false); show('gameOver', false); show('pauseOverlay', false);
  show('zones', false);
  $('zones').classList.remove('on');
  showScreen('screenTitle');
  refreshTitle();
}

function showIntro(idx, tb) {
  var nAll = allTables().length;
  $('introNum').textContent = (LANG === 'es' ? 'MESA ' : 'TABLE ') + (idx + 1) + ' / ' + nAll;
  $('introName').textContent = tableName(tb);
  show('introCard', true);
  show('menu', false);
  show('hud', true);
  $('zones').classList.add('on');
  show('zones', true);
}
function hideIntro() { show('introCard', false); }

function showGameOver(isBest, rec) {
  $('goTitle').textContent = t('gameover');
  $('goScore').textContent = fmt(G.score);
  $('goBest').textContent = (isBest ? t('newBest') + ' · ' : t('best') + ' ') + fmt(rec.best);
  var st = G.endless ? -1 : starsFor(G.table, G.scorePlay), s = '', i;
  if (st >= 0) { for (i = 0; i < 3; i++) s += (i < st ? '★' : '<span class="off">★</span>'); }
  $('goStars').innerHTML = s;
  var rows = [
    [t('mode'), modeLabel()],
    [LANG === 'es' ? 'Juego' : 'Play', fmt(G.scorePlay)],
    ['Bonus', fmt(G.bonusTotal)]
  ];
  if (!G.endless) rows.push([t('parScore'), fmt(G.table.par)]);
  $('goBreak').innerHTML = rows.map(function (r) { return r[0] + '<b>' + r[1] + '</b>'; }).join('<br>');
  show('gameOver', true);
  show('hud', false);
}

function refreshTitle() {
  applyI18n();
  var last = Store.get('sol.last', null);
  var ALL = allTables();
  $('lastPlayed').textContent = last ? (ALL[last.idx] ? tableName(ALL[last.idx]).toUpperCase() : '') : '';
  var sN = loadSave('normal'), sH = loadSave('hard'), best = 0, k;
  for (k in sN.endless) best = Math.max(best, sN.endless[k].best);
  for (k in sH.endless) best = Math.max(best, sH.endless[k].best);
  $('endlessBest').textContent = best ? fmt(best) : '';
  var tot = 0;
  for (k in sN.tables) tot += sN.tables[k].stars || 0;
  for (k in sH.tables) tot += sH.tables[k].stars || 0;
  $('titleNote').textContent = t('stars') + ': ' + tot + ' / ' + (TABLES.length * 6);
  try { $('customCount').textContent = customList().length ? customList().length + '/6' : ''; } catch (e) {}
}

function buildTableList() {
  var list = $('tableList'), s = loadSave(G.diff), i, ALL = allTables();
  list.innerHTML = '';
  for (i = 0; i < ALL.length; i++) {
    (function (idx) {
      var tb = ALL[idx], rec = s.tables[tb.id] || { best: 0, stars: 0 };
      var b = document.createElement('button');
      b.className = 'tableCard';
      var stars = '';
      for (var k = 0; k < 3; k++) stars += (k < rec.stars ? '★' : '<span class="off">★</span>');
      b.innerHTML =
        '<div class="swatch" style="background:' + tb.art.accent + '"></div>' +
        '<div><div class="num">' + (idx < 9 ? '0' : '') + (idx + 1) + (tb.custom ? ' · ' + t('custom').toUpperCase() : '') + '</div><div class="nm">' + tableName(tb) + '</div>' +
        '<div class="sub">' + tableSub(tb) + ' · ' + t('best') + ' ' + fmt(rec.best) + '</div></div>' +
        '<div class="stars">' + stars + '</div>';
      b.addEventListener('click', function () {
        Snd.click(); audioInit();
        show('menu', false);
        startGame(idx, G.diff, G.pendingEndless);
      });
      list.appendChild(b);
    })(i);
  }
}

/* ---- options --------------------------------------------------------------- */
var OPT_ROWS = [
  { k: 'music', type: 'bool' },
  { k: 'sfx', type: 'bool' },
  { k: 'haptics', type: 'bool' },
  { k: 'marks', type: 'bool' },
  { k: 'motion', type: 'bool' },
  { k: 'quality', type: 'cycle', vals: ['auto', 'high', 'low'] },
  { k: 'lang', type: 'cycle', vals: ['es', 'en'] }
];
function optLabel(r) {
  var v = OPT[r.k];
  if (r.type === 'bool') return v ? t('on') : t('off');
  if (r.k === 'lang') return v === 'es' ? 'ESPAÑOL' : 'ENGLISH';
  return t(v) || String(v).toUpperCase();
}
function buildOptions() {
  var box = $('optList'); box.innerHTML = '';
  OPT_ROWS.forEach(function (r) {
    var b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = '<span class="lbl">' + t(r.k) + '</span><span class="val">' + optLabel(r) + '</span>';
    b.addEventListener('click', function () {
      if (r.type === 'bool') OPT[r.k] = !OPT[r.k];
      else { var i = r.vals.indexOf(OPT[r.k]); OPT[r.k] = r.vals[(i + 1) % r.vals.length]; }
      if (r.k === 'lang') { LANG = OPT.lang; applyI18n(); }
      if (r.k === 'quality') applyQuality();
      if (r.k === 'marks' && G.world && G.table) buildTableVisuals(G.table, G.world);
      saveOpts(); busGains();
      if (r.k === 'music') { if (OPT.music && G.state !== 'menu') Music.start(); else Music.stop(); }
      Snd.click();
      buildOptions();
      refreshTitle();
    });
    box.appendChild(b);
  });
}

function applyI18n() {
  var els = document.querySelectorAll('[data-i18n]'), i;
  for (i = 0; i < els.length; i++) {
    var k = els[i].getAttribute('data-i18n');
    els[i].textContent = t(k);
  }
  $('howtoBody').textContent = t('howtoBody');
  $('brandSub').textContent = t('tagline');
  $('diffN').classList[G.diff === 'normal' ? 'add' : 'remove']('on');
  $('diffH').classList[G.diff === 'hard' ? 'add' : 'remove']('on');
  $('hudHint').textContent = t('hintPlay');
}

/* ---- HUD ------------------------------------------------------------------- */
function hudSet() {
  $('hudTable').textContent = G.table ? tableName(G.table) : '';
  $('hudMode').textContent = modeLabel().toUpperCase();
  var b = $('hudBalls'), i; b.innerHTML = '';
  var n = Math.min(6, Math.max(G.ballsLeft, 0));
  for (i = 0; i < n; i++) b.innerHTML += '<i></i>';
}
var _lastScore = -1, _lastMult = '';
function hudLive() {
  if (G.score !== _lastScore) {
    _lastScore = G.score;
    $('hudScore').textContent = fmt(G.score);
    var l1 = (G.endless ? t('endless') : t('ball') + ' ' + G.ballNo);
    var l2 = (G.combo * G.flow > 1) ? 'x' + (G.combo * G.flow) : '';
    drawDMD(G.score, l1, l2);
  }
  var m = G.combo * G.flow;
  var txt = m > 1 ? 'x' + m + (G.award ? '  ·  ' + shotName(G.award.shot) : '') : (G.award ? shotName(G.award.shot) : '');
  if (txt !== _lastMult) { _lastMult = txt; $('hudMult').textContent = txt; }
  var barOn = G.comboT > 0 && G.combo > 1;
  show('hudMultBar', barOn);
  if (barOn) $('hudMultFill').style.transform = 'scaleX(' + clamp(G.comboT / T.comboWindow, 0, 1) + ')';
  if (G.state === 'ready') {
    $('hudMsg').textContent = t('shoot');
    $('hudMsg').classList.add('on');
    if (G.plunge > 0) $('hudMsg').textContent = t('shoot') + '  ' + Math.round(G.plunge * 100) + '%';
  }
}

/* ---- main loop -------------------------------------------------------------- */
var lastT = 0, rafId = 0;
function frame(now) {
  rafId = requestAnimationFrame(frame);
  var dt = lastT ? (now - lastT) / 1000 : 0.016;
  lastT = now;
  dt = clamp(dt, 0, 0.05);
  if (G.state !== 'paused' && G.state !== 'menu' && G.state !== 'over') updateGame(dt);
  syncVisuals(dt);
  renderFrame();
}

function bindUI() {
  $('btnPlay').addEventListener('click', function () { audioInit(); Snd.click(); G.pendingEndless = false; buildTableList(); showScreen('screenTables'); });
  $('btnEndless').addEventListener('click', function () { audioInit(); Snd.click(); G.pendingEndless = true; buildTableList(); showScreen('screenTables'); });
  $('btnOptions').addEventListener('click', function () { Snd.click(); buildOptions(); showScreen('screenOptions'); });
  $('btnBuilder').addEventListener('click', function () { audioInit(); Snd.click(); showScreen('screenBuilder'); openBuilder(); });
  $('btnBuilderBack').addEventListener('click', function () { Snd.click(); showScreen('screenTitle'); refreshTitle(); });
  $('btnHowto').addEventListener('click', function () { Snd.click(); applyI18n(); showScreen('screenHowto'); });
  $('btnTablesBack').addEventListener('click', function () { Snd.click(); showScreen('screenTitle'); });
  $('btnOptionsBack').addEventListener('click', function () { Snd.click(); showScreen(G.state === 'paused' ? 'screenTitle' : 'screenTitle'); if (G.state === 'paused') { show('menu', false); show('pauseOverlay', true); } });
  $('btnHowtoBack').addEventListener('click', function () { Snd.click(); showScreen('screenTitle'); });
  $('diffN').addEventListener('click', function () { G.diff = 'normal'; Snd.click(); applyI18n(); buildTableList(); });
  $('diffH').addEventListener('click', function () { G.diff = 'hard'; Snd.click(); applyI18n(); buildTableList(); });
  $('btnResume').addEventListener('click', function () { Snd.click(); resumeGame(); });
  $('btnRestart').addEventListener('click', function () { Snd.click(); show('pauseOverlay', false); startGame(G.tableIdx, G.diff, G.endless); });
  $('btnPauseOptions').addEventListener('click', function () { Snd.click(); buildOptions(); show('pauseOverlay', false); showScreen('screenOptions'); });
  $('btnQuit').addEventListener('click', function () { Snd.click(); toMenu(); });
  $('btnAgain').addEventListener('click', function () { Snd.click(); show('gameOver', false); startGame(G.tableIdx, G.diff, G.endless); });
  $('btnMenu').addEventListener('click', function () { Snd.click(); toMenu(); });

  window.addEventListener('resize', function () { resize(); if (BUILD.cv && !$('screenBuilder').classList.contains('hidden')) { buildFitCanvas(); drawBuilder(); } });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && (G.state === 'play' || G.state === 'ready')) togglePause();
  });
}

function boot() {
  loadOpts();
  loadCustomTables();
  hardenInput();
  var okGfx = initGFX();
  if (!okGfx) {
    $('loadErr').textContent = LANG === 'es'
      ? 'No se pudo iniciar el motor 3D. Prueba con otro navegador o activa la aceleración por hardware.'
      : 'The 3D engine could not start. Try another browser or enable hardware acceleration.';
    show('loadErr', true);
    return;
  }
  bindInput();
  bindUI();
  applyI18n();
  toMenu();
  lastT = 0;
  rafId = requestAnimationFrame(frame);
}

if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

/* -----------------------------------------------------------------------------
   12. TEST HOOKS
   The harness drives the real simulation with the renderer disabled, so the
   physics under test is exactly the physics that ships.
   -------------------------------------------------------------------------- */
if (typeof window !== 'undefined') {
  window.__TEST__ = {
    T: T, TABLES: TABLES, World: World, Rail: Rail, Ball: Ball,
    cabinet: cabinet, flipperDefs: flipperDefs,
    G: G, startGame: startGame, updateGame: updateGame, launchBall: launchBall,
    starsFor: starsFor, Store: Store,
    buildLayout: buildLayout, RAMP_KITS: RAMP_KITS, allTables: allTables,
    makeWorld: function (i, inc) { return new World(TABLES[i], { incline: inc || T.incline }); },
    consts: { PW: PW, LANE_IN: LANE_IN, LANE_OUT: LANE_OUT, ARC_C: ARC_C, TOP_Y: TOP_Y }
  };
}
</script>
</body>
</html>
