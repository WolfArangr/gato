<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Novel IDE — Escritura profesional de novelas con IA</title>
<meta name="description" content="IDE local para escribir novelas con IA: biblia, capítulos, continuidad, prompts y flujo de trabajo guiado. Funciona 100% en el navegador, sin servidor." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
/* ============================================================
   NOVEL IDE — Design Tokens
   Tema oscuro inspirado en VS Code / Obsidian / JetBrains.
   Paleta: fondo carbón cálido + acento "oro de manuscrito".
   ============================================================ */


:root {
  /* ---- Superficies ---- */
  --bg-void: #0b0d11;        /* fondo raíz */
  --bg-panel: #12151b;       /* sidebars, listas */
  --bg-elevated: #181c24;    /* editor, tarjetas, modales */
  --bg-elevated-2: #1e222b;  /* hover sobre elevado */
  --bg-hover: #1c212a;
  --bg-active: #222836;

  /* ---- Bordes ---- */
  --border: #242a34;
  --border-soft: #1a1f28;
  --border-strong: #333b49;

  /* ---- Texto ---- */
  --text-primary: #e9e6df;   /* blanco cálido, tipo papel */
  --text-secondary: #9ea4b0;
  --text-muted: #5c6270;
  --text-on-accent: #14110a;

  /* ---- Acento primario: oro de manuscrito ---- */
  --accent: #c9a35f;
  --accent-dim: #8a7248;
  --accent-soft: rgba(201, 163, 95, 0.12);
  --accent-border: rgba(201, 163, 95, 0.35);

  /* ---- Acento secundario: azul frío (info / enlaces) ---- */
  --info: #5b8dd6;
  --info-soft: rgba(91, 141, 214, 0.12);

  /* ---- Semánticos ---- */
  --success: #6fae7a;
  --success-soft: rgba(111, 174, 122, 0.12);
  --warning: #d6a24a;
  --warning-soft: rgba(214, 162, 74, 0.12);
  --danger: #d16565;
  --danger-soft: rgba(209, 101, 101, 0.12);

  /* ---- Tipografía ---- */
  --font-display: 'Source Serif 4', Georgia, serif;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* ---- Escala tipográfica ---- */
  --text-xs: 11px;
  --text-sm: 12.5px;
  --text-base: 13.5px;
  --text-md: 15px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;

  /* ---- Espaciado ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  /* ---- Radios ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;

  /* ---- Sombras ---- */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.55);

  /* ---- Layout ---- */
  --activity-bar-w: 52px;
  --sidebar-w: 280px;
  --right-panel-w: 340px;
  --statusbar-h: 26px;
  --topbar-h: 44px;
  --tabbar-h: 38px;

  /* ---- Transiciones ---- */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --t-fast: 120ms var(--ease);
  --t-med: 200ms var(--ease);
}


/* ============================================================
   RESET & BASE
   ============================================================ */

* , *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden; /* la app gestiona su propio scroll interno */
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  margin: 0;
  color: var(--text-primary);
}

p { margin: 0; }

a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font-family: var(--font-ui);
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, textarea, select {
  font-family: var(--font-ui);
  color: var(--text-primary);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: var(--text-base);
  outline: none;
  transition: border-color var(--t-fast);
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent-dim);
}

/* Scrollbars — finas, discretas, coherentes con el tema */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 6px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: #414b5c; background-clip: padding-box; }

/* Foco de teclado visible — accesibilidad */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* Utilidades */
.mono { font-family: var(--font-mono); }
.hidden { display: none !important; }
.text-muted { color: var(--text-muted); }
.text-secondary { color: var(--text-secondary); }

.scroll-y { overflow-y: auto; overflow-x: hidden; }

/* Toast notifications */
#toast-root {
  position: fixed;
  bottom: calc(var(--statusbar-h) + var(--sp-4));
  right: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  z-index: 1000;
}
.toast {
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
  padding: var(--sp-3) var(--sp-4);
  font-size: var(--text-sm);
  box-shadow: var(--shadow-md);
  animation: toast-in var(--t-med);
  max-width: 320px;
}
.toast.success { border-left-color: var(--success); }
.toast.warning { border-left-color: var(--warning); }
.toast.danger { border-left-color: var(--danger); }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}


/* ============================================================
   LAYOUT — Estructura tipo IDE
   ============================================================ */

#app {
  display: grid;
  grid-template-columns: var(--activity-bar-w) var(--sidebar-w) 1fr var(--right-panel-w);
  grid-template-rows: var(--topbar-h) 1fr var(--statusbar-h);
  grid-template-areas:
    "activity topbar   topbar topbar"
    "activity sidebar  main   right"
    "activity status   status status";
  height: 100vh;
  width: 100vw;
  transition: grid-template-columns var(--t-med);
}

#app.sidebar-collapsed { grid-template-columns: var(--activity-bar-w) 0px 1fr var(--right-panel-w); }
#app.right-collapsed { grid-template-columns: var(--activity-bar-w) var(--sidebar-w) 1fr 0px; }

/* ---- Activity Bar (rail de iconos) ---- */
#activity-bar {
  grid-area: activity;
  background: var(--bg-void);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: var(--sp-2);
  gap: 2px;
}
.activity-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  transition: color var(--t-fast), background var(--t-fast);
  position: relative;
}
.activity-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
.activity-btn.active { color: var(--accent); }
.activity-btn.active::before {
  content: '';
  position: absolute; left: -8px; top: 6px; bottom: 6px;
  width: 2px; background: var(--accent); border-radius: 2px;
}
.activity-spacer { flex: 1; }

/* ---- Top Bar ---- */
#topbar {
  grid-area: topbar;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  padding: 0 var(--sp-4);
  gap: var(--sp-3);
}
#topbar .brand {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--text-md);
  color: var(--text-primary);
  letter-spacing: 0.2px;
}
#topbar .brand .brand-accent { color: var(--accent); }
#global-search-trigger {
  flex: 1;
  max-width: 420px;
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 6px 10px;
  color: var(--text-muted);
  font-size: var(--text-sm);
  transition: border-color var(--t-fast);
}
#global-search-trigger:hover { border-color: var(--border-strong); }
#global-search-trigger kbd {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--bg-elevated-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--text-muted);
}
.topbar-actions { display: flex; align-items: center; gap: var(--sp-2); margin-left: auto; }

/* ---- Sidebar (explorador) ---- */
#sidebar {
  grid-area: sidebar;
  background: var(--bg-panel);
  border-right: 1px solid var(--border-soft);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#app.sidebar-collapsed #sidebar { display: none; }

.sidebar-header {
  padding: var(--sp-3) var(--sp-4) var(--sp-2);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ---- Main content ---- */
#main {
  grid-area: main;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-void);
}

#tabbar {
  height: var(--tabbar-h);
  display: flex;
  align-items: stretch;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-soft);
  overflow-x: auto;
  flex-shrink: 0;
}
.tab {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 0 var(--sp-3);
  font-size: var(--text-sm);
  color: var(--text-secondary);
  border-right: 1px solid var(--border-soft);
  cursor: pointer;
  white-space: nowrap;
  position: relative;
  transition: background var(--t-fast), color var(--t-fast);
}
.tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.tab.active { background: var(--bg-void); color: var(--text-primary); }
.tab.active::after {
  content: '';
  position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: var(--accent);
}
.tab .tab-close { opacity: 0; padding: 2px; border-radius: 3px; }
.tab:hover .tab-close { opacity: 0.6; }
.tab .tab-close:hover { opacity: 1; background: var(--bg-active); }
.tab .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); display: none; }
.tab.unsaved .tab-dot { display: block; }

#view-root {
  flex: 1;
  overflow: auto;
  position: relative;
}

/* ---- Right panel (Workflow Assistant + contexto) ---- */
#right-panel {
  grid-area: right;
  background: var(--bg-panel);
  border-left: 1px solid var(--border-soft);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#app.right-collapsed #right-panel { display: none; }

/* ---- Status bar ---- */
#statusbar {
  grid-area: status;
  background: var(--bg-void);
  border-top: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  padding: 0 var(--sp-3);
  font-size: var(--text-xs);
  color: var(--text-muted);
  gap: var(--sp-4);
  font-family: var(--font-mono);
}
#statusbar .status-item { display: flex; align-items: center; gap: 5px; }
#statusbar .status-spacer { flex: 1; }
#statusbar .status-item.accent { color: var(--accent); }

/* ---- Responsive ---- */
@media (max-width: 1100px) {
  #app { grid-template-columns: var(--activity-bar-w) var(--sidebar-w) 1fr 0px; }
  #right-panel { display: none; }
}
@media (max-width: 760px) {
  #app { grid-template-columns: var(--activity-bar-w) 0px 1fr 0px; }
  #sidebar { display: none; }
}


/* ============================================================
   COMPONENTES REUTILIZABLES
   ============================================================ */

/* ---- Botones ---- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  font-size: var(--text-sm);
  font-weight: 500;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-primary);
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.btn:hover { background: var(--bg-elevated-2); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); font-weight: 600; }
.btn-primary:hover { background: #d6b06e; border-color: #d6b06e; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--bg-hover); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-sm { padding: 4px 9px; font-size: var(--text-xs); }
.btn-icon { width: 28px; height: 28px; padding: 0; justify-content: center; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---- Iconos (SVG inline via helper, 18x18 por defecto) ---- */
.icon { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* ---- Cards ---- */
.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
}
.card-title {
  font-family: var(--font-display);
  font-size: var(--text-md);
  font-weight: 600;
  margin-bottom: var(--sp-3);
  display: flex; align-items: center; justify-content: space-between;
}

/* ---- Badges / estados ---- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--text-xs);
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.badge-pending     { background: var(--bg-elevated-2); color: var(--text-muted); }
.badge-preparation { background: var(--info-soft); color: var(--info); }
.badge-draft       { background: var(--warning-soft); color: var(--warning); }
.badge-review      { background: rgba(180, 130, 220, 0.15); color: #b482dc; }
.badge-rewrite     { background: var(--danger-soft); color: var(--danger); }
.badge-final       { background: var(--success-soft); color: var(--success); }
.badge-published   { background: var(--accent-soft); color: var(--accent); }

/* ---- Árbol del explorador ---- */
.tree { padding: var(--sp-1) var(--sp-2) var(--sp-4); overflow-y: auto; flex: 1; }
.tree-node { user-select: none; }
.tree-row {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--t-fast), color var(--t-fast);
}
.tree-row:hover { background: var(--bg-hover); color: var(--text-primary); }
.tree-row.active { background: var(--accent-soft); color: var(--accent); }
.tree-row .chevron { width: 12px; height: 12px; transition: transform var(--t-fast); flex-shrink: 0; color: var(--text-muted); }
.tree-row.collapsed .chevron { transform: rotate(-90deg); }
.tree-row .tree-icon { width: 14px; height: 14px; flex-shrink: 0; }
.tree-row .tree-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tree-row .tree-count { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.tree-children { margin-left: 16px; border-left: 1px solid var(--border-soft); padding-left: 4px; }
.tree-children.collapsed { display: none; }
.tree-status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

/* ---- Modal ---- */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(6,7,9,0.6);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  animation: fade-in var(--t-fast);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 560px;
  max-width: 92vw;
  max-height: 84vh;
  display: flex; flex-direction: column;
  animation: modal-in var(--t-med);
}
.modal.modal-lg { width: 820px; }
@keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal-header {
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: var(--text-lg); }
.modal-body { padding: var(--sp-5); overflow-y: auto; flex: 1; }
.modal-footer { padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: var(--sp-2); }

/* ---- Form fields ---- */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: var(--sp-3); }
.field label { font-size: var(--text-xs); color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.field textarea { resize: vertical; min-height: 80px; font-family: var(--font-ui); }
.field-row { display: flex; gap: var(--sp-3); }
.field-row .field { flex: 1; }

/* ---- Empty states ---- */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: var(--sp-7) var(--sp-4);
  color: var(--text-muted);
  text-align: center;
  gap: var(--sp-2);
}
.empty-state .icon { width: 32px; height: 32px; opacity: 0.5; margin-bottom: var(--sp-2); }
.empty-state h4 { color: var(--text-secondary); font-size: var(--text-md); }
.empty-state p { font-size: var(--text-sm); max-width: 320px; }

/* ---- Progress bar ---- */
.progress-bar { height: 6px; border-radius: 3px; background: var(--bg-elevated-2); overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); border-radius: 3px; transition: width var(--t-med); }

/* ---- Grid de estadísticas (dashboard) ---- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--sp-3); }
.stat-tile {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--sp-3) var(--sp-4);
}
.stat-tile .stat-value { font-family: var(--font-mono); font-size: var(--text-2xl); font-weight: 600; color: var(--text-primary); line-height: 1.2; }
.stat-tile .stat-label { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
.stat-tile .stat-value.accent { color: var(--accent); }

/* ---- Chips / etiquetas ---- */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 2px 8px; border-radius: 20px;
  background: var(--bg-elevated-2); color: var(--text-secondary); border: 1px solid var(--border);
}

/* ---- Tooltip simple ---- */
[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--bg-elevated-2); border: 1px solid var(--border-strong);
  padding: 3px 8px; border-radius: var(--radius-sm);
  font-size: 11px; white-space: nowrap; color: var(--text-primary);
  z-index: 50; pointer-events: none;
  box-shadow: var(--shadow-sm);
}

/* ---- Kanban ---- */
.kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); height: 100%; padding: var(--sp-4); }
.kanban-col { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
.kanban-col-header { padding: var(--sp-3); font-size: var(--text-sm); font-weight: 600; border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; }
.kanban-col-body { flex: 1; overflow-y: auto; padding: var(--sp-2); display: flex; flex-direction: column; gap: var(--sp-2); }
.kanban-card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--sp-3); font-size: var(--text-sm); cursor: grab;
  transition: border-color var(--t-fast), transform var(--t-fast);
}
.kanban-card:hover { border-color: var(--border-strong); }
.kanban-card.dragging { opacity: 0.4; }
.kanban-col.drag-over { background: var(--accent-soft); }

/* ---- Panel de sección genérico ---- */
.section-header {
  padding: var(--sp-4) var(--sp-5) var(--sp-2);
  display: flex; align-items: center; justify-content: space-between;
}
.section-header h2 { font-size: var(--text-xl); }
.section-header .subtitle { color: var(--text-muted); font-size: var(--text-sm); margin-top: 2px; }
.view-scroll { padding: var(--sp-2) var(--sp-5) var(--sp-6); overflow-y: auto; height: 100%; }

/* ---- Lista de entidades (personajes/lugares/objetos) ---- */
.entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--sp-3); }
.entity-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-3); cursor: pointer; transition: border-color var(--t-fast), transform var(--t-fast); }
.entity-card:hover { border-color: var(--accent-border); transform: translateY(-1px); }
.entity-card h4 { font-size: var(--text-md); margin-bottom: 4px; }
.entity-card p { font-size: var(--text-xs); color: var(--text-muted); }
.entity-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-elevated-2); display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 600; color: var(--accent);
  margin-bottom: var(--sp-2); border: 1px solid var(--border);
}


/* ============================================================
   EDITOR MARKDOWN
   ============================================================ */

.editor-view { display: flex; flex-direction: column; height: 100%; }

.editor-toolbar {
  height: 38px; flex-shrink: 0;
  display: flex; align-items: center; gap: 2px;
  padding: 0 var(--sp-3);
  border-bottom: 1px solid var(--border-soft);
  background: var(--bg-panel);
}
.editor-toolbar .divider { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
.editor-toolbar .spacer { flex: 1; }
.editor-toolbar .save-indicator { font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-mono); display: flex; align-items: center; gap: 5px; }
.editor-toolbar .save-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.editor-toolbar .save-indicator.saving .dot { background: var(--warning); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

.editor-body { flex: 1; display: flex; overflow: hidden; }
.editor-pane, .preview-pane { flex: 1; height: 100%; overflow-y: auto; min-width: 0; }
.editor-pane { border-right: 1px solid var(--border-soft); }
.editor-body.preview-only .editor-pane { display: none; }
.editor-body.edit-only .preview-pane { display: none; }

#markdown-textarea {
  width: 100%; height: 100%;
  border: none; border-radius: 0;
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.7;
  padding: var(--sp-5);
  resize: none;
}
#markdown-textarea:focus { border: none; }

.preview-pane { background: var(--bg-void); padding: var(--sp-5) var(--sp-6); }
.preview-content { max-width: 720px; margin: 0 auto; font-family: var(--font-display); font-size: 16.5px; line-height: 1.75; color: var(--text-primary); }
.preview-content h1, .preview-content h2, .preview-content h3 { margin-top: 1.4em; margin-bottom: 0.5em; }
.preview-content h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
.preview-content h2 { font-size: 1.35em; color: var(--accent); }
.preview-content h3 { font-size: 1.1em; }
.preview-content p { margin: 0.9em 0; }
.preview-content strong { color: var(--text-primary); font-weight: 700; }
.preview-content em { color: var(--text-secondary); }
.preview-content blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 0.2em 1em; color: var(--text-secondary); font-style: italic; }
.preview-content code { font-family: var(--font-mono); background: var(--bg-elevated); padding: 2px 5px; border-radius: 3px; font-size: 0.85em; }
.preview-content pre { background: var(--bg-elevated); padding: var(--sp-3); border-radius: var(--radius-md); overflow-x: auto; border: 1px solid var(--border); }
.preview-content pre code { background: none; padding: 0; }
.preview-content ul, .preview-content ol { padding-left: 1.4em; margin: 0.8em 0; }
.preview-content li { margin: 0.3em 0; }
.preview-content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
.preview-content a { color: var(--info); }

.editor-statusline {
  height: 26px; flex-shrink: 0;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-4);
  border-top: 1px solid var(--border-soft);
  background: var(--bg-panel);
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--text-muted);
}

/* Meta / frontmatter panel (estado, etiquetas) sobre el editor */
.editor-meta-bar { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); border-bottom: 1px solid var(--border-soft); background: var(--bg-panel); flex-wrap: wrap; }
.editor-title-input { background: transparent; border: none; font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; padding: 2px 4px; flex: 1; min-width: 160px; }
.editor-title-input:focus { border: none; background: var(--bg-hover); border-radius: var(--radius-sm); }

/* Comparador tipo diff */
.diff-view { display: flex; height: 100%; }
.diff-pane { flex: 1; overflow-y: auto; padding: var(--sp-4); font-family: var(--font-mono); font-size: 13px; line-height: 1.7; }
.diff-pane + .diff-pane { border-left: 1px solid var(--border-soft); }
.diff-line { padding: 1px var(--sp-2); white-space: pre-wrap; word-break: break-word; border-radius: 3px; }
.diff-line.added { background: var(--success-soft); color: #a7d3ae; }
.diff-line.removed { background: var(--danger-soft); color: #e3a3a3; text-decoration: line-through; opacity: 0.75; }
.diff-line.unchanged { color: var(--text-muted); }


/* ============================================================
   WORKFLOW ASSISTANT — elemento firma de la aplicación
   Tarjeta tipo "nota fijada del editor jefe": borde dorado,
   numeración de paso en mono, sensación de instrucción manuscrita.
   ============================================================ */

#right-panel-header {
  padding: var(--sp-4) var(--sp-4) var(--sp-2);
  display: flex; align-items: center; justify-content: space-between;
}
#right-panel-header h3 {
  font-family: var(--font-display);
  font-size: var(--text-md);
  display: flex; align-items: center; gap: 8px;
}
#right-panel-header h3 .icon { color: var(--accent); width: 16px; height: 16px; }

#right-panel-body { flex: 1; overflow-y: auto; padding: 0 var(--sp-4) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }

.wf-card {
  position: relative;
  background: linear-gradient(180deg, var(--bg-elevated), var(--bg-elevated-2));
  border: 1px solid var(--accent-border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  box-shadow: 0 6px 24px rgba(201, 163, 95, 0.06);
}
.wf-step-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: var(--sp-3);
}
.wf-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  margin-bottom: 4px;
  line-height: 1.3;
}
.wf-meta {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--text-xs); color: var(--text-muted);
  margin-bottom: var(--sp-3);
}
.wf-docs {
  display: flex; flex-direction: column; gap: 5px;
  margin-bottom: var(--sp-4);
}
.wf-doc-item {
  display: flex; align-items: center; gap: 7px;
  font-size: var(--text-sm); color: var(--text-secondary);
  padding: 4px 6px; border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--t-fast);
}
.wf-doc-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.wf-doc-item .icon { width: 13px; height: 13px; color: var(--success); flex-shrink: 0; }
.wf-doc-item.missing .icon { color: var(--warning); }

.wf-actions { display: flex; gap: var(--sp-2); }
.wf-actions .btn { flex: 1; justify-content: center; }

.wf-copied-flash {
  position: absolute; inset: 0;
  background: var(--accent-soft);
  border-radius: var(--radius-lg);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: var(--text-sm); color: var(--accent);
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-fast);
}
.wf-copied-flash.show { opacity: 1; }

/* Historial de pasos completados (mini timeline vertical) */
.wf-history { display: flex; flex-direction: column; gap: 2px; }
.wf-history-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 4px;
  font-size: var(--text-xs);
  color: var(--text-muted);
  position: relative;
}
.wf-history-item::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--success); margin-top: 4px; flex-shrink: 0;
}
.wf-history-title { color: var(--text-secondary); }

/* Notas rápidas (panel siempre visible, parte inferior del rail derecho) */
.quicknotes { border-top: 1px solid var(--border-soft); padding: var(--sp-3) var(--sp-4); flex-shrink: 0; }
.quicknotes textarea {
  width: 100%; min-height: 90px; background: var(--bg-elevated);
  font-size: var(--text-sm); font-family: var(--font-ui);
}
.quicknotes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.quicknotes-header span { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; }


/* ============================================================
   DASHBOARD
   ============================================================ */

.dashboard-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: var(--sp-4);
  align-items: start;
}
.dashboard-col { display: flex; flex-direction: column; gap: var(--sp-4); }

.progress-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--sp-2); }
.progress-header .big-pct { font-family: var(--font-mono); font-size: var(--text-2xl); color: var(--accent); font-weight: 600; }

.mini-list { display: flex; flex-direction: column; }
.mini-list-item {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) 4px;
  border-bottom: 1px solid var(--border-soft);
  font-size: var(--text-sm);
}
.mini-list-item:last-child { border-bottom: none; }
.mini-list-item .mli-title { flex: 1; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-list-item .mli-meta { color: var(--text-muted); font-size: var(--text-xs); font-family: var(--font-mono); }

.alert-item {
  display: flex; gap: var(--sp-2); align-items: flex-start;
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius-md);
  background: var(--warning-soft);
  font-size: var(--text-sm); color: var(--text-secondary);
  margin-bottom: var(--sp-2);
}
.alert-item .icon { color: var(--warning); width: 14px; height: 14px; margin-top: 2px; flex-shrink: 0; }
.alert-item.danger { background: var(--danger-soft); }
.alert-item.danger .icon { color: var(--danger); }

.chapter-strip { display: flex; gap: 3px; flex-wrap: wrap; margin-top: var(--sp-2); }
.chapter-dot {
  width: 20px; height: 20px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-family: var(--font-mono); color: var(--text-muted);
  background: var(--bg-elevated-2); border: 1px solid var(--border);
  cursor: pointer;
}
.chapter-dot[data-status="final"], .chapter-dot[data-status="published"] { background: var(--success-soft); border-color: var(--success); color: var(--success); }
.chapter-dot[data-status="draft"] { background: var(--warning-soft); border-color: var(--warning); color: var(--warning); }
.chapter-dot[data-status="review"], .chapter-dot[data-status="rewrite"] { background: rgba(180,130,220,0.15); border-color: #b482dc; color: #b482dc; }
.chapter-dot[data-status="preparation"] { background: var(--info-soft); border-color: var(--info); color: var(--info); }

.streak-row { display: flex; gap: 4px; margin-top: var(--sp-2); }
.streak-cell { width: 14px; height: 14px; border-radius: 3px; background: var(--bg-elevated-2); }
.streak-cell.active { background: var(--accent); }


/* ============================================================
   BIBLIOTECA DE PROMPTS + BUSCADOR GLOBAL
   ============================================================ */

.prompts-toolbar { display: flex; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-4); flex-wrap: wrap; }
.prompts-toolbar input[type="search"] { flex: 1; min-width: 200px; }
.category-filter { display: flex; gap: 4px; flex-wrap: wrap; }
.category-filter .chip { cursor: pointer; transition: all var(--t-fast); }
.category-filter .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }

.prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-3); }
.prompt-card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2);
  transition: border-color var(--t-fast);
}
.prompt-card:hover { border-color: var(--border-strong); }
.prompt-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-2); }
.prompt-card-head h4 { font-size: var(--text-md); font-family: var(--font-display); }
.prompt-card .fav-btn { color: var(--text-muted); flex-shrink: 0; }
.prompt-card .fav-btn.active { color: var(--accent); }
.prompt-card .desc { font-size: var(--text-sm); color: var(--text-secondary); flex: 1; }
.prompt-card .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.prompt-card-actions { display: flex; gap: 6px; margin-top: var(--sp-2); }
.prompt-card-actions .btn { flex: 1; justify-content: center; }

/* Command palette / buscador global */
.cmdk-backdrop {
  position: fixed; inset: 0; background: rgba(6,7,9,0.55);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 12vh; z-index: 600;
  animation: fade-in var(--t-fast);
}
.cmdk {
  width: 600px; max-width: 90vw;
  background: var(--bg-elevated); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: modal-in var(--t-med);
}
.cmdk-input-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); }
.cmdk-input-row input { flex: 1; border: none; background: transparent; font-size: var(--text-md); padding: 4px 0; }
.cmdk-results { max-height: 400px; overflow-y: auto; padding: var(--sp-2); }
.cmdk-item { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); cursor: pointer; }
.cmdk-item:hover, .cmdk-item.selected { background: var(--bg-hover); }
.cmdk-item .icon { color: var(--text-muted); width: 15px; height: 15px; flex-shrink: 0; }
.cmdk-item .cmdk-title { flex: 1; font-size: var(--text-sm); }
.cmdk-item .cmdk-type { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); text-transform: uppercase; }
.cmdk-empty { padding: var(--sp-5); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }

</style>

/** Genera un id único razonable sin dependencias externas. */
function uid(prefix = '') {
  const rand = Math.random().toString(36).slice(2, 9);
  const time = Date.now().toString(36);
  return `${prefix ? prefix + '_' : ''}${time}${rand}`;
}

/** Formatea una fecha ISO a "hace X" en español. */
function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60) return 'ahora mismo';
  const m = Math.floor(s / 60);
  if (m < 60) return `hace ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.floor(h / 24);
  if (d < 30) return `hace ${d} d`;
  const mo = Math.floor(d / 30);
  if (mo < 12) return `hace ${mo} mes${mo > 1 ? 'es' : ''}`;
  const y = Math.floor(mo / 12);
  return `hace ${y} año${y > 1 ? 's' : ''}`;
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
}

function formatDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

function isoToday() {
  return new Date().toISOString().slice(0, 10);
}

function daysBetween(iso1, iso2) {
  const a = new Date(iso1).setHours(0, 0, 0, 0);
  const b = new Date(iso2).setHours(0, 0, 0, 0);
  return Math.round((b - a) / 86400000);
}

   ============================================================ */
/** Cuenta palabras de un texto markdown (ignora sintaxis básica). */
function countWords(text = '') {
  const clean = text
    .replace(/```[\s\S]*?```/g, ' ')      // bloques de código
    .replace(/[#>*_`~\-]/g, ' ')          // marcas markdown sueltas
    .trim();
  if (!clean) return 0;
  return clean.split(/\s+/).filter(Boolean).length;
}

function countChars(text = '') {
  return text.length;
}

/** Tiempo estimado de lectura en minutos (200 palabras/min en español). */
function readingTime(text = '', wpm = 200) {
  const words = countWords(text);
  return Math.max(1, Math.round(words / wpm));
}


/* ============================================================
   utils/markdown.js
   ============================================================ */

/**
 * markdown.js — Conversor Markdown → HTML minimalista, sin dependencias.
 * Cubre el subconjunto habitual para manuscritos: encabezados, negrita,
 * cursiva, citas, listas, código, reglas horizontales, enlaces y párrafos.
 * No pretende ser un parser CommonMark completo; prioriza velocidad y
 * cero dependencias para que la app siga siendo 100% estática.
 */

function inline(text) {
  let t = escapeHtml(text);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  t = t.replace(/__(.+?)__/g, '<strong>$1</strong>');
  t = t.replace(/_(.+?)_/g, '<em>$1</em>');
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}

function renderMarkdown(src = '') {
  const lines = src.replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let inCode = false, codeBuf = [];
  let listBuf = [], listType = null;
  let quoteBuf = [];

  const flushList = () => {
    if (listBuf.length) {
      const tag = listType === 'ol' ? 'ol' : 'ul';
      out.push(`<${tag}>${listBuf.map((li) => `<li>${inline(li)}</li>`).join('')}</${tag}>`);
      listBuf = []; listType = null;
    }
  };
  const flushQuote = () => {
    if (quoteBuf.length) {
      out.push(`<blockquote>${quoteBuf.map((l) => `<p>${inline(l)}</p>`).join('')}</blockquote>`);
      quoteBuf = [];
    }
  };

  for (const raw of lines) {
    const line = raw;

    if (line.trim().startsWith('```')) {
      if (inCode) {
        out.push(`<pre><code>${escapeHtml(codeBuf.join('\n'))}</code></pre>`);
        codeBuf = []; inCode = false;
      } else {
        flushList(); flushQuote();
        inCode = true;
      }
      continue;
    }
    if (inCode) { codeBuf.push(raw); continue; }

    if (/^\s*$/.test(line)) { flushList(); flushQuote(); continue; }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      flushList(); flushQuote();
      const level = h[1].length;
      out.push(`<h${level}>${inline(h[2])}</h${level}>`);
      continue;
    }

    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) {
      flushList(); flushQuote();
      out.push('<hr>');
      continue;
    }

    const bq = line.match(/^>\s?(.*)$/);
    if (bq) { flushList(); quoteBuf.push(bq[1]); continue; }

    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { flushQuote(); listType = 'ol'; listBuf.push(ol[1]); continue; }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul) { flushQuote(); listType = 'ul'; listBuf.push(ul[1]); continue; }

    flushList(); flushQuote();
    out.push(`<p>${inline(line)}</p>`);
  }
  flushList(); flushQuote();
  if (inCode && codeBuf.length) out.push(`<pre><code>${escapeHtml(codeBuf.join('\n'))}</code></pre>`);

  return out.join('\n');
}


/* ============================================================
   utils/diff.js
   ============================================================ */
/**
 * diff.js — Diferencia línea a línea entre dos textos usando LCS
 * (subsecuencia común más larga). Suficiente para manuscritos/documentos
 * de tamaño moderado; evita cargar una librería externa.
 *
 * Devuelve un array de { type: 'added'|'removed'|'unchanged', text }.
 */
function diffLines(oldText = '', newText = '') {
  const a = oldText.replace(/\r\n/g, '\n').split('\n');
  const b = newText.replace(/\r\n/g, '\n').split('\n');
  const n = a.length, m = b.length;

  // Tabla LCS (n+1) x (m+1)
  const lcs = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      lcs[i][j] = a[i] === b[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    }
  }

  const result = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) {
      result.push({ type: 'unchanged', text: a[i] });
      i++; j++;
    } else if (lcs[i + 1][j] >= lcs[i][j + 1]) {
      result.push({ type: 'removed', text: a[i] });
      i++;
    } else {
      result.push({ type: 'added', text: b[j] });
      j++;
    }
  }
  while (i < n) { result.push({ type: 'removed', text: a[i] }); i++; }
  while (j < m) { result.push({ type: 'added', text: b[j] }); j++; }
  return result;
}

/** Resumen rápido: cuántas líneas se añadieron/quitaron. */
function diffSummary(oldText, newText) {
  const d = diffLines(oldText, newText);
  return {
    added: d.filter((l) => l.type === 'added').length,
    removed: d.filter((l) => l.type === 'removed').length,
    lines: d,
  };
}


/* ============================================================
   utils/zip.js
   ============================================================ */
/**
 * zip.js — Generador de archivos .zip en el navegador sin librerías.
 * Usa el método STORED (sin compresión): produce un ZIP 100% válido,
 * legible por cualquier descompresor, a cambio de no comprimir.
 * Suficiente para exportar el proyecto (texto markdown, pesa poco).
 */

function crc32(buf) {
  let c, crc = 0xffffffff;
  for (let i = 0; i < buf.length; i++) {
    c = (crc ^ buf[i]) & 0xff;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function strToBytes(str) {
  return new TextEncoder().encode(str);
}

function dosDateTime(date = new Date()) {
  const time = ((date.getHours() & 0x1f) << 11) | ((date.getMinutes() & 0x3f) << 5) | ((date.getSeconds() >> 1) & 0x1f);
  const dosDate = (((date.getFullYear() - 1980) & 0x7f) << 9) | (((date.getMonth() + 1) & 0xf) << 5) | (date.getDate() & 0x1f);
  return { time, dosDate };
}

class ZipWriter {
  constructor() {
    this.files = []; // { name, data: Uint8Array }
  }

  addFile(name, content) {
    const data = typeof content === 'string' ? strToBytes(content) : content;
    this.files.push({ name, data });
  }

  /** Genera el Blob final del zip. */
  build() {
    const chunks = [];
    const central = [];
    let offset = 0;
    const { time, dosDate } = dosDateTime();

    for (const file of this.files) {
      const nameBytes = strToBytes(file.name);
      const crc = crc32(file.data);
      const size = file.data.length;

      // Local file header
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);       // version needed
      local.setUint16(6, 0, true);        // flags
      local.setUint16(8, 0, true);        // method = 0 (stored)
      local.setUint16(10, time, true);
      local.setUint16(12, dosDate, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, size, true);    // compressed size
      local.setUint32(22, size, true);    // uncompressed size
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);       // extra length

      chunks.push(new Uint8Array(local.buffer), nameBytes, file.data);

      // Central directory entry
      const centralHeader = new DataView(new ArrayBuffer(46));
      centralHeader.setUint32(0, 0x02014b50, true);
      centralHeader.setUint16(4, 20, true);
      centralHeader.setUint16(6, 20, true);
      centralHeader.setUint16(8, 0, true);
      centralHeader.setUint16(10, 0, true);
      centralHeader.setUint16(12, time, true);
      centralHeader.setUint16(14, dosDate, true);
      centralHeader.setUint32(16, crc, true);
      centralHeader.setUint32(20, size, true);
      centralHeader.setUint32(24, size, true);
      centralHeader.setUint16(28, nameBytes.length, true);
      centralHeader.setUint16(30, 0, true);
      centralHeader.setUint16(32, 0, true);
      centralHeader.setUint16(34, 0, true);
      centralHeader.setUint16(36, 0, true);
      centralHeader.setUint32(38, 0, true);
      centralHeader.setUint32(42, offset, true);

      central.push(new Uint8Array(centralHeader.buffer), nameBytes);

      offset += 30 + nameBytes.length + size;
    }

    const centralSize = central.reduce((s, c) => s + c.length, 0);
    const centralOffset = offset;

    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(4, 0, true);
    end.setUint16(6, 0, true);
    end.setUint16(8, this.files.length, true);
    end.setUint16(10, this.files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, centralOffset, true);
    end.setUint16(20, 0, true);

    const all = [...chunks, ...central, new Uint8Array(end.buffer)];
    return new Blob(all, { type: 'application/zip' });
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

   core/eventBus.js
   ============================================================ */
/**
 * eventBus.js — Pub/Sub simple para desacoplar módulos.
 * Cada módulo puede emitir eventos ("chapter:imported", "doc:saved"...)
 * y otros módulos (sobre todo el Workflow Assistant) se suscriben sin
 * que exista una dependencia directa entre ellos.
 */
class EventBus {
  constructor() { this._listeners = new Map(); }

  on(event, handler) {
    if (!this._listeners.has(event)) this._listeners.set(event, new Set());
    this._listeners.get(event).add(handler);
    return () => this.off(event, handler);
  }

  off(event, handler) {
    this._listeners.get(event)?.delete(handler);
  }

  emit(event, payload) {
    this._listeners.get(event)?.forEach((h) => {
      try { h(payload); } catch (err) { console.error(`[eventBus] error en handler de "${event}"`, err); }
    });
    // Wildcard listener para depuración / logging global
    this._listeners.get('*')?.forEach((h) => h({ event, payload }));
  }
}

const bus = new EventBus();

/** toast.js — Notificaciones no intrusivas en la esquina inferior derecha. */
function toast(message, type = 'default', duration = 3200) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    el.style.transition = 'all 180ms ease';
    setTimeout(() => el.remove(), 200);
  }, duration);
}

   core/modal.js
   ============================================================ */

/**
 * openModal — crea un modal genérico.
 * @param {Object} opts { title, bodyHtml, footerButtons: [{label, className, onClick, closeOnClick}], size }
 * @returns {Object} { close, root } el elemento raíz para poder engancharle listeners
 */
function openModal({ title, bodyHtml, footerButtons = [], size = '' }) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal ${size}">
      <div class="modal-header">
        <h3>${title}</h3>
        <button class="btn btn-icon btn-ghost" data-close>${icon('x')}</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer"></div>
    </div>
  `;
  document.body.appendChild(backdrop);

  const footer = backdrop.querySelector('.modal-footer');
  footerButtons.forEach((btn) => {
    const b = document.createElement('button');
    b.className = `btn ${btn.className || ''}`;
    b.textContent = btn.label;
    b.onclick = () => {
      btn.onClick?.();
      if (btn.closeOnClick !== false) close();
    };
    footer.appendChild(b);
  });

  function close() { backdrop.remove(); }

  backdrop.querySelector('[data-close]').onclick = close;
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  const escHandler = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);

  return { close, root: backdrop };
}

function confirmDialog({ title = '¿Confirmar?', message, confirmLabel = 'Confirmar', danger = true }) {
  return new Promise((resolve) => {
    openModal({
      title,
      bodyHtml: `<p style="color:var(--text-secondary); font-size: var(--text-sm); line-height:1.6;">${message}</p>`,
      footerButtons: [
        { label: 'Cancelar', className: 'btn-ghost', onClick: () => resolve(false) },
        { label: confirmLabel, className: danger ? 'btn-danger' : 'btn-primary', onClick: () => resolve(true) },
      ],
    });
  });
}


/* ============================================================
   core/db.js
   ============================================================ */
/**
 * db.js — Capa de persistencia sobre IndexedDB.
 *
 * Expone un wrapper mínimo pero completo (open/get/getAll/put/delete/
 * query por índice/clear) para cada "store" (equivalente a una tabla).
 * Ningún otro módulo debe tocar IndexedDB directamente: todos pasan
 * por aquí, para que el modelo de datos viva en un único sitio.
 *
 * Stores:
 *  - project        (1 registro): metadatos y configuración del proyecto
 *  - documents       : capítulos, biblia, cronología, continuidad, notas...
 *  - characters      : fichas de personajes
 *  - places          : fichas de lugares
 *  - objects         : fichas de objetos/inventario
 *  - mysteries       : misterios / foreshadowing
 *  - prompts         : biblioteca de prompts (por defecto + personalizados)
 *  - conversations   : historial de conversaciones con la IA
 *  - tasks           : tareas (kanban)
 *  - history         : snapshots de versiones de documentos
 *  - templates       : plantillas para crear nuevos documentos/fichas
 *  - trash           : papelera (elementos borrados recuperables)
 *  - workflowLog      : histórico de pasos completados del Workflow Assistant
 *  - activity        : registro de actividad (para "últimos modificados", rachas...)
 */

const DB_NAME = 'novel-ide-db';
const DB_VERSION = 1;

const STORE_DEFS = [
  { name: 'project',       keyPath: 'id' },
  { name: 'documents',     keyPath: 'id', indexes: [['type', 'type'], ['status', 'status'], ['updatedAt', 'updatedAt']] },
  { name: 'characters',    keyPath: 'id', indexes: [['updatedAt', 'updatedAt']] },
  { name: 'places',        keyPath: 'id', indexes: [['updatedAt', 'updatedAt']] },
  { name: 'objects',       keyPath: 'id', indexes: [['updatedAt', 'updatedAt']] },
  { name: 'mysteries',     keyPath: 'id', indexes: [['status', 'status']] },
  { name: 'prompts',       keyPath: 'id', indexes: [['category', 'category'], ['favorite', 'favorite']] },
  { name: 'conversations', keyPath: 'id', indexes: [['date', 'date']] },
  { name: 'tasks',         keyPath: 'id', indexes: [['status', 'status']] },
  { name: 'history',       keyPath: 'id', indexes: [['documentId', 'documentId'], ['timestamp', 'timestamp']] },
  { name: 'templates',     keyPath: 'id', indexes: [['type', 'type']] },
  { name: 'trash',         keyPath: 'id', indexes: [['deletedAt', 'deletedAt']] },
  { name: 'backups',       keyPath: 'id', indexes: [['timestamp', 'timestamp']] },
  { name: 'workflowLog',   keyPath: 'id', indexes: [['timestamp', 'timestamp']] },
  { name: 'activity',      keyPath: 'id', indexes: [['timestamp', 'timestamp']] },
];

class Database {
  constructor() {
    this._db = null;
    this._ready = null;
  }

  /** Abre (o crea) la base de datos. Idempotente. */
  open() {
    if (this._ready) return this._ready;
    this._ready = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);

      req.onupgradeneeded = (evt) => {
        const db = evt.target.result;
        STORE_DEFS.forEach((def) => {
          if (!db.objectStoreNames.contains(def.name)) {
            const store = db.createObjectStore(def.name, { keyPath: def.keyPath });
            (def.indexes || []).forEach(([idxName, keyPath]) => {
              store.createIndex(idxName, keyPath, { unique: false });
            });
          }
        });
      };

      req.onsuccess = (evt) => {
        this._db = evt.target.result;
        resolve(this._db);
      };

      req.onerror = () => reject(req.error);
    });
    return this._ready;
  }

  async _tx(storeName, mode = 'readonly') {
    const db = await this.open();
    const tx = db.transaction(storeName, mode);
    return { tx, store: tx.objectStore(storeName) };
  }

  async get(storeName, id) {
    const { store } = await this._tx(storeName);
    return new Promise((resolve, reject) => {
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async getAll(storeName) {
    const { store } = await this._tx(storeName);
    return new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async getAllByIndex(storeName, indexName, value) {
    const { store } = await this._tx(storeName);
    return new Promise((resolve, reject) => {
      const idx = store.index(indexName);
      const req = idx.getAll(value);
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async put(storeName, value) {
    const { tx, store } = await this._tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const req = store.put(value);
      req.onsuccess = () => resolve(value);
      req.onerror = () => reject(req.error);
      tx.onerror = () => reject(tx.error);
    });
  }

  async bulkPut(storeName, values) {
    const { tx, store } = await this._tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      values.forEach((v) => store.put(v));
      tx.oncomplete = () => resolve(values);
      tx.onerror = () => reject(tx.error);
    });
  }

  async delete(storeName, id) {
    const { tx, store } = await this._tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      store.delete(id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  async clear(storeName) {
    const { tx, store } = await this._tx(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      store.clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  /** Vuelca TODA la base de datos a un objeto plano (para exportar). */
  async exportAll() {
    const dump = {};
    for (const def of STORE_DEFS) {
      dump[def.name] = await this.getAll(def.name);
    }
    return dump;
  }

  /** Restaura la base de datos completa desde un objeto plano (importar). */
  async importAll(dump, { merge = false } = {}) {
    for (const def of STORE_DEFS) {
      if (!dump[def.name]) continue;
      if (!merge) await this.clear(def.name);
      await this.bulkPut(def.name, dump[def.name]);
    }
  }

  get storeNames() {
    return STORE_DEFS.map((d) => d.name);
  }
}

/**
 * state.js — Estado central de la aplicación.
 *
 * Mantiene una caché en memoria de todas las colecciones (para que la UI
 * sea instantánea) sincronizada con IndexedDB, y concentra la lógica de
 * negocio: crear/actualizar documentos, transiciones de estado de
 * capítulo, cálculo de estadísticas, etc. La UI nunca llama a `db`
 * directamente: siempre pasa por `state`, y `state` emite eventos por
 * el `bus` para que el resto de módulos (sobre todo el Workflow
 * Assistant) reaccionen.
 */

// Orden lógico de estados de un capítulo — usado por el Workflow Assistant
const CHAPTER_STATES = ['pending', 'preparation', 'draft', 'review', 'rewrite', 'final', 'published'];

const CHAPTER_STATE_LABELS = {
  pending: 'Pendiente',
  preparation: 'Preparación',
  draft: 'Primer borrador',
  review: 'Revisión',
  rewrite: 'Reescritura',
  final: 'Final',
  published: 'Publicado',
};

// Documentos "de biblia" que la app reconoce por convención de tipo
const DOC_TYPES = ['bible', 'chapter', 'character', 'place', 'object', 'timeline', 'continuity', 'mystery', 'note', 'template'];

class AppState {
  constructor() {
    this.project = null;
    this.documents = [];
    this.characters = [];
    this.places = [];
    this.objects = [];
    this.mysteries = [];
    this.prompts = [];
    this.conversations = [];
    this.tasks = [];
    this.templates = [];
    this.ready = false;
  }

  // ---------------------------------------------------------------
  // Carga inicial
  // ---------------------------------------------------------------
  async load() {
    await db.open();
    const [project, documents, characters, places, objects, mysteries, prompts, conversations, tasks, templates] = await Promise.all([
      db.getAll('project'),
      db.getAll('documents'),
      db.getAll('characters'),
      db.getAll('places'),
      db.getAll('objects'),
      db.getAll('mysteries'),
      db.getAll('prompts'),
      db.getAll('conversations'),
      db.getAll('tasks'),
      db.getAll('templates'),
    ]);
    this.project = project[0] || null;
    this.documents = documents;
    this.characters = characters;
    this.places = places;
    this.objects = objects;
    this.mysteries = mysteries;
    this.prompts = prompts;
    this.conversations = conversations;
    this.tasks = tasks;
    this.templates = templates;
    this.ready = true;
    bus.emit('state:loaded', this);
    return this;
  }

  async ensureProject() {
    if (this.project) return this.project;
    this.project = {
      id: 'main',
      title: 'Mi novela',
      author: '',
      genre: '',
      dailyWordGoal: 1000,
      createdAt: new Date().toISOString(),
      settings: { theme: 'dark' },
      writingLog: {}, // { 'YYYY-MM-DD': wordsWritten }
    };
    await db.put('project', this.project);
    return this.project;
  }

  async saveProject(patch) {
    this.project = { ...this.project, ...patch };
    await db.put('project', this.project);
    bus.emit('project:updated', this.project);
    return this.project;
  }

  // ---------------------------------------------------------------
  // Documentos genéricos (capítulos, biblia, cronología, continuidad, notas)
  // ---------------------------------------------------------------
  getDocuments(type) {
    return type ? this.documents.filter((d) => d.type === type) : this.documents;
  }

  getChapters() {
    return this.documents
      .filter((d) => d.type === 'chapter')
      .sort((a, b) => (a.chapterNumber || 0) - (b.chapterNumber || 0));
  }

  getDocument(id) {
    return this.documents.find((d) => d.id === id) || null;
  }

  async createDocument({ type, title, content = '', chapterNumber = null, tags = [] }) {
    const now = new Date().toISOString();
    const doc = {
      id: uid('doc'),
      type,
      title,
      content,
      tags,
      chapterNumber,
      status: type === 'chapter' ? 'pending' : null,
      checklist: type === 'chapter' ? defaultChapterChecklist() : null,
      wordCount: countWords(content),
      createdAt: now,
      updatedAt: now,
    };
    this.documents.push(doc);
    await db.put('documents', doc);
    await this._logActivity('document:created', doc.id, doc.title);
    bus.emit('document:created', doc);
    return doc;
  }

  async updateDocument(id, patch) {
    const doc = this.getDocument(id);
    if (!doc) return null;
    Object.assign(doc, patch, { updatedAt: new Date().toISOString() });
    if (patch.content !== undefined) doc.wordCount = countWords(patch.content);
    await db.put('documents', doc);
    bus.emit('document:updated', doc);
    return doc;
  }

  async setChapterStatus(id, status) {
    const doc = await this.updateDocument(id, { status });
    bus.emit('chapter:status-changed', doc);
    return doc;
  }

  async toggleChecklistItem(id, key) {
    const doc = this.getDocument(id);
    if (!doc || !doc.checklist) return null;
    doc.checklist[key] = !doc.checklist[key];
    await this.updateDocument(id, { checklist: doc.checklist });
    return doc;
  }

  async deleteDocument(id) {
    const doc = this.getDocument(id);
    if (!doc) return;
    this.documents = this.documents.filter((d) => d.id !== id);
    await db.delete('documents', id);
    await this._toTrash('documents', doc);
    bus.emit('document:deleted', doc);
  }

  nextChapterNumber() {
    const chapters = this.getChapters();
    return chapters.length ? Math.max(...chapters.map((c) => c.chapterNumber || 0)) + 1 : 1;
  }

  // ---------------------------------------------------------------
  // Entidades narrativas (personajes / lugares / objetos / misterios)
  // ---------------------------------------------------------------
  _entityStoreFor(kind) {
    return { character: 'characters', place: 'places', object: 'objects', mystery: 'mysteries' }[kind];
  }
  _entityListFor(kind) {
    return { character: this.characters, place: this.places, object: this.objects, mystery: this.mysteries }[kind];
  }

  async createEntity(kind, data) {
    const now = new Date().toISOString();
    const entity = { id: uid(kind), createdAt: now, updatedAt: now, chapters: [], ...data };
    this._entityListFor(kind).push(entity);
    await db.put(this._entityStoreFor(kind), entity);
    bus.emit(`${kind}:created`, entity);
    return entity;
  }

  async updateEntity(kind, id, patch) {
    const list = this._entityListFor(kind);
    const entity = list.find((e) => e.id === id);
    if (!entity) return null;
    Object.assign(entity, patch, { updatedAt: new Date().toISOString() });
    await db.put(this._entityStoreFor(kind), entity);
    bus.emit(`${kind}:updated`, entity);
    return entity;
  }

  async deleteEntity(kind, id) {
    const store = this._entityStoreFor(kind);
    const list = this._entityListFor(kind);
    const entity = list.find((e) => e.id === id);
    if (!entity) return;
    this[store] = list.filter((e) => e.id !== id);
    await db.delete(store, id);
    await this._toTrash(store, entity);
    bus.emit(`${kind}:deleted`, entity);
  }

  // ---------------------------------------------------------------
  // Prompts
  // ---------------------------------------------------------------
  async seedPromptsIfEmpty(defaultPrompts) {
    if (this.prompts.length) return;
    const now = new Date().toISOString();
    const withIds = defaultPrompts.map((p) => ({ id: uid('prompt'), favorite: false, usageCount: 0, createdAt: now, updatedAt: now, ...p }));
    this.prompts = withIds;
    await db.bulkPut('prompts', withIds);
  }

  async toggleFavoritePrompt(id) {
    const p = this.prompts.find((x) => x.id === id);
    if (!p) return;
    p.favorite = !p.favorite;
    await db.put('prompts', p);
    bus.emit('prompt:updated', p);
  }

  async registerPromptUsage(id) {
    const p = this.prompts.find((x) => x.id === id);
    if (!p) return;
    p.usageCount = (p.usageCount || 0) + 1;
    p.lastUsed = new Date().toISOString();
    await db.put('prompts', p);
  }

  async savePrompt(promptData) {
    const now = new Date().toISOString();
    let p;
    if (promptData.id) {
      p = this.prompts.find((x) => x.id === promptData.id);
      Object.assign(p, promptData, { updatedAt: now });
    } else {
      p = { id: uid('prompt'), favorite: false, usageCount: 0, createdAt: now, updatedAt: now, ...promptData };
      this.prompts.push(p);
    }
    await db.put('prompts', p);
    bus.emit('prompt:updated', p);
    return p;
  }

  async deletePrompt(id) {
    this.prompts = this.prompts.filter((p) => p.id !== id);
    await db.delete('prompts', id);
  }

  // ---------------------------------------------------------------
  // Conversaciones
  // ---------------------------------------------------------------
  async logConversation(data) {
    const conv = { id: uid('conv'), date: new Date().toISOString(), status: 'completada', ...data };
    this.conversations.unshift(conv);
    await db.put('conversations', conv);
    bus.emit('conversation:logged', conv);
    return conv;
  }

  // ---------------------------------------------------------------
  // Tareas (kanban)
  // ---------------------------------------------------------------
  async createTask(data) {
    const task = { id: uid('task'), status: 'pending', createdAt: new Date().toISOString(), ...data };
    this.tasks.push(task);
    await db.put('tasks', task);
    bus.emit('task:created', task);
    return task;
  }

  async updateTask(id, patch) {
    const task = this.tasks.find((t) => t.id === id);
    if (!task) return null;
    Object.assign(task, patch);
    await db.put('tasks', task);
    bus.emit('task:updated', task);
    return task;
  }

  async deleteTask(id) {
    this.tasks = this.tasks.filter((t) => t.id !== id);
    await db.delete('tasks', id);
  }

  // ---------------------------------------------------------------
  // Actividad / estadísticas
  // ---------------------------------------------------------------
  async _logActivity(type, refId, label) {
    const entry = { id: uid('act'), type, refId, label, timestamp: new Date().toISOString() };
    await db.put('activity', entry);
    return entry;
  }

  async _toTrash(originalStore, data) {
    const entry = { id: uid('trash'), originalStore, data, deletedAt: new Date().toISOString() };
    await db.put('trash', entry);
  }

  async recordWordsToday(delta) {
    const project = await this.ensureProject();
    const key = new Date().toISOString().slice(0, 10);
    project.writingLog = project.writingLog || {};
    project.writingLog[key] = (project.writingLog[key] || 0) + delta;
    await this.saveProject({ writingLog: project.writingLog });
  }

  stats() {
    const chapters = this.getChapters();
    const totalWords = chapters.reduce((s, c) => s + (c.wordCount || 0), 0);
    const written = chapters.filter((c) => ['final', 'published'].includes(c.status));
    const pending = chapters.filter((c) => !['final', 'published'].includes(c.status));
    const avg = chapters.length ? Math.round(totalWords / chapters.length) : 0;
    return {
      totalChapters: chapters.length,
      writtenChapters: written.length,
      pendingChapters: pending.length,
      totalWords,
      avgWordsPerChapter: avg,
      completionPct: chapters.length ? Math.round((written.length / chapters.length) * 100) : 0,
      totalCharacters: this.characters.length,
      totalPlaces: this.places.length,
      totalObjects: this.objects.length,
      openMysteries: this.mysteries.filter((m) => m.status !== 'resuelto').length,
    };
  }
}

/**
 * router.js — Gestiona las "pestañas" abiertas (al estilo VS Code) y
 * delega el renderizado del área principal al módulo correspondiente.
 * No usa hash routing porque la app es una herramienta de escritorio
 * local, no un sitio con URLs que compartir.
 */

const registry = new Map(); // type -> { render(container, tab), icon, getTitle(tab) }

function registerView(type, def) {
  registry.set(type, def);
}

class Router {
  constructor() {
    this.tabs = [];       // { id, type, refId, title, closable }
    this.activeId = null;
  }

  openTab({ type, refId = null, title, closable = true, singleton = true }) {
    const tabId = singleton ? `${type}:${refId || 'single'}` : `${type}:${refId}:${Date.now()}`;
    let tab = this.tabs.find((t) => t.id === tabId);
    if (!tab) {
      tab = { id: tabId, type, refId, title, closable };
      this.tabs.push(tab);
    } else {
      tab.title = title; // refrescar título por si el doc cambió de nombre
    }
    this.activeId = tabId;
    this.render();
    return tab;
  }

  closeTab(tabId) {
    const idx = this.tabs.findIndex((t) => t.id === tabId);
    if (idx === -1) return;
    this.tabs.splice(idx, 1);
    if (this.activeId === tabId) {
      const fallback = this.tabs[idx] || this.tabs[idx - 1];
      this.activeId = fallback ? fallback.id : null;
    }
    this.render();
  }

  setActive(tabId) {
    this.activeId = tabId;
    this.render();
  }

  markUnsaved(tabId, unsaved) {
    const tab = this.tabs.find((t) => t.id === tabId);
    if (tab) { tab.unsaved = unsaved; this.renderTabBar(); }
  }

  get activeTab() {
    return this.tabs.find((t) => t.id === this.activeId) || null;
  }

  renderTabBar() {
    const bar = document.getElementById('tabbar');
    if (!bar) return;
    bar.innerHTML = this.tabs.map((t) => `
      <div class="tab ${t.id === this.activeId ? 'active' : ''} ${t.unsaved ? 'unsaved' : ''}" data-tab="${t.id}">
        <span class="tab-dot"></span>
        <span class="tab-label">${t.title}</span>
        ${t.closable ? `<span class="tab-close" data-close-tab="${t.id}">${icon('x', 'icon')}</span>` : ''}
      </div>
    `).join('');

    bar.querySelectorAll('[data-tab]').forEach((el) => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-close-tab]')) return;
        this.setActive(el.dataset.tab);
      });
    });
    bar.querySelectorAll('[data-close-tab]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        this.closeTab(el.dataset.closeTab);
      });
    });
  }

  render() {
    this.renderTabBar();
    const root = document.getElementById('view-root');
    if (!root) return;
    const tab = this.activeTab;
    if (!tab) {
      root.innerHTML = `<div class="empty-state" style="height:100%;justify-content:center;">
        ${icon('book')}<h4>Ninguna pestaña abierta</h4><p>Selecciona un elemento del explorador o abre el panel de bienvenida.</p>
      </div>`;
      bus.emit('router:no-tab');
      return;
    }
    const def = registry.get(tab.type);
    if (!def) {
      root.innerHTML = `<div class="empty-state">Vista desconocida: ${tab.type}</div>`;
      return;
    }
    root.innerHTML = '';
    def.render(root, tab);
    bus.emit('router:navigated', tab);
  }
}
