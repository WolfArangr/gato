/* ============================================================
   modules/continuity.js
   ============================================================ */
/**
 * continuity.js — Motor de detección de inconsistencias.
 *
 * Trabaja sobre datos ESTRUCTURADOS (estados de capítulo, checklist,
 * nombres duplicados, fechas de misterios) porque analizar prosa libre
 * en busca de contradicciones requeriría un LLM — precisamente lo que
 * el Workflow Assistant delega en la IA a través de la auditoría de
 * continuidad. Esta capa cubre lo que SÍ se puede verificar de forma
 * determinista y barata, dejando el resto al prompt de auditoría.
 */

function detectContinuityAlerts() {
  const alerts = [];
  const chapters = state.getChapters();

  // 1. Capítulos finalizados con checklist incompleto
  chapters.filter((c) => ['final', 'published'].includes(c.status)).forEach((c) => {
    const cl = c.checklist || {};
    const missing = Object.entries(cl).filter(([, v]) => !v).map(([k]) => k);
    if (missing.length) {
      alerts.push({ severity: 'warning', message: `Capítulo ${c.chapterNumber} marcado como final pero con ${missing.length} tarea(s) de checklist sin completar.`, chapterId: c.id });
    }
  });

  // 2. Nombres duplicados entre personajes / lugares / objetos
  ['characters', 'places', 'objects'].forEach((kind) => {
    const names = state[kind].map((e) => (e.name || '').trim().toLowerCase()).filter(Boolean);
    const dupes = names.filter((n, i) => names.indexOf(n) !== i);
    [...new Set(dupes)].forEach((n) => {
      alerts.push({ severity: 'danger', message: `Nombre duplicado en ${kind === 'characters' ? 'personajes' : kind === 'places' ? 'lugares' : 'objetos'}: "${n}".` });
    });
  });

  // 3. Misterios cuyo capítulo de resolución previsto ya ha pasado y siguen abiertos
  const lastChapterNum = chapters.length ? Math.max(...chapters.map((c) => c.chapterNumber || 0)) : 0;
  state.mysteries.forEach((m) => {
    if (m.status !== 'resuelto' && m.expectedResolutionChapter && Number(m.expectedResolutionChapter) < lastChapterNum) {
      alerts.push({ severity: 'warning', message: `El misterio "${m.title}" debía resolverse antes del capítulo ${m.expectedResolutionChapter} y sigue abierto.`, mysteryId: m.id });
    }
  });

  // 4. Huecos en la numeración de capítulos
  const numbers = chapters.map((c) => c.chapterNumber).sort((a, b) => a - b);
  for (let i = 1; i < numbers.length; i++) {
    if (numbers[i] - numbers[i - 1] > 1) {
      alerts.push({ severity: 'warning', message: `Salto en la numeración de capítulos: falta entre el ${numbers[i - 1]} y el ${numbers[i]}.` });
    }
  }

  // 5. Personajes sin ninguna aparición registrada tras 3+ capítulos desde su creación
  state.characters.forEach((ch) => {
    if ((!ch.chapters || ch.chapters.length === 0) && lastChapterNum >= 3) {
      alerts.push({ severity: 'default', message: `El personaje "${ch.name}" no tiene capítulos de aparición registrados.` });
    }
  });

  return alerts;
}

function renderContinuity(container) {
  const alerts = detectContinuityAlerts();
  const bySeverity = { danger: [], warning: [], default: [] };
  alerts.forEach((a) => bySeverity[a.severity === 'danger' ? 'danger' : a.severity === 'warning' ? 'warning' : 'default'].push(a));

  container.innerHTML = `
    <div class="section-header">
      <div><h2>Control de continuidad</h2><div class="subtitle">Comprobaciones automáticas deterministas + auditorías con IA para todo lo demás</div></div>
    </div>
    <div class="view-scroll">
      <div class="stat-grid" style="margin-bottom:var(--sp-4);">
        <div class="stat-tile"><div class="stat-value" style="color:var(--danger)">${bySeverity.danger.length}</div><div class="stat-label">Críticas</div></div>
        <div class="stat-tile"><div class="stat-value" style="color:var(--warning)">${bySeverity.warning.length}</div><div class="stat-label">Advertencias</div></div>
        <div class="stat-tile"><div class="stat-value">${bySeverity.default.length}</div><div class="stat-label">Informativas</div></div>
      </div>
      <div class="card">
        <div class="card-title">${icon('shield', 'icon')} Todas las alertas</div>
        ${alerts.length ? alerts.map((a) => `<div class="alert-item ${a.severity === 'default' ? '' : a.severity}">${icon('alertTriangle')}<span>${a.message}</span></div>`).join('') : '<p class="text-muted" style="font-size:var(--text-sm);">No se ha detectado ninguna inconsistencia estructural. Recuerda que las contradicciones de trama solo las detecta la auditoría con IA (biblioteca de prompts → "Auditoría de continuidad").</p>'}
      </div>
    </div>
  `;
}

registerView('continuity', { render: renderContinuity });


/* ============================================================
   modules/workflowAssistant.js
   ============================================================ */
/**
 * workflowAssistant.js — El "editor jefe" de la aplicación.
 *
 * Analiza el estado del proyecto (capítulos y sus estados, contadores
 * desde la última auditoría / revisión de editor jefe) y decide SIEMPRE
 * cuál es el siguiente paso lógico, con su prompt ya relleno con los
 * datos reales del proyecto. Se renderiza en el panel derecho, visible
 * permanentemente, y también sirve de widget principal del Dashboard.
 *
 * Máquina de estados por capítulo (reutiliza CHAPTER_STATES de state.js):
 *   pending      → preparar capítulo            (prompt: prepare-next-chapter)
 *   preparation  → escribir capítulo             (prompt: write-chapter)
 *   draft        → actualizar documentación      (prompt: update-docs)
 *   review       → revisión literaria             (prompt: literary-review)
 *   rewrite      → reescribir capítulo            (prompt: rewrite-chapter)
 *   final        → (dispara auditorías periódicas o pasa al siguiente capítulo)
 *
 * Disparadores periódicos:
 *   - Auditoría de continuidad cada 5 capítulos finalizados.
 *   - Revisión de editor jefe cada 10 capítulos finalizados.
 */

const AUDIT_EVERY = 5;
const CHIEF_EDITOR_EVERY = 10;

const NEXT_STATUS = {
  pending: 'preparation',
  preparation: 'draft',
  draft: 'review',
  review: 'rewrite',
  rewrite: 'final',
};

const ESTIMATES = {
  bible: '20-30 min', prepare: '10-15 min', write: '45-60 min', update_docs: '10-15 min',
  review: '15-20 min', rewrite: '30-45 min', audit: '20-30 min', chief_editor: '40-60 min', publish: '5 min',
};

function findPrompt(slug) {
  return state.prompts.find((p) => p.slug === slug) || null;
}

function fillTemplate(tpl, vars) {
  return tpl.replace(/\{\{(\w+)\}\}/g, (_, key) => (vars[key] !== undefined ? vars[key] : `{{${key}}}`));
}

function docExists(type) {
  return state.getDocuments(type).length > 0;
}

/** Calcula cuál es la recomendación actual. Devuelve un objeto "step" descriptivo. */
function computeCurrentStep() {
  const chapters = state.getChapters();
  const project = state.project || {};
  const meta = project.workflowMeta || { lastAuditChapter: 0, lastChiefEditorChapter: 0 };

  // 0. Sin biblia y sin capítulos: arrancar el proyecto
  if (!docExists('bible') && chapters.length === 0) {
    return buildStep({
      key: 'bible',
      title: 'Genera la biblia narrativa inicial',
      badge: 'Paso 0 · Arranque del proyecto',
      estimate: ESTIMATES.bible,
      promptSlug: 'generate-bible',
      docs: [],
      onComplete: async () => toast('Cuando pegues el resultado, impórtalo como documento de Biblia.', 'default'),
    });
  }

  const finalizedCount = chapters.filter((c) => ['final', 'published'].includes(c.status)).length;

  // 1. Auditoría de continuidad pendiente
  if (finalizedCount > 0 && finalizedCount - meta.lastAuditChapter >= AUDIT_EVERY) {
    return buildStep({
      key: 'audit',
      title: `Auditoría de continuidad (hasta el capítulo ${finalizedCount})`,
      badge: `Cada ${AUDIT_EVERY} capítulos · Auditoría`,
      estimate: ESTIMATES.audit,
      promptSlug: 'continuity-audit',
      vars: { chapterNumber: finalizedCount },
      docs: ['timeline', 'continuity', 'character', 'place', 'object'],
      onComplete: async () => {
        await state.saveProject({ workflowMeta: { ...meta, lastAuditChapter: finalizedCount } });
      },
    });
  }

  // 2. Revisión de editor jefe pendiente
  if (finalizedCount > 0 && finalizedCount - meta.lastChiefEditorChapter >= CHIEF_EDITOR_EVERY) {
    return buildStep({
      key: 'chief_editor',
      title: `Informe de Editor Jefe (hasta el capítulo ${finalizedCount})`,
      badge: `Cada ${CHIEF_EDITOR_EVERY} capítulos · Editor Jefe`,
      estimate: ESTIMATES.chief_editor,
      promptSlug: 'chief-editor',
      vars: { chapterNumber: finalizedCount },
      docs: [],
      onComplete: async () => {
        await state.saveProject({ workflowMeta: { ...meta, lastChiefEditorChapter: finalizedCount } });
      },
    });
  }

  // 3. Buscar el primer capítulo no finalizado
  const active = chapters.find((c) => !['final', 'published'].includes(c.status));

  if (active) {
    return stepForChapter(active);
  }

  // 4. Todos los capítulos existentes están finalizados → preparar el siguiente
  const nextNum = state.nextChapterNumber();
  return buildStep({
    key: 'new_chapter',
    title: `Preparar el Capítulo ${nextNum}`,
    badge: `Paso siguiente · Capítulo ${nextNum}`,
    estimate: ESTIMATES.prepare,
    promptSlug: 'prepare-next-chapter',
    vars: { chapterNumber: nextNum, chapterTitle: `Capítulo ${nextNum}`, previousChapterTitle: chapters.length ? chapters[chapters.length - 1].title : '—' },
    docs: ['timeline', 'continuity', 'character'],
    onComplete: async () => {
      await state.createDocument({ type: 'chapter', title: `Capítulo ${nextNum}`, chapterNumber: nextNum, content: '' });
    },
    createsChapter: true,
  });
}

function stepForChapter(chapter) {
  const chapters = state.getChapters();
  const idx = chapters.findIndex((c) => c.id === chapter.id);
  const prev = chapters[idx - 1];
  const vars = {
    chapterNumber: chapter.chapterNumber,
    chapterTitle: chapter.title,
    previousChapterTitle: prev ? prev.title : '—',
  };

  const CONFIG = {
    pending: { title: `Preparar el Capítulo ${chapter.chapterNumber}`, promptSlug: 'prepare-next-chapter', estimate: ESTIMATES.prepare, docs: ['timeline', 'continuity', 'character'] },
    preparation: { title: `Escribir el Capítulo ${chapter.chapterNumber}`, promptSlug: 'write-chapter', estimate: ESTIMATES.write, docs: ['bible', 'timeline', 'character', 'mystery', 'continuity'] },
    draft: { title: `Actualizar documentación tras el Capítulo ${chapter.chapterNumber}`, promptSlug: 'update-docs', estimate: ESTIMATES.update_docs, docs: ['character', 'timeline', 'continuity'] },
    review: { title: `Revisión literaria del Capítulo ${chapter.chapterNumber}`, promptSlug: 'literary-review', estimate: ESTIMATES.review, docs: [] },
    rewrite: { title: `Reescribir el Capítulo ${chapter.chapterNumber}`, promptSlug: 'rewrite-chapter', estimate: ESTIMATES.rewrite, docs: [] },
  };

  const cfg = CONFIG[chapter.status];
  if (!cfg) {
    // Estado desconocido → tratar como pendiente por seguridad
    return buildStep({ key: 'pending', title: `Preparar el Capítulo ${chapter.chapterNumber}`, badge: 'Paso siguiente', estimate: ESTIMATES.prepare, promptSlug: 'prepare-next-chapter', vars, docs: [], onComplete: async () => {} });
  }

  return buildStep({
    key: chapter.status,
    title: cfg.title,
    badge: `Capítulo ${chapter.chapterNumber} · ${CHAPTER_STATE_LABELS[chapter.status]} → ${CHAPTER_STATE_LABELS[NEXT_STATUS[chapter.status]]}`,
    estimate: cfg.estimate,
    promptSlug: cfg.promptSlug,
    vars,
    docs: cfg.docs,
    chapterId: chapter.id,
    onComplete: async () => {
      await state.setChapterStatus(chapter.id, NEXT_STATUS[chapter.status]);
    },
  });
}

function buildStep({ key, title, badge, estimate, promptSlug, vars = {}, docs = [], onComplete, chapterId = null, createsChapter = false }) {
  const prompt = findPrompt(promptSlug);
  const filled = prompt ? fillTemplate(prompt.content, vars) : '(Prompt no encontrado en la biblioteca)';
  const docLabels = { bible: 'Biblia', timeline: 'Cronología', continuity: 'Continuidad', character: 'Personajes', place: 'Lugares', object: 'Objetos', mystery: 'Misterios' };
  return {
    key, title, badge, estimate, promptSlug, promptId: prompt?.id, filledPrompt: filled,
    docs: docs.map((d) => ({ type: d, label: docLabels[d] || d, exists: docExists(d) })),
    onComplete, chapterId, createsChapter,
  };
}

  container.innerHTML = `

      <div class="wf-step-badge">${icon('sparkle', 'icon')} ${step.badge}</div>
      <div class="wf-title">${step.title}</div>
      <div class="wf-meta">${icon('clock', 'icon')} Duración estimada: ${step.estimate}</div>
      ${step.docs.length ? `
        <div class="wf-docs">
          ${step.docs.map((d) => `
            <div class="wf-doc-item ${d.exists ? '' : 'missing'}" data-open-doctype="${d.type}">
              ${icon(d.exists ? 'check' : 'alertTriangle')}
              <span>${d.label}${d.exists ? '' : ' (no encontrado)'}</span>
            </div>
          `).join('')}
        </div>` : ''}
      <div class="wf-actions">
        <button class="btn btn-primary" id="wf-copy-btn">${icon('copy')} Copiar Prompt</button>

      </div>
    </div>

    <div>
      <div class="card-title" style="font-size:var(--text-sm); margin-bottom:var(--sp-2);">
        ${icon('history', 'icon')} Últimos pasos completados
      </div>
      <div class="wf-history">
        ${recentLog.length ? recentLog.map((h) => `
          <div class="wf-history-item">
            <div><div class="wf-history-title">${h.title}</div><div>${timeAgo(h.timestamp)}</div></div>
          </div>
        `).join('') : '<p class="text-muted" style="font-size:var(--text-xs);">Todavía no se ha completado ningún paso.</p>'}
      </div>

  container.querySelector('#wf-copy-btn').addEventListener('click', async () => {

  });
}

async function copyStep(step) {
  try {
    await navigator.clipboard.writeText(step.filledPrompt);
  } catch {
    // Fallback para navegadores sin permiso de portapapeles
    const ta = document.createElement('textarea');
    ta.value = step.filledPrompt;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  if (step.promptId) state.registerPromptUsage(step.promptId);
  const flash = document.getElementById('wf-flash');
  if (flash) { flash.classList.add('show'); setTimeout(() => flash.classList.remove('show'), 900); }
  toast('Prompt copiado. Pégalo en tu conversación con la IA.', 'success');
}

async function completeStep(step) {
  await step.onComplete?.();
  await db.put('workflowLog', { id: uid('wlog'), title: step.title, key: step.key, timestamp: new Date().toISOString() });
  toast('Paso marcado como completado. Calculando el siguiente…', 'success');
  bus.emit('workflow:step-completed', step);
}

// Recalcula el panel cada vez que cambia algo relevante del estado
['document:updated', 'document:created', 'chapter:status-changed', 'workflow:step-completed', 'state:loaded'].forEach((evt) => {
  bus.on(evt, () => {
    const el = document.getElementById('right-panel-body-workflow');
    if (el) renderWorkflowPanel(el);
    bus.emit('dashboard:refresh-request');
  });
});

function lastModified(list, n = 5) {
  return [...list].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0, n);

function streakDays() {
  const log = state.project?.writingLog || {};
  const days = [];
  for (let i = 13; i >= 0; i--) {

    const key = d.toISOString().slice(0, 10);
    days.push({ key, active: (log[key] || 0) > 0 });

  return days;
}

  container.innerHTML = `
    <div class="editor-view">
      <div class="editor-meta-bar">
        <input class="editor-title-input" id="ed-title" value="${escapeAttr(doc.title)}" />
        ${doc.type === 'chapter' ? `
          <select id="ed-status" class="mono" style="font-size:var(--text-xs);">
            ${CHAPTER_STATES.map((s) => `<option value="${s}" ${s === doc.status ? 'selected' : ''}>${CHAPTER_STATE_LABELS[s]}</option>`).join('')}
          </select>
        ` : ''}
        <button class="btn btn-sm btn-ghost" id="ed-history-btn">${icon('history', 'icon')} Historial</button>
      </div>
      <div class="editor-toolbar">
        <button class="btn btn-icon btn-ghost" data-mode="edit" data-tip="Solo edición">${icon('edit')}</button>
        <button class="btn btn-icon btn-ghost" data-mode="split" data-tip="Pantalla dividida">${icon('split')}</button>
        <button class="btn btn-icon btn-ghost" data-mode="preview" data-tip="Vista previa">${icon('eye')}</button>
        <div class="divider"></div>
        <button class="btn btn-icon btn-ghost" id="ed-fullscreen" data-tip="Pantalla completa">${icon('maximize')}</button>
        <div class="spacer"></div>
        <div class="save-indicator" id="ed-save-indicator"><span class="dot"></span><span id="ed-save-text">Guardado</span></div>
      </div>
      <div class="editor-body split" id="ed-body">
        <div class="editor-pane"><textarea id="markdown-textarea" spellcheck="false">${escapeHtml(doc.content || '')}</textarea></div>
        <div class="preview-pane"><div class="preview-content" id="ed-preview">${renderMarkdown(doc.content || '')}</div></div>
      </div>
      <div class="editor-statusline">
        <span id="ed-words">0 palabras</span>
        <span id="ed-chars">0 caracteres</span>
        <span id="ed-time">0 min de lectura</span>
        <span class="status-spacer"></span>
        <span>Última edición: ${timeAgo(doc.updatedAt)}</span>
      </div>
      ${doc.type === 'chapter' ? renderChecklist(doc) : ''}
    </div>
  `;

  const textarea = container.querySelector('#markdown-textarea');
  const preview = container.querySelector('#ed-preview');
  const body = container.querySelector('#ed-body');
  const wordsEl = container.querySelector('#ed-words');
  const charsEl = container.querySelector('#ed-chars');
  const timeEl = container.querySelector('#ed-time');
  const saveIndicator = container.querySelector('#ed-save-indicator');
  const saveText = container.querySelector('#ed-save-text');

  function updateCounts(text) {
    wordsEl.textContent = `${countWords(text)} palabras`;
    charsEl.textContent = `${countChars(text)} caracteres`;
    timeEl.textContent = `${readingTime(text)} min de lectura`;
  }
  updateCounts(doc.content || '');

  container.querySelectorAll('[data-mode]').forEach((btn) => {
    btn.addEventListener('click', () => {
      body.className = `editor-body ${btn.dataset.mode === 'split' ? '' : btn.dataset.mode + '-only'}`;
      container.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('active', b === btn));
    });
  });

  container.querySelector('#ed-fullscreen').addEventListener('click', () => {
    document.getElementById('app').classList.toggle('sidebar-collapsed');
    document.getElementById('app').classList.toggle('right-collapsed');
  });

  let debounceTimer = null;
  textarea.addEventListener('input', () => {
    const text = textarea.value;
    preview.innerHTML = renderMarkdown(text);
    updateCounts(text);
    saveIndicator.classList.add('saving');
    saveText.textContent = 'Guardando…';
    router.markUnsaved(tab.id, true);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => persist(doc, textarea.value, saveIndicator, saveText, tab), AUTOSAVE_DELAY);
    // Recuperación automática: guarda en localStorage-free fallback (memoria de sesión)
    window.__novelIdeRecovery = window.__novelIdeRecovery || {};
    window.__novelIdeRecovery[doc.id] = text;
  });

  container.querySelector('#ed-title').addEventListener('change', async (e) => {
    await state.updateDocument(doc.id, { title: e.target.value });
    tab.title = e.target.value;
    router.render();
  });

  const statusSelect = container.querySelector('#ed-status');
  if (statusSelect) {
    statusSelect.addEventListener('change', async (e) => {
      await state.setChapterStatus(doc.id, e.target.value);
      toast(`Capítulo marcado como "${CHAPTER_STATE_LABELS[e.target.value]}"`, 'success');
    });
  }

  container.querySelector('#ed-history-btn').addEventListener('click', () => openHistoryModal(doc.id));

  container.querySelectorAll('[data-checklist]').forEach((cb) => {
    cb.addEventListener('change', async () => {
      await state.toggleChecklistItem(doc.id, cb.dataset.checklist);
    });
  });
}

async function persist(doc, content, indicator, textEl, tab) {
  await state.updateDocument(doc.id, { content });
  // snapshot de historial (máximo cada guardado; se podría limitar, se deja simple)
  await db.put('history', { id: uid('hist'), documentId: doc.id, timestamp: new Date().toISOString(), content });
  indicator.classList.remove('saving');
  textEl.textContent = 'Guardado';
  router.markUnsaved(tab.id, false);
  bus.emit('document:content-saved', doc);
}

function renderChecklist(doc) {
  const cl = doc.checklist || {};
  const labels = {
    escrito: 'Escrito', revisado: 'Revisado', continuidadActualizada: 'Continuidad actualizada',
    personajesActualizados: 'Personajes actualizados', cronologiaActualizada: 'Cronología actualizada',
    objetosActualizados: 'Objetos actualizados', lugaresActualizados: 'Lugares actualizados',
    auditoriaRealizada: 'Auditoría realizada', resumenGenerado: 'Resumen generado', finalizado: 'Finalizado',
  };
  return `
    <div style="padding: var(--sp-3) var(--sp-4); border-top:1px solid var(--border-soft); display:flex; flex-wrap:wrap; gap: var(--sp-3); background:var(--bg-panel);">
      ${Object.entries(labels).map(([key, label]) => `
        <label style="display:flex; align-items:center; gap:6px; font-size:var(--text-xs); color:var(--text-secondary); cursor:pointer;">
          <input type="checkbox" data-checklist="${key}" ${cl[key] ? 'checked' : ''} style="width:14px;height:14px;" />
          ${label}
        </label>
      `).join('')}
    </div>
  `;
}

async function openHistoryModal(documentId) {
  const all = await db.getAllByIndex('history', 'documentId', documentId);
  const sorted = all.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  openModal({
    title: 'Historial de versiones',
    size: 'modal-lg',
    bodyHtml: sorted.length ? `
      <div class="mini-list">
        ${sorted.slice(0, 30).map((h) => `
          <div class="mini-list-item" data-hist-id="${h.id}" style="cursor:pointer;">
            <span class="mli-title">${formatDateTime(h.timestamp)}</span>
            <span class="mli-meta">${countWords(h.content)} palabras</span>
          </div>
        `).join('')}
      </div>
      <p class="text-muted" style="font-size:var(--text-xs); margin-top:var(--sp-3);">Haz clic en una versión para comparar contra la actual.</p>
      <div id="hist-diff-container" style="margin-top:var(--sp-3);"></div>
    ` : '<p class="text-muted">Todavía no hay versiones guardadas de este documento.</p>',
    footerButtons: [{ label: 'Cerrar', className: 'btn-ghost' }],
  });

  document.querySelectorAll('[data-hist-id]').forEach((el) => {
    el.addEventListener('click', () => {
      const version = sorted.find((h) => h.id === el.dataset.histId);
      const current = state.getDocument(documentId);
      const diffContainer = document.getElementById('hist-diff-container');
      const d = diffLines(version.content, current.content);
      diffContainer.innerHTML = `<div style="max-height:260px; overflow-y:auto; font-family:var(--font-mono); font-size:12px; background:var(--bg-void); border-radius:var(--radius-md); padding:var(--sp-3);">
        ${d.map((l) => `<div class="diff-line ${l.type}">${l.type === 'added' ? '+ ' : l.type === 'removed' ? '- ' : '  '}${escapeHtml(l.text)}</div>`).join('')}
      </div>
      <button class="btn btn-sm btn-primary" style="margin-top:var(--sp-2);" id="hist-restore">${icon('history')} Restaurar esta versión</button>`;
      document.getElementById('hist-restore').addEventListener('click', async () => {
        await state.updateDocument(documentId, { content: version.content });
        toast('Versión restaurada', 'success');
        router.render();
      });
    });
  });
}

  router.openTab({ type: 'document', refId: doc.id, title: doc.title });

/* ============================================================
   modules/importExport.js
   ============================================================ */
/**
 * importExport.js — Todo lo relacionado con entrada/salida de datos:
 *  - Importar archivos/carpetas Markdown (drag&drop, selector, pegar texto)
 *    con reconocimiento automático de tipo de documento.
 *  - Fusión inteligente cuando ya existe un documento con ese nombre/tipo.
 *  - Exportación completa del proyecto (Markdown suelto, ZIP, JSON) y
 *    copias de seguridad.
 *  - Vista de "Exportaciones" y vista de "Papelera".
 */

// ---------------------------------------------------------------
// Reconocimiento automático de tipo por nombre de archivo
// ---------------------------------------------------------------
const TYPE_PATTERNS = [
  { type: 'chapter', re: /(cap[ií]tulo|chapter|cap)[\s_-]*0*(\d+)/i, hasNumber: true },
  { type: 'bible', re: /(biblia|bible)/i },
  { type: 'timeline', re: /(cronolog[ií]a|timeline)/i },
  { type: 'continuity', re: /(continuidad|continuity)/i },
  { type: 'note', re: /(nota|note)/i },
];

function detectType(filename, content) {
  for (const p of TYPE_PATTERNS) {
    const m = filename.match(p.re) || content.slice(0, 200).match(p.re);
    if (m) return { type: p.type, chapterNumber: p.hasNumber ? parseInt(m[2], 10) : null };
  }
  return { type: 'note', chapterNumber: null };
}

function titleFromFilename(filename) {
  return filename.replace(/\.md$/i, '').replace(/[_-]+/g, ' ').trim();
}

// ---------------------------------------------------------------
// Manejo de archivos soltados / seleccionados
// ---------------------------------------------------------------
async function handleDroppedFiles(fileList) {
  const files = Array.from(fileList).filter((f) => f.name.endsWith('.md') || f.type === 'text/markdown' || f.type === 'text/plain');
  if (!files.length) { toast('No se han encontrado archivos Markdown en lo soltado', 'warning'); return; }
  for (const file of files) {
    const content = await file.text();
    await importSingleMarkdown(file.name, content);
  }
}

async function importSingleMarkdown(filename, content) {
  const { type, chapterNumber } = detectType(filename, content);
  const title = chapterNumber ? `Capítulo ${chapterNumber}` : titleFromFilename(filename);

  // Buscar posible duplicado (mismo tipo + mismo título, o mismo número de capítulo)
  const existing = type === 'chapter'
    ? state.getChapters().find((c) => c.chapterNumber === chapterNumber)
    : state.getDocuments(type).find((d) => d.title.toLowerCase() === title.toLowerCase());

  if (existing && existing.content && existing.content.trim() && existing.content.trim() !== content.trim()) {
    openMergeModal(existing, content, title);
    return;
  }

  if (existing) {
    await state.updateDocument(existing.id, { content, title });
    toast(`"${title}" actualizado`, 'success');
  } else {
    const doc = await state.createDocument({ type, title, content, chapterNumber });
    if (type === 'chapter') await state.setChapterStatus(doc.id, 'draft'); // un capítulo importado con contenido ya es un borrador
    toast(`"${title}" importado correctamente`, 'success');
  }
  bus.emit('import:completed', { type, title });
}

// ---------------------------------------------------------------
// Fusión inteligente
// ---------------------------------------------------------------
function openMergeModal(existing, newContent, title) {
  const d = diffLines(existing.content, newContent);
  const added = d.filter((l) => l.type === 'added').length;
  const removed = d.filter((l) => l.type === 'removed').length;

  const { close } = openModal({
    title: `Ya existe "${title}" — fusión inteligente`,
    size: 'modal-lg',
    bodyHtml: `
      <p class="text-secondary" style="font-size:var(--text-sm); margin-bottom:var(--sp-3);">
        Se han detectado cambios: <strong style="color:var(--success)">+${added} líneas</strong> · <strong style="color:var(--danger)">-${removed} líneas</strong>.
      </p>
      <div class="diff-view" style="height:320px; border:1px solid var(--border); border-radius:var(--radius-md);">
        <div class="diff-pane">${d.map((l) => `<div class="diff-line ${l.type}">${l.type === 'added' ? '+ ' : l.type === 'removed' ? '- ' : '  '}${escapeHtml(l.text)}</div>`).join('')}</div>
      </div>
    `,
    footerButtons: [
      { label: 'Mantener versión antigua', className: 'btn-ghost', onClick: () => toast('Se ha mantenido la versión existente', 'default') },
      { label: 'Fusionar manualmente', className: 'btn-ghost', onClick: () => { router.openTab({ type: 'document', refId: existing.id, title: existing.title }); toast('Edita el documento manualmente para combinar ambas versiones', 'default'); } },
      { label: 'Fusionar automáticamente', className: 'btn', onClick: async () => {
        const merged = autoMerge(existing.content, newContent);
        await state.updateDocument(existing.id, { content: merged });
        toast('Fusión automática aplicada — revísala en el editor', 'success');
      } },
      { label: 'Aceptar nueva versión', className: 'btn-primary', onClick: async () => {
        await state.updateDocument(existing.id, { content: newContent, title });
        toast('Documento reemplazado por la nueva versión', 'success');
      } },
    ],
  });
}

/** Fusión automática ingenua: nueva versión + apéndice con párrafos antiguos que ya no aparecen. */
function autoMerge(oldContent, newContent) {
  const oldParas = oldContent.split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
  const newParas = new Set(newContent.split(/\n{2,}/).map((p) => p.trim()));
  const lost = oldParas.filter((p) => !newParas.has(p));
  if (!lost.length) return newContent;
  return `${newContent}\n\n---\n## ⚠️ Contenido de la versión anterior no presente en la nueva (revisar)\n\n${lost.join('\n\n')}`;
}

// ---------------------------------------------------------------
// Exportación
// ---------------------------------------------------------------
function allExportableDocs() {
  return [
    ...state.documents.map((d) => ({ name: fileNameFor(d), content: d.content || '' })),
    ...state.characters.map((c) => ({ name: `Personajes/${safe(c.name)}.md`, content: entityToMarkdown(c) })),
    ...state.places.map((c) => ({ name: `Lugares/${safe(c.name)}.md`, content: entityToMarkdown(c) })),
    ...state.objects.map((c) => ({ name: `Objetos/${safe(c.name)}.md`, content: entityToMarkdown(c) })),
    ...state.mysteries.map((c) => ({ name: `Misterios/${safe(c.title)}.md`, content: entityToMarkdown(c) })),
  ];
}
function fileNameFor(d) {
  const folder = { chapter: 'Capitulos', bible: 'Biblia', timeline: 'Cronologia', continuity: 'Continuidad', note: 'Notas' }[d.type] || 'Otros';
  return `${folder}/${safe(d.title)}.md`;
}
function safe(str) { return (str || 'sin-titulo').replace(/[\\/:*?"<>|]/g, '-'); }
function entityToMarkdown(e) {
  return Object.entries(e).filter(([k]) => !['id', 'createdAt', 'updatedAt'].includes(k))
    .map(([k, v]) => `**${k}**: ${Array.isArray(v) ? v.join(', ') : v}`).join('\n');
}

async function exportMarkdownZip() {
  const zip = new ZipWriter();
  allExportableDocs().forEach((f) => zip.addFile(f.name, f.content));
  downloadBlob(zip.build(), `${safe(state.project?.title || 'novela')}-markdown.zip`);
  toast('Exportación Markdown (.zip) descargada', 'success');
}

async function exportJson() {
  const dump = await db.exportAll();
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `${safe(state.project?.title || 'novela')}-proyecto.json`);
  toast('Proyecto exportado como JSON', 'success');
}

async function exportChaptersOnly() {
  const zip = new ZipWriter();
  state.getChapters().forEach((c) => zip.addFile(`${safe(c.title)}.md`, c.content || ''));
  downloadBlob(zip.build(), `${safe(state.project?.title || 'novela')}-capitulos.zip`);
  toast('Capítulos exportados', 'success');
}

async function exportDocsOnly() {
  const zip = new ZipWriter();
  state.documents.filter((d) => d.type !== 'chapter').forEach((d) => zip.addFile(fileNameFor(d).split('/').pop(), d.content || ''));
  downloadBlob(zip.build(), `${safe(state.project?.title || 'novela')}-documentacion.zip`);
  toast('Documentación exportada', 'success');
}

async function createBackup() {
  const dump = await db.exportAll();
  const backup = { id: uid('backup'), timestamp: new Date().toISOString(), data: dump };
  await db.put('backups', backup);
  toast('Copia de seguridad creada', 'success');
  bus.emit('backup:created');
}

// Vista: Exportaciones
// ---------------------------------------------------------------
function renderExports(container) {
  container.innerHTML = `
    <div class="section-header"><div><h2>Exportaciones</h2><div class="subtitle">Descarga tu proyecto en distintos formatos</div></div></div>
    <div class="view-scroll">
      <div class="entity-grid">
        <div class="entity-card" id="exp-md"><h4>${icon('export')} Markdown (.zip)</h4><p>Todos los documentos organizados en carpetas, listos para abrir en cualquier editor.</p></div>
        <div class="entity-card" id="exp-chapters"><h4>${icon('book')} Solo capítulos</h4><p>Únicamente los archivos de capítulos, en un .zip.</p></div>
        <div class="entity-card" id="exp-docs"><h4>${icon('shield')} Solo documentación</h4><p>Biblia, cronología, continuidad y notas — sin capítulos.</p></div>
        <div class="entity-card" id="exp-json"><h4>${icon('file')} Proyecto completo (.json)</h4><p>Volcado íntegro de la base de datos, para importar de nuevo o migrar de equipo.</p></div>
        <div class="entity-card" id="exp-backup"><h4>${icon('history')} Crear copia de seguridad</h4><p>Guarda un snapshot interno recuperable desde Ajustes.</p></div>
        <div class="entity-card" id="exp-import"><h4>${icon('plus')} Importar proyecto (.json)</h4><p>Restaura un proyecto exportado previamente.</p></div>
      </div>
      <input type="file" id="import-json-input" accept="application/json" style="display:none;" />
    </div>
  `;
  container.querySelector('#exp-md').addEventListener('click', exportMarkdownZip);
  container.querySelector('#exp-chapters').addEventListener('click', exportChaptersOnly);
  container.querySelector('#exp-docs').addEventListener('click', exportDocsOnly);
  container.querySelector('#exp-json').addEventListener('click', exportJson);
  container.querySelector('#exp-backup').addEventListener('click', createBackup);
  container.querySelector('#exp-import').addEventListener('click', () => container.querySelector('#import-json-input').click());
  container.querySelector('#import-json-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const ok = await confirmDialog({ title: 'Importar proyecto', message: 'Esto reemplazará TODOS los datos actuales por los del archivo importado. ¿Continuar?' });
    if (!ok) return;
    const text = await file.text();
    try {
      const dump = JSON.parse(text);
      await db.importAll(dump, { merge: false });
      await state.load();
      toast('Proyecto importado correctamente', 'success');
      bus.emit('state:loaded', state);
      router.render();
    } catch (err) {
      toast('El archivo no es un proyecto JSON válido', 'danger');
    }
  });
}

// Vista: Papelera
// ---------------------------------------------------------------
async function renderTrash(container) {
  const items = (await db.getAll('trash')).sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt));
  container.innerHTML = `
    <div class="section-header"><div><h2>Papelera</h2><div class="subtitle">${items.length} elementos eliminados</div></div></div>
    <div class="view-scroll">
      ${items.length ? `<div class="mini-list">
        ${items.map((it) => `
          <div class="mini-list-item" style="padding:var(--sp-3) 4px;">
            <span class="mli-title">${it.data.title || it.data.name || 'Elemento sin título'} <span class="text-muted mono" style="font-size:10px;">(${it.originalStore})</span></span>
            <span class="mli-meta">${timeAgo(it.deletedAt)}</span>
            <button class="btn btn-sm" data-restore="${it.id}" style="margin-left:var(--sp-2);">Restaurar</button>
          </div>
        `).join('')}
      </div>` : `<div class="empty-state">${icon('trash')}<h4>La papelera está vacía</h4></div>`}
    </div>
  `;
  container.querySelectorAll('[data-restore]').forEach((btn) => {

      await state.load();
      toast('Elemento restaurado', 'success');
      router.render();
    });
  });
}

registerView('exports', { render: renderExports });

/* ============================================================
   modules/explorer.js
   ============================================================ */
/**
 * explorer.js — Árbol lateral de navegación (estilo VS Code).
 * Agrupa: Biblia, Capítulos, Personajes, Lugares, Objetos, Cronología,
 * Continuidad, Misterios, Prompts, Conversaciones, Tareas, Exportaciones,
 * Papelera. Doble clic abre; clic derecho da opciones rápidas.
 */

const STATUS_COLORS = {
  pending: 'var(--text-muted)', preparation: 'var(--info)', draft: 'var(--warning)',
  review: '#b482dc', rewrite: 'var(--danger)', final: 'var(--success)', published: 'var(--accent)',
};

let collapsedGroups = new Set();

function group(title, iconName, items, opts = {}) {
  const isCollapsed = collapsedGroups.has(title);
  return `
    <div class="tree-node">
      <div class="tree-row ${isCollapsed ? 'collapsed' : ''}" data-group="${title}">
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        ${icon(iconName, 'tree-icon')}
        <span class="tree-label">${title}</span>
        <span class="tree-count">${items.length}</span>
        ${opts.addable ? `<button class="btn btn-icon btn-ghost" style="width:18px;height:18px;" data-add-to="${opts.addKind}" data-tip="Nuevo">${icon('plus')}</button>` : ''}
      </div>
      <div class="tree-children ${isCollapsed ? 'collapsed' : ''}">
        ${items.length ? items.join('') : '<div class="tree-row text-muted" style="cursor:default;">Vacío</div>'}
      </div>
    </div>
  `;
}

function docRow(doc, extraLabel = '') {
  return `<div class="tree-row" data-open-doc="${doc.id}">
    ${doc.type === 'chapter' ? `<span class="tree-status-dot" style="background:${STATUS_COLORS[doc.status]}"></span>` : icon('file', 'tree-icon')}
    <span class="tree-label">${doc.title}${extraLabel}</span>
  </div>`;
}

function entityRow(entity, kind) {
  return `<div class="tree-row" data-open-entity="${kind}:${entity.id}">
    ${icon(kind === 'character' ? 'users' : kind === 'place' ? 'map' : kind === 'object' ? 'box' : 'target', 'tree-icon')}
    <span class="tree-label">${entity.name || entity.title}</span>
  </div>`;
}

function renderExplorer(container) {
  const chapters = state.getChapters();
  const bible = state.getDocuments('bible');
  const timeline = state.getDocuments('timeline');
  const continuity = state.getDocuments('continuity');
  const notes = state.getDocuments('note');

  container.innerHTML = `
    <div class="sidebar-header">
      <span>Explorador</span>
      <button class="btn btn-icon btn-ghost" id="explorer-collapse-all" data-tip="Colapsar todo">${icon('panelLeft')}</button>
    </div>
    <div class="tree" id="tree-root">
      ${group('Biblia', 'book', bible.map((d) => docRow(d)), { addable: true, addKind: 'bible' })}
      ${group('Capítulos', 'file', chapters.map((c) => docRow(c, ` <span class="mono" style="color:var(--text-muted);font-size:10px;">#${c.chapterNumber}</span>`)), { addable: true, addKind: 'chapter' })}
      ${group('Personajes', 'users', state.characters.map((e) => entityRow(e, 'character')), { addable: true, addKind: 'character' })}
      ${group('Lugares', 'map', state.places.map((e) => entityRow(e, 'place')), { addable: true, addKind: 'place' })}
      ${group('Objetos', 'box', state.objects.map((e) => entityRow(e, 'object')), { addable: true, addKind: 'object' })}
      ${group('Cronología', 'timeline', timeline.map((d) => docRow(d)), { addable: true, addKind: 'timeline' })}
      ${group('Continuidad', 'shield', continuity.map((d) => docRow(d)), { addable: true, addKind: 'continuity' })}
      ${group('Misterios', 'target', state.mysteries.map((e) => entityRow(e, 'mystery')), { addable: true, addKind: 'mystery' })}
      ${group('Notas', 'edit', notes.map((d) => docRow(d)), { addable: true, addKind: 'note' })}
      ${group('Prompts', 'message', [`<div class="tree-row" data-open-view="prompts">${icon('message', 'tree-icon')}<span class="tree-label">Biblioteca de prompts</span></div>`])}
      ${group('Conversaciones', 'message', [`<div class="tree-row" data-open-view="conversations">${icon('message', 'tree-icon')}<span class="tree-label">Registro de conversaciones</span></div>`])}
      ${group('Tareas', 'kanban', [`<div class="tree-row" data-open-view="tasks">${icon('kanban', 'tree-icon')}<span class="tree-label">Panel Kanban</span></div>`])}
      ${group('Exportaciones', 'export', [`<div class="tree-row" data-open-view="exports">${icon('export', 'tree-icon')}<span class="tree-label">Exportar proyecto</span></div>`])}
      ${group('Papelera', 'trash', [`<div class="tree-row" data-open-view="trash">${icon('trash', 'tree-icon')}<span class="tree-label">Elementos eliminados</span></div>`])}
    </div>
    <div id="explorer-dropzone" style="display:none; position:absolute; inset:0; background:var(--accent-soft); border:2px dashed var(--accent); align-items:center; justify-content:center; z-index:20; font-size:var(--text-sm); color:var(--accent);">
      Suelta archivos Markdown para importarlos
    </div>
  `;

  container.querySelectorAll('[data-group]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-add-to]')) return;
      const title = el.dataset.group;
      if (collapsedGroups.has(title)) collapsedGroups.delete(title); else collapsedGroups.add(title);
      renderExplorer(container);
    });
  });

  container.querySelectorAll('[data-open-doc]').forEach((el) => {
    el.addEventListener('click', (e) => { e.stopPropagation(); bus.emit('explorer:open-document', el.dataset.openDoc); });
  });
  container.querySelectorAll('[data-open-entity]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const [kind, id] = el.dataset.openEntity.split(':');
      bus.emit('explorer:open-entity', { kind, id });
    });
  });
  container.querySelectorAll('[data-open-view]').forEach((el) => {
    el.addEventListener('click', (e) => { e.stopPropagation(); bus.emit('explorer:open-view', el.dataset.openView); });
  });
  container.querySelectorAll('[data-add-to]').forEach((el) => {
    el.addEventListener('click', (e) => { e.stopPropagation(); bus.emit('explorer:create', el.dataset.addTo); });
  });

  // Drag & drop de archivos Markdown sobre todo el explorador
  const dz = container.querySelector('#explorer-dropzone');
  container.style.position = 'relative';
  ['dragenter', 'dragover'].forEach((evt) => container.addEventListener(evt, (e) => { e.preventDefault(); dz.style.display = 'flex'; }));
  ['dragleave', 'drop'].forEach((evt) => container.addEventListener(evt, (e) => { e.preventDefault(); if (evt === 'drop' || !container.contains(e.relatedTarget)) dz.style.display = 'none'; }));
  container.addEventListener('drop', (e) => {
    e.preventDefault();
    handleDroppedFiles(e.dataTransfer.files);
  });
}

// Refrescar el explorador cuando cambie cualquier colección relevante
['document:created', 'document:updated', 'document:deleted', 'character:created', 'character:updated', 'character:deleted',
  'place:created', 'place:updated', 'place:deleted', 'object:created', 'object:updated', 'object:deleted',
  'mystery:created', 'mystery:updated', 'mystery:deleted', 'state:loaded'].forEach((evt) => {
  bus.on(evt, () => {
    const el = document.getElementById('sidebar');
    if (el) renderExplorer(el);
  });
});

/**
 * prompts.js — Biblioteca de prompts del proyecto. Todos los prompts
 * (por defecto + personalizados) viven aquí, con categoría, etiquetas,
 * copiar/editar/duplicar/favoritos y buscador propio.
 */

let activeCategory = 'Todas';
let query = '';

function categories() {
  return ['Todas', ...new Set(state.prompts.map((p) => p.category))];
}

function renderPrompts(container) {
  container.innerHTML = `
    <div class="section-header">
      <div><h2>Biblioteca de prompts</h2><div class="subtitle">${state.prompts.length} prompts disponibles</div></div>
      <button class="btn btn-primary" id="prompt-new-btn">${icon('plus')} Nuevo prompt</button>
    </div>
    <div class="view-scroll">
      <div class="prompts-toolbar">
        <input type="search" id="prompt-search" placeholder="Buscar prompts por título, etiqueta o contenido…" value="${query}" />
      </div>
      <div class="category-filter" id="prompt-categories" style="margin-bottom:var(--sp-4);">
        ${categories().map((c) => `<span class="chip ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c}</span>`).join('')}
      </div>
      <div class="prompt-grid" id="prompt-grid"></div>
    </div>
  `;

  renderGrid(container);

  container.querySelector('#prompt-search').addEventListener('input', (e) => { query = e.target.value.toLowerCase(); renderGrid(container); });
  container.querySelectorAll('[data-cat]').forEach((el) => {
    el.addEventListener('click', () => { activeCategory = el.dataset.cat; renderPrompts(container); });
  });
  container.querySelector('#prompt-new-btn').addEventListener('click', () => openPromptEditor());
}

function renderGrid(container) {
  const grid = container.querySelector('#prompt-grid');
  let list = state.prompts;
  if (activeCategory !== 'Todas') list = list.filter((p) => p.category === activeCategory);
  if (query) {
    list = list.filter((p) => `${p.title} ${p.description} ${(p.tags || []).join(' ')} ${p.content}`.toLowerCase().includes(query));
  }
  list = [...list].sort((a, b) => (b.favorite - a.favorite) || (b.usageCount || 0) - (a.usageCount || 0));

  grid.innerHTML = list.length ? list.map((p) => `
    <div class="prompt-card">
      <div class="prompt-card-head">
        <h4>${p.title}</h4>
        <button class="btn btn-icon btn-ghost fav-btn ${p.favorite ? 'active' : ''}" data-fav="${p.id}">${icon('star')}</button>
      </div>
      <p class="desc">${p.description || ''}</p>
      <div class="tags">
        <span class="chip">${p.category}</span>
        ${(p.tags || []).slice(0, 3).map((t) => `<span class="chip">${t}</span>`).join('')}
      </div>
      <div class="prompt-card-actions">
        <button class="btn btn-sm" data-copy="${p.id}">${icon('copy')} Copiar</button>
        <button class="btn btn-sm btn-ghost" data-edit="${p.id}">${icon('edit')} Editar</button>
        <button class="btn btn-sm btn-ghost btn-icon" data-dup="${p.id}" data-tip="Duplicar">${icon('layers')}</button>
      </div>
    </div>
  `).join('') : `<div class="empty-state">${icon('message')}<h4>Sin resultados</h4><p>Prueba con otra búsqueda o categoría.</p></div>`;

  grid.querySelectorAll('[data-copy]').forEach((el) => el.addEventListener('click', () => copyPrompt(el.dataset.copy)));
  grid.querySelectorAll('[data-fav]').forEach((el) => el.addEventListener('click', async () => { await state.toggleFavoritePrompt(el.dataset.fav); renderGrid(container); }));
  grid.querySelectorAll('[data-edit]').forEach((el) => el.addEventListener('click', () => openPromptEditor(state.prompts.find((p) => p.id === el.dataset.edit))));
  grid.querySelectorAll('[data-dup]').forEach((el) => el.addEventListener('click', async () => {
    const orig = state.prompts.find((p) => p.id === el.dataset.dup);
    await state.savePrompt({ ...orig, id: undefined, title: orig.title + ' (copia)', usageCount: 0, favorite: false, slug: undefined });
    toast('Prompt duplicado', 'success');
    renderGrid(container);
  }));
}

async function copyPrompt(id) {
  const p = state.prompts.find((x) => x.id === id);
  if (!p) return;
  try { await navigator.clipboard.writeText(p.content); }
  catch { const ta = document.createElement('textarea'); ta.value = p.content; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  await state.registerPromptUsage(id);
  toast('Prompt copiado al portapapeles', 'success');
}

function openPromptEditor(prompt = null) {
  const isNew = !prompt;
  const { close } = openModal({
    title: isNew ? 'Nuevo prompt' : 'Editar prompt',
    size: 'modal-lg',
    bodyHtml: `
      <div class="field"><label>Título</label><input id="p-title" value="${escapeAttr(prompt?.title || '')}" /></div>
      <div class="field-row">
        <div class="field"><label>Categoría</label><input id="p-category" value="${escapeAttr(prompt?.category || 'General')}" /></div>
        <div class="field"><label>Etiquetas (separadas por coma)</label><input id="p-tags" value="${escapeAttr((prompt?.tags || []).join(', '))}" /></div>
      </div>
      <div class="field"><label>Descripción</label><input id="p-desc" value="${escapeAttr(prompt?.description || '')}" /></div>
      <div class="field"><label>Contenido del prompt</label><textarea id="p-content" rows="10" style="font-family:var(--font-mono); font-size:13px;">${escapeHtml(prompt?.content || '')}</textarea></div>
    `,
    footerButtons: [
      { label: 'Cancelar', className: 'btn-ghost' },
      ...(isNew ? [] : [{ label: 'Eliminar', className: 'btn-danger', onClick: async () => {
        const ok = await confirmDialog({ title: 'Eliminar prompt', message: `¿Seguro que quieres eliminar "${prompt.title}"? Esta acción no se puede deshacer.` });
        if (ok) { await state.deletePrompt(prompt.id); toast('Prompt eliminado', 'default'); router.render(); }
      } }]),
      { label: isNew ? 'Crear' : 'Guardar', className: 'btn-primary', onClick: async () => {
        const data = {
          id: prompt?.id,
          title: document.getElementById('p-title').value || 'Sin título',
          category: document.getElementById('p-category').value || 'General',
          tags: document.getElementById('p-tags').value.split(',').map((t) => t.trim()).filter(Boolean),
          description: document.getElementById('p-desc').value,
          content: document.getElementById('p-content').value,
        };
        await state.savePrompt(data);
        toast(isNew ? 'Prompt creado' : 'Prompt actualizado', 'success');
        router.render();
      } },
    ],
  });
}

registerView('prompts', { render: renderPrompts });

/**

  container.innerHTML = `
    <div class="section-header">

      <button class="btn btn-primary" id="conv-new">${icon('plus')} Registrar conversación</button>

          <div class="mini-list-item" data-open="${c.id}" style="cursor:pointer; align-items:flex-start; padding:var(--sp-3) 4px;">
            <div style="flex:1;">
              <div class="mli-title" style="font-weight:600;">${c.objective || 'Sin objetivo'}</div>
              <div class="text-muted" style="font-size:var(--text-xs); margin-top:2px;">${c.model || 'Modelo no especificado'} · ${formatDateTime(c.date)}</div>

        `).join('')}
      </div>` : `<div class="empty-state">${icon('message')}<h4>Sin conversaciones registradas</h4><p>Cada vez que copies un prompt del Workflow Assistant, considera registrar aquí el resultado para tener memoria completa del proyecto.</p></div>`}
    </div>
  `;

  container.querySelector('#conv-new').addEventListener('click', () => openConvEditor());
  container.querySelectorAll('[data-open]').forEach((el) => {
    el.addEventListener('click', () => openConvEditor(list.find((c) => c.id === el.dataset.open)));
  });
}

function statusClass(status) {
  return { 'completada': 'final', 'en curso': 'draft', 'descartada': 'pending' }[status] || 'pending';
}

function openConvEditor(conv = null) {
  const isNew = !conv;
  openModal({
    title: isNew ? 'Registrar conversación' : 'Editar conversación',
    size: 'modal-lg',
    bodyHtml: `
      <div class="field-row">
        <div class="field"><label>Objetivo</label><input id="c-objective" value="${escapeAttr(conv?.objective || '')}" placeholder="Escribir el Capítulo 14" /></div>
        <div class="field"><label>Modelo</label><input id="c-model" value="${escapeAttr(conv?.model || 'Claude')}" /></div>
      </div>
      <div class="field"><label>Prompt utilizado</label><textarea id="c-prompt" rows="4">${escapeHtml(conv?.promptUsed || '')}</textarea></div>
      <div class="field"><label>Resultado / resumen</label><textarea id="c-result" rows="4">${escapeHtml(conv?.result || '')}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Documentos utilizados</label><input id="c-docs" value="${escapeAttr((conv?.documentsUsed || []).join(', '))}" placeholder="Continuidad, Personajes…" /></div>
        <div class="field"><label>Estado</label>
          <select id="c-status">
            <option ${conv?.status === 'completada' || !conv ? 'selected' : ''}>completada</option>
            <option ${conv?.status === 'en curso' ? 'selected' : ''}>en curso</option>
            <option ${conv?.status === 'descartada' ? 'selected' : ''}>descartada</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Notas</label><textarea id="c-notes" rows="2">${escapeHtml(conv?.notes || '')}</textarea></div>
    `,
    footerButtons: [
      { label: 'Cancelar', className: 'btn-ghost' },
      ...(isNew ? [] : [{ label: 'Eliminar', className: 'btn-danger', onClick: async () => {
        const ok = await confirmDialog({ title: 'Eliminar conversación', message: '¿Seguro que quieres eliminarla?' });
        if (ok) { state.conversations = state.conversations.filter((c) => c.id !== conv.id); await db.delete('conversations', conv.id); router.render(); }
      } }]),
      { label: isNew ? 'Guardar' : 'Actualizar', className: 'btn-primary', onClick: async () => {
        const data = {
          objective: document.getElementById('c-objective').value,
          model: document.getElementById('c-model').value,
          promptUsed: document.getElementById('c-prompt').value,
          result: document.getElementById('c-result').value,
          documentsUsed: document.getElementById('c-docs').value.split(',').map((s) => s.trim()).filter(Boolean),
          status: document.getElementById('c-status').value,
          notes: document.getElementById('c-notes').value,
        };
        if (isNew) { await state.logConversation(data); toast('Conversación registrada', 'success'); }
        else { Object.assign(conv, data); await db.put('conversations', conv); toast('Conversación actualizada', 'success'); }
        router.render();
      } },
    ],
  });
}

registerView('conversations', { render: renderConversations });


/* ============================================================
   modules/tasks.js
   ============================================================ */
/**
 * tasks.js — Panel Kanban (Pendiente / En progreso / Bloqueado / Completado).
 * Las tareas pueden crearse manualmente o automáticamente desde el
 * Workflow Assistant (por ejemplo, al completar una auditoría se puede
 * generar una tarea "Revisar hallazgos de la auditoría").
 */

const COLUMNS = [
  { key: 'pending', label: 'Pendiente' },
  { key: 'inprogress', label: 'En progreso' },
  { key: 'blocked', label: 'Bloqueado' },
  { key: 'done', label: 'Completado' },
];

let draggedId = null;

function renderTasks(container) {
  container.innerHTML = `
    <div class="section-header">
      <div><h2>Tareas</h2><div class="subtitle">${state.tasks.length} tareas en el proyecto</div></div>
      <button class="btn btn-primary" id="task-new">${icon('plus')} Nueva tarea</button>
    </div>
    <div class="kanban" id="kanban-root">
      ${COLUMNS.map((col) => `
        <div class="kanban-col" data-col="${col.key}">
          <div class="kanban-col-header"><span>${col.label}</span><span class="text-muted mono">${state.tasks.filter((t) => t.status === col.key).length}</span></div>
          <div class="kanban-col-body" data-col-body="${col.key}"></div>
        </div>
      `).join('')}
    </div>
  `;

  container.querySelector('#task-new').addEventListener('click', () => openTaskEditor());
  renderCards(container);
  setupDnD(container);
}

function renderCards(container) {
  COLUMNS.forEach((col) => {
    const body = container.querySelector(`[data-col-body="${col.key}"]`);
    const tasks = state.tasks.filter((t) => t.status === col.key);
    body.innerHTML = tasks.map((t) => `
      <div class="kanban-card" draggable="true" data-task="${t.id}">
        <div style="font-weight:500;">${t.title}</div>
        ${t.relatedDoc ? `<div class="text-muted" style="font-size:var(--text-xs); margin-top:4px;">${t.relatedDoc}</div>` : ''}
      </div>
    `).join('');
    body.querySelectorAll('[data-task]').forEach((card) => {
      card.addEventListener('click', () => openTaskEditor(state.tasks.find((t) => t.id === card.dataset.task)));
      card.addEventListener('dragstart', () => { draggedId = card.dataset.task; card.classList.add('dragging'); });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
    });
  });
}

function setupDnD(container) {
  container.querySelectorAll('.kanban-col').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      if (!draggedId) return;
      await state.updateTask(draggedId, { status: col.dataset.col });
      renderTasks(container);
    });
  });
}

function openTaskEditor(task = null) {
  const isNew = !task;
  openModal({
    title: isNew ? 'Nueva tarea' : 'Editar tarea',
    bodyHtml: `
      <div class="field"><label>Título</label><input id="t-title" value="${escapeAttr(task?.title || '')}" placeholder="Actualizar cronología" /></div>
      <div class="field"><label>Documento relacionado (opcional)</label><input id="t-doc" value="${escapeAttr(task?.relatedDoc || '')}" /></div>
      <div class="field"><label>Estado</label>
        <select id="t-status">${COLUMNS.map((c) => `<option value="${c.key}" ${task?.status === c.key ? 'selected' : ''}>${c.label}</option>`).join('')}</select>
      </div>
    `,
    footerButtons: [
      { label: 'Cancelar', className: 'btn-ghost' },
      ...(isNew ? [] : [{ label: 'Eliminar', className: 'btn-danger', onClick: async () => { await state.deleteTask(task.id); router.render(); } }]),
      { label: isNew ? 'Crear' : 'Guardar', className: 'btn-primary', onClick: async () => {
        const data = { title: document.getElementById('t-title').value || 'Sin título', relatedDoc: document.getElementById('t-doc').value, status: document.getElementById('t-status').value };
        if (isNew) await state.createTask(data); else await state.updateTask(task.id, data);
        toast(isNew ? 'Tarea creada' : 'Tarea actualizada', 'success');
        router.render();
      } },
    ],
  });
}

registerView('tasks', { render: renderTasks });

   modules/search.js
   ============================================================ */
/**
 * search.js — Buscador global tipo "command palette" (Ctrl+K / Ctrl+P).
 * Indexa en caliente todas las colecciones en memoria (ya cacheadas en
 * `state`), sin necesidad de un índice invertido persistente: el volumen
 * de datos de una novela cabe de sobra en memoria.
 */

function buildIndex() {
  const items = [];
  state.documents.forEach((d) => items.push({ kind: d.type, iconName: d.type === 'chapter' ? 'file' : 'book', title: d.title, sub: d.type, text: `${d.title} ${d.content || ''}`, open: () => bus.emit('explorer:open-document', d.id) }));
  state.characters.forEach((e) => items.push({ kind: 'character', iconName: 'users', title: e.name, sub: 'Personaje', text: `${e.name} ${e.description || ''}`, open: () => bus.emit('explorer:open-entity', { kind: 'character', id: e.id }) }));
  state.places.forEach((e) => items.push({ kind: 'place', iconName: 'map', title: e.name, sub: 'Lugar', text: `${e.name} ${e.description || ''}`, open: () => bus.emit('explorer:open-entity', { kind: 'place', id: e.id }) }));
  state.objects.forEach((e) => items.push({ kind: 'object', iconName: 'box', title: e.name, sub: 'Objeto', text: `${e.name} ${e.description || ''}`, open: () => bus.emit('explorer:open-entity', { kind: 'object', id: e.id }) }));
  state.mysteries.forEach((e) => items.push({ kind: 'mystery', iconName: 'target', title: e.title, sub: 'Misterio', text: `${e.title} ${e.description || ''}`, open: () => bus.emit('explorer:open-entity', { kind: 'mystery', id: e.id }) }));
  state.prompts.forEach((p) => items.push({ kind: 'prompt', iconName: 'message', title: p.title, sub: 'Prompt · ' + p.category, text: `${p.title} ${p.description} ${p.content}`, open: () => router.openTab({ type: 'prompts', title: 'Biblioteca de prompts' }) }));
  state.conversations.forEach((c) => items.push({ kind: 'conversation', iconName: 'message', title: c.objective || 'Conversación', sub: 'Conversación', text: `${c.objective} ${c.result}`, open: () => router.openTab({ type: 'conversations', title: 'Conversaciones' }) }));
  items.push({ kind: 'view', iconName: 'dashboard', title: 'Dashboard', sub: 'Ir a', text: 'dashboard inicio panel', open: () => router.openTab({ type: 'dashboard', title: 'Dashboard', closable: false }) });
  items.push({ kind: 'view', iconName: 'kanban', title: 'Tareas', sub: 'Ir a', text: 'tareas kanban', open: () => router.openTab({ type: 'tasks', title: 'Tareas' }) });
  items.push({ kind: 'view', iconName: 'shield', title: 'Continuidad', sub: 'Ir a', text: 'continuidad auditoria', open: () => router.openTab({ type: 'continuity', title: 'Continuidad' }) });
  return items;
}

let selectedIdx = 0;

function openCommandPalette() {
  const backdrop = document.createElement('div');
  backdrop.className = 'cmdk-backdrop';
  backdrop.innerHTML = `
    <div class="cmdk">
      <div class="cmdk-input-row">${icon('search')}<input id="cmdk-input" placeholder="Buscar capítulos, personajes, lugares, prompts…" autocomplete="off" /></div>
      <div class="cmdk-results" id="cmdk-results"></div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const input = backdrop.querySelector('#cmdk-input');
  const results = backdrop.querySelector('#cmdk-results');
  const index = buildIndex();
  selectedIdx = 0;

  function close() { backdrop.remove(); }

  function paint(list) {
    results.innerHTML = list.length ? list.slice(0, 40).map((it, i) => `
      <div class="cmdk-item ${i === selectedIdx ? 'selected' : ''}" data-idx="${i}">
        ${icon(it.iconName)}<span class="cmdk-title">${it.title}</span><span class="cmdk-type">${it.sub}</span>
      </div>
    `).join('') : `<div class="cmdk-empty">Sin resultados</div>`;
    results.querySelectorAll('[data-idx]').forEach((el) => {
      el.addEventListener('click', () => { list[Number(el.dataset.idx)].open(); close(); });
    });
  }

  let filtered = index;
  paint(filtered);

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    filtered = q ? index.filter((it) => it.text.toLowerCase().includes(q)) : index;
    selectedIdx = 0;
    paint(filtered);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); selectedIdx = Math.min(selectedIdx + 1, filtered.length - 1); paint(filtered); }
    if (e.key === 'ArrowUp') { e.preventDefault(); selectedIdx = Math.max(selectedIdx - 1, 0); paint(filtered); }
    if (e.key === 'Enter' && filtered[selectedIdx]) { filtered[selectedIdx].open(); close(); }
    if (e.key === 'Escape') close();
  });

  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  setTimeout(() => input.focus(), 20);
}

/**
 * settings.js — Metadatos del proyecto (título, autor, género, objetivo
 * diario de palabras) e historial de copias de seguridad con opción de
 * restaurar cualquiera de ellas.
 */

async function renderSettings(container) {
  const backups = (await db.getAll('backups')).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  const p = state.project || {};

  container.innerHTML = `
    <div class="section-header"><div><h2>Ajustes</h2><div class="subtitle">Configuración del proyecto y copias de seguridad</div></div></div>
    <div class="view-scroll">
      <div class="card" style="margin-bottom:var(--sp-4); max-width:520px;">
        <div class="card-title">Proyecto</div>
        <div class="field"><label>Título de la novela</label><input id="s-title" value="${escapeAttr(p.title || '')}" /></div>
        <div class="field-row">
          <div class="field"><label>Autor</label><input id="s-author" value="${escapeAttr(p.author || '')}" /></div>
          <div class="field"><label>Género</label><input id="s-genre" value="${escapeAttr(p.genre || '')}" /></div>
        </div>
        <div class="field"><label>Objetivo diario de palabras</label><input id="s-goal" type="number" value="${p.dailyWordGoal || 1000}" /></div>
        <button class="btn btn-primary" id="s-save">${icon('save')} Guardar ajustes</button>
      </div>

      <div class="card" style="max-width:640px;">
        <div class="card-title">${icon('history', 'icon')} Copias de seguridad (${backups.length})</div>
        ${backups.length ? `<div class="mini-list">
          ${backups.slice(0, 15).map((b) => `
            <div class="mini-list-item" style="padding:var(--sp-2) 4px;">
              <span class="mli-title">${formatDateTime(b.timestamp)}</span>
              <button class="btn btn-sm" data-restore-backup="${b.id}">Restaurar</button>
            </div>
          `).join('')}
        </div>` : '<p class="text-muted" style="font-size:var(--text-sm);">Todavía no has creado ninguna copia de seguridad. Puedes crear una desde "Exportaciones".</p>'}
      </div>
    </div>
  `;

  container.querySelector('#s-save').addEventListener('click', async () => {
    await state.saveProject({
      title: document.getElementById('s-title').value,
      author: document.getElementById('s-author').value,
      genre: document.getElementById('s-genre').value,
      dailyWordGoal: parseInt(document.getElementById('s-goal').value, 10) || 1000,
    });
    toast('Ajustes guardados', 'success');
  });

  container.querySelectorAll('[data-restore-backup]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const ok = await confirmDialog({ title: 'Restaurar copia de seguridad', message: 'Se reemplazarán todos los datos actuales por los de esta copia. ¿Continuar?' });
      if (!ok) return;
      const backup = backups.find((b) => b.id === btn.dataset.restoreBackup);
      await db.importAll(backup.data, { merge: false });
      await state.load();
      toast('Copia de seguridad restaurada', 'success');
      router.render();
    });
  });
}

registerView('settings', { render: renderSettings });


/* ============================================================
   app.js
   ============================================================ */
/**
 * app.js — Punto de entrada de la aplicación.
 * Construye el layout de la shell (activity bar, topbar, sidebar,
 * panel derecho, statusbar), carga el estado desde IndexedDB, siembra
 * los prompts por defecto la primera vez, registra los atajos de
 * teclado globales y deja la app lista con el Dashboard abierto.
 */

// Importar módulos: cada uno se auto-registra en el router al importarse

const ACTIVITY_ITEMS = [
  { type: 'dashboard', iconName: 'dashboard', label: 'Dashboard', closable: false },
  { type: 'prompts', iconName: 'message', label: 'Prompts' },
  { type: 'conversations', iconName: 'message', label: 'Conversaciones' },
  { type: 'tasks', iconName: 'kanban', label: 'Tareas' },
  { type: 'continuity', iconName: 'shield', label: 'Continuidad' },
  { type: 'settings', iconName: 'settings', label: 'Ajustes' },
];

async function buildShell() {
  document.getElementById('app').innerHTML = `
    <div id="activity-bar">
      ${ACTIVITY_ITEMS.map((it) => `<button class="activity-btn" data-activity="${it.type}" data-tip="${it.label}">${icon(it.iconName)}</button>`).join('')}
      <div class="activity-spacer"></div>
      <button class="activity-btn" id="toggle-sidebar" data-tip="Alternar explorador">${icon('panelLeft')}</button>
      <button class="activity-btn" id="toggle-right" data-tip="Alternar panel derecho">${icon('panelRight')}</button>
    </div>

    <div id="topbar">
      <div class="brand">Novel<span class="brand-accent">IDE</span></div>
      <div id="global-search-trigger">${icon('search')}<span>Buscar en todo el proyecto…</span><kbd>Ctrl K</kbd></div>
      <div class="topbar-actions">
        <button class="btn btn-sm" id="topbar-paste-import">${icon('plus')} Importar Markdown</button>
      </div>
    </div>

    <div id="sidebar"></div>

    <div id="main">
      <div id="tabbar"></div>
      <div id="view-root"></div>
    </div>

    <div id="right-panel">
      <div id="right-panel-header">
        <h3>${icon('sparkle')} ¿Qué hago ahora?</h3>
      </div>
      <div id="right-panel-body">
        <div id="right-panel-body-workflow"></div>
      </div>
      <div class="quicknotes">
        <div class="quicknotes-header"><span>Notas rápidas</span></div>
        <textarea id="quicknotes-textarea" placeholder="Ideas sueltas, recordatorios, ganchos para el próximo capítulo…"></textarea>
      </div>
    </div>

    <div id="statusbar">
      <div class="status-item accent">${icon('book', 'icon')} <span id="status-project-title"></span></div>
      <div class="status-item" id="status-words"></div>
      <div class="status-item" id="status-chapters"></div>
      <div class="status-spacer"></div>
      <div class="status-item" id="status-saved">${icon('check', 'icon')} Guardado localmente en IndexedDB</div>
    </div>
  `;

  document.querySelectorAll('[data-activity]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const item = ACTIVITY_ITEMS.find((i) => i.type === btn.dataset.activity);
      router.openTab({ type: item.type, title: item.label, closable: item.closable !== false });
      document.querySelectorAll('[data-activity]').forEach((b) => b.classList.toggle('active', b === btn));
    });
  });

  document.getElementById('toggle-sidebar').addEventListener('click', () => document.getElementById('app').classList.toggle('sidebar-collapsed'));
  document.getElementById('toggle-right').addEventListener('click', () => document.getElementById('app').classList.toggle('right-collapsed'));
  document.getElementById('global-search-trigger').addEventListener('click', openCommandPalette);
  document.getElementById('topbar-paste-import').addEventListener('click', openPasteImportModal);

  const notesArea = document.getElementById('quicknotes-textarea');
  notesArea.value = state.project?.quickNotes || '';
  let notesTimer = null;
  notesArea.addEventListener('input', () => {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => state.saveProject({ quickNotes: notesArea.value }), 600);
  });
}

function updateStatusBar() {
  const s = state.stats();
  document.getElementById('status-project-title').textContent = state.project?.title || 'Sin título';
  document.getElementById('status-words').textContent = `${s.totalWords.toLocaleString('es-ES')} palabras`;
  document.getElementById('status-chapters').textContent = `${s.writtenChapters}/${s.totalChapters} capítulos`;
}

function setupKeyboardShortcuts() {
  document.addEventListener('keydown', (e) => {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && (e.key === 'k' || e.key === 'p')) { e.preventDefault(); openCommandPalette(); }
    if (ctrl && e.key === '/') { e.preventDefault(); document.getElementById('app').classList.toggle('sidebar-collapsed'); }
    if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); toast('El proyecto se guarda automáticamente al escribir', 'default'); }
  });
}

async function seedExampleContentIfEmpty() {
  // Si el proyecto está completamente vacío, no forzamos nada: el
  // Dashboard y el Workflow Assistant ya guían al usuario a crear la
  // biblia inicial como primer paso. No se generan capítulos de ejemplo
  // para no ensuciar un proyecto real.
}

const VIEW_TITLES = {
  characters: 'Personajes', places: 'Lugares', objects: 'Objetos', mysteries: 'Misterios',
  prompts: 'Biblioteca de prompts', conversations: 'Conversaciones', tasks: 'Tareas',
  exports: 'Exportaciones', trash: 'Papelera', continuity: 'Continuidad', settings: 'Ajustes',
};
bus.on('explorer:open-view', (view) => {
  if (VIEW_TITLES[view]) router.openTab({ type: view, title: VIEW_TITLES[view] });
});

bus.on('explorer:create', async (kind) => {
  if (['character', 'place', 'object', 'mystery'].includes(kind)) {
    bus.emit('explorer:open-view', kind === 'character' ? 'characters' : kind === 'place' ? 'places' : kind === 'object' ? 'objects' : 'mysteries');
    return;
  }
  const titles = { bible: 'Nueva Biblia', chapter: `Capítulo ${state.nextChapterNumber()}`, timeline: 'Nueva Cronología', continuity: 'Nueva Continuidad', note: 'Nueva nota' };
  const doc = await state.createDocument({ type: kind, title: titles[kind] || 'Nuevo documento', chapterNumber: kind === 'chapter' ? state.nextChapterNumber() : null });
  router.openTab({ type: 'document', refId: doc.id, title: doc.title });
});

async function main() {
  await db.open();
  await state.load();
  await state.ensureProject();
  await state.seedPromptsIfEmpty(DEFAULT_PROMPTS);
  await seedExampleContentIfEmpty();

  await buildShell();
  renderExplorer(document.getElementById('sidebar'));
  await renderWorkflowPanel(document.getElementById('right-panel-body-workflow'));
  updateStatusBar();
  setupKeyboardShortcuts();

  router.openTab({ type: 'dashboard', title: 'Dashboard', closable: false });
  document.querySelector('[data-activity="dashboard"]')?.classList.add('active');

  bus.on('document:updated', updateStatusBar);
  bus.on('document:created', updateStatusBar);
  bus.on('document:deleted', updateStatusBar);
  bus.on('chapter:status-changed', updateStatusBar);
  bus.on('project:updated', updateStatusBar);
}

main().catch((err) => {
  console.error('Error crítico iniciando NovelIDE:', err);
  document.getElementById('app').innerHTML = `<div style="padding:40px; color:#e9e6df; font-family:sans-serif;">
    <h2>No se pudo iniciar la aplicación</h2><p>${err.message}</p><p>Comprueba que tu navegador soporta IndexedDB y que no estás en modo incógnito con almacenamiento bloqueado.</p>
  </div>`;
});

})();

</script>
