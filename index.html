        <p>En los anales de la historia económica, pocos debates han sido tan fundamentales como el que enfrenta la libertad económica individual contra la planificación colectiva estatal. Durante más de un siglo, el mundo ha sido testigo de un experimento natural masivo: mientras algunas naciones abrazaron los principios del libertarismo económico —mercados libres, derechos de propiedad robustos y mínima interferencia estatal—, otras optaron por diversas formas de socialismo y control centralizado. Los resultados no podrían ser más contundentes.</p>

        <p>El debate académico contemporáneo ha estado dominado por una narrativa que presenta al socialismo como la encarnación del altruismo colectivo, mientras retrata al capitalismo de libre mercado como un sistema basado en la codicia individual. Esta caracterización constituye una de las inversiones conceptuales más perniciosas de nuestro tiempo. La evidencia empírica y el análisis teórico riguroso revelan una realidad diametralmente opuesta: es precisamente el socialismo el que se fundamenta en los instintos más egoístas de la naturaleza humana, mientras que el libertarismo económico canaliza estos mismos instintos hacia el beneficio universal.</p>

        <p>La urgencia de este análisis no puede subestimarse. En un momento donde políticas socialistas continúan siendo promovidas a pesar de los fracasos históricos evidentes, y donde crisis humanitarias como la de Venezuela superan en cuatro años el éxodo cubano que se extendió por sesenta años, resulta imperativo examinar las raíces filosóficas y los mecanismos estructurales que hacen del socialismo no solo un sistema económicamente ineficiente, sino moralmente corrupto.</p>

        <h2>I. La Paradoja del Egoísmo: Cómo el Socialismo Institucionaliza la Codicia</h2>
        <p>El primer y más devastador argumento contra el socialismo reside en su propia génesis psicológica. Contrario a la retórica que lo presenta como un sistema altruista, el socialismo nace invariablemente del resentimiento individual y la envidia hacia el éxito ajeno. Esta observación no es meramente anecdótica, sino que encuentra sus raíces en el análisis económico más riguroso.</p>

        <p>Friedrich Hayek, Premio Nobel de Economía, identificó este fenómeno con precisión quirúrgica en su obra seminal "Camino de Servidumbre". El socialismo, argumenta Hayek, no emerge del deseo genuino de ayudar a los menos favorecidos, sino del resentimiento de aquellos que buscan apoderarse de la riqueza creada por otros sin asumir los riesgos y esfuerzos necesarios para generarla.</p>

        <blockquote>
            "El socialismo no es realmente popular entre las masas trabajadoras. Su atractivo principal radica en la promesa de una redistribución de la riqueza que beneficie a quienes no la han creado a expensas de quienes sí lo han hecho."
            — Friedrich Hayek, <em>The Road to Serfdom</em> (1944)
        </blockquote>

        <p>Esta dinámica se materializa de manera sistemática en los regímenes socialistas. Los líderes socialistas históricos —desde Lenin hasta Castro, de Mao a Chávez— no ascendieron al poder impulsados por una genuina preocupación por los pobres, sino por la ambición personal de controlar los recursos y el poder político. El socialismo les proporcionó la justificación moral perfecta para satisfacer sus ambiciones más egoístas bajo el disfraz del bien común.</p>

        <p>La estructura misma del socialismo incentiva y recompensa este comportamiento. Al concentrar el poder económico en manos del Estado, el socialismo crea las condiciones perfectas para que individuos sin escrúpulos se apropien de recursos masivos bajo el pretexto de la justicia social. Las nacionalizaciones que supuestamente debían dar "poder" a los trabajadores solo los dejaron desempleados y hambrientos, mientras que una élite política se beneficiaba de la concentración del poder económico.</p>

        <h2>II. El Libertarismo como Altruismo Verdadero: La Mano Invisible al Servicio de la Humanidad</h2>
        <p>En contraste radical con la falacia altruista del socialismo, el libertarismo económico representa la única forma conocida de canalizar los instintos egoístas humanos hacia el beneficio colectivo genuino. Esta no es una afirmación ideológica, sino una realidad respaldada por siglos de evidencia empírica y análisis teórico riguroso.</p>

        <p>Adam Smith, en su revolucionaria "Investigación sobre la Naturaleza y Causas de la Riqueza de las Naciones", demostró cómo el mecanismo de precios en mercados libres transforma automáticamente el interés personal en beneficio social. Cuando un empresario busca maximizar sus ganancias, debe necesariamente satisfacer las necesidades y deseos de los consumidores mejor que sus competidores. Este proceso, conocido como la "mano invisible", asegura que la búsqueda del beneficio personal resulte en la maximización del bienestar social.</p>

        <p>Los libertarios argumentan que el bienestar social se optimiza cuando la sociedad adopta reglas libertarias, ya que las normas legales que protegen los derechos individuales generan mayores cantidades de bienestar social que aquellas que permiten cantidades significativas de expropiación y coerción.</p>

        <p>La evidencia histórica es abrumadora. Todas las sociedades que han adoptado principios libertarios —protección de la propiedad privada, libertad de contrato, mercados competitivos— han experimentado un crecimiento económico sin precedentes y una mejora dramática en los estándares de vida de toda la población, incluidos los más pobres. Estados Unidos en el siglo XIX, Hong Kong bajo el régimen británico, Singapur después de la independencia, y más recientemente, las reformas de mercado en India y China, demuestran consistentemente este patrón.</p>

        <blockquote>
            "La libertad económica, cuando se permite florecer, es el sistema más altruista jamás desarrollado por la humanidad, porque es el único que permite que millones de personas persigan sus propios intereses de manera que inevitablemente beneficie a millones de otros."
            — Milton Friedman, <em>Free to Choose</em> (1980)
        </blockquote>

        <h2>III. La Corrupción Sistémica: Por Qué el Socialismo es Estructuralmente Vulnerable</h2>
        <p>El tercer argumento demoledor contra el socialismo radica en su vulnerabilidad estructural intrínseca a la corrupción. Esta no es una falla accidental del sistema, sino una consecuencia inevitable de su diseño fundamental.</p>

        <p>Cuando el Estado controla los medios de producción y distribución, elimina los controles y equilibrios naturales que proporcionan los mercados competitivos. En un sistema de libre mercado, la corrupción empresarial es castigada automáticamente por la pérdida de clientes y la eventual bancarrota. Los consumidores pueden elegir alternativas, y los competidores tienen incentivos para exponer y aprovechar las fallas de sus rivales.</p>

        <p>En el socialismo, por el contrario, no existen estas salvaguardas naturales. Los funcionarios estatales que controlan la producción y distribución no enfrentan la disciplina del mercado. Cuba ejemplifica este problema: cuando la ayuda externa de la URSS se detuvo, el país se hundió al no haber hecho planes sobre cómo sobrevivir por sí mismo, demostrando la dependencia estructural y la falta de responsabilidad inherente al sistema.</p>

        <p>La historia del socialismo es una letanía interminable de corrupción masiva: desde la nomenclatura soviética que vivía en lujo mientras el pueblo hacía colas para obtener pan, hasta los actuales regímenes de Cuba y Venezuela donde las élites políticas acumulan fortunas mientras el pueblo sufre opresión, persecución, racionamiento, espionaje, privación y sufrimiento como hechos cotidianos.</p>

        <p>Esta corrupción no es un accidente, sino el resultado lógico de un sistema que concentra poder sin responsabilidad. Lord Acton lo expresó con claridad: "El poder corrompe, y el poder absoluto corrompe absolutamente." El socialismo, al concentrar poder económico absoluto en manos del Estado, crea las condiciones perfectas para la corrupción sistémica.</p>

        <h2>IV. La Evidencia Empírica Devastadora: El Fracaso Universal del Socialismo</h2>
        <p>Los hechos históricos constituyen el veredicto final contra el socialismo. No existe un solo ejemplo en la historia humana de un país que haya prosperado genuinamente bajo un sistema socialista puro. Por el contrario, cada experimento socialista ha resultado en empobrecimiento masivo, represión política y, en muchos casos, genocidio.</p>

        <p>La Unión Soviética, el experimento socialista más ambicioso de la historia, colapsó después de 74 años de existencia, dejando tras de sí millones de muertos, una economía en ruinas y un legado de trauma generacional. China solo comenzó a prosperar cuando abandonó los principios socialistas puros y adoptó reformas de mercado. Vietnam del Norte experimentó hambrunas masivas hasta que permitió la agricultura privada.</p>

        <p>Venezuela, que una vez fue la nación más próspera de Sudamérica, ha experimentado un colapso económico tan severo que ha generado la mayor crisis migratoria en la historia del hemisferio occidental. La transformación de Venezuela de la prosperidad relativa al colapso total en menos de dos décadas ilustra vívidamente la capacidad destructiva del socialismo.</p>

        <p>Cuba, después de más de seis décadas de socialismo, sigue siendo uno de los países más pobres del hemisferio, donde los ciudadanos arriesgan sus vidas en balsas improvisadas para escapar del "paraíso socialista." El contraste con países como Corea del Sur, que eligió el camino capitalista después de la guerra, no podría ser más dramático.</p>

        <blockquote>
            "Los pueblos han votado con sus pies. Nadie huye del capitalismo hacia el socialismo; siempre es al revés. Los muros se construyen para impedir que la gente salga de los países socialistas, no para impedir que entre."
            — Thomas Sowell, <em>Basic Economics</em> (2015)
        </blockquote>

        <h2>V. El Mecanismo de Información: Por Qué la Planificación Central es Inherentemente Inferior</h2>
        <p>Ludwig von Mises, en su obra "Socialismo", identificó lo que se conoce como el "problema del cálculo económico" en las economías socialistas. Sin precios de mercado determinados libremente, es imposible asignar recursos de manera eficiente. Los precios en un mercado libre contienen información dispersa sobre preferencias, escasez relativa y oportunidades alternativas que ningún planificador central puede replicar.</p>

        <p>Existe evidencia abrumadora de que la libertad económica —modificada quizás en algunos aspectos— promueve el bienestar económico de manera generalizada, y una economía fuerte maximiza la capacidad del Estado para hacer lo que desee hacer.</p>

        <p>Esta superioridad informacional del mercado no es teórica sino prácticamente demostrable. La innovación tecnológica, el emprendimiento y la adaptación a cambios en las preferencias del consumidor florecen bajo sistemas de libre mercado y se marchitan bajo la planificación central. Silicon Valley, no Moscú, produjo la revolución digital que transformó el mundo.</p>

        <h2>¿Conclusión o Pregunta Moral Fundamental?</h2>
        <p>El debate entre libertarismo económico y socialismo no es meramente técnico sino profundamente moral. Se trata de elegir entre un sistema que, reconociendo las limitaciones y motivaciones humanas reales, las canaliza hacia el beneficio mutuo, versus un sistema que, basándose en una fantasía utópica sobre la naturaleza humana, inevitablemente produce miseria y opresión.</p>

        <p>La evidencia histórica, teórica y empírica es inequívoca: el libertarismo económico ha elevado a más personas de la pobreza, ha generado más innovación, ha protegido mejor las libertades individuales y ha promovido más genuinamente el bienestar humano que cualquier alternativa socialista. El socialismo, por el contrario, ha demostrado ser no solo económicamente destructivo sino moralmente corrupto en su núcleo.</p>

        <p>La pregunta que queda para las sociedades contemporáneas no es si el socialismo puede funcionar —la historia ha respondido categóricamente que no— sino por qué la seducción de las promesas socialistas persiste a pesar de la montaña de evidencia en su contra. Quizás la respuesta radique en que es más fácil culpar al sistema que asumir la responsabilidad personal, más cómodo prometer soluciones mágicas que enfrentar las complejidades de la vida real.</p>

        <p>La humanidad ha probado el socialismo repetidamente, y el resultado siempre ha sido el mismo: empobrecimiento, opresión y sufrimiento masivo. Es hora de reconocer que el libertarismo económico no es solo superior técnicamente, sino que es el único sistema verdaderamente moral, porque es el único que respeta la dignidad individual mientras promueve el bienestar colectivo genuino.</p>

    <h2>I. La caída de Roma y el surgimiento de la cristiandad: el alba de una nueva civilización</h2>

    <p>La caída del Imperio romano de Occidente en 476 d.C. marcó el colapso de las estructuras políticas, jurídicas y culturales que habían vertebrado Europa durante siglos. La retirada del sistema imperial dejaba vacíos institucionales, pero también fracturas morales y horizontes dispersos. En este entorno emergió el cristianismo como una nueva fuerza ordenadora.</p>

    <p>La Iglesia, heredera de la cúpula jerárquica y organizativa romana, sustituyó al Estado en la gestión de la moral, la educación, la cultura y la asistencia social. Obispados y monasterios se convirtieron en nodos de cohesión local, en muchos casos únicos en estructuras funcionales. Sabine MacCormack subraya cómo la Iglesia fue “cohesión espiritual, social y política” en medio de la fragmentación postimperial.</p>

    <p>Ese proceso comenzó con la normalización del cristianismo: el Edicto de Milán (313) lo legalizó; el Concilio de Nicea (325) lo estructuró teológicamente; y el Edicto de Tesalónica (380) lo convirtió en la religión oficial bajo Teodosio. Así, el cristianismo pasó de marginal a eje vertebral institucional.</p>

    <p>Monjes conservadores de cultura clásica —copistas de Virgilio, Euclides o Cicerón— convirtieron sus <em>scriptoria</em> en baluartes del saber grecorromano. Sin esa continuidad, gran parte de nuestra herencia hubiese desaparecido.</p>

    <p>Por tanto, sin la caída de Roma, el cristianismo no se habría expandido ni transformado en fuerza global. Se habría quedado como secta persecutiva, sin el impulso y la urgencia histórica que forjó el mundo medieval.</p>

    <h2>II. España: nación cristiana, historia de una cultura</h2>

    <p>El presente de España es inseparable de su pasado cristiano. Este entramado espiritual y cultural se configura a través de:</p>

    <ul>
      <li><strong>Cristianismo visigodo</strong>: unificó a la Península bajo Ley y fe común.</li>
      <li><strong>Reconquista</strong>: más que una guerra territorial fue una cruzada moral que redefinió la identidad nacional en clave cristiana.</li>
      <li><strong>Instituciones formadoras</strong>: las universidades medievales (Salamanca, Alcalá, Santiago) nacieron de maestros eclesiásticos.</li>
      <li><strong>Doctrinas filosófico-jurídicas</strong>: la Escuela de Salamanca generó nociones contemporáneas de derechos naturales, libertad, soberanía popular, igualdad jurídica, bienes comunes, tolerancia religiosa y límite al poder, pilares de la España moderna.</li>
    </ul>

    <blockquote>
      “Los derechos naturales del hombre pasaron a ser… centro de atención… tanto relativos al cuerpo (ley natural) como al espíritu (dignidad)”.
    </blockquote>

    <p>Francisco de Vitoria, primer gran catedrático de Salamanca (1526), enseñó que “todos los hombres somos iguales, hijos de Dios e iguales ante Dios”, introduciendo además derechos como la libertad, la propiedad y el tiranicidio. Luis de Molina, Francisco Suárez y otros desarrollaron una teoría política basada en la soberanía popular y el derecho de resistencia.</p>

    <p>Este esquema moral-laboural inspiró la legislación colonial (Leyes de Indias), la aceptación de los derechos de los indígenas y los orígenes del derecho internacional. Sin ese sustrato teológico-jurídico, no existía ni universidad ni nación española; lo que habría existido carecería de nuestra matriz espiritual.</p>

    <h2>III. Socialismo contemporáneo: demolición enmascarada de valores</h2>

    <h3>a) La ingeniería del conflicto como método</h3>

    <p>El socialismo moderno —tanto su vertiente clásica como la actual de izquierdas “progre”—, lejos de ser un modelo equilibrado de justicia, muestra una vocación sistemática de demolición de lo existente. Su corazón no es redistribución de riqueza, sino desarticulación del sujeto moral.</p>

    <p>Identifica al aspirante al poder con un grupo oprimido: por clase, raza, sexo u orientación. Si no existe un oprimido real, lo crea. Allí donde no hay desigualdad, fabrica privilegios inversos y violaciones percibidas. Si no hay inmigración, impone cuotas; donde no hay racismo, fabrica microagresiones; donde no hay género en conflicto, lo inventa.</p>

    <p>Quien legitima esa ofensiva es la "discriminación positiva", pervirtiendo la igualdad jurídica en privilegio legal. El multiculturalismo y la inmigración masiva no se plantean como riqueza sociocultural, sino como vehículo para mutar o sustituir lo preexistente.</p>

    <h3>b) Cruzados contra la dignidad, arquitectos del resentimiento</h3>

    <p>Es una estrategia indirecta. Bajo mandato paternalista se debilita la familia, se relativiza la verdad, se subjetiviza la identidad y se sustituye la libertad por la identidad grupal. En ese escenario, el individuo deja de existir como sujeto autónomo y pasa a ser interpelado por etnia, género o credo. Se enturbia la idea de dignidad como condición suprafísica, para reducirlo a miembro de una colectividad utilizable políticamente.</p>

    <p>Una vez disuelto el vínculo moral (Dios, familia, historia), no hay resistencia al poder. Nadie es responsable en clave personal. Todos somos masa a manipular.</p>

    <h2>IV. Cristianismo frente a la demolición ideológica</h2>

    <h3>a) Dignidad, verdad objetiva y comunidad</h3>

    <p>El cristianismo introduce la noción de persona como ser libre, único e irremplazable. Habla de verdad externa, no negociada. Cree en la institución consciente del límite del poder. Afirma que el bien común es superior a los intereses partidistas o identitarios.</p>

    <p>Mientras, la "izquierda identitaria" busca reemplazar esos valores por categorías interseccionales sacadas del marxismo cultural.</p>

    <p>Defender el cristianismo hoy no es evangelizar, sino proteger una cosmovisión que sostenga a la persona frente a los proyectos colectivistas.</p>

    <h3>b) Ignorancia o intencionalidad</h3>

    <p>Podemos distinguir dos perfiles entre los socialistas:</p>

      <li><strong>Instrumentales</strong>: actores con voluntad de redefinir la cultura, la ley y la historia para construir poder desde un “vacío” moral.</li>
    </ul>

    <p>Ambos erosionan ese acervo que da espacio a la libertad, a la historia y al ser nacional.</p>

    <h2>V. Defender sin imponer: el reto de la convivencia generosa</h2>

    <p>Proteger el cristianismo no es negar el pluralismo, sino preservar su génesis. No es imponer una confesión, sino conservar una cultura —artes, derecho, idioma, tradiciones, festividades— con raíces en la cruz.</p>

    <p>La libertad de creencias solo florece si hay una raíz moral y cultural común. El pluralismo liberal nace del cristianismo, no al margen de él.</p>

    <h2>VI. Llamamiento nacional</h2>

    <p><strong>Españolas y españoles</strong>, creyentes o no:</p>

    <ul>
      <li>No os pido que recéis, pero sí que comprendáis.</li>
      <li>No exijo una fe pública, pero sí respeto por un legado fundacional.</li>
      <li>No es veneración a lo divino, sino defensa de lo que somos.</li>
    </ul>

    <p>El desafío actual no es destruir catedrales con fuego, sino vaciarlas de sentido. No es arrasar iglesias, sino desarraigar el cristianismo de la cultura, la escuela, la ley y la historia.</p>

    <p>Si permitimos esa erosión, perderemos no solo templos: perderemos la nación.</p>

    <h2>VII. Conclusión: un nuevo pacto por España</h2>

    <p>🚨 <strong>Por España, por la libertad, por la dignidad individual, por el derecho, por la comunidad que otorga identidad y condición humana</strong>:</p>

    <p>Os llamo a defender el cristianismo —no como religión impuesta, sino como patrimonio moral compartido. Levantad la voz contra quienes promueven lo colectivista y relativista bajo la bandera identitaria. No cedamos a proyectos que desean sustituir nuestro sentido de pertenencia por clanes móviles, sin pasado ni futuro.</p>

    <p>Guardemos la raíz cristiana que hace de España no una periferia cultural, sino epicentro de una civilización libre.</p>

        <p>Así que sí, aunque Spanish Revolution grita independencia, su primo más cercano (Público) tiene, al menos, un par de dedos rozando la Gran Muralla. ¿Casualidad? Claro, como que a los políticos nunca se les olvidan los casos de corrupción.</p>

        <h2>La influencia invisible (pero descarada)</h2>

        <p>¿Qué significa esto para los medios progresistas? Bueno, podríamos asumir que la línea editorial de Público y su primo pequeño Spanish Revolution está completamente aislada de la influencia económica. Porque, por supuesto, los inversores multimillonarios chinos son conocidos por ser absolutamente desinteresados y por no tener ningún interés en controlar narrativas políticas. (Insertar risas aquí).</p>

        <p>Pero vamos más allá. La narrativa dominante de estos medios, desde su cruzada contra todo lo que huela a derecha hasta su blindaje mediático al PSOE, parece encajar perfectamente con los intereses de un régimen que prefiere ver a Europa con gobiernos débiles, polarizados y, preferiblemente, enfrentados.</p>

        <h2>La Revolución que fue subvencionada</h2>

        <p>Es hilarante cómo la revolución suele encontrar sus mecenas en los lugares más insospechados. Mientras Spanish Revolution y sus satélites denuncian a los "grandes poderes" y claman por la justicia social, sus conexiones, aunque indirectas, con capital chino añaden un toque irónico digno de un drama shakespeariano. ¡El gigante capitalista apoya a los defensores del pueblo! ¿O es más bien que los usa? Difícil saberlo, pero la ironía está servida.</p>

        <h2>El PSOE, el cómplice silencioso</h2>

        <p>Pero no todo termina en China. Resulta que en este juego de espejos, el PSOE también parece estar en la sala. Mientras Spanish Revolution ignora escándalos relacionados con la censura o la corrupción del partido, despliega titulares que harían sonrojar a un community manager en campaña electoral. Es como si alguien dijera: "No miremos aquí, ¡miren allá! La derecha es el problema, amigos".</p>

        <p>Uno podría pensar que, siendo un medio tan independiente, alguna crítica al gobierno caería de vez en cuando. Pero no. En lugar de eso, sus titulares leen como poesía: “El PSOE y el cambio social”, “Avances históricos bajo el liderazgo progresista”. Ah, la dulzura del equilibrio informativo.</p>

        <h2>El milagro del dinero revolucionario</h2>

        <p>Todo esto nos lleva a la pregunta del millón: ¿cómo se financia esta máquina de activismo editorial? La respuesta oficial es: “donaciones y suscriptores comprometidos”. Claro, porque nada dice revolución como mantener un equipo editorial, producción multimedia y campañas de impacto social con un puñado de euros de lectores idealistas. Aunque, claro, no podemos olvidar la ayuda estructural de ecosistemas como Público, que, como ya vimos, tiene sus propias conexiones con el mundo empresarial globalizado.</p>

        <p>¿Y si las donaciones no son suficientes? Bueno, aquí es donde las conexiones indirectas con estructuras más grandes (como Mediapro y sus inversores internacionales) empiezan a parecer mucho menos inocentes.</p>

        <h2>La ironía final</h2>

        <p>Así que aquí estamos, leyendo a Spanish Revolution, un medio que proclama luchar contra los grandes poderes mientras se encuentra, de una forma u otra, relacionado con uno de los imperios mediáticos más complejos, financiado en parte por capital extranjero. La gran revolución progresista del siglo XXI puede, después de todo, necesitar un poco de ayuda del capitalismo globalizado que tanto denuncia.</p>

        <p>¿Es esto un plan maestro de Pekín para infiltrar narrativas europeas? ¿Es simplemente un giro irónico del destino donde la independencia ideológica choca con la dependencia económica? ¿O todo esto es un gran malentendido y deberíamos confiar plenamente en la transparencia de las instituciones mediáticas?</p>

        <p>Sea cual sea la respuesta, hay algo profundamente entretenido en observar cómo los medios que predican independencia y justicia social terminan enredados en la misma maraña que critican. ¡Larga vida a la revolución, siempre que haya alguien dispuesto a financiarla!</p>

        setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                this.searchTerm = e.target.value.toLowerCase();
                this.filterAndRenderArticles();
            });

            document.getElementById('filterTabs').addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tab')) {
                    document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
                    e.target.classList.add('active');
                    this.currentFilter = e.target.getAttribute('data-filter');
                    this.filterAndRenderArticles();
                }
            });
        }

        updateStats() {
            document.getElementById('totalArticles').textContent = this.articles.length;
            document.getElementById('totalCategories').textContent = this.categories.size;
        }

        renderFilterTabs() {
            const tabsContainer = document.getElementById('filterTabs');
            const allCategories = Array.from(new Set(this.articles.map(a => a.fullCategory))).sort();

            let tabsHTML = '<button class="filter-tab active" data-filter="all">Todo</button>';
            allCategories.forEach(category => {
                tabsHTML += `<button class="filter-tab" data-filter="${category}">${category}</button>`;
            });

            tabsContainer.innerHTML = tabsHTML;
        }

        filterAndRenderArticles() {
            this.filteredArticles = this.articles.filter(article => {
                const matchesFilter = this.currentFilter === 'all' || article.fullCategory === this.currentFilter;
                const matchesSearch = this.searchTerm === '' ||
                    article.title.toLowerCase().includes(this.searchTerm) ||
                    article.excerpt.toLowerCase().includes(this.searchTerm) ||
                    article.category.toLowerCase().includes(this.searchTerm);

                return matchesFilter && matchesSearch;
            });

            this.renderArticles();
        }

        renderArticles() {
            const grid = document.getElementById('articlesGrid');

            if (this.filteredArticles.length === 0) {
                grid.innerHTML = '<div class="no-articles">No se han encontrado artículos con esas características.</div>';
                return;
            }

            let articlesHTML = '';
            this.filteredArticles.forEach((article, index) => {
                const articleId = `article-${index}`;
                articlesHTML += `
                    <article class="article-card fade-in" data-slug="${article.slug}" style="animation-delay: ${index * 0.1}s">
                        <div class="article-meta">
                            <span class="article-category">${article.fullCategory}</span>
                            <span class="article-date">${article.date}</span>
                        </div>
                        <h2 class="article-title">${article.title}</h2>
                        <p class="article-excerpt">${article.excerpt}</p>
                        <button class="read-more" onclick="toggleArticle('${articleId}', '${article.slug}')">
                            Leer →
                        </button>
                        <div class="article-content" id="${articleId}">
                            <button class="close-article" onclick="toggleArticle('${articleId}')">← Volver</button>
                            ${article.content}
                        </div>
                    </article>
                `;
            });

            grid.innerHTML = articlesHTML;
        }
    }

    // Función mejorada
    function toggleArticle(articleId, slug = null) {
        const content = document.getElementById(articleId);
        const isExpanded = content.classList.contains('expanded');

        document.querySelectorAll('.article-content.expanded').forEach(el => {
            if (el.id !== articleId) {
                el.classList.remove('expanded');
            }
        });

        if (isExpanded) {
            content.classList.remove('expanded');
            history.replaceState(null, '', window.location.pathname);
        } else {
            content.classList.add('expanded');
            content.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (slug) {
                history.replaceState(null, '', `?articulo=${slug}`);
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        new BlogManager();
    });
