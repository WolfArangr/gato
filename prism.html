<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0D11">
<meta name="description" content="Prism Mechanics — un juego de puzles de luz y cristal.">
<title>Prism Mechanics</title>
<style>
:root{
  --ink:#0B0D11; --bone:#EDEFF5;
  --r:#FF2D4A; --g:#39FF88; --b:#3D7BFF;
  --pad-t:env(safe-area-inset-top,0px); --pad-b:env(safe-area-inset-bottom,0px);
  --pad-l:env(safe-area-inset-left,0px); --pad-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{position:fixed;inset:0;overflow:hidden;background:var(--ink);
  touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--bone);}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.scr{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:2.2rem;pointer-events:auto;
  padding:calc(var(--pad-t) + 1rem) calc(var(--pad-r) + 1rem) calc(var(--pad-b) + 1rem) calc(var(--pad-l) + 1rem);
  background:rgba(11,13,17,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.scr.on{display:flex}
.brand{font-size:clamp(1.9rem,9vw,3.4rem);font-weight:200;letter-spacing:.34em;
  text-transform:lowercase;text-indent:.34em;opacity:.95;text-align:center;line-height:1.25}
.brand small{display:block;font-size:.26em;letter-spacing:.5em;opacity:.4;margin-top:1.1em}
.menu{display:flex;flex-direction:column;gap:1.15rem;align-items:center}
.mi{font-size:clamp(.86rem,3.6vw,1rem);font-weight:300;letter-spacing:.28em;
  text-transform:lowercase;text-indent:.28em;opacity:.55;background:none;border:0;
  color:inherit;cursor:pointer;padding:.5rem 1rem;transition:opacity .22s,text-shadow .22s;
  font-family:inherit;touch-action:manipulation}
.mi:hover,.mi:focus-visible{opacity:1;text-shadow:0 0 18px rgba(237,239,245,.55);outline:none}
.mi[disabled]{opacity:.16;cursor:default}
.mi .v{opacity:.5;margin-left:.6em;letter-spacing:.18em}
#lvl-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;
  width:min(92vw,26rem)}
.lv{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.25rem;background:none;border:0;color:inherit;font-family:inherit;cursor:pointer;
  opacity:.28;transition:opacity .2s,text-shadow .2s;padding:0}
.lv.un{opacity:.6}.lv.done{opacity:.95}
.lv:hover:not([disabled]){opacity:1;text-shadow:0 0 16px rgba(237,239,245,.6)}
.lv[disabled]{cursor:default}
.lv .n{font-size:1.05rem;font-weight:200;letter-spacing:.06em}
.lv .d{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0}
.lv.done .d{opacity:.9;box-shadow:0 0 10px currentColor}
#hud{position:absolute;top:0;left:0;right:0;display:none;justify-content:space-between;
  align-items:flex-start;pointer-events:none;
  padding:calc(var(--pad-t) + .85rem) calc(var(--pad-r) + 1rem) 0 calc(var(--pad-l) + 1rem)}
#hud.on{display:flex}
#hud-l{font-size:.7rem;letter-spacing:.3em;text-transform:lowercase;opacity:.35;line-height:1.9}
#hud-r{display:flex;gap:.35rem;pointer-events:auto}
.gl{background:none;border:0;color:inherit;font-family:inherit;font-size:1.05rem;
  line-height:1;opacity:.35;cursor:pointer;padding:.45rem .55rem;transition:opacity .2s}
.gl:hover{opacity:.9}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.9rem;pointer-events:none;opacity:0;transition:opacity .5s}
#intro-num{font-size:.68rem;letter-spacing:.46em;text-indent:.46em;opacity:.35}
#intro-name{font-size:clamp(1.5rem,7vw,2.4rem);font-weight:200;letter-spacing:.28em;
  text-indent:.28em;text-transform:lowercase}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:clamp(3rem,18vw,7rem);font-weight:100;opacity:.8;pointer-events:none}
#cd.on{display:flex}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
  transition:opacity .18s linear;z-index:20}
#toast{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--pad-b) + 2.2rem);font-size:.68rem;letter-spacing:.26em;
  text-transform:lowercase;opacity:0;transition:opacity .4s;pointer-events:none}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.7rem;letter-spacing:.3em;opacity:.4;text-transform:lowercase;z-index:30}
/* ── neumorphic control deck ─────────────────────────────────────────────
   Same-hue surfaces lifted by a light from the upper left. Pressed controls
   invert to inset. Nothing here uses a border. */
#pnl{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--pad-b) + .55rem);z-index:12;pointer-events:auto;display:none;
  width:min(94vw,30rem);padding:.7rem .8rem .75rem;border-radius:1.15rem;
  background:linear-gradient(145deg,#151A24,#0E1219);
  box-shadow:7px 7px 16px rgba(0,0,0,.62),-6px -6px 14px rgba(58,72,98,.16);}
#pnl.on{display:block}
#pnl.min .pnl-body{display:none}
.pnl-head{display:flex;align-items:center;gap:.55rem}
.pnl-body{display:flex;align-items:center;gap:.75rem;margin-top:.7rem;
  justify-content:space-between;flex-wrap:wrap}
.nu{background:linear-gradient(145deg,#161C27,#0F131A);color:#C6D0E4;
  border:0;border-radius:.72rem;font-family:inherit;cursor:pointer;
  box-shadow:3px 3px 7px rgba(0,0,0,.58),-3px -3px 7px rgba(58,72,98,.15);
  transition:box-shadow .12s,color .12s,opacity .12s;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.nu:active,.nu.dn{box-shadow:inset 3px 3px 7px rgba(0,0,0,.62),inset -3px -3px 7px rgba(58,72,98,.14);
  color:#EDEFF5}
.nu[disabled]{opacity:.22;cursor:default;box-shadow:inset 2px 2px 5px rgba(0,0,0,.5)}
.nu.sq{width:2.15rem;height:2.15rem;font-size:1rem;line-height:1}
.nu.wide{height:2.15rem;padding:0 .8rem;font-size:.62rem;letter-spacing:.2em;
  text-transform:lowercase}
.pnl-name{flex:1;min-width:0;font-size:.64rem;letter-spacing:.22em;
  text-transform:lowercase;opacity:.6;text-align:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pnl-grp{display:flex;align-items:center;gap:.3rem}
.pnl-lab{font-size:.5rem;letter-spacing:.24em;text-transform:lowercase;opacity:.32;
  text-align:center;width:100%;margin-bottom:.28rem}
.pnl-col{display:flex;flex-direction:column;align-items:center}
/* the precision cross */
#pn-cross{display:grid;grid-template-columns:repeat(3,2.15rem);
  grid-template-rows:repeat(3,2.15rem);gap:.16rem}
#pn-cross .sp{visibility:hidden}
#pn-up{grid-area:1/2}#pn-lf{grid-area:2/1}#pn-mid{grid-area:2/2}
#pn-rt{grid-area:2/3}#pn-dn{grid-area:3/2}
#pn-mid{border-radius:50%;box-shadow:inset 2px 2px 5px rgba(0,0,0,.6),
  inset -2px -2px 5px rgba(58,72,98,.12);width:2.15rem;height:2.15rem}
/* angle readout */
#pn-ang{font-size:.72rem;letter-spacing:.1em;min-width:3.1rem;text-align:center;
  opacity:.75;font-variant-numeric:tabular-nums}
/* intensity slider */
#pn-track{position:relative;width:100%;height:1.5rem;border-radius:.75rem;
  box-shadow:inset 3px 3px 7px rgba(0,0,0,.62),inset -3px -3px 7px rgba(58,72,98,.13);
  cursor:pointer;touch-action:none}
#pn-fill{position:absolute;left:.18rem;top:.36rem;height:.78rem;border-radius:.4rem;
  background:linear-gradient(90deg,rgba(198,208,228,.20),rgba(237,239,245,.75));
  pointer-events:none}
#pn-knob{position:absolute;top:.11rem;width:1.28rem;height:1.28rem;border-radius:50%;
  background:linear-gradient(145deg,#1B2230,#0E121A);
  box-shadow:2px 2px 5px rgba(0,0,0,.6),-2px -2px 5px rgba(58,72,98,.2);
  pointer-events:none}
#pn-intv{font-size:.6rem;letter-spacing:.14em;opacity:.45;min-width:2.6rem;
  text-align:right;font-variant-numeric:tabular-nums}
@media (max-height:560px){#pnl{width:min(96vw,34rem)}.pnl-body{gap:.5rem}}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="boot">cargando…</div>

<div id="ui">
  <div id="hud">
    <div id="hud-l"><span id="hud-num"></span><br><span id="hud-name"></span></div>
    <div id="hud-r">
      <button class="gl" id="btn-reset" aria-label="restart">↺</button>
      <button class="gl" id="btn-pause" aria-label="pause">‖</button>
    </div>
  </div>

  <div id="intro"><div id="intro-num"></div><div id="intro-name"></div></div>
  <div id="cd"></div>

  <div class="scr on" id="scr-title">
    <div class="brand">prism<small data-i18n="sub">mechanics</small></div>
    <div class="menu">
      <button class="mi" id="btn-play" data-i18n="play">continuar</button>
      <button class="mi" id="btn-levels" data-i18n="levels">salas</button>
      <button class="mi" id="btn-opts" data-i18n="opts">ajustes</button>
    </div>
  </div>

  <div class="scr" id="scr-levels">
    <div id="lvl-grid"></div>
    <button class="mi" id="lvl-back" data-i18n="back">volver</button>
  </div>

  <div class="scr" id="scr-pause">
    <div class="brand" style="font-size:clamp(1.1rem,5vw,1.6rem)" data-i18n="paused">pausa</div>
    <div class="menu">
      <button class="mi" id="p-resume" data-i18n="resume">seguir</button>
      <button class="mi" id="p-restart" data-i18n="restart">reiniciar</button>
      <button class="mi" id="p-opts" data-i18n="opts">ajustes</button>
      <button class="mi" id="p-quit" data-i18n="quit">salir</button>
    </div>
  </div>

  <div class="scr" id="scr-opts">
    <div class="menu">
      <button class="mi" id="o-music"><span data-i18n="music">música</span><span class="v" id="v-music"></span></button>
      <button class="mi" id="o-sfx"><span data-i18n="sfx">sonido</span><span class="v" id="v-sfx"></span></button>
      <button class="mi" id="o-hap"><span data-i18n="hap">vibración</span><span class="v" id="v-hap"></span></button>
      <button class="mi" id="o-glow"><span data-i18n="glow">intensidad</span><span class="v" id="v-glow"></span></button>
      <button class="mi" id="o-cb"><span data-i18n="cb">daltonismo</span><span class="v" id="v-cb"></span></button>
      <button class="mi" id="o-qual"><span data-i18n="qual">detalle</span><span class="v" id="v-qual"></span></button>
      <button class="mi" id="o-lang"><span data-i18n="lang">idioma</span><span class="v" id="v-lang"></span></button>
      <button class="mi" id="o-back" data-i18n="back">volver</button>
    </div>
  </div>

  <div id="pnl">
    <div class="pnl-head">
      <button class="nu sq" id="pn-prev" aria-label="previous piece">‹</button>
      <div class="pnl-name" id="pn-name">—</div>
      <button class="nu sq" id="pn-next" aria-label="next piece">›</button>
      <button class="nu sq" id="pn-min" aria-label="collapse">▾</button>
    </div>
    <div class="pnl-body">
      <div class="pnl-col">
        <div class="pnl-lab" data-i18n="pnMove">mover</div>
        <div id="pn-cross">
          <button class="nu sq" id="pn-up" aria-label="up">▲</button>
          <button class="nu sq" id="pn-lf" aria-label="left">◀</button>
          <div id="pn-mid"></div>
          <button class="nu sq" id="pn-rt" aria-label="right">▶</button>
          <button class="nu sq" id="pn-dn" aria-label="down">▼</button>
        </div>
      </div>
      <div class="pnl-col" style="flex:1;min-width:9rem">
        <div class="pnl-lab" data-i18n="pnTurn">ángulo</div>
        <div class="pnl-grp">
          <button class="nu sq" id="pn-rl" aria-label="turn left">↺</button>
          <div id="pn-ang">0°</div>
          <button class="nu sq" id="pn-rr" aria-label="turn right">↻</button>
        </div>
        <div class="pnl-lab" style="margin-top:.7rem" data-i18n="pnInt">intensidad</div>
        <div class="pnl-grp" style="width:100%">
          <div id="pn-track"><div id="pn-fill"></div><div id="pn-knob"></div></div>
          <div id="pn-intv">100%</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>
<div id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script id="core">
/* ============================================================================
   PRISM MECHANICS — OPTICS CORE
   Pure, DOM-free, Three-free. This is the whole game rule set.
   Channels are a bitmask: R=1, G=2, B=4. White = 7.
   The world is 2D (x, z). The 3D presentation is a camera trick.
   ========================================================================== */
(function (root) {
  'use strict';

  /* ---- TUNING BLOCK -------------------------------------------------------
     Every number a designer would want to touch lives here.
  -------------------------------------------------------------------------*/
  var CFG = {
    SPREAD_DEG: 18,       // angular offset of the R and B slots from the G slot
    PRISM_R: 0.9,         // hit radius of a prism
    COMB_R: 0.9,          // hit radius of a combiner
    TARGET_R: 1.0,        // hit radius of a target  (== the aiming tolerance)
    EMITTER_R: 0.62,      // the emitter housing is solid: light does not pass through it
    MIRROR_LEN: 2.4,      // default mirror segment length
    FILTER_LEN: 3.0,      // default filter segment length
    MAX_DIST: 70,         // how far an unobstructed ray travels before it dies
    MAX_BOUNCES: 10,      // reflections/filter crossings per ray
    MAX_ITER: 14,         // fixed-point passes for node feedback
    DETENT_DEG: 15,       // rotation snaps to multiples of this
    DETENT_MAGNET: 2.5,   // ...when within this many degrees
    MIRROR_R0: 0.90,      // normal-incidence reflectance of the silvered face
    PRISM_LOSS: 0.88,     // what a pass through the glass costs
    COMB_LOSS: 0.92,
    FILTER_LOSS: 0.90,
    GRAZE: 0.34,          // below this incidence cosine the bounce turns iridescent
    EPS: 1e-4
  };

  var D2R = Math.PI / 180;

  /* ---- small 2D helpers -------------------------------------------------*/
  function dirOf(deg) { var a = deg * D2R; return [Math.cos(a), Math.sin(a)]; }

  // ray (o + t*d) vs circle (c, r) -> smallest t > eps, or -1
  function hitCircle(ox, oz, dx, dz, cx, cz, r) {
    var mx = ox - cx, mz = oz - cz;
    var b = mx * dx + mz * dz;
    var c = mx * mx + mz * mz - r * r;
    if (c > 0 && b > 0) return -1;
    var disc = b * b - c;
    if (disc < 0) return -1;
    var s = Math.sqrt(disc);
    var t = -b - s;
    if (t < CFG.EPS) t = -b + s;
    return t < CFG.EPS ? -1 : t;
  }

  // ray vs finite segment p->q -> t or -1
  function hitSeg(ox, oz, dx, dz, px, pz, qx, qz) {
    var ex = qx - px, ez = qz - pz;
    var den = dx * ez - dz * ex;
    if (Math.abs(den) < 1e-9) return -1;          // parallel
    var rx = px - ox, rz = pz - oz;
    var t = (rx * ez - rz * ex) / den;            // along the ray
    var u = (rx * dz - rz * dx) / den;            // along the segment
    if (t < CFG.EPS || u < 0 || u > 1) return -1;
    return t;
  }

  function segEnds(e) {
    var len = e.len || CFG.MIRROR_LEN;
    var d = dirOf(e.rot || 0), h = len * 0.5;
    return [e.x - d[0] * h, e.z - d[1] * h, e.x + d[0] * h, e.z + d[1] * h];
  }

  function rectSegs(e) {
    var d = dirOf(e.rot || 0);            // local +x
    var hx = (e.w || 2) * 0.5, hz = (e.d || 0.8) * 0.5;
    var ux = d[0], uz = d[1], vx = -d[1], vz = d[0];
    var c = [];
    for (var i = 0; i < 4; i++) {
      var sx = (i === 0 || i === 3) ? 1 : -1;
      var sz = (i < 2) ? 1 : -1;
      c.push([e.x + ux * hx * sx + vx * hz * sz, e.z + uz * hx * sx + vz * hz * sz]);
    }
    return c;
  }

  /* ---- element resolution -----------------------------------------------
     `state` is a sparse map { index: {x,z,rot} } holding player overrides.
  -------------------------------------------------------------------------*/
  function resolve(level, state) {
    var out = [];
    for (var i = 0; i < level.elements.length; i++) {
      var e = level.elements[i], s = state && state[i];
      var o = { t: e.t, x: e.x, z: e.z, rot: e.rot || 0, mask: e.mask,
                len: e.len, w: e.w, d: e.d, move: !!e.move, spin: !!e.spin, i: i };
      if (s) {
        if (s.x !== undefined) o.x = s.x;
        if (s.z !== undefined) o.z = s.z;
        if (s.rot !== undefined) o.rot = s.rot;
      }
      out.push(o);
    }
    return out;
  }

  function radiusOf(e) {
    if (e.t === 'prism') return CFG.PRISM_R;
    if (e.t === 'comb') return CFG.COMB_R;
    if (e.t === 'target') return CFG.TARGET_R;
    if (e.t === 'emitter') return CFG.EMITTER_R;
    return 0;
  }

  /* ---- the trace ---------------------------------------------------------*/

  // Returns nearest {t, idx} for a ray, ignoring element `skip`.
  function nearest(els, ox, oz, dx, dz, skip) {
    var best = Infinity, bi = -1, i, e, t, s, c, j, k;
    for (i = 0; i < els.length; i++) {
      if (i === skip) continue;
      e = els[i];
      if (e.t === 'prism' || e.t === 'comb' || e.t === 'target' || e.t === 'emitter') {
        t = hitCircle(ox, oz, dx, dz, e.x, e.z, radiusOf(e));
      } else if (e.t === 'mirror' || e.t === 'filter') {
        s = segEnds(e);
        t = hitSeg(ox, oz, dx, dz, s[0], s[1], s[2], s[3]);
      } else if (e.t === 'wall') {
        c = rectSegs(e); t = -1;
        for (j = 0; j < 4; j++) {
          k = (j + 1) % 4;
          var tt = hitSeg(ox, oz, dx, dz, c[j][0], c[j][1], c[k][0], c[k][1]);
          if (tt > 0 && (t < 0 || tt < t)) t = tt;
        }
      } else { t = -1; }
      if (t > 0 && t < best) { best = t; bi = i; }
    }
    return { t: best, idx: bi };
  }

  // Cast one ray. Pushes segments into `segs`; accumulates into nodeIn / tgtIn.
  function cast(els, ox, oz, dx, dz, mask, skip, segs, nodeIn, tgtIn, gain, glints, nodeGain) {
    var bounces = 0;
    if (gain === undefined) gain = 1;
    while (bounces++ < CFG.MAX_BOUNCES) {
      var h = nearest(els, ox, oz, dx, dz, skip);
      if (h.idx < 0) {
        segs.push({ ax: ox, az: oz, bx: ox + dx * CFG.MAX_DIST, bz: oz + dz * CFG.MAX_DIST,
                    mask: mask, open: true, gain: gain });
        return;
      }
      var hx = ox + dx * h.t, hz = oz + dz * h.t, e = els[h.idx];
      segs.push({ ax: ox, az: oz, bx: hx, bz: hz, mask: mask, open: false, gain: gain });

      if (e.t === 'prism' || e.t === 'comb') {
        nodeIn[h.idx] |= mask;
        if (nodeGain && gain > (nodeGain[h.idx] || 0)) nodeGain[h.idx] = gain;
        return;
      }
      if (e.t === 'target') { tgtIn[h.idx] |= mask; return; }
      // The emitter housing is opaque. Light folded back onto its own source is
      // swallowed by the machine that made it, which is both what would happen
      // and what stops the picture reading as a mistake.
      if (e.t === 'wall' || e.t === 'emitter') { return; }

      if (e.t === 'mirror') {
        // A front-surfaced mirror has a front. The silvered face looks along
        // +n; light arriving from behind meets the dark backing and dies there.
        var s = segEnds(e);
        var ex = s[2] - s[0], ez = s[3] - s[1];
        var L = Math.hypot(ex, ez) || 1; ex /= L; ez /= L;
        var nx = -ez, nz = ex;                       // outward normal of the silvered face
        var dot = dx * nx + dz * nz;
        if (dot >= 0) return;                        // struck the backing: absorbed
        var cosI = -dot;                             // 1 = head on, 0 = grazing
        // Schlick: a mirror returns almost everything at a glancing angle and

  // the recipe: one arc per required channel
  var gap = chans.length > 1 ? 0.20 : 0.0;
  var span = (Math.PI * 2) / chans.length;
  g.lineCap = 'butt';
  for (var i = 0; i < chans.length; i++) {
    var a0 = -Math.PI / 2 + i * span + gap / 2, a1 = a0 + span - gap;
    g.strokeStyle = CH_HEX[chans[i]] || '#F2F5FF';
    g.lineWidth = S * 0.062;
    g.beginPath(); g.arc(cxp, cxp, R, a0, a1); g.stroke();
    // pale halo either side so the arc reads on any background
    g.strokeStyle = 'rgba(255,255,255,0.20)';
    g.lineWidth = S * 0.010;
    g.beginPath(); g.arc(cxp, cxp, R * 1.045, a0, a1); g.stroke();
    g.beginPath(); g.arc(cxp, cxp, R * 0.955, a0, a1); g.stroke();
  }
  // centre pip: the aiming point
  g.fillStyle = 'rgba(255,255,255,0.30)';
  g.beginPath(); g.arc(cxp, cxp, S * 0.022, 0, Math.PI * 2); g.fill();

  var tex = new THREE.CanvasTexture(cv);
  SHARED.tgtTex[mask] = tex;
  return tex;
}

function initRender() {
  renderer = new THREE.WebGLRenderer({ canvas: dom.cv, antialias: true, alpha: false });
  renderer.setClearColor(0x0B0D11, 1);
  // Never blur to save frames: cap at the device ratio, drop effects instead.
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  if (THREE.SRGBColorSpace !== undefined && renderer.outputColorSpace !== undefined)
    renderer.outputColorSpace = THREE.SRGBColorSpace;
  else if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  if (renderer.toneMapping !== undefined) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
  }

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0B0D11, 0.018);
  camera = new THREE.PerspectiveCamera(T.FOV, 1, 0.5, 300);

  scene.add(new THREE.HemisphereLight(0x2A3350, 0x05060A, 0.35));
  var fill = new THREE.DirectionalLight(0x9FB4E8, 0.28);
  fill.position.set(-6, 14, 12);
  scene.add(fill);

  var ftex = floorTexture(); ftex.repeat.set(1, 1);
  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ map: ftex, roughness: 0.96, metalness: 0.0, color: 0xffffff })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.02;
  scene.add(floor);

  // shared, pooled, never disposed by the level teardown
  SHARED.cyl = new THREE.CylinderGeometry(1, 1, 1, 14, 1, true);
  // top radius > bottom radius: the sheath and halo splay out along the throw
  SHARED.cone = new THREE.CylinderGeometry(T.BEAM_FLARE_R, 0.55, 1, 14, 1, true);
  SHARED.ringGeo = new THREE.TorusGeometry(1.35, 0.02, 6, 48);
  SHARED.spillGeo = new THREE.PlaneGeometry(1, 1);
  SHARED.spillGeo.rotateX(-Math.PI / 2);       // lies flat; local +X runs along the beam
  SHARED.glowTex = radialGlowTexture();
  SHARED.spillTex = spillTexture();
  SHARED.fanGeo = fanGeometry(C.CFG.SPREAD_DEG * T.WEDGE_SPAN, 40, 26);
  SHARED.list = [SHARED.cyl, SHARED.cone, SHARED.ringGeo, SHARED.spillGeo, SHARED.fanGeo];

  for (var wi = 0; wi < 6; wi++) {
    var wm = wedgeMaterial();
    if (!wm) break;
    var wmesh = new THREE.Mesh(SHARED.fanGeo, wm);
    wmesh.visible = false; wmesh.frustumCulled = false;
    scene.add(wmesh);
    wedges.push(wmesh);
    // the same spectrum, pooled on the matte floor beneath it
    var wf = wedgeMaterial();
    var fmesh = new THREE.Mesh(SHARED.fanGeo, wf);
    fmesh.visible = false; fmesh.frustumCulled = false;
    scene.add(fmesh);
    wedgeFloors.push(fmesh);
  }

  for (var i = 0; i < T.BEAM_POOL; i++) {
    // filament: thin, hot, nearly white-hot at the core so bloom catches it
    var a = new THREE.Mesh(SHARED.cyl, beamMaterial(0.95, 0.05, 0.85, 0.006));
    // sheath: the lit air, strong column-density falloff
    var b = new THREE.Mesh(SHARED.cone, beamMaterial(1.30, T.SCINT, 0.42, 0.013));
    // halo: very wide, very faint — this is what stops the beam looking like a stick
    var c = new THREE.Mesh(SHARED.cone, beamMaterial(2.30, T.SCINT * 0.8, 0.06, 0.026));
    // spill: the light the beam throws down onto the matte floor
    var d = new THREE.Mesh(SHARED.spillGeo, new THREE.MeshBasicMaterial({
      map: SHARED.spillTex, color: 0xffffff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    // flare: camera-facing burst where the beam terminates on something
    var e = new THREE.Sprite(new THREE.SpriteMaterial({
      map: SHARED.glowTex, color: 0xffffff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    [a, b, c, d, e].forEach(function (o) { o.visible = false; o.frustumCulled = false; scene.add(o); });
    beamHalo.push(c); beamSpill.push(d); beamSheath.push(b); beamCore.push(a); beamFlare.push(e);
  }

  // the flash where a beam strikes a mirror, and the path it takes through glass
  for (var gi = 0; gi < 12; gi++) {
    var gs = new THREE.Sprite(new THREE.SpriteMaterial({ map: SHARED.glowTex,
      color: 0xffffff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    gs.visible = false; gs.frustumCulled = false; scene.add(gs); glints.push(gs);
  }
  for (var ii = 0; ii < T.INTERNAL_POOL; ii++) {
    var im = new THREE.Mesh(SHARED.cyl, beamMaterial(1.15, 0.04, 0.90, 0.0));
    im.visible = false; im.frustumCulled = false; scene.add(im); internals.push(im);
  }
  ringMesh = new THREE.Mesh(SHARED.ringGeo,
    new THREE.MeshBasicMaterial({ color: 0xEDEFF5, transparent: true, opacity: 0 }));
  ringMesh.rotation.x = -Math.PI / 2;
  ringMesh.visible = false;
  scene.add(ringMesh);

  makeDust(T.DUST_HIGH);
  setupComposer();
  resize();
}

function makeDust(n) {
  if (dust) { scene.remove(dust); dustGeo.dispose(); dust.material.dispose(); dust = null; }
  n = Math.max(16, n | 0);
  dustGeo = new THREE.BufferGeometry();
  var pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (var i = 0; i < n; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 60;
    pos[i * 3 + 1] = Math.random() * 3.2;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 60;
  }
  var siz = new Float32Array(n);
  dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  dustGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  dustGeo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  dust = new THREE.Points(dustGeo, dustMaterial());
  dust.frustumCulled = false;
  scene.add(dust);
}

/* Dust was drawn with PointsMaterial and no map, which renders every mote as a hard
   square. Squares are the single least light-like shape available. These are
   round, soft-edged, and each mote carries its own size so a mote sitting in a
   beam does not merely brighten — it swells, the way a lit particle does. */
var DUST_VS = [
  'attribute float aSize;',
  'varying vec3 vCol; varying float vA;',
  'uniform float uScale;',
  'void main(){',
  '  vCol = color;',
  '  vA = clamp(aSize, 0.0, 1.0);',
  '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
  '  gl_PointSize = (2.0 + vA * 16.0) * uScale / max(1.0, -mv.z);',
  '  gl_Position = projectionMatrix * mv;',
  '}'
].join('\n');
var DUST_FS = [
  'varying vec3 vCol; varying float vA;',
  'void main(){',
  '  vec2 d = gl_PointCoord - vec2(0.5);',
  '  float r = length(d) * 2.0;',
  '  if (r > 1.0) discard;',
  '  float soft = pow(1.0 - r, 2.2);',
  '  float a = soft * (0.10 + vA * 0.95);',
  '  gl_FragColor = vec4(vCol * a * (1.0 + vA * 2.2), a);',
  '}'
].join('\n');

var dustShaderOK = true;
function dustMaterial() {
  if (dustShaderOK && THREE.ShaderMaterial) {
    try {
      return new THREE.ShaderMaterial({
        uniforms: { uScale: { value: 300 } },
        vertexShader: DUST_VS, fragmentShader: DUST_FS,
        transparent: true, blending: THREE.AdditiveBlending,
        depthWrite: false, vertexColors: true
      });
    } catch (e) { dustShaderOK = false; }
  }
  return new THREE.PointsMaterial({ size: 0.075, vertexColors: true, transparent: true,
    opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
}

function setupComposer() {
  composer = null; bloomPass = null;
  if (quality !== 'high') return;
  try {
    if (!THREE.EffectComposer || !THREE.RenderPass || !THREE.UnrealBloomPass) return;
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      T.BLOOM.strength * glowMul(), T.BLOOM.radius, T.BLOOM.threshold);
    composer.addPass(bloomPass);
  } catch (e) { composer = null; bloomPass = null; }
}

/* ---- level meshes ------------------------------------------------------- */
function own(o) {
  if (o.geometry && owned.geo.indexOf(o.geometry) < 0 &&
      (SHARED.list || []).indexOf(o.geometry) < 0) owned.geo.push(o.geometry);
  if (o.material && owned.mat.indexOf(o.material) < 0) owned.mat.push(o.material);
  return o;
}
// register a geometry for teardown without needing a mesh to hang it on
function own2(g) { if (owned.geo.indexOf(g) < 0 && (SHARED.list || []).indexOf(g) < 0) owned.geo.push(g); return g; }

// a soft darkening under every solid object: without it things float
function contactShadow(size) {
  var m = own(new THREE.Mesh(SHARED.spillGeo, new THREE.MeshBasicMaterial({
    map: SHARED.glowTex, color: 0x000000, transparent: true, opacity: 0.55, depthWrite: false })));
  m.position.y = -T.ELEV + 0.02;
  m.scale.set(size, 1, size);
  return m;
}

function glassMat(hex, opacity) {
  if (quality === 'high' && THREE.MeshPhysicalMaterial) {
    return new THREE.MeshPhysicalMaterial({
      color: hex, metalness: 0, roughness: 0.05, transmission: 0.95, thickness: 1.6,
      ior: 1.62, transparent: true, opacity: 1, clearcoat: 0.6, clearcoatRoughness: 0.1
    });
  }
  return new THREE.MeshStandardMaterial({
    color: hex, metalness: 0.05, roughness: 0.12, transparent: true,
    opacity: opacity === undefined ? 0.42 : opacity
  });
}

function buildLevel(lv) {
  teardown();
  levelGroup = new THREE.Group();
  scene.add(levelGroup);
  meshFor = {}; targetMeshes = {}; nodeCores = {};

  lv.emitters.forEach(function (em) {
    var g = new THREE.Group();
    var ER = C.CFG.EMITTER_R;
    // a machined housing, not a floating cube: light that comes back dies here
    var barrel = own(new THREE.Mesh(own2(new THREE.CylinderGeometry(ER, ER * 1.12, 1.5, 18)),
      new THREE.MeshStandardMaterial({ color: 0x151A24, roughness: 0.62, metalness: 0.55 })));
    barrel.rotation.z = Math.PI / 2;
    var collar = own(new THREE.Mesh(own2(new THREE.TorusGeometry(ER * 0.86, 0.055, 8, 22)),
      new THREE.MeshStandardMaterial({ color: 0x2B3448, roughness: 0.35, metalness: 0.8 })));
    collar.rotation.y = Math.PI / 2; collar.position.x = 0.42;
    var aperture = own(new THREE.Mesh(own2(new THREE.CircleGeometry(ER * 0.52, 20)),
      new THREE.MeshBasicMaterial({ color: 0xF6F9FF })));
    aperture.rotation.y = Math.PI / 2; aperture.position.x = 0.45;
    g.add(barrel); g.add(collar); g.add(aperture);
    g.add(contactShadow(ER * 3.2));
    if (SHARED.glowTex) {
      var fl = new THREE.Sprite(own(new THREE.SpriteMaterial({ map: SHARED.glowTex,
        color: 0xF2F5FF, transparent: true, opacity: 0.5,
        blending: THREE.AdditiveBlending, depthWrite: false })));
      fl.scale.set(1.7, 1.7, 1); fl.position.x = 0.42;
      g.add(fl);
    }
    g.position.set(em.x, T.ELEV, em.z);
    g.rotation.y = -em.rot * Math.PI / 180;
    levelGroup.add(g);
  });

  C.resolve(lv, {}).forEach(function (e, i) {
    var m = null;
    if (e.t === 'prism') {
      m = new THREE.Group();
      var PR = C.CFG.PRISM_R, PH = 1.7;
      var bodyGeo = own2(new THREE.CylinderGeometry(PR, PR, PH, 3));
      var body = own(new THREE.Mesh(bodyGeo, glassMat(0xE8F1FF, 0.30)));
      if (body.material.flatShading !== undefined) body.material.flatShading = true;
      // a flat face, not a vertex, points along the exit direction
      body.rotation.y = Math.PI / 6;
      m.add(body);
      // cut-glass edges: this is what makes it read as ground optical glass
      if (THREE.EdgesGeometry && THREE.LineSegments) {
        var eg = own2(new THREE.EdgesGeometry(bodyGeo));
        // Three offset copies of the silhouette in R, G and B. Cut glass
        // disperses at its own edges before it disperses anything else, and
        // this is the cheapest honest way to say so.
        var FR = [[0x8899FF, 0.030, 0.0, 0.30], [0xBFD4FF, 0, 0, 0.62], [0xFF8899, -0.030, 0.0, 0.30]];
        for (var fi2 = 0; fi2 < FR.length; fi2++) {
          var ln = new THREE.LineSegments(eg, own(new THREE.LineBasicMaterial({
            color: FR[fi2][0], transparent: true, opacity: FR[fi2][3],
            blending: THREE.AdditiveBlending, depthWrite: false })));
          ln.rotation.y = Math.PI / 6;
          ln.position.x = FR[fi2][1]; ln.position.z = FR[fi2][2];
          m.add(ln);
        }
      }
      // the interior: lights up with whatever the prism is currently receiving
      var coreMesh = own(new THREE.Mesh(
        own2(new THREE.CylinderGeometry(PR * 0.46, PR * 0.46, PH * 0.86, 3)),
        new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.0,
          blending: THREE.AdditiveBlending, depthWrite: false })));
      coreMesh.rotation.y = Math.PI / 6;
      m.add(coreMesh);
      nodeCores[i] = coreMesh;
      m.add(contactShadow(PR * 2.9));
    } else if (e.t === 'comb') {
      m = new THREE.Group();
      var cg = own2(new THREE.IcosahedronGeometry(C.CFG.COMB_R, 1));
      var cb = own(new THREE.Mesh(cg, glassMat(0xFFF4EC, 0.28)));
      if (cb.material.flatShading !== undefined) cb.material.flatShading = true;
      m.add(cb);
      if (THREE.EdgesGeometry && THREE.LineSegments) {
        m.add(new THREE.LineSegments(own2(new THREE.EdgesGeometry(cg)),
          own(new THREE.LineBasicMaterial({ color: 0xFFD9BF, transparent: true, opacity: 0.40,
            blending: THREE.AdditiveBlending, depthWrite: false }))));
      }
      var cc = own(new THREE.Mesh(own2(new THREE.IcosahedronGeometry(C.CFG.COMB_R * 0.5, 0)),
        new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending, depthWrite: false })));
      m.add(cc);
      nodeCores[i] = cc;
      m.add(contactShadow(C.CFG.COMB_R * 2.9));
    } else if (e.t === 'mirror') {
      m = new THREE.Group();
      var ml = e.len || C.CFG.MIRROR_LEN;
      // The simulation reflects off the line through the mirror's centre, so
      // the silvered face must sit exactly there and the backing behind it —
      // otherwise beams visibly bounce from inside the glass. Local +Z is the
      // outward normal, which is the side that reflects.
      var back = own(new THREE.Mesh(own2(new THREE.BoxGeometry(ml, 0.86, 0.14)),
        new THREE.MeshStandardMaterial({ color: 0x11151C, roughness: 0.92, metalness: 0.15 })));
      back.position.z = -0.072;
      var face = own(new THREE.Mesh(own2(new THREE.BoxGeometry(ml * 0.98, 0.74, 0.012)),
        new THREE.MeshStandardMaterial({ color: 0xF4F0E6, roughness: 0.02, metalness: 1.0 })));
      face.position.z = 0.006;                       // its front surface is at z = 0
      m.add(back); m.add(face);
      m.add(contactShadow(ml * 1.15));
    } else if (e.t === 'filter') {
      m = new THREE.Group();
      var fl = e.len || C.CFG.FILTER_LEN;
      var pane = own(new THREE.Mesh(own2(new THREE.BoxGeometry(fl, 0.92, 0.05)),
        new THREE.MeshStandardMaterial({ color: hexOf(e.mask), roughness: 0.15, metalness: 0,
          transparent: true, opacity: 0.42 })));
      m.add(pane);
      var frame = own(new THREE.Mesh(own2(new THREE.BoxGeometry(fl * 1.04, 0.10, 0.12)),
        new THREE.MeshStandardMaterial({ color: 0x1A2029, roughness: 0.9, metalness: 0.3 })));
      frame.position.y = 0.50; m.add(frame);
      var frame2 = frame.clone(); frame2.position.y = -0.50; m.add(frame2);
      m.add(contactShadow(fl * 1.1));
    } else if (e.t === 'wall') {
      m = new THREE.Group();
      var ww = e.w || 2, wd = e.d || 0.8;
      m.add(own(new THREE.Mesh(own2(new THREE.BoxGeometry(ww, 1.7, wd)),
        new THREE.MeshStandardMaterial({ color: 0x0D1117, roughness: 0.99, metalness: 0 }))));
      // a hairline top edge so the silhouette never dissolves into the room
      var cap = own(new THREE.Mesh(own2(new THREE.BoxGeometry(ww * 1.005, 0.035, wd * 1.005)),
        new THREE.MeshBasicMaterial({ color: 0x39415A, transparent: true, opacity: 0.75 })));
      cap.position.y = 0.86; m.add(cap);
      m.add(contactShadow(Math.max(ww, wd) * 1.25));
    } else if (e.t === 'target') {
      m = new THREE.Group();
      // the recipe plate: normal blending, so it stays readable when unlit
      var plate = own(new THREE.Mesh(new THREE.PlaneGeometry(C.CFG.TARGET_R * 3.0, C.CFG.TARGET_R * 3.0),
        new THREE.MeshBasicMaterial({ map: targetTexture(e.mask), transparent: true,
          opacity: 0.92, depthWrite: false })));
      plate.rotation.x = -Math.PI / 2; plate.position.y = 0.012;
      // the well: additive glow that fills as the target takes light
      var glow = own(new THREE.Mesh(new THREE.PlaneGeometry(C.CFG.TARGET_R * 4.4, C.CFG.TARGET_R * 4.4),
        new THREE.MeshBasicMaterial({ map: SHARED.glowTex, color: hexOf(e.mask), transparent: true,
          opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false })));
      glow.rotation.x = -Math.PI / 2; glow.position.y = 0.006;
      m.add(glow); m.add(plate);
      targetMeshes[i] = { plate: plate, glow: glow, mask: e.mask };
    }
    if (!m) return;
    m.position.set(e.x, T.ELEV, e.z);
    m.rotation.y = -(e.rot || 0) * Math.PI / 180;
    levelGroup.add(m);
    meshFor[i] = m;
  });
}

function teardown() {
  if (!levelGroup) return;
  scene.remove(levelGroup);
  owned.geo.forEach(function (g) { try { g.dispose(); } catch (e) {} });
  owned.mat.forEach(function (m) { try { m.dispose(); } catch (e) {} });
  owned = { geo: [], mat: [], tex: [] };
  levelGroup = null; meshFor = {}; targetMeshes = {}; nodeCores = {};
}

/* ---- camera fit (analytic, not guessed) --------------------------------- */
var fitState = { pitch: 52, dist: 30, cx: 0, cz: 0 };
function fitCamera() {
  if (!G.level) return;
  var w = window.innerWidth, h = window.innerHeight;
  var portrait = h >= w;
  var pitch = (portrait ? T.PITCH_PORTRAIT : T.PITCH_LANDSCAPE) * Math.PI / 180;
  var b = C.bounds(G.level);
  var cx = b.cx, cz = b.cz;

  var dirToCam = new THREE.Vector3(0, Math.sin(pitch), Math.cos(pitch));
  var right = new THREE.Vector3(1, 0, 0);
  var upv = new THREE.Vector3(0, Math.cos(pitch), -Math.sin(pitch));

  var aspect = w / Math.max(1, h);
  var tanV = Math.tan((T.FOV * Math.PI / 180) / 2);
  var tanH = tanV * aspect;

  var pts = [
    [b.minx, b.minz], [b.maxx, b.minz], [b.minx, b.maxz], [b.maxx, b.maxz]
  ];
  var d = 8;
  for (var i = 0; i < pts.length; i++) {
    var q = new THREE.Vector3(pts[i][0] - cx, T.ELEV, pts[i][1] - cz);
    var a = q.dot(dirToCam);
    var hx = Math.abs(q.dot(right)), hy = Math.abs(q.dot(upv));
    d = Math.max(d, a + (hx * T.FIT_MARGIN) / tanH, a + (hy * T.FIT_MARGIN) / tanV);
  }
  fitState = { pitch: pitch, dist: d, cx: cx, cz: cz };
  camera.position.set(cx + dirToCam.x * d, dirToCam.y * d, cz + dirToCam.z * d);
  camera.lookAt(cx, T.ELEV, cz);
  camera.aspect = aspect;
  camera.near = Math.max(0.5, d * 0.02);
  camera.far = d * 4 + 200;
  camera.updateProjectionMatrix();
}

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  fitCamera();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ============================================================================
   GAME STATE + FLOW
   ========================================================================== */
var G = {
  idx: 0, level: null, state: {}, trace: null,
  playing: false, paused: false, frozen: false,
  introUntil: 0, completeAt: 0, cdUntil: 0,
  stableSince: 0, confirm: 0,
  sel: -1, locked: -1, mode: null, litSet: {}
};

var UP = new THREE.Vector3(0, 1, 0);
var _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _q = new THREE.Quaternion();
var _ray = new THREE.Raycaster(), _plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -T.ELEV);
var _ndc = new THREE.Vector2(), _hit = new THREE.Vector3();

function screenToWorld(clientX, clientY, out) {
  _ndc.x = (clientX / window.innerWidth) * 2 - 1;
  _ndc.y = -(clientY / window.innerHeight) * 2 + 1;
  _ray.setFromCamera(_ndc, camera);
  var p = _ray.ray.intersectPlane(_plane, out || _hit);
  return p;
}

function show(el, on) { el.classList.toggle('on', !!on); }
function screenOff() {
  [dom.scrTitle, dom.scrLevels, dom.scrPause, dom.scrOpts].forEach(function (s) { show(s, false); });
}

function toast(msg) {
  dom.toast.textContent = msg;
  dom.toast.style.opacity = '.55';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { dom.toast.style.opacity = '0'; }, 3200);
}

function startLevel(i) {
  G.idx = Math.max(0, Math.min(C.LEVELS.length - 1, i));
  G.level = C.LEVELS[G.idx];
  G.state = {};
  G.level.elements.forEach(function (e, k) {
    if (e.move || e.spin) G.state[k] = { x: e.x, z: e.z, rot: e.rot || 0, tRot: e.rot || 0 };
  });
  G.sel = -1; G.locked = -1; G.mode = null; G.playing = true; G.paused = false;
  lastDetent = {};
  G.frozen = true; G.completeAt = 0; G.litSet = {};
  G.stableSince = 0; G.confirm = 0;
  AU.allDronesOff();
  buildLevel(G.level);
  fitCamera();
  screenOff(); show(dom.hud, true);
  dom.hudNum.textContent = t('room') + ' ' + (G.idx + 1);
  dom.hudName.textContent = t(G.level.key);
  dom.introNum.textContent = String(G.idx + 1).padStart(2, '0');
  dom.introName.textContent = t(G.level.key);
  dom.intro.style.opacity = '1';
  G.introUntil = performance.now() + T.INTRO_MS;
  simulate();
}

function quitToTitle() {
  G.playing = false; G.paused = false;
  AU.allDronesOff(); AU.fricStop();
  teardown();
  show(dom.hud, false);
  dom.pnl.classList.remove('on');
  screenOff(); show(dom.scrTitle, true);
  dom.btnPlay.textContent = nextUnsolved() === 0 ? (lang === 'es' ? 'empezar' : 'begin') : t('play');
}

function nextUnsolved() {
  var p = progress();
  for (var i = 0; i < C.LEVELS.length; i++) if (!p[i]) return i;
  return 0;
}
function unlockedCount() {
  var p = progress(), n = 0;
  for (var i = 0; i < C.LEVELS.length; i++) { if (p[i]) n = Math.max(n, i + 1); }
  return Math.min(C.LEVELS.length, n + 1);
}

function buildLevelGrid() {
  var p = progress(), un = unlockedCount();
  dom.grid.innerHTML = '';
  for (var i = 0; i < C.LEVELS.length; i++) {
    (function (i) {
      var b = document.createElement('button');
      b.className = 'lv' + (p[i] ? ' done' : (i < un ? ' un' : ''));
      b.innerHTML = '<span class="n">' + String(i + 1).padStart(2, '0') + '</span><span class="d"></span>';
      if (i >= un) b.disabled = true;
      b.addEventListener('click', function () { AU.resume(); AU.click(); startLevel(i); });
      dom.grid.appendChild(b);
    })(i);
  }
}

/* ---- simulation + view sync -------------------------------------------- */
function simulate() {
  G.trace = C.traceScene(G.level, G.state);
  // audio: a drone per lit target, so the room's chord is its completion state
  var lit = {};
  G.trace.targets.forEach(function (tg) {
    if (tg.lit) {
      lit[tg.i] = 1;
      if (!G.litSet[tg.i]) { AU.lock(tg.want); AU.drone('t' + tg.i, tg.want); buzz([12, 40, 24]); }
    }
  });
  Object.keys(G.litSet).forEach(function (k) { if (!lit[k]) AU.undrone('t' + k); });
  G.litSet = lit;
  AU.sour(G.trace.targets.some(function (x) { return x.sour; }));

  // A room is not solved because the light grazed a target for one frame on
  // its way past. The configuration has to be at rest, untouched, and correct
  // for CONFIRM_MS — which is also long enough for the chord to be heard.
  if (!G.trace.complete) { G.stableSince = 0; G.confirm = 0; return; }
  if (G.completeAt) return;

  var moving = (ptr && ptr.id !== null);
  if (!moving) {
    var keys = Object.keys(G.state);
    for (var ki = 0; ki < keys.length; ki++) {
      var st = G.state[keys[ki]];
      if (st.tRot !== undefined && Math.abs(st.tRot - st.rot) > T.SETTLE_EPS) { moving = true; break; }
    }
  }
  var nowMs = performance.now();
  if (moving) { G.stableSince = 0; G.confirm = 0; return; }
  if (!G.stableSince) G.stableSince = nowMs;
  G.confirm = Math.min(1, (nowMs - G.stableSince) / T.CONFIRM_MS);
  if (G.confirm >= 1) {
    G.completeAt = nowMs;
    G.frozen = true;
    G.confirm = 1;
    markDone(G.idx);
    AU.cadence();
    buzz([30, 60, 30, 60, 90]);
  }
}

function syncMeshes() {
  Object.keys(G.state).forEach(function (k) {
    var m = meshFor[k], s = G.state[k];
    if (!m) return;
    m.position.x = s.x; m.position.z = s.z;
    m.rotation.y = -s.rot * Math.PI / 180;
  });
}

/* ---- beams -------------------------------------------------------------- */
function drawBeams(now) {
  var segs = G.trace ? G.trace.segs : [];
  var n = Math.min(segs.length, T.BEAM_POOL);
  var boost = 1 + 0.55 * G.confirm * G.confirm;
  if (G.completeAt) boost = 1.55 + 2.2 * Math.min(1, (now - G.completeAt) / 320);
  var tsec = now * 0.001;

  for (var i = 0; i < T.BEAM_POOL; i++) {
    var core = beamCore[i], sh = beamSheath[i], halo = beamHalo[i];
    var spill = beamSpill[i], flare = beamFlare[i];
    if (i >= n) {
      core.visible = sh.visible = halo.visible = spill.visible = flare.visible = false;
      continue;
    }
    var s = segs[i];
    _v1.set(s.ax, T.ELEV, s.az);
    _v2.set(s.bx, T.ELEV, s.bz);
    var len = _v1.distanceTo(_v2);
    if (!(len > 0.001)) {
      core.visible = sh.visible = halo.visible = spill.visible = flare.visible = false;
      continue;
    }
    _v2.sub(_v1).divideScalar(len);
    _q.setFromUnitVectors(UP, _v2);
    var midx = s.ax + (s.bx - s.ax) * 0.5, midz = s.az + (s.bz - s.az) * 0.5;

    var col = hexOf(s.mask);
    var tail = s.open ? 1 : 0;

    // Colour-blind mode moves a beam's identity from hue into rhythm: red
    // breathes slowly, green is steady, blue shimmers.
    var amp = 1;
    if (opt.cb) {
      var hz = (s.mask === 1) ? T.CB_PULSE[1] : (s.mask === 4) ? T.CB_PULSE[4] : 0;
      if (hz) amp = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(tsec * hz * Math.PI * 2));
    }
    // light that has been through optics arrives weaker, and that is visible
    var I = amp * boost * glowMul() * (s.gain === undefined ? 1 : s.gain);

    core.visible = sh.visible = halo.visible = true;
    [core, sh, halo].forEach(function (m) {
      m.position.set(midx, T.ELEV, midz);
      m.quaternion.copy(_q);
    });
    core.scale.set(T.BEAM_CORE_R, len, T.BEAM_CORE_R);
    sh.scale.set(T.BEAM_SHEATH_R, len, T.BEAM_SHEATH_R);
    halo.scale.set(T.BEAM_HALO_R, len, T.BEAM_HALO_R);

    // The filament is pushed toward white: a saturated core reads as plastic,
    // an overexposed one reads as light that happens to be coloured.
    // only a beam carrying more than one channel can fringe
    var chans = ((s.mask & 1) ? 1 : 0) + ((s.mask & 2) ? 1 : 0) + ((s.mask & 4) ? 1 : 0);
    var fringe = chans > 1 ? (chans === 3 ? 1.0 : 0.7) : 0.0;
    // weighted toward the outer layers: most of the light lives in the air
    // around the beam, not in a bright line down its middle
    setBeamMat(core, col, 0.42 * I, tail, tsec, len, fringe * 0.30);
    setBeamMat(sh,   col, 0.50 * I, tail, tsec, len, fringe);
    setBeamMat(halo, col, 0.34 * I, tail, tsec, len, fringe * 1.5);

    // ground spill
    if (quality === 'high') {
      spill.visible = true;
      spill.position.set(midx, 0.035, midz);
      spill.rotation.y = -Math.atan2(s.bz - s.az, s.bx - s.ax);
      spill.scale.set(len, 1, T.SPILL_W);
      spill.material.color.setHex(col);
      var falloff = Math.exp(-len * 0.010);
      spill.material.opacity = T.SPILL_OP * amp * Math.min(2, boost) * falloff *
                               glowMul() * (s.open ? 0.5 : 1);
    } else { spill.visible = false; }

    // impact flare wherever the beam actually lands on something
    if (!s.open) {
      flare.visible = true;
      flare.position.set(s.bx, T.ELEV, s.bz);
      var fs = T.FLARE_S * (0.85 + 0.15 * Math.sin(tsec * 5 + i));
      flare.scale.set(fs, fs, 1);
      flare.material.color.setHex(whiten(col, 0.42));
      flare.material.opacity = Math.min(1, 0.34 * amp * boost * glowMul());
    } else { flare.visible = false; }
  }
}

/* Draw one dispersion fan per emitting prism. The fan is cut short at whatever
   the prism's own output rays actually hit, so it never bleeds through a wall. */
function drawWedges(now) {
  var used = 0;
  if (!wedges.length || !G.trace) return;
  var nodes = G.trace.nodes || [], els = G.trace.els, segs = G.trace.segs;

  for (var i = 0; i < nodes.length && used < wedges.length; i++) {
    var mask = nodes[i];
    if (!mask) continue;
    var e = els[i];
    if (e.t !== 'prism') continue;                 // only a prism disperses
    var chans = ((mask & 1) ? 1 : 0) + ((mask & 2) ? 1 : 0) + ((mask & 4) ? 1 : 0);
    if (chans < 2) continue;                       // one channel cannot fan out

    // shortest throw leaving this prism sets how far the fan is drawn
    var shortest = T.WEDGE_LEN;
    for (var j = 0; j < segs.length; j++) {
      var sg = segs[j];
      if (Math.hypot(sg.ax - e.x, sg.az - e.z) > C.CFG.PRISM_R + 0.25) continue;
      var L = Math.hypot(sg.bx - sg.ax, sg.bz - sg.az);
      if (L < shortest) shortest = L;
    }
    var len = Math.max(2.2, Math.min(T.WEDGE_LEN, shortest * 1.12));

    var w = wedges[used++];
    w.visible = true;
    w.position.set(e.x, T.ELEV, e.z);
    w.rotation.y = -e.rot * Math.PI / 180;
    w.scale.set(len, 1, len);
    var u = w.material.uniforms;
    u.uW.value.set((mask & 1) ? 1 : 0, (mask & 2) ? 1 : 0, (mask & 4) ? 1 : 0);
    u.uLen.value = len;
    u.uTime.value = now * 0.001;
    u.uInt.value = T.WEDGE_INT * (1 + 0.5 * G.confirm) * (opt.cb ? 0.7 : 1) * glowMul();

    var f = wedgeFloors[used - 1];
    if (f) {
      f.visible = true;
      f.position.set(e.x, 0.05, e.z);
      f.rotation.y = w.rotation.y;
      f.scale.set(len * 1.06, 1, len * 1.06);
      var uf = f.material.uniforms;
      uf.uW.value.copy(u.uW.value);
      uf.uLen.value = len; uf.uTime.value = u.uTime.value;
      uf.uMerge.value = T.WEDGE_MERGE * 1.25;
      uf.uInt.value = T.WEDGE_FLOOR * (1 + 0.5 * G.confirm) * (opt.cb ? 0.7 : 1) * glowMul();
    }
  }
  for (; used < wedges.length; used++) {
    wedges[used].visible = false;
    if (wedgeFloors[used]) wedgeFloors[used].visible = false;
  }
}

/* Where a beam meets a mirror there is a flash, and at a glancing angle that
   flash goes iridescent: the silvering and its substrate act as a thin film, so
   the returned light picks up a hue that depends on the angle of incidence.
   Head-on bounces stay the colour of the beam. */
function hueShift(hex, hue, amt) {
  var r = ((hex >> 16) & 255) / 255, g = ((hex >> 8) & 255) / 255, b = (hex & 255) / 255;
  var h6 = (hue % 1 + 1) % 1 * 6, x = 1 - Math.abs((h6 % 2) - 1), rr, gg, bb;
  if (h6 < 1) { rr = 1; gg = x; bb = 0; }
  else if (h6 < 2) { rr = x; gg = 1; bb = 0; }
  else if (h6 < 3) { rr = 0; gg = 1; bb = x; }
  else if (h6 < 4) { rr = 0; gg = x; bb = 1; }
  else if (h6 < 5) { rr = x; gg = 0; bb = 1; }
  else { rr = 1; gg = 0; bb = x; }
  r += (rr - r) * amt; g += (gg - g) * amt; b += (bb - b) * amt;
  return (Math.round(Math.min(1, r) * 255) << 16) |
         (Math.round(Math.min(1, g) * 255) << 8) | Math.round(Math.min(1, b) * 255);
}

function drawGlints(now) {
  var gl = (G.trace && G.trace.glints) || [];
  var tsec = now * 0.001;
  for (var i = 0; i < glints.length; i++) {
    var m = glints[i];
    if (i >= gl.length) { m.visible = false; continue; }
    var g = gl[i];
    m.visible = true;
    m.position.set(g.x, T.ELEV, g.z);
    // grazing bounces flash wider and turn iridescent; the hue runs with angle
    var sz = T.GLINT_S * (0.55 + 0.85 * g.graze) * (0.92 + 0.08 * Math.sin(tsec * 6 + i));
    m.scale.set(sz, sz, 1);
    var base = whiten(hexOf(g.mask), 0.30);
    var col = g.graze > 0 ? hueShift(base, 0.62 - g.cos * 1.1 + tsec * 0.03, g.graze * 0.75) : base;
    m.material.color.setHex(col);
    m.material.opacity = Math.min(1, (0.22 + 0.42 * g.graze) * g.gain * glowMul());
  }
}

/* The refracted path. Light does not teleport across a prism: it enters a face,
   bends, and crosses the glass before the spectrum leaves the far side. This
   draws that crossing from the real entry point to the fan's apex. */
function drawInternals(now) {
  var used = 0;
  if (!internals.length || !G.trace) return;
  var nodes = G.trace.nodes || [], els = G.trace.els, segs = G.trace.segs;
  var tsec = now * 0.001;

  for (var i = 0; i < nodes.length && used < internals.length; i++) {
    if (!nodes[i]) continue;
    var e = els[i], r = C.radiusOf(e);
    for (var j = 0; j < segs.length && used < internals.length; j++) {
      var sg = segs[j];
      if (sg.open) continue;
      // a segment that ENDS on this piece of glass is one that entered it
      if (Math.hypot(sg.bx - e.x, sg.bz - e.z) > r + 0.06) continue;
      var m = internals[used++];
      _v1.set(sg.bx, T.ELEV, sg.bz);
      _v2.set(e.x, T.ELEV, e.z);
      var len = _v1.distanceTo(_v2);
      if (!(len > 0.02)) { used--; continue; }
      _v2.sub(_v1).divideScalar(len);
      _q.setFromUnitVectors(UP, _v2);
      m.visible = true;
      m.position.set(sg.bx + (e.x - sg.bx) * 0.5, T.ELEV, sg.bz + (e.z - sg.bz) * 0.5);
      m.quaternion.copy(_q);
      m.scale.set(0.16, len, 0.16);
      setBeamMat(m, hexOf(sg.mask), 1.05 * glowMul() * (sg.gain === undefined ? 1 : sg.gain),
                 0, tsec, len, 0.8);
    }
  }
  for (; used < internals.length; used++) internals[used].visible = false;
}

// pull a colour toward white by k, so the hot core over-exposes correctly
function whiten(hex, k) {
  var r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  r = Math.round(r + (255 - r) * k);
  g = Math.round(g + (255 - g) * k);
  b = Math.round(b + (255 - b) * k);
  return (r << 16) | (g << 8) | b;
}

/* ---- dust: it knows where the beam is ----------------------------------- */
function updateDust(now, dt) {
  if (!dust) return;
  var pos = dustGeo.attributes.position.array, col = dustGeo.attributes.color.array;
  var siz = dustGeo.attributes.aSize ? dustGeo.attributes.aSize.array : null;
  var segs = G.trace ? G.trace.segs : [];
  var n = pos.length / 3, reach = T.DUST_REACH, r2 = reach * reach;
  for (var i = 0; i < n; i++) {
    var px = pos[i * 3], py = pos[i * 3 + 1], pz = pos[i * 3 + 2];
    if (!reduced) {
      pos[i * 3] = px + Math.sin(now * 0.00013 + i) * 0.0035;
      pos[i * 3 + 1] = py + Math.cos(now * 0.00011 + i * 1.7) * 0.0025;
    }
    var best = r2, bm = 0;
    for (var j = 0; j < segs.length; j++) {
      var s = segs[j];
      var ax = s.ax, az = s.az, bx = s.bx - ax, bz = s.bz - az;
      var L2 = bx * bx + bz * bz; if (L2 < 1e-6) continue;
      var tt = ((px - ax) * bx + (pz - az) * bz) / L2;
      tt = tt < 0 ? 0 : (tt > 1 ? 1 : tt);
      var dx = px - (ax + bx * tt), dz = pz - (az + bz * tt);
      var d2 = dx * dx + dz * dz + (py - T.ELEV) * (py - T.ELEV) * 0.6;
      if (d2 < best) { best = d2; bm = s.mask; }
    }
    var k = bm ? (1 - Math.sqrt(best) / reach) : 0;
    k = k < 0 ? 0 : k * k;
    var hex = hexOf(bm || 7);
    // a mote in the beam takes the beam's colour and pushes toward white at
    // the very centre, the way a real lit particle blows out
    var wk = k * k * 0.6;
    var r8 = (hex >> 16) & 255, g8 = (hex >> 8) & 255, b8 = hex & 255;
    col[i * 3]     = (r8 / 255) * k + wk + 0.010;
    col[i * 3 + 1] = (g8 / 255) * k + wk + 0.011;
    col[i * 3 + 2] = (b8 / 255) * k + wk + 0.016;
    if (siz) {
      // scintillation: motes twinkle independently, so the air looks alive
      var tw = 0.72 + 0.28 * Math.sin(now * 0.0021 + i * 2.399);
      siz[i] = k * tw;
    }
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.color.needsUpdate = true;
  if (dustGeo.attributes.aSize) dustGeo.attributes.aSize.needsUpdate = true;
  if (dust.material.uniforms) dust.material.uniforms.uScale.value = window.innerHeight * 0.42;
}

function updateNodeCores(now) {
  if (!G.trace) return;
  var nodes = G.trace.nodes || [];
  for (var k in nodeCores) {
    var c = nodeCores[k], mask = nodes[k] | 0;
    if (!c) continue;
    if (!mask) { c.material.opacity = 0.04; continue; }
    c.material.color.setHex(whiten(hexOf(mask), 0.45));
    c.material.opacity = 0.30 + 0.10 * Math.sin(now * 0.0021 + (+k)) + 0.25 * G.confirm;
  }
}

function updateTargets(now) {
  if (!G.trace) return;
  var tsec = now * 0.001;
  G.trace.targets.forEach(function (tg) {
    var m = targetMeshes[tg.i]; if (!m) return;
    var pulse = 0.5 + 0.5 * Math.sin(now * 0.0026);

    // in colour-blind mode a target breathes at its channel's own rhythm,
    // matching the beam that will satisfy it
    var amp = 1;
    if (opt.cb) {
      var hz = (tg.want === 1) ? T.CB_PULSE[1] : (tg.want === 4) ? T.CB_PULSE[4] : 0;
      if (hz) amp = 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(tsec * hz * Math.PI * 2));
    }

    if (tg.lit) {
      m.plate.material.opacity = 1;
      m.glow.material.opacity = (0.55 + 0.14 * pulse + 0.55 * G.confirm * G.confirm) * amp;
      var sc = 1 + 0.06 * pulse + 0.10 * G.confirm;
      m.glow.scale.set(sc, sc, 1);
    } else if (tg.sour) {
      // wrong colour arriving: the plate flickers, the well refuses to fill
      m.plate.material.opacity = (0.55 + 0.30 * pulse) * amp;
      m.glow.material.opacity = 0.05;
      m.glow.scale.set(1, 1, 1);
    } else {
      m.plate.material.opacity = 0.92 * amp;
      m.glow.material.opacity = 0.09;
      m.glow.scale.set(1, 1, 1);
    }
  });
}

/* ============================================================================
   INPUT
   ========================================================================== */
var ptr = { id: null, downX: 0, downY: 0, moved: false, holdT: 0, onPiece: false,
            grabDX: 0, grabDZ: 0, grabAng: 0, lastW: null, lastMoveT: 0, speed: 0 };

function elementUnder(wx, wz) {
  var els = C.resolve(G.level, G.state);
  var best = -1, bd = Infinity;
  for (var i = 0; i < els.length; i++) {
    var e = els[i];
    if (!e.move && !e.spin) continue;
    var d;
    if (e.t === 'mirror' || e.t === 'filter') {
      var s = C.segEnds(e);
      var ax = s[0], az = s[1], bx = s[2] - ax, bz = s[3] - az;
      var L2 = bx * bx + bz * bz || 1;
      var tt = ((wx - ax) * bx + (wz - az) * bz) / L2;
      tt = tt < 0 ? 0 : (tt > 1 ? 1 : tt);
      d = Math.hypot(wx - (ax + bx * tt), wz - (az + bz * tt));
      if (d > 0.9) continue;
    } else {
      d = Math.hypot(wx - e.x, wz - e.z);
      if (d > C.radiusOf(e) + 0.55) continue;
    }
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function clampToField(s) {
  var b = C.bounds(G.level), pad = 2.5;
  s.x = Math.max(b.minx - pad, Math.min(b.maxx + pad, s.x));
  s.z = Math.max(b.minz - pad, Math.min(b.maxz + pad, s.z));
}

function canInteract() {
  return G.playing && !G.paused && !G.completeAt &&
         performance.now() > G.cdUntil;
}

/* Control model
   ─────────────
   tap a piece        → it locks for rotation and wears a soft ring; from then
                        on, dragging ANYWHERE rotates it (no need to keep your
                        thumb on a small object, which is the usual mobile sin)
   drag from a piece  → rotates it directly
   press and hold     → the ring fades and the piece becomes draggable
   tap empty space    → release the lock                                      */

function beginGesture(i, w, viaLock) {
  var s = G.state[i], el = G.level.elements[i];
  G.sel = i;
  ptr.grabDX = s.x - w.x; ptr.grabDZ = s.z - w.z;
  ptr.grabAng = Math.atan2(w.z - s.z, w.x - s.x) * 180 / Math.PI - s.tRot;
  ptr.onPiece = !viaLock;
  // rotation is the default for anything that can turn
  G.mode = el.spin ? 'rot' : (el.move ? 'move' : null);
  showRing(G.mode === 'rot');
  if (!viaLock && el.move) {
    ptr.holdT = setTimeout(function () {
      if (ptr.id === null || ptr.moved) return;
      G.mode = 'move';
      G.locked = -1;
      var ww = ptr.lastW;
      ptr.grabDX = s.x - ww.x; ptr.grabDZ = s.z - ww.z;
      showRing(false);
      AU.settle(); buzz([10, 30, 10]);
    }, T.HOLD_MS);
  }
}

dom.cv.addEventListener('pointerdown', function (e) {
  AU.resume();
  if (!canInteract()) return;
  if (ptr.id !== null) return;
  var w = screenToWorld(e.clientX, e.clientY);
  if (!w) return;
  var i = elementUnder(w.x, w.z);

  if (i < 0 && G.locked >= 0) {
    // dragging open space steers the locked piece
    i = G.locked;
    try { dom.cv.setPointerCapture(e.pointerId); } catch (err) {}
    ptr.id = e.pointerId; ptr.downX = e.clientX; ptr.downY = e.clientY;
    ptr.moved = false; ptr.lastW = { x: w.x, z: w.z }; ptr.speed = 0;
    beginGesture(i, w, true);
    AU.fricStart();
    return;
  }
  if (i < 0) {                       // tap on nothing: drop the lock
    if (G.locked >= 0) { G.locked = -1; showRing(false); AU.click(); }
    return;
  }
  try { dom.cv.setPointerCapture(e.pointerId); } catch (err) {}
  ptr.id = e.pointerId; ptr.downX = e.clientX; ptr.downY = e.clientY;
  ptr.moved = false; ptr.lastW = { x: w.x, z: w.z }; ptr.speed = 0;
  beginGesture(i, w, false);
  AU.fricStart();
});

function showRing(on) {
  if (!ringMesh) return;
  var i = (G.sel >= 0) ? G.sel : G.locked;
  ringMesh.visible = !!on && i >= 0;
  ringMesh.material.opacity = ringMesh.visible ? 0.26 : 0;
  if (ringMesh.visible) {
    var s = G.state[i];
    if (s) ringMesh.position.set(s.x, T.ELEV, s.z);
  }
}

dom.cv.addEventListener('pointermove', function (e) {
  if (ptr.id !== e.pointerId || G.sel < 0) return;
  if (!canInteract()) return;
  var dx = e.clientX - ptr.downX, dy = e.clientY - ptr.downY;
  if (!ptr.moved && Math.hypot(dx, dy) > T.DRAG_THRESH) {
    ptr.moved = true; clearTimeout(ptr.holdT);
  }
  var w = screenToWorld(e.clientX, e.clientY);
  if (!w) return;
  var s = G.state[G.sel], el = G.level.elements[G.sel];
  if (ptr.lastW) {
    var d = Math.hypot(w.x - ptr.lastW.x, w.z - ptr.lastW.z);
    ptr.speed = ptr.speed * 0.7 + d * 0.3;
  }
  ptr.lastW = { x: w.x, z: w.z };
  AU.fricSet(ptr.speed * 3.2);

  if (G.mode === 'rot' && el.spin) {
    var a = Math.atan2(w.z - s.z, w.x - s.x) * 180 / Math.PI - ptr.grabAng;
    s.tRot = C.applyDetent(a);
    showRing(true);
  } else if (G.mode === 'move' && el.move) {
    s.x = w.x + ptr.grabDX; s.z = w.z + ptr.grabDZ;
    clampToField(s);
    showRing(false);
  }
});

function endPointer(e) {
  if (ptr.id !== e.pointerId) return;
  clearTimeout(ptr.holdT);
  ptr.id = null;
  AU.fricStop();
  if (!ptr.moved && !ptr.onPiece) {
    // tapped open space without steering: that is a request to let go
    G.sel = -1; G.mode = null; G.locked = -1;
    showRing(false); AU.click();
    return;
  }
  if (G.sel >= 0) {
    var el = G.level.elements[G.sel];
    if (!ptr.moved && ptr.onPiece && el && el.spin && G.mode === 'rot') {
      // a clean tap on a turnable piece locks it for rotation
      G.locked = G.sel;
      AU.tick(); buzz(14);
    } else if (G.mode === 'move') {
      AU.settle(); buzz(18);
    } else if (ptr.moved) {
      AU.settle(); buzz(18);
      if (el && el.spin) G.locked = G.sel;   // keep steering what you just turned
    }
  }
  G.mode = null;
  showRing(G.locked >= 0);
}
dom.cv.addEventListener('pointerup', endPointer);
dom.cv.addEventListener('pointercancel', endPointer);

// desktop: wheel rotates whatever is under the cursor
dom.cv.addEventListener('wheel', function (e) {
  if (e.ctrlKey || !canInteract()) return;
  var w = screenToWorld(e.clientX, e.clientY);
  if (!w) return;
  var i = elementUnder(w.x, w.z);
  if (i < 0) i = G.locked;
  if (i < 0 || !G.level.elements[i].spin) return;
  e.preventDefault();
  G.sel = i; G.locked = i;
  G.state[i].tRot = C.applyDetent(G.state[i].tRot + (e.deltaY > 0 ? 5 : -5));
}, { passive: false });

window.addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if (k === 'escape' || k === 'p') { if (G.playing) togglePause(); }
  else if (k === 'r') { if (G.playing && !G.paused) startLevel(G.idx); }
  else if ((k === 'q' || k === 'e') && canInteract()) {
    var i = (G.locked >= 0) ? G.locked : G.sel;
    if (i < 0) return;
    var el = G.level.elements[i];
    if (el && el.spin) G.state[i].tRot = C.applyDetent(G.state[i].tRot + (k === 'e' ? 15 : -15));
  }
});

/* ---- rotation inertia + detent ticks ------------------------------------ */
var lastDetent = {};
function updateRotation(dt) {
  Object.keys(G.state).forEach(function (k) {
    var s = G.state[k];
    if (s.tRot === undefined) return;
    var d = s.tRot - s.rot;
    if (Math.abs(d) < 0.02) { s.rot = s.tRot; return; }
    s.rot += d * Math.min(1, T.ROT_LAG * dt * 60);
    var idx = Math.round(s.rot / C.CFG.DETENT_DEG);
    if (lastDetent[k] !== undefined && lastDetent[k] !== idx) { AU.tick(); buzz(10); }
    lastDetent[k] = idx;
  });
}

/* ============================================================================
   MENUS
   ========================================================================== */
function togglePause() {
  if (G.completeAt) return;
  if (G.paused) {
    G.paused = false;
    show(dom.scrPause, false);
    G.cdUntil = performance.now() + 3000;
    show(dom.cd, true);
  } else {
    G.paused = true;
    AU.fricStop();
    show(dom.scrPause, true);
  }
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden && G.playing && !G.paused && !G.completeAt) togglePause();
});

function bind(el, fn) {
  el.addEventListener('click', function (e) { e.preventDefault(); AU.resume(); AU.click(); fn(); });
}
bind(dom.btnPlay, function () { startLevel(nextUnsolved()); });
bind(dom.btnLevels, function () { buildLevelGrid(); screenOff(); show(dom.scrLevels, true); });
bind(dom.btnOpts, function () { optsFrom = 'title'; screenOff(); show(dom.scrOpts, true); });
bind(dom.lvlBack, function () { screenOff(); show(dom.scrTitle, true); });
bind(dom.btnPause, function () { togglePause(); });
bind(dom.btnReset, function () { startLevel(G.idx); });
bind(dom.pResume, function () { togglePause(); });
bind(dom.pRestart, function () { G.paused = false; show(dom.scrPause, false); startLevel(G.idx); });
bind(dom.pOpts, function () { optsFrom = 'pause'; show(dom.scrPause, false); show(dom.scrOpts, true); });
bind(dom.pQuit, function () { quitToTitle(); });

var optsFrom = 'title';
bind(dom.oBack, function () {
  show(dom.scrOpts, false);
  if (optsFrom === 'pause') show(dom.scrPause, true); else show(dom.scrTitle, true);
});
bind(dom.oMusic, function () { opt.music = !opt.music; store.set('pm.music', opt.music ? 1 : 0); AU.setBus(); refreshOptionValues(); });
bind(dom.oSfx, function () { opt.sfx = !opt.sfx; store.set('pm.sfx', opt.sfx ? 1 : 0); AU.setBus(); refreshOptionValues(); });
bind(dom.oHap, function () { opt.hap = !opt.hap; store.set('pm.hap', opt.hap ? 1 : 0); buzz(18); refreshOptionValues(); });
bind(dom.oGlow, function () {
  // the menu shortcut steps to the next preset above the current value
  var p = T.GLOW_PRESETS, next = p[0];
  for (var gi = 0; gi < p.length; gi++) { if (p[gi] > opt.glowF + 0.01) { next = p[gi]; break; } }
  setGlow(next);
  if (bloomPass) bloomPass.strength = T.BLOOM.strength * glowMul();
  refreshOptionValues();
});
bind(dom.oCb, function () { opt.cb = !opt.cb; store.set('pm.cb', opt.cb ? 1 : 0); refreshOptionValues(); });
bind(dom.oQual, function () {
  quality = (quality === 'high') ? 'low' : 'high';
  store.set('pm.qual', quality);
  setupComposer();
  makeDust(quality === 'high' ? T.DUST_HIGH : T.DUST_LOW);
  if (G.level) buildLevel(G.level);
  refreshOptionValues();
});
bind(dom.oLang, function () {
  lang = (lang === 'es') ? 'en' : 'es';
  store.set('pm.lang', lang);
  applyI18n();
  if (G.level) {
    dom.hudNum.textContent = t('room') + ' ' + (G.idx + 1);
    dom.hudName.textContent = t(G.level.key);
  }
});

/* ── the control deck ──────────────────────────────────────────────────── */
function setGlow(v) {
  opt.glowF = Math.max(T.GLOW_MIN, Math.min(T.GLOW_MAX, v));
  store.set('pm.glowf', opt.glowF.toFixed(3));
  if (bloomPass) bloomPass.strength = T.BLOOM.strength * glowMul();
  syncGlowUI();
  refreshOptionValues();
}
function syncGlowUI() {
  var f = (opt.glowF - T.GLOW_MIN) / (T.GLOW_MAX - T.GLOW_MIN);
  f = Math.max(0, Math.min(1, f));
  dom.pnFill.style.width = 'calc(' + (f * 100) + '% - ' + (f * 1.64) + 'rem + 0.1rem)';
  dom.pnKnob.style.left = 'calc(' + (f * 100) + '% - ' + (f * 1.46) + 'rem + 0.09rem)';
  dom.pnIntv.textContent = Math.round(opt.glowF * 100) + '%';
}

function interactiveList() {
  var out = [];
  if (!G.level) return out;
  G.level.elements.forEach(function (e, i) { if (e.move || e.spin) out.push(i); });
  return out;
}
function cyclePiece(dir) {
  var list = interactiveList();
  if (!list.length) return;
  var at = list.indexOf(G.locked);
  at = (at < 0) ? (dir > 0 ? 0 : list.length - 1) : (at + dir + list.length) % list.length;
  G.locked = list[at];
  G.sel = G.locked;
  showRing(true);
  AU.tick(); buzz(12);
}
function nudge(dx, dz) {
  var i = G.locked;
  if (i < 0 || !G.level.elements[i] || !G.level.elements[i].move) return;
  var st = G.state[i];
  st.x += dx * T.NUDGE; st.z += dz * T.NUDGE;
  clampToField(st);
  AU.tick(); buzz(8);
}
function turn(deg) {
  var i = G.locked;
  if (i < 0 || !G.level.elements[i] || !G.level.elements[i].spin) return;
  G.state[i].tRot = C.applyDetent(G.state[i].tRot + deg);
  AU.tick(); buzz(8);
}
function updatePanel() {
  var playing = G.playing && !G.paused;
  dom.pnl.classList.toggle('on', playing);
  if (!playing) return;
  var i = G.locked, e = (i >= 0 && G.level) ? G.level.elements[i] : null;
  var list = interactiveList();
  dom.pnName.textContent = e
    ? (t(e.t) + ' · ' + (list.indexOf(i) + 1) + '/' + list.length)
    : t('pnNone');
  var canMove = !!(e && e.move), canSpin = !!(e && e.spin);
  [dom.pnUp, dom.pnDn, dom.pnLf, dom.pnRt].forEach(function (b) { b.disabled = !canMove; });
  [dom.pnRl, dom.pnRr].forEach(function (b) { b.disabled = !canSpin; });
  [dom.pnPrev, dom.pnNext].forEach(function (b) { b.disabled = list.length < 1; });
  if (e && canSpin) {
    var a = ((G.state[i].tRot % 360) + 360) % 360;
    dom.pnAng.textContent = Math.round(a) + '\u00b0';
  } else { dom.pnAng.textContent = '—'; }
}

function bindHold(el, fn) {
  // press once, then repeat while held — a cross that only fires on tap is
  // useless for the twentieth quarter-unit of travel
  var t0 = null, iv = null;
  function stop() { clearTimeout(t0); clearInterval(iv); t0 = iv = null; el.classList.remove('dn'); }
  el.addEventListener('pointerdown', function (ev) {
    if (el.disabled) return;
    ev.preventDefault(); AU.resume();
    el.classList.add('dn'); fn();
    t0 = setTimeout(function () { iv = setInterval(fn, 90); }, 340);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (k) {
    el.addEventListener(k, stop);
  });
}
bindHold(dom.pnUp, function () { nudge(0, -1); });
bindHold(dom.pnDn, function () { nudge(0, 1); });
bindHold(dom.pnLf, function () { nudge(-1, 0); });
bindHold(dom.pnRt, function () { nudge(1, 0); });
bindHold(dom.pnRl, function () { turn(-T.NUDGE_DEG); });
bindHold(dom.pnRr, function () { turn(T.NUDGE_DEG); });
dom.pnPrev.addEventListener('click', function (e) { e.preventDefault(); AU.resume(); cyclePiece(-1); });
dom.pnNext.addEventListener('click', function (e) { e.preventDefault(); AU.resume(); cyclePiece(1); });
dom.pnMin.addEventListener('click', function (e) {
  e.preventDefault(); AU.resume(); AU.click();
  var min = dom.pnl.classList.contains('min');
  dom.pnl.classList.toggle('min', !min);
  dom.pnMin.textContent = min ? '\u25be' : '\u25b4';
});

(function () {
  var dragging = false;
  function apply(clientX) {
    var w = dom.pnTrack.offsetWidth || 200;
    var left = dom.pnTrack.getBoundingClientRect ? dom.pnTrack.getBoundingClientRect().left : 0;
    var f = Math.max(0, Math.min(1, (clientX - left) / w));
    setGlow(T.GLOW_MIN + f * (T.GLOW_MAX - T.GLOW_MIN));
  }
  dom.pnTrack.addEventListener('pointerdown', function (e) {
    e.preventDefault(); AU.resume(); dragging = true;
    try { dom.pnTrack.setPointerCapture(e.pointerId); } catch (err) {}
    apply(e.clientX);
  });
  dom.pnTrack.addEventListener('pointermove', function (e) { if (dragging) apply(e.clientX); });
  ['pointerup', 'pointercancel'].forEach(function (k) {
    dom.pnTrack.addEventListener(k, function () { dragging = false; AU.click(); });
  });
})();

function refreshOptionValues() {
  dom.vMusic.textContent = opt.music ? t('on') : t('off');
  dom.vSfx.textContent = opt.sfx ? t('on') : t('off');
  dom.vHap.textContent = opt.hap ? t('on') : t('off');
  dom.vCb.textContent = opt.cb ? t('on') : t('off');
  dom.vGlow.textContent = Math.round(opt.glowF * 100) + '%';
  dom.vQual.textContent = quality === 'high' ? t('high') : t('low');
  dom.vLang.textContent = t('langName');
}

/* ============================================================================
   LOOP
   ========================================================================== */
var lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;

  if (G.playing) {
    // intro card
    if (G.introUntil) {
      if (now > G.introUntil) {
        dom.intro.style.opacity = '0';
        G.introUntil = 0; G.frozen = false;
      }
    }
    // resume countdown
    if (G.cdUntil > now) {
      dom.cd.textContent = String(Math.ceil((G.cdUntil - now) / 1000));
      show(dom.cd, true);
    } else if (dom.cd.classList.contains('on')) {
      show(dom.cd, false);
    }

    if (!G.paused) {
      updateRotation(dt);
      syncMeshes();
      if (G.locked >= 0 && ptr.id === null) showRing(true);
      updatePanel();
      simulate();
      updateTargets(now);
      updateNodeCores(now);
      drawBeams(now);
      drawWedges(now);
      drawInternals(now);
      drawGlints(now);
      updateDust(now, dt);
    }

    // completion: bleach, afterimage, advance
    if (G.completeAt) {
      var e = now - G.completeAt;
      if (!reduced) {
        if (e < 380) dom.flash.style.opacity = String(Math.min(1, e / 380));
        else dom.flash.style.opacity = String(Math.max(0, 1 - (e - 380) / 900));
      }
      if (e > T.COMPLETE_HOLD_MS && !G.advanced) {
        G.advanced = true;
        var nx = G.idx + 1;
        setTimeout(function () {
          G.advanced = false;
          dom.flash.style.opacity = '0';
          if (nx < C.LEVELS.length) startLevel(nx);
          else { quitToTitle(); toast(lang === 'es' ? 'todas las salas resueltas' : 'all rooms solved'); }
        }, 900);
      }
    }
  }

  if (composer) { try { composer.render(); } catch (err) { composer = null; } }
  else renderer.render(scene, camera);
}

/* ============================================================================
   BOOT
   ========================================================================== */
function boot() {
  if (!window.THREE) {
    dom.boot.textContent = lang === 'es' ? 'no se pudo cargar el motor 3d' : 'could not load the 3d engine';
    return;
  }
  quality = (opt.qual === 'low') ? 'low' : 'high';
  if (opt.qual === 'auto') {
    var lowish = (navigator.hardwareConcurrency || 4) <= 4 &&
                 Math.max(window.innerWidth, window.innerHeight) < 900;
    quality = lowish ? 'low' : 'high';
  }
  initRender();
  if (quality === 'low') makeDust(T.DUST_LOW);
  applyI18n();
  refreshOptionValues();
  syncGlowUI();
  dom.btnPlay.textContent = nextUnsolved() === 0 ? (lang === 'es' ? 'empezar' : 'begin') : t('play');
  dom.boot.style.display = 'none';
  setTimeout(function () { toast(t('tHold')); }, 1400);
  requestAnimationFrame(frame);
}

try { boot(); }
catch (err) {
  dom.boot.textContent = 'error: ' + (err && err.message ? err.message : err);
  if (window.console) console.error(err);
}

window.PM = { G: G, C: C, T: T, startLevel: startLevel, simulate: simulate,
  get camera() { return camera; }, fitCamera: fitCamera,
  beams: function () { return [].concat(beamCore, beamSheath, beamHalo, beamSpill, beamFlare); },
  targetTexture: function (m) { return targetTexture(m); },
  targetMeshes: function () { return targetMeshes; },
  wedges: function () { return wedges; },
  nodeCores: function () { return nodeCores; },
  meshFor: function () { return meshFor; },
  wedgeFloors: function () { return wedgeFloors; },
  dust: function () { return dust; },
  opt: function () { return opt; },
  sharedGeo: function () { return SHARED; },
  glints: function () { return glints; },
  internals: function () { return internals; } };
})();
</script>
</body>
</html>
