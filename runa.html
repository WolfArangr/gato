<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>R U N A</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{height:100%;background:#07070f;color:#f0ede8;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow-x:hidden;}
:root{--bg:#07070f;--bg2:#0f0f1c;--bg3:#171724;--bg4:#202030;--accent:#7c6af7;--accent2:#a594f9;--accent3:#c4b5fd;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--text:#f0ede8;--text2:#a09cb0;--text3:#5a5770;--border:#1e1e30;--border2:#2e2e48;--r:12px;}
body{display:flex;flex-direction:column;min-height:100%;}
header{text-align:center;padding:18px 16px 10px;}
.logo{font-size:clamp(2.2rem,9vw,3.8rem);font-weight:900;letter-spacing:.22em;background:linear-gradient(135deg,#c4b5fd 0%,#7c6af7 50%,#a594f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:5px;}
.tagline{font-size:clamp(.58rem,2vw,.76rem);color:var(--text3);letter-spacing:.14em;text-transform:uppercase;}
.nav{display:flex;gap:7px;justify-content:center;margin-top:11px;flex-wrap:wrap;}
.nbtn{padding:5px 13px;border-radius:20px;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .2s;font-weight:700;}
.nbtn:hover,.nbtn.on{border-color:var(--accent);color:var(--accent3);background:rgba(124,106,247,.12);}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 12px 22px;gap:10px;max-width:500px;margin:0 auto;width:100%;}
.sbar{width:100%;display:flex;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:9px 14px;}
.si{display:flex;flex-direction:column;align-items:center;gap:2px;}
.sl{color:var(--text3);font-size:.59rem;letter-spacing:.08em;text-transform:uppercase;}
.sv{color:var(--text);font-weight:800;font-size:.92rem;}
.sv.ac{color:var(--accent2);}
.rsec{width:100%;display:flex;flex-direction:column;gap:7px;}
.rlbl{font-size:.59rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);text-align:center;font-weight:700;}
.rcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px;display:flex;justify-content:center;align-items:center;overflow:hidden;}
.rcard canvas{display:block;border-radius:6px;}
.rpair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.abar{width:100%;display:flex;gap:6px;justify-content:center;}
.adot{flex:1;max-width:90px;height:5px;border-radius:3px;background:var(--bg4);transition:background .4s;}
.adot.u{background:var(--accent);}
.frow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:50px;align-items:center;}
.lt{width:42px;height:50px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;text-transform:uppercase;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:all .3s;}
.lt.green{background:rgba(34,197,94,.15);border-color:var(--green);color:var(--green);}
.lt.amber{background:rgba(245,158,11,.15);border-color:var(--amber);color:var(--amber);}
.lt.gray{background:rgba(107,104,128,.1);border-color:transparent;color:var(--text3);}
.iarea{width:100%;display:flex;flex-direction:column;gap:7px;align-items:center;}
.ihint{font-size:.7rem;color:var(--text3);text-align:center;}
.irow{width:100%;display:flex;gap:7px;}
#wi{flex:1;background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:1.15rem;font-weight:800;text-align:center;text-transform:uppercase;padding:12px;letter-spacing:.15em;outline:none;transition:border-color .2s;caret-color:var(--accent2);}
#wi:focus{border-color:var(--accent);}
#wi::placeholder{color:var(--text3);font-size:.82rem;letter-spacing:.05em;}
#sb{padding:12px 18px;background:var(--accent);border:none;border-radius:var(--r);color:#fff;font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s;}
#sb:hover{background:var(--accent2);transform:translateY(-1px);}
#sb:active{transform:scale(.97);}
#sb:disabled{background:var(--bg4);color:var(--text3);cursor:not-allowed;transform:none;}
.errmsg{font-size:.73rem;color:var(--red);text-align:center;min-height:18px;}
.kb{width:100%;display:flex;flex-direction:column;gap:4px;}
.kbr{display:flex;gap:3px;justify-content:center;}
.k{height:40px;min-width:26px;flex:1;max-width:36px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:.75rem;font-weight:800;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.k:active{transform:scale(.91);}
.k.w{max-width:52px;font-size:.62rem;}
.k.green{background:rgba(34,197,94,.18);border-color:var(--green);color:var(--green);}
.k.amber{background:rgba(245,158,11,.18);border-color:var(--amber);color:var(--amber);}
.k.gray{background:rgba(107,104,128,.1);border-color:transparent;color:var(--text3);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.on{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center;transform:scale(.9);transition:transform .3s;max-height:90vh;overflow-y:auto;}
.overlay.on .modal{transform:scale(1);}
.modal h2{font-size:1.35rem;font-weight:900;margin-bottom:8px;}
.modal h2.win{background:linear-gradient(135deg,#a594f9,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.modal h2.lose{color:var(--red);}
.modal p{color:var(--text2);font-size:.82rem;line-height:1.6;margin-bottom:10px;}
.mword{font-size:1.8rem;font-weight:900;letter-spacing:.22em;color:var(--accent2);padding:11px;background:var(--bg3);border-radius:10px;margin:10px 0;}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0;}
.sbox{background:var(--bg3);border-radius:8px;padding:9px 5px;text-align:center;}
.snum{font-size:1.25rem;font-weight:900;color:var(--accent2);}
.slbl{font-size:.58rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.mbtn{width:100%;padding:12px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:5px;transition:all .2s;}
.mbtn:hover{background:var(--accent2);}
.mbtn.sec{background:transparent;border:1px solid var(--border2);color:var(--text2);}
.how h3{font-size:.88rem;font-weight:700;color:var(--accent3);margin:11px 0 5px;text-align:left;}
.how p{font-size:.78rem;color:var(--text2);line-height:1.6;text-align:left;margin-bottom:6px;}
.leg{display:flex;flex-direction:column;gap:6px;margin:5px 0;}
.li{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--text2);}
.ld{width:13px;height:13px;border-radius:3px;flex-shrink:0;}
.ld.g{background:var(--green);}
.ld.a{background:var(--amber);}
.ld.gr{background:var(--text3);}
#cc{position:fixed;inset:0;pointer-events:none;z-index:200;}
@media(max-width:360px){.k{height:36px;font-size:.68rem;}.lt{width:36px;height:44px;font-size:1.05rem;}}
</style>
</head>
<body>
<header>
  <div class="logo">RUNA</div>
  <div class="tagline">Desenreda la runa · Revela la palabra</div>
  <div class="nav">
    <button class="nbtn on" id="b-day" onclick="startDaily()">Runa Diaria</button>
    <button class="nbtn" id="b-rnd" onclick="startRandom()">Nueva Runa</button>
    <button class="nbtn" onclick="showHow()">Cómo jugar</button>
  </div>
</header>
<main>
  <div class="sbar">
    <div class="si"><span class="sl">Longitud</span><span class="sv ac" id="s-len">—</span></div>
    <div class="si"><span class="sl">Intentos</span><span class="sv" id="s-tri">0/4</span></div>
    <div class="si"><span class="sl">Decodificadas</span><span class="sv" id="s-dec">0/0</span></div>
    <div class="si"><span class="sl">Encontradas</span><span class="sv" id="s-fnd">0</span></div>
  </div>
  <div class="rsec" id="rsec-main">
    <div class="rlbl">✦ Runa del día ✦</div>
    <div class="rcard"><canvas id="cm" width="300" height="300"></canvas></div>
  </div>
  <div class="rsec" id="rsec-pair" style="display:none">
    <div class="rpair">
      <div><div class="rlbl">Runa actualizada</div><div class="rcard"><canvas id="cu" width="140" height="140"></canvas></div></div>
      <div><div class="rlbl">Tu runa</div><div class="rcard"><canvas id="cg" width="140" height="140"></canvas></div></div>
    </div>
  </div>
  <div class="abar"><div class="adot" id="d0"></div><div class="adot" id="d1"></div><div class="adot" id="d2"></div><div class="adot" id="d3"></div></div>
  <div class="frow" id="frow"></div>
  <div class="iarea">
    <div class="ihint" id="hint">Estudia la runa. Escribe una palabra y pulsa Descifrar.</div>
    <div class="irow"><input type="text" id="wi" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="ESCRIBE AQUÍ"><button id="sb" onclick="go()">DESCIFRAR</button></div>
    <div class="errmsg" id="err"></div>
  </div>
  <div class="kb" id="kb"></div>
</main>
<div class="overlay" id="ov"><div class="modal" id="mi"></div></div>
<canvas id="cc"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// VECTOR GLYPH ENGINE
// Each letter defined as line segments on a 4×6 unit grid.
// Drawn as thick strokes → purely vectorial, no external fonts.
// At overlap, strokes from different letters share pixels → ambiguous glyph.
// ═══════════════════════════════════════════════════════════════════════════════

// Segments: [x1,y1, x2,y2] on 0–4 (width) × 0–6 (height) grid
// Designed to be angular, bold, readable but also ambiguous when overlaid
const G = {
  A: [[0,6,2,0],[2,0,4,6],[1,3,3,3]],
  B: [[0,0,0,6],[0,0,3,0],[3,0,4,1],[4,1,4,2.5],[4,2.5,3,3],[0,3,3,3],[3,3,4,3.5],[4,3.5,4,5],[4,5,3,6],[0,6,3,6]],
  C: [[4,1,3,0],[3,0,1,0],[1,0,0,1],[0,1,0,5],[0,5,1,6],[1,6,3,6],[3,6,4,5]],
  D: [[0,0,0,6],[0,0,3,0],[3,0,4,1],[4,1,4,5],[4,5,3,6],[0,6,3,6]],
  E: [[0,0,0,6],[0,0,4,0],[0,3,3,3],[0,6,4,6]],
  F: [[0,0,0,6],[0,0,4,0],[0,3,3,3]],
  G: [[4,1,3,0],[3,0,1,0],[1,0,0,1],[0,1,0,5],[0,5,1,6],[1,6,3,6],[3,6,4,5],[4,5,4,3],[2,3,4,3]],
  H: [[0,0,0,6],[4,0,4,6],[0,3,4,3]],
  I: [[1,0,3,0],[2,0,2,6],[1,6,3,6]],
  J: [[0,5,1,6],[1,6,3,6],[3,6,4,5],[4,5,4,0],[1,0,3,0]],
  K: [[0,0,0,6],[4,0,0,3],[0,3,4,6]],
  L: [[0,0,0,6],[0,6,4,6]],
  M: [[0,6,0,0],[0,0,2,3],[2,3,4,0],[4,0,4,6]],
  N: [[0,6,0,0],[0,0,4,6],[4,6,4,0]],
  O: [[1,0,3,0],[3,0,4,1],[4,1,4,5],[4,5,3,6],[1,6,3,6],[0,5,1,6],[0,1,0,5],[0,1,1,0]],
  P: [[0,0,0,6],[0,0,3,0],[3,0,4,1],[4,1,4,2.5],[4,2.5,3,3],[0,3,3,3]],
  Q: [[1,0,3,0],[3,0,4,1],[4,1,4,5],[4,5,3,6],[1,6,3,6],[0,5,1,6],[0,1,0,5],[0,1,1,0],[2.5,4.5,4,6]],
  R: [[0,0,0,6],[0,0,3,0],[3,0,4,1],[4,1,4,2.5],[4,2.5,3,3],[0,3,3,3],[2,3,4,6]],
  S: [[4,1,3,0],[3,0,1,0],[1,0,0,1],[0,1,0,2.5],[0,2.5,4,3.5],[4,3.5,4,5],[4,5,3,6],[1,6,3,6],[1,6,0,5]],
  T: [[0,0,4,0],[2,0,2,6]],
  U: [[0,0,0,5],[0,5,1,6],[1,6,3,6],[3,6,4,5],[4,5,4,0]],
  V: [[0,0,2,6],[2,6,4,0]],
  W: [[0,0,1,6],[1,6,2,3],[2,3,3,6],[3,6,4,0]],
  X: [[0,0,4,6],[4,0,0,6]],
  Y: [[0,0,2,3],[4,0,2,3],[2,3,2,6]],
  Z: [[0,0,4,0],[4,0,0,6],[0,6,4,6]],
};

// Draw a single glyph centered at (cx,cy) with given size, stroke color and width
function drawGlyph(ctx, letter, cx, cy, size, color, strokeW) {
  const segs = G[letter] || G['X'];
  const scale = size / 6; // grid is 6 units tall
  const offX = cx - 2 * scale; // center horizontally (grid is 4 wide)
  const offY = cy - 3 * scale; // center vertically

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = strokeW;
  ctx.lineCap = 'square';
  ctx.lineJoin = 'miter';
  ctx.beginPath();
  segs.forEach(([x1,y1,x2,y2]) => {
    ctx.moveTo(offX + x1*scale, offY + y1*scale);
    ctx.lineTo(offX + x2*scale, offY + y2*scale);
  });
  ctx.stroke();
  ctx.restore();
}

// ── MAIN RUNA DRAW ────────────────────────────────────────────────────────────
// letters: array of chars (null = decoded/absent, skip)
// colors:  null = mystery mode (all same purple), or array of 'green'/'amber'/'gray'/null
function drawRuna(canvas, letters, colors) {
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0b0b18';
  rrect(ctx, 0, 0, W, H, 8); ctx.fill();

  const active = letters.filter(Boolean);
  if (!active.length) {
    // Empty runa — show subtle dot
    ctx.fillStyle = '#2a2a3d';
    ctx.beginPath();
    ctx.arc(W/2, H/2, 4, 0, Math.PI*2);
    ctx.fill();
    drawCorners(ctx, W, H);
    return;
  }

  const cx = W/2, cy = H/2;
  // Glyph size relative to canvas — large enough to fill
  const glyphSize = Math.min(W, H) * 0.75;
  // Stroke width scales with size and number of letters (more letters → thinner)
  const baseStroke = glyphSize * 0.095;
  const sw = Math.max(baseStroke * (1 - letters.length * 0.03), glyphSize * 0.055);

  if (!colors) {
    // ── MYSTERY MODE: all letters same purple glow, fully overlapping ──────
    // Draw onto offscreen with 'lighter' blending so intersections glow brighter
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const oc = off.getContext('2d');

    letters.forEach((l, i) => {
      if (!l) return;
      oc.globalCompositeOperation = i === 0 ? 'source-over' : 'lighter';
      // Slight random-ish sub-pixel jitter per letter to avoid perfect symmetry
      const jx = Math.sin(i * 2.4) * 1.2;
      const jy = Math.cos(i * 1.7) * 0.8;
      drawGlyph(oc, l, cx + jx, cy + jy, glyphSize, 'rgba(180,160,255,0.75)', sw);
    });

    // Tint the offscreen result onto main canvas
    // 1. Draw the offscreen white strokes
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(off, 0, 0);

    // Add a subtle inner glow by drawing again with multiply
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.25;
    ctx.drawImage(off, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

  } else {
    // ── FEEDBACK MODE: each letter tinted by result ────────────────────────
    const colorMap = { green:'#22c55e', amber:'#f59e0b', gray:'#2e2c48' };

    // Draw gray letters first (dimmest), then amber, then green on top
    const layerOrder = ['gray', 'amber', 'green', null];
    layerOrder.forEach(targetColor => {
      letters.forEach((l, i) => {
        if (!l) return;
        const c = colors[i] || null;
        if (c !== targetColor) return;
        const col = colorMap[c] || '#8878ee';
        const alpha = c === 'gray' ? 0.30 : 0.90;
        const jx = Math.sin(i * 2.4) * 1.2;
        const jy = Math.cos(i * 1.7) * 0.8;
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = c === 'gray' ? 'source-over' : 'lighter';
        drawGlyph(ctx, l, cx + jx, cy + jy, glyphSize, col, sw);
      });
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  drawCorners(ctx, W, H);
}

function drawCorners(ctx, W, H) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(124,106,247,.22)';
  ctx.lineWidth = 0.8;
  ctx.lineCap = 'square';
  ctx.beginPath();
  const m=10,e=22;
  [[m,m,e,m],[m,m,m,e],[W-m,m,W-e,m],[W-m,m,W-m,e],
   [m,H-m,e,H-m],[m,H-m,m,H-e],[W-m,H-m,W-e,H-m],[W-m,H-m,W-m,H-e]
  ].forEach(([x1,y1,x2,y2])=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);});
  ctx.stroke();
}

function drawUpdated(secret, decoded) {
  const cu = document.getElementById('cu');
  cu.width = 140; cu.height = 140;
  const rem = secret.split('').map((l,i) => decoded.includes(i) ? null : l);
  drawRuna(cu, rem, null);
}

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// ═══════════════════════════════════════════════════════════════════════════════
// WORD BANK
// ═══════════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════════════════════
const ROWS=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L','Ñ'],['⌫','Z','X','C','V','B','N','M','↩']];
let GS={secret:'',len:0,att:0,max:4,decoded:[],found:[],absent:[],hist:[],over:false,won:false,stats:{g:0,w:0,s:0,b:0}};

function pick(len){
  const a=(WB[len]||WB[5]).map(w=>w.toUpperCase().replace(/[^A-Z]/g,'')).filter(w=>w.length===len);
  return a[Math.floor(Math.random()*a.length)]||'ROCA';
}
function daily(){
  const d=Math.floor(Date.now()/86400000);
  const all=Object.values(WB).flat().map(w=>w.toUpperCase().replace(/[^A-Z]/g,'')).filter(w=>w.length>=4&&w.length<=8);
  return all[d%all.length];
}

function initGame(word){
  word=(word||pick(5)).toUpperCase().replace(/[^A-Z]/g,'');
  if(word.length<4||word.length>8)word=pick(5).toUpperCase().replace(/[^A-Z]/g,'');
  GS={...GS,secret:word,len:word.length,att:0,decoded:[],found:[],absent:[],hist:[],over:false,won:false};
  document.getElementById('s-len').textContent=word.length+' letras';
  document.getElementById('s-tri').textContent='0/4';
  document.getElementById('s-dec').textContent='0/'+word.length;
  document.getElementById('s-fnd').textContent='0';
  document.getElementById('frow').innerHTML='';
  document.getElementById('err').textContent='';
  document.getElementById('wi').value='';
  document.getElementById('wi').disabled=false;
  document.getElementById('sb').disabled=false;
  document.getElementById('hint').textContent='Estudia la runa. Escribe una palabra de '+word.length+' letras y pulsa Descifrar.';
  for(let i=0;i<4;i++)document.getElementById('d'+i).className='adot';
  document.getElementById('rsec-pair').style.display='none';
  const cm=document.getElementById('cm');
  cm.width=300;cm.height=300;
  drawRuna(cm, word.split(''), null);
  buildKb();updateKb();closeOv();
}

function startDaily(){
  document.getElementById('b-day').classList.add('on');
  document.getElementById('b-rnd').classList.remove('on');
  initGame(daily());
}
function startRandom(){
  document.getElementById('b-rnd').classList.add('on');
  document.getElementById('b-day').classList.remove('on');
  const lens=[4,5,5,5,6,6,7];
  initGame(pick(lens[Math.floor(Math.random()*lens.length)]));
}

// ── KEYBOARD ──────────────────────────────────────────────────────────────────
function buildKb(){
  const kb=document.getElementById('kb');kb.innerHTML='';
  ROWS.forEach(row=>{
    const d=document.createElement('div');d.className='kbr';
    row.forEach(k=>{
      const b=document.createElement('button');
      b.className='k'+(k.length>1?' w':'');b.textContent=k;b.dataset.k=k;
      b.addEventListener('click',()=>hk(k));d.appendChild(b);
    });
    kb.appendChild(d);
  });
}
function updateKb(){
  document.querySelectorAll('.k[data-k]').forEach(b=>{
    const k=b.dataset.k;if(!k||k.length>1)return;
    b.className='k'+(k.length>1?' w':'');
    if(GS.absent.includes(k))b.classList.add('gray');
    else if(GS.decoded.some(i=>GS.secret[i]===k))b.classList.add('green');
    else if(GS.found.includes(k))b.classList.add('amber');
  });
}
function hk(k){
  if(GS.over)return;
  const inp=document.getElementById('wi');
  if(k==='⌫')inp.value=inp.value.slice(0,-1);
  else if(k==='↩')go();
  else if(inp.value.length<GS.len)inp.value+=(k==='Ñ'?'Ñ':k);
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
function go(){
  if(GS.over)return;
  const inp=document.getElementById('wi');
  let raw=inp.value.toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ]/g,'');
  const word=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Ñ/g,'N');
  if(word.length!==GS.len){showErr('La palabra debe tener exactamente '+GS.len+' letras.');return;}
  if(!/^[A-Z]+$/.test(word)){showErr('Solo letras del alfabeto español.');return;}

  const s=GS.secret;
  const colors=Array(GS.len).fill('gray');
  const sa=s.split(''),ga=word.split(''),used=Array(GS.len).fill(false);

  for(let i=0;i<GS.len;i++){
    if(ga[i]===sa[i]){colors[i]='green';used[i]=true;if(!GS.decoded.includes(i))GS.decoded.push(i);}
  }
  for(let i=0;i<GS.len;i++){
    if(colors[i]==='green')continue;
    for(let j=0;j<GS.len;j++){
      if(!used[j]&&ga[i]===sa[j]){colors[i]='amber';used[j]=true;if(!GS.found.includes(ga[i]))GS.found.push(ga[i]);break;}
    }
    if(colors[i]==='gray'&&!sa.includes(ga[i])&&!GS.absent.includes(ga[i]))GS.absent.push(ga[i]);
  }

  GS.hist.push({word:raw,colors});GS.att++;
  document.getElementById('d'+(GS.att-1)).classList.add('u');
  renderFB(raw,colors);
  document.getElementById('s-tri').textContent=GS.att+'/4';
  document.getElementById('s-dec').textContent=GS.decoded.length+'/'+GS.len;
  document.getElementById('s-fnd').textContent=GS.found.length;

  document.getElementById('rsec-pair').style.display='block';

  const cm=document.getElementById('cm');cm.width=300;cm.height=300;
  drawRuna(cm, s.split(''), null);
  drawUpdated(s, GS.decoded);

  const cg=document.getElementById('cg');cg.width=140;cg.height=140;
  drawRuna(cg, word.split(''), colors);

  updateKb();inp.value='';

  const win=colors.every(c=>c==='green')||GS.decoded.length===GS.len;
  if(win){
    GS.won=true;GS.over=true;GS.stats.g++;GS.stats.w++;GS.stats.s++;
    if(GS.stats.s>GS.stats.b)GS.stats.b=GS.stats.s;
    setTimeout(()=>{doConfetti();showWin();},420);
  } else if(GS.att>=GS.max){
    GS.over=true;GS.stats.g++;GS.stats.s=0;
    setTimeout(showLose,420);
  }
  inp.disabled=GS.over;
  document.getElementById('sb').disabled=GS.over;
}

function renderFB(word,colors){
  const r=document.getElementById('frow');r.innerHTML='';
  word.split('').forEach((l,i)=>{
    const t=document.createElement('div');t.className='lt '+colors[i];t.textContent=l;
    t.style.cssText='opacity:0;transform:scale(.65)';
    setTimeout(()=>{t.style.cssText='transition:all .25s ease;opacity:1;transform:scale(1)';},i*60);
    r.appendChild(t);
  });
}
function showErr(m){const e=document.getElementById('err');e.textContent=m;setTimeout(()=>e.textContent='',2600);}

// ── MODALS ────────────────────────────────────────────────────────────────────
function showWin(){
  document.getElementById('mi').innerHTML=`<h2 class="win">¡RUNA DESCIFRADA!</h2><p>Desenredaste la runa en <strong>${GS.att}</strong> ${GS.att===1?'intento':'intentos'}.</p><div class="mword">${GS.secret}</div><div class="sgrid"><div class="sbox"><div class="snum">${GS.stats.g}</div><div class="slbl">Partidas</div></div><div class="sbox"><div class="snum">${GS.stats.s}</div><div class="slbl">Racha</div></div><div class="sbox"><div class="snum">${GS.stats.g?Math.round(GS.stats.w/GS.stats.g*100):0}%</div><div class="slbl">Victorias</div></div></div><button class="mbtn" onclick="startRandom()">Nueva Runa →</button><button class="mbtn sec" onclick="closeOv()" style="margin-top:5px">Ver tablero</button>`;
  openOv();
}
function showLose(){
  document.getElementById('mi').innerHTML=`<h2 class="lose">Runa no descifrada</h2><p>La palabra secreta era:</p><div class="mword">${GS.secret}</div><p style="font-size:.75rem;color:var(--text3)">Mejor suerte la próxima vez.</p><button class="mbtn" onclick="startRandom()">Nueva Runa →</button><button class="mbtn sec" onclick="closeOv()" style="margin-top:5px">Ver tablero</button>`;
  openOv();
}
function showHow(){
  document.getElementById('mi').innerHTML=`<h2 style="color:var(--accent3);margin-bottom:10px">Cómo jugar</h2><div class="how"><h3>La Runa</h3><p>La palabra secreta está oculta en la runa: todas sus letras dibujadas exactamente en el mismo punto, sus trazos superpuestos creando una figura ambigua que parece un símbolo desconocido.</p><h3>Tu objetivo</h3><p>Descifra la runa en 4 intentos. Escribe una palabra del mismo número de letras y pulsa <strong>Descifrar</strong>.</p><h3>Colores de pista</h3><div class="leg"><div class="li"><div class="ld g"></div>Letra en posición correcta → desaparece de la Runa Actualizada</div><div class="li"><div class="ld a"></div>Letra en la palabra pero en otra posición</div><div class="li"><div class="ld gr"></div>Letra no está en la palabra</div></div><h3>La Runa Actualizada</h3><p>Cada letra descifrada desaparece, desenredando el símbolo poco a poco.</p></div><button class="mbtn" onclick="closeOv()" style="margin-top:13px">¡Entendido!</button>`;
  openOv();
}
function openOv(){document.getElementById('ov').classList.add('on');}
function closeOv(){document.getElementById('ov').classList.remove('on');}
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeOv();});

// ── INPUT ─────────────────────────────────────────────────────────────────────
document.getElementById('wi').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
document.getElementById('wi').addEventListener('input',e=>{
  let v=e.target.value.toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ]/g,'');
  if(v.length>GS.len)v=v.slice(0,GS.len);
  e.target.value=v;
});

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function doConfetti(){
  const cv=document.getElementById('cc');cv.width=innerWidth;cv.height=innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['#7c6af7','#a594f9','#22c55e','#f59e0b','#c4b5fd','#fff'];
  const ps=Array.from({length:120},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,w:Math.random()*9+4,h:Math.random()*5+2,c:cols[Math.floor(Math.random()*cols.length)],vx:(Math.random()-.5)*2.5,vy:Math.random()*3+1.5,r:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.18}));
  let f=0;
  (function loop(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-f/130);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});f++;if(f<160)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height);})();
}

// ── START ─────────────────────────────────────────────────────────────────────
buildKb();
startDaily();
</script>
