<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RUNA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html{height:100%;}
body{background:#07070f;color:#f0ede8;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow-x:hidden;min-height:100%;display:flex;flex-direction:column;}
:root{
  --bg:#07070f;--bg2:#0f0f1c;--bg3:#171724;--bg4:#202030;
  --accent:#7c6af7;--accent2:#a594f9;--accent3:#c4b5fd;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--gold:#fbbf24;
  --text:#f0ede8;--text2:#a09cb0;--text3:#5a5770;
  --border:#1e1e30;--border2:#2e2e48;--r:12px;
}
header{text-align:center;padding:14px 16px 8px;}
.logo{font-size:clamp(1.9rem,8vw,3.4rem);font-weight:900;letter-spacing:.22em;background:linear-gradient(135deg,#c4b5fd 0%,#7c6af7 50%,#a594f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:4px;}
.tagline{font-size:clamp(.55rem,1.9vw,.74rem);color:var(--text3);letter-spacing:.14em;text-transform:uppercase;}
.nav{display:flex;gap:6px;justify-content:center;margin-top:9px;flex-wrap:wrap;}
.nbtn{padding:5px 12px;border-radius:20px;font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .2s;font-weight:700;}
.nbtn:hover,.nbtn.on{border-color:var(--accent);color:var(--accent3);background:rgba(124,106,247,.12);}

main{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 10px 16px;gap:8px;max-width:480px;margin:0 auto;width:100%;}

/* status bar */
.sbar{width:100%;display:flex;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;}
.si{display:flex;flex-direction:column;align-items:center;gap:1px;}
.sl{color:var(--text3);font-size:.55rem;letter-spacing:.07em;text-transform:uppercase;}
.sv{color:var(--text);font-weight:800;font-size:.88rem;}
.sv.ac{color:var(--accent2);}

/* runa sections */
.rsec{width:100%;display:flex;flex-direction:column;gap:6px;}
.rlbl{font-size:.57rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);text-align:center;font-weight:700;}
.rcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative;}
.rcard canvas{display:block;border-radius:6px;}
.rpair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* attempt dots */
.abar{width:100%;display:flex;gap:5px;justify-content:center;}
.adot{flex:1;max-width:88px;height:4px;border-radius:3px;background:var(--bg4);transition:background .4s;}
.adot.u{background:var(--accent);}

/* feedback tiles */
.frow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:46px;align-items:center;}
.lt{width:clamp(34px,8vw,42px);height:clamp(40px,9vw,50px);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:clamp(1rem,3.5vw,1.25rem);font-weight:900;text-transform:uppercase;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:all .3s;}
.lt.green{background:rgba(34,197,94,.15);border-color:var(--green);color:var(--green);}
.lt.amber{background:rgba(245,158,11,.15);border-color:var(--amber);color:var(--amber);}
.lt.gray{background:rgba(107,104,128,.1);border-color:transparent;color:var(--text3);}

/* hint row with pista button */
.hintrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ihint{flex:1;font-size:.67rem;color:var(--text3);text-align:center;}
#pista-btn{
  padding:6px 12px;border-radius:20px;border:1px solid var(--amber);
  background:rgba(251,191,36,.08);color:var(--amber);
  font-size:.65rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;
}
#pista-btn:hover{background:rgba(251,191,36,.2);}
#pista-btn:disabled{opacity:.3;cursor:not-allowed;}
#pista-count{font-size:.58rem;color:var(--amber);opacity:.7;margin-top:2px;text-align:center;}

/* input row */
.irow{width:100%;display:flex;gap:6px;}
#wi{
  flex:1;min-width:0;background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r);
  color:var(--text);font-size:clamp(.95rem,3.5vw,1.15rem);font-weight:800;text-align:center;
  text-transform:uppercase;padding:10px 8px;letter-spacing:.15em;outline:none;
  transition:border-color .2s;caret-color:var(--accent2);
}
#wi:focus{border-color:var(--accent);}
#wi::placeholder{color:var(--text3);font-size:.78rem;letter-spacing:.04em;}
#sb{
  padding:10px 14px;background:var(--accent);border:none;border-radius:var(--r);
  color:#fff;font-size:clamp(.7rem,2.8vw,.82rem);font-weight:900;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;
}
#sb:hover{background:var(--accent2);transform:translateY(-1px);}
#sb:active{transform:scale(.97);}
#sb:disabled{background:var(--bg4);color:var(--text3);cursor:not-allowed;transform:none;}
.errmsg{font-size:.71rem;color:var(--red);text-align:center;min-height:17px;}

/* keyboard */
.kb{width:100%;display:flex;flex-direction:column;gap:3px;}
.kbr{display:flex;gap:3px;justify-content:center;}
.k{
  height:clamp(34px,8.5vw,40px);min-width:0;flex:1;max-width:clamp(28px,8vw,36px);
  border-radius:5px;background:var(--bg3);border:1px solid var(--border);
  color:var(--text2);font-size:clamp(.65rem,2.5vw,.75rem);font-weight:800;
  text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.k:active{transform:scale(.91);}
.k.w{max-width:clamp(44px,11vw,52px);font-size:clamp(.56rem,2vw,.63rem);}
.k.green{background:rgba(34,197,94,.18);border-color:var(--green);color:var(--green);}
.k.amber{background:rgba(245,158,11,.18);border-color:var(--amber);color:var(--amber);}
.k.gray{background:rgba(107,104,128,.1);border-color:transparent;color:var(--text3);}

/* known letters row (from hints) */
.known-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:0;}
.klt{
  width:clamp(30px,7.5vw,38px);height:clamp(36px,8.5vw,44px);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(.9rem,3vw,1.1rem);font-weight:900;text-transform:uppercase;
  background:rgba(34,197,94,.2);border:1.5px solid var(--green);color:var(--green);
}
.klt.empty{background:rgba(255,255,255,.03);border:1.5px dashed var(--border2);color:var(--text3);}

/* overlay / modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.on{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center;transform:scale(.9);transition:transform .3s;max-height:90vh;overflow-y:auto;}
.overlay.on .modal{transform:scale(1);}
.modal h2{font-size:1.3rem;font-weight:900;margin-bottom:7px;}
.modal h2.win{background:linear-gradient(135deg,#a594f9,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.modal h2.lose{color:var(--red);}
.modal p{color:var(--text2);font-size:.8rem;line-height:1.6;margin-bottom:8px;}
.mword{font-size:1.7rem;font-weight:900;letter-spacing:.22em;color:var(--accent2);padding:10px;background:var(--bg3);border-radius:10px;margin:9px 0;}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;}
.sbox{background:var(--bg3);border-radius:8px;padding:8px 4px;text-align:center;}
.snum{font-size:1.2rem;font-weight:900;color:var(--accent2);}
.slbl{font-size:.56rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.mbtn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:.82rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:5px;transition:all .2s;}
.mbtn:hover{background:var(--accent2);}
.mbtn.sec{background:transparent;border:1px solid var(--border2);color:var(--text2);}
.how h3{font-size:.85rem;font-weight:700;color:var(--accent3);margin:10px 0 4px;text-align:left;}
.how p{font-size:.76rem;color:var(--text2);line-height:1.6;text-align:left;margin-bottom:5px;}
.leg{display:flex;flex-direction:column;gap:5px;margin:4px 0;}
.li{display:flex;align-items:center;gap:7px;font-size:.73rem;color:var(--text2);}
.ld{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.ld.g{background:var(--green);}
.ld.a{background:var(--amber);}
.ld.gr{background:var(--text3);}

/* animation overlay */
.anim-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(7,7,15,.92);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;}
.anim-overlay.on{opacity:1;pointer-events:all;}
.anim-overlay canvas{border-radius:12px;}
.anim-skip{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:8px 20px;border:1px solid var(--border2);border-radius:20px;background:transparent;color:var(--text3);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;}

/* coffee / footer */
footer{text-align:center;padding:14px 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));}
.coffee-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 22px;border-radius:30px;
  background:linear-gradient(135deg,#1a1a2e,#252540);
  border:1px solid #3a3a60;color:#d4c8ff;
  font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;text-decoration:none;transition:all .25s;
}
.coffee-btn:hover{border-color:var(--accent2);color:#fff;background:linear-gradient(135deg,#1e1e38,#2e2e50);}
.coffee-icon{font-size:1rem;}

/* confetti */
#cc{position:fixed;inset:0;pointer-events:none;z-index:200;}
</style>
</head>
<body>
<header>
  <div class="logo">RUNA</div>
  <div class="tagline">Desenreda la runa · Revela la palabra</div>
  <div class="nav">
    <button class="nbtn on" id="b-day" onclick="startDaily()">Runa Diaria</button>
    <button class="nbtn" id="b-rnd" onclick="startRandom()">Nueva Runa</button>
    <button class="nbtn" onclick="showHow()">Cómo jugar</button>
  </div>
</header>

<main>
  <div class="sbar">
    <div class="si"><span class="sl">Longitud</span><span class="sv ac" id="s-len">—</span></div>
    <div class="si"><span class="sl">Intentos</span><span class="sv" id="s-tri">0/4</span></div>
    <div class="si"><span class="sl">Decodificadas</span><span class="sv" id="s-dec">0/0</span></div>
    <div class="si"><span class="sl">Encontradas</span><span class="sv" id="s-fnd">0</span></div>
  </div>

  <div class="rsec" id="rsec-main">
    <div class="rlbl">✦ Runa del día ✦</div>
    <div class="rcard"><canvas id="cm" width="260" height="260"></canvas></div>
  </div>

  <div class="rsec" id="rsec-pair" style="display:none">
    <div class="rpair">
      <div><div class="rlbl">Runa actualizada</div><div class="rcard"><canvas id="cu" width="130" height="130"></canvas></div></div>
      <div><div class="rlbl">Tu runa</div><div class="rcard"><canvas id="cg" width="130" height="130"></canvas></div></div>
    </div>
  </div>

  <!-- known letters from hints -->
  <div class="known-row" id="known-row" style="display:none"></div>

  <div class="abar"><div class="adot" id="d0"></div><div class="adot" id="d1"></div><div class="adot" id="d2"></div><div class="adot" id="d3"></div></div>
  <div class="frow" id="frow"></div>

  <div class="iarea" style="width:100%;display:flex;flex-direction:column;gap:6px;align-items:center;">
    <div class="hintrow">
      <div style="flex:1"></div>
      <div class="ihint" id="hint">Estudia la runa y escribe una palabra.</div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:flex-end;">
        <button id="pista-btn" onclick="usePista()">💡 Pista</button>
        <div id="pista-count"></div>
      </div>
    </div>
    <div class="irow">
      <input type="text" id="wi" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="ESCRIBE AQUÍ">
      <button id="sb" onclick="go()">DESCIFRAR</button>
    </div>
    <div class="errmsg" id="err"></div>
  </div>

  <div class="kb" id="kb"></div>
</main>

<footer>
  <a class="coffee-btn" href="https://www.paypal.me/wolfhiguchi" target="_blank" rel="noopener">
    <span class="coffee-icon">☕</span>
    <span>Invítame a un café</span>
  </a>
</footer>

<!-- animation overlay -->
<div class="anim-overlay" id="anim-overlay">
  <canvas id="anim-canvas" width="280" height="280"></canvas>
  <button class="anim-skip" onclick="skipAnim()">Saltar →</button>
</div>

<div class="overlay" id="ov"><div class="modal" id="mi"></div></div>
<canvas id="cc"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// VECTOR GLYPH ENGINE — 4×6 grid, purely vectorial strokes
// ═══════════════════════════════════════════════════════════════════════════════
const GL = {
  A:[[0,6,2,0],[2,0,4,6],[1,3,3,3]],
  B:[[0,0,0,6],[0,0,3,0],[3,0,4,1],[4,1,4,2.5],[4,2.5,3,3],[0,3,3,3],[3,3,4,3.5],[4,3.5,4,5],[4,5,3,6],[0,6,3,6]],
  C:[[4,1,3,0],[3,0,1,0],[1,0,0,1],[0,1,0,5],[0,5,1,6],[1,6,3,6],[3,6,4,5]],
  D:[[0,0,0,6],[0,0,3,0],[3,0,4,1],[4,1,4,5],[4,5,3,6],[0,6,3,6]],
  E:[[0,0,0,6],[0,0,4,0],[0,3,3,3],[0,6,4,6]],
  F:[[0,0,0,6],[0,0,4,0],[0,3,3,3]],
  G:[[4,1,3,0],[3,0,1,0],[1,0,0,1],[0,1,0,5],[0,5,1,6],[1,6,3,6],[3,6,4,5],[4,5,4,3],[2,3,4,3]],
  H:[[0,0,0,6],[4,0,4,6],[0,3,4,3]],
  I:[[1,0,3,0],[2,0,2,6],[1,6,3,6]],
  J:[[0,5,1,6],[1,6,3,6],[3,6,4,5],[4,5,4,0],[1,0,3,0]],
  K:[[0,0,0,6],[4,0,0,3],[0,3,4,6]],
  L:[[0,0,0,6],[0,6,4,6]],
  M:[[0,6,0,0],[0,0,2,3],[2,3,4,0],[4,0,4,6]],
  N:[[0,6,0,0],[0,0,4,6],[4,6,4,0]],
  O:[[1,0,3,0],[3,0,4,1],[4,1,4,5],[4,5,3,6],[1,6,3,6],[0,5,1,6],[0,1,0,5],[0,1,1,0]],
  P:[[0,0,0,6],[0,0,3,0],[3,0,4,1],[4,1,4,2.5],[4,2.5,3,3],[0,3,3,3]],
  Q:[[1,0,3,0],[3,0,4,1],[4,1,4,5],[4,5,3,6],[1,6,3,6],[0,5,1,6],[0,1,0,5],[0,1,1,0],[2.5,4.5,4,6]],
  R:[[0,0,0,6],[0,0,3,0],[3,0,4,1],[4,1,4,2.5],[4,2.5,3,3],[0,3,3,3],[2,3,4,6]],
  S:[[4,1,3,0],[3,0,1,0],[1,0,0,1],[0,1,0,2.5],[0,2.5,4,3.5],[4,3.5,4,5],[4,5,3,6],[1,6,3,6],[1,6,0,5]],
  T:[[0,0,4,0],[2,0,2,6]],
  U:[[0,0,0,5],[0,5,1,6],[1,6,3,6],[3,6,4,5],[4,5,4,0]],
  V:[[0,0,2,6],[2,6,4,0]],
  W:[[0,0,1,6],[1,6,2,3],[2,3,3,6],[3,6,4,0]],
  X:[[0,0,4,6],[4,0,0,6]],
  Y:[[0,0,2,3],[4,0,2,3],[2,3,2,6]],
  Z:[[0,0,4,0],[4,0,0,6],[0,6,4,6]],
};

function drawGlyph(ctx, letter, cx, cy, size, color, strokeW) {
  const segs = GL[letter] || GL['X'];
  const scale = size / 6;
  const ox = cx - 2*scale, oy = cy - 3*scale;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = strokeW;
  ctx.lineCap = 'square';
  ctx.lineJoin = 'miter';
  ctx.beginPath();
  segs.forEach(([x1,y1,x2,y2])=>{
    ctx.moveTo(ox+x1*scale, oy+y1*scale);
    ctx.lineTo(ox+x2*scale, oy+y2*scale);
  });
  ctx.stroke();
  ctx.restore();
}

function drawRuna(canvas, letters, colors) {
  const W=canvas.width, H=canvas.height;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0b0b18';
  rrect(ctx,0,0,W,H,8); ctx.fill();

  const active = letters.filter(Boolean);
  if (!active.length) {
    ctx.fillStyle='#1e1e30';
    ctx.beginPath(); ctx.arc(W/2,H/2,5,0,Math.PI*2); ctx.fill();
    drawCorners(ctx,W,H); return;
  }

  const cx=W/2, cy=H/2;
  const sz = Math.min(W,H)*0.76;
  const sw = Math.max(sz*0.092*(1-letters.length*0.025), sz*0.052);

  if (!colors) {
    // mystery: all letters overlaid with 'lighter' blend → shared pixels glow
    letters.forEach((l,i)=>{
      if(!l)return;
      ctx.globalCompositeOperation = i===0?'source-over':'lighter';
      const jx=Math.sin(i*2.4)*1.1, jy=Math.cos(i*1.7)*0.7;
      drawGlyph(ctx,l,cx+jx,cy+jy,sz,'rgba(170,148,249,0.72)',sw);
    });
    // add a second glow pass
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=0.18;
    letters.forEach((l,i)=>{
      if(!l)return;
      const jx=Math.sin(i*2.4)*1.1, jy=Math.cos(i*1.7)*0.7;
      drawGlyph(ctx,l,cx+jx,cy+jy,sz,'rgba(200,180,255,1)',sw*1.8);
    });
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  } else {
    const cmap={green:'#22c55e',amber:'#f59e0b',gray:'#2a2840'};
    ['gray','amber','green'].forEach(tier=>{
      letters.forEach((l,i)=>{
        if(!l||colors[i]!==tier)return;
        const col=cmap[tier]||'#8878ee';
        const alpha=tier==='gray'?0.28:0.88;
        const jx=Math.sin(i*2.4)*1.1, jy=Math.cos(i*1.7)*0.7;
        ctx.globalAlpha=alpha;
        ctx.globalCompositeOperation=tier==='gray'?'source-over':'lighter';
        drawGlyph(ctx,l,cx+jx,cy+jy,sz,col,sw);
      });
    });
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  drawCorners(ctx,W,H);
}

function drawCorners(ctx,W,H){
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(124,106,247,.20)'; ctx.lineWidth=0.8; ctx.lineCap='square';
  ctx.beginPath();
  const m=10,e=22;
  [[m,m,e,m],[m,m,m,e],[W-m,m,W-e,m],[W-m,m,W-m,e],
   [m,H-m,e,H-m],[m,H-m,m,H-e],[W-m,H-m,W-e,H-m],[W-m,H-m,W-m,H-e]
  ].forEach(([x1,y1,x2,y2])=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);});
  ctx.stroke();
}
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// ═══════════════════════════════════════════════════════════════════════════════
// RUNA FORMATION ANIMATION
// Letters fall in one by one, each landing ON TOP of the previous
// ═══════════════════════════════════════════════════════════════════════════════
let animRAF=null, animDone=null;

function playRunaAnim(letters, onComplete) {
  const overlay=document.getElementById('anim-overlay');
  const canvas=document.getElementById('anim-canvas');
  const W=canvas.width=280, H=canvas.height=280;
  const ctx=canvas.getContext('2d');
  overlay.classList.add('on');

  // Clear any previous
  if(animRAF){cancelAnimationFrame(animRAF);animRAF=null;}
  animDone=onComplete;

  const n=letters.length;
  const sz=Math.min(W,H)*0.76;
  const sw=Math.max(sz*0.092*(1-n*0.025),sz*0.052);
  const cx=W/2, cy=H/2;

  // Each letter animates from top, falls to center
  let phase=0; // which letter is currently falling
  let t=0;     // frame timer for current phase
  const FALL_FRAMES=22; // frames per letter fall
  const HOLD_FRAMES=8;  // frames to hold before next letter

  const landed=[]; // letters already at rest

  function frame(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#0b0b18';
    rrect(ctx,0,0,W,H,8); ctx.fill();

    // Draw all landed letters
    landed.forEach((l,i)=>{
      ctx.globalCompositeOperation=i===0?'source-over':'lighter';
      const jx=Math.sin(i*2.4)*1.1, jy=Math.cos(i*1.7)*0.7;
      drawGlyph(ctx,l,cx+jx,cy+jy,sz,'rgba(170,148,249,0.72)',sw);
    });

    // Draw current falling letter
    if(phase<n){
      const l=letters[phase];
      if(l){
        const progress=Math.min(t/FALL_FRAMES,1);
        // ease-out cubic
        const ease=1-Math.pow(1-progress,3);
        const startY=cy-H*0.9;
        const curY=startY+(cy-startY)*ease;
        // alpha fades in as it falls
        const alpha=0.5+0.4*ease;
        ctx.globalCompositeOperation=landed.length===0?'source-over':'lighter';
        ctx.globalAlpha=alpha;
        const jx=Math.sin(phase*2.4)*1.1;
        drawGlyph(ctx,l,cx+jx,curY,sz,'rgba(200,180,255,0.9)',sw);
        ctx.globalAlpha=1;
      }
    }

    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    drawCorners(ctx,W,H);

    // Progress indicator
    ctx.fillStyle='rgba(124,106,247,.3)';
    for(let i=0;i<n;i++){
      const rx=cx-((n-1)/2)*14+i*14, ry=H-14;
      ctx.beginPath();
      ctx.arc(rx,ry,3,0,Math.PI*2);
      ctx.fillStyle=i<landed.length?'rgba(165,148,249,.9)':'rgba(124,106,247,.2)';
      ctx.fill();
    }

    t++;
    if(t>=FALL_FRAMES+HOLD_FRAMES){
      // land this letter
      if(phase<n && letters[phase]) landed.push(letters[phase]);
      phase++;
      t=0;
    }

    if(phase>=n && t>HOLD_FRAMES){
      // done
      finishAnim();
      return;
    }
    animRAF=requestAnimationFrame(frame);
  }
  animRAF=requestAnimationFrame(frame);
}

function finishAnim(){
  if(animRAF){cancelAnimationFrame(animRAF);animRAF=null;}
  const overlay=document.getElementById('anim-overlay');
  overlay.classList.remove('on');
  if(animDone){animDone();animDone=null;}
}
function skipAnim(){finishAnim();}

// GAME STATE
// ═══════════════════════════════════════════════════════════════════════════════
const ROWS=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L','Ñ'],['⌫','Z','X','C','V','B','N','M','↩']];

let GS={
  secret:'',len:0,att:0,max:4,
  decoded:[],   // indices correctly placed
  found:[],     // letters present but wrong pos
  absent:[],    // letters not in word
  hints:[],     // revealed letter indices (from pista)
  pistaUsed:0, pistaMax:0,
  hist:[],over:false,won:false,
  stats:{g:0,w:0,s:0,b:0}
};

function maxPistas(len){ return len<=4?1:len<=6?2:3; }

function pick(len){
  const a=(WB[len]||WB[5]).map(w=>w.toUpperCase().replace(/[^A-Z]/g,'')).filter(w=>w.length===len);
  return a[Math.floor(Math.random()*a.length)]||'ROCA';
}
function daily(){
  const d=Math.floor(Date.now()/86400000);
  const all=Object.values(WB).flat().map(w=>w.toUpperCase().replace(/[^A-Z]/g,'')).filter(w=>w.length>=4&&w.length<=8);
  return all[d%all.length];
}

function initGame(word){
  word=(word||pick(5)).toUpperCase().replace(/[^A-Z]/g,'');
  if(word.length<4||word.length>8)word=pick(5).toUpperCase().replace(/[^A-Z]/g,'');
  const pm=maxPistas(word.length);
  GS={...GS,secret:word,len:word.length,att:0,decoded:[],found:[],absent:[],hints:[],pistaUsed:0,pistaMax:pm,hist:[],over:false,won:false};

  document.getElementById('s-len').textContent=word.length+' letras';
  document.getElementById('s-tri').textContent='0/4';
  document.getElementById('s-dec').textContent='0/'+word.length;
  document.getElementById('s-fnd').textContent='0';
  document.getElementById('frow').innerHTML='';
  document.getElementById('err').textContent='';
  document.getElementById('wi').value='';
  document.getElementById('wi').disabled=false;
  document.getElementById('sb').disabled=false;
  document.getElementById('hint').textContent='Escribe una palabra de '+word.length+' letras y pulsa Descifrar.';
  for(let i=0;i<4;i++)document.getElementById('d'+i).className='adot';
  document.getElementById('rsec-pair').style.display='none';
  document.getElementById('known-row').style.display='none';
  updatePistaBtn();
  renderKnownRow();

  const cm=document.getElementById('cm');
  cm.width=260; cm.height=260;
  drawRuna(cm, word.split(''), null);

  buildKb(); updateKb(); closeOv();
}

function startDaily(){
  document.getElementById('b-day').classList.add('on');
  document.getElementById('b-rnd').classList.remove('on');
  initGame(daily());
}
function startRandom(){
  document.getElementById('b-rnd').classList.add('on');
  document.getElementById('b-day').classList.remove('on');
  const lens=[4,5,5,5,6,6,7];
  initGame(pick(lens[Math.floor(Math.random()*lens.length)]));
}

// ═══════════════════════════════════════════════════════════════════════════════
// PISTA (HINT) SYSTEM
// ═══════════════════════════════════════════════════════════════════════════════
function updatePistaBtn(){
  const btn=document.getElementById('pista-btn');
  const cnt=document.getElementById('pista-count');
  const rem=GS.pistaMax-GS.pistaUsed;
  btn.disabled=GS.over||rem<=0;
  cnt.textContent=rem>0?rem+(rem===1?' pista':' pistas')+' restante'+(rem===1?'':'s'):'Sin pistas';
}

function usePista(){
  if(GS.over||GS.pistaUsed>=GS.pistaMax)return;
  const s=GS.secret;
  // Pick a random position not yet decoded and not yet hinted
  const available=[];
  for(let i=0;i<GS.len;i++){
    if(!GS.decoded.includes(i)&&!GS.hints.includes(i))available.push(i);
  }
  if(!available.length)return;
  const idx=available[Math.floor(Math.random()*available.length)];
  GS.hints.push(idx);
  // Also count as decoded for the updated runa
  if(!GS.decoded.includes(idx))GS.decoded.push(idx);
  GS.pistaUsed++;

  // Flash effect on hint reveal
  showPistaReveal(s[idx], idx);
  renderKnownRow();
  updatePistaBtn();

  // Update the updated runa if pair is showing
  if(document.getElementById('rsec-pair').style.display!=='none'){
    drawUpdated(s, GS.decoded);
  }
  // Also update the main runa
  const cm=document.getElementById('cm');
  drawRuna(cm, s.split(''), null);

  document.getElementById('s-dec').textContent=GS.decoded.length+'/'+GS.len;
}

function showPistaReveal(letter, idx){
  const err=document.getElementById('err');
  err.style.color='var(--amber)';
  err.textContent=`💡 Pista: posición ${idx+1} es "${letter}"`;
  setTimeout(()=>{err.style.color='var(--red)';err.textContent='';},2800);
}

function renderKnownRow(){
  const row=document.getElementById('known-row');
  if(!GS.len){row.style.display='none';return;}
  // Show a tile per position: revealed = green letter, else empty dash
  const hasAny=GS.hints.length>0||GS.decoded.length>0;
  if(!hasAny){row.style.display='none';return;}
  row.style.display='flex';
  row.innerHTML='';
  for(let i=0;i<GS.len;i++){
    const div=document.createElement('div');
    if(GS.hints.includes(i)||GS.decoded.includes(i)){
      div.className='klt';
      div.textContent=GS.secret[i];
    } else {
      div.className='klt empty';
      div.textContent='·';
    }
    row.appendChild(div);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════════
function buildKb(){
  const kb=document.getElementById('kb');kb.innerHTML='';
  ROWS.forEach(row=>{
    const d=document.createElement('div');d.className='kbr';
    row.forEach(k=>{
      const b=document.createElement('button');
      b.className='k'+(k.length>1?' w':'');b.textContent=k;b.dataset.k=k;
      b.addEventListener('click',()=>hk(k));d.appendChild(b);
    });
    kb.appendChild(d);
  });
}
function updateKb(){
  document.querySelectorAll('.k[data-k]').forEach(b=>{
    const k=b.dataset.k; if(!k||k.length>1)return;
    b.className='k'+(k.length>1?' w':'');
    if(GS.absent.includes(k))b.classList.add('gray');
    else if(GS.decoded.some(i=>GS.secret[i]===k))b.classList.add('green');
    else if(GS.found.includes(k))b.classList.add('amber');
  });
}
function hk(k){
  if(GS.over)return;
  const inp=document.getElementById('wi');
  if(k==='⌫')inp.value=inp.value.slice(0,-1);
  else if(k==='↩')go();
  else if(inp.value.length<GS.len)inp.value+=(k==='Ñ'?'Ñ':k);
}

// ═══════════════════════════════════════════════════════════════════════════════
// SUBMIT — with known-letters pre-fill
// ═══════════════════════════════════════════════════════════════════════════════
function go(){
  if(GS.over)return;
  const inp=document.getElementById('wi');
  let raw=inp.value.toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ]/g,'');
  const word=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Ñ/g,'N');

  if(word.length!==GS.len){showErr('La palabra debe tener exactamente '+GS.len+' letras.');return;}
  if(!/^[A-Z]+$/.test(word)){showErr('Solo letras del alfabeto español.');return;}

  // Validate that known (green) letters are respected
  for(const idx of GS.decoded){
    if(word[idx]!==GS.secret[idx]){
      showErr(`La posición ${idx+1} debe ser "${GS.secret[idx]}" (ya descifrada).`);
      return;
    }
  }

  const s=GS.secret;
  const colors=Array(GS.len).fill('gray');
  const sa=s.split(''),ga=word.split(''),used=Array(GS.len).fill(false);

  // Pass 1: greens
  for(let i=0;i<GS.len;i++){
    if(ga[i]===sa[i]){colors[i]='green';used[i]=true;if(!GS.decoded.includes(i))GS.decoded.push(i);}
  }
  // Pass 2: ambers
  for(let i=0;i<GS.len;i++){
    if(colors[i]==='green')continue;
    for(let j=0;j<GS.len;j++){
      if(!used[j]&&ga[i]===sa[j]){colors[i]='amber';used[j]=true;if(!GS.found.includes(ga[i]))GS.found.push(ga[i]);break;}
    }
    if(colors[i]==='gray'&&!sa.includes(ga[i])&&!GS.absent.includes(ga[i]))GS.absent.push(ga[i]);
  }

  GS.hist.push({word:raw,colors}); GS.att++;
  document.getElementById('d'+(GS.att-1)).classList.add('u');
  renderFB(raw,colors);
  document.getElementById('s-tri').textContent=GS.att+'/4';
  document.getElementById('s-dec').textContent=GS.decoded.length+'/'+GS.len;
  document.getElementById('s-fnd').textContent=GS.found.length;

  document.getElementById('rsec-pair').style.display='block';
  const cm=document.getElementById('cm'); cm.width=260; cm.height=260;
  drawRuna(cm, s.split(''), null);
  drawUpdated(s, GS.decoded);
  const cg=document.getElementById('cg'); cg.width=130; cg.height=130;
  drawRuna(cg, word.split(''), colors);

  renderKnownRow();
  updateKb();
  inp.value='';

  const win=colors.every(c=>c==='green')||GS.decoded.length===GS.len;
  if(win){
    GS.won=true;GS.over=true;GS.stats.g++;GS.stats.w++;GS.stats.s++;
    if(GS.stats.s>GS.stats.b)GS.stats.b=GS.stats.s;
    setTimeout(()=>{
      playRunaAnim(GS.secret.split(''), ()=>{
        doConfetti();
        showWin();
      });
    },420);
  } else if(GS.att>=GS.max){
    GS.over=true;GS.stats.g++;GS.stats.s=0;
    setTimeout(showLose,420);
  }
  inp.disabled=GS.over;
  document.getElementById('sb').disabled=GS.over;
  updatePistaBtn();
}

function drawUpdated(secret, decoded){
  const cu=document.getElementById('cu');
  cu.width=130; cu.height=130;
  const rem=secret.split('').map((l,i)=>decoded.includes(i)?null:l);
  drawRuna(cu, rem, null);
}

function renderFB(word,colors){
  const r=document.getElementById('frow'); r.innerHTML='';
  word.split('').forEach((l,i)=>{
    const t=document.createElement('div');
    t.className='lt '+colors[i]; t.textContent=l;
    t.style.cssText='opacity:0;transform:scale(.65)';
    setTimeout(()=>{t.style.cssText='transition:all .25s ease;opacity:1;transform:scale(1)';},i*60);
    r.appendChild(t);
  });
}
function showErr(m){
  const e=document.getElementById('err');
  e.style.color='var(--red)';
  e.textContent=m;
  setTimeout(()=>e.textContent='',2600);
}

    <h2 class="win">¡RUNA DESCIFRADA!</h2>
    <p>Desenredaste la runa en <strong>${GS.att}</strong> ${GS.att===1?'intento':'intentos'}${GS.pistaUsed?` (${GS.pistaUsed} pista${GS.pistaUsed>1?'s':''} usada${GS.pistaUsed>1?'s':''})`:''}.</p>
    <div class="mword">${GS.secret}</div>
    <div class="sgrid">
      <div class="sbox"><div class="snum">${GS.stats.g}</div><div class="slbl">Partidas</div></div>

function showLose(){
  document.getElementById('mi').innerHTML=`
    <h2 class="lose">Runa no descifrada</h2>

// CONFETTI
// ═══════════════════════════════════════════════════════════════════════════════
function doConfetti(){
  const cv=document.getElementById('cc');
  cv.width=innerWidth; cv.height=innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['#7c6af7','#a594f9','#22c55e','#f59e0b','#c4b5fd','#fff'];
  const ps=Array.from({length:130},()=>({
    x:Math.random()*cv.width, y:Math.random()*cv.height-cv.height,
    w:Math.random()*9+4, h:Math.random()*5+2,
    c:cols[Math.floor(Math.random()*cols.length)],
    vx:(Math.random()-.5)*2.5, vy:Math.random()*3+1.5,
    r:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.18
  }));
  let f=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-f/130);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    f++; if(f<160)requestAnimationFrame(loop);
    else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
