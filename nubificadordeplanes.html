<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nubificador de Planes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EBDC;
  --paper-2:#E8E0CC;
  --paper-line:#CBBFA0;
  --paper-shadow:#00000022;
  --ink:#293B47;
  --ink-soft:#54697A;
  --ink-faint:#8496A2;
  --cover:#39464F;
  --cover-2:#2A343B;
  --cover-hi:#4C5C67;
  --metal:#A8B2B8;
  --metal-dark:#6C777D;
  --metal-hi:#E6ECEE;
  --frost:#6FA0C4;
  --frost-2:#3E7C97;
  --frost-light:#CFE6F3;
  --frost-pale:#EAF4FA;
  --warn:#9B3A34;
  --warn-bg:#F4DAD6;
  --good:#2F7A5E;
  --good-bg:#D8EDE2;
  --font-display:'Special Elite', 'Courier New', monospace;
  --font-body:'Atkinson Hyperlegible', -apple-system, sans-serif;
  --font-mono:'Courier Prime', 'Courier New', monospace;
  --radius:14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;
  margin:0;
  overflow-x:hidden;
  overscroll-behavior:none;
  touch-action:pan-y;
  background:var(--cover-2);
  font-family:var(--font-body);
  color:var(--ink);
}
body{
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
input,textarea{
  user-select:text;
  -webkit-user-select:text;
}
img,button{-webkit-touch-callout:none;}
button{touch-action:manipulation; font-family:inherit;}

#app{
  position:fixed; inset:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ============ paper texture ============ */
.paper-bg{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--paper-line) 1px, transparent 1px),
    radial-gradient(ellipse at 20% 10%, #ffffff33, transparent 60%),
    radial-gradient(ellipse at 90% 90%, #00000010, transparent 60%);
  background-size: 100% 28px, 100% 100%, 100% 100%;
}

/* ============ scrollbars off ============ */
::-webkit-scrollbar{display:none;}

/* ============ screens ============ */
.screen{
  position:absolute; inset:0;
  display:none;
  flex-direction:column;
}
.screen.active{
  display:flex;
  animation: screenIn .22s ease;
}
@keyframes screenIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* ============================================================
   COVER SCREEN — libreta de campo
   ============================================================ */
#cover-screen{
  background:
    linear-gradient(160deg, var(--cover-hi), var(--cover) 40%, var(--cover-2) 100%);
  padding-top:var(--safe-top);
}
.cover-rings{
  display:flex; justify-content:space-evenly;
  padding:10px 18px 0;
}
.ring{
  width:20px; height:20px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--metal-hi), var(--metal) 45%, var(--metal-dark) 100%);
  box-shadow: inset 0 0 0 4px var(--cover-2), 0 2px 3px #00000055;
}
.cover-head{
  text-align:center;
  padding:18px 24px 10px;
}
.cover-badge{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:2px;
  color:var(--frost-light);
  border:1px solid var(--frost-light);
  border-radius:20px;
  padding:3px 12px;
  opacity:.85;
}
.cover-title{
  font-family:var(--font-display);
  color:#fff;
  font-size:28px;
  line-height:1.25;
  margin:10px 0 2px;
  text-shadow:0 2px 0 #00000055;
}
.cover-sub{
  font-family:var(--font-mono);
  color:var(--frost-light);
  font-size:13px;
  opacity:.8;
}
.cover-scroll{
  flex:1;
  overflow-y:auto;
  padding:14px 16px calc(140px + var(--safe-bottom));
  -webkit-overflow-scrolling:touch;
}
.cover-section-label{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:1.5px;
  color:var(--frost-light);
  opacity:.75;
  margin:18px 4px 8px;
  text-transform:uppercase;
}
.empty-note{
  font-family:var(--font-body);
  color:var(--frost-light);
  opacity:.7;
  font-size:14.5px;
  text-align:center;
  padding:30px 20px;
  line-height:1.5;
}

.plan-card{
  background:var(--paper);
  border-radius:10px;
  padding:14px 14px 12px;
  margin-bottom:10px;
  box-shadow:0 3px 0 #00000030, 0 6px 10px #00000030;
  position:relative;
  border-left:5px solid var(--frost-2);
  display:flex; gap:12px; align-items:flex-start;
}
.plan-card.status-valorado{border-left-color:var(--good);}
.plan-card .pc-icon{font-size:26px; line-height:1; margin-top:2px;}
.plan-card .pc-body{flex:1; min-width:0;}
.plan-card .pc-title{font-family:var(--font-display); font-size:16px; color:var(--ink); margin:0 0 3px;}
.plan-card .pc-meta{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
.plan-card .pc-badge{
  display:inline-block; margin-top:6px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.5px;
  padding:2px 8px; border-radius:20px;
  background:var(--frost-pale); color:var(--frost-2);
}
.plan-card.status-valorado .pc-badge{background:var(--good-bg); color:var(--good);}

.cover-actions{
  position:absolute; left:0; right:0; bottom:0;
  padding:12px 16px calc(14px + var(--safe-bottom));
  background:linear-gradient(to top, var(--cover-2) 60%, transparent);
  display:flex; flex-direction:column; gap:10px;
}
.btn-stamp{
  font-family:var(--font-display);
  font-size:16px;
  letter-spacing:1px;
  border:none;
  border-radius:10px;
  padding:15px 18px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 3px 0 #00000040, 0 5px 10px #00000030;
  active-opacity:.8;
}
.btn-stamp:active{transform:translateY(2px); box-shadow:0 1px 0 #00000040;}
.btn-primary{background:linear-gradient(160deg,var(--frost),var(--frost-2)); color:#fff;}
.btn-ghost{
  background:transparent; color:var(--frost-light);
  border:1.5px dashed var(--frost-light);
  font-family:var(--font-mono); font-size:13px; padding:10px;
  box-shadow:none;
}
.btn-ghost:active{transform:none; opacity:.6;}

/* ============================================================
   EDITOR SCREEN
   ============================================================ */
#editor-screen{background:var(--paper);}
.editor-top{
  padding:calc(10px + var(--safe-top)) 14px 8px;
  background:var(--cover);
  display:flex; align-items:center; gap:10px;
}
.icon-btn{
  width:38px; height:38px; border-radius:50%;
  border:none; background:var(--cover-hi); color:#fff;
  font-size:18px; display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 -2px 0 #00000040, 0 1px 2px #00000030;
  flex-shrink:0;
}
.icon-btn:active{filter:brightness(.85);}
.editor-top-title{
  font-family:var(--font-display); color:#fff; font-size:15px; flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.editor-general{
  background:var(--paper-2);
  padding:12px 16px 14px;
  border-bottom:2px solid var(--paper-line);
}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field-label{
  display:block;
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:6px;
  letter-spacing:.3px;
}
input[type=text], input[type=number], textarea{
  width:100%;
  font-family:var(--font-body);
  font-size:16px;
  padding:10px 12px;
  border-radius:8px;
  border:1.5px solid var(--paper-line);
  background:var(--paper);
  color:var(--ink);
  resize:none;
}
input[type=text]:focus, input[type=number]:focus, textarea:focus{
  outline:2px solid var(--frost);
  outline-offset:1px;
}
.row-2{display:flex; gap:10px;}
.row-2 > *{flex:1;}

/* tab bar (notebook divider tabs) */
.tabbar{
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--paper-2);
  padding:8px 8px 0;
  gap:4px;
  scrollbar-width:none;
  border-bottom:2px solid var(--paper-line);
}
.tab{
  flex-shrink:0;
  font-family:var(--font-mono);
  font-size:12px;
  padding:9px 12px 8px;
  border-radius:8px 8px 0 0;
  background:var(--paper-line);
  color:var(--ink-soft);
  display:flex; align-items:center; gap:5px;
  border:none;
  position:relative;
  top:2px;
}
.tab.active{
  background:var(--paper);
  color:var(--ink);
  font-weight:bold;
  box-shadow:0 -2px 4px #00000010;
}
.tab .tab-dot{
  width:6px; height:6px; border-radius:50%; background:var(--paper-shadow);
  flex-shrink:0;
}
.tab.filled .tab-dot{background:var(--frost-2);}

.editor-scroll{
  flex:1; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:18px 16px calc(90px + var(--safe-bottom));
}
.section-page{display:none;}
.section-page.active{display:block; animation:pageIn .25s ease;}
@keyframes pageIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.section-heading{
  font-family:var(--font-display);
  font-size:19px;
  color:var(--ink);
  margin:0 0 4px;
  display:flex; align-items:center; gap:8px;
}
.section-hint{
  font-family:var(--font-body);
  font-size:13px;
  color:var(--ink-faint);
  margin:0 0 16px;
  font-style:italic;
}

/* chips */
.chip-group{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  font-family:var(--font-body);
  font-size:14.5px;
  padding:10px 14px;
  border-radius:20px;
  border:1.5px solid var(--paper-line);
  background:var(--paper);
  color:var(--ink-soft);
  cursor:pointer;
}
.chip.selected{
  background:var(--frost-2);
  border-color:var(--frost-2);
  color:#fff;
  font-weight:bold;
}
.chip:active{filter:brightness(.95);}

/* dial gauge */
.dial-wrap{display:flex; flex-direction:column; align-items:center; padding:6px 0 4px;}
.dial{
  width:150px; height:150px; border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%, var(--metal-hi), var(--metal) 40%, var(--metal-dark) 100%);
  box-shadow:0 3px 0 #00000030, inset 0 -4px 8px #00000030, inset 0 3px 4px #ffffff55;
  position:relative;
  display:flex; align-items:center; justify-content:center;
}
.dial-face{
  width:118px; height:118px; border-radius:50%;
  background:var(--frost-pale);
  box-shadow:inset 0 2px 6px #00000030;
  position:relative;
}
.dial-tick{
  position:absolute; left:50%; top:6px; width:2px; height:9px;
  background:var(--ink-faint); transform-origin:1px 53px;
}
.dial-needle{
  position:absolute; left:50%; top:50%; width:3px; height:46px;
  background:linear-gradient(var(--warn), var(--warn));
  transform-origin:50% 100%;
  transform:translate(-50%,-100%) rotate(0deg);
  border-radius:2px;
  transition:transform .2s ease;
}
.dial-hub{
  position:absolute; left:50%; top:50%; width:12px; height:12px; border-radius:50%;
  background:var(--metal-dark); transform:translate(-50%,-50%);
  box-shadow:0 0 0 2px var(--metal-hi);
}
.dial-value{
  margin-top:10px; font-family:var(--font-mono); font-size:13px; color:var(--ink); font-weight:bold;
  min-height:16px;
}
.dial-slider{width:80%; margin-top:6px; accent-color:var(--frost-2);}

/* thermometer */
.thermo-wrap{display:flex; align-items:center; gap:18px; padding:6px 0;}
.thermo-tube{
  width:26px; height:150px; border-radius:14px;
  background:var(--frost-pale);
  box-shadow:inset 0 2px 6px #00000030, 0 1px 0 #ffffff66;
  position:relative; overflow:hidden;
  flex-shrink:0;
}
.thermo-fill{
  position:absolute; left:0; right:0; bottom:0;
  background:linear-gradient(var(--frost), var(--frost-2));
  border-radius:0 0 14px 14px;
  transition:height .2s ease, background .2s ease;
}
.thermo-bulb{
  width:38px; height:38px; border-radius:50%;
  background:var(--frost-2);
  margin:-19px auto 0; position:relative; z-index:2;
  box-shadow:inset 0 -4px 6px #00000030, 0 1px 0 #ffffff44;
}
.thermo-scale{flex:1;}
.thermo-value{font-family:var(--font-mono); font-size:22px; color:var(--ink); font-weight:bold;}
.thermo-slider{width:100%; accent-color:var(--frost-2); margin-top:8px;}
.thermo-labels{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:2px;}

/* editor bottom nav */
.editor-bottom{
  position:absolute; left:0; right:0; bottom:0;
  padding:10px 14px calc(12px + var(--safe-bottom));
  background:linear-gradient(to top, var(--paper) 70%, transparent);
  display:flex; gap:10px;
}
.btn-flat{
  flex:1;
  font-family:var(--font-mono); font-size:13px; letter-spacing:.5px;
  padding:12px; border-radius:10px; border:none;
  background:var(--paper-2); color:var(--ink-soft);
  box-shadow:0 2px 0 var(--paper-line);
}
.btn-flat:active{transform:translateY(1px); box-shadow:none;}
.btn-flat.primary{
  background:linear-gradient(160deg,var(--frost),var(--frost-2)); color:#fff; font-family:var(--font-display); font-size:15px;
}

/* ============================================================
   SUMMARY SCREEN — página resumen sellada
   ============================================================ */
#summary-screen{background:var(--paper);}
.summary-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 0 calc(100px + var(--safe-bottom));}
.summary-header{
  background:var(--cover);
  padding:calc(10px + var(--safe-top)) 14px 20px;
  display:flex; align-items:center; gap:10px;
}
.summary-title-block{flex:1; min-width:0;}
.summary-title{font-family:var(--font-display); color:#fff; font-size:18px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.summary-date{font-family:var(--font-mono); color:var(--frost-light); font-size:12px; margin-top:2px;}

.stamp-banner{
  margin:16px; padding:12px 14px;
  border:2px dashed;
  border-radius:8px;
  font-family:var(--font-display);
  font-size:14px;
  text-align:center;
  transform:rotate(-1deg);
}
.stamp-good{border-color:var(--good); color:var(--good); background:var(--good-bg);}
.stamp-warn{border-color:var(--warn); color:var(--warn); background:var(--warn-bg);}

.gauges-wrap{
  margin:16px; padding:16px 10px 10px;
  background:var(--paper-2);
  border-radius:12px;
  border:1.5px solid var(--paper-line);
}
.gauges-title{
  font-family:var(--font-mono); font-size:11.5px; letter-spacing:1px;
  color:var(--ink-faint); text-align:center; text-transform:uppercase; margin-bottom:8px;
}
.gauges-row{display:flex; justify-content:space-around; align-items:flex-end; gap:6px;}
.gauge-item{display:flex; flex-direction:column; align-items:center; flex:1;}
.gauge-item.featured{transform:scale(1.12); z-index:1;}
.dial.small{width:88px; height:88px; box-shadow:0 2px 0 #00000030, inset 0 -3px 6px #00000030, inset 0 2px 3px #ffffff55;}
.dial.small .dial-face{width:70px; height:70px;}
.dial.small .dial-tick{transform-origin:1px 33px; height:6px;}
.dial.small .dial-needle{height:26px;}
.gauge-pct{font-family:var(--font-display); font-size:20px; color:var(--ink); margin-top:6px;}
.gauge-label{font-family:var(--font-body); font-size:11.5px; color:var(--ink-soft); text-align:center; max-width:100px; line-height:1.25; margin-top:1px;}
.gauge-overall-line{
  text-align:center; font-family:var(--font-body); font-size:14px; color:var(--ink);
  margin:10px 4px 2px; padding-top:10px; border-top:1px dotted var(--paper-line);
}
.gauge-overall-line b{font-family:var(--font-display); font-size:15px;}
.gauge-disclaimer{
  text-align:center; font-family:var(--font-body); font-style:italic; font-size:11.5px;
  color:var(--ink-faint); margin-top:6px; padding:0 6px;
}
.reasons-toggle{
  display:block; width:100%; text-align:center; margin-top:10px;
  background:none; border:none; font-family:var(--font-mono); font-size:12px;
  color:var(--frost-2); padding:6px; text-decoration:underline;
}
.reasons-list{display:none; margin-top:6px; padding:0 4px;}
.reasons-list.open{display:block;}
.reason-item{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-body); font-size:13px; color:var(--ink);
  padding:5px 8px; border-radius:6px; margin-bottom:4px;
}
.reason-item.good{background:var(--good-bg);}
.reason-item.bad{background:var(--warn-bg);}
.reason-item .r-icon{flex-shrink:0;}

.summary-block{
  margin:0 16px 14px;
  background:var(--paper-2);
  border-radius:10px;
  padding:14px 16px;
  border-left:4px solid var(--frost-2);
}
.summary-block h3{
  font-family:var(--font-display); font-size:15px; margin:0 0 10px; color:var(--ink);
  display:flex; align-items:center; gap:7px;
}
.summary-row{
  display:flex; justify-content:space-between; gap:10px;
  font-family:var(--font-body); font-size:14.5px;
  padding:5px 0;
  border-bottom:1px dotted var(--paper-line);
}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--ink-soft); flex-shrink:0;}
.summary-row .v{color:var(--ink); text-align:right; font-weight:600;}
.summary-free{
  font-family:var(--font-body); font-size:14.5px; color:var(--ink);
  white-space:pre-wrap; line-height:1.5; padding-top:4px;
}

.summary-actions{
  position:absolute; left:0; right:0; bottom:0;
  padding:10px 14px calc(12px + var(--safe-bottom));
  background:linear-gradient(to top, var(--paper) 70%, transparent);
  display:flex; gap:10px;
}

.rating-chip-view{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:14px;
}

/* ============================================================
   RATING SCREEN
   ============================================================ */
#rating-screen{background:var(--paper);}
.rating-scroll{flex:1; overflow-y:auto; padding:0 16px calc(100px + var(--safe-bottom)); -webkit-overflow-scrolling:touch;}

/* toast stamp */
#toast{
  position:fixed; left:50%; top:18px; transform:translate(-50%,-140%);
  background:var(--ink); color:#fff;
  font-family:var(--font-mono); font-size:13px;
  padding:10px 18px; border-radius:24px;
  z-index:999; transition:transform .3s ease;
  box-shadow:0 4px 10px #00000050;
  pointer-events:none;
}
#toast.show{transform:translate(-50%, calc(var(--safe-top) + 4px));}

.legend-mini{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); text-align:center; margin-top:16px; padding:0 20px 6px;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ COVER SCREEN ============ -->
  <section id="cover-screen" class="screen active">
    <div class="cover-rings">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    </div>
    <div class="cover-head">
      <span class="cover-badge">CUADERNO DE CAMPO</span>
      <h1 class="cover-title">Nubificador<br>de Planes</h1>
      <div class="cover-sub" id="cover-count">0 entradas</div>
    </div>
    <div class="cover-scroll" id="cover-list"></div>
    <div class="cover-actions">
      <button class="btn-stamp btn-primary" onclick="startNewPlan()">✏️ Nueva entrada</button>
      <button class="btn-stamp btn-ghost" onclick="downloadSummary()">⬇ Descargar resumen de todo</button>
    </div>
  </section>

  <!-- ============ EDITOR SCREEN ============ -->
  <section id="editor-screen" class="screen">
    <div class="editor-top">
      <button class="icon-btn" onclick="goCover()">‹</button>
      <div class="editor-top-title" id="editor-title-label">Nueva entrada</div>
      <button class="icon-btn" onclick="confirmDeletePlan()" id="editor-delete-btn" style="display:none;">🗑</button>
    </div>
    <div class="editor-general">
      <div class="field">
        <label class="field-label">Nombre del plan</label>
        <input type="text" id="f-titulo" placeholder="ej. Cena en casa de Lluvia" oninput="onGeneralChange()">
      </div>
      <div class="row-2">
        <div class="field">
          <label class="field-label">Fecha</label>
          <input type="text" id="f-fecha" placeholder="ej. 14 septiembre" oninput="onGeneralChange()">
        </div>
        <div class="field">
          <label class="field-label">Hora</label>
          <input type="text" id="f-hora" placeholder="ej. 18:00" oninput="onGeneralChange()">
        </div>
      </div>
    </div>
    <div class="tabbar" id="tabbar"></div>
    <div class="editor-scroll" id="editor-pages"></div>
    <div class="editor-bottom">
      <button class="btn-flat" id="btn-prev-tab" onclick="stepTab(-1)">‹ Anterior</button>
      <button class="btn-flat primary" id="btn-next-tab" onclick="stepTab(1)">Siguiente ›</button>
    </div>
  </section>

  <!-- ============ SUMMARY SCREEN ============ -->
  <section id="summary-screen" class="screen">
    <div class="summary-scroll">
      <div class="summary-header">
        <button class="icon-btn" onclick="goCover()">‹</button>
        <div class="summary-title-block">
          <div class="summary-title" id="sum-title">Plan</div>
          <div class="summary-date" id="sum-date">—</div>
        </div>
      </div>
      <div id="sum-gauges-slot"></div>
      <div id="sum-banner-slot"></div>
      <div id="sum-blocks"></div>
    </div>
    <div class="summary-actions">
      <button class="btn-flat" onclick="editPlan(currentId)">✏️ Editar</button>
      <button class="btn-flat primary" onclick="openRating(currentId)">⭐ ¿Cómo fue?</button>
    </div>
  </section>

  <!-- ============ RATING SCREEN ============ -->
  <section id="rating-screen" class="screen">
    <div class="editor-top">
      <button class="icon-btn" onclick="goSummary(currentId)">‹</button>
      <div class="editor-top-title">Cómo fue en realidad</div>
      <div style="width:38px"></div>
    </div>
    <div class="rating-scroll">
      <div class="section-page active" style="padding-top:18px;">
        <div class="section-heading">⭐ Después del plan</div>
        <p class="section-hint">Esto es solo para ti — te ayuda a ver patrones con el tiempo.</p>
        <div id="rating-fields"></div>
        <div class="field">
          <label class="field-label">¿Qué tal fue en realidad?</label>
          <textarea id="r-notas" rows="4" placeholder="Notas libres..." oninput="saveRatingDraft()"></textarea>
        </div>
      </div>
    </div>
    <div class="summary-actions">
      <button class="btn-flat primary" style="flex:1" onclick="saveRatingAndClose()">Guardar valoración</button>
    </div>
  </section>

</div>
<div id="toast"></div>

<script>
/* ============================================================
   CONFIG — secciones y campos
   ============================================================ */
const SECTIONS = [
  {id:'persona', label:'Persona', icon:'👤', fields:[
    {key:'relacion', type:'chip', label:'¿Qué relación tengo con esa persona?', options:['Gato / familia cercana','Familia','Amigo íntimo','Amigo','Conocido','Trabajo / formal','Desconocido']},
    {key:'nombre', type:'text', label:'¿Quién es? (opcional)', placeholder:'Nombre...'}
  ]},
  {id:'transporte', label:'Transporte', icon:'🚗', fields:[
    {key:'modo', type:'chip', label:'¿Cómo será el transporte?', options:['Andando','Transporte público','Me lleva Gato (gatimoto)','Me lleva Gato (coche de alguien)','Me lleva otra persona','Otro']},
    {key:'duracion', type:'text', label:'¿Cuánto dura el trayecto?', placeholder:'ej. 15 minutos'}
  ]},
  {id:'plan', label:'El plan', icon:'📋', fields:[
    {key:'quese', type:'textarea', label:'¿Qué se hará?', rows:3},
    {key:'ubicacion', type:'chip', label:'¿Dónde es?', options:['Interior','Exterior','Interior y exterior']},
    {key:'duracion', type:'text', label:'¿Cuánto durará?', placeholder:'ej. 2 horas'},
    {key:'personas', type:'chip', label:'¿Cuánta gente habrá?', options:['Solo Gato y yo','Grupo pequeño (–5)','Grupo mediano (5–15)','Grupo grande (+15)']},
    {key:'personasDetalle', type:'text', label:'¿Quiénes vienen? (opcional)'}
  ]},
  {id:'clima', label:'Clima', icon:'❄️', fields:[
    {key:'temperatura', type:'thermo', label:'Temperatura esperada'},
    {key:'condicion', type:'chip', label:'¿Cómo estará el tiempo?', options:['Frío agradable','Templado','Soleado','Nublado','Calor','Lluvia','Viento','Nieve']}
  ]},
  {id:'cuerpo', label:'Mi cuerpo', icon:'🫀', fields:[
    {key:'cansancio', type:'dial', label:'Mi nivel de cansancio ahora', min:1, max:5, dialLabels:['Con energía','Normal','Agotada']},
    {key:'planesRecientes', type:'chip', label:'¿Ha habido muchos planes últimamente?', options:['Pocos','Algunos','Muchos']},
    {key:'actividadesHoy', type:'text', label:'¿Cuántas actividades tengo ese día?', placeholder:'ej. 2'},
    {key:'estadoFisico', type:'chip', multi:true, label:'¿Cómo está mi cuerpo?', options:['Bien','Dolor de cabeza','Dolor de tripa','Agotada','Alergia','Otro malestar']}
  ]},
  {id:'libertad', label:'Libertad', icon:'🕊️', fields:[
    {key:'pajaruna', type:'dial', label:'¿Cuánto de espontánea puedo ser hoy?', min:1, max:5, dialLabels:['Nada','Algo','Mucho']},
    {key:'rutaSalida', type:'chip', label:'¿Puedo irme cuando quiera?', options:['Sí, cuando quiera','Debo quedarme un rato','Debo quedarme todo el plan']},
    {key:'mascara', type:'chip', label:'¿Puedo ser yo misma allí?', options:['Sí, completamente','Un poco de esfuerzo','Mucho esfuerzo']},
    {key:'sensorial', type:'chip', label:'¿Cuánto ruido / luces / gente habrá?', options:['Baja','Media','Alta']},
    {key:'incertidumbre', type:'chip', label:'¿Está todo definido de antemano?', options:['Sí, todo definido','Algo puede cambiar','Muy abierto / incierto']}
  ]},
  {id:'preparar', label:'Preparar', icon:'🎒', fields:[
    {key:'llevar', type:'textarea', label:'¿Qué tengo que llevar o preparar?', rows:3},
    {key:'notas', type:'textarea', label:'Notas libres', rows:3}
  ]}
];

const RATING_FIELDS = [
  {key:'merecio', type:'dial', label:'¿Mereció la pena ir?', min:1, max:5, dialLabels:['Nada','Regular','Mucho']},
  {key:'cansancioReal', type:'dial', label:'¿Cómo quedé después?', min:1, max:5, dialLabels:['Con energía','Normal','Agotada']}
];

/* ============================================================
   STATE
   ============================================================ */
let plans = [];
let currentId = null;
let currentTabIndex = 0;
let draft = {};       // working copy while editing a plan
let ratingDraft = {};

const STORAGE_KEY = 'plans';

/* ============================================================
   STORAGE
   ============================================================ */
async function loadPlans(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    plans = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    plans = [];
  }
}
async function persistPlans(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(plans), false);
  }catch(e){
    showToast('⚠ No se pudo guardar. Descarga el resumen para no perderlo.');
  }
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  preventGestures();
  await loadPlans();
  renderCover();
}
window.addEventListener('DOMContentLoaded', init);

/* ============================================================
   GESTURE / ZOOM / NAV PREVENTION
   ============================================================ */
function preventGestures(){
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  let lastTouch = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTouch <= 300){ e.preventDefault(); }
    lastTouch = now;
  }, {passive:false});
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
  // block swipe-based back/forward navigation
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => history.pushState(null, '', location.href));
}

/* ============================================================
   HELPERS
   ============================================================ */
function uid(){ return 'p'+Date.now()+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function iconForRelacion(r){
  if(!r) return '📓';
  if(r.includes('Pareja')) return '💙';
  if(r.includes('Familia')) return '👪';
  if(r.includes('íntimo')) return '🤍';
  if(r.includes('Amigo')) return '🙂';
  if(r.includes('Trabajo')) return '💼';
  if(r.includes('Desconocido')) return '❓';
  return '👤';
}
function iconForClima(c){
  if(!c) return '';
  if(c.includes('Frío')) return '❄️';
  if(c.includes('Calor')) return '🥵';
  if(c.includes('Lluvia')) return '🌧️';
  if(c.includes('Nieve')) return '🌨️';
  if(c.includes('Soleado')) return '☀️';
  if(c.includes('Nublado')) return '☁️';
  if(c.includes('Viento')) return '💨';
  return '🌡️';
}

/* ============================================================
   NAVIGATION between screens
   ============================================================ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active','behind');
  });
  document.getElementById(id).classList.add('active');
}
function goCover(){
  renderCover();
  showScreen('cover-screen');
  currentId = null;
}
function goSummary(id){
  renderSummary(id);
  showScreen('summary-screen');
}

/* ============================================================
   COVER RENDER
   ============================================================ */
function renderCover(){
  const list = document.getElementById('cover-list');
  const count = document.getElementById('cover-count');
  count.textContent = plans.length + (plans.length===1 ? ' entrada' : ' entradas');
  if(plans.length === 0){
    list.innerHTML = '<div class="empty-note">Tu cuaderno está en blanco todavía.<br>Toca "Nueva entrada" para anotar tu próximo plan. ❄️</div>';
    return;
  }
  const sorted = [...plans].sort((a,b)=> b.createdAt - a.createdAt);
  const pending = sorted.filter(p=>!p.rating);
  const rated = sorted.filter(p=>p.rating);
  let html = '';
  if(pending.length){
    html += '<div class="cover-section-label">Planes por vivir / valorar</div>';
    pending.forEach(p=> html += planCardHTML(p));
  }
  if(rated.length){
    html += '<div class="cover-section-label">Ya valorados</div>';
    rated.forEach(p=> html += planCardHTML(p));
  }
  list.innerHTML = html;
}
function planCardHTML(p){
  const s = p.data || {};
  const relIcon = iconForRelacion(s.persona && s.persona.relacion);
  const climaIcon = iconForClima(s.clima && s.clima.condicion);
  const titulo = p.titulo || 'Sin título';
  const fecha = [p.fecha, p.hora].filter(Boolean).join(' · ') || 'Sin fecha';
  const statusClass = p.rating ? 'status-valorado' : '';
  const badge = p.rating ? '⭐ Valorado' : 'Sin valorar aún';
  return `<div class="plan-card ${statusClass}" onclick="goSummary('${p.id}')">
    <div class="pc-icon">${relIcon}${climaIcon?(' '+climaIcon):''}</div>
    <div class="pc-body">
      <p class="pc-title">${esc(titulo)}</p>
      <div class="pc-meta">${esc(fecha)}</div>
      <span class="pc-badge">${badge}</span>
    </div>
  </div>`;
}

/* ============================================================
   EDITOR — new / edit plan
   ============================================================ */
function blankData(){
  const d = {};
  SECTIONS.forEach(sec=>{ d[sec.id] = {}; });
  return d;
}
function startNewPlan(){
  currentId = uid();
  draft = {id:currentId, titulo:'', fecha:'', hora:'', createdAt:Date.now(), data:blankData(), rating:null};
  openEditor(true);
}
function editPlan(id){
  const p = plans.find(x=>x.id===id);
  draft = JSON.parse(JSON.stringify(p));
  currentId = id;
  openEditor(false);
}
function openEditor(isNew){
  document.getElementById('editor-title-label').textContent = isNew ? 'Nueva entrada' : (draft.titulo || 'Editar entrada');
  document.getElementById('editor-delete-btn').style.display = isNew ? 'none' : 'flex';
  document.getElementById('f-titulo').value = draft.titulo || '';
  document.getElementById('f-fecha').value = draft.fecha || '';
  document.getElementById('f-hora').value = draft.hora || '';
  currentTabIndex = 0;
  buildTabs();
  buildPages();
  selectTab(0);
  showScreen('editor-screen');
}
function onGeneralChange(){
  draft.titulo = document.getElementById('f-titulo').value;
  draft.fecha = document.getElementById('f-fecha').value;
  draft.hora = document.getElementById('f-hora').value;
}
function buildTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = SECTIONS.map((sec,i)=>
    `<button class="tab" id="tab-${i}" onclick="selectTab(${i})">
      <span class="tab-dot"></span>${sec.icon} ${sec.label}
    </button>`).join('');
}
function buildPages(){
  const wrap = document.getElementById('editor-pages');
  wrap.innerHTML = SECTIONS.map((sec,i)=>{
    const fieldsHtml = sec.fields.map(f=>renderField(sec.id, f)).join('');
    return `<div class="section-page" id="page-${i}">
      <div class="section-heading">${sec.icon} ${sec.label}</div>
      ${fieldsHtml}
    </div>`;
  }).join('');
  // fill values + wire events
  SECTIONS.forEach(sec=>{
    sec.fields.forEach(f=> initFieldValue(sec.id, f));
  });
  refreshTabDots();
}
function renderField(secId, f){
  const id = `fld-${secId}-${f.key}`;
  if(f.type === 'chip'){
    const opts = f.options.map(o=>`<button type="button" class="chip" data-val="${esc(o)}" onclick="onChipClick('${secId}','${f.key}',this,${!!f.multi})">${esc(o)}</button>`).join('');
    return `<div class="field"><label class="field-label">${esc(f.label)}</label><div class="chip-group" id="${id}">${opts}</div></div>`;
  }
  if(f.type === 'text'){
    return `<div class="field"><label class="field-label">${esc(f.label)}</label><input type="text" id="${id}" placeholder="${esc(f.placeholder||'')}" oninput="onTextInput('${secId}','${f.key}',this)"></div>`;
  }
  if(f.type === 'textarea'){
    return `<div class="field"><label class="field-label">${esc(f.label)}</label><textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.placeholder||'')}" oninput="onTextInput('${secId}','${f.key}',this)"></textarea></div>`;
  }
  if(f.type === 'dial'){
    return `<div class="field"><label class="field-label">${esc(f.label)}</label>${dialHTML(id, f)}</div>`;
  }
  if(f.type === 'thermo'){
    return `<div class="field"><label class="field-label">${esc(f.label)}</label>${thermoHTML(id)}</div>`;
  }
  return '';
}
function dialHTML(id, f){
  const ticks = [];
  for(let i=0;i<11;i++){ ticks.push(`<div class="dial-tick" style="transform:rotate(${-120 + i*24}deg)"></div>`); }
  return `<div class="dial-wrap">
    <div class="dial"><div class="dial-face">
      ${ticks.join('')}
      <div class="dial-needle" id="${id}-needle"></div>
      <div class="dial-hub"></div>
    </div></div>
    <div class="dial-value" id="${id}-val">—</div>
    <input type="range" class="dial-slider" id="${id}" min="${f.min}" max="${f.max}" step="1"
      oninput="onDialInput('${id}', this.value)">
  </div>`;
}
function thermoHTML(id){
  return `<div class="thermo-wrap">
    <div class="thermo-tube"><div class="thermo-fill" id="${id}-fill"></div></div>
    <div class="thermo-scale">
      <div class="thermo-value" id="${id}-val">— °C</div>
      <input type="range" class="thermo-slider" id="${id}" min="-10" max="42" step="1" value="18"
        oninput="onThermoInput('${id}', this.value)">
      <div class="thermo-labels"><span>-10°</span><span>42°</span></div>
    </div>
  </div>`;
}

/* field <-> draft binding */
function getSecObj(secId){
  if(!draft.data[secId]) draft.data[secId] = {};
  return draft.data[secId];
}
function initFieldValue(secId, f){
  const val = getSecObj(secId)[f.key];
  const domId = `fld-${secId}-${f.key}`;
  if(f.type === 'chip'){
    const group = document.getElementById(domId);
    if(!group) return;
    const chips = group.querySelectorAll('.chip');
    chips.forEach(c=>{
      const v = c.getAttribute('data-val');
      const selected = f.multi ? (Array.isArray(val) && val.includes(v)) : (val === v);
      c.classList.toggle('selected', !!selected);
    });
  } else if(f.type === 'text' || f.type === 'textarea'){
    const el = document.getElementById(domId);
    if(el) el.value = val || '';
  } else if(f.type === 'dial'){
    const dv = (val === undefined || val === null) ? Math.ceil((f.min+f.max)/2) : val;
    document.getElementById(domId).value = dv;
    updateDialVisual(domId, dv, f);
  } else if(f.type === 'thermo'){
    const dv = (val === undefined || val === null) ? 18 : val;
    document.getElementById(domId).value = dv;
    updateThermoVisual(domId, dv);
  }
}
function onChipClick(secId, key, el, multi){
  const obj = getSecObj(secId);
  const v = el.getAttribute('data-val');
  if(multi){
    let arr = Array.isArray(obj[key]) ? obj[key].slice() : [];
    if(arr.includes(v)) arr = arr.filter(x=>x!==v); else arr.push(v);
    obj[key] = arr;
    el.classList.toggle('selected');
  } else {
    obj[key] = v;
    const parent = el.parentElement;
    parent.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
  }
  refreshTabDots();
}
function onTextInput(secId, key, el){
  getSecObj(secId)[key] = el.value;
  refreshTabDots();
}
function onDialInput(domId, value){
  const [_, secId, key] = domId.split('-');
  const field = findField(secId, key);
  getSecObj(secId)[key] = Number(value);
  updateDialVisual(domId, value, field);
  refreshTabDots();
}
function updateDialVisual(domId, value, f){
  const pct = (value - f.min) / (f.max - f.min);
  const angle = -120 + pct*240;
  document.getElementById(domId+'-needle').style.transform = `translate(-50%,-100%) rotate(${angle}deg)`;
  const labelIdx = Math.min(f.dialLabels.length-1, Math.floor(pct*(f.dialLabels.length)));
  document.getElementById(domId+'-val').textContent = `${value} — ${f.dialLabels[Math.min(labelIdx, f.dialLabels.length-1)]}`;
}
function onThermoInput(domId, value){
  const [_, secId, key] = domId.split('-');
  getSecObj(secId)[key] = Number(value);
  updateThermoVisual(domId, value);
  refreshTabDots();
}
function updateThermoVisual(domId, value){
  const pct = (value - (-10)) / (42 - (-10));
  document.getElementById(domId+'-fill').style.height = (pct*100)+'%';
  document.getElementById(domId+'-val').textContent = `${value} °C`;
  const fillEl = document.getElementById(domId+'-fill');
  if(value <= 10){ fillEl.style.background = 'linear-gradient(#8FC4E8,#3E7C97)'; }
  else if(value >= 28){ fillEl.style.background = 'linear-gradient(#E8A15C,#B5502E)'; }
  else{ fillEl.style.background = 'linear-gradient(#6FA0C4,#3E7C97)'; }
}
function findField(secId, key){
  const sec = SECTIONS.find(s=>s.id===secId);
  return sec.fields.find(f=>f.key===key);
}
function refreshTabDots(){
  SECTIONS.forEach((sec,i)=>{
    const obj = draft.data[sec.id] || {};
    const filled = sec.fields.some(f=>{
      const v = obj[f.key];
      if(Array.isArray(v)) return v.length>0;
      return v !== undefined && v !== null && v !== '';
    });
    const tab = document.getElementById(`tab-${i}`);
    if(tab) tab.classList.toggle('filled', filled);
  });
}
function selectTab(i){
  currentTabIndex = i;
  document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active', idx===i));
  document.querySelectorAll('.section-page').forEach((p,idx)=>p.classList.toggle('active', idx===i));
  document.getElementById('editor-pages').scrollTop = 0;
  document.getElementById('btn-prev-tab').style.visibility = i===0 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('btn-next-tab');
  if(i === SECTIONS.length-1){ nextBtn.textContent = '✅ Guardar entrada'; nextBtn.onclick = saveAndGoSummary; }
  else { nextBtn.textContent = 'Siguiente ›'; nextBtn.onclick = ()=>stepTab(1); }
  const tabEl = document.getElementById(`tab-${i}`);
  if(tabEl) tabEl.scrollIntoView({inline:'center', block:'nearest'});
}
function stepTab(dir){
  const next = currentTabIndex + dir;
  if(next < 0 || next >= SECTIONS.length) return;
  selectTab(next);
}
async function saveAndGoSummary(){
  const idx = plans.findIndex(p=>p.id===draft.id);
  if(idx === -1) plans.push(draft); else plans[idx] = draft;
  await persistPlans();
  currentId = draft.id;
  showToast('📌 Entrada guardada');
  goSummary(currentId);
}
function confirmDeletePlan(){
  if(confirm('¿Borrar esta entrada del cuaderno? No se puede deshacer.')){
    plans = plans.filter(p=>p.id!==currentId);
    persistPlans();
    goCover();
    showToast('🗑 Entrada borrada');
  }
}

/* ============================================================
   CÁLCULO — % de apetencia, % de bienestar, % general
   Heurística transparente: cada factor suma o resta puntos sobre
   una base de 50, y queda listado como "razón" visible. No decide
   por ella — solo ordena lo que ya ha apuntado en una estimación.
   ============================================================ */
function clampPct(n){ return Math.max(0, Math.min(100, Math.round(n))); }

function computeApetencia(p){
  const d = p.data || {};
  const persona = d.persona || {}, clima = d.clima || {}, plan = d.plan || {}, transporte = d.transporte || {};
  let score = 50;
  const reasons = [];

  const relMap = {'Pareja / familia cercana':16,'Familia':9,'Amigo íntimo':14,'Amigo':6,'Conocido':-4,'Trabajo / formal':-10,'Desconocido':0};
  if(persona.relacion && relMap[persona.relacion] !== undefined){
    const v = relMap[persona.relacion]; score += v;
    reasons.push({text:`Relación: ${persona.relacion}`, good:v>=0});
  }

  const climaMap = {'Frío agradable':12,'Nieve':9,'Templado':4,'Nublado':4,'Soleado':-2,'Viento':-4,'Calor':-18,'Lluvia':16};
  if(clima.condicion && climaMap[clima.condicion] !== undefined){
    let v = climaMap[clima.condicion];
    let mult = 1;
    if(plan.ubicacion === 'Exterior') mult = 1.4;
    else if(plan.ubicacion === 'Interior') mult = 0.5;
    v = Math.round(v * mult);
    score += v;
    const loc = plan.ubicacion ? ` (${plan.ubicacion.toLowerCase()})` : '';
    reasons.push({text:`Clima: ${clima.condicion}${loc}`, good:v>=0});
  }

  const groupMap = {'Solo Gato y yo':7,'Grupo pequeño (–5)':2,'Grupo mediano (5–15)':-4,'Grupo grande (+15)':-9};
  if(plan.personas && groupMap[plan.personas] !== undefined){
    const v = groupMap[plan.personas]; score += v;
    reasons.push({text:`Gente allí: ${plan.personas}`, good:v>=0});
  }

  if(transporte.modo === 'Me lleva Gato (gatimoto)' || transporte.modo === 'Me lleva Gato (coche de alguien)'){
    score += 6; reasons.push({text:'Transporte: te lleva Gato — puedes ir y venir con libertad', good:true});
  } else if(transporte.modo === 'Me lleva otra persona'){
    score -= 5; reasons.push({text:'Transporte: te lleva otra persona — dependes de su horario', good:false});
  } else if(transporte.modo === 'Transporte público'){
    score -= 3; reasons.push({text:'Transporte: público, algo más imprevisible', good:false});
  }

  return {pct: clampPct(score), reasons};
}

function computeBienestar(p){
  const d = p.data || {};
  const cuerpo = d.cuerpo || {}, libertad = d.libertad || {};
  let score = 50;
  const reasons = [];

  if(cuerpo.cansancio !== undefined && cuerpo.cansancio !== null){
    const v = Math.round((3 - cuerpo.cansancio) * 7); score += v;
    reasons.push({text:`Cansancio ahora: ${cuerpo.cansancio}/5`, good:v>=0});
  }
  const planesMap = {'Pocos':8,'Algunos':0,'Muchos':-12};
  if(cuerpo.planesRecientes && planesMap[cuerpo.planesRecientes] !== undefined){
    const v = planesMap[cuerpo.planesRecientes]; score += v;
    reasons.push({text:`Planes recientes: ${cuerpo.planesRecientes.toLowerCase()}`, good:v>=0});
  }
  const numAct = parseInt(cuerpo.actividadesHoy, 10);
  if(!isNaN(numAct)){
    let v = 0;
    if(numAct >= 3) v = -9; else if(numAct === 2) v = -4;
    if(v !== 0){ score += v; reasons.push({text:`${numAct} actividades ese día`, good:false}); }
  }
  if(Array.isArray(cuerpo.estadoFisico) && cuerpo.estadoFisico.length){
    if(cuerpo.estadoFisico.length===1 && cuerpo.estadoFisico[0]==='Bien'){
      score += 6; reasons.push({text:'Estado físico: bien', good:true});
    } else {
      const malestares = cuerpo.estadoFisico.filter(x=>x!=='Bien');
      const v = -Math.min(21, malestares.length*7);
      score += v;
      reasons.push({text:`Estado físico: ${malestares.join(', ')}`, good:false});
    }
  }
  const salidaMap = {'Sí, cuando quiera':9,'Debo quedarme un rato':-2,'Debo quedarme todo el plan':-11};
  if(libertad.rutaSalida && salidaMap[libertad.rutaSalida] !== undefined){
    const v = salidaMap[libertad.rutaSalida]; score += v;
    reasons.push({text:`Ruta de salida: ${libertad.rutaSalida.toLowerCase()}`, good:v>=0});
  }
  const mascaraMap = {'Sí, completamente':8,'Un poco de esfuerzo':-3,'Mucho esfuerzo':-13};
  if(libertad.mascara && mascaraMap[libertad.mascara] !== undefined){
    const v = mascaraMap[libertad.mascara]; score += v;
    reasons.push({text:`Ser tú misma allí: ${libertad.mascara.toLowerCase()}`, good:v>=0});
  }
  const sensMap = {'Baja':7,'Media':0,'Alta':-13};
  if(libertad.sensorial && sensMap[libertad.sensorial] !== undefined){
    const v = sensMap[libertad.sensorial]; score += v;
    reasons.push({text:`Carga sensorial: ${libertad.sensorial.toLowerCase()}`, good:v>=0});
  }
  const incertMap = {'Sí, todo definido':8,'Algo puede cambiar':-2,'Muy abierto / incierto':-11};
  if(libertad.incertidumbre && incertMap[libertad.incertidumbre] !== undefined){
    let v = incertMap[libertad.incertidumbre];
    if(libertad.incertidumbre === 'Muy abierto / incierto' && libertad.pajaruna !== undefined){
      const adj = Math.round((libertad.pajaruna - 3) * 4);
      v += adj;
    }
    score += v;
    reasons.push({text:`Qué tan definido está: ${libertad.incertidumbre.toLowerCase()}`, good:v>=0});
  }

  return {pct: clampPct(score), reasons};
}

function scoreLabel(pct){
  if(pct >= 80) return {emoji:'🌟', text:'Probablemente sí'};
  if(pct >= 60) return {emoji:'✅', text:'Buena pinta'};
  if(pct >= 40) return {emoji:'⚖️', text:'Podría ir a cualquier lado'};
  if(pct >= 20) return {emoji:'⚠️', text:'Cuesta bastante hoy'};
  return {emoji:'🛑', text:'Mucho esfuerzo hoy'};
}

function gaugeHTML(pct, label, featured){
  const angle = -120 + (pct/100)*240;
  const ticks = [];
  for(let i=0;i<11;i++){ ticks.push(`<div class="dial-tick" style="transform:rotate(${-120 + i*24}deg)"></div>`); }
  let needleColor = 'var(--warn)';
  if(pct >= 60) needleColor = 'var(--good)'; else if(pct >= 40) needleColor = 'var(--frost-2)';
  return `<div class="gauge-item ${featured?'featured':''}">
    <div class="dial small"><div class="dial-face">
      ${ticks.join('')}
      <div class="dial-needle" style="background:${needleColor}; transform:translate(-50%,-100%) rotate(${angle}deg)"></div>
      <div class="dial-hub"></div>
    </div></div>
    <div class="gauge-pct">${pct}%</div>
    <div class="gauge-label">${esc(label)}</div>
  </div>`;
}

function renderGauges(p){
  const ap = computeApetencia(p);
  const bi = computeBienestar(p);
  const overallPct = clampPct((ap.pct + bi.pct) / 2);
  const lbl = scoreLabel(overallPct);
  const allReasons = [
    {header:'¿Me apetece el plan?'}, ...ap.reasons,
    {header:'¿Me sentará bien ir?'}, ...bi.reasons
  ];
  const reasonsHtml = allReasons.map(r=>{
    if(r.header) return `<div class="cover-section-label" style="margin:10px 4px 6px; color:var(--ink-faint)">${esc(r.header)}</div>`;
    return `<div class="reason-item ${r.good?'good':'bad'}"><span class="r-icon">${r.good?'➕':'➖'}</span><span>${esc(r.text)}</span></div>`;
  }).join('');
  return `<div class="gauges-wrap">
    <div class="gauges-title">Estimación de hoy</div>
    <div class="gauges-row">
      ${gaugeHTML(ap.pct, '¿Me apetece?')}
      ${gaugeHTML(overallPct, '¿Vale la pena?', true)}
      ${gaugeHTML(bi.pct, '¿Me sentará bien?')}
    </div>
    <div class="gauge-overall-line">${lbl.emoji} <b>${lbl.text}</b></div>
    <div class="gauge-disclaimer">Es una estimación con lo que has apuntado, no una decisión — la decisión es siempre tuya.</div>
    <button class="reasons-toggle" onclick="this.nextElementSibling.classList.toggle('open'); this.textContent = this.nextElementSibling.classList.contains('open') ? '▲ ocultar el porqué' : '▼ ver el porqué'">▼ ver el porqué</button>
    <div class="reasons-list">${reasonsHtml || '<div class="empty-note" style="padding:10px">Rellena más secciones para afinar la estimación.</div>'}</div>
  </div>`;
}

/* ============================================================
   SUMMARY RENDER
   ============================================================ */
function renderSummary(id){
  const p = plans.find(x=>x.id===id);
  if(!p) return;
  currentId = id;
  document.getElementById('sum-title').textContent = p.titulo || 'Sin título';
  document.getElementById('sum-date').textContent = [p.fecha, p.hora].filter(Boolean).join(' · ') || 'Sin fecha indicada';

  // stamp banner based on clima preference (frío = bien, calor/lluvia = agobiante)
  const condicion = (p.data.clima && p.data.clima.condicion) || '';
  let bannerHtml = '';
  if(condicion.includes('Frío')){
    bannerHtml = `<div class="stamp-banner stamp-good">❄️ FRÍO — OS GUSTA ESTE TIEMPO</div>`;
  } else if(condicion.includes('Calor') || condicion.includes('Lluvia')){
    bannerHtml = `<div class="stamp-banner stamp-warn">⚠️ ${condicion.toUpperCase()} — SUELE AGOBIAR</div>`;
  }
  document.getElementById('sum-banner-slot').innerHTML = bannerHtml;

  document.getElementById('sum-gauges-slot').innerHTML = renderGauges(p);

  let html = '';
  SECTIONS.forEach(sec=>{
    const obj = p.data[sec.id] || {};
    const rows = sec.fields.map(f=>{
      let v = obj[f.key];
      if(v === undefined || v === null || v === '' || (Array.isArray(v) && v.length===0)) return '';
      if(f.type === 'textarea'){
        return `<div class="summary-free">${esc(v)}</div>`;
      }
      if(Array.isArray(v)) v = v.join(', ');
      if(f.type === 'thermo') v = `${v} °C`;
      if(f.type === 'dial'){
        const idx = Math.min(f.dialLabels.length-1, Math.floor(((v-f.min)/(f.max-f.min))*(f.dialLabels.length)));
        v = `${v}/${f.max} — ${f.dialLabels[Math.min(idx,f.dialLabels.length-1)]}`;
      }
      return `<div class="summary-row"><span class="k">${esc(f.label.replace(/^¿|\?$/g,''))}</span><span class="v">${esc(String(v))}</span></div>`;
    }).join('');
    if(rows.trim()){
      html += `<div class="summary-block"><h3>${sec.icon} ${sec.label}</h3>${rows}</div>`;
    }
  });

  if(p.rating){
    const rr = p.rating;
    let ratingRows = RATING_FIELDS.map(f=>{
      const v = rr[f.key];
      if(v===undefined || v===null) return '';
      const idx = Math.min(f.dialLabels.length-1, Math.floor(((v-f.min)/(f.max-f.min))*(f.dialLabels.length)));
      return `<div class="summary-row"><span class="k">${esc(f.label.replace(/^¿|\?$/g,''))}</span><span class="v">${v}/${f.max} — ${f.dialLabels[Math.min(idx,f.dialLabels.length-1)]}</span></div>`;
    }).join('');
    if(rr.notas) ratingRows += `<div class="summary-free">${esc(rr.notas)}</div>`;
    html += `<div class="summary-block" style="border-left-color:var(--good)"><h3>⭐ Cómo fue en realidad</h3>${ratingRows}</div>`;
  }

  if(!html){
    html = '<div class="empty-note" style="color:var(--ink-faint)">Todavía no has rellenado nada. Toca "Editar" para empezar.</div>';
  }
  document.getElementById('sum-blocks').innerHTML = html;
}

/* ============================================================
   RATING SCREEN
   ============================================================ */
function openRating(id){
  const p = plans.find(x=>x.id===id);
  ratingDraft = p.rating ? JSON.parse(JSON.stringify(p.rating)) : {};
  const wrap = document.getElementById('rating-fields');
  wrap.innerHTML = RATING_FIELDS.map(f=>{
    const domId = `rate-${f.key}`;
    return `<div class="field"><label class="field-label">${esc(f.label)}</label>${dialHTML(domId, f)}</div>`;
  }).join('');
  RATING_FIELDS.forEach(f=>{
    const domId = `rate-${f.key}`;
    const dv = ratingDraft[f.key] !== undefined ? ratingDraft[f.key] : Math.ceil((f.min+f.max)/2);
    document.getElementById(domId).value = dv;
    updateDialVisual(domId, dv, f);
    document.getElementById(domId).oninput = function(){
      ratingDraft[f.key] = Number(this.value);
      updateDialVisual(domId, this.value, f);
    };
  });
  document.getElementById('r-notas').value = ratingDraft.notas || '';
  showScreen('rating-screen');
}
function saveRatingDraft(){
  ratingDraft.notas = document.getElementById('r-notas').value;
}
async function saveRatingAndClose(){
  saveRatingDraft();
  ratingDraft.ratedAt = Date.now();
  const idx = plans.findIndex(p=>p.id===currentId);
  if(idx > -1){
    plans[idx].rating = ratingDraft;
    await persistPlans();
  }
  showToast('⭐ Valoración guardada');
  goSummary(currentId);
}

/* ============================================================
   EXPORT / DOWNLOAD
   ============================================================ */
function downloadSummary(){
  if(plans.length === 0){ showToast('Aún no hay entradas que descargar'); return; }
  let out = 'NUBIFICADOR DE PLANES — resumen\nGenerado: ' + new Date().toLocaleString('es-ES') + '\n';
  out += '='.repeat(44) + '\n\n';
  const sorted = [...plans].sort((a,b)=>a.createdAt-b.createdAt);
  sorted.forEach(p=>{
    out += `— ${p.titulo || 'Sin título'}\n`;
    out += `  Fecha: ${[p.fecha,p.hora].filter(Boolean).join(' ') || '—'}\n`;
    SECTIONS.forEach(sec=>{
      const obj = p.data[sec.id] || {};
      const parts = sec.fields.map(f=>{
        let v = obj[f.key];
        if(v===undefined||v===null||v===''||(Array.isArray(v)&&v.length===0)) return null;
        if(Array.isArray(v)) v = v.join(', ');
        if(f.type==='thermo') v = v+' °C';
        if(f.type==='dial') v = v+'/'+f.max;
        return `${f.label}: ${v}`;
      }).filter(Boolean);
      if(parts.length) out += `  [${sec.label}] ` + parts.join(' | ') + '\n';
    });
    if(p.rating){
      const rr = p.rating;
      const parts = RATING_FIELDS.map(f=> rr[f.key]!==undefined ? `${f.label}: ${rr[f.key]}/${f.max}` : null).filter(Boolean);
      if(rr.notas) parts.push('Notas: '+rr.notas);
      out += `  [Valoración real] ` + parts.join(' | ') + '\n';
    }
    out += '\n';
  });
  const blob = new Blob([out], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nubificador-resumen-' + new Date().toISOString().slice(0,10) + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('⬇ Resumen descargado');
}
</script>
