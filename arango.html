<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editor de Texto</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Asturica';
      src:
        url('https://www.gato.red/fuentes/Asturica.woff2') format('woff2'),
        url('https://www.gato.red/fuentes/Asturica.woff') format('woff'),
        url('https://www.gato.red/fuentes/ASTURICA.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg-light: #f8f4eb;
      --text-blue: #19345a;
      --text-black: #111111;
      --accent-blue: #19345a;
      --accent-black: #111111;
      --accent-dark: #a0c0ff;
      --paper: url('https://plus.unsplash.com/premium_photo-1725347346926-f568729d43b3?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fHBhcGVyJTIwdGV4dHVyZXxlbnwwfHwwfHx8MA%3D%3D') center/cover no-repeat;
      --a4-width: 794px;
      --a4-height: 1123px;
    }
    [data-theme="dark"] {
      --bg-light: #14100a;
      --accent-blue: #a0c0ff;
      --accent-black: #a0c0ff;
      --accent-dark: #a0c0ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Asturica', Georgia, serif;
      background: var(--bg-light);
      color: var(--text-blue);
      min-height: 100vh;
      padding: 20px;
      transition: all 0.4s ease;
    }
    body[data-textcolor="black"] { color: var(--text-black); }
    body[data-theme="dark"] { color: #ffffff; }
    .container { max-width: 860px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; color: var(--accent-blue); }
    body[data-textcolor="black"] header { color: var(--accent-black); }
    body[data-theme="dark"] header { color: var(--accent-dark); }
    h1 { font-size: 2.9rem; letter-spacing: 1.5px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px;
      background: rgba(25,52,90,0.06); padding: 12px 16px;
      border-radius: 12px; margin-bottom: 1.5rem;
      align-items: center; border: 1px solid rgba(25,52,90,0.12);
    }
    body[data-textcolor="black"] .toolbar { background: rgba(17,17,17,0.06); border-color: rgba(17,17,17,0.12); }
    body[data-theme="dark"] .toolbar { background: rgba(160,192,255,0.08); border-color: rgba(160,192,255,0.15); }
    button, select {
      background: rgba(25,52,90,0.08); color: var(--accent-blue);
      border: 1px solid rgba(25,52,90,0.25); padding: 8px 14px;
      border-radius: 8px; cursor: pointer; font-family: 'Asturica', serif;
      font-size: 0.93rem; transition: all 0.2s;
    }
    body[data-textcolor="black"] button, body[data-textcolor="black"] select {
      background: rgba(17,17,17,0.08); color: var(--accent-black); border-color: rgba(17,17,17,0.25);
    }
    body[data-theme="dark"] button, body[data-theme="dark"] select {
      background: rgba(160,192,255,0.12); color: var(--accent-dark); border-color: rgba(160,192,255,0.3);
    }
    button:hover, select:hover { background: rgba(25,52,90,0.18); }
    body[data-textcolor="black"] button:hover, body[data-textcolor="black"] select:hover { background: rgba(17,17,17,0.18); }
    body[data-theme="dark"] button:hover, body[data-theme="dark"] select:hover { background: rgba(160,192,255,0.22); }
    .toolbar-sep { width: 1px; height: 28px; background: rgba(25,52,90,0.2); margin: 0 4px; }
    .editor-wrapper { display: flex; justify-content: center; }
    .editor-container {
      position: relative; width: var(--a4-width); min-height: var(--a4-height);
      border-radius: 4px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18); background: #f8f4eb;
    }
    body[data-theme="dark"] .editor-container { box-shadow: 0 8px 40px rgba(0,0,0,0.5); background: #1a140e; }
    .paper-bg {
      position: absolute; inset: 0; background: var(--paper);
      opacity: 0.12; pointer-events: none; transition: opacity 0.4s; z-index: 0;
    }
    [data-papiro="off"] .paper-bg { opacity: 0; }
    .editor {
      position: relative; z-index: 1; min-height: var(--a4-height);
      padding: 94px 75px; font-size: 1.05rem; line-height: 1.72;
      background: transparent; outline: none; width: 100%;
      font-family: 'Asturica', Georgia, serif;
      caret-color: var(--accent-blue); color: inherit; text-align: justify;
    }
    .editor p, .editor div:not(.fuentes):not(.page-break), .editor li, .editor span { text-align: justify; }
    body[data-textcolor="black"] .editor { caret-color: var(--accent-black); }
    body[data-theme="dark"] .editor { caret-color: var(--accent-dark); }
    .editor blockquote {
      margin: 1.6em 2.8em; padding: 0.4em 1.2em 0.4em 1.8em;
      border-left: 4px solid var(--accent-blue); color: var(--accent-blue);
      font-style: italic; background: rgba(25,52,90,0.04);
    }
    body[data-textcolor="black"] .editor blockquote { border-left-color: var(--accent-black); color: var(--accent-black); background: rgba(17,17,17,0.04); }
    body[data-theme="dark"] .editor blockquote { border-left-color: var(--accent-dark); color: var(--accent-dark); background: rgba(160,192,255,0.06); }
    .editor .fuentes {
      margin: 2.5em 1.5em 1em; padding: 1.2em 2em;
      border-top: 2px solid rgba(25,52,90,0.4); border-bottom: 2px solid rgba(25,52,90,0.4);
      font-size: 0.95rem; color: var(--accent-blue); background: rgba(25,52,90,0.03);
    }
    body[data-textcolor="black"] .editor .fuentes { border-color: rgba(17,17,17,0.5); color: var(--accent-black); background: rgba(17,17,17,0.03); }
    body[data-theme="dark"] .editor .fuentes { border-color: rgba(160,192,255,0.5); color: var(--accent-dark); background: rgba(160,192,255,0.05); }
    .editor h1, .editor h2 { color: var(--accent-blue); margin: 1.4em 0 0.6em; }
    body[data-textcolor="black"] .editor h1, body[data-textcolor="black"] .editor h2 { color: var(--accent-black); }
    body[data-theme="dark"] .editor h1, body[data-theme="dark"] .editor h2 { color: var(--accent-dark); }

    /* ── SALTO DE PÁGINA MANUAL ── */
    .editor .page-break {
      display: block;
      width: 100%;
      height: 0;
      border: none;
      border-top: 2px dashed rgba(25,52,90,0.35);
      margin: 1.6em 0;
      position: relative;
      cursor: default;
      contenteditable: false;
    }
    .editor .page-break::after {
      content: '— salto de página —';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #f8f4eb;
      padding: 0 12px;
      font-size: 0.75rem;
      opacity: 0.5;
      font-family: 'Asturica', Georgia, serif;
      letter-spacing: 1px;
      white-space: nowrap;
      pointer-events: none;
    }
    body[data-theme="dark"] .editor .page-break { border-color: rgba(160,192,255,0.3); }
    body[data-theme="dark"] .editor .page-break::after { background: #1a140e; color: #a0c0ff; }
    body[data-textcolor="black"] .editor .page-break { border-color: rgba(17,17,17,0.3); }

    .status { margin-top: 1.2rem; text-align: center; font-size: 0.88rem; opacity: 0.7; }

    /* ── MODAL PIN ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 9999;
      align-items: center; justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
      background: #f8f4eb; border: 2px solid rgba(25,52,90,0.3);
      border-radius: 14px; padding: 2.5rem 3rem; text-align: center;
      font-family: 'Asturica', serif; color: #19345a; min-width: 320px;
      box-shadow: 0 12px 50px rgba(0,0,0,0.25);
    }
    .modal-box h2 { margin-bottom: 1rem; font-size: 1.4rem; }
    .modal-box p { margin-bottom: 1.4rem; font-size: 0.95rem; opacity: 0.8; }
    .modal-box input[type="password"] {
      width: 140px; padding: 10px 14px; font-size: 1.2rem;
      letter-spacing: 6px; border: 2px solid rgba(25,52,90,0.35);
      border-radius: 8px; text-align: center; font-family: 'Asturica', serif;
      background: #fff; color: #19345a; margin-bottom: 1.2rem;
      display: block; margin-left: auto; margin-right: auto;
    }
    .modal-box .btn-row { display: flex; gap: 12px; justify-content: center; }
    .modal-box .btn-confirm {
      background: #19345a; color: #f8f4eb; border: none;
      padding: 10px 24px; border-radius: 8px; font-family: 'Asturica', serif;
      font-size: 0.95rem; cursor: pointer;
    }
    .modal-box .btn-confirm:hover { background: #0f2040; }
    .modal-box .btn-cancel {
      background: transparent; color: #19345a; border: 1px solid rgba(25,52,90,0.3);
      padding: 10px 24px; border-radius: 8px; font-family: 'Asturica', serif;
      font-size: 0.95rem; cursor: pointer;
    }
    .modal-box .pin-error { color: #c0392b; font-size: 0.88rem; margin-top: -0.6rem; margin-bottom: 0.8rem; min-height: 1.2em; }

    /* ── MODAL CARTA OFICIAL ── */
    #cartaModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.72); z-index: 10000;
      align-items: flex-start; justify-content: center;
      overflow-y: auto; padding: 30px 20px;
    }
    #cartaModal.visible { display: flex; }
    .carta-modal-inner { position: relative; width: 794px; flex-shrink: 0; }
    .carta-modal-toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 12px; }
    .carta-modal-toolbar button {
      background: #f8f4eb; color: #19345a; border: 1px solid rgba(25,52,90,0.35);
      padding: 8px 18px; border-radius: 8px; font-family: 'Asturica', serif;
      font-size: 0.9rem; cursor: pointer;
    }
    .carta-modal-toolbar button:hover { background: #e8e2d5; }
    .carta-modal-toolbar .btn-close-carta { background: #19345a; color: #f8f4eb; border-color: transparent; }
    .carta-modal-toolbar .btn-close-carta:hover { background: #0f2040; }
    .btn-downloading { opacity: 0.6; cursor: wait !important; pointer-events: none; }

    .carta-shell {
      position: relative; width: 794px; min-height: 1123px;
      background: #f8f4eb; font-family: 'Asturica', Georgia, serif;
      color: #19345a; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.35);
    }
    .carta-paper-bg {
      position: absolute; inset: 0; background: var(--paper);
      opacity: 0.2; pointer-events: none; z-index: 0;
    }
    .carta-watermark {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; pointer-events: none; z-index: 1;
    }
    .carta-watermark img { width: 520px; height: auto; opacity: 0.18; }
    .carta-body { position: relative; z-index: 2; padding: 0 75px 60px; }
    .carta-header {
      position: relative; display: flex; align-items: center;
      justify-content: space-between; padding: 36px 0 24px;
      border-bottom: 2px solid rgba(25,52,90,0.35); margin-bottom: 36px;
    }
    .carta-header img.escudo-header { height: 120px; width: auto; flex-shrink: 0; }
    .carta-header .header-title {
      position: absolute; left: 0; right: 0; text-align: center;
      font-size: 1.5rem; font-weight: bold; letter-spacing: 1px;
      color: #19345a; pointer-events: none;
    }
    .carta-header .header-text {
      text-align: right; font-size: 1rem; line-height: 1.5;
      opacity: 0.75; color: #19345a; flex-shrink: 0; margin-left: auto;
    }
    .carta-content { font-size: 1.05rem; line-height: 1.72; text-align: justify; }
    .carta-content p, .carta-content div, .carta-content li, .carta-content span { text-align: justify; }
    /* Ocultar el salto de página visual en la previsualización de carta */
    .carta-content .page-break { display: none; }

    .carta-footer {
      position: absolute; bottom: 0; left: 0; right: 0; height: 50px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 75px; border-top: 1px solid rgba(25,52,90,0.25);
      font-size: 0.75rem; color: #19345a; opacity: 0.65;
      font-family: 'Asturica', Georgia, serif; z-index: 3;
    }
    .carta-footer .footer-left { font-style: italic; }

    #carta-render {
      position: fixed; left: -9999px; top: 0; width: 794px;
      visibility: hidden; pointer-events: none; z-index: 1;
    }
  </style>
</head>
<body data-theme="light" data-textcolor="blue" data-papiro="on">
  <div class="container">
    <header>
      <h1></h1>
      <p style="margin-top:10px;opacity:0.9;">Editor de Texto</p>
    </header>
    <div class="toolbar">
      <button onclick="execCmd('bold')">Negrita</button>
      <button onclick="execCmd('italic')">Cursiva</button>
      <button onclick="insertQuote()">Cita</button>
      <button onclick="formatBlock('h1')">Título grande</button>
      <button onclick="formatBlock('h2')">Título medio</button>
      <button onclick="formatBlock('p')">Párrafo</button>
      <button onclick="insertFuentes()">Fuentes</button>
      <button onclick="insertPageBreak()">+ Página</button>
      <div class="toolbar-sep"></div>
      <button onclick="copyFormatted()">Copiar con formato</button>
      <button onclick="downloadHTML()">Descargar HTML</button>
      <button onclick="downloadPNG()">Descargar PNG</button>
      <button onclick="downloadPDF()">Descargar PDF</button>
      <button onclick="solicitarCartaOficial()">Carta Oficial</button>
      <div class="toolbar-sep"></div>
      <button id="toggleTheme" onclick="toggleTheme()">Modo oscuro</button>
      <button id="toggleTextColor" onclick="toggleTextColor()">Texto negro</button>
      <button id="togglePapiro" onclick="togglePapiro()">Quitar papiro</button>
    </div>
    <div class="editor-wrapper">
      <div class="editor-container">
        <div class="paper-bg"></div>
        <div contenteditable="true" class="editor" id="editor"></div>
      </div>
    </div>
    <div class="status">El Gato Arango</div>
  </div>

  <!-- MODAL PIN -->
  <div class="modal-overlay" id="pinModal">
    <div class="modal-box">
      <h2>🔒 Carta Oficial</h2>
      <p>Introduce el PIN para generar la Carta Oficial con membrete y sello de Arango.</p>
      <input type="password" id="pinInput" maxlength="6" placeholder="····" autocomplete="off" />
      <div class="pin-error" id="pinError"></div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-confirm" onclick="verificarPin()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- MODAL CARTA OFICIAL -->
  <div id="cartaModal">
    <div class="carta-modal-inner">
      <div class="carta-modal-toolbar">
        <button id="btnDescargaCarta" onclick="descargarCartaPDF()">⬇ Descargar PDF</button>
        <button class="btn-close-carta" onclick="cerrarCartaModal()">✕ Cerrar</button>
      </div>
      <div class="carta-shell" id="carta-display">
        <div class="carta-paper-bg"></div>
        <div class="carta-watermark">
          <img src="https://raw.githubusercontent.com/WolfArangr/gato/refs/heads/main/escudo/Escudo%20Arango%20transparente%20HQ.png"
               alt="Marca de agua" crossorigin="anonymous" />
        </div>
        <div class="carta-body">
          <div class="carta-header">
            <img class="escudo-header"
                 src="https://raw.githubusercontent.com/WolfArangr/gato/refs/heads/main/escudo/Escudo%20Arango%20transparente.png"
                 alt="Escudo Arango" crossorigin="anonymous" />
            <div class="header-title">Casa Arango</div>
            <div class="header-text" id="carta-fecha-display"></div>
          </div>
          <div class="carta-content" id="carta-content-display"></div>
        </div>
        <div class="carta-footer">
          <span class="footer-left">Documento Oficial · Casa Arango</span>
          <span id="footer-page-display"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="carta-render"></div>

  <script>
    const editor = document.getElementById('editor');
    let pinVerificado = false;

    /* ── Precarga de imágenes ── */
    ['https://raw.githubusercontent.com/WolfArangr/gato/refs/heads/main/escudo/Escudo%20Arango%20transparente%20HQ.png',
     'https://raw.githubusercontent.com/WolfArangr/gato/refs/heads/main/escudo/Escudo%20Arango%20transparente.png'
    ].forEach(url => { const i = new Image(); i.crossOrigin = 'anonymous'; i.src = url; });

    /* ── Comandos básicos ── */
    function execCmd(cmd) { document.execCommand(cmd, false, null); editor.focus(); }
    function formatBlock(tag) { document.execCommand('formatBlock', false, tag); editor.focus(); }
    function insertQuote() { document.execCommand('formatBlock', false, 'blockquote'); editor.focus(); }

    /* ── Insertar salto de página manual ── */
    function insertPageBreak() {
      const sel = window.getSelection();
      if (!sel.rangeCount) { editor.focus(); return; }
      const range = sel.getRangeAt(0);
      range.collapse(false);

      // El salto: div no editable con clase page-break
      const brDiv = document.createElement('div');
      brDiv.className = 'page-break';
      brDiv.setAttribute('contenteditable', 'false');
      brDiv.setAttribute('data-page-break', 'true');

      // Párrafo vacío después del salto para seguir escribiendo
      const after = document.createElement('p');
      after.innerHTML = '<br>';

      range.insertNode(after);
      range.insertNode(brDiv);

      // Mover el cursor al párrafo siguiente
      const newRange = document.createRange();
      newRange.setStart(after, 0);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
      editor.focus();
    }

    function insertFuentes() {
      const sel = window.getSelection();
      if (!sel.rangeCount) { editor.focus(); return; }
      const range = sel.getRangeAt(0);
      let container = range.commonAncestorContainer;
      while (container && container !== editor) {
        if (container.nodeType === 1 && container.classList?.contains('fuentes')) {
          const nb = document.createElement('div'); nb.innerHTML = '• ';
          container.appendChild(document.createElement('br'));
          container.appendChild(nb);
          const r = document.createRange(); r.setStart(nb, 0); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
          editor.focus(); return;
        }
        container = container.parentElement;
      }
      document.execCommand('formatBlock', false, 'div');
      const sel2 = window.getSelection();
      if (sel2.rangeCount) {
        const r2 = sel2.getRangeAt(0);
        const div = document.createElement('div');
        div.className = 'fuentes';
        div.innerHTML = '<strong>Fuentes:</strong><br>• ';
        r2.deleteContents(); r2.insertNode(div);
        const last = div.querySelector('div') || div.lastChild;
        if (last) {
          const br = document.createRange();
          br.setStart(last, last.textContent.length); br.collapse(true);
          sel2.removeAllRanges(); sel2.addRange(br);
        }
      }
      editor.focus();
    }

    /* ── Apariencia ── */
    function toggleTheme() {
      const d = document.body.dataset.theme === 'dark';
      document.body.dataset.theme = d ? 'light' : 'dark';
      document.getElementById('toggleTheme').textContent = d ? 'Modo oscuro' : 'Modo claro';
    }
    function toggleTextColor() {
      const next = document.body.dataset.textcolor === 'blue' ? 'black' : 'blue';
      document.body.dataset.textcolor = next;
      document.getElementById('toggleTextColor').textContent = next === 'blue' ? 'Texto negro' : 'Texto azul';
    }
    function togglePapiro() {
      const on = document.body.dataset.papiro === 'on';
      document.body.dataset.papiro = on ? 'off' : 'on';
      document.getElementById('togglePapiro').textContent = on ? 'Poner papiro' : 'Quitar papiro';
    }

    /* ── Copiar con formato ── */
    async function copyFormatted() {
      try {
        const blob = new Blob([editor.innerHTML], { type: 'text/html' });
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]);
        alert('Copiado con formato');
      } catch(e) { alert('Error al copiar'); }
    }

    /* ── Descargar HTML ── */
    function downloadHTML() {
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Texto Asturianizado</title>
<style>body{font-family:'Asturica',serif;background:#f8f4eb;padding:75px 94px;font-size:1.05rem;line-height:1.72;text-align:justify;}p,div,li,span{text-align:justify;}.page-break{display:none;}</style></head>
<body>${editor.innerHTML}</body></html>`;
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'texto-asturiano.html'; a.click();
      URL.revokeObjectURL(url);
    }

    /* ── Descargar PNG ── */
    async function downloadPNG() {
      try {
        const c = document.querySelector('.editor-container');
        const canvas = await html2canvas(c, { scale:2, backgroundColor:'#f8f4eb', width:794, height:c.scrollHeight, windowWidth:794, useCORS:true, allowTaint:false });
        const a = document.createElement('a'); a.download='texto-asturiano.png'; a.href=canvas.toDataURL('image/png'); a.click();
      } catch(e) { alert('Error al generar PNG: '+e.message); }
    }

    /*
     * ════════════════════════════════════════════════════════════════
     * paginarPorSaltos()
     *
     * Divide los nodos hijo del editor en páginas usando ÚNICAMENTE
     * los saltos manuales (data-page-break="true") como puntos de corte.
     * Si no hay ningún salto, todo el contenido va en una sola página.
     *
     * Devuelve: array de arrays de nodos clonados, uno por página.
     * ════════════════════════════════════════════════════════════════
     */
    function paginarPorSaltos(html) {
      const probe = document.createElement('div');
      probe.innerHTML = html;

      const pages = [];
      let current = [];

      for (const node of Array.from(probe.childNodes)) {
        // Nodo de salto de página → cerrar página actual y abrir nueva
        if (node.nodeType === Node.ELEMENT_NODE &&
            node.getAttribute && node.getAttribute('data-page-break') === 'true') {
          pages.push(current);
          current = [];
          continue;
        }
        current.push(node.cloneNode(true));
      }
      if (current.length > 0) pages.push(current);
      return pages;
    }

    /* ── Descargar PDF (editor normal) — paginado por saltos manuales ── */
    async function downloadPDF() {
      try {
        const { jsPDF } = window.jspdf;
        const renderEl = document.getElementById('carta-render');
        const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

        const PAGE_PX  = 1123;
        const PAD_TOP  = 94;
        const PAD_SIDE = 75;
        const PAD_BOT  = 75;

        const pages = paginarPorSaltos(editor.innerHTML);

        for (let p = 0; p < pages.length; p++) {
          const pageDiv = document.createElement('div');
          pageDiv.style.cssText = `width:794px;min-height:${PAGE_PX}px;background:#f8f4eb;font-family:'Asturica',Georgia,serif;color:#19345a;padding:${PAD_TOP}px ${PAD_SIDE}px ${PAD_BOT}px;box-sizing:border-box;text-align:justify;`;
          pages[p].forEach(n => pageDiv.appendChild(n.cloneNode(true)));

          renderEl.innerHTML = '';
          renderEl.appendChild(pageDiv);
          renderEl.style.visibility = 'visible';
          await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

          const realH = Math.max(PAGE_PX, pageDiv.scrollHeight);
          pageDiv.style.height = realH + 'px';

          const canvas = await html2canvas(pageDiv, {
            scale: 2, backgroundColor: '#f8f4eb',
            width: 794, height: realH,
            windowWidth: 794, useCORS: true, allowTaint: false
          });
          if (p > 0) pdf.addPage();
          pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
          renderEl.innerHTML = '';
        }

        renderEl.style.visibility = 'hidden';
        pdf.save('texto-asturiano.pdf');
      } catch(e) { alert('Error al generar PDF: ' + e.message); }
    }

    /* ── MODAL PIN ── */
    function solicitarCartaOficial() {
      if (pinVerificado) { mostrarCartaOficial(); return; }
      document.getElementById('pinInput').value = '';
      document.getElementById('pinError').textContent = '';
      document.getElementById('pinModal').classList.add('visible');
      setTimeout(() => document.getElementById('pinInput').focus(), 100);
    }
    function cerrarModal() { document.getElementById('pinModal').classList.remove('visible'); }
    function verificarPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === '4322') {
        pinVerificado = true;
        cerrarModal();
        mostrarCartaOficial();
      } else {
        document.getElementById('pinError').textContent = 'PIN incorrecto. Inténtalo de nuevo.';
        document.getElementById('pinInput').value = '';
        document.getElementById('pinInput').focus();
      }
    }
    document.addEventListener('keydown', e => {
      if (document.getElementById('pinModal').classList.contains('visible')) {
        if (e.key === 'Enter') verificarPin();
        if (e.key === 'Escape') cerrarModal();
      }
      if (document.getElementById('cartaModal').classList.contains('visible')) {
        if (e.key === 'Escape') cerrarCartaModal();
      }
    });

    /* ── Mostrar Carta Oficial en modal ── */
    function mostrarCartaOficial() {
      const fecha = new Date().toLocaleDateString('es-ES', { year:'numeric', month:'long', day:'numeric' });
      document.getElementById('carta-fecha-display').textContent = fecha;
      document.getElementById('carta-content-display').innerHTML = editor.innerHTML;
      const totalPgs = paginarPorSaltos(editor.innerHTML).length;
      // Solo mostrar numeración si hay más de una página
      const footerPag = document.getElementById('footer-page-display');
      footerPag.textContent = totalPgs > 1 ? `Páginas 1–${totalPgs}` : '';
      document.getElementById('cartaModal').classList.add('visible');
      document.body.style.overflow = 'hidden';
    }
    function cerrarCartaModal() {
      document.getElementById('cartaModal').classList.remove('visible');
      document.body.style.overflow = '';
    }

    /* Constantes carta oficial */
    const CARTA_PAGE_PX  = 1123;
    const CARTA_PAD_SIDE = 75;
    const CARTA_PAD_BOT  = 60;
    const CARTA_HEADER_H = 188;
    const CARTA_FOOTER_H = 50;

    /* ── Descargar PDF Carta Oficial — paginado por saltos manuales ── */
    async function descargarCartaPDF() {
      const btn = document.getElementById('btnDescargaCarta');
      btn.classList.add('btn-downloading');
      btn.textContent = '⏳ Generando…';

      const fecha = new Date().toLocaleDateString('es-ES', { year:'numeric', month:'long', day:'numeric' });
      const renderEl = document.getElementById('carta-render');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

      const pages = paginarPorSaltos(editor.innerHTML);
      const totalPgs = pages.length;

      for (let p = 0; p < totalPgs; p++) {
        const esP1 = p === 0;

        // Construir la página como nodos DOM
        const pageWrap = document.createElement('div');
        pageWrap.style.cssText = `position:relative;width:794px;min-height:${CARTA_PAGE_PX}px;background:#f8f4eb;font-family:'Asturica',Georgia,serif;color:#19345a;overflow:hidden;`;

        // Fondo papiro
        const papiro = document.createElement('div');
        papiro.style.cssText = `position:absolute;inset:0;background:url('https://plus.unsplash.com/premium_photo-1725347346926-f568729d43b3?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fHBhcGVyJTIwdGV4dHVyZXxlbnwwfHwwfHx8MA%3D%3D') center/cover no-repeat;opacity:0.2;pointer-events:none;z-index:0;`;
        pageWrap.appendChild(papiro);

        // Marca de agua
        const wmDiv = document.createElement('div');
        wmDiv.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1;';
        const wmImg = document.createElement('img');
        wmImg.src = 'https://raw.githubusercontent.com/WolfArangr/gato/refs/heads/main/escudo/Escudo%20Arango%20transparente%20HQ.png';
        wmImg.crossOrigin = 'anonymous';
        wmImg.style.cssText = 'width:520px;height:auto;opacity:0.18;';
        wmDiv.appendChild(wmImg);
        pageWrap.appendChild(wmDiv);

        // Cuerpo
        const bodyDiv = document.createElement('div');
        bodyDiv.style.cssText = `position:relative;z-index:2;padding:0 ${CARTA_PAD_SIDE}px ${CARTA_PAD_BOT}px;`;

        if (esP1) {
          const header = document.createElement('div');
          header.style.cssText = 'position:relative;display:flex;align-items:center;justify-content:space-between;padding:36px 0 24px;border-bottom:2px solid rgba(25,52,90,0.35);margin-bottom:36px;';
          const escudo = document.createElement('img');
          escudo.src = 'https://raw.githubusercontent.com/WolfArangr/gato/refs/heads/main/escudo/Escudo%20Arango%20transparente.png';
          escudo.crossOrigin = 'anonymous';
          escudo.style.cssText = 'height:90px;width:auto;flex-shrink:0;';
          const titulo = document.createElement('div');
          titulo.style.cssText = 'position:absolute;left:0;right:0;text-align:center;font-size:1.25rem;font-weight:bold;letter-spacing:1px;color:#19345a;';
          titulo.textContent = 'Casa Arango';
          const fechaDiv = document.createElement('div');
          fechaDiv.style.cssText = 'text-align:right;font-size:0.82rem;line-height:1.5;opacity:0.75;color:#19345a;flex-shrink:0;margin-left:auto;';
          fechaDiv.textContent = fecha;
          header.appendChild(escudo);
          header.appendChild(titulo);
          header.appendChild(fechaDiv);
          bodyDiv.appendChild(header);
        } else {
          const spacer = document.createElement('div');
          spacer.style.height = '36px';
          bodyDiv.appendChild(spacer);
        }

        // Contenido de la página
        const contentDiv = document.createElement('div');
        contentDiv.style.cssText = 'font-size:1.05rem;line-height:1.72;text-align:justify;';
        pages[p].forEach(n => contentDiv.appendChild(n.cloneNode(true)));
        bodyDiv.appendChild(contentDiv);
        pageWrap.appendChild(bodyDiv);

        // Pie de página — sin número si solo hay una página
        const footer = document.createElement('div');
        footer.style.cssText = `position:absolute;bottom:0;left:0;right:0;height:${CARTA_FOOTER_H}px;display:flex;align-items:center;justify-content:space-between;padding:0 ${CARTA_PAD_SIDE}px;border-top:1px solid rgba(25,52,90,0.25);font-size:0.75rem;color:#19345a;opacity:0.65;font-family:'Asturica',Georgia,serif;z-index:3;`;
        const footL = document.createElement('span');
        footL.style.fontStyle = 'italic';
        footL.textContent = 'Documento Oficial · Casa Arango';
        footer.appendChild(footL);
        if (totalPgs > 1) {
          const footR = document.createElement('span');
          footR.textContent = `Página ${p + 1} de ${totalPgs}`;
          footer.appendChild(footR);
        }
        pageWrap.appendChild(footer);

        renderEl.innerHTML = '';
        renderEl.appendChild(pageWrap);
        renderEl.style.visibility = 'visible';
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        // Altura real del contenido de esta página
        const realH = Math.max(CARTA_PAGE_PX, pageWrap.scrollHeight);
        pageWrap.style.height = realH + 'px';

        const canvas = await html2canvas(pageWrap, {
          scale: 2, backgroundColor: '#f8f4eb',
          width: 794, height: realH,
          windowWidth: 794, useCORS: true, allowTaint: false
        });

        if (p > 0) pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
        renderEl.innerHTML = '';
      }

      renderEl.style.visibility = 'hidden';
      pdf.save('documento-oficial-arango.pdf');
      btn.classList.remove('btn-downloading');
      btn.textContent = '⬇ Descargar PDF';
    }

    /* Evitar que los botones de la toolbar quiten la selección del editor */
    document.querySelectorAll('.toolbar button, .toolbar select').forEach(el => {
      el.addEventListener('mousedown', e => e.preventDefault());
    });
    editor.focus();
  </script>
</body>
