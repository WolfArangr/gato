<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editor de Texto por Páginas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Asturica';
      src: url('https://www.gato.red/fuentes/Asturica.woff2') format('woff2'),
           url('https://www.gato.red/fuentes/Asturica.woff') format('woff'),
           url('https://www.gato.red/fuentes/ASTURICA.ttf') format('truetype');
      font-weight: normal; font-style: normal; font-display: swap;
    }

    :root {
      --bg-light: #f8f4eb;
      --text-blue: #19345a;
      --text-black: #111111;
      --accent-blue: #19345a;
      --accent-black: #111111;
      --accent-dark: #a0c0ff;
      --paper: url('https://plus.unsplash.com/premium_photo-1725347346926-f568729d43b3?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fHBhcGVyJTIwdGV4dHVyZXxlbnwwfHwwfHx8MA%3D%3D') center/cover no-repeat;
      --a4-width: 794px;
      --a4-height: 1123px;
    }

    [data-theme="dark"] {
      --bg-light: #14100a;
      --accent-blue: #a0c0ff;
      --accent-black: #a0c0ff;
      --accent-dark: #a0c0ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Asturica', Georgia, serif;
      background: var(--bg-light);
      color: var(--text-blue);
      min-height: 100vh;
      padding: 20px;
      transition: all 0.4s ease;
    }

    body[data-textcolor="black"] { color: var(--text-black); }
    body[data-theme="dark"] { color: #ffffff; }

    .container { max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2rem; color: var(--accent-blue); }
    body[data-textcolor="black"] header { color: var(--accent-black); }
    body[data-theme="dark"] header { color: var(--accent-dark); }
    h1 { font-size: 2.9rem; letter-spacing: 1.5px; }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px;
      background: rgba(25,52,90,0.06); padding: 12px 16px;
      border-radius: 12px; margin-bottom: 1.5rem; align-items: center;
      border: 1px solid rgba(25,52,90,0.12);
    }

    button, select {
      background: rgba(25,52,90,0.08); color: var(--accent-blue);
      border: 1px solid rgba(25,52,90,0.25); padding: 8px 14px;
      border-radius: 8px; cursor: pointer; font-family: 'Asturica', serif;
      font-size: 0.93rem; transition: all 0.2s;
    }

    button:hover { background: rgba(25,52,90,0.18); }

    .toolbar-sep { width: 1px; height: 28px; background: rgba(25,52,90,0.2); margin: 0 4px; }

    .pages-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
      padding-bottom: 40px;
    }

    .page {
      position: relative;
      width: var(--a4-width);
      min-height: var(--a4-height);
      background: #f8f4eb;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      overflow: hidden;
    }

    body[data-theme="dark"] .page {
      background: #1a140e;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .paper-bg {
      position: absolute; inset: 0;
      background: var(--paper);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    [data-papiro="off"] .paper-bg { opacity: 0; }

    .page-content {
      position: relative;
      z-index: 1;
      min-height: var(--a4-height);
      padding: 94px 75px 100px;
      font-size: 1.05rem;
      line-height: 1.72;
      background: transparent;
      outline: none;
      width: 100%;
      font-family: 'Asturica', Georgia, serif;
      caret-color: var(--accent-blue);
      color: inherit;
      text-align: justify;
    }

    .page-content p, .page-content div:not(.fuentes), .page-content li, .page-content span {
      text-align: justify;
    }

    .page-number {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      color: rgba(25,52,90,0.55);
      font-family: 'Asturica', serif;
      pointer-events: none;
      z-index: 10;
    }

    .add-page-btn {
      margin: 20px 0;
      padding: 12px 24px;
      font-size: 1.05rem;
      background: rgba(25,52,90,0.1);
      border: 2px dashed rgba(25,52,90,0.5);
      color: var(--accent-blue);
      cursor: pointer;
      border-radius: 8px;
    }

    .add-page-btn:hover {
      background: rgba(25,52,90,0.2);
      border-style: solid;
    }

    /* Modal styles (sin cambios) */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 9999;
      align-items: center; justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
      background: #f8f4eb; border: 2px solid rgba(25,52,90,0.3);
      border-radius: 14px; padding: 2.5rem 3rem;
      text-align: center; font-family: 'Asturica', serif;
      color: #19345a; min-width: 320px;
      box-shadow: 0 12px 50px rgba(0,0,0,0.25);
    }
    /* ... resto de estilos de modales se mantienen iguales ... */
  </style>
</head>
<body data-theme="light" data-textcolor="blue" data-papiro="on">

  <div class="container">
    <header>
      <h1>Editor por Páginas</h1>
      <p style="margin-top:10px;opacity:0.9;">Arrastra texto entre páginas • Añade páginas manualmente</p>
    </header>

    <div class="toolbar">
      <button onclick="execCmd('bold')">Negrita</button>
      <button onclick="execCmd('italic')">Cursiva</button>
      <button onclick="insertQuote()">Cita</button>
      <button onclick="formatBlock('h1')">Título grande</button>
      <button onclick="formatBlock('h2')">Título medio</button>
      <button onclick="formatBlock('p')">Párrafo</button>
      <button onclick="insertFuentes()">Fuentes</button>
      <div class="toolbar-sep"></div>
      <button onclick="copyFormatted()">Copiar con formato</button>
      <button onclick="downloadHTML()">Descargar HTML</button>
      <button onclick="downloadPNG()">Descargar PNG</button>
      <button onclick="downloadPDF()">Descargar PDF</button>
      <button onclick="solicitarCartaOficial()">Carta Oficial</button>
      <div class="toolbar-sep"></div>
      <button id="toggleTheme" onclick="toggleTheme()">Modo oscuro</button>
      <button id="toggleTextColor" onclick="toggleTextColor()">Texto negro</button>
      <button id="togglePapiro" onclick="togglePapiro()">Quitar papiro</button>
    </div>

    <div class="pages-container" id="pagesContainer"></div>

    <button onclick="addNewPage()" class="add-page-btn">+ Añadir nueva página</button>

    <div class="status">El Gato Arango</div>
  </div>

  <!-- Modal PIN -->
  <div class="modal-overlay" id="pinModal">
    <div class="modal-box">
      <h2>🔒 Carta Oficial</h2>
      <p>Introduce el PIN para generar la Carta Oficial con membrete y sello de Arango.</p>
      <input type="password" id="pinInput" maxlength="6" placeholder="····" autocomplete="off" />
      <div class="pin-error" id="pinError"></div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-confirm" onclick="verificarPin()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Modal Carta Oficial -->
  <div id="cartaModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:10000;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 20px;">
    <div style="position:relative;width:794px;flex-shrink:0;">
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:12px;">
        <button id="btnDescargaCarta" onclick="descargarCartaPDF()">⬇ Descargar PDF</button>
        <button onclick="cerrarCartaModal()" style="background:#19345a;color:#f8f4eb;border:none;">✕ Cerrar</button>
      </div>
      <div class="carta-shell" id="carta-display" style="position:relative;width:794px;min-height:1123px;background:#f8f4eb;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.35);">
        <!-- Se llena dinámicamente -->
      </div>
    </div>
  </div>

  <div id="carta-render" style="position:fixed;left:-9999px;top:0;visibility:hidden;"></div>

  <script>
    const pagesContainer = document.getElementById('pagesContainer');
    let pages = [];

    function createPage() {
      const pageIndex = pages.length + 1;
      const page = document.createElement('div');
      page.className = 'page';
      page.innerHTML = `
        <div class="paper-bg"></div>
        <div contenteditable="true" class="page-content" spellcheck="false"></div>
        <div class="page-number"></div>
      `;

      const contentEditable = page.querySelector('.page-content');

      // Drag and drop entre páginas
      contentEditable.addEventListener('dragstart', function(e) {
        const selectedText = window.getSelection().toString();
        if (selectedText) {
          e.dataTransfer.setData('text/plain', selectedText);
        }
      });

      contentEditable.addEventListener('dragover', e => e.preventDefault());
      contentEditable.addEventListener('drop', function(e) {
        e.preventDefault();
        const text = e.dataTransfer.getData('text/plain');
        if (text) {
          document.execCommand('insertText', false, text);
        }
      });

      contentEditable.addEventListener('input', updatePageNumbers);

      pages.push(page);
      pagesContainer.appendChild(page);
      updatePageNumbers();
      contentEditable.focus();
      return page;
    }

    function addNewPage() {
      createPage();
    }

    function updatePageNumbers() {
      const totalPages = pages.length;
      pages.forEach((page, index) => {
        const numberEl = page.querySelector('.page-number');
        if (totalPages > 1) {
          numberEl.textContent = `Página ${index + 1} de ${totalPages}`;
          numberEl.style.display = 'block';
        } else {
          numberEl.style.display = 'none';
        }
      });
    }

    // Comandos básicos
    function execCmd(cmd) { document.execCommand(cmd, false, null); }
    function formatBlock(tag) { document.execCommand('formatBlock', false, tag); }
    function insertQuote() { document.execCommand('formatBlock', false, 'blockquote'); }

    function insertFuentes() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      const div = document.createElement('div');
      div.className = 'fuentes';
      div.innerHTML = '<strong>Fuentes:</strong><br>• ';
      range.deleteContents();
      range.insertNode(div);
    }

    // Apariencia
    function toggleTheme() {
      const isDark = document.body.dataset.theme === 'dark';
      document.body.dataset.theme = isDark ? 'light' : 'dark';
      document.getElementById('toggleTheme').textContent = isDark ? 'Modo oscuro' : 'Modo claro';
    }

    function toggleTextColor() {
      const next = document.body.dataset.textcolor === 'blue' ? 'black' : 'blue';
      document.body.dataset.textcolor = next;
      document.getElementById('toggleTextColor').textContent = next === 'blue' ? 'Texto negro' : 'Texto azul';
    }

    function togglePapiro() {
      const on = document.body.dataset.papiro === 'on';
      document.body.dataset.papiro = on ? 'off' : 'on';
      document.getElementById('togglePapiro').textContent = on ? 'Poner papiro' : 'Quitar papiro';
    }

    // Descargas
    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      for (let i = 0; i < pages.length; i++) {
        const canvas = await html2canvas(pages[i], {
          scale: 2,
          backgroundColor: document.body.dataset.theme === 'dark' ? '#1a140e' : '#f8f4eb',
          width: 794,
          useCORS: true
        });
        if (i > 0) pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
      }
      pdf.save('texto-asturiano.pdf');
    }

    async function downloadPNG() {
      alert("El PNG se genera solo de la primera página. Usa PDF para todas las páginas.");
      if (pages.length > 0) {
        const canvas = await html2canvas(pages[0], { scale: 2, backgroundColor: '#f8f4eb' });
        const a = document.createElement('a');
        a.download = 'pagina-1.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      }
    }

    function copyFormatted() {
      let html = '';
      pages.forEach((p, i) => {
        html += `<h3>Página ${i+1}</h3>${p.querySelector('.page-content').innerHTML}<br><hr><br>`;
      });
      const blob = new Blob([html], { type: 'text/html' });
      navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]).then(() => {
        alert('Todo el contenido copiado con formato');
      });
    }

    function downloadHTML() {
      let content = '';
      pages.forEach((p, i) => {
        content += `<h2>Página ${i+1}</h2>${p.querySelector('.page-content').innerHTML}<hr>`;
      });
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Texto Asturianizado</title><style>body{font-family:'Asturica',serif;padding:60px;background:#f8f4eb;line-height:1.72;}</style></head><body>${content}</body></html>`;
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'texto-asturiano.html'; a.click();
      URL.revokeObjectURL(url);
    }

    // Funciones de Carta Oficial (mantenidas)
    let pinVerificado = false;

    function solicitarCartaOficial() {
      if (pinVerificado) { mostrarCartaOficial(); return; }
      document.getElementById('pinInput').value = '';
      document.getElementById('pinError').textContent = '';
      document.getElementById('pinModal').classList.add('visible');
    }

    function cerrarModal() {
      document.getElementById('pinModal').classList.remove('visible');
    }

    function verificarPin() {
      if (document.getElementById('pinInput').value === '4322') {
        pinVerificado = true;
        cerrarModal();
        mostrarCartaOficial();
      } else {
        document.getElementById('pinError').textContent = 'PIN incorrecto';
      }
    }

    function mostrarCartaOficial() {
      // Por simplicidad usamos solo el contenido de la primera página
      const content = pages[0] ? pages[0].querySelector('.page-content').innerHTML : '';
      document.getElementById('carta-display').innerHTML = `
        <div style="padding:94px 75px 80px;font-size:1.05rem;line-height:1.72;text-align:justify;">${content}</div>
        <div style="position:absolute;bottom:35px;left:50%;transform:translateX(-50%);font-size:0.78rem;color:rgba(25,52,90,0.55);">Página 1</div>
      `;
      document.getElementById('cartaModal').style.display = 'flex';
    }

    function cerrarCartaModal() {
      document.getElementById('cartaModal').style.display = 'none';
    }

    async function descargarCartaPDF() {
      alert("La exportación completa de Carta Oficial con múltiples páginas se puede ampliar más adelante.");
      // Aquí puedes implementar la lógica completa si lo deseas
    }

    // Inicializar
    window.onload = function() {
      createPage(); // Crea la primera página automáticamente
    };
  </script>
</body>
</html>
