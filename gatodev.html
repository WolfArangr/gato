<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GatoDev • frontend-monorepo</title>
  <style>
    :root {
      --bg:        #0d1117;
      --bg-alt:    #161b22;
      --surface:   #1c2128;
      --border:    #30363d;
      --text:      #c9d1d9;
      --text-dim:  #8b949e;
      --blue:      #58a6ff;
      --green:     #3fb950;
      --red:       #f85149;
      --yellow:    #d29922;
      --purple:    #bc8cff;
      --gray:      #6e7681;
      --cyan:      #79c0ff;
    }

    [data-theme="light"] {
      --bg:        #ffffff;
      --bg-alt:    #f6f8fa;
      --surface:   #f0f2f5;
      --border:    #d0d7de;
      --text:      #24292f;
      --text-dim:  #57606a;
      --blue:      #0969da;
      --green:     #2da44e;
      --red:       #cf222e;
      --yellow:    #bf8700;
      --purple:    #8250df;
      --gray:      #6e7781;
      --cyan:      #0969da;
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.94rem;
    }

    .project-title { font-weight: 600; color: var(--blue); letter-spacing: -0.02em; }

    .env {
      color: var(--text-dim);
      font-size: 0.88rem;
    }

    .toolbar {
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    button, .btn {
      background: #238636;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.13s;
    }

    button:hover, .btn:hover { background: #2ea043; }

    .stop { background: var(--red); }
    .stop:hover { background: #ff6b6b; }

    .theme-toggle {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .theme-toggle:hover { background: var(--border); }

    .status {
      margin-left: auto;
      display: flex;
      gap: 24px;
      font-size: 0.86rem;
      color: var(--text-dim);
    }

    .progress-bar-outer {
      height: 5px;
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      transition: width 0.4s ease-out;
      will-change: width;
    }

    .progress-bar.indeterminate {
      width: 16%;
      animation: indeterminate 3.2s cubic-bezier(0.65,0.815,0.735,0.395) infinite;
    }

    @keyframes indeterminate {
      0%   { left:-40%; right:100% }
      60%  { left:100%; right:-60% }
      100% { left:100%; right:-60% }
    }

    .layout {
      display: flex;
      height: calc(100vh - 138px);
    }

    .editor-pane {
      flex: 7;
      background: var(--bg);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow: hidden;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--text);
      border: none;
      font-family: inherit;
      font-size: 1.015rem;
      line-height: 1.52;
      resize: none;
      outline: none;
      padding: 0;
      tab-size: 2;
    }

    .output-pane {
      flex: 5;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .tab-bar {
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      gap: 2px;
    }

    .tab {
      padding: 9px 18px;
      background: var(--surface);
      color: var(--text-dim);
      border: none;
      font-size: 0.91rem;
      cursor: default;
      user-select: none;
    }

    .tab.active {
      background: var(--bg);
      color: var(--text);
      border-bottom: 2px solid var(--blue);
    }

    .terminal {
      flex: 1;
      padding: 16px 18px;
      overflow-y: auto;
      font-size: 0.97rem;
      line-height: 1.55;
      color: #d0d6de;
    }

    .terminal.light { color: #2f363d; }

    .terminal::-webkit-scrollbar {
      width: 10px;
    }
    .terminal::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 6px;
    }

    .time       { color: var(--gray); margin-right: 10px; }
    .badge      { font-size: 0.82rem; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
    .badge-ok   { background: #2ea04344; color: var(--green); }
    .badge-warn { background: #d2992244; color: var(--yellow); }
    .badge-err  { background: #f8514944; color: var(--red); }

    .tag-build  { color: var(--blue);    font-weight: 600; }
    .tag-info   { color: var(--text-dim); }
    .tag-warn   { color: var(--yellow);  }
    .tag-error  { color: var(--red);     font-weight: 500; }
    .tag-done   { color: var(--green);   font-weight: 600; }
    .tag-skip   { color: var(--gray);    font-style: italic; }
    .tag-plugin { color: var(--purple);  font-weight: 500; }

    .ci-step    { margin: 10px 0 6px; font-weight: 600; color: var(--purple); }
    .ci-badge   { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; margin-left: 8px; }

    .ci-ok      { background: var(--green); color: white; }
    .ci-fail    { background: var(--red);   color: white; }
    .ci-skip    { background: var(--gray);  color: white; }

    .blink-slow { animation: blink 3s infinite; }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0.35 } }

    .upload-bar {
      height: 6px;
      background: var(--surface);
      margin: 12px 0;
      border-radius: 3px;
      overflow: hidden;
    }

    .upload-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9c6ade, #bc8cff);
      transition: width 0.6s ease-out;
    }
  </style>
</head>
<body>

<header>
  <div class="project-title">GatoDev • frontend-monorepo • main</div>
  <div class="env">
    Node 20.17.0 • pnpm 9.12 • vite 6.0.1 • ts 5.7 • esbuild 0.24 • oxlint 0.9
  </div>
</header>

<div class="toolbar">
  <button onclick="startBuild()">Production Build</button>
  <button onclick="startDev()">Dev Server</button>
  <button class="stop" onclick="stopAll()">■ Stop</button>

  <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>

  <div class="status" id="status">
    <span>Mem: 1.8 / 5.1 GB</span>
    <span>CPU: 29%</span>
    <span>Idle</span>
  </div>
</div>

<div class="progress-bar-outer">
  <div class="progress-bar indeterminate" id="progress"></div>
</div>

<div class="layout">
  <div class="editor-pane">
    <textarea id="code" spellcheck="false" readonly>
// src/entry-client.tsx
import { hydrateRoot } from 'react-dom/client'
import { createBrowserRouter, RouterProvider } from 'react-router-dom'
import { router } from '@/router'
import '@/styles/global.css'

hydrateRoot(
  document.getElementById('root')!,
  <RouterProvider router={router} />
)
    </textarea>
  </div>

  <div class="output-pane">
    <div class="tab-bar">
      <div class="tab active" data-tab="terminal">Terminal</div>
      <div class="tab" data-tab="tests">Tests (42)</div>
      <div class="tab" data-tab="ci">CI Overview</div>
      <div class="tab" data-tab="problems">Problems (4)</div>
    </div>

    <div class="terminal" id="terminal"></div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
// State & Helpers
// ────────────────────────────────────────────────

const $ = id => document.getElementById(id)
const term = $('terminal')
const code = $('code')
const status = $('status')
const progress = $('progress')

let isRunning = false
let codeInterval = null
let buildStart = 0
let lastLogTime = 0

function ts() {
  return new Date().toLocaleTimeString('en-GB', {hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})
}

function log(txt, type='info') {
  const now = Date.now()
  // add tiny random delay between logs to look more natural
  const delay = Math.max(0, now - lastLogTime - 30 + Math.random()*80)
  setTimeout(() => {
    const tags = {
      build:   '<span class="tag-build">[build]</span>',
      info:    '<span class="tag-info">[info]</span>',
      warn:    '<span class="tag-warn">[warn]</span>',
      error:   '<span class="tag-error">[error]</span>',
      done:    '<span class="tag-done">[done]</span>',
      skip:    '<span class="tag-skip">[skip]</span>',
      plugin:  '<span class="tag-plugin">[plugin]</span>',
      cache:   '<span class="tag-skip">[cache]</span>',
      vite:    '<span style="color:#ff79c6">[vite]</span>'
    }
    term.innerHTML += `<span class="time">[${ts()}]</span> ${tags[type]||''} ${txt}<br>`
    term.scrollTop = term.scrollHeight
    lastLogTime = Date.now()
  }, delay)
}

function updateStatus(mem, cpu, phase='Idle') {
  status.innerHTML = `Mem: ${mem.toFixed(1)} / 5.1 GB  •  CPU: ${cpu}%  •  ${phase}`
}

function setProgress(pct=null) {
  progress.classList.remove('indeterminate')
  if (pct === null) {
    progress.classList.add('indeterminate')
    progress.style.width = ''
  } else {
    progress.style.width = `${Math.min(100, pct)}%`
  }
}

function clear() {
  term.innerHTML = ''
}

// ────────────────────────────────────────────────
// Fake Plugins & Banners — expanded list
// ────────────────────────────────────────────────

const plugins = [
  "vite-plugin-pages              file-based routing",
  "vite-plugin-pwa                PWA + offline",
  "@vitejs/plugin-react           Fast Refresh + SWC",
  "vite-plugin-svgr               SVG → React components",
  "vite-plugin-inspect            inspect plugin order",
  "vite-plugin-compression        gzip / brotli",
  "vite-plugin-imagemin           image optimization",
  "vite-plugin-webfont-dl         google fonts download",
  "vite-plugin-mdx                MDX support",
  "@tanstack/router-vite-plugin   file-based typed routes",
  "vite-plugin-checker            typecheck + eslint + stylelint",
  "vite-plugin-eslint2            eslint on dev",
  "vite-plugin-stylelint          stylelint integration",
  "vite-plugin-windicss           tailwindcss on steroids",
  "vite-plugin-node-polyfills     node builtins in browser",
  "vite-plugin-pages-svelte       svelte pages (disabled)",
  "vite-plugin-vue-devtools       vue devtools (disabled)",
  "vite-plugin-turbo-console      turbo console.log",
  "vite-plugin-radar              bundle size analyzer",
  "@rollup/plugin-visualizer      visualizer (disabled)",
]

function randomPluginBanner() {
  const p = plugins[Math.floor(Math.random()*plugins.length)]
  return `Using plugin  ${p.padEnd(38)}  v${(0.8+Math.random()*5).toFixed(1)}`
}

// ────────────────────────────────────────────────
// Fake files being processed — more entries
// ────────────────────────────────────────────────

const files = [
  "src/entry-client.tsx","src/router.tsx","src/App.tsx",
  "src/pages/Dashboard.tsx","src/pages/Reports/Overview.tsx","src/pages/Settings/Profile.tsx",
  "src/features/auth/AuthProvider.tsx","src/features/auth/LoginForm.tsx","src/features/auth/ResetPassword.tsx",
  "src/features/users/UserList.tsx","src/features/users/UserDetail.tsx","src/features/users/UserAvatar.tsx",
  "src/components/layout/AppShell.tsx","src/components/layout/Sidebar.tsx","src/components/layout/Header.tsx",
  "src/components/ui/Button.tsx","src/components/ui/DataTable.tsx","src/components/ui/Modal.tsx","src/components/ui/Toast.tsx",
  "src/hooks/useQueryParams.ts","src/hooks/useLocalStorage.ts","src/hooks/useDebounce.ts","src/hooks/useClickOutside.ts",
  "src/lib/api.ts","src/lib/date-fns.ts","src/lib/cn.ts","src/lib/validators.ts",
  "src/styles/global.css","src/styles/tokens.css","src/styles/components/button.css"
]

function rndFile() {
  return files[Math.floor(Math.random()*files.length)]
}

// ────────────────────────────────────────────────
// Realistic bursty logging pattern
// ────────────────────────────────────────────────

const burstPatterns = [
  // pattern name → [how many logs, base delay between them, extra random]
  {count:1,  base:400, rand:300},
  {count:1,  base:600, rand:500},
  {count:2,  base:180, rand:220},
  {count:3,  base:140, rand:180},
  {count:5,  base: 90, rand:140},
  {count:8,  base: 60, rand:110},
  {count:1,  base:900, rand:700},   // longer pause
  {count:4,  base:120, rand:160},
  {count:10, base: 45, rand: 90},
  {count:2,  base:300, rand:400},
  {count:6,  base: 80, rand:130},
]

function getNextBurstPattern() {
  return burstPatterns[Math.floor(Math.random()*burstPatterns.length)]
}

function burstLog(messages, type='info') {
  let delayAcc = 0
  messages.forEach(msg => {
    const pattern = getNextBurstPattern()
    delayAcc += pattern.base + Math.random()*pattern.rand
    setTimeout(() => log(msg, type), delayAcc)
  })
}

// ────────────────────────────────────────────────
// Production Build – very long & bursty simulation
// ────────────────────────────────────────────────

function startBuild() {
  if (isRunning) return
  isRunning = true

  clear()
  code.value = code.value.split('\n').slice(0,9).join('\n')

  log("Starting production build — vite build", "build")
  setProgress(null)
  updateStatus(2.1, 38, "Preparing")

  buildStart = Date.now()
  const prevGzipped = 1420 + ~~(Math.random()*680)

  let currentProgress = 0

  const phases = [
    // phase name, duration range, messages pool, progress increase
    ["Pre-bundling deps",     1400, [
      "Reading pnpm-lock.yaml",
      "Resolving 238 dependencies",
      "Using cached deps (184 modules)",
      "Pre-bundling 32 dependencies with esbuild",
      "Pre-bundled 32 modules in 1.92s"
    ], 12],

    ["Type checking",         3200, [
      "Running tsc --noEmit --incremental",
      "Analyzing 247 files",
      "Found 3 redundant type-only imports",
      "Type check passed"
    ], 18],

    ["Linting",               1800, [
      "Running oxlint + eslint (parallel)",
      "oxlint finished in 0.8s • no errors",
      "3 react-hooks/exhaustive-deps warnings",
      "Lint completed"
    ], 11],

    ["Transform & bundle",    4800, [
      "Transforming 198 modules",
      `${rndFile()} • transformed`,
      `${rndFile()} • transformed`,
      "Inlining process.env.*",
      `${rndFile()} • transformed`,
      "Applying terser (compress + mangle)",
      "Executing dead code elimination pass #2",
      `${rndFile()} • minified`
    ], 28],

    ["CSS & assets",          2600, [
      "Optimizing CSS • lightningcss",
      "Removed 4.2 kB unused selectors",
      "Compressing images • avif/webp • 23 assets",
      "Generated responsive images • 3× sizes"
    ], 14],

    ["Code splitting & emit", 3400, [
      "Code splitting • 24 chunks generated",
      "Calculating final gzipped size...",
      `Bundle size: ${1420 + ~~(Math.random()*900)} kB gzipped`,
      `Compared to previous: ${prevGzipped} kB (${(Math.random()>0.5?'+':'-')}${~~(Math.random()*180)} kB)`
    ], 17]
  ]

  let globalDelay = 800

  phases.forEach(([phaseName, phaseDuration, msgPool, progDelta]) => {
    // announce phase
    setTimeout(() => {
      log(`Phase: ${phaseName}`, "build")
      updateStatus(2.0 + Math.random()*1.8, 30 + ~~(Math.random()*65), phaseName)
    }, globalDelay)

    // burst messages for this phase
    let burstCount = 0
    while (burstCount < msgPool.length) {
      const howMany = 1 + ~~(Math.random()*4)
      const burstMsgs = msgPool.splice(0, howMany)
      setTimeout(() => {
        burstMsgs.forEach(m => {
          if (Math.random() < 0.25) log(randomPluginBanner(), "plugin")
          else if (Math.random() < 0.15) log(`${rndFile()} • cached`, "cache")
          else log(m, "info")
        })
      }, globalDelay + 400 + Math.random()*800)

      globalDelay += 600 + howMany * 180 + Math.random()*900
      burstCount += howMany
    }

    // progress update at end of phase
    setTimeout(() => {
      currentProgress += progDelta * (0.75 + Math.random()*0.5)
      setProgress(currentProgress)
    }, globalDelay - 300)
  })

  // final burst + finish
  setTimeout(() => {
    burstLog([
      "Writing dist/ • 44 files",
      "Generating sourcemaps (inline)",
      "Build completed successfully",
      `Total time: ${((Date.now()-buildStart)/1000).toFixed(1)} s`,
      `Output: dist/   gzipped ≈ ${prevGzipped + ~~(Math.random()*400 - 200)} kB`,
      "Ready for deployment"
    ], "done")

    setProgress(100)
    updateStatus(1.9, 22, "Done")

    setTimeout(fakeUploadSimulation, 1400 + Math.random()*1200)

    isRunning = false
  }, globalDelay + 600)

  startCodeWriter()
}

// ────────────────────────────────────────────────
// Fake upload simulation
// ────────────────────────────────────────────────

function fakeUploadSimulation() {
  log("Uploading build artifacts → Cloudflare Pages", "build")

  term.innerHTML += `<div class="upload-bar"><div class="upload-fill" id="uploadFill"></div></div>`
  const fill = document.getElementById("uploadFill")
  let pct = 0

  const int = setInterval(()=>{
    pct += 3 + Math.random()*14
    if (pct >= 100) {
      pct = 100
      clearInterval(int)
      log("Upload completed • 44 assets • 1.68 MiB transferred", "done")
      log("Deployment preview: https://deploy-preview-1427--frontend-monorepo.pages.dev", "done")
      fill.remove()
    }
    fill.style.width = pct + "%"
  }, 180 + Math.random()*240)
}

// ────────────────────────────────────────────────
// Dev server + fake HMR with bursts
// ────────────────────────────────────────────────

function startDev() {
  clear()
  log("Starting Vite dev server @ http://localhost:5173", "build")
  setProgress(null)
  updateStatus(2.0, 41, "Starting")

  setTimeout(()=>{
    log("  ➜  Local:   http://localhost:5173/", "done")
    log("  ➜  Network: http://192.168.5.33:5173/", "done")
    setProgress(100)
    updateStatus(1.6, 19, "Running")
  }, 1100)

  setTimeout(()=>log("Vite Fast Refresh enabled", "info"), 1600)
  setTimeout(()=>log("Waiting for file changes...", "info blink-slow"), 2200)

  // fake HMR bursts
  setInterval(()=>{
    if (Math.random() > 0.84) {
      const count = 1 + ~~(Math.random()*5)
      for(let i=0; i<count; i++) {
        setTimeout(() => {
          log(`[vite:hmr] hot updated → ${rndFile()}`, "vite")
        }, i*80 + Math.random()*120)
      }
    }
  }, 4000 + Math.random()*9000)
}

// ────────────────────────────────────────────────
// Fake test results tab
// ────────────────────────────────────────────────

function showTestsTab() {
  clear()
  log("Vitest v2.1.4  •  47 tests across 8 suites", "build")

  const groups = [
    {name:"auth",           pass:9,  total:10, time:2.1},
    {name:"users",          pass:13, total:13, time:2.8},
    {name:"reports",        pass:7,  total:8,  time:2.2},
    {name:"components/ui",  pass:15, total:15, time:3.4},
    {name:"hooks",          pass:4,  total:4,  time:0.9},
    {name:"utils",          pass:6,  total:6,  time:1.3}
  ]

  let totalPass = 0, total = 0, totalTime = 0

  groups.forEach(g => {
    const badge = g.pass === g.total ? "ci-ok" : "ci-fail"
    log(`Suite ${g.name.padEnd(16)} ${g.pass}/${g.total}   ${g.time.toFixed(1)}s`,
      g.pass === g.total ? "done" : "warn")
    term.innerHTML += `<span class="ci-badge ${badge}">${g.pass===g.total?'PASS':'FAIL'}</span><br>`
    totalPass += g.pass
    total += g.total
    totalTime += g.time
  })

  log("─────────────────────────────────────────────","skip")
  log(`Tests       ${totalPass}/${total}   ${totalTime.toFixed(1)}s`,"done")
  log(`Coverage    88.7%   92.4% statements / 89.1% branches`,"done")
}

// ────────────────────────────────────────────────
// Fake CI overview tab
// ────────────────────────────────────────────────

function showCiTab() {
  clear()
  log("Simulated CI pipeline — GitHub Actions", "build")

  const ciSteps = [
    ["Install Dependencies",      "ci-ok",   "18 s"],
    ["Lint (oxlint + eslint)",    "ci-ok",   "24 s"],
    ["Type Check",                "ci-ok",   "21 s"],
    ["Unit Tests (vitest)",       "ci-ok",   "39 s"],
    ["Build (vite build)",        "ci-ok",   "52 s"],
    ["Visual Regression",         "ci-skip", "—"],
    ["E2E — Playwright",          "ci-ok",   "2m 38s"],
    ["Deploy Preview",            "ci-ok",   "41 s"],
  ]

  ciSteps.forEach(([name, cls, time])=>{
    term.innerHTML += `<div class="ci-step">${name.padEnd(26)}<span class="ci-badge ${cls}">${time}</span></div>`
  })

  log("─────────────────────────────────────────────","skip")
  log("Pipeline completed • all required steps passed","done")
  log("Preview URL: https://pr-1427-frontend.pages.dev","done")
}

// ────────────────────────────────────────────────
// Tab switching
// ────────────────────────────────────────────────

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
    tab.classList.add('active')

    const target = tab.dataset.tab
    if (target === 'tests')      showTestsTab()
    else if (target === 'ci')    showCiTab()
    else                         clear() // terminal
  })
})

// ────────────────────────────────────────────────
// Code writer — also bursty
// ────────────────────────────────────────────────

function startCodeWriter() {
  if (codeInterval) clearInterval(codeInterval)

  let i = 0
  const extras = [
    "// generated route — @tanstack/router",
    "export const Route = createFileRoute('/dashboard/users/$id')({",
    "export const loader = async ({ params }) => {",
    "// zustand / jotai selector",
    "export const useTheme = () => useStore(s => s.theme)",
    "// orval generated API client",
    "interface UserResponse { id: string; email: string; name: string; ",
    "// utility — formatCurrency",
    "export const formatCurrency = (v: number) => ",
    "// generated test mock",
    "vi.mock('@/lib/api', () => ({"
  ]

  codeInterval = setInterval(()=>{
    const pattern = getNextBurstPattern()
    for(let k=0; k<pattern.count; k++) {
      setTimeout(() => {
        const line = i < 16
          ? `// line ${++i} — auto`
          : extras[~~(Math.random()*extras.length)]

        code.value += '\n' + line
        code.scrollTop = code.scrollHeight
      }, k * 60 + Math.random()*140)
    }
  }, 900 + Math.random()*1800)
}

// ────────────────────────────────────────────────
// Theme toggle
// ────────────────────────────────────────────────

function toggleTheme() {
  const html = document.documentElement
  const current = html.getAttribute('data-theme')
  const next = current === 'light' ? 'dark' : 'light'
  html.setAttribute('data-theme', next)
  term.classList.toggle('light', next==='light')
}

// ────────────────────────────────────────────────
// Stop
// ────────────────────────────────────────────────

function stopAll() {
  if (codeInterval) clearInterval(codeInterval)
  log("Build / server stopped by user", "error")
  setProgress(null)
  updateStatus(1.5, 11, "Stopped")
  isRunning = false
}

// ────────────────────────────────────────────────
// Boot
// ────────────────────────────────────────────────

setTimeout(()=>{
  log("GatoDev ready", "done")
  log("vite 6.0.1  •  @vitejs/plugin-react 4.3.2  •  vitest 2.1.4  •  oxlint 0.9.2", "info")
  log("Press F5 or Ctrl+B to trigger production build", "info")
}, 700)

window.addEventListener('keydown', e => {
  if (e.key === 'F5' || (e.ctrlKey && e.key.toLowerCase()==='b')) {
    e.preventDefault()
    startBuild()
  }
})

</script>
