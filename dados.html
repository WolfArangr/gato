<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Dados — Lanzador de mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0d0c;
    --surface: rgba(20, 22, 21, 0.78);
    --surface-2: rgba(28, 30, 28, 0.92);
    --line: rgba(255, 240, 210, 0.08);
    --line-strong: rgba(255, 240, 210, 0.16);
    --ink: #f0ebde;
    --ink-dim: #a59c8a;
    --ink-faint: #6c6557;
    --accent: #e8b14a;
    --accent-deep: #b8852a;
    --danger: #e87a4a;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow-lg: 0 18px 50px -12px rgba(0,0,0,0.7), 0 4px 14px -4px rgba(0,0,0,0.5);
    --font-display: "DM Serif Display", "Cormorant Garamond", Georgia, serif;
    --font-ui: "Manrope", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Menlo", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100vh; width: 100vw;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    overscroll-behavior: none;
  }
  #scene-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #ui-root {
    position: fixed; inset: 0;
    pointer-events: none;
  }
  #ui-root > * { pointer-events: auto; }
  /* ---------- Top bar ---------- */
  .top-bar {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px 10px 12px;
    background: var(--surface);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow-lg);
    max-width: calc(100vw - 24px);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding-left: 6px; padding-right: 10px; }
  /* ---------- Hamburger ---------- */
  .hamburger {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 160ms;
    padding: 0;
  }
  .hamburger:hover { border-color: var(--accent); background: rgba(232,177,74,0.08); }
  .hamburger span {
    display: block;
    width: 16px; height: 1.6px;
    background: var(--ink);
    border-radius: 2px;
    transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1), opacity 160ms;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(5.6px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .hamburger.open span:nth-child(3) { transform: translateY(-5.6px) rotate(-45deg); }
  .hamburger.open { background: rgba(232,177,74,0.10); border-color: var(--accent); }
  .hamburger.open span { background: var(--accent); }
  /* ---------- Menu dropdown ---------- */
  .menu-dropdown {
    position: fixed;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    padding: 22px 22px 20px;
    background: var(--surface-2);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    z-index: 50;
    opacity: 1;
    scrollbar-width: thin;
  }
  .menu-dropdown.entering { animation: menudown 220ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .menu-dropdown::-webkit-scrollbar { width: 6px; }
  .menu-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  @keyframes menudown {
    0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .menu-section { margin-bottom: 18px; }
  .menu-section:last-child { margin-bottom: 0; }
  .menu-title {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .table-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .table-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 8px 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--ink-dim);
    font-family: var(--font-ui);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 120ms;
  }
  .table-pill:hover { color: var(--ink); border-color: var(--line-strong); }
  .table-pill.sel { background: rgba(232,177,74,0.10); border-color: var(--accent); color: var(--accent); }
  .table-disc {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
  }
  .brand-mark {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #2a2418, #100c08);
    display: grid; place-items: center;
    border: 1px solid var(--line-strong);
  }
  .brand-title {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 2px;
  }
  .presets { display: flex; gap: 6px; flex-wrap: nowrap; }
  .preset {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 120ms, border-color 120ms, color 120ms;
    white-space: nowrap;
  }
  .preset:hover { background: rgba(255, 240, 210, 0.06); border-color: var(--line-strong); }
  .preset.ghost { color: var(--ink-dim); }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: var(--font-display);
    font-size: 16px;
    cursor: pointer;
    transition: color 120ms, background 120ms;
  }
  .icon-btn:hover { color: var(--accent); background: rgba(232, 177, 74, 0.08); }
  /* ---------- Left panel ---------- */
  .left-panel {
    position: fixed;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 280px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    padding: 18px 16px;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    scrollbar-width: thin;
  }
  .left-panel::-webkit-scrollbar { width: 6px; }
  .left-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  .panel-title {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .panel-divider {
    height: 1px;
    background: var(--line);
    margin: 16px -6px;
  }
  .dice-grid { display: flex; flex-direction: column; gap: 4px; }
  .die-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 8px;
    border-radius: var(--radius-sm);
    transition: background 120ms;
  }
  .die-row.active { background: rgba(232, 177, 74, 0.06); }
  .die-row:hover { background: rgba(255, 240, 210, 0.04); }
  .die-row.active:hover { background: rgba(232, 177, 74, 0.10); }
  .die-info { display: flex; align-items: center; gap: 10px; }
  .die-meta { display: flex; flex-direction: column; line-height: 1.15; }
  .die-label {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.04em;
  }
  .die-row:not(.active) .die-label { color: var(--ink-dim); }
  .die-sides {
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .die-counter { display: flex; align-items: center; gap: 4px; }
  .cbtn {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 13px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 120ms;
    font-family: var(--font-ui);
  }
  .cbtn:hover:not(:disabled) {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(232, 177, 74, 0.08);
  }
  .cbtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .count {
    min-width: 22px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .die-row:not(.active) .count { color: var(--ink-faint); }
  .swatch-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .swatch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px 5px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 120ms, border-color 120ms;
  }
  .swatch:hover { background: rgba(255,240,210,0.04); }
  .swatch.sel { border-color: var(--accent); background: rgba(232, 177, 74, 0.06); }
  .swatch-disc {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid;
    display: grid; place-items: center;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
  }
  .swatch-disc.rainbow {
    background: conic-gradient(from 0deg, #e8b14a, #e34232, #a76ed8, #5a87c2, #4ec7a8, #d9c98a, #e8b14a);
    border-color: rgba(255,255,255,0.2);
  }
  .swatch-plus {
    color: rgba(0,0,0,0.7);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    margin-top: -2px;
  }
  .swatch.custom { position: relative; }
  .swatch.custom .swatch-label {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: 0.04em;
  }
  .color-input {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    border: none;
    padding: 0;
    background: transparent;
  }
  .swatch-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .swatch-label {
    font-size: 9.5px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .swatch.sel .swatch-label { color: var(--ink); }
  .mat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .mat-pill {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: var(--font-ui);
    font-size: 11.5px;
    font-weight: 500;
    padding: 7px 0;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 120ms;
  }
  .mat-pill:hover { color: var(--ink); border-color: var(--line-strong); }
  .mat-pill.sel { background: rgba(232, 177, 74, 0.10); border-color: var(--accent); color: var(--accent); }
  /* ---------- Numbers section ---------- */
  .num-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .num-row-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .num-font {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 18px;
    height: 38px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 120ms;
  }
  .num-font:hover { color: var(--ink); border-color: var(--line-strong); }
  .num-font.sel { background: rgba(232,177,74,0.10); border-color: var(--accent); color: var(--accent); }
  .num-row.swatches { gap: 5px; margin-bottom: 10px; }
  .num-swatch {
    flex: 1;
    height: 26px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: border-color 120ms;
  }
  .num-swatch:hover { border-color: var(--line-strong); }
  .num-swatch.sel { border-color: var(--accent); background: rgba(232,177,74,0.06); }
  .solid-disc { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
  .auto-disc {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-dim);
    width: 18px; height: 18px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: conic-gradient(#e8b14a, #f0ebde, #3a2a1c, #e34232, #e8b14a);
    color: rgba(0,0,0,0.85);
  }
  .num-swatch.sel .auto-disc { color: rgba(0,0,0,0.85); }
  .num-row.size { padding-top: 2px; }
  .num-row.size input[type=range] {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    outline: none;
  }
  .num-row.size input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }
  .num-row.size input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  .num-label, .num-value {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .num-value { color: var(--ink-dim); min-width: 38px; text-align: right; }
  /* ---------- Pair chip ---------- */
  .result-chip.pair {
    background: rgba(232,177,74,0.10);
    border-color: rgba(232,177,74,0.3);
  }
  .pair-badge {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    color: #0e0c08;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    display: grid; place-items: center;
  }
  .pair-detail {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
  }
  /* ---------- Bottom bar (roll) ---------- */
  .bottom-bar {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .notation-bubble {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    padding: 8px 14px;
    background: var(--surface);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    min-width: 130px;
  }
  .notation-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .notation {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.02em;
    margin-top: 2px;
  }
  .roll-btn {
    position: relative;
    background: linear-gradient(180deg, #2a2418, #15110a);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 16px 36px;
    cursor: pointer;
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: 0.04em;
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 140ms;
    display: flex;
    align-items: baseline;
    gap: 12px;
    overflow: hidden;
  }
  .roll-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 50% 0%, rgba(232,177,74,0.22), transparent 60%);
    pointer-events: none;
  }
  .roll-btn:hover:not(:disabled):not(.rolling) {
    transform: translateY(-2px);
    box-shadow: 0 22px 50px -10px rgba(0,0,0,0.8), 0 0 0 1px var(--accent) inset;
  }
  .roll-btn:active:not(:disabled) { transform: translateY(0); }
  .roll-btn.disabled, .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .roll-btn.rolling { color: var(--accent); }
  .roll-btn.rolling .roll-label::after {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .roll-hint {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .shake-arm {
    background: rgba(232,177,74,0.08);
    border: 1px solid rgba(232,177,74,0.4);
    color: var(--accent);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  /* ---------- Results panel ---------- */
  .results-panel {
    position: fixed;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 240px;
    padding: 18px 18px 14px;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    animation: slidein 360ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(-50%) translateX(20px); }
    to { opacity: 1; transform: translateY(-50%) translateX(0); }
  }
  .results-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .results-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .results-total {
    font-family: var(--font-display);
    font-size: 48px;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .results-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .result-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px 5px 6px;
    background: rgba(255,240,210,0.05);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .result-type {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .result-value {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .results-breakdown {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
