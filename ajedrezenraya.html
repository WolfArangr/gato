<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        #game {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #board-container {
            width: min(90vw, 420px);
            aspect-ratio: 1 / 1;
            margin: 10px auto;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 100%;
            height: 100%;
            border: 6px solid #555;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14vw;
            transition: background-color 0.3s;
        }
        @media (min-width: 500px) {
            .cell {
                font-size: 70px;
            }
        }
        .cell.highlight {
            background-color: #ff0 !important;
            opacity: 0.6;
        }
        .hand {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            width: min(90vw, 420px);
        }
        .hand-piece {
            background: #333;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 9vw;
        }
        @media (min-width: 500px) {
            .hand-piece {
                font-size: 45px;
                padding: 12px 18px;
            }
        }
        .hand-piece:active {
            transform: scale(1.3);
        }
        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 14px 28px;
            margin: 10px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #message {
            font-size: 22px;
            margin: 15px 0;
            min-height: 60px;
            padding: 0 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="board-container">
            <div id="board"></div>
        </div>
        <div id="white-hand" class="hand"></div>
        <div id="black-hand" class="hand"></div>
        <div id="message">White's turn</div>
        <button id="mode">Play vs Bot</button>
        <button id="restart">Restart</button>
    </div>
    <script>
        const symbols = {
            white: { N: '♘', R: '♖', B: '♗', P: '♙' },
            black: { N: '♞', R: '♜', B: '♝', P: '♟' }
        };

        let board = [];
        let hands = { white: [], black: [] };
        let phase = 'placement';
        let turn = 'white';
        let selected = null;
        let isBot = false;

        function init() {
            board = Array.from({length: 4}, () => Array(4).fill(null));
            hands = {
                white: ['N', 'R', 'B', 'P'],
                black: ['N', 'R', 'B', 'P']
            };
            phase = 'placement';
            turn = 'white';
            selected = null;
            render();
        }

        function checkPhaseTransition() {
            if (phase === 'placement' && hands.white.length === 0 && hands.black.length === 0) {
                phase = 'main';
            }
        }

        function render() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.style.backgroundColor = (r + c) % 2 === 0 ? '#f0d9b5' : '#b58863';
                    const piece = board[r][c];
                    if (piece) {
                        const span = document.createElement('span');
                        span.textContent = symbols[piece.player][piece.type];
                        if (piece.player === 'black') {
                            span.style.color = '#000';
                            span.style.textShadow = '0 0 8px #fff';
                        }
                        cell.appendChild(span);
                    }
                    cell.addEventListener('click', onCellClick);
                    boardDiv.appendChild(cell);
                }
            }

            renderHand('white');
            renderHand('black');

            let msg = `${turn.charAt(0).toUpperCase() + turn.slice(1)}'s turn`;
            if (phase === 'placement') msg += ' — select piece below → tap empty square';
            else msg += ' — tap your piece → tap destination';
            document.getElementById('message').textContent = msg;

            document.getElementById('mode').textContent = isBot ? 'Play vs Player' : 'Play vs Bot';
        }

        function renderHand(player) {
            const handDiv = document.getElementById(player + '-hand');
            handDiv.innerHTML = `<strong>${player.toUpperCase()} hand:</strong>`;
            if (hands[player].length === 0) {
                handDiv.innerHTML += ' (all placed)';
                return;
            }
            hands[player].forEach(type => {
                const p = document.createElement('span');
                p.className = 'hand-piece';
                const span = document.createElement('span');
                span.textContent = symbols[player][type];
                if (player === 'black') {
                    span.style.color = '#000';
                    span.style.textShadow = '0 0 8px #fff';
                }
                p.appendChild(span);
                p.dataset.type = type;
                p.dataset.player = player;
                p.addEventListener('click', onHandClick);
                handDiv.appendChild(p);
            });
        }

        function onHandClick(e) {
            if (e.currentTarget.dataset.player !== turn) return;
            selected = { mode: 'place', type: e.currentTarget.dataset.type };
            document.getElementById('message').textContent = `Place ${selected.type} on an empty square`;
        }

        function onCellClick(e) {
            const r = parseInt(e.currentTarget.dataset.row);
            const c = parseInt(e.currentTarget.dataset.col);

            if (selected?.mode === 'place') {
                if (board[r][c]) return;

                const temp = board.map(row => row.slice());
                temp[r][c] = { player: turn, type: selected.type };
                if (phase === 'placement' && checkWin(turn, temp)) {
                    alert('Cannot place there — it would win immediately!');
                    selected = null;
                    render();
                    return;
                }

                board[r][c] = { player: turn, type: selected.type };
                hands[turn] = hands[turn].filter(t => t !== selected.type);
                selected = null;
                checkPhaseTransition();
                checkAndEndTurn();
                return;
            }

            if (phase === 'main') {
                if (selected?.mode === 'move') {
                    const [sr, sc] = selected.pos;
                    if (isValidMove(sr, sc, r, c)) {
                        const captured = board[r][c];
                        board[r][c] = board[sr][sc];
                        board[sr][sc] = null;
                        if (captured) hands[captured.player].push(captured.type);
                        selected = null;
                        checkAndEndTurn();
                    } else {
                        selected = null;
                        render();
                    }
                    return;
                }

                if (board[r][c]?.player === turn) {
                    selected = { mode: 'move', pos: [r, c] };
                    document.getElementById('message').textContent = `Selected ${board[r][c].type} — tap destination`;
                }
            }
        }

        function checkAndEndTurn() {
            if (checkWin(turn)) {
                document.getElementById('message').textContent = turn.toUpperCase() + ' WINS!';
                alert(turn.toUpperCase() + ' wins!');
                return;
            }
            turn = turn === 'white' ? 'black' : 'white';
            render();
            if (isBot && turn === 'black') setTimeout(botMove, 1000);
        }

        function checkWin(player, b = board) {
            // rows
            for (let i = 0; i < 4; i++) if (b[i].every(c => c && c.player === player)) return true;
            // columns
            for (let i = 0; i < 4; i++) if (b.every(row => row[i] && row[i].player === player)) return true;
            // diags
            if (b[0][0] && b[1][1] && b[2][2] && b[3][3] && 
                [b[0][0], b[1][1], b[2][2], b[3][3]].every(p => p.player === player)) return true;
            if (b[0][3] && b[1][2] && b[2][1] && b[3][0] && 
                [b[0][3], b[1][2], b[2][1], b[3][0]].every(p => p.player === player)) return true;
            return false;
        }

        function getValidMoves(r, c) {
            const p = board[r][c];
            if (!p) return [];
            const {player, type} = p;
            const opp = player === 'white' ? 'black' : 'white';
            const moves = [];

            if (type === 'N') {
                const d = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
                d.forEach(([dr,dc]) => {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < 4 && nc >= 0 && nc < 4 && (!board[nr][nc] || board[nr][nc].player === opp))
                        moves.push([nr,nc]);
                });
            } else if (type === 'R') {
                const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
                dirs.forEach(([dr,dc]) => {
                    for (let k=1; k<4; k++) {
                        const nr = r + k*dr, nc = c + k*dc;
                        if (nr<0||nr>=4||nc<0||nc>=4) break;
                        const t = board[nr][nc];
                        if (t && t.player === player) break;
                        moves.push([nr,nc]);
                        if (t) break;
                    }
                });
            } else if (type === 'B') {
                const dirs = [[1,1],[1,-1],[-1,1],[-1,-1]];
                dirs.forEach(([dr,dc]) => {
                    for (let k=1; k<4; k++) {
                        const nr = r + k*dr, nc = c + k*dc;
                        if (nr<0||nr>=4||nc<0||nc>=4) break;
                        const t = board[nr][nc];
                        if (t && t.player === player) break;
                        moves.push([nr,nc]);
                        if (t) break;
                    }
                });
            } else if (type === 'P') {
                const dir = player === 'white' ? -1 : 1;
                const nr = r + dir, nc = c;
                if (nr >= 0 && nr < 4 && !board[nr][nc]) moves.push([nr,nc]);
                [-1,1].forEach(dc => {
                    const nr2 = r + dir, nc2 = c + dc;
                    if (nr2 >= 0 && nr2 < 4 && nc2 >= 0 && nc2 < 4 && board[nr2][nc2]?.player === opp)
                        moves.push([nr2,nc2]);
                });
            }
            return moves;
        }

        function isValidMove(sr, sc, tr, tc) {
            return getValidMoves(sr, sc).some(([vr,vc]) => vr===tr && vc===tc);
        }

        function animateBotMove(from, to, place = false) {
            setTimeout(() => {
                if (place) {
                    const cell = document.querySelector(`.cell[data-row="${to[0]}"][data-col="${to[1]}"]`);
                    cell.classList.add('highlight');
                    setTimeout(() => cell.classList.remove('highlight'), 1000);
                } else {
                    const f = document.querySelector(`.cell[data-row="${from[0]}"][data-col="${from[1]}"]`);
                    const t = document.querySelector(`.cell[data-row="${to[0]}"][data-col="${to[1]}"]`);
                    f.classList.add('highlight');
                    t.classList.add('highlight');
                    setTimeout(() => {
                        f.classList.remove('highlight');
                        t.classList.remove('highlight');
                    }, 1000);
                }
            }, 100);
        }

        function botMove() {
            let action = null;

            // win by place
            if (hands.black.length > 0) {
                for (let type of hands.black) {
                    for (let r=0; r<4; r++) for (let c=0; c<4; c++) if (!board[r][c]) {
                        const temp = board.map(row=>row.slice());
                        temp[r][c] = {player:'black', type};
                        if (checkWin('black', temp)) {
                            action = {kind:'place', pos:[r,c], type};
                            break;
                        }
                    }
                    if (action) break;
                }
            }

            // win by move
            if (!action) {
                const pieces = [];
                for (let r=0; r<4; r++) for (let c=0; c<4; c++) if (board[r][c]?.player==='black') pieces.push([r,c]);
                for (let [sr,sc] of pieces) {
                    const vals = getValidMoves(sr,sc);
                    for (let [tr,tc] of vals) {
                        const temp = board.map(row=>row.slice());
                        temp[tr][tc] = temp[sr][sc];
                        temp[sr][sc] = null;
                        if (checkWin('black', temp)) {
                            action = {kind:'move', from:[sr,sc], to:[tr,tc]};
                            break;
                        }
                    }
                    if (action) break;
                }
            }

            // random place
            if (!action && hands.black.length > 0) {
                const empties = [];
                for (let r=0; r<4; r++) for (let c=0; c<4; c++) if (!board[r][c]) empties.push([r,c]);
                if (empties.length) {
                    action = {kind:'place', pos: empties[Math.floor(Math.random()*empties.length)],
                              type: hands.black[Math.floor(Math.random()*hands.black.length)]};
                }
            }

            // random move
            if (!action) {
                const pieces = [];
                for (let r=0; r<4; r++) for (let c=0; c<4; c++) if (board[r][c]?.player==='black') pieces.push([r,c]);
                const opts = [];
                for (let [sr,sc] of pieces) opts.push(...getValidMoves(sr,sc).map(to=>({from:[sr,sc],to})));
                if (opts.length) action = {kind:'move', ...opts[Math.floor(Math.random()*opts.length)]};
            }

            if (action) {
                if (action.kind === 'place') {
                    animateBotMove(null, action.pos, true);
                    setTimeout(() => {
                        board[action.pos[0]][action.pos[1]] = {player:'black', type:action.type};
                        hands.black = hands.black.filter(t => t !== action.type);
                        checkPhaseTransition();
                        render();
                        if (checkWin('black')) {
                            document.getElementById('message').textContent = 'BLACK WINS!';
                            alert('Black wins!');
                        } else turn = 'white';
                    }, 800);
                } else {
                    animateBotMove(action.from, action.to);
                    setTimeout(() => {
                        const cap = board[action.to[0]][action.to[1]];
                        board[action.to[0]][action.to[1]] = board[action.from[0]][action.from[1]];
                        board[action.from[0]][action.from[1]] = null;
                        if (cap) hands[cap.player].push(cap.type);
                        checkPhaseTransition();
                        render();
                        if (checkWin('black')) {
                            document.getElementById('message').textContent = 'BLACK WINS!';
                            alert('Black wins!');
                        } else turn = 'white';
                    }, 800);
                }
            } else {
                turn = 'white';
                render();
            }
        }

        document.getElementById('mode').addEventListener('click', () => { isBot = !isBot; render(); });
        document.getElementById('restart').addEventListener('click', init);

        init();
    </script>
</body>
</html>
