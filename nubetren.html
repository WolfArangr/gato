<!DOCTYPE html>
<html lang="es" data-tema="dia">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dceffa" id="metaTema">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nubificador de Tren</title>
<!-- ═══════════════════════════════════════════════════════════════
     NUBIFICADOR DE SALIDA PARA TREN
     Configuración editable: busca "ZONA EDITABLE" en el script.
     Editor de horarios desde el móvil: añade #editar a la URL.
     ═══════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo-1:#dceffa; --fondo-2:#f7fbff;
    --tarjeta:rgba(255,255,255,.88);
    --borde:rgba(11,111,184,.16);
    --tinta:#0e2233; --tinta-suave:#5d7285;
    --azul:#0b6fb8; --azul-tenue:#eaf5fd;
    --ambar:#a86a00; --ambar-tenue:#fff6e6;
    --rojo:#b3352f; --rojo-tenue:#fdefee;
    --verde:#1f7a53; --verde-tenue:#e9f7f0;
    --sombra:0 18px 40px -18px rgba(7,59,83,.35);
    --meta:#dceffa;
  }
  html[data-tema="noche"]{
    --fondo-1:#080f1e; --fondo-2:#141f36;
    --tarjeta:rgba(23,35,60,.86);
    --borde:rgba(133,187,255,.18);
    --tinta:#e4ecf8; --tinta-suave:#8ea3bd;
    --azul:#6ab6ff; --azul-tenue:rgba(106,182,255,.12);
    --ambar:#ffc766; --ambar-tenue:rgba(255,199,102,.12);
    --rojo:#ff8a80; --rojo-tenue:rgba(255,138,128,.12);
    --verde:#6fe0ad; --verde-tenue:rgba(111,224,173,.12);
    --sombra:0 18px 44px -18px rgba(0,0,0,.7);
    --meta:#080f1e;
  }
  *{
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  html{
    height:100%;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    touch-action:manipulation; overscroll-behavior:none;
  }
  body{
    box-sizing:border-box;
    height:100dvh; min-height:100%;
    overflow:hidden;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, var(--fondo-2) 0%, var(--fondo-1) 100%);
    color:var(--tinta);
    margin:0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; align-items:center;
    transition:background .5s ease, color .3s ease;
  }
  #emoji-background{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  #emoji-background div{ position:absolute; will-change:transform; }
  html[data-tema="noche"] #emoji-background{ opacity:.5; }
  main{
    width:100%; max-width:440px;
    max-height:100%;
    overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none;
    background:var(--tarjeta);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);
    backdrop-filter:blur(14px) saturate(1.2);
    border:1px solid var(--borde);
    border-radius:26px;
    box-shadow:var(--sombra);
    padding:22px 20px 20px;
    animation:entrar .7s cubic-bezier(.22,1,.36,1);
  }
  main::-webkit-scrollbar{ display:none; }
  header{ display:flex; align-items:flex-start; gap:12px; margin-bottom:20px; }
  h1{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-weight:800; font-size:1.45rem; line-height:1.05;
    letter-spacing:-.03em; margin:0; flex:1;
  }
  .temporada{
    display:block; margin-top:6px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:.72rem;
    letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-suave);
  }
  #btnTema{
    flex:0 0 auto; width:44px; height:44px; padding:0;
    border-radius:14px; border:1px solid var(--borde);
    background:var(--azul-tenue); color:var(--azul);
    font-size:1.2rem; line-height:1; display:grid; place-items:center;
    transition:transform .25s, background .3s;
  }
  #btnTema:active{ transform:scale(.92) rotate(-15deg); }
  label{ display:block; font-weight:600; font-size:.82rem; color:var(--tinta-suave); }
  input[type="time"]{
    width:100%; box-sizing:border-box; margin-top:8px;
    padding:12px; border-radius:16px;
    border:1px solid var(--borde); background:var(--azul-tenue);
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-size:2rem; font-weight:700; letter-spacing:-.02em;
    text-align:center; color:var(--tinta);
    transition:border-color .25s, background .3s;
  }
  input[type="time"]:focus{ outline:none; border-color:var(--azul); }
  html[data-tema="noche"] input[type="time"]{ color-scheme:dark; }
  .toggle{
    display:flex; align-items:center; gap:14px;
    margin-top:14px; padding:12px 14px;
    border:1px solid var(--borde); border-radius:16px;
    cursor:pointer; transition:background .25s, border-color .25s;
  }
  .toggle.on{ background:var(--azul-tenue); border-color:var(--azul); }
  .toggle input{ position:absolute; opacity:0; pointer-events:none; }
  .switch{ flex:0 0 50px; height:30px; border-radius:15px; background:var(--borde); position:relative; transition:background .25s; }
  .switch::after{
    content:''; position:absolute; top:3px; left:3px; width:24px; height:24px;
    border-radius:50%; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.3);
    transition:transform .25s;
  }
  .toggle.on .switch{ background:var(--azul); }
  .toggle.on .switch::after{ transform:translateX(20px); }
  .toggle b{ font-size:.92rem; font-weight:600; }
  .toggle small{ display:block; margin-top:2px; font-size:.76rem; font-weight:400; color:var(--tinta-suave); }
  .result{ margin-top:18px; }
  .result:empty{ display:none; }
  .tarjeta{
    border-radius:20px; padding:18px;
    background:var(--azul-tenue);
    border:1px solid var(--borde); border-left:4px solid var(--azul);
  }
  .tarjeta + .tarjeta{ margin-top:12px; }
  .tarjeta.plan-b{ background:var(--ambar-tenue); border-left-color:var(--ambar); }
  .tarjeta.aviso{ background:var(--rojo-tenue); border-left-color:var(--rojo); }
  .eyebrow{
    display:block; font-size:.68rem; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--tinta-suave);
  }
  .plan-b .eyebrow{ color:var(--ambar); }
  .aviso .eyebrow{ color:var(--rojo); }
  .hora-grande, .hora-media{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-weight:800; letter-spacing:-.045em; line-height:.95;
    margin-top:4px; font-variant-numeric:tabular-nums;
  }
  .hora-grande{ font-size:3.2rem; }
  .hora-media{ font-size:1.9rem; font-weight:700; }
  .sub{ font-size:.88rem; line-height:1.5; margin-top:8px; color:var(--tinta-suave); }
  .sub b{ color:var(--tinta); font-weight:600; font-variant-numeric:tabular-nums; }
  .salidas{ display:flex; gap:10px; margin-top:14px; }
  .salida{
    flex:1; text-align:center; padding:10px 6px;
    border-radius:14px; border:1px solid var(--borde);
    background:var(--tarjeta); color:var(--tinta);
    font-family:inherit; cursor:pointer;
    transition:border-color .2s, background .2s, transform .1s;
  }
  .salida:active{ transform:scale(.97); }
  .salida span{ display:block; font-size:.68rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-suave); }
  .salida strong{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-size:1.35rem; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums;
  }
  .salida em{ display:block; font-style:normal; font-size:.64rem; font-weight:600; color:var(--tinta-suave); margin-top:2px; }
  .salida.activa{ border-color:var(--verde); background:var(--verde-tenue); }
  .salida.activa em{ color:var(--verde); }
  .cuenta-atras{ margin-top:14px; text-align:center; font-size:.82rem; font-weight:600; color:var(--azul); }
  .cuenta-atras:empty{ display:none; }
  .nota-anterior{ margin:12px 4px 0; font-size:.78rem; text-align:center; color:var(--tinta-suave); }
  /* Alarma / Recordatorio */
  #barraAlarma{ display:none; margin-top:12px; }
  #barraAlarma.puesta{ display:block; }
  .alarma{
    border-radius:20px; padding:16px;
    background:var(--verde-tenue); border:1px solid var(--borde); border-left:4px solid var(--verde);
    text-align:center;
  }
  .alarma .eyebrow{ color:var(--verde); }
  .alarma .reloj{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-size:2.4rem; font-weight:800; letter-spacing:-.04em;
    margin:4px 0 2px; font-variant-numeric:tabular-nums;
  }
  .alarma .detalle{ font-size:.8rem; color:var(--tinta-suave); }
  .alarma button{ margin-top:12px; }
  #barraAlarma.sonando .alarma{
    background:var(--verde); border-color:var(--verde); color:#fff;
    animation:latir .8s ease-in-out infinite;
  }
  #barraAlarma.sonando .eyebrow, #barraAlarma.sonando .detalle{ color:rgba(255,255,255,.85); }
  @keyframes latir{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
  .botones{ margin-top:20px; display:grid; gap:10px; }
  button{
    width:100%; padding:14px; border:none; border-radius:16px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:.98rem;
    background:var(--azul); color:var(--fondo-1);
    cursor:pointer; transition:transform .1s, filter .2s;
  }
  html[data-tema="noche"] button{ color:#07101f; }
  button:active{ transform:scale(.98); }
  button.ghost{ background:transparent; color:var(--azul); border:1px solid var(--azul); }
  #barraAlarma.sonando button.ghost{ background:#fff; color:var(--verde); border-color:#fff; }
  #btnMovimiento{ display:none; }
  #editor{ display:none; margin-top:22px; border-top:1px dashed var(--borde); padding-top:18px; }
  #editor.abierto{ display:block; }
  #editor h2{ font-family:'Bricolage Grotesque','Inter',sans-serif; font-size:1.05rem; margin:0 0 4px; }
  #editor p{ font-size:.8rem; color:var(--tinta-suave); margin:0 0 12px; line-height:1.5; }
  #editor textarea{
    width:100%; min-height:110px; box-sizing:border-box; padding:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85rem;
    border:1px solid var(--borde); border-radius:14px;
    background:var(--azul-tenue); color:var(--tinta);
    -webkit-user-select:text; user-select:text;
  }
  #editorSalida{
    margin-top:10px; padding:12px; border-radius:14px;
    background:var(--azul-tenue); font-size:.8rem; line-height:1.6;
    word-break:break-word; -webkit-user-select:text; user-select:text;
  }
  #editorSalida:empty{ display:none; }
  @keyframes entrar{ from{opacity:0; transform:translateY(14px) scale(.99)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="emoji-background" aria-hidden="true"></div>
<main>
  <header>
    <h1>Nubificador de salida
      <span class="temporada" id="horarioActivo">—</span>
    </h1>
    <button type="button" id="btnTema" aria-label="Cambiar entre modo día y modo noche">☾</button>
  </header>
  <label for="startTime">¿A qué hora entras al nubajo?</label>
  <input type="time" id="startTime" required>
  <div class="toggle" id="toggleFestivo">
    <input type="checkbox" id="finde">
    <span class="switch" aria-hidden="true"></span>
    <span>
      <b>Fin de semana o festivo</b>
      <small id="avisoAuto">Actívalo si hoy no es laborable</small>
    </span>
  </div>
  <div class="result" id="resultBox" aria-live="polite"></div>
  <div id="barraAlarma"></div>
  <div class="botones">
    <button type="button" id="goToGameButton">Fortuna del día</button>
    <button type="button" class="ghost" id="btnMovimiento">Activar movimiento</button>
  </div>
  <section id="editor">
    <h2>Editor de horarios</h2>
    <p>Pega aquí las horas de salida tal cual las copies. Se extrae cualquier HH:MM, se ordena y se quitan las repetidas; el resto del texto se ignora.</p>
    <textarea id="editorEntrada" placeholder="05:46 05:56 06:06 …"></textarea>
    <div class="botones" style="margin-top:10px">
      <button type="button" id="editorAplicar">Aplicar a esta sesión</button>
      <button type="button" class="ghost" id="editorCopiar">Copiar bloque para el archivo</button>
    </div>
    <div id="editorSalida"></div>
  </section>
</main>
<script>
/* ═══════════════════════════════════════════════════════════════════
   ZONA EDITABLE
   ═══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  minutosAndando : 21,
  minutosMoto : 11,
  minutosViaje : 21
};
const HORARIOS = [
  {
    nombre: "Verano 2026",
    desde : "2026-08-01",
    hasta : "2026-08-31",
    laborables: `
      05:46 06:06 06:36 07:06 07:36 08:06
      08:36 09:06 09:36 10:06 10:36 11:06
      11:36 12:06 12:36 13:06 13:36 14:06
      14:36 15:06 15:36 16:06 16:36 17:06
      17:36 18:06 18:36 19:06 19:36 20:06
      20:36 21:06 21:36 22:06 22:36
    `,
    festivos: `
      06:06 06:36 07:06 07:36 08:06 08:36
      09:06 09:36 10:06 10:36 11:06 11:36
      12:06 12:36 13:06 13:36 14:06 14:36
      15:06 15:36 16:06 16:36 17:06 17:36
      18:06 18:36 19:06 19:36 20:06 20:36
      21:06 21:36 22:06 22:36
    `
  },
  {
    nombre: "Horario habitual",
    desde : null,
    hasta : null,
    laborables: `
      05:46 05:56 06:06 06:16 06:26 06:36
      06:46 06:56 07:06 07:16 07:26 07:36
      07:46 07:56 08:06 08:16 08:26 08:36
      08:46 08:56 09:06 09:26 09:46 10:06
      10:26 10:46 11:06 11:26 11:46 12:06
      12:26 12:46 13:06 13:26 13:36 13:46
      13:56 14:06 14:16 14:26 14:36 14:46
      14:56 15:06 15:16 15:26 15:36 15:46
      15:56 16:06 16:16 16:26 16:36 16:46
      16:56 17:06 17:16 17:26 17:36 17:56
      18:16 18:36 18:56 19:16 19:36 19:56
      20:16 20:36 20:56 21:16 21:36 21:56
      22:21
    `,
    festivos: `
      06:11 06:41 07:11 07:41 08:11 08:41
      09:11 09:41 10:11 10:41 11:11 11:41
      12:11 12:41 13:11 13:41 14:11 14:41
      15:11 15:41 16:11 16:41 17:11 17:41
      18:11 18:41 19:11 19:41 20:11 20:41
      21:11 21:41 22:11
    `
  }
];
const FESTIVOS = [
  "2026-08-15", "2026-10-12", "2026-11-01",
  "2026-12-06", "2026-12-08", "2026-12-25"
];
/* ═══════════════════════════════════════════════════════════════════
   A PARTIR DE AQUÍ NO HACE FALTA TOCAR NADA
   ═══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const memoria = {
  leer(clave){ try { return localStorage.getItem(clave); } catch { return null; } },
  guardar(clave, valor){
    try {
      if (valor === null || valor === undefined) localStorage.removeItem(clave);
      else localStorage.setItem(clave, valor);
    } catch {}
  }
};
const aMinutos = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const aHora = m => `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const fechaISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const enMinutos = n => plural(n, "minuto", "minutos");
function duracionLarga(total){
  const h = Math.floor(total/60), m = total%60;
  if (!h) return enMinutos(m);
  if (!m) return plural(h, "hora", "horas");
  return `${plural(h, "hora", "horas")} y ${enMinutos(m)}`;
}
function parseHoras(texto){
  const encontrados = texto.match(/\b([01]?\d|2[0-3]):[0-5]\d\b/g) || [];
  return [...new Set(encontrados.map(aMinutos))].sort((a,b)=>a-b);
}
function temporadaActiva(hoy = new Date()){
  const iso = fechaISO(hoy);
  return HORARIOS.find(h => h.desde && h.hasta && iso >= h.desde && iso <= h.hasta)
      || HORARIOS.find(h => !h.desde)
      || HORARIOS[0];
}
const esFinde = d => d.getDay() === 0 || d.getDay() === 6;
const esFestivo = d => FESTIVOS.includes(fechaISO(d)) || esFinde(d);
let temporada = temporadaActiva();
let anulacionManual = null;
const horasDelDia = finde =>
  anulacionManual || parseHoras(finde ? temporada.festivos : temporada.laborables);
function calcular(entradaMin, finde){
  const trenes = horasDelDia(finde);
  const limite = entradaMin - CONFIG.minutosViaje;
  let i = -1;
  for (let k = 0; k < trenes.length; k++) if (trenes[k] <= limite) i = k;
  return {
    trenes,
    anterior : i > 0 ? trenes[i-1] : null,
    recomendado: i >= 0 ? trenes[i] : null,
    siguiente : trenes[i+1] ?? null,
    primero : trenes[0] ?? null
  };
}
/* --- resultado --- */
const caja = $("resultBox");
let horaSalidaAndando = null;
function bloqueSalidas(tren){
  const pata = tren - CONFIG.minutosAndando;
  const moto = tren - CONFIG.minutosMoto;
  return `
    <div class="salidas">
      <button type="button" class="salida" data-minuto="${pata}" data-modo="a pata">
        <span>A pata</span><strong>${aHora(pata)}</strong><em>Poner recordatorio</em>
      </button>
      <button type="button" class="salida" data-minuto="${moto}" data-modo="en moto">
        <span>En moto</span><strong>${aHora(moto)}</strong><em>Poner recordatorio</em>
      </button>
    </div>`;
}
function render(){
  const valor = $("startTime").value;
  const finde = $("finde").checked;
  horaSalidaAndando = null;
  if (!valor){ caja.innerHTML = ""; marcarSalidaActiva(); return; }
  const entrada = aMinutos(valor);
  const r = calcular(entrada, finde);
  if (!r.trenes.length){
    caja.innerHTML = `<div class="tarjeta aviso"><span class="eyebrow">Sin datos</span>
      <div class="sub">No hay ningún horario cargado. Revisa el bloque HORARIOS del archivo.</div></div>`;
    return;
  }
  if (r.recomendado === null){
    const llegada = r.primero + CONFIG.minutosViaje;
    caja.innerHTML = `
      <div class="tarjeta aviso">
        <span class="eyebrow">Ningún tren llega a tiempo</span>
        <div class="hora-media">${aHora(r.primero)}</div>
        <div class="sub">Es el primero del día y te deja en el nubajo a las <b>${aHora(llegada)}</b>,
        ${enMinutos(llegada - entrada)} tarde.</div>
        ${bloqueSalidas(r.primero)}
      </div>`;
    marcarSalidaActiva();
    return;
  }
  const llegada = r.recomendado + CONFIG.minutosViaje;
  const holgura = entrada - llegada;
  horaSalidaAndando = r.recomendado - CONFIG.minutosAndando;
  let html = `
    <div class="tarjeta">
      <span class="eyebrow">Tu tren</span>
      <div class="hora-grande">${aHora(r.recomendado)}</div>
      <div class="sub">Llegas al nubajo a las <b>${aHora(llegada)}</b>${
        holgura > 0 ? `, con ${enMinutos(holgura)} de margen.` : ", justo a tiempo."}</div>
      ${bloqueSalidas(r.recomendado)}
      <div class="cuenta-atras" id="cuentaAtras"></div>
    </div>`;
  if (r.siguiente !== null){
    const llegadaSiguiente = r.siguiente + CONFIG.minutosViaje;
    const retraso = llegadaSiguiente - entrada;
    html += `
      <div class="tarjeta plan-b">
        <span class="eyebrow">Si lo pierdes</span>
        <div class="hora-media">${aHora(r.siguiente)}</div>
        <div class="sub">Llegas a las <b>${aHora(llegadaSiguiente)}</b>${
          retraso > 0 ? `, ${enMinutos(retraso)} tarde.` : ", todavía a tiempo."}</div>
        ${bloqueSalidas(r.siguiente)}
      </div>`;
  } else {
    html += `<div class="tarjeta plan-b"><span class="eyebrow">Si lo pierdes</span>
      <div class="sub">Es el último tren del día, no hay plan B.</div></div>`;
  }
  if (r.anterior !== null){
    html += `<p class="nota-anterior">Con más margen: el de las ${aHora(r.anterior)} te deja allí a las ${aHora(r.anterior + CONFIG.minutosViaje)}.</p>`;
  }
  caja.innerHTML = html;
  marcarSalidaActiva();
  pintarCuentaAtras();
}
function pintarCuentaAtras(){
  const el = $("cuentaAtras");
  if (!el || horaSalidaAndando === null) return;
  const ahora = new Date();
  const faltan = horaSalidaAndando - (ahora.getHours()*60 + ahora.getMinutes());
  el.textContent = (faltan > 0 && faltan <= 720)
    ? `${faltan === 1 ? "Falta" : "Faltan"} ${duracionLarga(faltan)} para salir a pata`
    : "";
}
/* ═══ Recordatorio / Alarma con sonido + notificación ═══ */
let alarma = null;
let audio = null;
let repetirSonido = null;

function guardarAlarma() {
  if (!alarma) {
    memoria.guardar("nubificador:alarma", null);
    return;
  }
  memoria.guardar("nubificador:alarma", JSON.stringify({
    minuto: alarma.minuto,
    modo: alarma.modo,
    objetivo: alarma.objetivo.getTime(),
    sonando: alarma.sonando
  }));
}

function restaurarAlarma() {
  const raw = memoria.leer("nubificador:alarma");
  if (!raw) { alarma = null; return; }
  try {
    const data = JSON.parse(raw);
    alarma = {
      minuto: data.minuto,
      modo: data.modo,
      objetivo: new Date(data.objetivo),
      sonando: !!data.sonando
    };
    // Si ya debería haber sonado, forzar el estado
    if (!alarma.sonando && new Date() >= alarma.objetivo) {
      alarma.sonando = true;
      prepararAudio();
      pitar();
      mostrarNotificacion();
      if (!repetirSonido) {
        repetirSonido = setInterval(pitar, 3000);
        setTimeout(() => { clearInterval(repetirSonido); repetirSonido = null; }, 120000);
      }
      guardarAlarma();
    }
  } catch {
    alarma = null;
  }
}

function prepararAudio(){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch { audio = null; }
}

function pitar(){
  if (!audio) return;
  const ahora = audio.currentTime;
  for (let i = 0; i < 3; i++){
    const osc = audio.createOscillator();
    const vol = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = i === 2 ? 1320 : 880;
    const t = ahora + i*0.28;
    vol.gain.setValueAtTime(0.0001, t);
    vol.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    vol.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(vol).connect(audio.destination);
    osc.start(t); osc.stop(t + 0.25);
  }
  if (navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
}

function mostrarNotificacion(){
  if (!("Notification" in window) || Notification.permission !== "granted" || !alarma) return;
  try {
    new Notification("¡Hora de salir!", {
      body: `Toca salir ${alarma.modo}`,
      tag: "nubificador-recordatorio",
      requireInteraction: true
    });
  } catch {}
}

function ponerAlarma(minuto, modo){
  prepararAudio();
  // Pedir permiso de notificaciones la primera vez
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission().catch(()=>{});
  }
  const ahora = new Date();
  const objetivo = new Date(ahora);
  objetivo.setHours(Math.floor(minuto/60), minuto%60, 0, 0);
  if (objetivo <= ahora){
    pintarAlarma(`Las ${aHora(minuto)} ya han pasado. Elige otra hora de salida.`);
    return;
  }
  alarma = { objetivo, minuto, modo, sonando:false };
  pitar();
  marcarSalidaActiva();
  pintarAlarma();
  guardarAlarma();
}

function quitarAlarma(){
  alarma = null;
  clearInterval(repetirSonido); repetirSonido = null;
  if (navigator.vibrate) navigator.vibrate(0);
  marcarSalidaActiva();
  pintarAlarma();
  guardarAlarma();
}

function marcarSalidaActiva(){
  document.querySelectorAll(".salida").forEach(b => {
    const activa = alarma && Number(b.dataset.minuto) === alarma.minuto;
    b.classList.toggle("activa", !!activa);
    const em = b.querySelector("em");
    if (em) em.textContent = activa ? "Recordatorio activo" : "Poner recordatorio";
  });
}

function pintarAlarma(mensaje){
  const barra = $("barraAlarma");
  if (mensaje){
    barra.className = "puesta";
    barra.innerHTML = `<div class="alarma"><span class="eyebrow">Aviso</span>
      <div class="detalle" style="margin-top:6px">${mensaje}</div></div>`;
    return;
  }
  if (!alarma){ barra.className = ""; barra.innerHTML = ""; return; }
  if (alarma.sonando){
    barra.className = "puesta sonando";
    barra.innerHTML = `<div class="alarma">
      <span class="eyebrow">¡Hora de salir!</span>
      <div class="reloj">${aHora(alarma.minuto)}</div>
      <div class="detalle">Toca salir ${alarma.modo}</div>
      <button type="button" class="ghost" id="btnQuitarAlarma">Ya voy, callar</button>
    </div>`;
  } else {
    const restante = Math.max(0, Math.round((alarma.objetivo - new Date())/1000));
    const h = Math.floor(restante/3600), m = Math.floor(restante%3600/60), s = restante%60;
    const reloj = h
      ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
      : `${m}:${String(s).padStart(2,"0")}`;
    barra.className = "puesta";
    barra.innerHTML = `<div class="alarma">
      <span class="eyebrow">Recordatorio puesto</span>
      <div class="reloj">${reloj}</div>
      <div class="detalle">Te avisará a las ${aHora(alarma.minuto)} para salir ${alarma.modo}</div>
      <button type="button" class="ghost" id="btnQuitarAlarma">Quitar el recordatorio</button>
    </div>`;
  }
  const boton = $("btnQuitarAlarma");
  if (boton) boton.addEventListener("click", quitarAlarma);
}

caja.addEventListener("click", e => {
  const boton = e.target.closest(".salida");
  if (!boton) return;
  const minuto = Number(boton.dataset.minuto);
  if (alarma && alarma.minuto === minuto) quitarAlarma();
  else ponerAlarma(minuto, boton.dataset.modo);
});

/* Un solo latido de reloj para la cuenta atrás y para el recordatorio */
setInterval(() => {
  pintarCuentaAtras();
  if (!alarma) return;
  if (!alarma.sonando && new Date() >= alarma.objetivo){
    alarma.sonando = true;
    pitar();
    mostrarNotificacion();
    repetirSonido = setInterval(pitar, 3000);
    setTimeout(() => { clearInterval(repetirSonido); repetirSonido = null; }, 120000);
    guardarAlarma();
  }
  pintarAlarma();
}, 1000);

/* Al volver a la pestaña, restaurar y recalcular */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden){
    restaurarAlarma();
    pintarCuentaAtras();
    pintarAlarma();
  }
});

/* ═══ Modo noche ═══ */
function aplicarTema(tema){
  document.documentElement.dataset.tema = tema;
  $("btnTema").textContent = tema === "noche" ? "☀" : "☾";
  const color = getComputedStyle(document.documentElement).getPropertyValue("--meta").trim();
  $("metaTema").setAttribute("content", color);
}
(function temaInicial(){
  const guardado = memoria.leer("nubificador:tema");
  const preferencia = window.matchMedia("(prefers-color-scheme: dark)").matches ? "noche" : "dia";
  aplicarTema(guardado || preferencia);
})();
$("btnTema").addEventListener("click", () => {
  const nuevo = document.documentElement.dataset.tema === "noche" ? "dia" : "noche";
  aplicarTema(nuevo);
  memoria.guardar("nubificador:tema", nuevo);
});

/* ═══ Interfaz ═══ */
const toggle = $("toggleFestivo");
const checkFinde = $("finde");
const pintarToggle = () => toggle.classList.toggle("on", checkFinde.checked);
toggle.addEventListener("click", e => {
  if (e.target.tagName !== "INPUT") checkFinde.checked = !checkFinde.checked;
  pintarToggle();
  memoria.guardar("nubificador:festivo", checkFinde.checked ? "1" : "0");
  render();
});
$("startTime").addEventListener("input", () => {
  memoria.guardar("nubificador:hora", $("startTime").value);
  render();
});
$("startTime").addEventListener("change", () => {
  memoria.guardar("nubificador:hora", $("startTime").value);
  render();
});
$("goToGameButton").addEventListener("click", () => { window.location.href = "miyutarot.html"; });

(function iniciar(){
  const hoy = new Date();
  temporada = temporadaActiva(hoy);
  $("horarioActivo").textContent = temporada.nombre;

  // Restaurar hora guardada
  const horaGuardada = memoria.leer("nubificador:hora");
  if (horaGuardada) $("startTime").value = horaGuardada;

  // Restaurar festivo (si existe) o auto-detectar
  const festivoGuardado = memoria.leer("nubificador:festivo");
  if (festivoGuardado !== null) {
    checkFinde.checked = festivoGuardado === "1";
  } else if (esFestivo(hoy)) {
    checkFinde.checked = true;
    $("avisoAuto").textContent = esFinde(hoy)
      ? "Hoy es fin de semana, ya está marcado"
      : "Hoy es festivo, ya está marcado";
  }
  pintarToggle();

  // Restaurar recordatorio
  restaurarAlarma();

  render();
})();

/* Sin zoom por pellizco ni por doble toque */
["gesturestart","gesturechange","gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false })
);
let ultimoToque = 0;
document.addEventListener("touchend", e => {
  const ahora = Date.now();
  if (ahora - ultimoToque < 300) e.preventDefault();
  ultimoToque = ahora;
}, { passive:false });

/* ═══ Editor oculto (#editar) ═══ */
function abrirEditorSiToca(){
  if (location.hash !== "#editar") return;
  $("editor").classList.add("abierto");
  $("editorEntrada").value = horasDelDia(checkFinde.checked).map(aHora).join(" ");
}
window.addEventListener("hashchange", abrirEditorSiToca);
abrirEditorSiToca();
$("editorAplicar").addEventListener("click", () => {
  const horas = parseHoras($("editorEntrada").value);
  if (!horas.length){ $("editorSalida").textContent = "No he encontrado ninguna hora en formato HH:MM."; return; }
  anulacionManual = horas;
  $("editorSalida").textContent = `${horas.length} trenes cargados en esta sesión (se pierden al recargar). El primero sale a las ${aHora(horas[0])} y el último a las ${aHora(horas[horas.length-1])}.`;
  render();
});
$("editorCopiar").addEventListener("click", async () => {
  const horas = parseHoras($("editorEntrada").value);
  if (!horas.length){ $("editorSalida").textContent = "No he encontrado ninguna hora en formato HH:MM."; return; }
  const lineas = [];
  for (let i = 0; i < horas.length; i += 6) lineas.push(" " + horas.slice(i, i+6).map(aHora).join(" "));
  const bloque = "`\n" + lineas.join("\n") + "\n `";
  try {
    await navigator.clipboard.writeText(bloque);
    $("editorSalida").textContent = `Copiado: ${horas.length} trenes. Pega el bloque en "laborables" o en "festivos".`;
  } catch {
    $("editorSalida").textContent = bloque;
  }
});
</script>
<script>
/* --- fondo de emojis con física: sólo en móvil y tableta --- */
(function(){
  const esTactil = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  if (!esTactil || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cont = document.getElementById("emoji-background");
  const set = ["☁️","😺","❤️"];
  const n = 24;
  const damping = .995, rebote = .6;
  let gravedad = { x:0, y:.14 };
  const piezas = [];
  for (let i = 0; i < n; i++){
    const el = document.createElement("div");
    el.textContent = set[Math.floor(Math.random()*set.length)];
    const tam = Math.random()*46 + 16;
    el.style.fontSize = tam + "px";
    cont.appendChild(el);
    piezas.push({
      el, tam,
      pos:{ x: Math.random()*Math.max(1, innerWidth-tam), y: Math.random()*Math.max(1, innerHeight-tam) },
      vel:{ x:(Math.random()-.5)*4, y:(Math.random()-.5)*4 },
      giro: Math.random()*360, velGiro:(Math.random()-.5)*2,
      retraso:(Math.random()*10 + 5) * 100, cayendo:false
    });
  }
  let anterior = performance.now();
  function animar(t){
    const dt = Math.min(t - anterior, 50); anterior = t;
    for (const p of piezas){
      if (!p.cayendo){ p.retraso -= dt; if (p.retraso <= 0) p.cayendo = true; }
      if (p.cayendo){ p.vel.x += gravedad.x; p.vel.y += gravedad.y; }
      p.vel.x *= damping; p.vel.y *= damping;
      p.pos.x += p.vel.x; p.pos.y += p.vel.y;
      const limX = innerWidth - p.tam, limY = innerHeight - p.tam;
      if (p.pos.x < 0 || p.pos.x > limX){ p.vel.x *= -rebote; p.pos.x = Math.max(0, Math.min(p.pos.x, limX)); }
      if (p.pos.y < 0 || p.pos.y > limY){ p.vel.y *= -rebote; p.pos.y = Math.max(0, Math.min(p.pos.y, limY)); p.vel.x *= .96; }
      if (Math.abs(p.vel.x) < .04) p.vel.x = 0;
      if (Math.abs(p.vel.y) < .04 && p.pos.y >= limY - 1) p.vel.y = 0;
      p.giro += p.velGiro;
      p.el.style.transform = `translate(${p.pos.x}px, ${p.pos.y}px) rotate(${p.giro}deg)`;
    }
    requestAnimationFrame(animar);
  }
  requestAnimationFrame(animar);
  const despertar = () => piezas.forEach(p => {
    p.vel.x += (Math.random()-.5)*26;
    p.vel.y += (Math.random()-.5)*26;
    p.velGiro += (Math.random()-.5)*8;
  });
  function alInclinar(e){
    let x = e.gamma || 0, y = e.beta || 0;
    const giro = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    if (giro === 90){ const t = x; x = y; y = -t; }
    else if (giro === -90 || giro === 270){ const t = x; x = -y; y = t; }
    else if (giro === 180){ x = -x; y = -y; }
    gravedad = { x: Math.max(-2, Math.min(2, x/45)), y: Math.max(-2, Math.min(2, y/45)) };
  }
  function detectorDeAgite(){
    let ax, ay, az;
    return e => {
      const a = e.accelerationIncludingGravity; if (!a) return;
      if (ax !== undefined && Math.abs(a.x-ax)+Math.abs(a.y-ay)+Math.abs(a.z-az) > 15) despertar();
      ax = a.x; ay = a.y; az = a.z;
    };
  }
  const escucharSensores = () => {
    addEventListener("deviceorientation", alInclinar);
    addEventListener("devicemotion", detectorDeAgite());
  };
  const necesitaPermiso = typeof DeviceOrientationEvent !== "undefined"
    && typeof DeviceOrientationEvent.requestPermission === "function";
  if (!necesitaPermiso){
    escucharSensores();
  } else {
    const boton = document.getElementById("btnMovimiento");
    boton.style.display = "block";
    boton.addEventListener("click", async () => {
      try{
        const permiso = await DeviceOrientationEvent.requestPermission();
        if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
          await DeviceMotionEvent.requestPermission();
        }
        if (permiso === "granted"){ escucharSensores(); despertar(); boton.style.display = "none"; }
        else boton.textContent = "Movimiento bloqueado en los ajustes";
      } catch { boton.textContent = "No se pudo activar el movimiento"; }
    });
  }
})();
</script>
