<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Exploración — Sistema Solar</title>
<style>
  :root {
    --panel-bg: rgba(2,12,20,0.85);
    --accent: #00d1ff;
    --text: #bff;
  }
  html,body {
    height:100%;margin:0;
    background:#000;
    color:var(--text);
    font-family: system-ui, Arial, sans-serif;
    overflow:hidden;
  }
  #container {
    position:relative;
    width:100%;
    height:100%;
  }
  canvas {
    display:block;
    width:100%;
    height:100%;
    background:#000;
  }
  #panel {
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    background:var(--panel-bg);
    border-top:1px solid rgba(255,255,255,0.1);
    padding:8px;
    overflow-x:auto;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    z-index:10;
  }
  .body-btn {
    background:rgba(0,30,40,0.8);
    border:1px solid rgba(0,209,255,0.2);
    color:var(--text);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    flex: 0 0 auto;
    min-width:70px;
  }
  .body-btn span {
    font-size:11px;
    color:#6ef;
  }
  .body-btn:hover {
    border-color:var(--accent);
  }
  #infoBox {
    position:absolute;
    top:8px;
    left:8px;
    background:rgba(0,0,0,0.6);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    max-width:80%;
    z-index:10;
  }
  @media (min-width:700px) {
    #panel {
      top:10px;
      right:10px;
      left:auto;
      bottom:auto;
      width:280px;
      height:auto;
      flex-direction:column;
      overflow-y:auto;
    }
    .body-btn { flex:unset; flex-direction:row; justify-content:space-between; }
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="renderCanvas"></canvas>
  <div id="infoBox">Selecciona un planeta o luna</div>
  <div id="panel"></div>
</div>

<!-- Three.js y OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/examples/js/controls/OrbitControls.min.js"></script>

<script src="exploracion.js"></script>
</body>
</html>
