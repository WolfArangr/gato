<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Exploración — Sistema Solar (limpio)</title>
<style>
  :root{
    --panel-bg: rgba(2,12,20,0.85);
    --accent: #00d1ff;
    --text: #bff;
  }
  html,body{height:100%;margin:0;background:#000;font-family:Arial, Helvetica, sans-serif;color:var(--text);overflow:hidden}
  #container{width:100%;height:100%;position:relative}
  canvas{display:block;width:100%;height:100%}
  /* Panel lateral */
  #panel{
    position: absolute;
    right: 12px;
    top: 12px;
    width: 300px;
    max-height: calc(100% - 24px);
    background: var(--panel-bg);
    border: 1px solid rgba(0,209,255,0.16);
    padding: 10px;
    overflow:auto;
    box-shadow: 0 6px 30px rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
  }
  #panel h2{color:var(--accent);font-size:16px;margin:0 0 8px 0}
  .body-item{display:flex;align-items:center;justify-content:space-between;padding:6px;border-bottom:1px solid rgba(255,255,255,0.03)}
  .body-left{display:flex;gap:8px;align-items:center}
  .body-dot{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#fff2,#00d1ff22);border:1px solid rgba(255,255,255,0.06)}
  .body-name{font-size:13px}
  .body-actions{display:flex;gap:6px;align-items:center}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:6px 8px;color:var(--text);cursor:pointer;font-size:13px;border-radius:6px}
  .btn:hover{border-color:var(--accent);box-shadow:0 0 8px rgba(0,209,255,0.06)}
  .btn-primary{background:linear-gradient(90deg,#003046,#002432);border:1px solid #005f7f}
  .wiki{font-size:12px;color:#66d9ff;padding:4px 6px;border-radius:6px;border:1px dashed rgba(102,217,255,0.15)}
  #legend{margin-top:10px;font-size:12px;color:#9fb}
  #infoBox{margin-top:10px;padding:8px;background:rgba(255,255,255,0.02);border-radius:6px;font-size:13px}
  /* Etiquetas flotantes (over canvas) */
  .label {
    pointer-events: none;
    font-size:12px;
    color:#e6f8ff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }
  @media (max-width:700px){
    #panel{width: 220px; right:8px; top:8px}
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="renderCanvas"></canvas>

  <div id="panel" aria-label="panel de selección">
    <h2>Seleccionar destino</h2>
    <div id="bodiesList"></div>

    <div id="legend">
      Usa la lista para elegir planeta o luna → la nave viajará y la cámara seguirá.
    </div>

    <div id="infoBox">
      <strong>Información:</strong>
      <div id="infoText" style="margin-top:6px;font-size:13px;color:#bfe">Selecciona un cuerpo para ver su wiki (marcador).</div>
    </div>
  </div>
</div>

<!-- Three.js (r128) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Nuestro script -->
<script src="exploracion.js"></script>
</body>
</html>
