<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Explorador del Sistema Solar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #000;
            color: #0f0;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #navigationPanel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00ffff;
            padding: 15px;
            pointer-events: all;
            backdrop-filter: blur(10px);
            max-width: 90vw;
            max-height: 40vh;
            overflow-y: auto;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }
        
        #navigationPanel h3 {
            color: #00ffff;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ffff;
            border-bottom: 2px solid #00ffff;
            padding-bottom: 8px;
            font-size: 16px;
            text-align: center;
        }
        
        .planet-group {
            margin-bottom: 15px;
        }
        
        .planet-button {
            background: linear-gradient(135deg, #003366, #004488);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s;
            touch-action: manipulation;
            min-height: 44px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 10px rgba(0, 255, 255, 0.2);
        }
        
        .planet-button:hover {
            background: linear-gradient(135deg, #004488, #0066aa);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4);
        }
        
        .planet-button:active {
            background: #00ffff;
            color: #000;
            transform: scale(0.95);
        }
        
        .planet-button.current {
            background: linear-gradient(135deg, #006600, #008800);
            border-color: #0f0;
            color: #0f0;
        }
        
        .info-button {
            background: rgba(0, 100, 150, 0.8);
            color: #fff;
            border: 1px solid #00ffff;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            transition: all 0.2s;
        }
        
        .info-button:hover {
            background: rgba(0, 150, 200, 0.9);
        }
        
        .moon-buttons {
            margin-left: 30px;
            margin-top: 5px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .moon-button {
            background: rgba(50, 50, 100, 0.8);
            color: #aaf;
            border: 1px solid #66f;
            padding: 8px 15px;
            font-size: 11px;
            border-radius: 4px;
        }
        
        .moon-button:hover {
            background: rgba(70, 70, 120, 0.9);
        }
        
        #infoModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.98);
            border: 3px solid #00ffff;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            display: none;
            pointer-events: all;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.6);
            border-radius: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        #infoModal.show {
            display: block;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }
        
        #infoModal h2 {
            color: #00ffff;
            margin-bottom: 15px;
            font-size: 20px;
            text-shadow: 0 0 10px #00ffff;
        }
        
        #infoModal p {
            color: #0ff;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        #closeInfo {
            background: #003366;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
            border-radius: 5px;
        }
        
        #closeInfo:hover {
            background: #00ffff;
            color: #000;
        }
        
        #statusPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid #00ffff;
            padding: 15px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            border-radius: 8px;
            min-width: 200px;
        }
        
        #statusPanel h3 {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffff;
        }
        
        .status-item {
            color: #0f0;
            font-size: 12px;
            margin: 5px 0;
        }
        
        .control-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #00ffff;
            padding: 10px;
            font-size: 10px;
            color: #0ff;
            pointer-events: none;
            border-radius: 5px;
        }
        
        @media (max-width: 600px) {
            .planet-button {
                font-size: 11px;
                padding: 10px 15px;
            }
            
            #statusPanel {
                top: 10px;
                right: 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="statusPanel">
            <h3>🚀 ESTADO</h3>
            <div class="status-item">📍 <span id="currentLocation">Tierra</span></div>
            <div class="status-item">🎯 <span id="travelStatus">En órbita</span></div>
        </div>
        
        <div id="navigationPanel">
            <h3>🌌 NAVEGACIÓN DEL SISTEMA SOLAR</h3>
            <div id="planetList"></div>
        </div>
        
        <div class="control-info">
            👆 Arrastra para rotar cámara<br>
            🖱️ Click en planetas para seleccionar
        </div>
        
        <div id="infoModal">
            <h2 id="infoTitle"></h2>
            <div id="infoContent"></div>
            <button id="closeInfo">CERRAR</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="exploracion.js"></script>
</body>
</html>
