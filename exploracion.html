<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Explorador del Sistema Solar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #000;
            color: #0f0;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #navigationPanel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00ffff;
            padding: 15px;
            pointer-events: all;
            backdrop-filter: blur(10px);
            max-width: 90vw;
            width: 500px;
            max-height: 50vh;
            overflow-y: auto;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }
        
        #navigationPanel h3 {
            color: #00ffff;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ffff;
            border-bottom: 2px solid #00ffff;
            padding-bottom: 8px;
            font-size: 15px;
            text-align: center;
        }
        
        .planet-group {
            margin-bottom: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 30, 60, 0.3);
        }
        
        .planet-header {
            display: flex;
            align-items: center;
            padding: 10px;
            background: rgba(0, 50, 100, 0.4);
            gap: 8px;
        }
        
        .planet-name {
            flex: 1;
            color: #00ffff;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .planet-name.current {
            color: #0f0;
        }
        
        .action-button {
            background: linear-gradient(135deg, #003366, #004488);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.3s;
            touch-action: manipulation;
            min-height: 40px;
            min-width: 40px;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0, 255, 255, 0.2);
        }
        
        .action-button:active {
            background: #00ffff;
            color: #000;
            transform: scale(0.95);
        }
        
        .action-button.info {
            background: rgba(100, 50, 150, 0.6);
            border-color: #aa88ff;
            color: #aa88ff;
            font-weight: bold;
        }
        
        .action-button.travel {
            background: linear-gradient(135deg, #006600, #008800);
            border-color: #0f0;
            color: #0f0;
        }
        
        .action-button.toggle {
            background: rgba(50, 50, 50, 0.6);
            border-color: #888;
            color: #888;
            padding: 6px 12px;
            min-height: 36px;
        }
        
        .action-button.toggle.active {
            background: rgba(0, 100, 150, 0.8);
            border-color: #00ffff;
            color: #00ffff;
        }
        
        .moon-list {
            display: none;
            padding: 10px;
            background: rgba(0, 20, 40, 0.5);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        
        .moon-list.show {
            display: block;
        }
        
        .moon-item {
            display: flex;
            align-items: center;
            padding: 8px;
            margin: 5px 0;
            background: rgba(30, 30, 60, 0.6);
            border-radius: 5px;
            border-left: 3px solid #66f;
            gap: 8px;
        }
        
        .moon-name {
            flex: 1;
            color: #aaf;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .moon-name.current {
            color: #0f0;
            font-weight: bold;
        }
        
        #infoModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.98);
            border: 3px solid #00ffff;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            display: none;
            pointer-events: all;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.6);
            border-radius: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        #infoModal.show {
            display: block;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }
        
        #infoModal h2 {
            color: #00ffff;
            margin-bottom: 15px;
            font-size: 20px;
            text-shadow: 0 0 10px #00ffff;
        }
        
        #infoModal p {
            color: #0ff;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        #closeInfo {
            background: #003366;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
            border-radius: 5px;
        }
        
        #closeInfo:hover {
            background: #00ffff;
            color: #000;
        }
        
        #statusPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid #00ffff;
            padding: 15px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            border-radius: 8px;
            min-width: 200px;
        }
        
        #statusPanel h3 {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffff;
        }
        
        .status-item {
            color: #0f0;
            font-size: 12px;
            margin: 5px 0;
        }
        
        .control-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #00ffff;
            padding: 10px;
            font-size: 10px;
            color: #0ff;
            pointer-events: none;
            border-radius: 5px;
        }
        
        #zoomControls {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: all;
        }
        
        .zoom-button {
            width: 50px;
            height: 50px;
            background: rgba(0, 50, 100, 0.9);
            border: 2px solid #00ffff;
            border-radius: 50%;
            color: #00ffff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 2px 10px rgba(0, 255, 255, 0.3);
        }
        
        .zoom-button:active {
            background: #00ffff;
            color: #000;
            transform: scale(0.9);
        }
        
        @media (max-width: 600px) {
            #navigationPanel {
                width: 95vw;
                max-height: 45vh;
                bottom: 10px;
                padding: 12px;
            }
            
            #navigationPanel h3 {
                font-size: 14px;
            }
            
            .planet-header {
                padding: 8px;
            }
            
            .planet-name {
                font-size: 13px;
            }
            
            .action-button {
                font-size: 11px;
                padding: 6px 12px;
                min-height: 38px;
                min-width: 38px;
            }
            
            .moon-item {
                padding: 6px;
            }
            
            .moon-name {
                font-size: 12px;
            }
            
            #statusPanel {
                top: 10px;
                right: 10px;
                font-size: 11px;
                padding: 10px;
                min-width: 160px;
            }
            
            #zoomControls {
                right: 10px;
            }
            
            .zoom-button {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            
            .control-info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="statusPanel">
            <h3>🚀 ESTADO</h3>
            <div class="status-item">📍 <span id="currentLocation">Tierra</span></div>
            <div class="status-item">🎯 <span id="travelStatus">En órbita</span></div>
        </div>
        
        <div id="zoomControls">
            <button class="zoom-button" id="zoomIn">+</button>
            <button class="zoom-button" id="zoomOut">−</button>
        </div>
        
        <div id="navigationPanel">
            <h3>🌌 NAVEGACIÓN DEL SISTEMA SOLAR</h3>
            <div id="planetList"></div>
        </div>
        
        <div class="control-info">
            👆 Arrastra para rotar cámara<br>
            🖱️ Click en planetas para seleccionar
        </div>
        
        <div id="infoModal">
            <h2 id="infoTitle"></h2>
            <div id="infoContent"></div>
            <button id="closeInfo">CERRAR</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="exploracion.js"></script>
</body>
</html>
