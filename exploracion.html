<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
<title>Explorador del Sistema Solar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #00e5ff;
  --cyan-dim: rgba(0,229,255,0.15);
  --cyan-glow: rgba(0,229,255,0.4);
  --green: #00ff9d;
  --amber: #ffb700;
  --red: #ff4757;
  --bg: #020810;
  --panel: rgba(2,14,28,0.88);
  --border: rgba(0,229,255,0.2);
  --text: #c8e8f0;
  --text-dim: rgba(200,232,240,0.5);
  --radius: 12px;
  --font-mono: 'Syne Mono', monospace;
  --font-ui: 'Space Grotesk', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font-ui); overflow:hidden; background:var(--bg); color:var(--cyan); position:fixed; width:100%; height:100%; touch-action:none; }
#gameCanvas { display:block; width:100vw; height:100vh; }
#ui { position:absolute; inset:0; pointer-events:none; }

/* ── HUD top-left ── */
#hud-left {
  position:absolute; top:16px; left:16px;
  display:flex; flex-direction:column; gap:8px;
  pointer-events:all; z-index:10;
}

/* ── HUD top-right ── */
#hud-right {
  position:absolute; top:16px; right:16px;
  pointer-events:all; z-index:10;
  min-width:210px;
}

/* ── glass panel base ── */
.glass {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 0 24px rgba(0,229,255,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
}

/* ── STATUS PANEL ── */
#statusPanel {
  padding:14px 16px 12px;
}
.panel-title {
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.2em;
  color:var(--cyan);
  text-transform:uppercase;
  opacity:0.7;
  margin-bottom:10px;
  display:flex; align-items:center; gap:6px;
}
.panel-title::before {
  content:'';
  width:6px; height:6px; border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.status-grid {
  display:grid; grid-template-columns:auto 1fr; gap:4px 10px;
  align-items:center;
}
.status-label {
  font-family:var(--font-mono);
  font-size:10px; color:var(--text-dim);
  letter-spacing:0.05em;
}
.status-value {
  font-family:var(--font-mono);
  font-size:11px; color:var(--cyan);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.status-value.traveling { color:var(--amber); }
.status-value.ship { color:var(--green); }

.divider {
  height:1px; background:var(--border); margin:10px 0;
  grid-column:1/-1;
}

#gameClock {
  font-family:var(--font-mono);
  font-size:13px; color:var(--cyan);
  letter-spacing:0.08em;
  margin-top:2px;
  text-shadow:0 0 12px var(--cyan-glow);
}

#elapsedTime {
  font-family:var(--font-mono);
  font-size:10px; color:var(--text-dim);
}

/* ── CONTROLS ── */
#controlsPanel {
  padding:12px;
  max-width:170px;
  transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s;
  overflow:hidden;
  max-height:400px;
}
#controlsPanel.collapsed {
  max-height:44px;
}
#controlsPanel.collapsed .ctrl-body {
  opacity:0; pointer-events:none;
}
.ctrl-header {
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer;
  font-family:var(--font-mono);
  font-size:10px; letter-spacing:0.18em; color:var(--cyan);
  text-transform:uppercase; opacity:0.7;
  padding-bottom:10px;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
  transition:opacity 0.2s;
}
#controlsPanel.collapsed .ctrl-header {
  padding-bottom:0; margin-bottom:0; border-bottom:none;
}
.ctrl-header:hover { opacity:1; }
.ctrl-chevron { transition:transform 0.35s; font-size:8px; }
#controlsPanel.collapsed .ctrl-chevron { transform:rotate(-90deg); }
.ctrl-body { transition:opacity 0.25s; display:flex; flex-direction:column; gap:6px; }

.btn {
  width:100%;
  font-family:var(--font-ui);
  font-size:11px; font-weight:500;
  letter-spacing:0.04em;
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
  transition:all 0.18s;
  display:flex; align-items:center; gap:7px;
  white-space:nowrap;
  background:rgba(0,229,255,0.06);
  border:1px solid var(--border);
  color:var(--text);
}
.btn:hover { background:rgba(0,229,255,0.12); border-color:rgba(0,229,255,0.4); color:var(--cyan); }
.btn.active { background:var(--cyan); color:#000; border-color:var(--cyan); font-weight:600; box-shadow:0 0 16px var(--cyan-glow); }
.btn-icon { font-size:13px; flex-shrink:0; }

.orbit-row { display:flex; gap:6px; }
.btn-zoom {
  flex:1; font-family:var(--font-mono); font-size:18px; font-weight:300;
  padding:6px; border-radius:8px; cursor:pointer;
  background:rgba(0,229,255,0.06); border:1px solid var(--border); color:var(--cyan);
  transition:all 0.18s; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.btn-zoom:hover { background:rgba(0,229,255,0.18); border-color:var(--cyan-glow); box-shadow:0 0 10px var(--cyan-dim); }
.btn-zoom:active { background:var(--cyan); color:#000; }

/* ── BODY LABELS ── */
.body-label {
  position:absolute;
  font-family:var(--font-mono);
  font-size:11px; color:var(--cyan);
  text-shadow:0 0 8px rgba(0,229,255,0.8);
  pointer-events:none; white-space:nowrap; user-select:none; z-index:5;
  background:rgba(0,10,22,0.7);
  padding:2px 8px; border-radius:20px;
  border:1px solid rgba(0,229,255,0.25);
  backdrop-filter:blur(4px);
  transition:opacity 0.3s;
}

/* ── NAV PANEL ── */
#togglePanelBtn {
  position:absolute; bottom:22px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,229,255,0.1);
  border:1px solid rgba(0,229,255,0.35);
  color:var(--cyan); padding:10px 24px;
  font-family:var(--font-ui); font-size:12px; font-weight:500;
  letter-spacing:0.08em;
  border-radius:40px; pointer-events:all;
  box-shadow:0 0 20px rgba(0,229,255,0.2);
  transition:all 0.2s; z-index:12;
  display:flex; align-items:center; gap:8px;
  cursor:pointer;
}
#togglePanelBtn:hover { background:rgba(0,229,255,0.18); box-shadow:0 0 28px rgba(0,229,255,0.35); }
#togglePanelBtn.open { background:var(--cyan); color:#000; }

#navigationPanel {
  position:absolute; bottom:-100%; left:50%;
  transform:translateX(-50%);
  background:rgba(2,12,26,0.96);
  border:1px solid var(--border);
  border-bottom:none;
  padding:18px; pointer-events:all;
  backdrop-filter:blur(20px);
  width:min(92vw, 520px);
  max-height:58vh; overflow-y:auto;
  border-radius:var(--radius) var(--radius) 0 0;
  box-shadow:0 -8px 40px rgba(0,229,255,0.15);
  transition:bottom 0.4s cubic-bezier(0.4,0,0.2,1);
  z-index:11;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
#navigationPanel.show { bottom:0; }
#navigationPanel::-webkit-scrollbar { width:4px; }
#navigationPanel::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.nav-title {
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em;
  color:var(--cyan); text-transform:uppercase; opacity:0.6;
  margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.nav-title::after { content:''; flex:1; height:1px; background:var(--border); }

.planet-group {
  margin-bottom:8px;
  border:1px solid rgba(0,229,255,0.12);
  border-radius:10px; overflow:hidden;
  background:rgba(0,20,40,0.3);
  transition:border-color 0.2s;
}
.planet-group:hover { border-color:rgba(0,229,255,0.25); }
.planet-header {
  display:flex; align-items:center; gap:8px;
  padding:10px 12px;
}
.planet-dot {
  width:10px; height:10px; border-radius:50%;
  flex-shrink:0;
  box-shadow:0 0 6px currentColor;
}
.planet-name {
  flex:1; font-size:13px; font-weight:500;
  color:var(--text); letter-spacing:0.02em;
}
.planet-name.current { color:var(--green); }

.action-btn {
  font-family:var(--font-ui); font-size:11px;
  padding:5px 10px; border-radius:6px; cursor:pointer;
  transition:all 0.15s;
  background:rgba(0,229,255,0.06);
  border:1px solid rgba(0,229,255,0.2);
  color:var(--text-dim);
  display:flex; align-items:center; gap:4px;
}
.action-btn:hover { background:rgba(0,229,255,0.15); color:var(--cyan); border-color:rgba(0,229,255,0.4); }
.action-btn.travel:hover { background:rgba(0,255,157,0.15); color:var(--green); border-color:var(--green); }

.moon-list { max-height:0; overflow:hidden; transition:max-height 0.3s; }
.moon-list.show { max-height:600px; }
.moon-item {
  display:flex; align-items:center; gap:8px;
  padding:7px 12px 7px 28px;
  border-top:1px solid rgba(0,229,255,0.06);
}
.moon-name { flex:1; font-size:12px; color:var(--text-dim); }
.moon-name.current { color:var(--green); }

/* ── JOYSTICK ── */
#joystickContainer {
  position:absolute; bottom:22px; left:22px;
  width:110px; height:110px;
  pointer-events:all; display:none; z-index:12;
}
#joystickContainer.show { display:block; }
#joystickBase {
  width:100%; height:100%;
  background:rgba(0,229,255,0.07);
  border:1.5px solid rgba(0,229,255,0.3);
  border-radius:50%; position:relative;
  backdrop-filter:blur(8px);
}
#joystickStick {
  width:44px; height:44px;
  background:radial-gradient(circle at 40% 40%, rgba(0,229,255,0.9), rgba(0,180,200,0.6));
  border:1.5px solid var(--cyan);
  border-radius:50%; position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 16px var(--cyan-glow);
}

/* ── INFO MODAL ── */
#infoModal {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:rgba(2,12,26,0.97);
  border:1px solid rgba(0,229,255,0.3);
  padding:24px; width:90%; max-width:440px;
  display:none; pointer-events:all; z-index:1000;
  border-radius:16px;
  box-shadow:0 0 60px rgba(0,229,255,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
}
#infoModal.show { display:block; animation:modalIn 0.25s ease; }
@keyframes modalIn { from{opacity:0;transform:translate(-50%,-54%)} to{opacity:1;transform:translate(-50%,-50%)} }

#infoTitle {
  font-family:var(--font-mono); font-size:20px;
  color:var(--cyan); margin-bottom:14px;
  text-shadow:0 0 16px var(--cyan-glow);
  letter-spacing:0.04em;
}
#infoContent { font-size:13px; line-height:1.7; color:var(--text); margin-bottom:18px; }
#infoContent p { opacity:0.85; }
#closeInfo {
  width:100%; background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.3); color:var(--cyan);
  padding:10px; font-family:var(--font-ui); font-size:12px; font-weight:500;
  letter-spacing:0.1em; text-transform:uppercase;
  border-radius:8px; cursor:pointer; transition:all 0.2s;
}
#closeInfo:hover { background:var(--cyan); color:#000; box-shadow:0 0 20px var(--cyan-glow); }

/* ── TRAVEL PROGRESS BAR ── */
#travelBar {
  position:absolute; bottom:0; left:0; right:0;
  height:2px; background:var(--cyan);
  transform-origin:left; transform:scaleX(0);
  transition:transform 0.1s linear;
  z-index:20; opacity:0;
  box-shadow:0 0 8px var(--cyan);
}

/* ── RESPONSIVE ── */
@media (max-width:680px) {
  #hud-right { top:auto; bottom:120px; right:10px; min-width:160px; }
  #statusPanel { padding:10px 12px; }
  #controlsPanel { max-width:150px; }
  .btn { font-size:10px; padding:7px 8px; }
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="travelBar"></div>

<div id="ui">
  <div id="hud-left">
    <div class="glass" id="controlsPanel">
      <div class="ctrl-header" id="controlsHeader">
        <span>⚙ CONTROLES</span>
        <span class="ctrl-chevron">▼</span>
      </div>
      <div class="ctrl-body">
        <button class="btn" id="viewModeBtn"><span class="btn-icon">🌍</span>Modo Planeta</button>
        <button class="btn" id="timeScaleBtn"><span class="btn-icon">⏱</span>Tiempo: x1</button>
        <button class="btn" id="scaleBtn"><span class="btn-icon">🌌</span>Modo Simple</button>
        <button class="btn" id="topViewBtn"><span class="btn-icon">🛰</span>Vista Superior</button>
        <button class="btn" id="labelsBtn"><span class="btn-icon">🏷</span>Etiquetas: ON</button>
        <button class="btn" id="orbitsBtn"><span class="btn-icon">⭕</span>Órbitas: OFF</button>
        <div class="orbit-row">
          <button class="btn-zoom" id="orbitIn" title="Acercar">+</button>
          <button class="btn-zoom" id="orbitOut" title="Alejar">−</button>
        </div>
      </div>
    </div>
  </div>

  <div id="hud-right">
    <div class="glass" id="statusPanel">
      <div class="panel-title">Estado de Misión</div>
      <div class="status-grid">
        <span class="status-label">UBICACIÓN</span>
        <span class="status-value" id="currentLocation">Tierra</span>
        <div class="divider"></div>
        <span class="status-label">ESTADO</span>
        <span class="status-value" id="travelStatus">En órbita</span>
        <span class="status-label">TIEMPO</span>
        <span class="status-value" id="timeScale">× 1</span>
        <div class="divider"></div>
      </div>
      <div id="gameClock">00:00:00 — 01/01/2024</div>
      <div id="elapsedTime" style="margin-top:4px">T+ 0d 0h 0m</div>
    </div>
  </div>

  <div id="joystickContainer">
    <div id="joystickBase"><div id="joystickStick"></div></div>
  </div>

  <button id="togglePanelBtn">🌌 Navegación</button>

  <div id="navigationPanel">
    <div class="nav-title">Sistema Solar</div>
    <div id="planetList"></div>
  </div>

  <div id="infoModal">
    <h2 id="infoTitle"></h2>
    <div id="infoContent"></div>
    <button id="closeInfo">Cerrar</button>
  </div>
</div>

const PLANET_COLORS = Object.fromEntries(Object.entries(PLANET_INFO).map(([k,v])=>[k,v.color||'#00e5ff']));

const TIME_SCALE_FACTOR = 0.00035;

let state = {
  currentPlanet: 'earth',
  targetPlanet: null,
  traveling: false,
  travelStartTime: null,
  travelDuration: 0,
  travelOrigin: null,
  shipMode: false,
  timeScale: 1,
  realisticMode: false,
  cameraDistance: 100,
  minCameraDistance: 5,
  maxCameraDistance: 500,
  topView: false,
  showOrbits: false,
  simulatedTime: new Date('2024-01-01T12:00:00').getTime(),
  missionStart: Date.now(),
  showLabels: true
};

let SOLAR_SYSTEM = SOLAR_SYSTEM_SIMPLE;
let scene, camera, renderer;
let planets = {};
let spaceship = null;
let touchStartPos = null;
let lastTouchPos = null;
let cameraAngle = 0;
let cameraElevation = 30;
let shipVelocity = null;
let joystickActive = false;
let joystickDelta = { x:0, y:0 };
let orbitLines = [];
let pinchDistance = null;
let labelElements = {};
let lastFrameTime = performance.now();

function initThreeJS() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000000);
  camera.position.set(1600, 80, 80);
  camera.lookAt(1500, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const ambientLight = new THREE.AmbientLight(0x111133, 0.4);
  scene.add(ambientLight);

  shipVelocity = new THREE.Vector3(0, 0, 0);

  createStarfield();
  createSpaceship();
  createSolarSystem();

  window.addEventListener('resize', onWindowResize);

  const canvas = document.getElementById('gameCanvas');
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('click', onMouseClick);
  canvas.addEventListener('wheel', onWheel, { passive: false });

  document.getElementById('orbitIn').addEventListener('click', () => {
    state.cameraDistance = Math.max(state.minCameraDistance, state.cameraDistance - 20);
  });
  document.getElementById('orbitOut').addEventListener('click', () => {
    state.cameraDistance = Math.min(state.maxCameraDistance, state.cameraDistance + 20);
  });

  document.getElementById('viewModeBtn').addEventListener('click', toggleViewMode);
  document.getElementById('timeScaleBtn').addEventListener('click', cycleTimeScale);
  document.getElementById('scaleBtn').addEventListener('click', toggleScaleMode);
  document.getElementById('topViewBtn').addEventListener('click', toggleTopView);
  document.getElementById('labelsBtn').addEventListener('click', toggleLabels);
  document.getElementById('orbitsBtn').addEventListener('click', toggleOrbits);

  document.getElementById('controlsHeader').addEventListener('click', () => {
    document.getElementById('controlsPanel').classList.toggle('collapsed');
  });

  document.getElementById('togglePanelBtn').addEventListener('click', () => {
    const panel = document.getElementById('navigationPanel');
    const btn = document.getElementById('togglePanelBtn');
    panel.classList.toggle('show');
    btn.classList.toggle('open');
    btn.textContent = panel.classList.contains('show') ? '✕ Cerrar' : '🌌 Navegación';
  });

  document.getElementById('closeInfo').addEventListener('click', closeInfo);

  let isDragging = false;
  let lastMousePos = null;
  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMousePos = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!isDragging || !lastMousePos) return;
    const dx = e.clientX - lastMousePos.x;
    const dy = e.clientY - lastMousePos.y;
    cameraAngle -= dx * 0.008;
    cameraElevation = Math.max(-80, Math.min(80, cameraElevation + dy * 0.25));
    lastMousePos = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('mouseup', () => { isDragging = false; lastMousePos = null; });
  canvas.addEventListener('mouseleave', () => { isDragging = false; lastMousePos = null; });

  setupJoystick();
}

function setupJoystick() {
  const joystickBase = document.getElementById('joystickBase');
  const joystickStick = document.getElementById('joystickStick');
  let center = { x: 0, y: 0 };
  const maxDist = 33;

  joystickBase.addEventListener('touchstart', (e) => {
    if (!state.shipMode) return;
    e.preventDefault();
    joystickActive = true;
    const r = joystickBase.getBoundingClientRect();
    center = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }, { passive: false });

  joystickBase.addEventListener('touchmove', (e) => {
    if (!state.shipMode || !joystickActive) return;
    e.preventDefault();
    const t = e.touches[0];
    let dx = t.clientX - center.x;
    let dy = t.clientY - center.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
    joystickStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joystickDelta.x = dx / maxDist;
    joystickDelta.y = dy / maxDist;
  }, { passive: false });

  joystickBase.addEventListener('touchend', (e) => {
    e.preventDefault();
    joystickActive = false;
    joystickStick.style.transform = 'translate(-50%,-50%)';
    joystickDelta = { x: 0, y: 0 };
  }, { passive: false });
}

function toggleViewMode() {
  state.shipMode = !state.shipMode;
  const btn = document.getElementById('viewModeBtn');
  const joystick = document.getElementById('joystickContainer');
  if (state.shipMode) {
    btn.innerHTML = '<span class="btn-icon">🚀</span>Modo Nave';
    btn.classList.add('active');
    joystick.classList.add('show');
    shipVelocity.set(0, 0, 0);
  } else {
    btn.innerHTML = '<span class="btn-icon">🌍</span>Modo Planeta';
    btn.classList.remove('active');
    joystick.classList.remove('show');
    shipVelocity.set(0, 0, 0);
  }
}

function cycleTimeScale() {
  const scales = [1, 60, 3600, 86400];
  const labels = ['× 1', '× 60', '× 3.600', '× 86.400'];
  const idx = scales.indexOf(state.timeScale);
  const next = (idx + 1) % scales.length;
  state.timeScale = scales[next];
  document.getElementById('timeScaleBtn').innerHTML = `<span class="btn-icon">⏱</span>Tiempo: ${labels[next]}`;
  document.getElementById('timeScale').textContent = labels[next];
}

function toggleScaleMode() {
  state.realisticMode = !state.realisticMode;
  const btn = document.getElementById('scaleBtn');
  if (state.realisticMode) {
    btn.innerHTML = '<span class="btn-icon">🔬</span>Modo Realista';
    btn.classList.add('active');
    SOLAR_SYSTEM = SOLAR_SYSTEM_REALISTIC;
  } else {
    btn.innerHTML = '<span class="btn-icon">🌌</span>Modo Simple';
    btn.classList.remove('active');
    SOLAR_SYSTEM = SOLAR_SYSTEM_SIMPLE;
  }
  rebuildSolarSystem();
}

function toggleTopView() {
  state.topView = !state.topView;
  const btn = document.getElementById('topViewBtn');
  if (state.topView) {
    btn.innerHTML = '<span class="btn-icon">👁</span>Vista Normal';
    btn.classList.add('active');
  } else {
    btn.innerHTML = '<span class="btn-icon">🛰</span>Vista Superior';
    btn.classList.remove('active');
  }
}

function toggleLabels() {
  state.showLabels = !state.showLabels;
  const btn = document.getElementById('labelsBtn');
  btn.innerHTML = `<span class="btn-icon">🏷</span>Etiquetas: ${state.showLabels ? 'ON' : 'OFF'}`;
  if (state.showLabels) btn.classList.remove('active');
  else btn.classList.add('active');
  Object.values(labelElements).forEach(el => {
    if (el) el.style.display = state.showLabels ? 'block' : 'none';
  });
}

function toggleOrbits() {
  state.showOrbits = !state.showOrbits;
  const btn = document.getElementById('orbitsBtn');
  if (state.showOrbits) {
    btn.innerHTML = '<span class="btn-icon">⭕</span>Órbitas: ON';
    btn.classList.add('active');
    createOrbitLines();
  } else {
    btn.innerHTML = '<span class="btn-icon">⭕</span>Órbitas: OFF';
    btn.classList.remove('active');
    orbitLines.forEach(l => scene.remove(l));
    orbitLines = [];
  }
}

function rebuildSolarSystem() {
  Object.values(planets).forEach(p => {
    if (p.mesh) scene.remove(p.mesh);
    if (p.rings) scene.remove(p.rings);
  });
  orbitLines.forEach(l => scene.remove(l));
  orbitLines = [];
  Object.keys(labelElements).forEach(k => {
    if (labelElements[k]) { labelElements[k].remove(); }
  });
  labelElements = {};
  planets = {};
  createSolarSystem();
  if (state.showOrbits) createOrbitLines();
  updateUI();
}

function createOrbitLines() {
  orbitLines.forEach(l => scene.remove(l));
  orbitLines = [];
  Object.keys(SOLAR_SYSTEM).forEach(key => {
    const body = SOLAR_SYSTEM[key];
    if (body.distance > 0 && !body.parent) {
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * body.distance, 0, Math.sin(a) * body.distance));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.18 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      orbitLines.push(line);
    }
  });
}

function createStarfield() {
  const geo = new THREE.BufferGeometry();
  const count = 10000;
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count * 3; i += 3) {
    const r = 800000 + Math.random() * 200000;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i+2] = r * Math.cos(phi);
    const warm = Math.random();
    colors[i]   = 0.7 + warm * 0.3;
    colors[i+1] = 0.7 + warm * 0.2;
    colors[i+2] = 0.8 + (1 - warm) * 0.2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({ size: 80, vertexColors: true, transparent: true, opacity: 0.9 });
  scene.add(new THREE.Points(geo, mat));
}

function createSpaceship() {
  const group = new THREE.Group();
  const bodyGeo = new THREE.CylinderGeometry(0.5, 0.7, 3.5, 16);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8e8f0, metalness: 0.8, roughness: 0.2 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.rotation.z = Math.PI / 2;
  group.add(body);

  const noseGeo = new THREE.ConeGeometry(0.5, 1.2, 16);
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xd0d0e8, metalness: 0.7, roughness: 0.2 });
  const nose = new THREE.Mesh(noseGeo, noseMat);
  nose.position.x = 2.35; nose.rotation.z = -Math.PI / 2;
  group.add(nose);

  const wingGeo = new THREE.BoxGeometry(1.2, 0.1, 2.8);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xc0c0d0, metalness: 0.6, roughness: 0.3 });
  [-1.4, 1.4].forEach(z => {
    const w = new THREE.Mesh(wingGeo, wingMat);
    w.position.set(-0.3, 0, z);
    group.add(w);
  });

  const cockpitGeo = new THREE.SphereGeometry(0.6, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
  const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x6688ff, transparent: true, opacity: 0.65, metalness: 0.9, roughness: 0.05 });
  const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
  cockpit.position.x = 1.6; cockpit.rotation.z = -Math.PI / 2;
  group.add(cockpit);

  const engGeo = new THREE.CylinderGeometry(0.25, 0.35, 0.9, 12);
  const engMat = new THREE.MeshStandardMaterial({ color: 0x303040, metalness: 0.95 });
  [-1, 1].forEach(z => {
    const eng = new THREE.Mesh(engGeo, engMat);
    eng.position.set(-1.6, 0, z); eng.rotation.z = Math.PI / 2;
    group.add(eng);
    const light = new THREE.PointLight(0x00e5ff, 1.5, 15);
    light.position.set(-2, 0, z);
    group.add(light);
  });

  group.position.set(SOLAR_SYSTEM_SIMPLE.earth.distance, 5, 0);
  spaceship = group;
  scene.add(group);
}

function createLabel(name) {
  const el = document.createElement('div');
  el.className = 'body-label';
  el.textContent = PLANET_INFO[name]?.name || name;
  el.style.display = state.showLabels ? 'block' : 'none';
  document.body.appendChild(el);
  return el;
}

function updateLabels() {
  Object.keys(planets).forEach(key => {
    const planet = planets[key];
    if (!planet.mesh) return;
    if (!labelElements[key]) labelElements[key] = createLabel(key);
    const vec = planet.mesh.position.clone().project(camera);
    const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
    const y = (vec.y * -0.5 + 0.5) * window.innerHeight;
    const el = labelElements[key];
    if (vec.z < 1) {
      el.style.left = x + 'px';
      el.style.top = (y - 22) + 'px';
      const dist = camera.position.distanceTo(planet.mesh.position);
      const maxD = state.realisticMode ? 300000 : 25000;
      const op = Math.max(0, Math.min(1, 1 - dist / maxD));
      el.style.opacity = state.showLabels ? op : 0;
    } else {
      el.style.opacity = '0';
    }
  });
}

function createSolarSystem() {
  const sunData = SOLAR_SYSTEM.sun;
  const sunGeo = new THREE.SphereGeometry(sunData.size, 48, 48);
  const sunMat = new THREE.MeshBasicMaterial({ color: sunData.color });
  const sun = new THREE.Mesh(sunGeo, sunMat);
  sun.userData = { name: 'sun', type: 'star' };
  scene.add(sun);
  planets.sun = { mesh: sun, orbit: 0, angle: 0, speed: 0 };

  const sunLight = new THREE.PointLight(0xffffee, 3, 0);
  sunLight.position.set(0, 0, 0);
  scene.add(sunLight);

  const sunGlow = new THREE.PointLight(0xff8800, 1, sunData.size * 4);
  sunGlow.position.set(0, 0, 0);
  scene.add(sunGlow);

  Object.keys(SOLAR_SYSTEM).forEach(key => {
    if (key === 'sun') return;
    const body = SOLAR_SYSTEM[key];
    if (body.parent) createMoon(key, body);
    else createPlanet(key, body);
  });

  createAsteroidBelt();
  createSaturnRings();
}

function createPlanet(name, data) {
  const geo = new THREE.SphereGeometry(data.size, 32, 32);
  const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8, metalness: 0.1 });
  if (name === 'earth') {
    mat.color.setHex(0x2255cc);
    mat.roughness = 0.7;
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { name, type: 'planet' };
  scene.add(mesh);

  const speedFactor = (365 / data.orbitalPeriod) * TIME_SCALE_FACTOR;
  planets[name] = {
    mesh, orbit: data.distance,
    angle: Math.random() * Math.PI * 2,
    speed: speedFactor,
    rotationSpeed: TIME_SCALE_FACTOR * 8
  };
}

function createMoon(name, data) {
  const geo = new THREE.SphereGeometry(Math.max(data.size, 0.3), 16, 16);
  const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.9 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { name, type: 'moon' };
  scene.add(mesh);

  const speedFactor = (27.3 / data.orbitalPeriod) * TIME_SCALE_FACTOR;
  planets[name] = {
    mesh, orbit: data.distance,
    angle: Math.random() * Math.PI * 2,
    speed: speedFactor,
    parent: planets[data.parent],
    tidalLock: true
  };
}

function createAsteroidBelt() {
  const beltDist = state.realisticMode ? 350000 : 3500;
  const beltWidth = state.realisticMode ? 80000 : 800;
  for (let i = 0; i < 300; i++) {
    const size = (state.realisticMode ? 50 : 0.5) * (Math.random() * 1.5 + 0.3);
    const geo = new THREE.SphereGeometry(size, 6, 6);
    const mat = new THREE.MeshStandardMaterial({ color: 0x777788, roughness: 1 });
    const asteroid = new THREE.Mesh(geo, mat);
    const angle = Math.random() * Math.PI * 2;
    const radius = beltDist + (Math.random() - 0.5) * beltWidth;
    asteroid.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * (state.realisticMode ? 2000 : 60), Math.sin(angle) * radius);
    asteroid.userData = { name: 'asteroid', type: 'asteroid' };
    scene.add(asteroid);
  }
}

function createSaturnRings() {
  if (!planets.saturn) return;
  const s = SOLAR_SYSTEM.saturn.size;
  const rGeo = new THREE.RingGeometry(s * 1.4, s * 2.6, 80);
  const rMat = new THREE.MeshBasicMaterial({ color: 0xc9b380, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
  const rings = new THREE.Mesh(rGeo, rMat);
  rings.rotation.x = Math.PI / 2.2;
  planets.saturn.rings = rings;
  scene.add(rings);
}

function updatePlanets() {
  const now = performance.now();
  const rawDelta = Math.min(now - lastFrameTime, 50);
  lastFrameTime = now;
  const dt = rawDelta * state.timeScale;

  state.simulatedTime += dt;

  Object.keys(planets).forEach(key => {
    const planet = planets[key];
    if (!planet.mesh) return;

    if (planet.parent) {
      const pp = planet.parent.mesh.position;
      planet.angle += planet.speed * dt * 0.001;
      planet.mesh.position.set(
        pp.x + Math.cos(planet.angle) * planet.orbit,
        pp.y,
        pp.z + Math.sin(planet.angle) * planet.orbit
      );
      if (planet.tidalLock) planet.mesh.lookAt(pp);
    } else if (planet.orbit > 0) {
      planet.angle += planet.speed * dt * 0.001;
      planet.mesh.position.set(
        Math.cos(planet.angle) * planet.orbit, 0,
        Math.sin(planet.angle) * planet.orbit
      );
      if (planet.rotationSpeed) planet.mesh.rotation.y += planet.rotationSpeed * dt * 0.001;
      if (key === 'saturn' && planet.rings) planet.rings.position.copy(planet.mesh.position);
    }
  });

  updateSpaceship(dt);
  updateCamera();
  updateLabels();
}

function updateSpaceship(dt) {
  if (!spaceship) return;

  if (state.shipMode && (joystickDelta.x !== 0 || joystickDelta.y !== 0)) {
    const speed = 0.12;
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
    const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
    shipVelocity.add(dir.clone().multiplyScalar(-joystickDelta.y * speed));
    shipVelocity.add(right.multiplyScalar(joystickDelta.x * speed));
    shipVelocity.multiplyScalar(0.92);
    spaceship.position.add(shipVelocity);
    if (shipVelocity.length() > 0.01) {
      const td = shipVelocity.clone().normalize();
      spaceship.rotation.y = Math.atan2(td.z, td.x) - Math.PI / 2;
    }
  } else if (state.traveling && state.travelStartTime && state.travelDuration) {
    const elapsed = Date.now() - state.travelStartTime;
    const t = Math.min(1, elapsed / state.travelDuration);
    const origin = state.travelOrigin;
    const target = planets[state.targetPlanet].mesh;
    const dest = new THREE.Vector3(target.position.x, target.position.y + 5, target.position.z);
    spaceship.position.lerpVectors(origin, dest, easeInOut(t));
    const d = new THREE.Vector3().subVectors(dest, spaceship.position).normalize();
    spaceship.rotation.y = Math.atan2(d.z, d.x) - Math.PI / 2;
    spaceship.rotation.z = Math.sin(t * Math.PI * 4) * 0.04;

    const bar = document.getElementById('travelBar');
    bar.style.opacity = '1';
    bar.style.transform = `scaleX(${t})`;

    if (t >= 1) {
      state.traveling = false;
      state.travelStartTime = null;
      state.travelDuration = 0;
      state.travelOrigin = null;
      state.currentPlanet = state.targetPlanet;
      state.targetPlanet = null;
      bar.style.opacity = '0';
      bar.style.transform = 'scaleX(0)';
      updateUI();
    }
  } else {
    const pd = planets[state.currentPlanet];
    if (pd) {
      if (state.shipMode) {
        shipVelocity.multiplyScalar(0.98);
        spaceship.position.add(shipVelocity);
      } else {
        const orbitSpeed = 0.00004;
        const t = performance.now() * orbitSpeed;
        const radius = state.cameraDistance * 0.5 + pd.mesh.geometry.parameters.radius;
        spaceship.position.set(
          pd.mesh.position.x + Math.cos(t) * radius,
          pd.mesh.position.y + 3,
          pd.mesh.position.z + Math.sin(t) * radius
        );
        spaceship.rotation.y = Math.atan2(Math.cos(t), -Math.sin(t)) - Math.PI / 2;
      }
    }
    spaceship.rotation.z = 0;
  }
}

function easeInOut(x) {
  return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
}

function updateCamera() {
  if (!spaceship) return;

  if (state.topView) {
    const d = state.realisticMode ? 1500000 : 60000;
    camera.position.set(0, d, 0);
    camera.lookAt(0, 0, 0);
    return;
  }

  const targetPos = state.shipMode
    ? spaceship.position
    : (planets[state.currentPlanet]?.mesh.position || spaceship.position);

  if (!state.traveling && !state.shipMode) cameraAngle += 0.0002;

  const elevRad = (cameraElevation * Math.PI) / 180;
  const hDist = state.cameraDistance * Math.cos(elevRad);
  const vDist = state.cameraDistance * Math.sin(elevRad);

  camera.position.set(
    targetPos.x + Math.cos(cameraAngle) * hDist,
    targetPos.y + vDist,
    targetPos.z + Math.sin(cameraAngle) * hDist
  );
  camera.lookAt(targetPos);
}

function onTouchStart(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDistance = Math.sqrt(dx * dx + dy * dy);
  } else {
    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
    lastTouchPos = { ...touchStartPos };
  }
}

function onTouchMove(e) {
  e.preventDefault();
  if (e.touches.length === 2 && pinchDistance !== null) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const nd = Math.sqrt(dx * dx + dy * dy);
    const delta = pinchDistance - nd;
    state.cameraDistance = Math.max(state.minCameraDistance, Math.min(state.maxCameraDistance, state.cameraDistance + delta * 0.5));
    pinchDistance = nd;
  } else if (e.touches.length === 1 && lastTouchPos) {
    const dx = e.touches[0].clientX - lastTouchPos.x;
    const dy = e.touches[0].clientY - lastTouchPos.y;
    cameraAngle -= dx * 0.008;
    cameraElevation = Math.max(-80, Math.min(80, cameraElevation + dy * 0.25));
    lastTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  if (e.touches.length < 2) pinchDistance = null;
  if (touchStartPos && Date.now() - touchStartPos.time < 200) {
    const dx = Math.abs(e.changedTouches[0].clientX - touchStartPos.x);
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartPos.y);
    if (dx < 10 && dy < 10) onMouseClick(e.changedTouches[0]);
  }
  touchStartPos = null;
  lastTouchPos = null;
}

function onMouseClick(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const mouse = {
    x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
    y: -((e.clientY - rect.top) / rect.height) * 2 + 1
  };
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(scene.children);
  for (const hit of hits) {
    const t = hit.object.userData.type;
    if (t === 'planet' || t === 'moon' || t === 'star') {
      travelToPlanet(hit.object.userData.name);
      break;
    }
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onWheel(e) {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 18 : -18;
  state.cameraDistance = Math.max(state.minCameraDistance, Math.min(state.maxCameraDistance, state.cameraDistance + delta));
}

function travelToPlanet(planetName) {
  if (!planets[planetName]) return;
  if (state.traveling) return;
  if (planetName === state.currentPlanet && !state.traveling) {
    showInfo(planetName);
    return;
  }
  if (state.shipMode) toggleViewMode();

  const origin = spaceship.position.clone();
  const target = planets[planetName].mesh;
  const dist = origin.distanceTo(target.position);

  let dur = dist * 12;
  dur = Math.max(dur, 2500);
  dur = Math.min(dur, 28000);

  state.traveling = true;
  state.travelOrigin = origin;
  state.targetPlanet = planetName;
  state.travelStartTime = Date.now();
  state.travelDuration = dur;

  const panel = document.getElementById('navigationPanel');
  const btn = document.getElementById('togglePanelBtn');
  panel.classList.remove('show');
  btn.classList.remove('open');
  btn.textContent = '🌌 Navegación';

  updateUI();
}

function showInfo(bodyName) {
  const info = PLANET_INFO[bodyName];
  if (!info) return;
  document.getElementById('infoTitle').textContent = info.name;
  document.getElementById('infoContent').innerHTML = `<p>${info.info}</p>`;
  document.getElementById('infoModal').classList.add('show');
}

function closeInfo() {
  document.getElementById('infoModal').classList.remove('show');
}

function formatSimDate() {
  const d = new Date(state.simulatedTime);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} — ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}

function formatElapsed() {
  const ms = Date.now() - state.missionStart;
  const totalSec = Math.floor(ms / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  return `T+ ${d}d ${h}h ${m}m`;
}

function updateUI() {
  const locEl = document.getElementById('currentLocation');
  const statusEl = document.getElementById('travelStatus');
  locEl.textContent = PLANET_INFO[state.currentPlanet]?.name || state.currentPlanet;

  if (state.traveling) {
    const rem = Math.max(0, state.travelDuration - (Date.now() - state.travelStartTime));
    statusEl.textContent = `→ ${PLANET_INFO[state.targetPlanet]?.name} (${Math.ceil(rem / 1000)}s)`;
    statusEl.className = 'status-value traveling';
  } else if (state.shipMode) {
    statusEl.textContent = 'Vuelo libre';
    statusEl.className = 'status-value ship';
  } else {
    statusEl.textContent = 'En órbita';
    statusEl.className = 'status-value';
  }

  document.getElementById('gameClock').textContent = formatSimDate();
  document.getElementById('elapsedTime').textContent = formatElapsed();

  renderPlanetList();
}

function renderPlanetList() {
  const list = document.getElementById('planetList');
  list.innerHTML = '';
  const mainPlanets = ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune'];

  mainPlanets.forEach(pk => {
    const pData = SOLAR_SYSTEM[pk];
    const pInfo = PLANET_INFO[pk];
    const isCurrent = state.currentPlanet === pk;

    const group = document.createElement('div');
    group.className = 'planet-group';

    const header = document.createElement('div');
    header.className = 'planet-header';

    const dot = document.createElement('div');
    dot.className = 'planet-dot';
    dot.style.background = pInfo.color || '#fff';
    dot.style.color = pInfo.color || '#fff';

    const name = document.createElement('div');
    name.className = 'planet-name' + (isCurrent ? ' current' : '');
    name.textContent = pInfo.name;

    const travelBtn = document.createElement('button');
    travelBtn.className = 'action-btn travel';
    travelBtn.innerHTML = '🚀';
    travelBtn.title = 'Viajar';
    travelBtn.onclick = () => travelToPlanet(pk);

    const infoBtn = document.createElement('button');
    infoBtn.className = 'action-btn';
    infoBtn.innerHTML = 'ℹ';
    infoBtn.title = 'Info';
    infoBtn.onclick = () => showInfo(pk);

    header.appendChild(dot);
    header.appendChild(name);
    header.appendChild(travelBtn);
    header.appendChild(infoBtn);

    if (pData.moons && pData.moons.length > 0) {
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'action-btn';
      toggleBtn.innerHTML = `🌙 ${pData.moons.length}`;
      toggleBtn.title = 'Lunas';
      toggleBtn.onclick = (e) => {
        e.stopPropagation();
        const ml = group.querySelector('.moon-list');
        ml.classList.toggle('show');
        toggleBtn.classList.toggle('active');
      };
      header.appendChild(toggleBtn);

      const moonList = document.createElement('div');
      moonList.className = 'moon-list';

      pData.moons.forEach(mk => {
        const mInfo = PLANET_INFO[mk];
        const isMC = state.currentPlanet === mk;
        const mi = document.createElement('div');
        mi.className = 'moon-item';

        const mn = document.createElement('div');
        mn.className = 'moon-name' + (isMC ? ' current' : '');
        mn.textContent = '↳ ' + mInfo.name;

        const mt = document.createElement('button');
        mt.className = 'action-btn travel';
        mt.innerHTML = '🚀'; mt.title = 'Viajar';
        mt.onclick = () => travelToPlanet(mk);

        const mib = document.createElement('button');
        mib.className = 'action-btn';
        mib.innerHTML = 'ℹ'; mib.title = 'Info';
        mib.onclick = () => showInfo(mk);

        mi.appendChild(mn); mi.appendChild(mt); mi.appendChild(mib);
        moonList.appendChild(mi);
      });

      group.appendChild(header);
      group.appendChild(moonList);
    } else {
      group.appendChild(header);
    }

    list.appendChild(group);
  });
}

function animate() {
  requestAnimationFrame(animate);
  updatePlanets();
  renderer.render(scene, camera);
}

window.addEventListener('load', () => {
  initThreeJS();
  updateUI();
  animate();
  setInterval(updateUI, 150);
});
</script>
</body>
</html>
