<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de Armas Medievales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .weapon-image {
            width: 100%;
            max-width: 500px;
            height: 350px;
            object-fit: cover;
            margin: 0 auto 30px;
            display: block;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .input-section {
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1a1a2e;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hints-section {
            margin-top: 30px;
        }

        .hint {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #ffd700;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease;
        }

        .hint.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .hint.locked {
            background: rgba(255, 255, 255, 0.02);
            border-left-color: #555;
            color: #666;
        }

        .hint-label {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .message.show {
            opacity: 1;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.2);
            border: 2px solid rgba(255, 68, 68, 0.5);
            color: #ff6b6b;
        }

        .message.success {
            background: rgba(51, 217, 178, 0.2);
            border: 2px solid rgba(51, 217, 178, 0.5);
            color: #33d9b2;
        }

        .attempts {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        .info-section {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .info-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        .info-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 12px;
            text-align: center;
        }

        .info-text {
            line-height: 1.6;
            color: #e0e0e0;
            text-align: justify;
        }

        .new-game-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            margin-top: 15px;
        }

        .new-game-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2rem;
            }

            .weapon-image {
                height: 250px;
            }

            input[type="text"], button {
                font-size: 1rem;
                padding: 12px 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .weapon-image {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Arma Medieval del Día ⚔️</h1>
        <p class="subtitle">¿Puedes adivinar qué arma es?</p>

        <img id="weaponImage" class="weapon-image" src="" alt="Arma medieval">

        <div class="input-section">
            <input type="text" id="guessInput" placeholder="Escribe el nombre del arma...">
            <button onclick="checkGuess()" id="checkBtn">Verificar</button>
            <button onclick="newGame()" id="newGameBtn" class="new-game-btn" style="display: none;">Nueva Arma</button>
        </div>

        <div id="message" class="message"></div>
        <div class="attempts" id="attempts">Intentos: 0/3</div>

        <div class="hints-section">
            <div class="hint locked" id="hint1">
                <div class="hint-label">🔒 Pista 1</div>
                <div id="hint1Text">???</div>
            </div>
            <div class="hint locked" id="hint2">
                <div class="hint-label">🔒 Pista 2</div>
                <div id="hint2Text">???</div>
            </div>
            <div class="hint locked" id="hint3">
                <div class="hint-label">🔒 Pista 3</div>
                <div id="hint3Text">???</div>
            </div>
        </div>

        <div id="infoSection" class="info-section">
            <div class="info-title" id="infoTitle"></div>
            <div class="info-text" id="infoText"></div>
        </div>
    </div>

    <script>
        const weapons = [
            {
                name: "Tulwar",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Indian_tulwar.jpg/800px-Indian_tulwar.jpg",
                alternatives: ["talwar", "tulwaar"],
                hints: [
                    "Este arma es un sable de la India o Hindustán muy conocido y apreciado por coleccionistas",
                    "Su característica empuñadura en forma de disco protege la mano del guerrero y su hoja es curva",
                    "Empieza por... Tu----"
                ],
                info: "El Tulwar era el arma principal de la caballería mogol y sikh. Su empuñadura en forma de disco no solo protegía la mano, sino que también permitía golpes contundentes. Los mejores ejemplares se forjaban en Damasco y se decoraban con inscripciones coránicas en oro. Curiosamente, algunos tulwares tenían hojas europeas reaprovechadas y reforjadas al estilo indio."
            },
            {
                name: "Zweihänder",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Zweihaender_1.jpg/400px-Zweihaender_1.jpg",
                alternatives: ["zweihander", "montante", "espadon"],
                hints: [
                    "Espada de dos manos alemana usada por mercenarios lansquenetes en los siglos XV y XVI",
                    "Puede medir entre 1.4 y 2 metros de longitud total y pesar hasta 3.5 kg",
                    "Empieza por... Zw------"
                ],
                info: "Los maestros del Zweihänder recibían doble paga que un soldado común, de ahí el término 'Doppelsöldner' (soldado de doble paga). Estos guerreros especializados podían romper las formaciones de picas enemigas girando sus enormes espadas como molinos. Paradójicamente, pese a su tamaño, muchos zweihänders tenían partes de la hoja sin filo cerca de la guarda para permitir técnicas de media espada."
            },
            {
                name: "Falcata",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Falcata_de_Almedinilla.jpg/600px-Falcata_de_Almedinilla.jpg",
                alternatives: ["espada ibérica", "falcata ibérica"],
                hints: [
                    "Espada de hoja curva característica de la península ibérica usada por pueblos íberos y celtíberos",
                    "Su filo interior curvo la hacía devastadora en cortes descendentes y su punta perforante",
                    "Acaba por... ---ata"
                ],
                info: "Los romanos quedaron tan impresionados por la eficacia de la falcata que Polibio escribió que podía cortar cualquier cosa, incluso escudos y cascos. Los herreros íberos desarrollaron una técnica única de temple diferencial que hacía que el filo fuera durísimo mientras el lomo permanecía flexible. Aníbal equipó a sus tropas ibéricas con falcatas durante las Guerras Púnicas, y se dice que una sola falcata podía valer tanto como varios esclavos."
            },
            {
                name: "Katana",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Katana.jpg/800px-Katana.jpg",
                alternatives: ["katana japonesa", "sable samurái"],
                hints: [
                    "El arma más emblemática de los samuráis japoneses, forjada con técnicas ancestrales",
                    "Su curvatura distintiva se llama 'sori' y su filo es legendariamente afilado",
                    "Empieza por... Ka----"
                ],
                info: "Una katana auténtica puede tardar hasta 6 meses en forjarse y requiere plegar el acero hasta 16 veces, creando 65,536 capas. Los samuráis creían que el alma del herrero quedaba atrapada en la espada, por eso muchas katanas tienen nombres propios. La prueba definitiva de una katana era el 'tameshigiri': cortar cuerpos de criminales ejecutados de un solo tajo. Las mejores podían cortar hasta 7 cuerpos apilados."
            },
            {
                name: "Claymore",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Museum_of_Scotland_Claymore.jpg/400px-Museum_of_Scotland_Claymore.jpg",
                alternatives: ["espada escocesa", "claymore escocés"],
                hints: [
                    "La gran espada de dos manos de los highlanders escoceses, terror de los ejércitos ingleses",
                    "Su nombre significa 'gran espada' en gaélico escocés (claidheamh-mòr)",
                    "Empieza por... Cla------"
                ],
                info: "Los claymores escoceses podían medir hasta 1.8 metros y pesaban entre 2 y 3 kg. Los highlanders los usaban descalzos para tener mejor agarre en el terreno montañoso. Durante la batalla de Culloden en 1746, muchos jacobitas cargaron con claymores contra los mosquetes ingleses en un último acto de valentía. Curiosamente, el famoso grito de guerra 'Claymore!' no se refería a la espada, sino que significaba '¡A por ellos!' en gaélico."
            },
            {
                name: "Scimitar",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Scimitar.jpg/600px-Scimitar.jpg",
                alternatives: ["cimitarra", "shamshir", "sable curvo"],
                hints: [
                    "Sable curvo de origen persa y árabe, símbolo de poder en el mundo islámico",
                    "Su curvatura permite cortes devastadores desde la montura de un caballo",
                    "Empieza por... Sc------"
                ],
                info: "El scimitar perfecto tiene una curvatura matemáticamente calculada para maximizar la velocidad del corte. Los herreros persas creían que la luna creciente era la forma perfecta para una hoja, por eso muchos scimitares imitan esa curvatura. Saladino empuñaba un famoso scimitar llamado 'Al-Battar' que según la leyenda podía cortar una pluma que cayera sobre su filo. Los jenízaros otomanos preferían scimitares tan curvos que parecían medias lunas."
            },
            {
                name: "Kriegsmesser",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Kriegsmesser_-_Germanisches_Nationalmuseum.jpg/400px-Kriegsmesser_-_Germanisches_Nationalmuseum.jpg",
                alternatives: ["cuchillo de guerra", "messerschmidt"],
                hints: [
                    "Literalmente 'cuchillo de guerra' en alemán, un arma de gran tamaño que técnicamente no era una espada para evitar regulaciones gremiales",
                    "Popular entre los lansquenetes alemanes, tenía una hoja curva y podía usarse con una o dos manos",
                    "Empieza por... Kri----------"
                ],
                info: "El Kriegsmesser nació de una laguna legal: los gremios de espaderos tenían el monopolio de las espadas, pero no de los 'cuchillos'. Así que los herreros crearon estos enormes 'cuchillos' que rivalizaban con cualquier espada. Los lansquenetes los preferían porque su diseño asimétrico los hacía impredecibles en combate. Algunos kriegsmessers tenían ganchos en el lomo para desarmar al enemigo o romper cotas de malla."
            },
            {
                name: "Kopis",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Greek_kopis_sword.jpg/600px-Greek_kopis_sword.jpg",
                alternatives: ["kopis griego", "machaira"],
                hints: [
                    "Espada curva de un solo filo usada en la antigua Grecia, similar a un machete pesado",
                    "Su peso hacia la punta hacía que cada golpe tuviera una fuerza contundente tremenda",
                    "Empieza por... Ko---"
                ],
                info: "El kopis era tan efectivo que Jenofonte lo describió como 'superior a la espada recta para cortar'. Los hoplitas macedonios de Alejandro Magno llevaban kopis como arma secundaria. Su diseño influyó en la creación del gladius romano tras los encuentros con mercenarios griegos. Curiosamente, muchos kopis tenían mangos de hueso tallado con escenas de la Ilíada, convirtiendo cada arma en una obra de arte narrativa."
            },
            {
                name: "Dao",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Chinese_dao_sword.jpg/600px-Chinese_dao_sword.jpg",
                alternatives: ["sable chino", "dao chino"],
                hints: [
                    "El sable tradicional chino, conocido como 'el general de las armas' en las artes marciales",
                    "Su hoja ancha y ligeramente curva está diseñada para cortes poderosos",
                    "Solo tiene... 3 letras"
                ],
                info: "En China, el dao se conoce como 'el general de todas las armas' porque combina fuerza y técnica. Los mejores daos se forjaban doblando el acero hasta 32 veces, creando patrones ondulados llamados 'hada'. Durante la Dinastía Tang, existían daos ceremoniales tan elaborados que sus vainas estaban incrustadas con jade y perlas. Los monjes Shaolin desarrollaron 18 técnicas únicas de dao que imitaban los movimientos de animales."
            },
            {
                name: "Khopesh",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Egyptian_khopesh_sword.jpg/500px-Egyptian_khopesh_sword.jpg",
                alternatives: ["espada egipcia", "hoz de guerra"],
                hints: [
                    "La espada-hoz del antiguo Egipto, símbolo de poder faraónico durante milenios",
                    "Su forma única combinaba las funciones de espada, hacha y gancho desarme",
                    "Empieza por... Kh-----"
                ],
                info: "El khopesh era tan sagrado que los faraones eran enterrados con ejemplares de oro macizo. Tutankamón tenía dos khopesh en su tumba, uno de hierro meteórico que los egipcios llamaban 'metal del cielo'. Su diseño en forma de hoz permitía enganchar escudos enemigos y desarmar oponentes. Los mejores guerreros egipcios, los 'Medjay', podían usar el khopesh para degollar un enemigo con un solo movimiento circular."
            },
            {
                name: "Gladius",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Uncrossed_gladius.jpg/500px-Uncrossed_gladius.jpg",
                alternatives: ["gladius hispaniensis", "gladio romano"],
                hints: [
                    "La espada corta que conquistó el mundo conocido en manos de los legionarios romanos",
                    "Adoptada tras ver su eficacia en manos de guerreros celtíberos hispanos",
                    "Empieza por... Gla----"
                ],
                info: "El gladius se adoptó tras la conquista de Hispania, donde los romanos quedaron impresionados por la calidad del acero ibérico. Un legionario entrenado podía realizar hasta 120 estocadas por minuto con su gladius. La técnica romana consistía en un golpe corto y letal dirigido al abdomen, aprovechando los huecos entre las costillas del enemigo. Julio César equipó a toda la Legio X con gladius de acero hispano, convirtiéndola en su unidad más letal."
            },
            {
                name: "Rapier",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Rapier_sword.jpg/400px-Rapier_sword.jpg",
                alternatives: ["estoque", "espada ropera"],
                hints: [
                    "La elegante espada de estocada de los nobles europeos del Renacimiento",
                    "Diseñada para duelos de honor, privilegia la velocidad y precisión sobre la fuerza",
                    "Empieza por... Ra----"
                ],
                info: "El rapier revolucionó la esgrima europea al introducir el concepto de 'tiempo' en el combate: la velocidad era más importante que la fuerza. Los maestros españoles desarrollaron la 'Destreza', un sistema matemático de esgrima que trataba cada movimiento como una ecuación geométrica. Un maestro de rapier podía realizar una estocada letal en menos de 0.3 segundos. Curiosamente, muchos rapiers tenían hojas tan flexibles que podían doblarse en un círculo completo sin romperse."
            }
        ];

        let currentWeapon;
        let attempts = 0;
        const maxAttempts = 3;
        let gameWon = false;
        let usedWeapons = [];

        function getDayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        function getRandomWeapon() {
            if (usedWeapons.length === weapons.length) {
                usedWeapons = []; // Reiniciar cuando se hayan usado todas
            }
            
            let availableWeapons = weapons.filter((_, index) => !usedWeapons.includes(index));
            let randomIndex = Math.floor(Math.random() * availableWeapons.length);
            let selectedWeapon = availableWeapons[randomIndex];
            let originalIndex = weapons.indexOf(selectedWeapon);
            
            usedWeapons.push(originalIndex);
            return selectedWeapon;
        }

        function initGame() {
            // Para el primer juego, usar el arma del día
            if (usedWeapons.length === 0) {
                const dayIndex = getDayOfYear() % weapons.length;
                currentWeapon = weapons[dayIndex];
                usedWeapons.push(dayIndex);
            } else {
                currentWeapon = getRandomWeapon();
            }
            
            document.getElementById('weaponImage').src = currentWeapon.image;
            document.getElementById('hint1Text').textContent = currentWeapon.hints[0];
            document.getElementById('hint2Text').textContent = currentWeapon.hints[1];
            document.getElementById('hint3Text').textContent = currentWeapon.hints[2];
            
            attempts = 0;
            gameWon = false;
            updateAttempts();
            
            // Resetear interfaz
            document.getElementById('guessInput').disabled = false;
            document.getElementById('guessInput').value = '';
            document.getElementById('checkBtn').style.display = 'block';
            document.getElementById('newGameBtn').style.display = 'none';
            document.getElementById('infoSection').classList.remove('show');
            document.getElementById('message').classList.remove('show');
            
            // Resetear pistas
            ['hint1', 'hint2', 'hint3'].forEach(id => {
                const hint = document.getElementById(id);
                hint.classList.add('locked');
                hint.classList.remove('visible');
            });
        }

        function normalizeString(str) {
            return str.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim();
        }

        function checkGuess() {
            if (gameWon) return;

            const guess = document.getElementById('guessInput').value;
            const normalized = normalizeString(guess);
            const validAnswers = [currentWeapon.name, ...currentWeapon.alternatives].map(normalizeString);

            if (validAnswers.includes(normalized)) {
                showMessage(`¡Correcto! Es un ${currentWeapon.name} 🎉`, 'success');
                gameWon = true;
                document.getElementById('guessInput').disabled = true;
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('newGameBtn').style.display = 'block';
                showInfo();
                return;
            }

            attempts++;
            updateAttempts();
            showMessage('Incorrecto, sigue intentando...', 'error');

            if (attempts === 1) {
                unlockHint('hint1');
            } else if (attempts === 2) {
                unlockHint('hint2');
            } else if (attempts >= 3) {
                unlockHint('hint3');
                showMessage(`¡Se acabaron los intentos! Era un ${currentWeapon.name} 😔`, 'error');
                document.getElementById('guessInput').disabled = true;
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('newGameBtn').style.display = 'block';
                setTimeout(() => showInfo(), 1000);
            }

            document.getElementById('guessInput').value = '';
        }

        function unlockHint(hintId) {
            const hint = document.getElementById(hintId);
            hint.classList.remove('locked');
            setTimeout(() => {
                hint.classList.add('visible');
            }, 100);
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => {
                msg.classList.add('show');
            }, 10);
        }

        function showInfo() {
            const infoSection = document.getElementById('infoSection');
            const infoTitle = document.getElementById('infoTitle');
            const infoText = document.getElementById('infoText');
            
            infoTitle.textContent = `Sobre el ${currentWeapon.name}`;
            infoText.textContent = currentWeapon.info;
            
            setTimeout(() => {
                infoSection.classList.add('show');
            }, 500);
        }

        function updateAttempts() {
            document.getElementById('attempts').textContent = `Intentos: ${attempts}/${maxAttempts}`;
        }

        function newGame() {
            initGame();
        }

        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });

        initGame();
    </script>
</body>
</html>
