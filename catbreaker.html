<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>🐱 CatBreaker 🐱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            display: block;
            background: #000;
            box-shadow: 0 0 50px rgba(147, 51, 234, 0.5),
                        inset 0 0 100px rgba(147, 51, 234, 0.1);
            margin: 0 auto;
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(147, 51, 234, 0.8);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        #score, #level, #lives {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid #9333ea;
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.6);
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 100;
            background: rgba(10, 10, 20, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #9333ea;
            box-shadow: 0 0 50px rgba(147, 51, 234, 0.8);
            max-width: 90%;
        }

        #menu h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #9333ea;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #9333ea, 0 0 40px #9333ea; }
            50% { text-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff; }
        }

        button {
            background: linear-gradient(135deg, #9333ea, #ff00ff);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 30px;
            margin: 10px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.6);
            transition: all 0.3s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.9);
        }

        #powerups {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            pointer-events: none;
        }

        .powerup-icon {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 50%;
            border: 2px solid #9333ea;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.6);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .hidden {
            display: none !important;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            color: #fff;
            text-shadow: 0 0 20px #ff00ff;
            z-index: 50;
            animation: fadeInOut 2s;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="score">🎯 <span id="scoreVal">0</span></div>
        <div id="level">🎮 Nv <span id="levelVal">1</span></div>
        <div id="lives">❤️ <span id="livesVal">3</span></div>
    </div>

    <div id="powerups"></div>

    <div id="menu">
        <h1>🐱 CAT RESCUE 🐱</h1>
        <p style="margin: 20px 0; font-size: 16px;">¡Salva a los gatos prisioneros!</p>
        <button id="startBtn">INICIAR JUEGO</button>
        <p style="margin-top: 20px; font-size: 12px; color: #aaa;">
            Toca para mover la paleta<br>
            🔥 Poderes especiales incluidos
        </p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const startBtn = document.getElementById('startBtn');

        // Configuración responsive
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth, 500);
            const maxHeight = window.innerHeight;
            canvas.width = maxWidth;
            canvas.height = maxHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Variables del juego
        let score = 0;
        let level = 1;
        let lives = 3;
        let gameRunning = false;
        let animationId;

        // Paleta
        const paddle = {
            width: 100,
            height: 15,
            x: 0,
            y: 0,
            targetX: 0,
            speed: 0,
            color: '#9333ea'
        };

        // Bolas
        let balls = [];
        const ballRadius = 10;

        // Bloques
        let blocks = [];
        const blockColors = ['#ff00ff', '#9333ea', '#00ffff', '#ff1493', '#00ff00', '#ffff00'];

        // Partículas
        let particles = [];

        // Poderes activos
        let activePowers = {
            multiBall: 0,
            laser: 0,
            widePaddle: 0,
            slowBall: 0
        };

        // Poderes cayendo
        let fallingPowers = [];

        // Láseres
        let lasers = [];

        // Gato prisionero
        let prisonerCat = null;

        // Input táctil y mouse
        let touchActive = false;

        function handleInput(x) {
            paddle.targetX = x - paddle.width / 2;
        }

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            handleInput(touch.clientX - rect.left);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchActive = true;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            handleInput(touch.clientX - rect.left);
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            handleInput(e.clientX - rect.left);
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            handleInput(e.clientX - rect.left);
        });

        // Inicializar posición paleta
        function initPaddle() {
            paddle.x = canvas.width / 2 - paddle.width / 2;
            paddle.y = canvas.height - 40;
            paddle.targetX = paddle.x;
        }

        // Inicializar bola
        function createBall(x, y, dx, dy) {
            return {
                x: x !== undefined ? x : canvas.width / 2,
                y: y !== undefined ? y : canvas.height - 60,
                dx: dx !== undefined ? dx : (Math.random() - 0.5) * 4,
                dy: dy !== undefined ? dy : -4,
                radius: ballRadius,
                trail: []
            };
        }

        // Crear nivel
        function createLevel() {
            blocks = [];
            const rows = Math.min(5 + Math.floor(level / 2), 8);
            const cols = Math.min(5 + Math.floor(level / 3), 7);
            const blockWidth = (canvas.width - 20) / cols;
            const blockHeight = 20;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (Math.random() > 0.1) {
                        const hasMultiHit = Math.random() < 0.15 + level * 0.02;
                        blocks.push({
                            x: col * blockWidth + 10,
                            y: row * blockHeight + 80,
                            width: blockWidth - 3,
                            height: blockHeight - 3,
                            color: blockColors[Math.floor(Math.random() * blockColors.length)],
                            hits: hasMultiHit ? 2 : 1,
                            maxHits: hasMultiHit ? 2 : 1,
                            hasPower: Math.random() < 0.12
                        });
                    }
                }
            }
        }

        // Dibujar paleta
        function drawPaddle() {
            ctx.shadowBlur = 20;
            ctx.shadowColor = paddle.color;
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0;
        }

        // Dibujar bola (emoji gato)
        function drawBall(ball) {
            // Estela
            ball.trail.push({x: ball.x, y: ball.y});
            if (ball.trail.length > 8) ball.trail.shift();
            
            ctx.globalAlpha = 0.3;
            ball.trail.forEach((pos, i) => {
                const size = (i / ball.trail.length) * ball.radius * 2;
                ctx.font = `${size}px Arial`;
                ctx.fillText('🐱', pos.x - size / 2, pos.y + size / 2);
            });
            ctx.globalAlpha = 1;

            // Bola principal
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff00ff';
            ctx.font = `${ball.radius * 2}px Arial`;
            ctx.fillText('🐱', ball.x - ball.radius, ball.y + ball.radius);
            ctx.shadowBlur = 0;
        }

        // Dibujar bloques
        function drawBlocks() {
            blocks.forEach(block => {
                const alpha = 0.5 + (block.hits / block.maxHits) * 0.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = block.color;
                ctx.fillStyle = block.color;
                ctx.globalAlpha = alpha;
                ctx.fillRect(block.x, block.y, block.width, block.height);
                
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(block.x, block.y, block.width, block.height);
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                if (block.hasPower) {
                    ctx.font = '14px Arial';
                    ctx.fillText('⭐', block.x + block.width / 2 - 7, block.y + block.height / 2 + 5);
                }
            });
        }

        // Crear partículas
        function createParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    color: color,
                    life: 1,
                    size: Math.random() * 3 + 2
                });
            }
        }

        // Dibujar partículas
        function drawParticles() {
            particles = particles.filter(p => {
                p.x += p.dx;
                p.y += p.dy;
                p.life -= 0.025;
                p.dy += 0.2;

                if (p.life <= 0) return false;

                ctx.globalAlpha = p.life;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.shadowBlur = 0;
                
                return true;
            });
            ctx.globalAlpha = 1;
        }

        // Soltar poder
        function dropPower(x, y) {
            const powerTypes = ['multiBall', 'laser', 'widePaddle', 'slowBall'];
            const powerIcons = ['🐱🐱', '⚡', '📏', '🐌'];
            const type = powerTypes[Math.floor(Math.random() * powerTypes.length)];
            const icon = powerIcons[powerTypes.indexOf(type)];
            
            fallingPowers.push({
                x: x,
                y: y,
                type: type,
                icon: icon,
                dy: 2.5
            });
        }

        // Actualizar poderes cayendo
        function updateFallingPowers() {
            fallingPowers = fallingPowers.filter(power => {
                power.y += power.dy;

                ctx.font = '20px Arial';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffff00';
                ctx.fillText(power.icon, power.x - 10, power.y + 10);
                ctx.shadowBlur = 0;

                if (power.y > paddle.y && power.y < paddle.y + paddle.height &&
                    power.x > paddle.x && power.x < paddle.x + paddle.width) {
                    activatePower(power.type);
                    createParticles(power.x, power.y, '#ffff00', 15);
                    return false;
                }

                return power.y <= canvas.height;
            });
        }

        // Activar poder
        function activatePower(type) {
            activePowers[type] = 300;
            
            if (type === 'multiBall') {
                const currentBalls = [...balls];
                currentBalls.forEach(ball => {
                    balls.push(createBall(ball.x, ball.y, ball.dx * 1.2, ball.dy));
                    balls.push(createBall(ball.x, ball.y, ball.dx * -1.2, ball.dy));
                });
            } else if (type === 'widePaddle') {
                paddle.width = 150;
            } else if (type === 'slowBall') {
                balls.forEach(ball => {
                    ball.dx *= 0.6;
                    ball.dy *= 0.6;
                });
            }
            
            updatePowerupUI();
        }

        // Actualizar UI de poderes
        function updatePowerupUI() {
            const container = document.getElementById('powerups');
            container.innerHTML = '';
            
            const icons = {multiBall: '🐱🐱', laser: '⚡', widePaddle: '📏', slowBall: '🐌'};
            
            for (let power in activePowers) {
                if (activePowers[power] > 0) {
                    const div = document.createElement('div');
                    div.className = 'powerup-icon';
                    div.textContent = icons[power];
                    container.appendChild(div);
                }
            }
        }

        // Actualizar poderes activos
        function updateActivePowers() {
            for (let power in activePowers) {
                if (activePowers[power] > 0) {
                    activePowers[power]--;
                    
                    if (activePowers[power] === 0) {
                        if (power === 'widePaddle') {
                            paddle.width = 100;
                        } else if (power === 'slowBall') {
                            balls.forEach(ball => {
                                ball.dx *= 1.67;
                                ball.dy *= 1.67;
                            });
                        }
                        updatePowerupUI();
                    }
                }
            }

            if (activePowers.laser > 0 && Math.random() < 0.08) {
                lasers.push({
                    x: paddle.x + paddle.width / 2,
                    y: paddle.y,
                    width: 3,
                    height: 15,
                    dy: -8
                });
            }
        }

        // Actualizar láseres
        function updateLasers() {
            lasers = lasers.filter(laser => {
                laser.y += laser.dy;

                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(laser.x - laser.width / 2, laser.y, laser.width, laser.height);
                ctx.shadowBlur = 0;

                let hit = false;
                blocks = blocks.filter(block => {
                    if (laser.x > block.x && laser.x < block.x + block.width &&
                        laser.y > block.y && laser.y < block.y + block.height) {
                        createParticles(block.x + block.width / 2, block.y + block.height / 2, block.color);
                        score += 10 * level;
                        document.getElementById('scoreVal').textContent = score;
                        hit = true;
                        return false;
                    }
                    return true;
                });

                if (hit) return false;
                return laser.y > 0;
            });
        }

        // Mostrar gato prisionero
        function showPrisonerCat() {
            if (!prisonerCat && blocks.length < 8 && blocks.length > 0) {
                prisonerCat = {
                    x: canvas.width / 2,
                    y: 120,
                    rescued: false
                };
            }

            if (prisonerCat && !prisonerCat.rescued) {
                ctx.font = '40px Arial';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff00ff';
                ctx.fillText('😿', prisonerCat.x - 20, prisonerCat.y + 20);
                ctx.shadowBlur = 0;

                if (Math.floor(Date.now() / 400) % 2 === 0) {
                    ctx.font = '12px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 5;
                    ctx.fillText('¡AYUDA!', prisonerCat.x - 24, prisonerCat.y - 25);
                    ctx.shadowBlur = 0;
                }
            }
        }

        // Colisiones
        function checkCollisions() {
            balls = balls.filter((ball, ballIndex) => {
                // Paredes
                if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                    ball.dx = -ball.dx;
                    ball.x = Math.max(ball.radius, Math.min(canvas.width - ball.radius, ball.x));
                    createParticles(ball.x, ball.y, '#00ffff', 8);
                }
                if (ball.y - ball.radius < 0) {
                    ball.dy = -ball.dy;
                    ball.y = ball.radius;
                    createParticles(ball.x, ball.y, '#00ffff', 8);
                }

                // Paleta
                if (ball.dy > 0 && 
                    ball.y + ball.radius > paddle.y &&
                    ball.y - ball.radius < paddle.y + paddle.height &&
                    ball.x > paddle.x && 
                    ball.x < paddle.x + paddle.width) {
                    
                    const hitPos = (ball.x - paddle.x) / paddle.width;
                    const angle = (hitPos - 0.5) * Math.PI * 0.6;
                    const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                    ball.dx = Math.sin(angle) * speed;
                    ball.dy = -Math.cos(angle) * speed;
                    ball.y = paddle.y - ball.radius;
                    createParticles(ball.x, ball.y, paddle.color, 10);
                }

                // Caída
                if (ball.y > canvas.height + ball.radius) {
                    return false;
                }

                // Bloques
                blocks.forEach((block, index) => {
                    if (ball.x > block.x - ball.radius && 
                        ball.x < block.x + block.width + ball.radius &&
                        ball.y > block.y - ball.radius && 
                        ball.y < block.y + block.height + ball.radius) {
                        
                        const prevX = ball.x - ball.dx;
                        const prevY = ball.y - ball.dy;
                        
                        if (prevX < block.x || prevX > block.x + block.width) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }
                        
                        block.hits--;
                        
                        if (block.hits <= 0) {
                            if (block.hasPower) {
                                dropPower(block.x + block.width / 2, block.y + block.height / 2);
                            }
                            createParticles(block.x + block.width / 2, block.y + block.height / 2, block.color, 15);
                            blocks.splice(index, 1);
                            score += 10 * level;
                            document.getElementById('scoreVal').textContent = score;

                            if (blocks.length === 0) {
                                levelComplete();
                            }
                        }
                    }
                });

                return true;
            });

            if (balls.length === 0 && gameRunning) {
                lives--;
                document.getElementById('livesVal').textContent = lives;
                
                if (lives > 0) {
                    balls.push(createBall());
                    showMessage('¡OOPS! 😿');
                } else {
                    gameOver();
                }
            }
        }

        // Actualizar paleta
        function updatePaddle() {
            paddle.x += (paddle.targetX - paddle.x) * 0.15;
            
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) {
                paddle.x = canvas.width - paddle.width;
            }
        }

        // Actualizar bolas
        function updateBalls() {
            balls.forEach(ball => {
                ball.x += ball.dx;
                ball.y += ball.dy;
            });
        }

        // Mostrar mensaje
        function showMessage(text) {
            const msg = document.createElement('div');
            msg.id = 'message';
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 2000);
        }

        // Nivel completado
        function levelComplete() {
            if (prisonerCat && !prisonerCat.rescued) {
                prisonerCat.rescued = true;
                showMessage('🎉 ¡GATO RESCATADO! 🎉');
            } else {
                showMessage('🎊 ¡NIVEL COMPLETADO! 🎊');
            }
            
            level++;
            document.getElementById('levelVal').textContent = level;
            score += 100 * level;
            document.getElementById('scoreVal').textContent = score;
            
            setTimeout(() => {
                prisonerCat = null;
                createLevel();
                balls = [createBall()];
                initPaddle();
            }, 2000);
        }

        // Game Over
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            showMessage('😿 GAME OVER 😿');
            
            setTimeout(() => {
                menu.classList.remove('hidden');
                startBtn.textContent = 'JUGAR DE NUEVO';
            }, 2500);
        }

        // Loop principal
        function gameLoop() {
            if (!gameRunning) return;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            updatePaddle();
            updateBalls();
            checkCollisions();
            updateActivePowers();
            updateLasers();
            updateFallingPowers();

            drawBlocks();
            drawPaddle();
            balls.forEach(drawBall);
            drawParticles();
            showPrisonerCat();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Iniciar juego
        function startGame() {
            menu.classList.add('hidden');
            score = 0;
            level = 1;
            lives = 3;
            balls = [createBall()];
            prisonerCat = null;
            activePowers = {multiBall: 0, laser: 0, widePaddle: 0, slowBall: 0};
            fallingPowers = [];
            lasers = [];
            particles = [];
            paddle.width = 100;
            
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('levelVal').textContent = level;
            document.getElementById('livesVal').textContent = lives;
            
            initPaddle();
            createLevel();
            gameRunning = true;
            gameLoop();
        }

        startBtn.addEventListener('click', startGame);
        startBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startGame();
        });

        // Inicialización
        initPaddle();
    </script>
</body>
</html>
