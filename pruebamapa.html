<!DOCTYPE html>
<html>
<head>
    <title>Prueba Mapa</title>
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js"></script>
    <style>
        #mapa { width: 100%; height: 80vh; }
    </style>
</head>
<body>
    <div id="mapa"></div>

    <script>
        var viewer = OpenSeadragon({
            id: "mapa",
            prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
            tileSources: "localidades/mapacompleto.png"  // ← cambia esta ruta si es necesario
        });

        viewer.addHandler('open', () => console.log("¡Cargado!"));
        viewer.addHandler('open-failed', ev => console.error("Error:", ev));
    </script>
</body>
</html>
