<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Artículos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #0f1419;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 25px;
            font-size: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00d4ff;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #1a1f2e;
            border: 1px solid #2a3f5f;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            font-family: 'Courier New', monospace;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 16px;
            background: #1a3a52;
            border: none;
            border-radius: 6px;
            color: #00d4ff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #2a4a62;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #0f1419;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00e4ff 0%, #00aae6 100%);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }

        .preview {
            background: #1a1f2e;
            padding: 30px;
            border-radius: 8px;
            min-height: 400px;
            line-height: 1.8;
        }

        .preview h1 {
            color: #00d4ff;
            font-size: 32px;
            margin-bottom: 20px;
            text-align: left;
        }

        .preview p {
            margin-bottom: 15px;
            color: #d0d0d0;
        }

        .preview blockquote {
            border-left: 4px solid #00d4ff;
            padding-left: 20px;
            margin: 25px 0;
            font-style: italic;
            color: #b0b0b0;
        }

        .preview ul {
            margin-left: 25px;
            margin-bottom: 15px;
        }

        .preview li {
            margin-bottom: 8px;
            color: #d0d0d0;
        }

        .preview em {
            color: #00d4ff;
        }

        .output {
            background: #0a0e14;
            padding: 20px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #7dd3fc;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1f2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a3f5f;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a4f6f;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>✍️ Editor de Artículos</h1>
            
            <div class="meta-grid">
                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" placeholder="Título del artículo">
                </div>
                
                <div class="form-group">
                    <label for="slug">Slug</label>
                    <input type="text" id="slug" placeholder="titulo-del-articulo">
                </div>
                
                <div class="form-group">
                    <label for="category">Categoría</label>
                    <input type="text" id="category" placeholder="Economía">
                </div>
                
                <div class="form-group">
                    <label for="language">Idioma</label>
                    <select id="language">
                        <option value="Español">Español</option>
                        <option value="English">English</option>
                    </select>
                </div>
                
                <div class="form-group full-width">
                    <label for="excerpt">Resumen (Excerpt)</label>
                    <textarea id="excerpt" rows="3" placeholder="Un resumen breve y llamativo..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="date">Fecha</label>
                    <input type="date" id="date">
                </div>
            </div>
            
            <div class="form-group">
                <label>Herramientas de Edición</label>
                <div class="toolbar">
                    <button class="btn" onclick="insertTag('h1')">H1</button>
                    <button class="btn" onclick="insertTag('p')">Párrafo</button>
                    <button class="btn" onclick="insertTag('blockquote')">Cita</button>
                    <button class="btn" onclick="insertTag('ul')">Lista</button>
                    <button class="btn" onclick="insertTag('li')">Item</button>
                    <button class="btn" onclick="insertTag('em')">Énfasis</button>
                    <button class="btn" onclick="insertTag('br')">Salto</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="content">Contenido HTML</label>
                <textarea id="content" rows="15" placeholder="<h1>Título</h1>
<p>Tu contenido aquí...</p>"></textarea>
            </div>
            
            <button class="btn btn-primary" onclick="generateOutput()">📄 Generar TXT</button>
        </div>
        
        <div class="panel">
            <h1>👁️ Vista Previa</h1>
            <div class="preview" id="preview">
                <p style="color: #666;">La vista previa aparecerá aquí...</p>
            </div>
            
            <h1 style="margin-top: 30px;">📋 Resultado Final</h1>
            <div class="output" id="output">El código generado aparecerá aquí...</div>
        </div>
    </div>

    <script>
        const contentArea = document.getElementById('content');
        const previewArea = document.getElementById('preview');
        const outputArea = document.getElementById('output');
        const titleInput = document.getElementById('title');
        const dateInput = document.getElementById('date');

        // Establecer fecha actual
        dateInput.valueAsDate = new Date();

        // Auto-generar slug desde título
        titleInput.addEventListener('input', function() {
            const slug = this.value
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
            document.getElementById('slug').value = slug;
        });

        // Actualizar preview en tiempo real
        contentArea.addEventListener('input', function() {
            previewArea.innerHTML = this.value || '<p style="color: #666;">La vista previa aparecerá aquí...</p>';
        });

        function insertTag(tag) {
            const start = contentArea.selectionStart;
            const end = contentArea.selectionEnd;
            const selectedText = contentArea.value.substring(start, end);
            let newText;

            switch(tag) {
                case 'h1':
                    newText = `<h1>${selectedText || 'TÍTULO'}</h1>`;
                    break;
                case 'p':
                    newText = `<p>${selectedText || 'Párrafo'}</p>`;
                    break;
                case 'blockquote':
                    newText = `<blockquote>\n    "${selectedText || 'Cita textual'}"<br>\n    — Autor, <em>Obra</em> (Año)\n</blockquote>`;
                    break;
                case 'ul':
                    newText = `<ul>\n    <li>${selectedText || 'Item'}</li>\n</ul>`;
                    break;
                case 'li':
                    newText = `<li>${selectedText || 'Item'}</li>`;
                    break;
                case 'em':
                    newText = `<em>${selectedText || 'texto'}</em>`;
                    break;
                case 'br':
                    newText = '<br>';
                    break;
            }

            contentArea.value = contentArea.value.substring(0, start) + newText + contentArea.value.substring(end);
            contentArea.focus();
            
            // Actualizar preview
            previewArea.innerHTML = contentArea.value;
        }

        function generateOutput() {
            const title = document.getElementById('title').value || 'Título';
            const slug = document.getElementById('slug').value || 'titulo-del-articulo';
            const category = document.getElementById('category').value || 'Economía';
            const language = document.getElementById('language').value;
            const excerpt = document.getElementById('excerpt').value || 'Resumen del artículo';
            const date = document.getElementById('date').value || '2025-06-25';
            const content = contentArea.value.trim() || '<h1>TÍTULO</h1>\n<p>Contenido</p>';

            // Formatear contenido con indentación
            const formattedContent = content
                .split('\n')
                .map(line => '        ' + line)
                .join('\n');

            const output = `{
    title: "${title}",
    slug: "${slug}",
    category: "${category}",
    language: "${language}",
    fullCategory: "${category}",
    excerpt: "${excerpt}",
    date: "${date}",
    content: 
        \`${formattedContent}\`
},`;

            outputArea.textContent = output;

            // Copiar al portapapeles automáticamente
            navigator.clipboard.writeText(output).then(() => {
                alert('✅ Código generado y copiado al portapapeles!');
            }).catch(() => {
                alert('✅ Código generado! Selecciona y copia manualmente.');
            });
        }
    </script>
</body>
</html>
