<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Universo de Proyectos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
            touch-action: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 280px;
            z-index: 100;
        }

        #info-panel h1 {
            font-size: 20px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #info-panel p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }

        .control-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            font-size: 14px;
            white-space: nowrap;
        }

        #tooltip.show {
            opacity: 1;
        }

        .tooltip-star {
            color: #ffd700;
            font-weight: bold;
        }

        .tooltip-planet {
            color: #4fc3f7;
        }

        /* Panel de información del planeta */
        #planet-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            max-width: 90vw;
            width: 350px;
        }

        #planet-panel.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }

        #planet-panel h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        #planet-panel .category {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }

        #planet-panel .buttons {
            display: flex;
            gap: 10px;
        }

        #planet-panel button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #visit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #visit-btn:active {
            transform: scale(0.95);
        }

        #close-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        #close-btn:active {
            transform: scale(0.95);
        }

        /* Labels de estrellas */
        .star-label {
            position: absolute;
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
            transform: translate(-50%, -50%);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading.hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #info-panel {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                padding: 12px;
            }

            #info-panel h1 {
                font-size: 18px;
            }

            #info-panel p {
                font-size: 12px;
            }

            #controls {
                bottom: 10px;
                padding: 10px 15px;
                gap: 8px;
            }

            .control-text {
                font-size: 10px;
            }

            #planet-panel {
                padding: 20px;
            }

            #planet-panel h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="info-panel">
        <h1>Mi Universo</h1>
        <p>Explora mis proyectos en este universo interactivo. Cada estrella representa una categoría y los planetas son proyectos individuales.</p>
        <p style="margin-top: 8px;">👆 Toca un planeta para más info</p>
    </div>

    </div>

    <div id="tooltip"></div>

    <!-- Panel de información del planeta -->
    <div id="planet-panel">
        <h2 id="planet-name"></h2>
        <div class="category" id="planet-category"></div>
        <div class="buttons">
            <button id="visit-btn">Visitar 🚀</button>
            <button id="close-btn">Cerrar</button>
        </div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Cargando el universo...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="universe.js"></script>
</body>
</html>
