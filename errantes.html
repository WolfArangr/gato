<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Errantes de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.75;
            margin: 0;
            padding: 20px;
            background-color: #f5e8c7;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.96);
            padding: 70px 80px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }
        #title-page {
            text-align: center;
            margin-bottom: 100px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5.4em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.7em;
            color: #3d2b1f;
            margin: 0 0 100px;
            border-bottom: 4px double #8b4513;
            padding-bottom: 30px;
        }
        h2.chapter-num {
            font-family: 'MedievalSharp', cursive;
            font-size: 3em;
            color: #b22222;
            text-align: center;
            margin: 110px 0 10px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 12px;
        }
        h2.chapter-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 3.0em;
            color: #4b2e1a;
            text-align: center;
            margin: 0 0 60px;
        }
        p {
            text-align: justify;
            hyphens: auto;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            text-indent: 3em;
            margin: 1.6em 0;
            font-size: 1.25em;
        }
        hr {
            border: none;
            border-top: 3px double #8b4513;
            margin: 90px auto;
            width: 35%;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #444;
            padding: 180px 0;
            font-size: 1.5em;
        }
        /* Ocultar basura de Google Docs */
        .c3, .c5, p.c1.c5, p:empty, span:empty, br:only-child,
        p.c1:not(:has(*:not(:empty))), p.c2:empty {
            display: none !important;
        }
        a.localidad-link {
            color: #4b2e1a;
            text-decoration: none;
            border-bottom: 1px dotted #8b4513;
            font-weight: 500;
            cursor: pointer;
        }
        a.localidad-link:hover {
            color: #8b0000;
            border-bottom: 1px solid #8b0000;
        }
        #toc {
            text-align: center;
            margin-bottom: 60px;
            font-size: 2.0em;
        }
        #toc h3 {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.8em;
            color: #4b2e1a;
            margin-bottom: 20px;
        }
        #toc ul {
            list-style: none;
            padding: 0;
        }
        #toc li {
            margin: 10px 0;
        }
        #toc a {
            color: #8b4513;
            text-decoration: none;
        }
        #toc a:hover {
            color: #8b0000;
        }
        #localidades {
            margin-top: 60px;
            text-align: center;
        }
        #localidades summary {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.0em;
            color: #4b2e1a;
            cursor: pointer;
        }
        #localidades ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        #localidades li {
            margin: 8px 0;
        }
        #localidades a {
            font-size: 1.4em;
            color: #8b4513;
            text-decoration: none;
        }
        #localidades a:hover {
            color: #8b0000;
        }
        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            #book { padding: 35px 25px; border-width: 8px; max-width: 95%; box-shadow: inset 0 0 25px rgba(0,0,0,0.15); }
            h1.main-title { font-size: 3.8em; margin: 15px 0 8px; }
            h1.author { font-size: 2.1em; margin-bottom: 60px; padding-bottom: 20px; }
            h2.chapter-num { font-size: 2.4em; margin: 70px 0 8px; }
            h2.chapter-title { font-size: 2.0em; margin-bottom: 40px; }
            p { font-size: 1.15em; text-indent: 2.2em; margin: 1.4em 0; }
            hr { width: 50%; margin: 60px auto; }
        }
        @media (max-width: 480px) {
            #book { padding: 25px 18px; }
            h1.main-title { font-size: 3.2em; }
            h1.author { font-size: 1.9em; }
            h2.chapter-num { font-size: 2.1em; }
            h2.chapter-title { font-size: 1.8em; }
            p { font-size: 1.08em; text-indent: 2em; }
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Los Errantes de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
            <div id="toc">
                <!-- El índice se genera dinámicamente aquí -->
            </div>
            <details id="localidades">
                <summary>
                    Localidades Mencionadas
                    <span id="load-percent" style="color:#777; font-size:0.8em; margin-left:10px;">
                        (0/127)
                    </span>
                </summary>
                <!-- La lista se genera dinámicamente aquí -->
            </details>
        </div>
        <div id="content">
            <div id="loading">Cargando la crónica...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('content');
            const loading = document.getElementById('loading');
            const tocDiv = document.getElementById('toc');
            const localidadesDetails = document.getElementById('localidades');
            const percentSpan = document.getElementById('load-percent');

            try {
                const response = await fetch('LosErrantesdeKurghaimat.html');
                if (!response.ok) throw new Error('Archivo no encontrado');
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = doc.body.innerHTML;

                // Procesar capítulos
                const chapterHeaders = tempDiv.querySelectorAll('h1.c7');
                const chapters = [];
                let chapterIndex = 1;
                chapterHeaders.forEach(header => {
                    const span = header.querySelector('span.c4');
                    let text = (span?.textContent || header.textContent || '').trim();
                    if (!text) { header.remove(); return; }
                    let chapterNum = text.split(' - ')[0]?.trim() || text;
                    let chapterSub = text.includes(' - ') ? text.split(' - ').slice(1).join(' - ').trim() : '';
                    const h2Num = document.createElement('h2');
                    h2Num.className = 'chapter-num';
                    h2Num.textContent = chapterNum;
                    h2Num.id = `chapter-${chapterIndex}`;
                    const h2Sub = document.createElement('h2');
                    h2Sub.className = 'chapter-title';
                    h2Sub.textContent = chapterSub;
                    header.parentNode.insertBefore(h2Num, header);
                    if (chapterSub) header.parentNode.insertBefore(h2Sub, header.nextSibling);
                    chapters.push({ num: chapterNum, id: `chapter-${chapterIndex}` });
                    chapterIndex++;
                    header.remove();
                });

                // Generar índice
                if (chapters.length > 0) {
                    const tocH3 = document.createElement('h3');
                    tocH3.textContent = 'Índice de Capítulos';
                    tocDiv.appendChild(tocH3);
                    const tocUl = document.createElement('ul');
                    chapters.forEach(ch => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = `#${ch.id}`;
                        a.textContent = ch.num;
                        li.appendChild(a);
                        tocUl.appendChild(li);
                    });
                    tocDiv.appendChild(tocUl);
                }

                // Limpieza
                tempDiv.querySelectorAll('p').forEach(p => {
                    const txt = (p.textContent || '').trim();
                    if (txt.length < 3 || txt === ' ') p.remove();
                });
                tempDiv.querySelectorAll('p:empty, .c3, .c5, span:empty, br:only-child').forEach(el => el.remove());

                // Insertar contenido limpio
                contentDiv.innerHTML = tempDiv.innerHTML;
                loading?.remove();

                // ────────────────────────────────────────────────
                // NUEVA LÓGICA: partir de la lista fija de localidades
                // ────────────────────────────────────────────────
                const localidadesDir = 'localidades/';
                const extension = '.jpg';

                // Lista fija (sin .jpg)
                const knownLocalidades = [
                    "aldearares","aldequejas","alinomin","allares","allogollos","allos","alominchar",
                    "aloranagan","aloranes","anconta","anzonquepi","arminocelas","arveta","baiga",
                    "bailes","barriosbar","bartolares","beldea","bellavil","berzuese","buenala",
                    "cancon","candigos","cantita","cardaralare","carralriote","carrealloca","carriruera",
                    "caspinanar","castanarro","casto","castominza","cermola","chocento","chuelas",
                    "cidaganta","cinies","ciralher","copejon","coyogollor","cuergeso","cuertocedo",
                    "dorihuejar","driero","duceque","esplera","esteruerane","estesavas","estrieguque",
                    "estrienil","estriequega","fontanes","fuencos","galza","herreron","herzuemillo",
                    "hiquemilba","huerolinil","huerongo","humanilnue","jadrallida","jiles","leras",
                    "lomagandera","lumana","lunoradete","lunosanar","luronteldea","madran","madronasas",
                    "maliba","malvez","mantella","menaba","mihuejas","milmaganes","minoma","mirueranil",
                    "mitatillar","mocha","momanuejas","mominchar","moncorea","negranosbar","negrera",
                    "noblegalo","noblevo","nudera","orrealgarve","palla","palvistemil","pigos","porro",
                    "pradatan","puebradena","puertanil","quindoliga","quinzadedo","reras","riofrintuma",
                    "ruenanilsaz","saldea","sanca","sancialo","sanconciare","sande","sanderados",
                    "sandieravas","santalestab","saura","sejontanil","selastil","tordalagar","torredavil",
                    "torrio","torronza","torroso","tortilmadro","urriozascas","vallo","valmadroma",
                    "valviste","valza","yundo","yunta","yuntatildea","zarmoveras"
                ];

                const total = knownLocalidades.length; // 127
                let checked = 0;

                function updateProgress() {
                    checked++;
                    const pct = Math.floor((checked / total) * 100);
                    if (percentSpan) {
                        percentSpan.textContent = `(${checked}/${total}) ${pct}%`;
                    }
                }

                async function imageExists(url) {
                    return new Promise(resolve => {
                        const img = new Image();
                        img.onload = () => resolve(true);
                        img.onerror = () => resolve(false);
                        img.src = url;
                    });
                }

                const validLocalidades = new Map(); // lowerName → original capitalized version (aprox)

                // Comprobamos todas en paralelo
                const checks = knownLocalidades.map(async (lowerName) => {
                    const url = localidadesDir + lowerName + extension;
                    const exists = await imageExists(url);
                    if (exists) {
                        // Usamos una capitalización aproximada (primera letra mayúscula)
                        // Puedes mejorar esto si tienes una lista con la forma exacta
                        const capitalized = lowerName.charAt(0).toUpperCase() + lowerName.slice(1);
                        validLocalidades.set(lowerName, capitalized);
                    }
                    updateProgress();
                });

                await Promise.all(checks);

                // Limpiar el indicador de progreso
                if (percentSpan) percentSpan.remove();

                if (validLocalidades.size === 0) {
                    localidadesDetails.remove();
                    return;
                }

                // Crear regex con todos los nombres válidos (case sensitive)
                const namesArray = Array.from(validLocalidades.values());
                const escaped = namesArray.map(n => n.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&'));
                const regex = new RegExp('\\b(' + escaped.join('|') + ')\\b', 'g');

                // Recolectar todos los nodos de texto una sola vez
                const textNodes = [];
                const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null);
                let node;
                while (node = walker.nextNode()) {
                    if (node.nodeValue.trim() && !['SCRIPT','STYLE'].includes(node.parentNode.tagName)) {
                        textNodes.push(node);
                    }
                }

                // Reemplazar en el contenido
                textNodes.forEach(textNode => {
                    const text = textNode.nodeValue;
                    if (!regex.test(text)) return;
                    regex.lastIndex = 0;

                    const fragment = document.createDocumentFragment();
                    let lastIndex = 0;
                    let match;
                    while ((match = regex.exec(text)) !== null) {
                        if (match.index > lastIndex) {
                            fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
                        }
                        const original = match[0];
                        const lower = original.toLowerCase();
                        const link = document.createElement('a');
                        link.href = localidadesDir + lower + extension;
                        link.target = '_blank';
                        link.className = 'localidad-link';
                        link.textContent = original;
                        fragment.appendChild(link);
                        lastIndex = regex.lastIndex;
                    }
                    if (lastIndex < text.length) {
                        fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
                    }
                    textNode.parentNode.replaceChild(fragment, textNode);
                });

                // Generar la lista en el details
                const locUl = document.createElement('ul');
                const sorted = Array.from(validLocalidades.entries())
                    .map(([lower, cap]) => ({lower, cap}))
                    .sort((a,b) => a.cap.localeCompare(b.cap));

                sorted.forEach(({lower, cap}) => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = localidadesDir + lower + extension;
                    a.target = '_blank';
                    a.textContent = cap;
                    li.appendChild(a);
                    locUl.appendChild(li);
                });

                localidadesDetails.appendChild(locUl);

            } catch (err) {
                contentDiv.innerHTML = `<p style="color:#b22222; text-align:center; font-size:1.5em; padding:120px 0;">
                    Error: ${err.message}<br>Verifica que "LosErrantesdeKurghaimat.html" exista.
                </p>`;
                loading?.remove();
            }
        });
    </script>
</body>
</html>
