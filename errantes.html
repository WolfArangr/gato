<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Errantes de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.75;
            margin: 0;
            padding: 40px;
            background-color: #f5e8c7;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.96);
            padding: 70px 80px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }
        #title-page {
            text-align: center;
            margin-bottom: 100px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5.4em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.7em;
            color: #3d2b1f;
            margin: 0 0 100px;
            border-bottom: 4px double #8b4513;
            padding-bottom: 30px;
        }
        h2.chapter-num {
            font-family: 'MedievalSharp', cursive;
            font-size: 3em;
            color: #b22222;
            text-align: center;
            margin: 110px 0 10px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 12px;
        }
        h2.chapter-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5em;
            color: #4b2e1a;
            text-align: center;
            margin: 0 0 60px;
        }
        p {
            text-align: justify !important;
            hyphens: auto;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            text-indent: 3em;
            margin: 1.6em 0;
            font-size: 1.25em;
        }
        /* Drop cap reforzado */
        .chapter-first-p::first-letter {
            font-family: 'MedievalSharp', cursive !important;
            font-size: 5.2em !important;
            color: #8b0000 !important;
            float: left !important;
            margin: 0 16px 8px 0 !important;
            line-height: 0.55 !important;
            font-weight: bold !important;
        }
        /* Limpiar spans que interfieran */
        .chapter-first-p > span:first-child {
            font-size: inherit !important;
            float: none !important;
            margin: 0 !important;
        }
        hr {
            border: none;
            border-top: 3px double #8b4513;
            margin: 90px auto;
            width: 35%;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #444;
            padding: 180px 0;
            font-size: 1.5em;
        }
        /* Ocultar elementos vacíos o innecesarios */
        .c3, .c5, p.c1.c5, p:empty, span:empty, br:only-child {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Los Errantes de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>
        <div id="content">
            <div id="loading">Cargando la crónica...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('LosErrantesdeKurghaimat.html');
                if (!response.ok) throw new Error('Archivo no encontrado');
                const html = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = doc.body.innerHTML;

                // Procesar encabezados de capítulo
                const chapterHeaders = tempDiv.querySelectorAll('h1.c2, h1.c4, h1.c5');
                chapterHeaders.forEach(header => {
                    let text = header.textContent.trim();
                    if (!text) { header.remove(); return; }

                    let chapterNum = text;
                    let chapterSub = '';

                    if (text.includes(' - ')) {
                        [chapterNum, chapterSub] = text.split(' - ');
                        chapterNum = chapterNum.trim();
                        chapterSub = chapterSub.trim();
                    } else if (text.includes('Capítulo I')) {
                        chapterNum = 'Capítulo I';
                        chapterSub = text.replace('Capítulo I', '').trim();
                    }

                    const h2Num = document.createElement('h2');
                    h2Num.className = 'chapter-num';
                    h2Num.textContent = chapterNum;
                    header.parentNode.insertBefore(h2Num, header);

                    if (chapterSub) {
                        const h2Sub = document.createElement('h2');
                        h2Sub.className = 'chapter-title';
                        h2Sub.textContent = chapterSub;
                        header.parentNode.insertBefore(h2Sub, header.nextSibling);
                    }

                    header.remove();
                });

                // Marcar y limpiar primer párrafo de cada capítulo
                const paragraphs = tempDiv.querySelectorAll('p.c1');
                let isAfterChapter = false;
                paragraphs.forEach(p => {
                    if (p.previousElementSibling && p.previousElementSibling.tagName === 'H2') {
                        isAfterChapter = true;
                    }
                    if (isAfterChapter && p.textContent.trim()) {
                        p.classList.add('chapter-first-p');

                        // Extraer inicial si está en <span>
                        if (p.firstChild && p.firstChild.tagName === 'SPAN' &&
                            p.firstChild.textContent.trim().length === 1) {
                            const span = p.firstChild;
                            const letter = span.textContent;
                            span.remove();
                            p.insertBefore(document.createTextNode(letter), p.firstChild);
                        }

                        isAfterChapter = false; // Solo el primero
                    }
                });

                // Limpieza final
                tempDiv.querySelectorAll('p.c1.c5, p:empty, .c3, .c5, span:empty, br:only-child').forEach(el => el.remove());

                contentDiv.innerHTML = tempDiv.innerHTML;
                loading.remove();

            } catch (err) {
                contentDiv.innerHTML = `<p style="color:#b22222; text-align:center; font-size:1.5em; padding:180px 0;">
                    Error: ${err.message}<br>Asegúrate de que el archivo se llame exactamente "LosErrantesdeKurghaimat.html"
                </p>`;
            }
        });
    </script>
</body>
</html>
