<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Errantes de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.75;
            margin: 0;
            padding: 30px;
            background-color: #f5e8c7;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.95);
            padding: 65px 75px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 45px rgba(0,0,0,0.25);
        }
        #title-page {
            text-align: center;
            margin-bottom: 100px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5.2em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.35);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.6em;
            color: #3d2b1f;
            margin: 0 0 90px;
            border-bottom: 4px double #8b4513;
            padding-bottom: 30px;
        }
        h2.chapter-num {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.9em;
            color: #b22222;
            text-align: center;
            margin: 100px 0 8px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 12px;
        }
        h2.chapter-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.4em;
            color: #4b2e1a;
            text-align: center;
            margin: 0 0 55px;
        }
        p {
            text-align: justify !important;
            text-justify: inter-word;
            hyphens: auto;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            text-indent: 2.8em;
            margin: 1.5em 0;
            font-size: 1.22em;
        }
        /* DROP CAP - más fuerte y con !important */
        .chapter-first-p {
            margin-top: 0.3em !important;
        }
        .chapter-first-p::first-letter {
            font-family: 'MedievalSharp', cursive !important;
            font-size: 5em !important;
            color: #8b0000 !important;
            float: left !important;
            margin: 0 14px 6px 0 !important;
            line-height: 0.58 !important;
            font-weight: bold !important;
        }
        /* Limpiar cualquier interferencia inline en la primera letra */
        .chapter-first-p > span:first-child,
        .chapter-first-p span[style] {
            font-size: inherit !important;
            line-height: inherit !important;
            float: none !important;
            margin: 0 !important;
        }
        hr {
            border: none;
            border-top: 3px double #8b4513;
            margin: 80px auto;
            width: 40%;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #444;
            padding: 160px 0;
            font-size: 1.4em;
        }
        /* Ocultar basura del export */
        .c2, .c3, .c8, .c11, h1.c2, p.c0.c11, p:empty, span:empty, h1:empty, br {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Los Errantes de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>
        <div id="content">
            <div id="loading">Cargando la crónica...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('LosErrantesdeKurghaimat.html');
                if (!response.ok) throw new Error('Archivo no encontrado');
                const html = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = doc.body.innerHTML;

                // Procesar capítulos
                const chapterHeaders = tempDiv.querySelectorAll('h1.c4, h1.c5');
                chapterHeaders.forEach(header => {
                    let text = header.textContent.trim();
                    if (!text) { header.remove(); return; }

                    let chapterNum = text;
                    let chapterSub = '';

                    if (text.includes(' - ')) {
                        [chapterNum, chapterSub] = text.split(' - ');
                        chapterNum = chapterNum.trim();
                        chapterSub = chapterSub.trim();
                    }

                    const h2Num = document.createElement('h2');
                    h2Num.className = 'chapter-num';
                    h2Num.textContent = chapterNum;
                    header.parentNode.insertBefore(h2Num, header);

                    if (chapterSub) {
                        const h2Sub = document.createElement('h2');
                        h2Sub.className = 'chapter-title';
                        h2Sub.textContent = chapterSub;
                        header.parentNode.insertBefore(h2Sub, header.nextSibling);
                    }

                    header.remove();

                    // Marcar primer párrafo
                    let nextP = h2Num.nextElementSibling;
                    while (nextP && nextP.tagName !== 'P') {
                        nextP = nextP.nextElementSibling;
                    }
                    if (nextP && nextP.tagName === 'P' && nextP.textContent.trim()) {
                        nextP.classList.add('chapter-first-p');

                        // Si aún hay span en la primera letra, extraerla
                        if (nextP.firstElementChild && nextP.firstElementChild.tagName === 'SPAN' &&
                            nextP.firstElementChild.textContent.trim().length === 1) {
                            const span = nextP.firstElementChild;
                            const letter = span.textContent;
                            span.remove();
                            nextP.insertBefore(document.createTextNode(letter), nextP.firstChild);
                        }
                    }
                });

                // Limpieza agresiva
                tempDiv.querySelectorAll('h1.c2, .c2, .c3, .c8, .c11, p:empty, span:empty, br:only-child').forEach(el => el.remove());

                // Quitar restos de título principal
                tempDiv.querySelectorAll('span.c5, span.c14, span.c7, span.c13').forEach(el => {
                    const t = el.textContent.trim().toLowerCase();
                    if (t.includes('errantes') || t.includes('kurghaimat') || t.includes('edvard')) {
                        let p = el.closest('h1') || el.parentElement;
                        if (p) p.remove();
                    }
                });

                contentDiv.innerHTML = tempDiv.innerHTML;
                loading.remove();

            } catch (err) {
                contentDiv.innerHTML = `<p style="color:#b22222; text-align:center; font-size:1.5em; padding:160px 0;">
                    Error: ${err.message}<br>Verifica que el archivo se llame exactamente "LosErrantesdeKurghaimat.html"
                </p>`;
            }
        });
    </script>
</body>
</html>
