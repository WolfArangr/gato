<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Errantes de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.7;
            margin: 0;
            padding: 30px;
            background-color: #f5e8c7;
        }
        #book {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.94);
            padding: 60px 70px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.25);
        }
        #title-page {
            text-align: center;
            margin-bottom: 90px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5em;
            color: #8b0000;
            margin: 30px 0 15px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5em;
            color: #3d2b1f;
            margin: 0 0 80px;
            border-bottom: 4px double #8b4513;
            padding-bottom: 25px;
        }
        h2.chapter-num {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.8em;
            color: #b22222;
            text-align: center;
            margin: 90px 0 5px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 10px;
        }
        h2.chapter-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.3em;
            color: #4b2e1a;
            text-align: center;
            margin: 0 0 50px;
        }
        p {
            text-indent: 2.8em;
            margin: 1.4em 0;
            font-size: 1.2em;
        }
        /* Drop cap */
        .chapter-first-p::first-letter {
            font-family: 'MedievalSharp', cursive;
            font-size: 4.8em;
            color: #8b0000;
            float: left;
            margin: 2px 14px 4px 0;
            line-height: 0.6;
            font-weight: bold;
        }
        /* Forzar limpieza de spans grandes en la primera letra */
        .chapter-first-p > span:first-child {
            font-size: inherit !important;
            font-family: inherit !important;
        }
        hr {
            border: none;
            border-top: 3px double #8b4513;
            margin: 70px auto;
            width: 40%;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #555;
            padding: 150px 0;
            font-size: 1.4em;
        }
        /* Ocultar elementos vacíos o innecesarios del export */
        .c2, .c3, .c8, .c11, h1.c2, p.c0.c11, p:empty, span:empty, h1:empty, br {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Los Errantes de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>
        <div id="content">
            <div id="loading">Cargando la crónica medieval...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('LosErrantesdeKurghaimat.html');
                if (!response.ok) throw new Error('No se encuentra el archivo');
                const html = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = doc.body.innerHTML;

                // Procesar capítulos
                const chapterHeaders = tempDiv.querySelectorAll('h1.c4, h1.c5'); // c5 en tu último snippet
                chapterHeaders.forEach(header => {
                    let text = header.textContent.trim();
                    if (!text) {
                        header.remove();
                        return;
                    }

                    // Separar número y subtítulo si vienen juntos
                    let chapterNum = text;
                    let chapterSub = '';

                    if (text.includes(' - ')) {
                        [chapterNum, chapterSub] = text.split(' - ');
                        chapterNum = chapterNum.trim();
                        chapterSub = chapterSub.trim();
                    }

                    // Crear h2 para número de capítulo
                    const h2Num = document.createElement('h2');
                    h2Num.className = 'chapter-num';
                    h2Num.textContent = chapterNum;
                    header.parentNode.insertBefore(h2Num, header);

                    // Crear h2 para subtítulo si existe
                    if (chapterSub) {
                        const h2Sub = document.createElement('h2');
                        h2Sub.className = 'chapter-title';
                        h2Sub.textContent = chapterSub;
                        header.parentNode.insertBefore(h2Sub, header.nextSibling);
                    }

                    header.remove(); // Quitamos el original

                    // Marcar el siguiente párrafo válido para dropcap
                    let nextP = h2Num.nextElementSibling;
                    while (nextP && nextP.tagName !== 'P') {
                        nextP = nextP.nextElementSibling;
                    }
                    if (nextP && nextP.tagName === 'P' && nextP.textContent.trim().length > 0) {
                        nextP.classList.add('chapter-first-p');

                        // Extraer la primera letra si está en span (el caso típico de Google)
                        const firstChild = nextP.firstChild;
                        if (firstChild && firstChild.nodeType === 1 && firstChild.tagName === 'SPAN' &&
                            firstChild.textContent.trim().length === 1 && firstChild.nextSibling &&
                            (firstChild.nextSibling.nodeType === 3 || firstChild.nextSibling.tagName === 'SPAN')) {
                            const letterSpan = firstChild;
                            const letter = letterSpan.textContent.trim();
                            letterSpan.remove();
                            // Insertar la letra como texto plano al principio
                            nextP.insertBefore(document.createTextNode(letter), nextP.firstChild);
                        }
                    }
                });

                // Limpieza final
                tempDiv.querySelectorAll('h1.c2, .c2, .c3, .c8, .c11, p:empty, span:empty, br:only-child').forEach(el => el.remove());

                // Eliminar cualquier resto de título principal que se cuele
                tempDiv.querySelectorAll('span.c5, span.c14, span.c7, span.c13').forEach(el => {
                    const txt = el.textContent.trim().toLowerCase();
                    if (txt.includes('errantes') || txt.includes('kurghaimat') || txt.includes('edvard')) {
                        let parent = el.closest('h1') || el;
                        if (parent) parent.remove();
                    }
                });

                contentDiv.innerHTML = tempDiv.innerHTML;
                loading.remove();

            } catch (err) {
                contentDiv.innerHTML = `<p style="color:#b22222; text-align:center; font-size:1.5em; padding:150px 0;">
                    Error: ${err.message}<br>Comprueba que el archivo se llame exactamente "LosErrantesdeKurghaimat.html"
                </p>`;
            }
        });
    </script>
</body>
</html>
