<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Errantes de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.75;
            margin: 0;
            padding: 20px;
            background-color: #f5e8c7;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.96);
            padding: 70px 80px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }
        #title-page {
            text-align: center;
            margin-bottom: 100px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5.4em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.7em;
            color: #3d2b1f;
            margin: 0 0 100px;
            border-bottom: 4px double #8b4513;
            padding-bottom: 30px;
        }
        h2.chapter-num {
            font-family: 'MedievalSharp', cursive;
            font-size: 3em;
            color: #b22222;
            text-align: center;
            margin: 110px 0 10px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 12px;
        }
        h2.chapter-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 3.0em;
            color: #4b2e1a;
            text-align: center;
            margin: 0 0 60px;
        }
        p {
            text-align: justify;
            hyphens: auto;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            text-indent: 3em;
            margin: 1.6em 0;
            font-size: 1.25em;
        }
        .chapter-first-p::first-letter {
            font-family: 'MedievalSharp', cursive !important;
            font-size: 4.0em !important;
            color: #8b0000 !important;
            float: left !important;
            margin: 0 8px 4px 0 !important;
            line-height: 0.85 !important;
            font-weight: bold !important;
        }
        hr {
            border: none;
            border-top: 3px double #8b4513;
            margin: 90px auto;
            width: 35%;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #444;
            padding: 180px 0;
            font-size: 1.5em;
        }
        /* Ocultar basura */
        .c3, .c5, p.c1.c5, p:empty, span:empty, br:only-child,
        p.c1:not(:has(*:not(:empty))), p.c2:empty {
            display: none !important;
        }
        a.localidad-link {
            color: #4b2e1a;
            text-decoration: none;
            border-bottom: 1px dotted #8b4513;
            font-weight: 500;
            cursor: pointer;
        }
        a.localidad-link:hover {
            color: #8b0000;
            border-bottom: 1px solid #8b0000;
        }
        /* Responsive (sin cambios) */
        @media (max-width: 768px) { /* ... mismo que antes ... */ }
        @media (max-width: 480px) { /* ... mismo que antes ... */ }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Los Errantes de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>
        <div id="content">
            <div id="loading">Cargando la crónica...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('LosErrantesdeKurghaimat.html');
                if (!response.ok) throw new Error('Archivo no encontrado');
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = doc.body.innerHTML;

                // ── 1. Procesar capítulos ───────────────────────────────────────
                const chapterHeaders = tempDiv.querySelectorAll('h1.c7');
                chapterHeaders.forEach(header => {
                    const span = header.querySelector('span.c4');
                    let text = (span?.textContent || header.textContent || '').trim();
                    if (!text) { header.remove(); return; }

                    let chapterNum = text.split(' - ')[0]?.trim() || text;
                    let chapterSub = text.includes(' - ') ? text.split(' - ').slice(1).join(' - ').trim() : '';

                    const h2Num = document.createElement('h2');
                    h2Num.className = 'chapter-num';
                    h2Num.textContent = chapterNum;

                    const h2Sub = document.createElement('h2');
                    h2Sub.className = 'chapter-title';
                    h2Sub.textContent = chapterSub;

                    header.parentNode.insertBefore(h2Num, header);
                    if (chapterSub) header.parentNode.insertBefore(h2Sub, header.nextSibling);

                    header.remove();
                });

                // ── 2. Limpieza previa de párrafos vacíos ───────────────────────
                tempDiv.querySelectorAll('p').forEach(p => {
                    const txt = (p.textContent || '').trim();
                    if (txt.length < 3 || txt === ' ') p.remove();
                });

                // ── 3. Aplicar drop cap al primer párrafo con contenido real después de cada capítulo ──
                tempDiv.querySelectorAll('h2.chapter-num').forEach(chapterH2 => {
                    let sibling = chapterH2.nextElementSibling;
                    while (sibling) {
                        if (sibling.tagName === 'P') {
                            const text = (sibling.textContent || '').trim();
                            if (text.length > 10) {  // umbral para considerar "párrafo real"
                                sibling.classList.add('chapter-first-p');

                                // Extraer letra inicial si está envuelta en <span>
                                const firstChild = sibling.firstChild;
                                if (firstChild?.nodeType === 1 && firstChild.tagName === 'SPAN' &&
                                    (firstChild.textContent || '').trim().length === 1) {
                                    const letter = firstChild.textContent;
                                    firstChild.remove();
                                    sibling.insertBefore(document.createTextNode(letter), sibling.firstChild);
                                }
                                break;
                            }
                        }
                        sibling = sibling.nextElementSibling;
                    }
                });

                // ── 4. Limpieza final ──────────────────────────────────────────
                tempDiv.querySelectorAll('p:empty, .c3, .c5, span:empty, br:only-child').forEach(el => el.remove());

                // ── 5. Insertar SOLO en #content (mantiene la portada) ─────────
                contentDiv.innerHTML = tempDiv.innerHTML;
                loading?.remove();

                // (Opcional: tu código de localidades aquí si lo quieres mantener)

            } catch (err) {
                contentDiv.innerHTML = `<p style="color:#b22222; text-align:center; font-size:1.5em; padding:120px 0;">
                    Error: ${err.message}<br>Verifica que "LosErrantesdeKurghaimat.html" exista y sea accesible.
                </p>`;
                loading?.remove();
            }
        });
    </script>
</body>
</html>
