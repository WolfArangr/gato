<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Errantes de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.7;
            margin: 0;
            padding: 30px;
            background-color: #f5e8c7; /* fallback si no hay imagen */
        }
        #book {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.92);
            padding: 60px 70px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.3), 0 0 30px rgba(0,0,0,0.4);
        }
        #title-page {
            text-align: center;
            margin-bottom: 80px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 4.8em;
            color: #8b0000;
            margin: 40px 0 20px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.25);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.4em;
            color: #3d2b1f;
            margin: 0 0 70px;
            border-bottom: 3px double #8b4513;
            padding-bottom: 20px;
        }
        h2 {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5em;
            color: #b22222;
            text-align: center;
            margin: 80px 0 30px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 12px;
        }
        h2.subtitle {
            font-size: 2.0em;
            color: #4b2e1a;
            margin: -15px 0 50px;
        }
        p {
            text-indent: 2.5em;
            margin: 1.3em 0;
            font-size: 1.18em;
        }
        /* Drop cap SOLO en el primer párrafo después de cada capítulo */
        .chapter-first-p:first-letter {
            font-family: 'MedievalSharp', cursive;
            font-size: 4.2em;
            color: #8b0000;
            float: left;
            margin: 4px 10px 0 0;
            line-height: 0.7;
        }
        hr {
            border: none;
            border-top: 2px double #8b4513;
            margin: 60px auto;
            width: 50%;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #555;
            padding: 120px 0;
            font-size: 1.3em;
        }
        /* Ocultar basura del export */
        .c2, .c8, .c11, h1.c2, p.c0.c11, p:empty, h1:empty, .empty {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Los Errantes de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>
        <div id="content">
            <div id="loading">Cargando la crónica...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('LosErrantesdeKurghaimat.html');
                if (!response.ok) throw new Error('No se encuentra LosErrantesdeKurghaimat.html');
                const html = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = doc.body.innerHTML;

                // ───────────────────────────────────────────────
                // Procesar capítulos y subtítulos
                // ───────────────────────────────────────────────
                const headers = tempDiv.querySelectorAll('h1.c4');
                headers.forEach(h => {
                    const text = h.textContent.trim();
                    if (!text) {
                        h.remove();
                        return;
                    }

                    if (text.toLowerCase().includes('capítulo') || text.toLowerCase().includes('capitulo')) {
                        const h2 = document.createElement('h2');
                        h2.textContent = text;
                        h.parentNode.replaceChild(h2, h);

                        // Buscar el siguiente párrafo real y marcarlo para dropcap
                        let next = h2.nextElementSibling;
                        while (next && next.tagName !== 'P') {
                            next = next.nextElementSibling;
                        }
                        if (next && next.tagName === 'P' && next.textContent.trim()) {
                            next.classList.add('chapter-first-p');
                        }
                    } else {
                        // Subtítulo (Las Llamas del Destino, etc.)
                        const h2sub = document.createElement('h2');
                        h2sub.className = 'subtitle';
                        h2sub.textContent = text;
                        h.parentNode.replaceChild(h2sub, h);
                    }
                });

                // ───────────────────────────────────────────────
                // Limpieza agresiva del export de Google Docs
                // ───────────────────────────────────────────────
                tempDiv.querySelectorAll(
                    'h1.c2, .c2, .c8, .c11, p.c0.c11, p:empty, span:empty, div:empty, h1:empty, br'
                ).forEach(el => el.remove());

                // Quitar también cualquier párrafo o span que solo tenga el título/autor (ya lo tenemos arriba)
                tempDiv.querySelectorAll('h1.c4, span.c5, span.c14, span.c7, span.c13, span.c3').forEach(el => {
                    const t = el.textContent.trim().toLowerCase();
                    if (t.includes('errantes') || t.includes('kurghaimat') || t.includes('edvard') || t.includes('arangr')) {
                        let parent = el.closest('h1') || el.parentElement;
                        if (parent) parent.remove();
                    }
                });

                // Inyectar el contenido ya limpio
                contentDiv.innerHTML = tempDiv.innerHTML;
                loading.remove();

            } catch (err) {
                contentDiv.innerHTML = `<p style="color:#8b0000; text-align:center; font-size:1.4em; padding:100px 0;">
                    Error al cargar el documento: ${err.message}<br>
                    Asegúrate de que el archivo se llame exactamente <strong>LosErrantesdeKurghaimat.html</strong> y esté en la misma carpeta.
                </p>`;
            }
        });
    </script>
</body>
</html>
