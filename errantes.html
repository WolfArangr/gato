<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Errantes de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.75;
            margin: 0;
            padding: 20px;
            background-color: #f5e8c7;
        }
        #book {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.96);
            padding: 70px 80px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }
        #title-page {
            text-align: center;
            margin-bottom: 100px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5.4em;
            color: #8b0000;
            margin: 20px 0 10px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.7em;
            color: #3d2b1f;
            margin: 0 0 100px;
            border-bottom: 4px double #8b4513;
            padding-bottom: 30px;
        }
        h2.chapter-num {
            font-family: 'MedievalSharp', cursive;
            font-size: 3em;
            color: #b22222;
            text-align: center;
            margin: 110px 0 10px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 12px;
        }
        h2.chapter-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 3.0em;
            color: #4b2e1a;
            text-align: center;
            margin: 0 0 60px;
        }
        p {
            text-align: justify;
            hyphens: auto;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            text-indent: 3em;
            margin: 1.6em 0;
            font-size: 1.25em;
        }
        /* Drop cap */
        .chapter-first-p::first-letter {
            font-family: 'MedievalSharp', cursive !important;
            font-size: 4.0em !important;
            color: #8b0000 !important;
            float: left !important;
            margin: 0 6px 6px 0 !important;
            line-height: 0.3 !important;
            font-weight: bold !important;
        }
        hr {
            border: none;
            border-top: 3px double #8b4513;
            margin: 90px auto;
            width: 35%;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #444;
            padding: 180px 0;
            font-size: 1.5em;
        }
        /* Ocultar basura de Google Docs */
        .c1:empty, .c3, .c5, p.c1.c5, p:empty, span:empty, br:only-child,
        h1:not(.c7), h2:not([class*="chapter-"]), h3, h4, h5, h6 {
            display: none !important;
        }
        a.localidad-link {
            color: #4b2e1a;
            text-decoration: none;
            border-bottom: 1px dotted #8b4513;
            font-weight: 500;
            cursor: pointer;
        }
        a.localidad-link:hover {
            color: #8b0000;
            border-bottom: 1px solid #8b0000;
        }
        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            #book { padding: 35px 25px; border-width: 8px; max-width: 95%; box-shadow: inset 0 0 25px rgba(0,0,0,0.15); }
            h1.main-title { font-size: 3.8em; margin: 15px 0 8px; }
            h1.author { font-size: 2.1em; margin-bottom: 60px; padding-bottom: 20px; }
            h2.chapter-num { font-size: 2.4em; margin: 70px 0 8px; }
            h2.chapter-title { font-size: 2.0em; margin-bottom: 40px; }
            p { font-size: 1.15em; text-indent: 2.2em; margin: 1.4em 0; }
            .chapter-first-p::first-letter { font-size: 4.0em !important; margin: 0 12px 6px 0 !important; line-height: 0.6 !important; }
            hr { width: 50%; margin: 60px auto; }
        }
        @media (max-width: 480px) {
            #book { padding: 25px 18px; }
            h1.main-title { font-size: 3.2em; }
            h1.author { font-size: 1.9em; }
            h2.chapter-num { font-size: 2.1em; }
            h2.chapter-title { font-size: 1.8em; }
            p { font-size: 1.08em; text-indent: 2em; }
            .chapter-first-p::first-letter { font-size: 3.5em !important; margin: 0 10px 5px 0 !important; }
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Los Errantes de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>
        <div id="content">
            <div id="loading">Cargando la crónica...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                // 1. Cargar y parsear el archivo
                const response = await fetch('LosErrantesdeKurghaimat.html');
                if (!response.ok) throw new Error('Archivo no encontrado');
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = doc.body.innerHTML;

                // 2. Procesar encabezados de capítulo (ahora con la clase correcta)
                const chapterHeaders = tempDiv.querySelectorAll('h1.c7');
                chapterHeaders.forEach(header => {
                    const span = header.querySelector('span.c4');
                    let text = span ? span.textContent.trim() : header.textContent.trim();
                    if (!text) {
                        header.remove();
                        return;
                    }

                    let chapterNum = '';
                    let chapterSub = '';

                    if (text.includes(' - ')) {
                        [chapterNum, chapterSub] = text.split(' - ');
                        chapterNum = chapterNum.trim();
                        chapterSub = chapterSub.trim();
                    } else if (text.match(/Capítulo [IVXLCDM]+/i)) {
                        const match = text.match(/(Capítulo [IVXLCDM]+)/i);
                        chapterNum = match ? match[1] : text.trim();
                        chapterSub = text.replace(/Capítulo [IVXLCDM]+/i, '').trim();
                    } else {
                        chapterNum = text;
                    }

                    const h2Num = document.createElement('h2');
                    h2Num.className = 'chapter-num';
                    h2Num.textContent = chapterNum;
                    header.parentNode.insertBefore(h2Num, header);

                    if (chapterSub) {
                        const h2Sub = document.createElement('h2');
                        h2Sub.className = 'chapter-title';
                        h2Sub.textContent = chapterSub;
                        header.parentNode.insertBefore(h2Sub, header.nextSibling);
                    }

                    header.remove();
                });

                // 3. Marcar primer párrafo después de cada capítulo para drop cap
                const chapters = tempDiv.querySelectorAll('h2.chapter-num');
                chapters.forEach(chapter => {
                    let next = chapter.nextElementSibling;
                    while (next) {
                        if (next.tagName === 'P' && next.textContent.trim()) {
                            next.classList.add('chapter-first-p');
                            // Intentar extraer letra inicial si está en span
                            const firstSpan = next.querySelector('span.c0:first-child');
                            if (firstSpan && firstSpan.textContent.trim().length === 1) {
                                const letter = firstSpan.textContent;
                                firstSpan.remove();
                                next.insertBefore(document.createTextNode(letter), next.firstChild);
                            }
                            break;
                        }
                        next = next.nextElementSibling;
                    }
                });

                // 4. Limpieza agresiva de elementos vacíos y basura
                tempDiv.querySelectorAll('p.c1:empty, p:empty, .c1.c5, .c3, .c5, span:empty, br:only-child').forEach(el => el.remove());

                // 5. Insertar contenido limpio
                contentDiv.innerHTML = tempDiv.innerHTML;
                if (loading) loading.remove();

                // 6. (Opcional) Procesamiento de links a localidades - se mantiene igual
                // ... aquí iría tu código original de localidades si lo quieres conservar ...

            } catch (err) {
                contentDiv.innerHTML = `<p style="color:#b22222; text-align:center; font-size:1.5em; padding:180px 0;">
                    Error: ${err.message}<br>Asegúrate de que el archivo se llame exactamente "LosErrantesdeKurghaimat.html"
                </p>`;
                if (loading) loading.remove();
            }
        });
    </script>
</body>
</html>
