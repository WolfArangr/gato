<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Errantes de Kurghaimat</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('parchment.jpg') repeat fixed;
            font-family: 'EB Garamond', serif;
            color: #2c1b0f;
            line-height: 1.7;
            margin: 0;
            padding: 30px;
            background-color: #f5e8c7;
        }
        #book {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(245, 232, 199, 0.94);
            padding: 60px 70px;
            border: 12px solid #6b4c2e;
            border-image: url('border-medieval.png') 30 round;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.25), 0 0 30px rgba(0,0,0,0.35);
        }
        #title-page {
            text-align: center;
            margin-bottom: 90px;
        }
        h1.main-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 5em;
            color: #8b0000;
            margin: 30px 0 15px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
        }
        h1.author {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5em;
            color: #3d2b1f;
            margin: 0 0 80px;
            border-bottom: 4px double #8b4513;
            padding-bottom: 25px;
        }
        h2.chapter-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.6em;
            color: #b22222;
            text-align: center;
            margin: 90px 0 10px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 12px;
        }
        h2.chapter-subtitle {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.1em;
            color: #4b2e1a;
            text-align: center;
            margin: -5px 0 50px;
        }
        p {
            text-indent: 2.8em;
            margin: 1.4em 0;
            font-size: 1.2em;
        }
        /* Drop cap fuerte y solo en primer párrafo de capítulo */
        .chapter-first-p {
            margin-top: 0.4em !important;
        }
        .chapter-first-p::first-letter {
            font-family: 'MedievalSharp', cursive;
            font-size: 4.5em;
            color: #8b0000;
            float: left;
            margin: 0 12px 0 0;
            line-height: 0.65;
            font-weight: bold;
        }
        /* Eliminar cualquier formato inline que rompa el dropcap */
        .chapter-first-p span[style*="font-size"] {
            font-size: inherit !important;
        }
        hr {
            border: none;
            border-top: 3px double #8b4513;
            margin: 70px auto;
            width: 45%;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #555;
            padding: 140px 0;
            font-size: 1.4em;
        }
        /* Ocultar elementos basura del export */
        .c2, .c8, .c11, h1.c2, p.c0.c11, p:empty, span:empty, div:empty, h1:empty, br:only-child {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="book">
        <div id="title-page">
            <h1 class="main-title">Los Errantes de Kurghaimat</h1>
            <h1 class="author">Edvard Arangr</h1>
        </div>
        <div id="content">
            <div id="loading">Cargando la crónica...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('LosErrantesdeKurghaimat.html');
                if (!response.ok) throw new Error('Archivo no encontrado: LosErrantesdeKurghaimat.html');
                const html = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = doc.body.innerHTML;

                // Procesar encabezados de capítulo
                const headers = tempDiv.querySelectorAll('h1.c4');
                let previousWasChapter = false;

                headers.forEach(h => {
                    const text = h.textContent.trim();
                    if (!text) {
                        h.remove();
                        return;
                    }

                    if (text.toLowerCase().includes('capítulo') || text.toLowerCase().includes('capitulo')) {
                        const h2 = document.createElement('h2');
                        h2.className = 'chapter-title';
                        h2.textContent = text;
                        h.parentNode.replaceChild(h2, h);
                        previousWasChapter = true;
                    } else if (previousWasChapter) {
                        // El siguiente después de "Capítulo I" suele ser el subtítulo
                        const h2sub = document.createElement('h2');
                        h2sub.className = 'chapter-subtitle';
                        h2sub.textContent = text;
                        h.parentNode.replaceChild(h2sub, h);
                        previousWasChapter = false;

                        // Marcar el siguiente párrafo para dropcap
                        let next = h2sub.nextElementSibling;
                        while (next && next.tagName !== 'P') {
                            next = next.nextElementSibling;
                        }
                        if (next && next.tagName === 'P' && next.textContent.trim()) {
                            next.classList.add('chapter-first-p');
                            // Mover la primera letra fuera de spans raros si es necesario
                            if (next.firstChild && next.firstChild.tagName === 'SPAN') {
                                const span = next.firstChild;
                                if (span.textContent.trim().length === 1) {
                                    const letter = span.textContent;
                                    span.remove();
                                    next.innerHTML = letter + next.innerHTML;
                                }
                            }
                        }
                    } else {
                        // Otros encabezados raros → ignorar o convertir a subtítulo
                        const h2sub = document.createElement('h2');
                        h2sub.className = 'chapter-subtitle';
                        h2sub.textContent = text;
                        h.parentNode.replaceChild(h2sub, h);
                    }
                });

                // Limpieza final muy agresiva
                tempDiv.querySelectorAll(
                    'h1.c2, .c2, .c8, .c11, p.c0.c11, p:empty, span:empty, div:empty, h1:empty, br'
                ).forEach(el => el.remove());

                // Eliminar cualquier resto de título/autor que se cuele
                tempDiv.querySelectorAll('span.c5, span.c14, span.c13, span.c7, span.c3').forEach(el => {
                    const t = el.textContent.trim().toLowerCase();
                    if (t.includes('errantes') || t.includes('kurghaimat') || t.includes('edvard') || !t) {
                        let parent = el.closest('h1') || el.parentElement;
                        if (parent) parent.remove();
                    }
                });

                contentDiv.innerHTML = tempDiv.innerHTML;
                loading.remove();

            } catch (err) {
                contentDiv.innerHTML = `<p style="color:#8b0000; text-align:center; font-size:1.4em; padding:140px 0;">
                    Error: ${err.message}<br>Comprueba que el archivo se llame exactamente <strong>LosErrantesdeKurghaimat.html</strong>
                </p>`;
            }
        });
    </script>
</body>
</html>
